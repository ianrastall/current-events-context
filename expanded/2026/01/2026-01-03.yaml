    importance: 8
    headline: "Myanmar military-backed party leads early election results"
    summary: >
      Early results from Myanmar's first national election process since the 2021 coup
      showed the military-backed Union Solidarity and Development Party leading by a
      wide margin. Reuters reported partial results from 56 constituencies and said the
      USDP had won 38 of 40 lower-house seats tallied at that point, with the junta
      reporting first-phase turnout of 52%. AP reported that the military-appointed
      election body began announcing winners and that the military-backed party was
      winning most declared seats in a multi-phase vote criticized by the UN and rights
      groups and conducted without key opposition forces.
    key_data:
      - label: "Lower-house seats cited by Reuters"
        value: "USDP won 38 of 40 tallied seats"
        citation_refs: [13]
      - label: "First-phase turnout reported by junta"
        value: "52%"
        citation_refs: [13]
      - label: "Election structure"
        value: "Multi-phase vote under military-appointed election body"
        citation_refs: [14]
    details:
      what_happened:
        - "Reuters reported partial results from 56 constituencies, with the USDP winning the overwhelming majority of lower-house seats tallied."
        - "The junta reported 52% turnout in the first phase."
        - "AP reported Myanmar's military-appointed election body began announcing winners from the first phase."
        - "Reuters noted that opposition parties were not running and that criticism of the polls had been criminalized."
