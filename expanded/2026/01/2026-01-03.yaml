    headline: "Post-quake assessments report widespread damage in Guerrero"
    summary: >
      Following the magnitude 6.5 earthquake near San Marcos, Guerrero on January 2,
      Mexican authorities and media reported on January 3 that at least 24 Guerrero
      municipalities had registered impacts and that damage evaluation continued.
      La Jornada reported more than 1,400 aftershocks by the morning of January 3,
      while earlier AP reporting said the earthquake killed at least two people and
      produced impacts including landslides and hospital disruption in Chilpancingo.
