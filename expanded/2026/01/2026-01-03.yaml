        - "Swiss authorities opened criminal proceedings into the managers of the Crans-Montana bar where the New Year's fire occurred."
        - "Investigators said they believed sparklers or sparkling candles on Champagne bottles likely ignited the fire when they came too close to the ceiling."
        - "Reporting cited 40 deaths and more than 100 injuries."
        - "Victim identification and family notification were still ongoing."
      why_it_matters:
