        citation_refs: [7, 9]
      - label: "Restoration estimate"
        value: "Until January 8, per Reuters"
        citation_refs: [7]
    details:
      what_happened:
        - "A fire early January 3 damaged several high-voltage cables at or near a bridge crossing the Teltow Canal in south-west Berlin."
        - "Police investigated the incident as suspected arson."
        - "Stromnetz Berlin said the outage could leave up to 45,000 households without electricity until January 8."
        - "Reuters reported that about 2,200 commercial entities were affected and that mobile and landline services could also face disruption."
      why_it_matters:
        - "A prolonged winter outage can create health, heating, communications, and logistics risks."
        - "The incident shows how limited physical damage at cable chokepoints can create large-scale urban disruption."
        - "Follow-up reporting framed the case as a policy prompt for critical-infrastructure security and public technical transparency."
