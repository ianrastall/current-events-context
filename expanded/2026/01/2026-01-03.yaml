    importance: 10
    headline: "U.S. captures Nicolás Maduro during strikes around Caracas"
    summary: >
      On January 3, 2026, the United States announced that it had captured Venezuelan
      President Nicolás Maduro in a military operation and flown him out of Venezuela.
      The Associated Press reported that President Donald Trump said the United States
      would temporarily "run" Venezuela and seek access to the country's oil reserves,
      while Reuters reported explosions in Caracas and outages in parts of the capital.
      The Wikipedia portal also described U.S. airstrikes around Caracas that killed at
      least 40 people, footage of Marine Corps AH-1Z Vipers striking Fort Tiuna and
      Generalissimo Francisco de Miranda Air Base, the capture of Maduro and Cilia
      Flores, Delcy Rodríguez becoming acting president, and Maduro later being taken
      to New York for indictment on drug and weapons charges.
