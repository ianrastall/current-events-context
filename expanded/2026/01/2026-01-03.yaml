    summary: >
      Swiss authorities intensified accountability steps after the deadly New Year's
      fire at Le Constellation in Crans-Montana. Reuters reported that prosecutors
      placed the two managers under criminal investigation, while AP and PBS reported
      that authorities believed sparklers on Champagne bottles likely ignited the fire
      after coming too close to the ceiling. Reporting cited 40 deaths and more than
      100 injuries as victim identification and family notification continued.
