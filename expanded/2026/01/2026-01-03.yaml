        citation_refs: [1, 3]
    details:
      what_happened:
        - "U.S. officials said Nicolás Maduro was captured and flown out of Venezuela in an operation carried out early on January 3."
        - "Donald Trump said the United States would temporarily run Venezuela after Maduro's capture and referenced tapping Venezuelan oil reserves."
        - "Reuters reported explosions in Caracas and that at least one area was without electricity amid the events."
        - "The portal described U.S. airstrikes around Caracas, footage of AH-1Z Viper strikes on Fort Tiuna and Generalissimo Francisco de Miranda Air Base, and later evacuation of Fort Tiuna."
        - "The portal reported that Maduro and Cilia Flores were captured, Delcy Rodríguez became acting president, and Maduro was later taken from the USS Iwo Jima to New York after indictment on drug and weapons charges."
      why_it_matters:
        - "A U.S. operation that removes and detains a sitting head of state represents a major escalation with implications for international law, hemispheric diplomacy, and precedent-setting U.S. behavior."
        - "The claim that the United States would temporarily run Venezuela signaled an uncertain sovereignty and governance situation with potential effects on regional security and energy markets."
        - "Reported explosions, power disruption, and mass casualties point to immediate civilian and infrastructure instability during the intervention."
