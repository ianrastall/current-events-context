    importance: 7
    headline: "Suspected arson damages Berlin high-voltage cables"
    summary: >
      A January 3 fire on a bridge across Berlin's Teltow Canal damaged multiple
      high-voltage cables near a local heat-and-power station area, causing a major
      outage in south Berlin. Reuters reported that up to 45,000 households and
      around 2,200 commercial entities could be affected, with power potentially out
      until January 8 and possible disruption to mobile and landline services. Later
      reporting described the incident as a significant arson-linked blackout that
      renewed debate over protection of critical energy infrastructure.
