      dozens of sanitation workers. By Jan 10, four workers were confirmed dead and many
      remained missing. Heavy machinery and rescue crews have been painstakingly digging
      through tons of compacted trash to find survivors. Officials warned of the danger of
      further collapses as rains and unstable waste piles hampered operations.
    key_data: []
