      between Syrian government forces and Kurdish-led SDF fighters. The Syrian government
      said a suspected SDF drone hit the facility during a news conference, blackening its
      upper floors. A U.N.-linked report later said the strike caused material damage but no
      casualties. The government and the SDF traded blame for the incident.
