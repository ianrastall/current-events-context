        - "At ~17:30 GMT on Jan 10, U.S. and allied aircraft struck dozens of ISIS targets across Syria."
        - "The operation, named Hawkeye Strike, was launched days after an ISIS ambush in Palmyra killed U.S. personnel."
        - "U.S. Central Command said “multiple strikes” were carried out “against ISIS throughout Syria”."
        - "Jordan’s air force also participated; combined forces used dozens of aircraft and munitions to hit command centers, training grounds, and depots."
