    summary: >
      On Jan 10, U.S. Central Command announced large-scale airstrikes across eastern Syria
      targeting Islamic State (ISIS) facilities. The strikes – the latest in a months-long
      campaign called “Hawkeye Strike” – were ordered in retaliation for a December ambush
      in Palmyra that killed two U.S. soldiers and an interpreter. A U.S. statement said
      multiple ISIS targets were hit across Syria. The Pentagon noted the strikes were
      conducted “with partner forces” (Jordan took part). U.S. officials gave no casualty
      figures.
    key_data: []
