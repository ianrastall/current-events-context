        - "Rescue efforts continued for days; Cebu’s mayor confirmed 4 deaths and 36 people unaccounted for by Jan 10."
        - "Dozens were rescued alive (about 12 hospitalized). Rescuers faced shifting ground and called in cranes for safety."
