    headline: "U.S. forces capture Venezuela’s President Nicolás Maduro"
    summary: >
      On Jan 3, a covert U.S. military operation in Venezuela resulted in the capture of
      President Nicolás Maduro. U.S. troops reportedly used special operations and air
      strikes to disable key targets (cutting power in parts of Caracas) and seized Maduro
      in his own safe house. He was then transported by plane to New York to face U.S.
      drug-trafficking charges. President Trump later said the U.S. would “run” Venezuela
      until it transitions to democracy.
    key_data: []
    details:
      what_happened:
        - "In a pre-dawn raid, U.S. forces hit multiple military and government sites in Caracas and seized Maduro in a safe house."
        - "The operation knocked out electricity to parts of the city and involved numerous air strikes on roads and communication towers."
        - "Maduro was flown out of the country aboard a U.S. military plane to New York; the Justice Department confirmed he will face court on narcoterrorism charges."
        - "President Trump publicly discussed the raid, saying “we captured President Maduro… we will administer Venezuela until we have a safe and orderly transition”."
      why_it_matters:
        - "A dramatic breach of sovereignty and international law, with the U.S. directly overthrowing an allied government."
        - "Deeply impacts Latin American geopolitics, likely provoking regional instability and reactions from governments allied to Maduro (e.g. Cuba, Russia)."
        - "Raises global concerns over U.S. precedent in regime change and the future of Venezuela’s oil industry under new administration."
