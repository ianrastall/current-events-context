    headline: "United States Proposes Trilateral Security Pact and Economic Zone to Israel and Syria"
    summary: >
      Operating outside traditional diplomatic channels, the United States government,
      represented by special envoys Tom Barrack, Steve Witkoff, and Jared Kushner, presented
      a highly novel security pact proposal to the governments of Israel and Syria aimed at
      stabilizing their violently contested shared border. The proposal hinges on the
      creation of a massive joint economic zone spanning both sides of the border, which
      would feature heavy commercial investments including agricultural development, wind
      farms, and a luxury ski resort integrated with the local Druze community. To enforce
      and monitor this unprecedented arrangement, the U.S. proposed the establishment of a
      joint U.S.-Israeli-Syrian "fusion cell" headquartered in Amman, Jordan, to oversee
      Southern Syrian demilitarization and facilitate the eventual, phased withdrawal of
      Israeli forces from the territory.
    key_data: []
    details:
