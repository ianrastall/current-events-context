    importance: 7
    headline: "Saudi-Led Coalition Bombs STC Positions in Southern Yemen Following Political Rupture"
    summary: >
      The fragile geopolitical alignment in Yemen suffered a dramatic and violent fracture
      as Saudi-led coalition aircraft launched a series of aggressive airstrikes against
      positions held by the Southern Transitional Council (STC) in the Dhale and Hadhramaut
      governorates. This severe military escalation coincided with a sudden political
      rupture within the anti-Houthi coalition; STC leader Aidarus al-Zoubaidi was formally
      dismissed from the Presidential Leadership Council and referred to prosecutors for
      high treason after failing to board a scheduled flight for peace negotiations in
      Riyadh. The bombings resulted in collateral civilian casualties, striking near local
      medical facilities, and marked the disastrous transition of a localized political
      dispute into active, kinetic warfare among former allies who had previously united
      against Houthi forces.
    key_data: []
    details:
      what_happened:
        - "Saudi-led coalition aircraft executed multiple precision and area strikes against STC positions in the Dhale governorate and hit a military camp in al-Khasah, as well as bases in Seiyun, Hadhramaut."
        - "Medical staff at the al-Nasr and al-Tadamon hospitals recorded at least four civilian deaths and six wounded as a direct result of the air operations impacting civilian infrastructure."
        - "Aidarus al-Zoubaidi, head of the STC, was officially removed from the Presidential Leadership Council on charges of high treason after disappearing before a flight to Riyadh."
        - "The Saudi-backed governor of Hadhramout, Salem al-Khanbashi, publicly announced the launch of an operation to forcefully reclaim military positions previously seized by STC fighters."
      why_it_matters:
        - "The use of direct aerial bombardment against the STC signals the absolute collapse of the Riyadh Agreement framework and the permanent fracturing of the unified front against Houthi forces in Yemen."
        - "Civilian casualties in southern hospitals risk deeply radicalizing the southern secessionist movement, turning local populations overtly hostile toward Saudi Arabia and complicating any future mediation."
        - "The collapse of the coalition opens a massive strategic vulnerability in southern Yemen, potentially allowing Houthi forces or extremist elements to exploit the infighting to expand their territorial control."
      uncertainty_notes:
        - "Killed figure is reported as a range or disputed: 4 to 7 (including civilians)"
        - "Injured figure is reported as a range or disputed: 6 to 20+"
