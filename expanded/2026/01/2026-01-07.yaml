    headline: "Delcy Rodriguez Sworn in as Interim Venezuelan President, Agrees to US Oil Transfer"
    summary: >
      Following the dramatic capture of President Nicolas Maduro in a kinetic U.S. military
      operation over the preceding weekend, Venezuela's Vice President and Oil Minister,
      Delcy Rodriguez, was formally sworn in as the nation's interim president, signaling a
      rapid consolidation of power. Immediately assuming control, Rodriguez's interim
      authority brokered a major concessionary agreement with the Trump administration to
      transfer between 30 and 50 million barrels of high-quality, previously sanctioned
      crude oil directly to the United States. U.S. Energy Secretary Chris Wright was tasked
      with executing the logistics, while the U.S. corporation Chevron chartered a fleet of
      at least 11 tankers to load the crude from the Venezuelan ports of Jose and Bajo
      Grande destined for American refineries.
    key_data: []
    details:
      what_happened:
        - "Delcy Rodriguez took the formal oath of office as interim president following the forcible removal of Nicolas Maduro and his wife, Cilia Flores, by U.S. forces."
        - "The new Venezuelan authority agreed to supply 30 to 50 million barrels of oil to the U.S., which will be sold at market price."
        - "President Trump decreed that the generated funds from the oil sale will be controlled directly by the U.S. President."
        - "Chevron immediately mobilized a fleet of 11 tankers to load heavy crude from the Venezuelan ports of Jose and Bajo Grande."
        - "Official reports confirmed that seven U.S. service members were injured during the weekend military operation that initially captured Maduro."
      why_it_matters:
        - "The seamless transition of power to Rodriguez and her immediate capitulation to U.S. energy demands indicates a rapidly orchestrated, U.S.-backed regime stabilization designed to secure vital resources."
        - "The massive influx of Venezuelan heavy crude into U.S. markets provides the Trump administration with substantial, direct leverage over global oil supplies, pricing, and broader geopolitical energy dependencies."
