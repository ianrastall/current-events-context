  - id: "evt-2026-01-09-003"
    category: "Armed conflicts and attacks"
    subcategory: "Airstrikes"
    topics:
      - "Airstrikes"
      - "Iran"
    importance: 6
    headline: "Israel Strikes Critical Russian-Iranian Smuggling Hub in the Caspian Sea"
    summary: >
      Expanding the geographic scope of its military operations, Israel executed a highly
      strategic strike against Iranian naval infrastructure at the Bandar-e Anzali port,
      situated on the coast of the Caspian Sea. The targeted infrastructure served as a
      vital node in a clandestine Russian-Iranian smuggling route linking the ports of both
      nations, facilitating the illicit exchange of weapons, ammunition, oil, foodstuffs,
      and crucially, the transfer of Iranian-manufactured Shahed drones. These loitering
      munitions, now co-produced by both states, have been extensively utilized by the
      Russian military to bombard Ukrainian urban centers and by Tehran to target energy
      facilities and U.S. installations across the Persian Gulf. By striking deep into the
      Caspian basin—an area traditionally viewed as a secure interior waterway for Russian
      and Iranian transit—Israel aims to severely degrade the logistical capabilities of the
      emerging Moscow-Tehran military axis and publicly demonstrate its reach against
      adversarial supply chains.
    key_data: []
    details:
      what_happened:
        - "Israeli military forces launched a precision strike targeting Iranian naval infrastructure located at the Bandar-e Anzali port on the Caspian Sea."
        - "The strike explicitly targeted a primary maritime smuggling route connecting Russia and Iran, which is heavily utilized to circumvent international sanctions."
        - "The targeted supply chain was responsible for the continuous transfer of Shahed drones, traditional weapons, ammunition, oil, and foodstuffs between the two nations."
      why_it_matters:
        - "The operation represents a profound geographical expansion of Israeli military reach, effectively projecting kinetic power into the highly secure and traditionally insulated Caspian Sea basin."
        - "By actively degrading the logistical pipeline supplying Shahed drones to the Russian Federation, the strike inextricably links Israeli security imperatives with the operational dynamics of the ongoing Russo-Ukrainian war."
      uncertainty_notes: []
