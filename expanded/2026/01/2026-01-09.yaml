    importance: 5
    headline: "Explosive Device Targets Conservative Lawmaker in Honduran National Congress"
    summary: >
      The deeply volatile political transition in Honduras deteriorated into direct physical
      violence when an unidentified assailant hurled a homemade explosive device into an
      outdoor hallway of the National Congress building in Tegucigalpa, directly injuring
      conservative National Party lawmaker Gladis Aurora López. The device detonated mere
      centimeters from López while she was conducting a news briefing, inflicting visible
      shrapnel wounds and bleeding to her back. This targeted attack occurs in a climate of
      extreme institutional mistrust following the highly disputed November 2025
      presidential election; the National Party has openly denounced the blast as an act of
      political terrorism and accused affiliates of the ruling Liberty and Refoundation
      (LIBRE) Party of orchestrating the violence to intimidate democratic institutions. The
      explosion occurred specifically as lawmakers convened to consider a LIBRE proposal to
      mandate an election recount, further destabilizing the path toward the inauguration of
      President-elect Nasry Asfura.
    key_data: []
    details:
      what_happened:
        - "A homemade explosive device was forcefully thrown into an area where conservative National Party lawmakers were convening at the National Congress building in Tegucigalpa."
        - "Deputy Gladis Aurora López sustained physical shrapnel wounds and bleeding to her back as the device detonated while she was speaking to reporters."
        - "The National Party formally condemned the attack as a deliberate act of political violence designed to physically intimidate democratic institutions and lawmakers."
        - "The attack occurred precisely while lawmakers were scheduled to consider a highly contentious proposal from the LIBRE party to recount the contested November 30 presidential election results."
      why_it_matters:
        - "Signals a highly dangerous escalation from procedural electoral dispute to targeted, kinetic physical violence against elected legislative officials in Central America."
        - "Heightens fears of widespread civic destabilization and violent protests as the nation approaches a deeply tense presidential transition involving President-elect Nasry Asfura."
      uncertainty_notes: []
