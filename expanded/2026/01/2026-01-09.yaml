    headline: "Storm Goretti Causes Widespread Devastation and Fatalities Across Northern Europe"
    summary: >
      Storm Goretti, a rapidly intensifying extratropical cyclone, battered Northern Europe
      with catastrophic force, unleashing destructive winds and heavy snowfall that resulted
      in massive infrastructure failure and at least two fatalities in the United Kingdom.
      Deepening to a central pressure of 947 hPa over the Atlantic, the storm generated
      phenomenal wind gusts reaching up to 132 mph in Barfleur, France, and 100 mph in the
      UK, prompting meteorological agencies to issue rare red wind warnings and triggering
      the temporary closure of several major regional airports and cross-channel ferry
      services. The severe weather system completely overwhelmed utility grids, knocking out
      electricity for nearly half a million customers—including 380,000 households in France
      alone—while downed trees and airborne debris caused catastrophic property damage, rail
      blockages, and transport gridlock across Cornwall and the Channel Islands.
    key_data: []
    details:
      what_happened:
        - "Storm Goretti crossed the Atlantic and violently impacted Western Europe, with central pressure dropping to 947 hPa and recording peak wind gusts of 132 mph at Barfleur, France."
        - "At least two individuals in England and Wales were killed by falling trees, including a fatal incident in Helston where a massive tree crushed a residential caravan."
        - "Power outages affected approximately 500,000 customers across Europe, including 380,000 households in France that were left without electricity on the morning of January 9.23"
        - "The storm brought up to 30 cm of snow to northern England and Scotland, shutting down over 250 schools and forcing the suspension of runway operations at Birmingham, Bristol, and East Midlands airports."
      why_it_matters:
        - "Demonstrates the acute vulnerability of European power and transport infrastructure to rapidly intensifying, multi-hazard winter storm systems exacerbated by shifting atmospheric patterns."
        - "Resulted in massive regional economic disruptions due to paused maritime shipping, blocked railways, widespread commercial closures, and extensive structural damage to historical and civic properties."
