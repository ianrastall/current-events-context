    headline: "Fatal Shark Attack Claims Life of American Tourist in the U.S. Virgin Islands"
    summary: >
      A 56-year-old tourist from Minnesota, Arlene Lillis, was killed in a gruesome and
      fatal shark attack while swimming off Dorsch Beach on the island of St. Croix in the
      U.S. Virgin Islands. Horrified witnesses reported seeing the massive animal with the
      victim's body in its mouth late in the afternoon on January 8; emergency responders
      arrived rapidly to find Lillis had suffered the traumatic amputation of an arm.
      Despite immediate, heroic intervention by bystanders and arriving medical personnel,
      she succumbed to her catastrophic injuries shortly after arriving at a local hospital.
      This horrifying event marks the second fatal shark attack in the territory in less
      than a month, sparking immense concern over local maritime safety.
    key_data: []
    details:
      what_happened:
        - "Arlene Lillis, 56, was violently attacked by a shark while swimming relatively close to shore at Dorsch Beach on St. Croix."
        - "Emergency services were dispatched at approximately 4:30 p.m. after witnesses reported the attack and spotted the shark with the victim."
        - "The victim suffered the complete traumatic loss of an arm and was transported to a local hospital where she was pronounced dead."
        - "Local marine units and St. Croix Rescue immediately launched an investigation and maritime search following the incident."
      why_it_matters:
        - "The high frequency of recent fatal attacks—two in less than a month—poses a severe, immediate threat to the local tourism economy, which is heavily reliant on safe marine recreation."
