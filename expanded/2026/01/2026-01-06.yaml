    headline: "U.S. Representative Doug LaMalfa Dies During Emergency Surgery"
    summary: >
      U.S. Representative Doug LaMalfa (R-Calif.), a seven-term congressman and staunch
      conservative ally of President Donald Trump, passed away at the age of 65 on January
      6, 2026, following a sudden medical emergency at his home. LaMalfa died during an
      emergency surgical procedure at a local hospital in Chico, California. His unexpected
      death immediately alters the partisan calculus in Washington, trimming the Republican
      Party's already razor-thin majority in the House of Representatives to 218-213.69
      Under California law, Governor Gavin Newsom is required to call a special election
      within 14 days to fill the vacancy, setting the stage for a convoluted electoral
      battle as the state transitions to newly redrawn congressional district maps for the
      November midterms.
    key_data: []
    details:
      what_happened:
        - "Representative Doug LaMalfa experienced a severe medical emergency at his home on Monday night and died during emergency surgery on Tuesday, January 6, 2026.68"
        - "His passing reduced the Republican majority in the U.S. House of Representatives to a fragile 218 seats against 213 Democratic seats."
