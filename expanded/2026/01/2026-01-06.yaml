    importance: 7
    headline: "Civil Society Accuses Mozambican Police of Massacring 38 Artisanal Miners"
    summary: >
      A severe crisis of state legitimacy emerged in early January 2026 following violent
      clashes in the Marraca mining area of Mozambique's Mogovolas district on December
      28-29, 2025.27 Local civil society organizations, spearheaded by the NGO Kóxukhoro,
      allege that heavily armed police indiscriminately fired upon artisanal gold and
      gemstone miners, massacring at least 38 people to protect elite, illicit economic
      interests after a local bribery extortion system collapsed. In stark contrast, the
      Police of the Republic of Mozambique (PRM) officially maintain that only seven
      individuals died—including one police officer—and assert that their camp was assaulted
      by the Naparamas militia and armed supporters of the political opposition. Human
      Rights Watch has demanded an urgent, impartial investigation into the disproportionate
      use of lethal force.
    key_data: []
    details:
      what_happened:
        - "The NGO Kóxukhoro reported that police fired indiscriminately on artisanal miners, resulting in at least 38 deaths, 13 injuries, and the destruction of property including 27 motorcycles."
        - "The PRM claimed the violence was an organized assault on a police camp by the Naparamas militia and opposition supporters, reporting only 7 total deaths and 5 arrests."
        - "Human Rights Watch and local journalists reported that police utilized unnecessary lethal force, firing into crowds of civilians, including women and children, regardless of political affiliation."
        - "Relatives of the victims reported family members disappearing after seeking medical treatment in local hospitals following the clashes."
      why_it_matters:
        - "The conflicting narratives highlight systemic corruption within Mozambique's security apparatus and a complete failure to regulate the informal mining sector, substituting dialogue with state-sponsored violence."
        - "The massacre risks further destabilizing northern Mozambique, alienating rural populations and potentially driving them toward insurgent groups in a region already grappling with the Islamic State Mozambique (ISM) threat."
