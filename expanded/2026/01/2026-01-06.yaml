    headline: "Five Farmers Killed in Suspected Herder Attack in Benue State, Nigeria"
    summary: >
      The lethal intersection of climate-induced resource scarcity and ethnic polarization
      manifested violently on January 6, 2026, when armed Fulani herders attacked the Udeku
      Maav-Ya village in the Kwande Local Government Area of Benue State, Nigeria. The
      attackers targeted agricultural workers, shooting and killing five Christian farmers
      as they tended to their fields. Local government officials confirmed the assault,
      noting it as part of a persistent and escalating pattern of violence by armed herdsmen
      against sedentary farming communities across Nigeria's Middle Belt. The attack
      occurred concurrently with other deadly assaults in the state, demonstrating the total
      collapse of rural security frameworks despite regional bans on open livestock grazing.
    key_data: []
    details:
      what_happened:
        - "Armed Fulani herdsmen ambushed farmers working in the fields of Udeku Maav-Ya village at approximately 4:00 p.m. on January 6.32"
        - "Five Christian farmers were shot and killed during the unprovoked assault."
        - "The Chairman of the Kwande Local Government Council publicly confirmed the deaths and condemned the persistent attacks on predominantly Christian villages in the area."
        - "The incident followed a separate attack in Otukpo County the previous day, where herders shot and killed four sleeping residents."
      why_it_matters:
        - "The sustained inter-communal violence highlights the acute failure of state and federal security mechanisms to disarm militias and protect vulnerable rural populations."
        - "The targeted destruction of farming communities threatens severe regional food insecurity and accelerates mass internal displacement within Nigeria's critical agricultural heartland."
