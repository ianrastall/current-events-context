    importance: 5
    headline: "Philippine Authorities Raise Mayon Volcano Alert Level to 3"
    summary: >
      In response to rapidly escalating geothermal volatility, the Philippine Institute of
      Volcanology and Seismology (PHIVOLCS) raised the alert status for the Mayon Volcano to
      Level 3 on January 6, 2026, warning of an "increased tendency towards a hazardous
      eruption". The escalation was prompted by observable signs of magma intrusion, the
      magmatic eruption of a summit lava dome, and the imminent threat of lethal pyroclastic
      density currents. Acting swiftly on the scientific advisory, local authorities
      initiated emergency civil defense protocols, mandating the immediate evacuation of
      nearly 3,000 villagers from the six-kilometer Permanent Danger Zone (PDZ) located on
      the volcano's foothills to prevent mass casualties.
    key_data: []
    details:
      what_happened:
        - "PHIVOLCS officially raised the alert level from Level 2 to Level 3, signaling potential explosive activity within days or weeks."
