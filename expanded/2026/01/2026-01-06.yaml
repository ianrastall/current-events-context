strategic_conclusion: >
  The day's record is dominated by the aftermath of the U.S. capture of Nicolás Maduro, with
  Venezuela confirming military deaths among the 80 killed and the interim government under
  Delcy Rodríguez consolidating, while U.S. statements on Greenland drew a coordinated
  European rejection. Beijing's dual-use export controls on Japan extended the China–Japan
  diplomatic crisis into trade. Elsewhere, deadly violence continued in Nigeria's Benue and
  Oyo states and in Aleppo between Syrian government forces and the SDF, and road crashes in
  Ethiopia and Kenya caused mass casualties. Regulators in Ireland and the United Kingdom
  opened contacts with X over sexualised images generated by its Grok chatbot.

