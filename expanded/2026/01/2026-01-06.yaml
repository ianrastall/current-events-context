        - "The Cambodian military contacted Thai authorities, asserting there was no intention to fire into Thai territory and attributing the strike to an \"operational error\"."
        - "Thai Prime Minister Anutin Charnvirakul announced that his government had lodged a formal diplomatic protest regarding the incident."
