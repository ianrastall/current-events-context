    importance: 9
    headline: "U.S. Military Capture of Venezuelan President Nicolás Maduro"
    summary: >
      In a profound escalation of hemispheric geopolitics, the United States executed
      Operation Absolute Resolve in the early hours of January 3, 2026, launching a massive,
      coordinated military raid on Caracas to capture Venezuelan President Nicolás Maduro
      and his wife, Cilia Flores. Following their extraction, the pair appeared in a
      Manhattan federal court on January 5, pleading not guilty to extensive narco-terrorism
      and weapons charges. The U.S. intervention, which involved Delta Force operatives and
      heavy suppression of Venezuelan air defenses, effectively decapitated the incumbent
      government, leading Vice President Delcy Rodríguez to be sworn in as acting president
      amidst immediate deployments of armed civilian paramilitaries (colectivos). The Trump
      administration has explicitly linked the military action to the restructuring of
      Venezuela's vast oil reserves, initiating immediate talks with domestic energy
      executives while simultaneously confronting deep diplomatic backlash from Latin
      American neighbors and the United Nations.
    key_data: []
    details:
      what_happened:
        - "U.S. special operations forces, utilizing overwhelming air superiority to disable Russian-made air defenses, breached the presidential compound in Caracas and extracted Nicolás Maduro and Cilia Flores."
        - "Maduro and Flores were arraigned in a New York federal court, pleading not guilty to charges of narco-terrorism and cocaine importation conspiracy."
        - "Delcy Rodríguez was sworn in as acting president of Venezuela, labeling the U.S. operation a \"kidnapping\" and overseeing the mobilization of colectivos to maintain street-level control."
        - "President Donald Trump engaged with U.S. oil executives to discuss reviving the Venezuelan petroleum sector, while multiple sanctioned oil tankers managed to evade a U.S. maritime blockade."
        - "The United Nations Security Council held an emergency session where nations, including China and Russia, condemned the U.S. action as a gross violation of sovereign borders."
      why_it_matters:
        - "The unilateral military removal of a sovereign head of state shatters diplomatic norms in the Western Hemisphere, reviving a highly militarized interpretation of the Monroe Doctrine."
        - "The operation has severely fractured U.S.-Latin American relations, prompting threats of armed resistance from Colombian President Gustavo Petro against potential U.S. incursions."
        - "The explicit linkage of military force to the seizure and administration of global energy assets introduces extreme, unpredictable volatility into global hydrocarbon markets."
      uncertainty_notes: []
