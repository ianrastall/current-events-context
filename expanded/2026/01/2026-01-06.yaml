    headline: "Indonesia Implements Controversial New Criminal and Procedural Codes"
    summary: >
      On January 2, 2026, the Indonesian government enacted a sweeping and deeply
      controversial overhaul of its national criminal code (KUHP) and criminal procedures
      code (KUHAP), entirely replacing century-old colonial-era legislation. While
      government officials praise the reform as a modernization effort that shifts the
      justice system toward a restorative model—introducing community service and mediation
      to alleviate chronic prison overcrowding—civil society organizations warn of a
      draconian regression in civil liberties. The new codes criminalize extra-marital
      cohabitation, reintroduce severe penalties for insulting the president or state
      ideology, and expand blasphemy laws. Furthermore, the legislation significantly
      dilutes anti-corruption penalties, halving minimum prison sentences and drastically
      reducing fines, sparking outrage over the erosion of institutional transparency.
    key_data: []
    details:
      what_happened:
        - "The new KUHP and KUHAP took official effect, shifting the judicial framework to prioritize restorative justice, medical rehabilitation for drug offenses, and community service."
        - "The code criminalized sex outside of marriage, cohabitation, and public demonstrations conducted without prior police notification."
        - "Broadly worded offenses carrying multi-year prison sentences were introduced for insulting the president, state institutions, and the national ideology (Pancasila)."
        - "Anti-corruption penalties were weakened; the minimum prison sentence was reduced from four years to two years, and the minimum fine dropped from 200 million Rp to 10 million Rp."
        - "Law enforcement powers were expanded, allowing police to conduct arrests, wiretaps, and electronic data seizures without court orders in \"urgent\" situations."
      why_it_matters:
        - "The legislation provides state authorities with extensive, ambiguous legal tools to suppress political dissent, journalism, and minority groups under the guise of protecting public order and morality."
        - "The reduction in anti-corruption penalties severely undermines institutional oversight in Southeast Asia's largest economy, elevating compliance and operational risks for foreign investors and businesses."
      uncertainty_notes: []
