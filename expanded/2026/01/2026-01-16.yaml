    importance: 8
    headline: "Death toll from southern African torrential rains and floods surpasses 100 across Mozambique, South Africa, and Zimbabwe"
    summary: >
      Authorities across southern Africa reported on January 16 that weeks of torrential
      rainfall and severe flooding had killed more than 100 people and destroyed thousands
      of homes across Mozambique, South Africa, and Zimbabwe. Mozambique's Institute for
      Disaster Management and Risk Reduction recorded 103 deaths since the start of the
      rainy season from drowning, lightning strikes, structural collapses, and flood-linked
      cholera, while Zimbabwe's Civil Protection Agency reported 70 dead and more than 1,000
      homes destroyed, and South African officials reported at least 30 deaths across
      Limpopo and Mpumalanga provinces. In South Africa, overflowing rivers washed out roads
      and bridges in Kruger National Park, forcing authorities to close the reserve to
      visitors and airlift hundreds of tourists and staff from flooded camps by helicopter.
    key_data:
      - label: "Combined Regional Toll"
        value: "More than 100 people killed across Mozambique, South Africa, and Zimbabwe"
        citation_refs: [7]
      - label: "Mozambique"
        value: "103 rainy-season fatalities reported (including flood, lightning, and cholera deaths); over 200,000 affected"
        citation_refs: [7]
      - label: "Zimbabwe"
        value: "70 deaths and more than 1,000 homes destroyed since start of rainy season"
        citation_refs: [7]
      - label: "South Africa"
        value: "At least 30 deaths in Limpopo and Mpumalanga; Kruger National Park closed and evacuated"
        citation_refs: [7]
    details:
      what_happened:
        - "Disaster management authorities across Mozambique, South Africa, and Zimbabwe reported combined fatalities exceeding 100 following relentless downpours and widespread river flooding."
        - "South African National Parks kept Kruger National Park closed to visitors and evacuated tourists and staff by helicopter from inundated bush camps."
        - "The World Food Programme and national weather agencies warned that continued heavy rainfall threatened further displacement and damage across central and southern Mozambique and northern South Africa."
      why_it_matters:
        - "The multi-country flood emergency compounded humanitarian needs and cholera risks across southern Africa while damaging transport corridors, bridges, and thousands of homes."
        - "Uncertainty remains over the exact single-day versus cumulative seasonal death toll because national agencies in Mozambique (103) and Zimbabwe (70) reported cumulative rainy-season figures alongside acute mid-January flood deaths."
      uncertainty_notes:
        - "National agencies in Mozambique (103 dead) and Zimbabwe (70 dead) reported cumulative rainy-season figures alongside acute January flood deaths, which AP summarized as more than 100 people killed across the three countries."
