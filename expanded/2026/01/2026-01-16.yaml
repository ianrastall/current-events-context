    headline: "Seoul court sentences former South Korean President Yoon Suk Yeol to five years in prison in first martial law verdict"
    summary: >
      The Seoul Central District Court sentenced former South Korean President Yoon Suk Yeol
      to five years in prison on January 16 in the first judicial verdict stemming from his
      December 2024 martial law declaration and subsequent impeachment. A three-judge panel
      found the 65-year-old former president guilty of special obstruction of official
      duties for mobilizing the Presidential Security Service in January 2025 to block
      Corruption Investigation Office for High-ranking Officials (CIO) investigators from
      executing a court-approved warrant for his arrest, as well as guilty of abuse of power
      for excluding cabinet members from mandatory deliberation before declaring martial law
      and fabricating and destroying related official proclamation records. The court
      acquitted Yoon on a separate charge of forging an official document when the
      government lacked a prime minister.
