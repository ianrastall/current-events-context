    importance: 8
    headline: "Canada and China reach Beijing trade agreement cutting tariffs on Chinese electric vehicles and Canadian canola"
    summary: >
      Canadian Prime Minister Mark Carney and Chinese President Xi Jinping concluded a
      preliminary trade and strategic partnership agreement during a summit in Beijing on
      January 16, marking the first visit to China by a Canadian prime minister since 2017.
      Under the accord, Canada agreed to replace its 100% surtax on Chinese-built electric
      vehicles with an annual tariff-rate quota allowing up to 49,000 Chinese EVs into the
      Canadian market at the most-favored-nation tariff rate of 6.1%. In exchange, China
      committed to lower its combined tariffs on Canadian canola seed from roughly 84% to
      approximately 15% by March 1, 2026, and to suspend anti-discrimination duties on
      Canadian canola meal, lobsters, crabs, and peas from March 1 through at least the end
      of 2026.
