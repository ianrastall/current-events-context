    details:
      what_happened:
        - "OFAC imposed sanctions on 21 individuals and entities and identified one vessel tied to Houthi revenue generation, petroleum smuggling, and weapons procurement across Yemen, Oman, and the United Arab Emirates."
        - "Treasury Secretary Scott Bessent stated that the action targeted networks enabling Houthi attacks on commercial vessels transiting the Red Sea."
        - "All property and interests in property of the designated persons within U.S. jurisdiction were blocked under counter-terrorism authorities."
