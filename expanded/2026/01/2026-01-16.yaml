    details:
      what_happened:
        - "Between 15 and 20 separatist militants attacked the Kharan City police station and branches of the National Bank of Pakistan and Habib Bank Limited in Kharan District."
        - "The attackers attempted to seize hostages at the police station and looted 3.4 million rupees from the two bank branches."
        - "Pakistani army and security personnel responded to the assault, thwarting the hostage attempt and killing 12 gunmen during pursuit and clearance operations."
