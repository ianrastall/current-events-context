    headline: "White House announces Gaza \"Board of Peace\" leadership and National Committee for the Administration of Gaza"
    summary: >
      The White House issued an official statement on January 16 announcing the formation
      and founding executive membership of the "Board of Peace" and the National Committee
      for the Administration of Gaza (NCAG) under phase two of President Donald Trump's
      20-point plan to end the Gaza conflict, endorsed by UN Security Council Resolution
      2803 (2025). Chaired by Trump, the Board's Founding Executive Board includes U.S.
      Secretary of State Marco Rubio, Special Envoy Steve Witkoff, Jared Kushner, former UK
      Prime Minister Tony Blair, World Bank President Ajay Banga, Apollo Global Management
      CEO Marc Rowan, and deputy national security adviser Robert Gabriel. Former UN Middle
      East envoy Nikolay Mladenov was appointed High Representative for Gaza to link the
      Board with the NCAG, a Palestinian technocratic body headed by former Palestinian
      Authority deputy minister Dr. Ali Shaath tasked with restoring civil administration
      and public services in Gaza.
