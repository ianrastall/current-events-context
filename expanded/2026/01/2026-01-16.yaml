    headline: "Pakistani security forces kill 12 Balochistan Liberation Army gunmen after Kharan police station and bank attacks"
    summary: >
      Pakistani security forces killed at least 12 Balochistan Liberation Army (BLA) gunmen
      on January 16 following coordinated militant attacks in Kharan District, Balochistan
      Province. According to the military's Inter-Services Public Relations (ISPR) media
      wing, between 15 and 20 armed assailants launched simultaneous assaults on the Kharan
      City police station and local branches of the National Bank of Pakistan and Habib Bank
      Limited, attempting to take hostages at the police station and looting approximately
      3.4 million Pakistani rupees ($12,000) from the banks. Security forces engaged the
      attackers at the police station, forcing them to retreat, and killed 12 militants
      across three clearance engagements while preventing a hostage crisis.
