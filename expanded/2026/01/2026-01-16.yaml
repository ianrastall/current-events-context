    importance: 6
    headline: "New Zealand temporarily closes Tehran embassy and evacuates diplomatic staff to Ankara"
    summary: >
      New Zealand Foreign Minister Winston Peters and the Ministry of Foreign Affairs and
      Trade (MFAT) announced on January 16 that New Zealand had temporarily closed its
      embassy in Tehran and evacuated its diplomatic staff to Ankara, Turkey, citing the
      deteriorating security situation and communication blackout in Iran. New Zealand's
      diplomatic personnel departed Iran overnight on commercial flights, and embassy
      operations were transferred to the New Zealand Embassy in Ankara. The government
      reiterated its warning for New Zealand citizens to leave Iran immediately and noted
      that its ability to provide consular assistance inside the country had become
      extremely limited.
