        - "Police claimed opposition supporters armed with machetes attacked a police station and vote-tallying center in Butambala."
        - "Butambala MP Muwanga Kivumbi stated that soldiers and police broke into his home compound around 3:00 a.m. and shot dead ten supporters gathered inside his garage."
      why_it_matters:
        - "The killings in Butambala marked the deadliest single episode on the day after Uganda's general election, deepening disputes over electoral integrity while independent verification was hampered by the nationwide internet shutdown."
