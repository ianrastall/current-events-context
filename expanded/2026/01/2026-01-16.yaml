    headline: "Malaysian Prime Minister Anwar Ibrahim freezes military and police procurement amid corruption probe"
    summary: >
      Malaysian Prime Minister Anwar Ibrahim ordered an immediate temporary freeze on all
      procurement decisions by the Malaysian Armed Forces and the Royal Malaysia Police
      linked to an expanding anti-corruption investigation on January 16. The directive
      followed raids, asset seizures, and arrests by the Malaysian Anti-Corruption
      Commission (MACC) investigating suspected bribery in military procurement contracts,
      including the remand of former Army chief Hafizuddiean Jantan earlier in the month.
      Anwar stated that all affected defense and police procurement processes would remain
      suspended until strict compliance with financial rules is verified, and directed the
      Defense and Home Affairs ministries to review and restructure procurement procedures
      to close regulatory loopholes.
