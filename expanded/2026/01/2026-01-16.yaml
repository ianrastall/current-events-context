    importance: 7
    headline: "Post-election clashes in Butambala kill at least seven people as Uganda counts votes under internet blackout"
    summary: >
      Deadly violence erupted in Butambala, central Uganda, in the early hours of January 16
      following the country's January 15 presidential and parliamentary elections, leaving
      at least seven people dead as early official tallies gave incumbent President Yoweri
      Museveni a wide lead under a nationwide internet blackout. Ugandan police spokesperson
      Lydia Tumushabe stated that security forces shot dead seven people in self-defense
      after machete-wielding opposition supporters allegedly organized by National Unity
      Platform (NUP) lawmaker Muwanga Kivumbi attacked the Butambala police station and
      local vote-tallying center. Kivumbi rejected the police account, telling Reuters that
      security forces stormed his residence around 3:00 a.m. local time and fatally shot ten
      campaign agents and supporters waiting inside his garage for parliamentary election
      results.
