    headline: "Ugandan opposition party reports Bobi Wine placed under house arrest and removed by military helicopter"
    summary: >
      Uganda's main opposition party, the National Unity Platform (NUP), stated on January
      16 that its leader and presidential candidate Bobi Wine (Robert Kyagulanyi Ssentamu)
      had been placed under house arrest at his residence in Magere, north of Kampala, and
      later forcibly taken to an unknown destination by a Ugandan military helicopter. Wine
      had rejected the early presidential results released by the Electoral Commission as
      fraudulent after soldiers and police surrounded his compound and prevented him and his
      family from leaving. Later on Friday evening, NUP posted on X that an army helicopter
      landed inside Wine's compound, security personnel assaulted his private guards, and
      soldiers removed him to an undisclosed location.
