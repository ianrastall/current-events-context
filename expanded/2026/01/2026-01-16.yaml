    importance: 7
    headline: "U.S. officials disclose CIA Director John Ratcliffe met Venezuelan Acting President Delcy Rodríguez in Caracas as Trump hosts María Corina Machado"
    summary: >
      U.S. officials disclosed on January 16 that Central Intelligence Agency Director John
      Ratcliffe had traveled to Caracas the previous day for a two-hour meeting with
      Venezuela's acting president, Delcy Rodríguez, making Ratcliffe the highest-ranking
      Trump administration official to visit Venezuela since the January 3 U.S. military
      operation that captured former President Nicolás Maduro. Acting at the direction of
      President Donald Trump, Ratcliffe discussed intelligence sharing, economic stability,
      and energy-sector cooperation while warning that Venezuela could no longer serve as a
      safe haven for narcotics traffickers or U.S. adversaries. The disclosure coincided
      with Venezuelan opposition leader and Nobel Peace Prize laureate María Corina Machado
      speaking in Washington on January 16 after meeting Trump at the White House, where she
      presented him with her Nobel medal while the administration continued dealing
      operationally with Rodríguez's interim government.
