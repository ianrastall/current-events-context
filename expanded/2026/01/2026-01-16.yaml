    importance: 8
    headline: "United States and Taiwan finalize trade and semiconductor pact lowering U.S. tariffs to 15%"
    summary: >
      The United States and Taiwan finalized a bilateral trade and investment agreement
      announced by the U.S. Department of Commerce and covered internationally on January
      15–16, reducing the U.S. reciprocal tariff rate on Taiwanese goods from 20% to 15%.
      Under the agreement signed by the American Institute in Taiwan (AIT) and the Taipei
      Economic and Cultural Representative Office (TECRO), Taiwanese semiconductor and
      technology enterprises committed to at least $250 billion in direct investments to
      build and expand advanced chip manufacturing, artificial intelligence, and energy
      capacity in the United States, backed by an additional $250 billion in credit
      guarantees from the Taiwanese government to support supply-chain expansion.
    key_data:
