    headline: "U.S. Treasury sanctions 21 individuals and entities in Houthi oil smuggling and weapons procurement networks"
    summary: >
      The U.S. Department of the Treasury's Office of Foreign Assets Control (OFAC)
      designated 21 individuals and entities and identified one vessel on January 16 for
      operating financial, oil-smuggling, and weapons-procurement networks supporting
      Yemen's Iran-backed Houthis (Ansarallah). According to the Treasury Department, the
      sanctioned targets—spanning Yemen, Oman, and the United Arab Emirates—served as front
      companies, logistics facilitators, and financial conduits transferring petroleum
      products, dual-use equipment, and weapons that generated illicit revenue for Houthi
      military operations and attacks on commercial shipping in the Red Sea.
