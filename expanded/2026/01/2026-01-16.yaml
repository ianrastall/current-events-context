        value: "Up to 49,000 Chinese electric vehicles annually"
        citation_refs: [4]
      - label: "Canadian EV Tariff Rate"
        value: "6.1% most-favored-nation rate (down from 100% surtax)"
        citation_refs: [4]
      - label: "Chinese Canola Seed Tariff"
        value: "Reduced to approximately 15% by March 1, 2026 (down from ~84%)"
        citation_refs: [4]
      - label: "Suspended Chinese Tariffs"
        value: "Canola meal, lobsters, crabs, and peas (March 1 to end of 2026)"
        citation_refs: [4]
    details:
      what_happened:
        - "Prime Minister Mark Carney met Chinese President Xi Jinping at the Great Hall of the People in Beijing and announced a preliminary bilateral trade agreement and strategic partnership."
        - "Canada agreed to permit up to 49,000 Chinese electric vehicles per year to enter Canada at a 6.1% tariff rate, rolling back the 100% tariff imposed in 2024."
        - "China agreed to reduce combined tariffs on Canadian canola seed to about 15% by March 1, 2026, and lift anti-discrimination tariffs on Canadian canola meal, lobsters, crabs, and peas."
      why_it_matters:
        - "The pact unwinds a major bilateral trade dispute affecting billions of dollars in Canadian agricultural and seafood exports while opening a regulated quota for Chinese EVs in North America."
        - "The agreement signals Ottawa's effort to diversify trade relationships amid heightened tariff pressures from the United States."
