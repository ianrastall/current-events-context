        - "Former UN diplomat Nikolay Mladenov was named High Representative for Gaza, while Palestinian technocrat Dr. Ali Shaath was named to lead the NCAG, which began initial organizational meetings in Cairo."
        - "U.S. Major General Jasper Jeffers was named commander of the planned International Stabilization Force (ISF) for Gaza."
