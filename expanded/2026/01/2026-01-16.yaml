    headline: "SpaceX launches NROL-105 reconnaissance mission as NASA completes Artemis II moon rocket rollout preparations"
    summary: >
      The U.S. National Reconnaissance Office (NRO), U.S. Space Force Space Launch Delta 30,
      and SpaceX launched the classified NROL-105 reconnaissance mission aboard a Falcon 9
      rocket from Space Launch Complex 4 East at Vandenberg Space Force Base in California
      on January 16 at 8:39 p.m. PST (11:39 p.m. EST). The mission deployed the twelfth
      batch of proliferated reconnaissance satellites built by Northrop Grumman and SpaceX,
      while the Falcon 9 first-stage booster returned to land at Vandenberg's Landing Zone
      4. Earlier on January 16 at NASA's Kennedy Space Center in Florida, engineers
      retracted the final work platforms inside the Vehicle Assembly Building around the
      322-foot Artemis II Space Launch System (SLS) rocket and Orion spacecraft and held a
      pre-rollout briefing ahead of the vehicle's move to Launch Pad 39B.
