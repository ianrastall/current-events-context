        citation_refs: [15]
      - label: "Convictions"
        value: "Obstruction of official duties (blocking arrest warrant), abuse of power (cabinet exclusion), fabricating/destroying official records"
        citation_refs: [15]
      - label: "Acquittal"
        value: "Forgery of an official document"
        citation_refs: [15]
    details:
      what_happened:
        - "In a televised ruling on January 16, the Seoul Central District Court sentenced former President Yoon Suk Yeol to five years in prison."
        - "The court convicted Yoon of mobilizing the Presidential Security Service to block investigators from executing a lawful detention warrant in January 2025 and of violating the constitutional deliberation rights of cabinet members during the December 2024 martial law decree."
        - "The court acquitted him of a separate count of forging an official document, and Yoon's legal team announced plans to appeal the verdict while his separate insurrection trial continued."
      why_it_matters:
        - "The sentence represents the first criminal conviction against Yoon across eight trials arising from the 2024 martial law crisis, establishing judicial precedent that presidential security forces cannot be used to obstruct court-issued warrants."
        - "The court's finding that cabinet deliberation procedures were unlawfully bypassed directly addressed key constitutional arguments in Yoon's parallel insurrection trial."
