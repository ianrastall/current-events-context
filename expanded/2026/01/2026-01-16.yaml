        value: "15% on Taiwanese goods (reduced from 20%)"
        citation_refs: [5]
      - label: "Sectoral Tariff Cap"
        value: "15% cap on Taiwanese auto parts, timber, and lumber; 0% on generic drugs"
        citation_refs: [6]
      - label: "Direct U.S. Investment Pledge"
        value: "At least $250 billion by Taiwanese semiconductor and technology firms"
        citation_refs: [6]
      - label: "Government Credit Guarantees"
        value: "At least $250 billion provided by Taiwan for supply-chain firms"
        citation_refs: [6]
    details:
      what_happened:
        - "The U.S. Department of Commerce announced a trade agreement with Taiwan cutting reciprocal tariffs on Taiwanese imports from 20% to 15%, matching rates applied to Japan and South Korea."
        - "Taiwanese semiconductor and technology companies pledged at least $250 billion in direct U.S. manufacturing and AI infrastructure investments."
        - "Taiwan's government pledged an additional $250 billion in credit guarantees to facilitate semiconductor supply-chain investments in the United States and secured duty-free Section 232 import allowances tied to U.S. plant construction."
      why_it_matters:
        - "The deal places Taiwanese exporters on equal U.S. tariff footing with Japanese and South Korean competitors while locking in hundreds of billions of dollars in U.S. fab commitments."
        - "Tying Section 232 semiconductor tariff exemptions directly to domestic U.S. plant construction institutionalizes industrial-policy incentives in U.S. trade policy."
