    headline: "Former Corsican Nationalist Leader Alain Orsoni Assassinated"
    summary: >
      The French Mediterranean island of Corsica was rocked by a high-profile political
      assassination when Alain Orsoni, a historic and deeply controversial figure in the
      island's nationalist movement, was shot dead in the village of Vero. The 71-year-old
      former militant was brazenly gunned down while attending his mother's funeral, an act
      that shocked attendees and immediately plunged the region into tension. Orsoni was a
      foundational leader of the National Liberation Front of Corsica (FLNC) during the peak
      of its armed struggle in the 1980s, later founding the Movement for Self-Determination
      (MPA) before transitioning into civil society as the president of the AC Ajaccio
      professional soccer club. The public prosecutor of Ajaccio immediately opened a murder
      investigation, explicitly treating the targeted killing as an act perpetrated by an
      organized criminal gang, highlighting the often blurred lines between historic
      political militancy and modern organized crime on the island.
    key_data: []
