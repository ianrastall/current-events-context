    importance: 5
    headline: "Rare Meteotsunami Inundates Argentina's Atlantic Coast"
    summary: >
      A highly destructive and unpredictable meteotsunami struck the Atlantic coast of
      Argentina's Buenos Aires Province, killing one person and injuring at least 35 others
      as it swept through crowded summer beaches. Occurring between 16:20 and 17:00 local
      time, the sea abruptly receded before violently returning as a massive surge, with
      wave crests estimated between 5 to 6 meters (16 to 20 feet) high, vastly exceeding the
      region's typical 2-meter surf. The sudden inundation caused widespread panic in
      coastal towns such as Santa Clara del Mar, Mar Chiquita, and Mar del Plata, tossing
      people and heavy debris inland. Meteorological experts confirmed the phenomenon was
      not seismic, but rather driven by rapid atmospheric pressure drops and wind shifts
      from a passing frontal system that induced a resonant oscillation in the shallow
      continental shelf waters.
    key_data: []
    details:
      what_happened:
        - "A rare meteotsunami struck Argentina's Atlantic coast, generating massive 5 to 6-meter waves that inundated heavily populated tourist beaches."
        - "The ocean suddenly withdrew several meters before rushing back ashore, violently sweeping away beachgoers and infrastructure."
        - "A 29-year-old man was killed after being thrown against rocks while fishing on a breakwater in Santa Clara del Mar."
        - "At least 35 individuals sustained injuries ranging from severe cuts and bruises to one reported heart attack induced by the panic."
        - "Authorities initiated immediate evacuations of several beach resorts and deployed civil defense, health, and security agencies across the affected coastline."
      why_it_matters:
        - "The deadly event exposes severe vulnerabilities in coastal warning systems, as meteotsunamis lack the seismic precursors that trigger traditional tsunami alerts, rendering standard emergency protocols ineffective."
        - "The phenomenon highlights the escalating threat of extreme, rapid-onset weather events impacting densely populated coastal tourism hubs, necessitating urgent investment in specialized atmospheric pressure monitoring."
