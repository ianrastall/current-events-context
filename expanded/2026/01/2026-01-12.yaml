    importance: 5
    headline: "Spain Seizes Record 10 Tonnes of Cocaine in Operation White Tide"
    summary: >
      In a massive blow to transnational narcotics trafficking, Spanish police executed the
      country's largest-ever maritime cocaine seizure, intercepting nearly 10 metric tonnes
      of the drug aboard a cargo ship in the Atlantic Ocean. The complex interdiction,
      code-named "Operation White Tide," involved elite tactical officers boarding a
      Cameroon-flagged vessel approximately 332 miles off the coast of the Canary Islands
      after the ship inexplicably ran out of fuel while en route from Brazil to Europe.
      Authorities discovered 9,994 kilograms of cocaine, meticulously divided into 294
      bales, buried beneath a massive, decoy cargo shipment of salt. The highly coordinated
      raid, which resulted in the arrest of all 13 crew members and the seizure of defensive
      firearms, was facilitated through extensive intelligence sharing with the U.S. Drug
      Enforcement Administration (DEA), the UK National Crime Agency (NCA), and authorities
      from Brazil, France, and Portugal.
    key_data: []
    details:
      what_happened:
        - "Spanish police seized 9,994 kilograms (nearly 10 tonnes) of cocaine from a Cameroon-flagged container ship adrift in the Atlantic Ocean."
        - "The massive drug shipment was concealed inside 294 bales buried beneath a cargo of salt."
        - "Elite tactical officers boarded the vessel roughly 332 miles off the Canary Islands after it ran out of fuel en route from Brazil."
        - "All 13 crew members were arrested, and a firearm used to guard the stash was recovered by authorities."
        - "The interdiction was a multinational effort involving the DEA, NCA, and law enforcement from Brazil, France, and Portugal."
      why_it_matters:
        - "The sheer volume of the seizure represents a catastrophic logistical and financial disruption to South American cartels utilizing maritime shipping routes to supply the European market."
        - "The success of \"Operation White Tide\" emphasizes the critical necessity of multinational intelligence sharing and operational synchronization to combat sophisticated, transnational organized crime syndicates."
        - "The bust reinforces Spain's persistent geographic vulnerability as a primary maritime gateway for illicit narcotics entering the European Union."
