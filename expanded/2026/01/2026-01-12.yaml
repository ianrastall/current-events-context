    topics:
      - "Corruption in Poland, Hungary–Poland relations"
      - "Political asylum"
    importance: 5
    headline: "Former Polish Justice Minister Zbigniew Ziobro Granted Asylum in Hungary"
    summary: >
      The Hungarian government officially granted political asylum to Poland's former
      Justice Minister Zbigniew Ziobro, an unprecedented diplomatic maneuver that severely
      escalated tensions between the two European Union member states. Ziobro had fled to
      Budapest to escape 26 impending criminal charges in Poland, which carry a potential
      25-year prison sentence, regarding his alleged establishment of a criminal enterprise
      and the illicit diversion of a crime victims' fund to purchase Pegasus spyware for
      surveilling political opponents. Taking to social media, Ziobro announced the asylum
      decision, expressing gratitude to Hungarian Prime Minister Viktor Orbán and asserting
      that he is the victim of a "creeping dictatorship" and a personal vendetta
      orchestrated by current Polish Prime Minister Donald Tusk. The move, defended by
      Hungarian officials as protection against political repression, effectively shields a
      key architect of Poland's previous right-wing government from domestic accountability.
    key_data: []
    details:
      what_happened:
        - "Former Polish Justice Minister Zbigniew Ziobro announced he accepted political asylum granted by the Hungarian government."
        - "Ziobro fled Poland to evade prosecution on 26 charges, including the misuse of public funds to purchase Pegasus spyware."
        - "The Polish parliament had previously stripped Ziobro of his immunity in November, and his passport was officially revoked in December."
        - "Hungarian Foreign Minister Peter Szijjarto publicly defended the asylum, asserting that democracy and the rule of law are under threat in Poland."
        - "Ziobro's legal team confirmed he would receive a travel document under the 1951 Refugee Convention, facilitating his movement despite his revoked passport."
