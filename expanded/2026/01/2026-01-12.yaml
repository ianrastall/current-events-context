      what_happened:
        - "Irakli Garibashvili pleaded guilty to money laundering charges under Article 194, part three of the Georgian Criminal Code."
        - "The court sentenced him to five years in prison and imposed a fine of 1 million GEL ($370,000 USD)."
        - "Garibashvili was arrested immediately in the courtroom and transferred to begin serving his sentence."
        - "The state ordered the forfeiture of roughly $6.5 million in cash seized from his Tbilisi apartment during a prior raid."
        - "Prosecutors proved he laundered illicit income through undeclared business ventures and integrated the funds via falsified asset declarations."
      why_it_matters:
        - "Garibashvili's imprisonment marks the first time a senior figure from the ruling Georgian Dream party has been jailed, signaling a dramatic, potentially cannibalistic escalation in domestic anti-corruption purges."
        - "The prosecution reflects severe internal power struggles within the ruling party, orchestrated by billionaire founder Bidzina Ivanishvili, intended to consolidate control while neutralizing potential rivals."
        - "The high-profile conviction tests the credibility and independence of Georgia's judicial system at a critical juncture in the nation's fragile bid for European Union integration."
