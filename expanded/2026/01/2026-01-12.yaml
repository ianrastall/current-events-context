    headline: "Rapid Support Forces Missile Strike Kills Civilians in Sudan"
    summary: >
      The catastrophic humanitarian situation in Sudan was further degraded as the
      paramilitary Rapid Support Forces (RSF) launched a deadly missile strike on the city
      of Singa in Sennar State, resulting in significant civilian casualties. The
      indiscriminate strike killed ten civilians and wounded nine others, demonstrating the
      lethal expansion of the civil war into previously stable administrative centers. This
      attack occurs against an apocalyptic backdrop of widespread acute food insecurity and
      a totally collapsed national healthcare infrastructure. According to concurrent
      reporting from the UN Office for the Coordination of Humanitarian Affairs, an
      estimated 21 million Sudanese are currently facing acute food shortages, with
      female-headed households suffering disproportionately as the brutal war of attrition
      between the RSF and the Sudanese Armed Forces (SAF) shows no signs of abatement.
