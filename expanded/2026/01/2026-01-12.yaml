        - "The assassination was executed in broad daylight while Orsoni was attending the funeral service for his mother."
        - "Orsoni was a historic leader of the militant National Liberation Front of Corsica (FLNC) and former president of the AC Ajaccio soccer club."
        - "The Ajaccio public prosecutor formally opened an investigation into the killing as a murder executed by an organized gang."
      why_it_matters:
        - "The targeted assassination of a legacy nationalist figure poses a severe risk of reigniting dormant political, factional, and clan-based violence on the French island."
        - "The brazen nature of the killing—executed at a funeral—underscores the ruthless, taboo-breaking methods employed by modern Corsican organized crime networks."
        - "The event highlights the enduring, complex nexus between historic separatist militancy, the sports industry, and contemporary organized crime syndicates operating in the Mediterranean."
