    importance: 7
    headline: "Strong magnitude 6.5 earthquake strikes Guerrero, Mexico, disrupting Sheinbaum briefing"
    summary: >
      A magnitude 6.5 earthquake struck near San Marcos in Guerrero state, shaking
      southern and central Mexico and interrupting President Claudia Sheinbaum's live
      morning press briefing as seismic alarms sounded. The earliest Reuters reporting
      emphasized the immediate disruption and noted no immediate reports of injuries
      or major damage, while later Associated Press reporting described at least two
      deaths, widespread alarm, and aftershocks. The U.S. Geological Survey reported
      the quake's magnitude, location, and depth on its event page.
    key_data:
      - label: "Magnitude"
        value: "6.5"
        citation_refs: [5]
      - label: "Depth"
        value: "18.0 km"
        citation_refs: [5]
      - label: "Epicenter"
        value: "Near San Marcos, Guerrero"
        citation_refs: [5]
      - label: "Reported Deaths"
        value: "At least 2 (per later AP reporting)"
        citation_refs: [4]
    details:
      what_happened:
        - "The U.S. Geological Survey recorded a magnitude 6.5 quake near San Marcos, Guerrero, at a depth of 18.0 km."
        - "Reuters reported the quake disrupted Sheinbaum's press conference in Mexico City as alarms sounded and people evacuated."
        - "The Associated Press later reported at least two deaths associated with the quake and described extensive public alarm and aftershocks."
        - "Reuters noted that in the immediate aftermath there were no immediate reports of injuries or significant damage, reflecting early-stage reporting."
      why_it_matters:
        - "Conflicting early versus later casualty reporting illustrated how rapidly disaster assessments can evolve in the hours after a major quake."
        - "The quake's disruption of a nationally broadcast presidential briefing underscored the event's scale of felt impact."
      uncertainty_notes:
        - "Early Reuters reporting cited no immediate casualties; later AP reporting described at least two deaths. The portal summary cited two killed and twelve injured."
        - "Initial magnitude estimates varied by agency (GFZ early estimate versus USGS 6.5)."
