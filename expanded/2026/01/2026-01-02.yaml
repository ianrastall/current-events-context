    importance: 7
    headline: "Dozens missing after migrant boat capsizes off The Gambia; tolls disputed"
    summary: >
      A boat described as carrying more than 200 migrants capsized off the Gambian
      coast around New Year's, triggering a search-and-rescue operation involving
      state responders and local fishing boats. Reporting diverged on key figures:
      Reuters reported seven dead and 96 rescued based on a defence ministry
      statement; the Gambia Maritime Administration reported 102 rescued and four
      confirmed deaths as of January 1; and the Associated Press reported 102 rescued
      and seven bodies recovered, citing a state broadcast by President Adama Barrow.
      In all accounts, officials warned that many people were still unaccounted for.
    key_data:
      - label: "Estimated Onboard"
        value: "More than 200 migrants"
        citation_refs: [8]
      - label: "Rescued"
        value: "96 (Reuters) / 102 (Gambia Maritime Administration, AP)"
        citation_refs: [6, 7, 8]
      - label: "Confirmed Deaths"
        value: "4 (Gambia Maritime Administration) / 7 (Reuters, AP)"
        citation_refs: [6, 7, 8]
    details:
      what_happened:
        - "Reuters cited a Gambian defence ministry statement reporting seven deaths and 96 rescues after a migrant boat capsized."
        - "The Gambia Maritime Administration issued an incident update listing 102 persons rescued and four confirmed deaths as of January 1, 2026."
        - "The Associated Press reported President Adama Barrow said 102 survivors were rescued and seven bodies were recovered, with dozens missing."
        - "AP reported the boat was found grounded on a sandbank, while noting uncertainty about what caused the tragedy."
      why_it_matters:
        - "The conflicting official and media counts highlighted the information gaps typical in fast-moving maritime disasters involving irregular migration routes."
        - "The incident underscored ongoing life-threatening risks on Atlantic migration routes toward Europe."
      uncertainty_notes:
        - "Death toll conflicting: four confirmed by the Gambia Maritime Administration versus seven reported by Reuters and AP."
        - "Rescue count varied between 96 and 102 across sources."
