    importance: 6
    headline: "Pakistani court sentences journalists to life in absentia over alleged 'digital' offences"
    summary: >
      A Pakistani anti-terrorism court sentenced journalists and social media
      commentators to life imprisonment in absentia, with convictions linked to
      alleged online activity connected to protests following the 2023 arrest of former
      prime minister Imran Khan. Reuters reported eight people were sentenced and named
      several; Al Jazeera described the sentences as tied to pro-Khan protests; and UPI
      reported life sentences for seven people for "digital terrorism," reflecting
      outlet-level discrepancy on the number sentenced. Reuters said most were believed
      to be outside Pakistan, did not participate in the trials, and referenced
      criticism from the Committee to Protect Journalists.
    key_data:
      - label: "Number Sentenced"
        value: "Eight (Reuters) / seven (UPI)"
