    headline: "Saudi-led coalition strikes STC targets in Yemen as separatists push referendum plan"
    summary: >
      Reporting described Saudi-led coalition airstrikes targeting positions held by
      the UAE-backed Southern Transitional Council (STC) in Yemen, with witnesses and
      STC-linked accounts pointing to strikes around Hadhramaut, including near Seiyun.
      Separately, Reuters reported the STC announced plans to hold a referendum on
      independence, while describing the escalation as part of a widening rift between
      Saudi Arabia and the UAE inside Yemen's government-controlled areas. The reports
      emphasized active fighting, shifting territorial control, and competing political
      endgames.
