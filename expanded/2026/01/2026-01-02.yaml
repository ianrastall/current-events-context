        - "Reuters reported the STC said it would hold an independence referendum by the end of 2026."
        - "Reuters described the broader crisis as reflecting rivalry between Riyadh and Abu Dhabi in Yemen's government-run areas."
        - "Reporting indicated strikes hit areas including Hadhramaut's Seiyun city, with an airport and a military base cited by witnesses and STC sources."
      why_it_matters:
        - "The combination of airstrikes and referendum plans suggested an escalating fracture inside the anti-Houthi camp, with potential implications for Yemen's territorial integrity."
        - "Coalition strikes against a coalition-aligned separatist actor signaled a possible shift in alignment and escalation risk in southern and eastern Yemen."
