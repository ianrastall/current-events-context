        value: "Wajahat Saeed Khan, Adil Raja, Shaheen Sehbai (per portal summary)"
        citation_refs: [36]
    details:
      what_happened:
        - "Reuters reported a Pakistani anti-terrorism court sentenced eight journalists and social media commentators to life imprisonment in absentia."
        - "Al Jazeera reported journalists were sentenced to life over the 2023 pro-Khan protests, noting trials were held in absentia."
        - "UPI reported life sentences for seven defendants for 'digital terrorism,' indicating an outlet-level discrepancy in the number convicted."
        - "Reuters said critics, including the Committee to Protect Journalists, viewed the convictions as politically motivated and that the verdict required confirmation by the Islamabad High Court."
