    headline: "Swiss investigators say sparkling candles likely ignited deadly Crans-Montana bar fire"
    summary: >
      Investigators in Switzerland said evidence indicated that "sparkling candles"
      used during New Year celebrations were the likely source of ignition for the
      deadly fire at Le Constellation in the ski resort of Crans-Montana. Reporting
      described a mass-casualty incident with extensive burn injuries; the Associated
      Press reported 41 killed, and Reuters cited the same toll in later follow-up
      reporting about Swiss authorities ordering nationwide inspections of bars,
      nightclubs, and other venues in response to the disaster.
    key_data:
