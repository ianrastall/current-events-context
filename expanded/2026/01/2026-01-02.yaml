        value: "41"
        citation_refs: [1, 2]
      - label: "Reported Injuries"
        value: "115"
        citation_refs: [1]
      - label: "Likely Ignition Source"
        value: "Sparkling candles attached to champagne bottles"
        citation_refs: [1]
    details:
      what_happened:
        - "Swiss investigators said the fire was likely started by sparkling candles attached to champagne bottles during New Year celebrations."
        - "Reuters reported Swiss authorities ordered inspections of bars, nightclubs, and other venues following the deadly fire."
        - "The death toll was reported as 41 by the Associated Press, with Reuters citing the same figure in its later reporting on follow-on inspections."
        - "Reporting emphasized the scale of casualties and severe burn injuries, driving a broader public-safety response."
      why_it_matters:
        - "The incident focused renewed attention on indoor fire risks associated with celebratory candles and pyrotechnic-style items in crowded venues."
        - "Follow-on inspections signaled a national-level safety response beyond the immediate disaster site."
      uncertainty_notes:
        - "Death-toll figures differed slightly between outlets in early reporting; the cited sources converge on 41 killed."
