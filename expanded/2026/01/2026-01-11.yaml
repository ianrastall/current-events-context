    importance: 6
    headline: "Sudanese Government Reestablishes Capital in Khartoum After 1,000 Days of War"
    summary: >
      Exactly 1,000 days after the outbreak of a devastating civil war that fractured the
      nation, Sudanese Prime Minister Kamil Idris formally announced the return of the
      sovereign government to the capital city of Khartoum on January 11, 2026. Operating in
      exile from the eastern coastal city of Port Sudan since the conflict between the
      Sudanese Armed Forces (SAF) and the paramilitary Rapid Support Forces (RSF) erupted in
      April 2023, the government's relocation represents a monumental symbolic and
      administrative victory following a series of successful territorial reclamations by
      the SAF. Addressing a massive public rally in El Kadru Square in Khartoum North
      (Bahri), Prime Minister Idris officially declared 2026 the "Year of Peace" and
      unveiled the National Peace Initiative, aimed at transitioning the state from military
      crisis management to post-conflict reconstruction. Pledging to prioritize the
      rehabilitation of the heavily damaged University of Khartoum, healthcare facilities,
      and civil infrastructure, the return prompted the African Union to initiate rapid
      security assessments to reopen its liaison office in the capital, signaling cautious
      international validation of the government's renewed authority.
    key_data: []
    details:
      what_happened:
        - "Prime Minister Kamil Idris and his cabinet officially relocated the operational seat of the Sudanese government back to Khartoum from Port Sudan."
        - "Addressing crowds in Bahri, Idris declared 2026 the \"Year of Peace\" and formally launched the National Peace Initiative to guide national reconstruction."
        - "The Prime Minister engaged in diplomatic talks with African Union envoy Mohamed Belaiche to coordinate international peace efforts and unify diplomatic platforms."
        - "The government announced targeted economic development projects, focusing heavily on rebuilding the University of Khartoum, rehabilitating slaughterhouses, and expanding the Al-Gezira agricultural scheme."
      why_it_matters:
        - "The physical return to Khartoum projects immense psychological strength and consolidates the sovereign legitimacy of the Sudanese Armed Forces, signaling to both domestic factions and international observers that the state is re-establishing its historical center of gravity."
        - "The initiation of the National Peace Initiative and the engagement with the African Union suggest a strategic pivot from attritional warfare toward institutional recovery and economic revitalization, even as localized hostilities persist."
