      Taiwanese National Security Bureau (NSB) published an alarming intelligence report
      detailing a massive, sustained campaign of cognitive warfare and cyber aggression
      directed by the People's Republic of China. The NSB documented that Chinese
      state-sponsored cyber actors are currently launching an unprecedented 2.63 million
      intrusion attempts against Taiwan's critical digital infrastructure every single day—a
      6% increase from the previous year. Furthermore, the report outlined Beijing's
      sophisticated utilization of IT and marketing fronts to spawn fake news networks and
      manipulate public opinion to erode trust in the Taiwanese government. This
      intelligence release occurred against a backdrop of severe diplomatic hostility; just
      days prior, China’s State Council Taiwan Affairs Office had formally sanctioned
      Taiwan's Interior Minister Liu Shyh-fang and Education Minister Cheng Ying-yao,
      labeling them "die-hard Taiwan independence separatists" and banning them and their
      families from entering China, a move that drew fierce condemnation from Taipei.
