    headline: "Nationwide Anti-ICE Protests Escalate Over Killing of Renee Good in Minneapolis"
    summary: >
      A massive wave of nationwide anti-ICE (Immigration and Customs Enforcement)
      demonstrations paralyzed major American cities on January 11, 2026, sparked by the
      recent fatal shooting of 37-year-old protester Renee Nicole Macklin Good by an ICE
      agent in Minneapolis. In the epicenter of the unrest, tens of thousands of
      demonstrators braved subfreezing temperatures to occupy the site of Good’s death,
      transforming Minneapolis into a heavily fortified zone hosting the largest
      concentration of Department of Homeland Security (DHS) federal agents seen in recent
      years. The crisis intensified over fierce jurisdictional and transparency disputes;
      Minnesota Attorney General Keith Ellison publicly accused federal authorities of
      denying state investigators access to crucial evidence, while U.S. Representative
      Ilhan Omar alleged that DHS had repeatedly lied about the sequence of events,
      contradicting ICE's claims that Good was engaged in an act of terrorism by blocking a
      road. The outrage resonated nationally, with solidarity marches organized in downtown
      Atlanta and other major metropolitan areas, reflecting deepening domestic fissures
      over federal immigration enforcement tactics and the militarization of civil protest
      responses.
