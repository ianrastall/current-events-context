    headline: "Severe Avalanches in French Alps Claim Six Lives Amid Extreme Warnings"
    summary: >
      A deadly combination of heavy, wind-drifted snowfall and a highly unstable base layer
      resulted in catastrophic avalanche conditions across the French Alps over the weekend
      of January 10 and 11, 2026, claiming the lives of six off-piste skiers. Despite urgent
      directives from Météo-France and regional authorities elevating the avalanche risk to
      Level 4 and 5 ("high" and "extreme"), numerous winter sports enthusiasts ventured into
      the backcountry without critical safety equipment. The fatalities were spread across
      multiple resorts: in La Plagne, a 50-year-old British male lacking a transceiver was
      found dead under 2.5 meters of snow; in Val d'Isère, two French skiers were similarly
      buried and could only be located by rescuers via their smartphone GPS data; and
      additional fatal slides occurred in Arêches-Beaufort, Courchevel, and Vallorcine,
      where a 32-year-old man died from blunt force trauma after being hurled against a
      tree. The volatile weather systems not only triggered spontaneous avalanches that
      blocked mountain access roads near Les Arcs but also forced approximately 800
      travelers to shelter overnight in gymnasiums in Moûtiers, severely straining regional
      emergency and logistical infrastructure.
