    headline: "Benin Holds Peaceful Parliamentary Elections One Month After Thwarted Coup"
    summary: >
      Just one month after the military violently suppressed a mutiny and attempted coup
      d'état in the capital, over eight million registered voters in Benin went to the polls
      on January 11, 2026, to elect 109 representatives to the National Assembly. Despite
      the recent extreme political instability and the ongoing, severe threat of jihadist
      violence spilling over from Burkina Faso and Niger into northern territories, the
      single-round legislative elections proceeded peacefully. President Patrice Talon’s
      ruling three-party coalition sought to maintain or expand its 81-seat supermajority
      against a fractured opposition. Notably, the main opposition party, The Democrats,
      competed vigorously in these parliamentary races despite having been structurally
      barred from the upcoming April presidential election due to controversial laws
      requiring high signature thresholds. Observers viewed the election as a critical
      stress test of Benin's democratic resilience and state security apparatuses during a
      fraught period of democratic backsliding.
    key_data: []
    details:
      what_happened:
        - "Beninese citizens voted in single-round legislative polls to elect 109 representatives to the National Assembly."
        - "The main opposition party, The Democrats, participated in the parliamentary vote but remained barred from the impending April presidential race due to strict registration laws."
        - "The election was held peacefully in Cotonou and nationwide, exactly one month after the military put down a December 7 coup attempt."
        - "The ruling coalition aimed to consolidate its power and ensure a smooth path for President Talon's hand-picked successor, Romuald Wadagni."
      why_it_matters:
        - "The ability to conduct a peaceful nationwide election so shortly after a violent coup attempt demonstrates a high degree of immediate state resilience and internal security control by the Talon administration."
        - "The structural exclusion of The Democrats from the subsequent presidential race highlights ongoing democratic backsliding and shrinking civic space, ensuring that the ruling bloc faces minimal existential threat to its executive power."
