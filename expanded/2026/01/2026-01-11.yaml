analytical_overview: >
  On January 11, Iran's government shut down Starlink access during an ongoing internet
  blackout as rights monitors verified more than 500 deaths in the protests, and a vehicle
  struck anti-government Iranian diaspora protesters in Los Angeles. In Syria, the SDF
  withdrew from Aleppo under a U.S.-brokered ceasefire. The Russia–Ukraine war continued
  with Russian drone and missile strikes on Ukraine's power grid and a Ukrainian drone
  attack on Voronezh.

  Sudan's government announced its return to Khartoum, Egypt signed US$1.8 billion in
  renewable-energy agreements with China and Norway, Myanmar held the second phase of its
  junta-run election and Benin voted for a new National Assembly. Disasters included
  bushfires in Victoria and New South Wales, a gas explosion at a wedding in Islamabad,
  avalanches in the French Alps and a fatal crash in Bolton; the Golden Globes and Poland's
  United Cup win marked the day in culture and sport.

