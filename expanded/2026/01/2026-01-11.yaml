    headline: "Four Killed in High-Speed Head-On Collision in Bolton, Greater Manchester"
    summary: >
      The local community in Bolton, Greater Manchester, was left devastated following a
      catastrophic head-on vehicular collision on Wigan Road that resulted in four
      fatalities and five hospitalizations during the early hours of January 11, 2026. At
      approximately 12:45 AM, a red Seat Leon carrying three teenagers—Mohammed Jibrael
      Mukhtar, Farhan Patel, and Mohammed Danyaal—collided violently with a Citroen C4
      Picasso driven by 54-year-old taxi driver Masrob Ali. The extreme force of the impact
      killed the drivers of both vehicles and two passengers in the Seat instantly,
      scattering heavy wreckage and debris across the residential roadway. Five additional
      passengers spanning both vehicles required immediate extraction and hospitalization; a
      29-year-old woman in the taxi sustained potentially life-threatening injuries, while
      two others suffered serious trauma. Greater Manchester Police’s Serious Collision
      Investigation Unit subsequently cordoned off the area, launching an urgent public
      appeal for dashcam and CCTV footage to reconstruct the exact dynamics of a crash that
      residents claim is emblematic of long-standing speeding issues on the corridor.
