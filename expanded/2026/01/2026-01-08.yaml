    importance: 7
    headline: "Russian strikes trigger major blackouts in Ukraine’s southeast as officials report deaths and injuries in Kryvyi Rih"
    summary: >
      Ukrainian authorities reported that Russian drone attacks caused near-total blackouts
      in parts of southeastern Ukraine, disrupting households, industry, and essential
      services during a cold snap. Reuters reported Volodymyr Zelenskiy said the attacks
      aimed to “break” Ukraine and warned, alongside the U.S. Embassy in Kyiv, of possible
      additional mass strikes. The same Reuters report said a Russian missile attack on
      Kryvyi Rih struck apartment buildings, killing one person and injuring 24 (including
      six children), while also detailing widespread damage—such as 29 apartment buildings
      damaged and tens of thousands without power in Kryvyi Rih—plus impacts on steel
      production and port infrastructure.
    key_data: []
    details:
      what_happened:
        - "Russian drone attacks plunged two southeastern regions into near-total blackout overnight, Reuters reported."
        - "A Russian missile attack hit apartment buildings in Kryvyi Rih, killing one and injuring 24 (including six children), Reuters reported."
        - "Reuters reported power was restored to nearly 700,000 households by Thursday evening, though 194,000 households remained without electricity (including in Kryvyi Rih)."
        - "Reuters reported 29 apartment buildings were damaged in Kryvyi Rih and more than 70,000 remained without power; it also reported temporary suspensions at major steel producers."
        - "Reuters reported Ukrainian leadership and the U.S. Embassy warned of a potentially significant new air attack “at any time over the next several days.”"
      why_it_matters:
        - "The strikes illustrate continued targeting of energy and urban infrastructure, compounding humanitarian risk amid winter conditions."
        - "Simultaneous warnings by Kyiv and the U.S. Embassy suggest heightened expectation of further large-scale attacks, affecting civilian behavior and critical services planning."
      uncertainty_notes: []
