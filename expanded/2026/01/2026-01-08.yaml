        - "Reuters reported Israel said the strikes followed a “failed rocket” attack by militants inside Gaza."
        - "Asharq Al-Awsat reported Israel said it struck a rocket launch site near Gaza City after identifying a failed launch, noting the projectile did not cross into Israeli territory."
        - "The Times of Israel reported Gaza civil defense claimed at least 13 killed, while stating IDF/Shin Bet confirmed the strikes in response to a “failed launch”—a figure that conflicts with Reuters’ “at least 11.”"
      why_it_matters:
        - "Divergent casualty reporting highlights the information fog during active conflict and underscores the need to track multiple source lines rather than “averaging” claims."
        - "Even a “failed launch” can trigger lethal escalation and undermine truce durability when broader negotiations are stalled."
