analytical_overview: >
  January 8 was shaped by the continuing consequences of U.S. actions: the United States
  moved to exit 66 international organizations including the UN climate framework, European
  officials weighed responses to U.S. statements about acquiring Greenland, and the U.S.
  Senate advanced a war-powers measure on Venezuela as the death toll from the Caracas raid
  rose to 100. In the Middle East, Syria's army captured Aleppo's Ashrafieh district before
  declaring a ceasefire with the Kurdish-led SDF, Yemeni government forces took Aden as the
  Southern Transitional Council collapsed, and Israeli strikes in Gaza killed at least 11
  people.

  Iran's protest movement widened, with a nationwide internet blackout, a general strike in
  Kurdish areas and clashes that killed a police officer in Malard. Other developments
  included Russian strikes that caused blackouts in southeastern Ukraine, a migrant-boat
  disaster off The Gambia with 39 dead, bushfires in Victoria and Patagonia, and France's
  decision to vote against the EU–Mercosur trade deal.

