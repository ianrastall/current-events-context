      U.S.-indicted tycoon—being escorted by armed police after extradition from Cambodia to
      China. Reuters also reported Cambodian authorities ordered liquidation of a bank Chen
      founded, linking the action to efforts to dismantle large-scale “scam centre” networks
      in Southeast Asia that the UN has said generate billions through online fraud. AP
      reported the extradition as a major international law enforcement development,
      detailing allegations in China and the U.S. about the scale and structure of the
      alleged criminal enterprise. Separately, the U.S. Department of Justice summarized the
      U.S. indictment against Chen.
