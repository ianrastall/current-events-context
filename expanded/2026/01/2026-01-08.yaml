  The day's reporting shows several conflicts moving at once: government offensives in
  Aleppo and Aden reshaped control on the ground, Iran's authorities cut internet access as
  protests spread, and the Venezuela raid continued to draw legislative scrutiny in
  Washington. U.S. withdrawal from multilateral bodies and the Greenland dispute strained
