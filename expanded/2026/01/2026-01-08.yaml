      what_happened:
        - "Reuters reported China said the export ban on dual-use items to Japan would only hit military end-users, with “civilian users” not affected."
        - "Reuters reported Japan’s vice foreign minister lodged a strong protest to China’s ambassador and demanded withdrawal of the measures."
        - "Japan’s foreign ministry press release stated it again “strongly protested” and demanded withdrawal of China’s export-control strengthening measures targeting dual-use items to Japan."
        - "China’s Ministry of Commerce spokesperson remarks (English posting) framed the tightening as linked to national security considerations and Japan’s Taiwan-related remarks (as described in the Q&A)."
      why_it_matters:
        - "Dual-use export controls can disrupt complex supply chains even when framed as “military-only,” especially when coverage (e.g., rare earth categories) is unclear."
