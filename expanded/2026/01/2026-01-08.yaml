  - id: "evt-2026-01-08-004"
    category: "Armed conflicts and attacks"
    subcategory: "War powers and military oversight"
    topics:
      - "Operation Southern Spear"
      - "2026 United States strikes in Venezuela"
      - "War powers and military oversight"
      - "United States"
      - "Venezuela"
    importance: 8
    headline: "US Senate advances war-powers curb on Venezuela action as Caracas reports 100 deaths in raid that seized Maduro"
    summary: >
      The United States Senate advanced a war-powers resolution aimed at preventing further
      U.S. military action against Venezuela without congressional authorization, in a rare
      rebuke of Donald Trump after U.S. forces captured Nicolas Maduro in a raid. Reuters
      reported the procedural vote was 52–47, with five Republicans joining Democrats. In
      parallel, Reuters reported Venezuela’s interior minister Diosdado Cabello said 100
      people died in the U.S. operation that removed Maduro from power; the same report said
      Venezuela’s army posted a list of 23 names of its dead, and that Cuba said 32 members
      of its military and intelligence services in Venezuela were killed.
    key_data: []
    details:
      what_happened:
        - "The U.S. Senate voted 52–47 to advance a war-powers resolution restricting further U.S. action in Venezuela absent congressional authorization, Reuters reported."
        - "Reuters reported the vote followed the capture of Maduro in a U.S. military raid in Caracas days earlier."
        - "Venezuela’s interior minister said 100 people died in the U.S. attack that removed Maduro from power, Reuters reported."
        - "Reuters reported Cabello also said Maduro’s wife Cilia Flores suffered a head injury and Maduro a leg injury during the raid."
        - "Reuters reported the war-powers measure faced major hurdles (House passage and likely veto override thresholds)."
      why_it_matters:
        - "It underscores an acute constitutional conflict over who controls escalation decisions after a major cross-border operation."
        - "The reported death toll and foreign fatalities raise the stakes for regional stability and the diplomatic fallout of the raid."
      uncertainty_notes: []
