    importance: 6
    headline: "Bushfires rage in Australia’s Victoria as authorities warn of “catastrophic” conditions and mass evacuations"
    summary: >
      Uncontrolled bushfires burned in Victoria amid extreme heat, prompting evacuation
      orders and warnings that Friday would bring “catastrophic” fire danger—the highest
      rating. Reuters reported two major fires near Longwood and Walwa, saying at least two
      structures were destroyed and that one fire generated its own weather system
      (pyrocumulonimbus) with lightning and thunder. Australia’s ABC reported emergency
      warnings and urged thousands in potential impact zones to leave immediately,
      describing multiple out-of-control blazes and escalating warning levels.
    key_data: []
    details:
      what_happened:
        - "Reuters reported two large bushfires near Longwood and Walwa, with evacuations ordered and a “catastrophic” rating forecast for Friday."
        - "Reuters reported the Longwood fire exceeded 25,000 hectares and at least two structures were destroyed; the Walwa fire was reported at 10,000 hectares and generated a pyrocumulonimbus cloud."
        - "ABC reported multiple emergency warnings remained in place for Longwood and Walwa, and urged immediate evacuation for thousands in potential impact zones."
        - "Reuters reported extensive preventive measures (total fire bans, school closures, train cancellations) as heat and wind were expected to worsen conditions."
      why_it_matters:
        - "“Catastrophic” fire danger updates can drive rapid population movement and strain emergency response capacity, especially when multiple large fires burn simultaneously."
        - "Fire-generated weather systems (pyrocumulonimbus) can create unpredictable, fast-escalating hazards including lightning and sudden wind changes."
