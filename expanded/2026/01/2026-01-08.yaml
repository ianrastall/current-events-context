    headline: "Syria declares Aleppo ceasefire after intensified clashes with Kurdish-led forces and mass displacement"
    summary: >
      Syria’s defense ministry declared a ceasefire in multiple Aleppo neighborhoods after
      days of heavy fighting between government troops and Kurdish fighters, as shelling and
      street combat triggered large-scale civilian flight. Reuters reported the clashes
      drove more than 140,000 people from their homes and left at least seven civilians
      dead, with evacuation windows and curfews announced around contested neighborhoods. A
      separate Reuters report from Ankara said Turkey stated it was ready to assist Syria if
      asked, while emphasizing the operation was conducted by the Syrian army without
      Turkish involvement.
    key_data: []
    details:
      what_happened:
        - "Syria’s defense ministry announced a ceasefire in the vicinity of Sheikh Maqsoud, Ashrafiyah, and Bani Zaid, Reuters reported, with an exit window for armed groups."
        - "Reuters reported fighting erupted earlier in the week and displaced more than 140,000 people, with at least seven civilians reported killed by Syrian authorities."
        - "Reuters reported the army issued evacuation windows and published maps of areas it said would be targeted, alongside curfew announcements."
        - "Turkey said it was ready to help Syria “if asked,” Reuters reported, while its defense ministry said the operation was “carried out entirely by the Syrian army.”"
      why_it_matters:
        - "The scale of displacement and reported civilian deaths indicate a rapid deterioration in urban security conditions in a major Syrian city."
