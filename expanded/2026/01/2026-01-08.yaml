    headline: "Iran reports nationwide internet blackout as protests continue amid economic crisis"
    summary: >
      Internet monitoring group NetBlocks reported a nationwide internet blackout in Iran as
      protests over economic hardship persisted. Reuters said witnesses described renewed
      street gatherings and anti-government slogans in major cities, while Iranian state
      media claimed calm. Al Jazeera separately reported NetBlocks’ assessment and linked
      the blackout to escalating protests amid a worsening economic crisis. CBS News, citing
      AP, framed the disruption as internet service being cut off or restricted as protests
      reached a potential tipping point.
