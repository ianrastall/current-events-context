    headline: "Death toll rises to 39 after migrant boat capsizes off Gambia, survivors describe “overcrowded and dilapidated” vessel"
    summary: >
      The death toll from a Europe-bound migrant boat tragedy off Gambia rose sharply, with
      Reuters reporting two government officials said 39 people died after a boat capsized
      off Gambia’s coast on New Year’s Eve; Reuters added survivors described the vessel as
      “overcrowded and dilapidated.” Earlier reporting captured lower confirmed tolls as
      search and rescue progressed: AFP dispatches (via BSS) reported at least 31 dead as of
      Jan. 6, while AP reported that after the capsize, at least seven bodies were recovered
      and more than 100 survivors were rescued.
    key_data: []
    details:
      what_happened:
        - "Reuters reported officials raised the confirmed death toll to 39 for the New Year’s Eve capsize, with the earlier official number having been significantly lower."
        - "Reuters reported survivors described the boat as “overcrowded and dilapidated.”"
        - "AFP (BSS) reported that as of Jan. 6 the government said at least 31 drowned, with “many others” missing feared dead."
        - "AP reported the boat carried more than 200 migrants and that at least 102 survivors had been rescued in the initial phase, with seven bodies recovered and dozens missing."
      why_it_matters:
        - "The rising toll over multiple days highlights how fatality counts in maritime disasters often increase as searches recover bodies across borders and currents."
        - "The incident underscores continued migration pressure on Atlantic routes and the risks of overloaded vessels."
