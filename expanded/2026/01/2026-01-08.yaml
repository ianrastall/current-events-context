    headline: "China says dual-use export ban to Japan targets military end-users as Tokyo lodges formal protest"
    summary: >
      Amid deteriorating China–Japan ties, Reuters reported China said its export ban on
      dual-use items to Japan would “only affect military firms,” with a commerce ministry
      spokesperson stating “civilian users will not be affected,” even as uncertainty
      persisted over whether rare earth elements were covered. Japan’s foreign ministry
      confirmed that Vice Minister Takehiro Funakoshi strongly protested and demanded
      withdrawal of China’s tightened export controls. China’s Ministry of Commerce also
      published a Q&A defending the rationale for tightened controls (as reflected in its
      English-language spokesperson remarks).
    key_data: []
