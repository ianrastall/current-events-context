    headline: "Ambush on a joint security patrol in Plateau State kills 20"
    summary: >
      The Kanam Development Association and Premium Times Nigeria reported that armed
      attackers ambushed a joint security patrol in Kanam, Plateau State, killing 20 people.
      The reports said the attackers later looted property and rustled cattle in Kyaram,
      while Governor Caleb Mutfwang condemned the attack and promised stronger security
      measures. Because the reviewed file relies on a civil-society group and local media
