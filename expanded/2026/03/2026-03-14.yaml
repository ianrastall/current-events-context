      Bonke had killed at least 102 people by March 14. The Ethiopian Human Rights
      Commission said 3,461 people had been displaced, showing that the disaster had widened
      well beyond the death toll first reported on March 12. Continued rain and unstable
      terrain complicated the search and recovery effort.
