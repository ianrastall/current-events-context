        - "Kuwait said three drones were intercepted and that other drones breached the perimeter."
        - "The Kuwaiti military reported three minor injuries at the air base."
        - "Local authorities cited by Associated Press said there were no casualties in the Fujairah fire."
      why_it_matters:
        - "The attacks showed that Gulf energy and military infrastructure remained exposed as the regional war widened."
        - "Damage in Fujairah and Kuwait added pressure to already strained shipping and infrastructure protection plans in the Gulf."
