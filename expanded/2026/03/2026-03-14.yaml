    summary: >
      Drone and missile attacks hit infrastructure in the United Arab Emirates and Kuwait on
      March 14. Associated Press live coverage reported that debris from a drone
      interception sparked a fire near Fujairah port, while the Kuwaiti Ministry of Defence
      said an attack on Ahmad al-Jaber Air Base injured three military personnel after some
      drones were intercepted and others breached the perimeter. The listed sources in this
      record support the impacts in the UAE and Kuwait more clearly than they establish
      direct attribution for both attacks.
