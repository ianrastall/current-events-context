strategic_conclusion: >
  March 14 brought further strikes on both sides of the Gulf: a deadly strike on an Isfahan
  factory, fires at Fujairah and drone attacks on U.S. and Kuwaiti air bases, alongside
  President Trump's appeal to allies to help reopen Hormuz and signs of Israel–Lebanon
  talks. The war's effects reached aviation and sport, from Oceania flight disruption to the
  cancellation of Gulf Formula One races, and anti-war protests spread in Spain and Italy.
  Separately, the Afghanistan–Pakistan border war, Ethiopia's landslide toll, an ambush in
  Plateau State and unrest in Cuba marked continuing crises elsewhere.

