    headline: "Russian flag returns to a Games podium at the Milano Cortina Paralympics"
    summary: >
      Russia's flag was raised on a Games podium for the first time in a decade on March 7
      after Russian athletes won bronze in the men's and women's standing downhill events at
      the Milano Cortina Paralympics. Reuters said the International Paralympic Committee's
      decision to lift the national-symbol ban for the Paralympics had already drawn
      criticism, and AP reported that Ukrainian athletes and officials saw the move as part
      of a broader push to restore Russian participation in global sport despite the war in
      Ukraine. The medals therefore carried significance beyond sport itself, reopening a
      contentious debate over sanctions, symbolism and wartime legitimacy.
    key_data: []
    details:
      what_happened:
        - "Varvara Voronchikhina and Aleksei Bugaev won bronze medals in the women's and men's downhill standing events."
        - "Reuters reported that this was the first time in a decade that the Russian flag had been raised on a Games podium."
        - "The IPC had kept the ban in place for the Winter Olympics but lifted it for the Paralympics."
        - "AP reported strong objections from Ukrainian athletes and officials."
      why_it_matters:
        - "The event became a symbolic test case for whether Russian national symbols are returning to major international sport."
        - "It sharpened tensions between sporting inclusion arguments and wartime sanction politics."
      uncertainty_notes:
        - "The broader consequences for Olympic or other federation policy remained unsettled."
