      been notified of suspected offences. Reuters reported that the vessel was initially
      treated as stateless after raising questions over its registration, and that Swedish
      officials said it had also appeared on a Ukrainian sanctions list. The case
      highlighted ongoing Baltic security sensitivities around shipping ownership, sanctions
      exposure and documentation fraud.
