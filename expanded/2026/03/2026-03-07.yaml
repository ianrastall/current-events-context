    importance: 6
    headline: "Russian missile and drone barrage kills at least 10 in Kharkiv"
    summary: >
      Russia launched a major overnight barrage of missiles and drones against Ukraine, with
      the deadliest strike hitting Kharkiv where at least 10 people, including two children,
      were killed when a missile hit a residential building. AP reported that 16 people were
      wounded in the Kharkiv strike, while Reuters said the broader assault also damaged
      energy, railway and port infrastructure in other parts of Ukraine. President Volodymyr
      Zelenskiy renewed calls for stronger Western air-defence support as civilian areas
      again bore the brunt of the attacks.
    key_data: []
    details:
      what_happened:
        - "A Russian missile struck a five-storey residential building in Kharkiv, killing at least 10 people including two children."
        - "AP reported that 16 people were wounded in the Kharkiv strike."
        - "Reuters said the wider overnight attack also damaged energy, rail and port infrastructure elsewhere in Ukraine."
        - "Zelenskiy responded by urging more air-defence help from allies."
      why_it_matters:
        - "The attack highlighted Russia's continuing ability to inflict mass civilian casualties far from the front line."
        - "Damage to infrastructure as well as housing increased both humanitarian and economic pressure on Ukraine."
      uncertainty_notes:
        - "Early death tolls from major strikes can rise as rescue work continues."
