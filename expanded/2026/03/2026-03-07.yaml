    headline: "Nepal's upstart Rastriya Swatantra Party surges toward a landslide"
    summary: >
      Early counting from Nepal's parliamentary election showed the Rastriya Swatantra Party
      (RSP), a young anti-establishment force associated with rapper-turned-politician
      Balendra Shah, heading toward a major breakthrough. Reuters reported that by March 6-7
      the party was leading in 100 of 137 seats counted and was on course for a majority in
      the 275-seat lower house, while AP described the RSP as leading the early results in
      Nepal's first national election since the 2025 uprising. Final certification was still
      pending, but the scale of the lead pointed to one of the sharpest democratic
      realignments in Nepal's post-monarchy era.
    key_data: []
    details:
      what_happened:
        - "Reuters reported that the RSP was leading in 100 of 137 seats counted and was on course to win a lower-house majority."
        - "AP reported that the party was leading the early results in the first national election since the 2025 uprising."
        - "Balendra Shah, a former rapper and Kathmandu mayor, was positioned as the party's prime ministerial candidate."
        - "The surge came at the expense of long-dominant parties including the Nepali Congress and the CPN-UML."
      why_it_matters:
        - "A strong RSP result could reduce Nepal's chronic coalition instability and reshape domestic governance."
        - "The result also showed how protest energy had translated into electoral change rather than only street mobilisation."
      uncertainty_notes:
        - "Final seat totals were not yet certified on March 7."
