        - "Reuters reported that one army captain and two soldiers were also killed."
        - "AP said the Katsina state government described the attackers as bandits seeking revenge after the failed theft."
      why_it_matters:
        - "The episode underscored the scale of organised armed violence in northwestern Nigeria outside the country's better-known northeastern insurgency theatre."
        - "Cattle-rustling violence continues to destabilise rural communities and strain state security forces."
      uncertainty_notes:
        - "The casualty and attacker figures were based on official accounts and were not independently verified."
