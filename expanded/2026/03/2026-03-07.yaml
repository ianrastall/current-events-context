    summary: >
      Nigerian authorities said on March 7 that the army had killed 45 armed attackers in
      clashes in Katsina state after a failed cattle-raiding attempt escalated into a larger
      confrontation. Reuters reported that an army captain and two soldiers were also
      killed, while AP said a Katsina official described the attackers as bandits who
      returned in large numbers after an earlier failed theft. The incident showed the
      continuing lethality of northwestern Nigeria's rural armed violence, where cattle
      raids, mass kidnappings and insurgent-style attacks often overlap.
    key_data: []
    details:
      what_happened:
        - "The clash occurred in Katsina state's Danmusa area after an attempted cattle theft on March 5 was followed by a larger return attack on March 6."
