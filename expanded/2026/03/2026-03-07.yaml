      swept away dozens of vehicles and disrupted flights at Jomo Kenyatta International
      Airport, according to Reuters. President William Ruto said emergency responders
      including soldiers had been deployed and that food from national reserves would be
      released for affected families. The flooding illustrated both the immediate urban
      vulnerability of Nairobi's river corridors and the wider pattern of increasingly
      destructive rain events across East Africa.
