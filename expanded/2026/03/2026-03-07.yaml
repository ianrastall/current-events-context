    importance: 5
    headline: "Rockets target U.S. embassy compound in Baghdad's Green Zone"
    summary: >
      Katyusha rockets struck near the U.S. embassy compound in Baghdad on March 7,
      including one that landed on a helipad, according to Iraqi security officials cited by
      Reuters and AP. No casualties were immediately reported, but caretaker Prime Minister
      Mohammed Shia al-Sudani called the attack a terrorist act by rogue groups and ordered
      security forces to pursue those responsible. The incident added to signs that the Iran
      war was spilling into Iraq, where American diplomatic and military sites remain
      exposed to indirect fire and proxy pressure.
    key_data: []
    details:
      what_happened:
        - "Reuters reported that Katyusha rockets targeted the U.S. embassy area in Baghdad's fortified Green Zone."
        - "AP reported that one missile landed on a helipad inside the compound."
        - "Iraqi caretaker Prime Minister Mohammed Shia al-Sudani ordered security agencies to pursue the perpetrators."
        - "No casualties were immediately reported by Iraqi security officials."
      why_it_matters:
        - "Even a limited strike on the Baghdad embassy compound signalled that Iraq remained vulnerable to spillover from the wider regional war."
        - "The attack carried diplomatic risk because it targeted one of the most sensitive U.S. facilities in Iraq."
      uncertainty_notes:
        - "The reporting did not establish a confirmed perpetrator at the time of publication."
