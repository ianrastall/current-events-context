        - "The Kremlin and Russian foreign ministry alleged British involvement because they said British-made Storm Shadow missiles were used in the Bryansk attack."
        - "Ukraine said it had struck the Kremniy El plant in Bryansk, which produces missile-related electronics and components."
      why_it_matters:
        - "The incidents showed both the continued vulnerability of Ukrainian cities to Russian drone attacks and Ukraine's capacity to hit military-industrial targets inside Russia."
        - "Russian allegations about Western-supplied missiles underlined the risk of broader confrontation around support to Ukraine."
      uncertainty_notes:
