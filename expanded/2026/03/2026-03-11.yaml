    importance: 7
    headline: "Norwegian police arrest three brothers over bombing at U.S. Embassy in Oslo"
    summary: >
      Norwegian police said on March 11 that they had arrested three brothers suspected of
      carrying out the March 8 bombing at the U.S. Embassy in Oslo, an attack investigators
      described as terrorism. Reuters reported that the blast from an improvised explosive
      device damaged the entrance to the embassy's consular section but caused no injuries,
      and police said the suspects were Norwegian citizens in their 20s. Investigators said
      they believed one man planted the bomb while the other two were complicit, and both
      Reuters and the Guardian reported that police were also examining whether the attack
      could have been ordered by a government entity. The arrests turned an otherwise
      isolated security incident into a wider counter-terrorism case with international
      implications because of the target and the tense global security environment.
    key_data: []
    details:
      what_happened:
        - "Police said three brothers had been apprehended over the bombing at the U.S. Embassy in Oslo."
        - "The March 8 blast damaged the entrance to the consular section but caused no injuries."
        - "Reuters reported police said one suspect likely planted the bomb and the other two were complicit."
        - "Investigators said they were still examining motive and whether any government entity had directed the attack."
      why_it_matters:
        - "The case involved a direct attack on a U.S. diplomatic facility in Europe during a period of heightened international tensions."
        - "Police comments about possible state direction raised the stakes well beyond an ordinary criminal bombing investigation."
      uncertainty_notes:
        - "As of March 11, motive and any foreign direction remained under investigation."
