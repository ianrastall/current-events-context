    headline: "Drone strikes hit rebel-held Goma and kill at least three, including a French UNICEF worker"
    summary: >
      Drone strikes hit Goma in eastern Democratic Republic of the Congo on March 11,
      killing at least three people including a French UNICEF worker, in what Reuters
      described as the first such attack on the city since AFC/M23 rebels seized it the
      previous year. Reuters and AP both reported that the attack struck a residence used by
      relief workers in a city already destabilized by the conflict between the Congolese
      state and M23. AFC/M23 blamed the Congolese army, while the army initially declined to
      comment and the government later said an investigation was under way, leaving
      responsibility contested. The killing of a humanitarian worker and the U.N. warning
      that attacks on U.N. personnel could amount to war crimes elevated the incident beyond
      a routine battlefield strike.
    key_data: []
    details:
      what_happened:
        - "Drone strikes hit Goma on March 11 and killed at least three people, including a French national working for UNICEF."
        - "Reuters reported it was the first such attack on Goma since AFC/M23 seized the city the previous year."
        - "AFC/M23 said the Congolese army launched drones into a densely populated urban area, while the army at first declined to comment."
        - "The U.N. peacekeeping mission confirmed a U.N. staff member and two other civilians were killed and warned the attack might amount to a war crime."
      why_it_matters:
        - "The attack showed the eastern Congo conflict penetrating an urban center already under rebel control, with civilians and aid personnel exposed."
        - "Because a humanitarian worker was killed, the incident drew international condemnation and heightened scrutiny of compliance with humanitarian law."
      uncertainty_notes:
        - "Responsibility for the strike was disputed on March 11 and remained under investigation."
