    importance: 7
    headline: "Europol-led Operation Custos Viridis reports 337 arrests in global environmental crime crackdown"
    summary: >
      Europol, joined by authorities from 71 countries and multiple international partners,
      announced the results of Operation Custos Viridis on March 11, describing a year-long
      crackdown on organized crime networks involved in waste trafficking and pollution
      crime. Europol, Reuters, and the U.S. Justice Department all reported 337 arrests,
      1,048 inspections, and large seizures including 127,149 tons of waste, 398 tons of
      fluorinated gases, 2.3 tons of mercury, and millions in cash and bank assets. The
      operation targeted criminal flows stretching from Europe into Africa, Asia, and Latin
      America and linked environmental crime to money laundering, corruption, and other
      transnational offences. The scale of the operation made it one of the most substantial
      coordinated law-enforcement actions of the day outside war zones.
    key_data: []
    details:
      what_happened:
        - "Europol said Operation Custos Viridis ran between January and December 2025 and was led with partners from 71 countries and international organizations."
        - "Authorities conducted 1,048 inspections and arrested 337 individuals connected to waste and pollution crime."
        - "Seizures included 127,149 tons of waste, 602 tons of polluting agents, 398 tons of F-gases, 75 tons of plant protection products, and 2.3 tons of mercury."
        - "DOJ said the operation also recovered over $10 million in cash and bank accounts, along with vehicles, heavy machinery, firearms, apartments, and companies."
      why_it_matters:
        - "The results illustrated the scale and profitability of environmental crime networks operating across continents."
        - "The operation showed that waste trafficking and pollution offences are increasingly treated as organized crime rather than regulatory infractions."
      uncertainty_notes:
        - "Reuters described the arrests as more than 330 across 70 countries, while Europol and DOJ detailed 337 arrests with partners from 71 countries and organizations."
