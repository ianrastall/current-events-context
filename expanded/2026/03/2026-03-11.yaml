    headline: "Russia and Ukraine trade deadly strikes in Kharkiv and Bryansk as long-range attacks continue"
    summary: >
      Russia and Ukraine traded deadly strikes around the war zone and across the border on
      March 11. In Kharkiv, Reuters reported that a Russian drone hit a civilian business,
      killing two people and injuring five. In Russia, officials said the toll from
      Ukraine's March 10 strike on Bryansk rose to seven dead and more than 40 injured,
      while the Kremlin and foreign ministry accused Britain of involvement because Moscow
      said British-supplied Storm Shadow missiles were used. Ukraine said it had targeted
      the Kremniy El plant, a key producer of missile components, illustrating Kyiv's
      continued effort to strike Russia's military-industrial base even as Moscow portrayed
      the attack as a deliberate assault on civilians.
