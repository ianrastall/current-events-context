    importance: 7
    headline: "Spain permanently withdraws its ambassador from Israel as bilateral rift deepens"
    summary: >
      Spain permanently withdrew its ambassador from Israel on March 11, formalizing a
      diplomatic downgrade that Reuters said was driven by Spain's opposition to the
      U.S.-Israeli strikes on Iran and by longer-running disputes over Gaza and arms
      transit. Reuters reported that Madrid published the termination of the ambassador's
      post in the official gazette and said the embassy in Tel Aviv would be led by a chargé
      d'affaires for the foreseeable future. The move came after the ambassador had already
      been recalled in September and reflected the steady deterioration of Spain-Israel ties
      since Spain recognized a Palestinian state and restricted transit of arms to Israel.
      The decision gave Europe another concrete sign that the widening Middle East war was
      producing direct diplomatic fractures among U.S. partners.
    key_data: []
    details:
      what_happened:
