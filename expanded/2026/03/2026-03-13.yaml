      February 25 meeting in St. Kitts involved U.S. Secretary of State Marco Rubio and Raúl
      Guillermo Rodríguez Castro, while Cuba faced severe fuel shortages, electricity
      instability, and a broader economic emergency. The confirmation signaled that even
      amid a hard U.S. line toward Cuba, both sides were maintaining contact as the island's
      crisis intensified.
