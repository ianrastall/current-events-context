strategic_conclusion: >
  The day's events show the United States expanding its military posture and threatening
  Iran's oil infrastructure while Gulf producers cut output under attack, deepening the
  energy shock. Regional bodies including ASEAN pressed for a ceasefire. Parallel conflicts
  in Afghanistan–Pakistan, Sudan and Nigeria continued to cause civilian and security-force
  deaths, and U.S. diplomacy in the Americas advanced on separate tracks with Cuba and El
  Salvador.

