analytical_overview: >
  On March 13, 2026, the United States said it had struck military targets on Iran's Kharg
  Island and warned that oil sites could be next, and U.S. officials announced a
  5,000-strong marine expeditionary unit for the Persian Gulf. All six crew of a U.S. Air
  Force KC-135 tanker that crashed over Iraq were confirmed dead. Iranian missiles injured
  at least 58 people in northern Israel and a missile was intercepted over Turkey, while an
  Israeli strike on a Lebanese medical facility killed 12 medical staff. Saudi Arabia cut
  oil production by 20% after shutting two offshore fields, and ASEAN foreign ministers
  called for an immediate halt to the fighting.

  Outside the Middle East, Pakistani airstrikes in Afghanistan killed civilians near
  Kandahar and Kabul, a drone strike on a market on the Sudan–Chad border killed 11, and an
  ambush in Nigeria's Plateau State killed 20 security personnel. Cuba confirmed talks with
  the United States amid blackouts, El Salvador and the United States signed a nuclear
  cooperation agreement, Switzerland's Federal Council adopted the Bilaterals III package
  with the EU, and floods widened emergencies in Peru and Ecuador.

