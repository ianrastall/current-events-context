    headline: "Australia releases petrol and diesel from domestic reserves and loosens fuel rules amid supply shock fears"
    summary: >
      Australia announced emergency fuel measures on March 13, 2026, including the release
      of petrol and diesel from domestic reserves, as officials sought to counter disruption
      and localized shortages linked to the Middle East war. Reuters reported that up to 762
      million litres, roughly 20% of the minimum stockholding obligation for petrol and
      diesel, would be made available, while the government also temporarily eased fuel
      quality standards to boost usable supply. The measures highlighted Australia's
      dependence on imported fuel and the pressure on regional supply chains.
    key_data: []
    details:
      what_happened:
        - "Energy Minister Chris Bowen said Australia would release up to 762 million litres of petrol and diesel from domestic reserves."
        - "Reuters reported that the release was aimed at easing shortages and supply-chain disruption, especially in regional areas."
        - "Reuters also reported that Australia would temporarily relax fuel quality standards to increase available supply."
        - "Official government material said the fuel would be targeted toward localized market disruption and would take time to move through the supply chain."
      why_it_matters:
        - "The move showed how quickly a distant war was affecting fuel security planning in Oceania."
        - "Australia's need to draw on reserves underscored its reliance on imported fuel and its persistent shortfall versus the IEA's 90-day stockholding benchmark."
