    headline: "All six U.S. service members aboard a KC-135 die in crash over Iraq"
    summary: >
      On March 13, 2026, the U.S. military said all six service members aboard a KC-135
      Stratotanker that crashed in western Iraq had died. Reuters and AP reported that the
      aircraft went down during operations connected to the regional war with Iran, while a
      second tanker landed safely. U.S. officials said there was no evidence of hostile or
      friendly fire, leaving the cause under investigation.
    key_data: []
    details:
      what_happened:
        - "The aircraft crashed in western Iraq and the U.S. military confirmed on March 13 that all six service members on board were dead."
        - "A second tanker involved in the same mission landed safely, according to U.S. officials cited by Reuters and AP."
        - "U.S. officials said the crash was not the result of hostile fire or friendly fire."
        - "The dead included Air National Guard personnel and active-duty service members, according to AP's identification of the victims."
      why_it_matters:
        - "The crash added a major non-combat loss to U.S. operations in the region during an already expanding conflict."
        - "The finding that there was no indication of hostile fire narrowed the initial possibilities but kept scrutiny on mechanical, operational, and mission-planning factors."
        - "The accident highlighted the strain on long-range refueling and logistics missions supporting military operations across the Middle East."
      uncertainty_notes:
        - "The cause of the crash remained under investigation on March 13."
