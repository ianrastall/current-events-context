    importance: 8
    headline: "Israel signals “second phase” targeting Iran’s underground missile sites as air campaign intensifies"
    summary: >
      Israeli officials and sources familiar with operational planning said on March 5 that
      Israel’s campaign in Iran was moving into a “second phase,” shifting from above-ground
      launchers toward ballistic-missile facilities buried deep underground—targets that are
      harder to locate, harder to damage, and typically central to Iran’s retaliatory
      capacity. Reuters reported that Israel’s air force stated it struck an underground
      infrastructure site used for storing ballistic missiles and missiles intended for
      aircraft, and that underground strike announcements had not featured prominently in
      earlier public statements. Parallel reporting described intense, near-continuous
      sorties and broader claims that Iran’s air defenses and missile launchers had been
      heavily degraded, even as analysts differed on how large Iran’s remaining missile
      stock might be—an uncertainty that could shape escalation, duration, and negotiation
      dynamics.
    key_data: []
    details:
      what_happened:
        - "Reuters reported Israel’s Iran campaign was “entering a second phase,” with fighter jets planned to attack underground bunkers storing ballistic missiles and related equipment."
        - "Israel’s military said it struck an underground infrastructure site used to store ballistic missiles and storage sites for missiles intended for use against aircraft."
        - "The same Reuters report noted Israel said it had already hit hundreds of Iranian missile launchers above ground, while analysts’ estimates of Iran’s pre-war stockpile varied widely."
        - "Separate reporting noted Israeli claims that strikes had destroyed “most” of Iran’s air defenses and missile launchers, as U.S.-Israeli pressure on Tehran continued."
      why_it_matters:
        - "Striking underground missile infrastructure typically signals escalation into more complex, resource-intensive targeting—often associated with longer campaigns and higher uncertainty in outcomes."
        - "Iran’s residual missile capacity is a key variable for regional spillover risk and for any future de-escalation bargaining leverage."
      uncertainty_notes: []
