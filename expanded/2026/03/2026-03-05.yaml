    importance: 8
    headline: "Iranian missiles and drones hit Gulf-region targets as Bahrain reports large-scale interceptions"
    summary: >
      As the U.S.–Israel war on Iran entered its sixth day, Gulf states reported continued
      missile and drone activity on March 5, reflecting how quickly the conflict’s
      operational footprint had expanded beyond Iran and Israel into airspace and
      infrastructure across the region. The Bahrain Defence Force said its air defenses had
      continued intercepting “successive waves” of attacks and reported cumulative
      interception totals since the onset of Iranian strikes. In Iraq, local reporting cited
      by Al Jazeera described a drone intercepted near a U.S. military base in the Baghdad
      airport area, while explosions were reported in Doha amid ongoing air defense
      activity. The combined picture underscored a sustained regional air-defense stress
      test—one with civilian safety implications (warnings, shelter guidance, debris risk)
      and strategic implications (deterrence signaling, pressure on U.S. basing posture, and
      potential involvement of more states).
    key_data: []
    details:
      what_happened:
        - "The Bahrain Defence Force reported that, since the onset of attacks, it had destroyed 74 missiles and 117 drones targeting Bahrain’s airspace, territorial waters, and land."
        - "Bahrain’s military leadership urged residents to remain indoors except when necessary and to rely on official information channels."
        - "Al Jazeera reported that Iraqi forces shot down a drone that attempted to attack a U.S. base near Baghdad International Airport (Victoria airbase), according to local media reports."
        - "Al Jazeera also reported loud explosions in Doha amid wider regional drone/missile activity and air-defense operations."
      why_it_matters:
        - "Sustained cross-border drone/missile activity increases the probability of civilian casualties from debris or misfires and can force disruptive civil-defense measures (shelter orders, flight interruptions)."
        - "Regional targeting raises escalation risks by pressuring host nations and potentially widening the set of direct belligerents."
      uncertainty_notes: []
