    importance: 7
    headline: "U.S. House rejects war-powers measure on Iran as Trump signals role in leadership succession"
    summary: >
      On March 5, the U.S. House of Representatives voted down a resolution that would have
      directed the president to remove U.S. forces from “unauthorized hostilities” in Iran,
      effectively signaling that a narrow majority was not prepared to use the War Powers
      framework to constrain the expanding air campaign. The vote came on the conflict’s
      sixth day and followed similar congressional debate in the Senate the day before,
      while U.S. officials simultaneously emphasized that operations were limited and
      nearing completion. In parallel, Donald Trump told Reuters he believed the United
      States “must be involved” in choosing Iran’s next leader after the Supreme Leader’s
      death at the outset of the war—remarks that intensified scrutiny over the
      administration’s strategy, aims, and end-state.
    key_data: []
    details:
      what_happened:
        - "The House voted 219–212 to reject a resolution directing the president (under War Powers procedures) to end “unauthorized hostilities” involving Iran."
        - "Reuters reported the vote largely followed party lines, with a small number of cross-overs on each side."
        - "The official House roll-call record identified the measure as H. Con. Res. 38 and showed it failed."
        - "Trump told Reuters the U.S. “must be involved” in selecting Iran’s next leader and encouraged Iranian Kurdish forces based in Iraq to consider offensive action."
      why_it_matters:
        - "The vote reinforced executive latitude in the opening phase of a major overseas conflict, leaving oversight to later votes, funding leverage, or litigation."
        - "Trump’s leadership-succession comments amplified concerns that the war’s objectives could extend beyond military targets to political change."
      uncertainty_notes: []
