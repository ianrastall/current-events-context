    importance: 5
    headline: "South Africa launches push for domestic production of Gilead’s long-acting HIV prevention drug"
    summary: >
      South Africa moved on March 5 to accelerate access to a long-acting HIV prevention
      medicine by seeking domestic manufacturing pathways and initiating a process to
      identify qualified local producers. Reuters reported the government was working with
      global health partners to identify a manufacturer and to pursue an agreement with
      Gilead Sciences concerning lenacapavir, a twice-yearly injectable HIV prevention drug,
      in a country with one of the world’s largest HIV burdens. On the same day, Unitaid
      announced that the South African government—working with partners including the United
      States Pharmacopeia—had published a call for expressions of interest to identify South
      African pharmaceutical manufacturers capable of producing quality-assured lenacapavir,
      framing the initiative as a pathway to strengthen supply resilience and regional
      manufacturing capacity.
    key_data: []
    details:
      what_happened:
        - "Reuters reported South Africa sought local production of Gilead’s long-acting HIV prevention drug and was working with partners to identify a domestic manufacturer."
        - "Unitaid reported South Africa published a call for expressions of interest to identify local manufacturers capable of producing quality-assured lenacapavir."
        - "Reuters reported the initiative followed controversy over earlier licensing arrangements that did not include South African manufacturers, with Gilead indicating openness to further licensing if standards are met."
        - "Unitaid described the effort as strengthening regional manufacturing and supply resilience, with technical/market support from Unitaid and USP."
      why_it_matters:
        - "Expanding local manufacturing for high-impact HIV prevention tools can improve affordability, reliability of supply, and speed of deployment in high-burden settings."
        - "The move reflects broader post-pandemic push for regional pharmaceutical production capacity rather than dependency on distant supply chains."
