analytical_overview: >
  On March 5, 2026, the first week of the Iran war continued to spread across the region.
  Iranian missiles and drones targeted Bahrain, Qatar, the UAE and Azerbaijan's Nakhchivan
  airport, most of them intercepted, while Israel signalled a second phase aimed at Iran's
  underground missile sites and ordered the evacuation of Beirut's Dahieh suburb. Iran's
  foreign minister said Tehran was not seeking a ceasefire or talks, and in Washington the
  House rejected a war-powers measure on Iran. European states sent naval assets to protect
  Cyprus, NATO raised its missile-defence posture, and Lebanon banned IRGC activity on its
  territory.

  The war's economic effects spread through oil and jet-fuel markets as Hormuz traffic was
  disrupted, with China reportedly seeking safe passage for tankers and South Korea
  activating a ₩100 trillion stabilization fund. Outside the Middle East, Russia and Ukraine
  exchanged 200 prisoners each, Nepal voted in its first election since the Gen Z protests,
  Kosovo's parliament failed to elect a president, the United States and Venezuela agreed to
  restore relations, and President Trump dismissed Homeland Security Secretary Kristi Noem.

