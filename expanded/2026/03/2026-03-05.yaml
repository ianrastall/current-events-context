    importance: 7
    headline: "Oil and jet-fuel prices spike as Strait-of-Hormuz disruption cascades into supply cuts and shipping reroutes"
    summary: >
      Energy markets reacted sharply on March 5 as the war’s impact on shipping and
      production in the Gulf region translated into price spikes and concrete supply
      disruptions. Reuters reported that U.S. crude futures rose faster than Brent, with WTI
      settling up 8.51% to $81.01 and Brent up 4.93% to $85.41, amid growing concern that
      the Strait of Hormuz had effectively stalled and that restarting production and
      shipping would take time even if traffic resumed. Reuters also reported Iraq cut
      nearly 1.5 million barrels per day because storage was filling without tanker
      liftings, while Qatar halted LNG output due to shipping paralysis—developments that
      propagated into refined products. In Asia, a Reuters commodities column highlighted
      jet-fuel stress: Singapore jet fuel prices surged dramatically and margins signaled
      looming shortages. Separately, Reuters reported LPG tankers redirected from Middle
      East load plans toward U.S. terminals, illustrating rapid re-optimization of supply
      chains under threat.
    key_data: []
    details:
      what_happened:
        - "Reuters reported WTI settled up 8.51% to $81.01 and Brent up 4.93% to $85.41 on supply fears and the widening Iran conflict."
        - "Reuters reported Iraq cut nearly 1.5 million bpd as storage filled amid tanker paralysis, while Qatar shut down LNG output for similar shipping reasons."
        - "Reuters reported U.S. diesel futures jumped about 10%, and ship-tracking data showed roughly 300 tankers remaining inside Hormuz amid near-halted traffic."
        - "Reuters reported Singapore jet-fuel prices surged, alongside reports of operational changes and export constraints affecting Asian refiners and fuel markets."
        - "Reuters reported LPG tankers originally positioned to load in the Middle East redirected to the U.S., with Qatar declaring force majeure on gas exports in the same period."
      why_it_matters:
        - "A Gulf shipping stoppage is a systemic supply shock that can rapidly become an inflation driver—especially via diesel and jet fuel with tighter inventories."
        - "Supply cuts driven by storage constraints can outlast any near-term reopening of shipping lanes, delaying normalization across global trade flows."
      uncertainty_notes: []
