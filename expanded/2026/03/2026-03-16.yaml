        - "AP reported Afghan officials claimed at least 400 killed and around 250 injured in an airstrike on a drug rehabilitation hospital, while noting Pakistan’s denial and competing account of “precise” military strikes."
      why_it_matters:
        - "A direct Pakistan–Afghanistan escalation risks broad regional destabilization, cross-border retaliation, and humanitarian catastrophe if civilian facilities are repeatedly hit."
        - "Disputed casualty reporting and attribution can fuel misinformation, harden political positions, and impede third-party mediation."
      uncertainty_notes:
        - "Afghanistan's Taliban government claims more than 400 people were killed at the Kabul rehabilitation centre; Pakistan denies striking it and says it hit military targets. The toll is disputed and is not recorded as a casualty figure here."
