    headline: "Pakistan strikes Kabul; Taliban says rehab hospital hit, Pakistan says it targeted military and “terrorist support” infrastructure"
    summary: >
      Reuters reported that Afghanistan’s Taliban administration said a Pakistani airstrike
      hit a drug rehabilitation hospital in Kabul on March 16, while Pakistan rejected the
      allegation and stated it had targeted “military installations” and “terrorist support
      infrastructure” in Kabul and Nangarhar. In same-day AP reporting, Afghan officials
      alleged mass casualties at a drug rehab hospital (figures reported in the hundreds),
      which Pakistan denied—illustrating a rapid escalation paired with sharply contested
      narratives and significant uncertainty about independently verified casualty totals at
      the time.
    key_data: []
    details:
      what_happened:
        - "Reuters quoted a Taliban spokesperson saying a Pakistani airstrike hit a drug rehabilitation hospital in Kabul, with “an unspecified number” killed or wounded in that initial report."
