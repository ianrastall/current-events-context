    details:
      what_happened:
        - "Two unidentified assailants on a motorcycle threw acid at Andrie Yunus on March 12; police said an investigation is underway, including review of CCTV."
        - "Reuters reported Andrie suffered burns to 24% of his face and arms and was attacked after recording a podcast episode on military expansion in civilian affairs."
        - "Reuters reported condemnation from civil-society groups and international rights actors; UN human rights chief Volker Turk called the attack “horrific” and urged accountability (as reported by Reuters)."
      why_it_matters:
        - "Attacks against rights defenders can chill public debate and signal tolerance of intimidation amid contentious civil-military governance questions."
        - "The incident may influence domestic and international assessments of human-rights commitments under President Prabowo Subianto, as referenced in Reuters reporting."
      uncertainty_notes: []
