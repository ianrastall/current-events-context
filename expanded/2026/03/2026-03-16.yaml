    headline: "Indonesia investigates acid attack on activist amid rising condemnation"
    summary: >
      Indonesian police said they were investigating an acid attack on activist Andrie
      Yunus, described by Reuters as known for opposing an expanded military role in
      civilian affairs. Reuters reported Andrie suffered burns to 24% of his face and arms
      and that more than 170 civil society groups and international rights organizations
      condemned the attack and framed it as intimidation. Reuters also reported the UN human
      rights chief criticized the attack and called for accountability, while Indonesian
      officials and a parliamentary commission connected the incident to broader concerns
      about democratic backsliding.
