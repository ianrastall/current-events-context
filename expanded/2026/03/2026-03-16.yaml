strategic_conclusion: >
  The day showed allies reluctant to join a naval effort in Hormuz even as the blockade
  squeezed Gulf exports and forced conservation measures across Asia. Strikes spread across
  Iraq and Lebanon, and the Afghanistan–Pakistan conflict reached Kabul with a disputed
  mass-casualty claim. Cuba's grid collapse and new openings for diaspora investment pointed
  to an acute economic emergency on the island.

