    importance: 7
    headline: "Allies warn against a major Israeli ground offensive in Lebanon as displacement rises"
    summary: >
      Several Western governments issued a joint warning that a “significant Israeli ground
      offensive” in Lebanon should be averted, citing already alarming displacement and
      humanitarian conditions. In parallel, Israeli officials publicly warned that displaced
      Lebanese would not return until Israel assessed that border-area Israeli communities
      were safe, while describing current operations as limited and targeted but expanding
      into new locations. The reporting also referenced heightened lethality in the
      Israel–Hezbollah confrontation since early March, with claims of large-scale
      displacement in Lebanon and significant Hezbollah fighter losses.
    key_data: []
    details:
      what_happened:
        - "Canada, France, Germany, Italy and United Kingdom issued a joint statement urging immediate de-escalation and warning of devastating humanitarian consequences if a major ground offensive proceeds."
        - "Israel said ground forces were operating in “new locations” in southern Lebanon and framed the latest push as “limited and targeted.”"
        - "Israeli officials warned Lebanese displaced by the campaign could not return until Israel considered Israeli border communities safe; Reuters cited displacement in Lebanon exceeding one million."
        - "Reuters reported Israel’s military chief said strikes on Iran were affecting Hezbollah’s ability to arm and fund itself; Reuters also relayed a claim that more than 400 Hezbollah fighters had been killed since March 2."
      why_it_matters:
        - "A major ground offensive could sharply expand civilian harm and displacement and intensify regional spillover dynamics amid wider Middle East war pressures."
        - "Coordinated allied statements signal heightened diplomatic pressure and could shape aid, sanctions, or mediation efforts."
      uncertainty_notes: []
