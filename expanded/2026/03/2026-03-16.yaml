    importance: 6
    headline: "Russia reports large Ukrainian drone waves toward Moscow amid continued long-range strikes"
    summary: >
      Russian authorities reported intercepting large numbers of Ukrainian drones targeting
      Moscow and other regions, describing the wave as among the biggest attempted attacks
      on the capital in at least a year. Statements from the Moscow mayor and Russia’s
      defense ministry provided tally updates over the day, while Reuters reporting noted
      temporary flight restrictions at major airports over the weekend. Ukraine did not
      immediately comment in the cited reporting, and no casualties were reported in the
      Moscow area in these updates.
    key_data: []
    details:
      what_happened:
        - "Russia said it shot down about 250 Ukrainian drones approaching Moscow over the prior two days, calling it the biggest attempted attack on the capital in at least a year."
        - "On March 16, Moscow’s mayor said at least 67 additional drones were downed heading toward Moscow, and Russia’s defense ministry published a separate multi-region tally including drones “targeting Moscow.”"
        - "Russian aviation authorities imposed and later lifted flight restrictions at Moscow’s main airports during the weekend attack period, according to Reuters reporting."
      why_it_matters:
        - "Persistent drone pressure on major cities strains air defenses, aviation operations, and civilian confidence, even without confirmed casualties."
        - "Escalating drone exchange reinforces the war’s adaptation cycle and raises risks of spillover impacts on regional infrastructure and transport."
      uncertainty_notes: []
