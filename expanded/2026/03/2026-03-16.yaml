analytical_overview: >
  On March 16, 2026, disruption in the Strait of Hormuz deepened, with Gulf oil exports
  falling sharply and several NATO allies and Australia declining to send warships to break
  the blockade, while a Pakistan-bound tanker was allowed through. Iranian drones struck the
  UAE, killing one person in Abu Dhabi and briefly closing Dubai's airport; Israel destroyed
  Iran's Space Research Center in Tehran; and drones and airstrikes hit Baghdad, including
  the U.S. embassy and a Kata'ib Hezbollah commander. Western governments warned against a
  major Israeli ground offensive in Lebanon as Israel's 91st Division began operations
  there.

  In South Asia, Pakistan struck Kabul, where the Taliban said a drug rehabilitation
  hospital was hit. Suicide bombings in Maiduguri killed at least 23, Russia launched a
  daytime drone attack on Kyiv, and Cuba's power grid collapsed as President Trump escalated
  his rhetoric. Other developments included a hospital fire in Cuttack, EU sanctions on
  Russian and Iranian officials, Kazakhstan's constitutional referendum result, and
  fuel-saving measures in Sri Lanka and Vietnam.

