    summary: >
      A federal appeals court lifted a lower-court order that had invalidated a Trump
      administration policy allowing rapid deportation of migrants to countries other than
      their own without a dedicated opportunity to raise safety concerns specific to that
      destination, according to Reuters. Reporting described the policy’s
      mechanics—including notice as short as six hours under certain conditions—while noting
      the appellate court’s plan for expedited briefing and argument. Advocates for
      plaintiffs framed the decision as delaying restoration of statutory and due process
      protections, while the administration argued it must be able to remove migrants to
      countries willing to accept them.
