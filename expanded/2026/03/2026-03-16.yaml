      as jet-fuel supply risks rose after China and Thailand halted exports of refined
      products including jet fuel amid the Iran-war-driven energy shock, according to
      Reuters. The documents Reuters reviewed indicated Vietnam imports over two-thirds of
      its jet fuel and relies heavily on China and Thailand, while importers signaled they
      could only guarantee supplies through March. Vietnam’s government and diplomatic
      channels were described as seeking assistance and exploring alternative suppliers,
      though Reuters reported officials considered new sourcing difficult in the current
      environment.
    key_data: []
