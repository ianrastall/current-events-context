    importance: 8
    headline: "Strait of Hormuz disruption deepens as Gulf oil exports plunge and diplomacy scrambles for mitigation"
    summary: >
      Shipping and energy markets remained heavily disrupted as the Strait of Hormuz stayed
      “mostly closed” in the context of the U.S.-Iran war. Shipping-data-based estimates
      indicated Gulf oil exports fell dramatically versus February, while floating storage
      rose sharply—signaling logistical bottlenecks as cargoes could not move normally.
      Politically, Washington pressed partners to help police or clear the waterway, while
      European leaders explored diplomatic and naval-mandate options rather than joining a
      U.S.-led escort effort, highlighting a widening gap between U.S. requests and allied
      appetite for direct military participation.
    key_data: []
    details:
      what_happened:
        - "Shipping data (Kpler) showed exports from eight Gulf countries averaged ~9.71 million bpd in the week to March 15, down from ~25.13 million bpd in February; Vortexa data suggested an even larger drop."
        - "Analysts cited rising floating storage (above ~50 million barrels) and continuing disruptions—including reported drone-related impacts on loadings around Fujairah—as key constraints on normal export flows."
        - "Donald Trump reiterated calls for countries to help police the strait and complained some were “not very enthusiastic,” while naming allied reluctance as a political problem amid rising oil prices."
        - "European Union foreign-policy chief Kaja Kallas said she discussed with Antonio Guterres whether a “Black Sea Initiative”-style framework could help protect civilian shipping and unblock energy transport, and whether the EU naval mission’s mandate might be adapted."
        - "Friedrich Merz said Germany would not participate militarily, citing lack of UN/EU/NATO mandate under Germany’s Basic Law."
      why_it_matters:
        - "The Strait of Hormuz is a major global energy artery; sustained disruption quickly transmits into oil, LNG, shipping insurance, and broader inflation expectations."
        - "Divergent allied responses complicate coalition-building and may lengthen uncertainty for global trade routes and energy security planning."
      uncertainty_notes: []
