    headline: "UN Security Council extends UNAMA for only three months after U.S. review call"
    summary: >
      The UN Security Council voted to extend the mandate of the United Nations Assistance
      Mission in Afghanistan (UNAMA) for a shorter three-month period rather than its
      typical annual renewal, following U.S. calls for a review of aid and engagement in
      Taliban-ruled Afghanistan. Reuters reported U.S. criticism of Taliban obstruction and
      restrictions on women’s rights, while UN materials confirmed the adoption of a
      resolution extending the mandate through mid-June. The shortened extension was framed
      as time for serious discussions on potential mandate adjustments.
    key_data: []
    details:
      what_happened:
        - "The Security Council extended UNAMA’s mandate for three months, rather than the usual one-year renewal, Reuters reported."
        - "Reuters reported the U.S. called for a review of assistance and engagement, citing budget concerns, Taliban obstruction, detention of Americans, and restrictions on women’s rights."
        - "UN press materials reported unanimous adoption of a resolution extending the mandate until June 17, 2026 (as specified in the UN press release), aligning with the “three months” framing."
