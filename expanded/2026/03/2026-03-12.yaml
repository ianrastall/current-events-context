    importance: 7
    headline: "Landslides in southern Ethiopia kill at least 70 people and leave more missing"
    summary: >
      Deadly landslides in Ethiopia's southern Gamo Zone emerged as one of the day's major
      disaster stories, with Reuters reporting on March 12 that at least 70 people had died
      after days of heavy rain and that additional people were still missing. Associated
      Press separately reported at least 50 deaths and 125 missing earlier in the day,
      naming Gacho Baba, Kamba and Bonke districts as the main affected areas. The differing
      counts reflected a fast-moving rescue and recovery operation in which bodies were
      still being recovered from mud and debris. The disaster highlighted the severe
      vulnerability of parts of southern Ethiopia to rain-triggered slope failures and the
      likelihood that the toll would continue to change.
    key_data: []
    details:
      what_happened:
        - "Landslides struck multiple districts in the Gamo Zone after about a week of intense rainfall."
        - "Reuters reported at least 70 dead, while AP earlier reported at least 50 dead and 125 missing."
        - "The affected districts named in reporting included Gacho Baba, Kamba and Bonke."
        - "Local officials said at least one person was pulled alive from the mud during rescue operations."
        - "Regional authorities urged residents in vulnerable highland and flood-prone areas to move to safer ground."
      why_it_matters:
        - "The death toll made the landslides one of the most serious natural-disaster events of the day globally."
        - "Continuing rain raised the risk of additional slope failures and complicated rescue efforts."
      uncertainty_notes:
        - "Fatality and missing-person counts differed across reports as the situation evolved through the day."
        - "The Wikipedia portal bullet reports 102 killed; the deep-research report records 70."
