    headline: "ASEAN schedules emergency ministerial discussions on the Middle East crisis and its economic fallout"
    summary: >
      Southeast Asian governments moved to coordinate on March 12 as ASEAN officials
      announced that the Middle East crisis would dominate ministerial discussions the
      following day. Reuters and Channel News Asia reported that the Philippines, as ASEAN
      chair, prepared an economic ministers' retreat and a special virtual foreign
      ministers' meeting focused on surging oil prices, shipping disruptions and the wider
      trade and logistics consequences of the war. The announcement itself was significant
      because it showed how quickly a conflict centered in the Gulf had become a region-wide
      economic concern in Southeast Asia. It also highlighted ASEAN's dependence on maritime
      trade and imported energy.
    key_data: []
    details:
      what_happened:
        - "ASEAN officials said the March 13 economic ministers' retreat and a special foreign ministers' videoconference would address the Middle East crisis."
        - "The Philippines, serving as ASEAN chair, framed the talks around oil prices, inflation, shipping, logistics and trade disruptions."
        - "Officials said the region could not ignore the impact of the Gulf conflict on jobs and prices."
        - "The announcement put energy security and transport disruption at the center of the regional agenda."
      why_it_matters:
        - "Even before the meetings took place, the decision to convene them showed the speed with which the crisis was affecting Southeast Asian planning."
        - "ASEAN's export-dependent economies are highly exposed to both fuel-price spikes and maritime chokepoints."
      uncertainty_notes:
        - "The substantive outcomes were not yet known on March 12 because the meetings were scheduled for the following day."
