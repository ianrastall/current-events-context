    headline: "Ecuador declares a national emergency as heavy rains trigger floods and landslides across the country"
    summary: >
      Ecuador declared a national emergency on March 12 because of the severe impact of the
      rainy season, according to the national risk-management authority. The government's
      announcement came as humanitarian updates described widespread flooding, landslides
      and overflowing rivers across large parts of the country. A same-day ECHO update on
      ReliefWeb said at least eight people had died, 17 had been injured and more than
      40,000 people had been affected, while a follow-up update stated that by March 12 at
      least 28 rivers were overflowing and 34 more were at risk. The decision marked an
      escalation from earlier regional emergency declarations and reflected the national
      scale of infrastructure and humanitarian strain.
    key_data: []
    details:
      what_happened:
        - "Ecuador's national risk-management authority announced a national emergency because of the rainy season."
        - "Humanitarian reporting described widespread floods and landslides affecting multiple provinces and transport links."
        - "ReliefWeb's March 12 update said at least eight people had died, 17 had been injured and more than 40,000 had been affected."
        - "A follow-up update reported that, as of March 12, 28 rivers were overflowing and 34 were at risk of overflowing."
      why_it_matters:
        - "The declaration signaled that the crisis had grown beyond localized flooding into a nationwide emergency-management challenge."
        - "Floods and landslides during Ecuador's rainy season threaten homes, roads, agriculture and public health simultaneously."
      uncertainty_notes:
        - "Impact counts were still rising and were likely to change as field reporting expanded."
