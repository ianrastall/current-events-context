    importance: 7
    headline: "Iran-aligned groups in Lebanon and Iraq intensify attacks as the war widens"
    summary: >
      Iran-aligned armed groups in Lebanon and Iraq stepped up attacks on March 12,
      underscoring the regionalization of the war around Iran. Reuters reported that
      Hezbollah and Iran's Revolutionary Guards launched a large rocket barrage into
      northern Israel while Iraqi armed groups accelerated strikes linked to U.S. military
      positions and maritime traffic. The moves came even though many of Tehran's allied
      groups had already been weakened by months of conflict and earlier Israeli attacks.
      Israeli Prime Minister Benjamin Netanyahu also publicly threatened Iran's new supreme
      leader, illustrating how the conflict was broadening across both rhetoric and military
      activity.
    key_data: []
    details:
      what_happened:
        - "Reuters reported simultaneous or near-simultaneous attacks involving Hezbollah and Iran's Revolutionary Guards against northern Israel."
        - "Iraqi armed groups aligned with Iran stepped up attacks connected to U.S. interests and regional shipping routes."
        - "The attacks occurred despite assessments that several Iran-backed groups had been degraded by earlier fighting and leadership losses."
        - "Israeli leaders publicly paired military operations with warnings directed at Iran's top leadership."
      why_it_matters:
        - "The escalation showed that the conflict was no longer limited to direct Israel-Iran confrontation and was instead engaging Tehran's wider regional network."
        - "Attacks from multiple theaters increased the risk of miscalculation for Israel, the United States and neighboring states."
      uncertainty_notes:
        - "Operational claims and battlefield details in multi-front conflicts often shift rapidly in the first 24 hours."
