strategic_conclusion: >
  On March 12 the war's centre of gravity shifted toward the Gulf's energy system, with
  Iran's new Supreme Leader calling for the Hormuz blockade to continue, strikes on Bahraini
  fuel storage and Kuwait's airport, and shipping evacuations from Omani ports, while the
  Qatar LNG shutdown extended the shock to gas and helium supplies. Iran-aligned forces
  widened attacks in Lebanon and Iraq, killing a French soldier in Erbil. Outside the
  region, the ICC opened a Belarus investigation, Nepal's election result became official,
  Canada announced a major Arctic defence programme, and landslides in southern Ethiopia
  caused one of the year's deadliest disasters.

