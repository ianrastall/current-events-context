    importance: 6
    headline: "Nepal's early vote count puts ex-rapper's party ahead"
    summary: >
      Early counting from Nepal's parliamentary election showed the Rastriya Swatantra Party
      (RSP) leading in 100 of 137 seats counted by March 6. Reuters reported that the RSP, a
      young anti-establishment force associated with rapper-turned-politician Balendra Shah,
      was set to sweep the election and was on course for a lower-house majority. The result
      represented a major setback for established parties and pointed to one of the sharpest
      democratic realignments in Nepal's post-monarchy era.
    key_data: []
    details:
      what_happened:
        - "Reuters reported that the RSP was set to sweep the election and was leading in 100 of 137 seats counted."
        - "The result represented a major setback for established parties."
        - "Balendra Shah, a former rapper and Kathmandu mayor, was positioned as the party's prime ministerial candidate."
        - "The surge came at the expense of long-dominant parties including the Nepali Congress and the CPN-UML."
      why_it_matters:
        - "A strong RSP result could reduce Nepal's chronic coalition instability and reshape domestic governance."
        - "The result also showed how protest energy had translated into electoral change rather than only street mobilisation."
      uncertainty_notes:
        - "Final seat totals were not yet certified on March 7."
