strategic_conclusion: >
  The war's reach continued to extend beyond Iran and Israel, to Gulf air bases, Iraqi
  militias, Lebanon and Azerbaijan, while Washington's call for unconditional surrender left
  no visible diplomatic track. Casualty and displacement figures rose in several parallel
  conflicts, including Afghanistan–Pakistan and Sudan. Political transitions were under way
  in Nepal and Kosovo.

