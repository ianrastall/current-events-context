      Sweden boarded the Caffa after questions arose over its flag and legal status. The
      Swedish coast guard boarded the freighter Caffa in the Baltic Sea on March 6 because
      of uncertainty about its legal status. Officials said the vessel's ownership and
      insurance arrangements were unclear and that it appeared on a Ukrainian sanctions
      list.
