analytical_overview: >
  On March 6, 2026, the Iran war remained the dominant story. President Trump called for
  Iran's "unconditional surrender" and ruled out talks, an Iranian ballistic missile struck
  Prince Sultan Air Base in Saudi Arabia, and Qatar and Bahrain reported further
  interceptions. The Iranian Red Crescent put the cumulative death toll from the
  U.S.-Israeli air campaign at 1,332, Israeli raids in Lebanon's Beqaa Valley killed at
  least 41 people, and Azerbaijan said it had thwarted an IRGC-plotted attack. U.S. forces
  also struck Popular Mobilization Forces positions in Iraq and, at Ecuador's request,
  alleged narcoterrorist targets in Ecuador.

  Elsewhere, China set its 2026 growth target at the National People's Congress, Nepal's
  early count showed the Rastriya Swatantra Party ahead, Kosovo's president dissolved
  parliament, and Russia and Ukraine exchanged 300 prisoners each. UNHCR reported 100,000
  displaced by Afghanistan–Pakistan fighting, Sudan's army retook Barah, severe storms and
  tornadoes killed at least eight people in the central United States, and the Winter
  Paralympics opened in Verona.

