    importance: 5
    headline: "China uses Wang Yi's annual press conference to press for dialogue with Washington and condemn force over Iran"
    summary: >
      China's foreign minister Wang Yi used his high-profile press conference on March 8 to
      send a dual message: Beijing still wanted structured dialogue with Washington,
      including preparation for a Xi-Trump meeting, but it also intended to criticize the
      use of force in the Iran crisis and to portray itself as a defender of international
      rules against bloc confrontation. In the context of a global oil shock and fast-moving
      Middle East war, the remarks positioned China as both a rival to the United States and
      a self-described stabilizing actor seeking to exploit diplomatic space opened by
      Western military entanglement.
    key_data: []
    details:
      what_happened:
        - "At the National People's Congress press conference, Wang Yi said the agenda for a meeting between Xi Jinping and Donald Trump was on the table."
        - "He said dialogue between the United States and China remained vital even as Washington pressured Beijing's partners."
        - "Wang also called for an end to the Iran war and criticized a return to coercive 'law of the jungle' politics."
        - "The remarks linked U.S.-China relations, Middle East conflict management, and China's broader diplomatic positioning."
      why_it_matters:
        - "Statements at Wang Yi's annual NPC briefing are closely watched as a guide to China's foreign-policy priorities."
        - "The intervention showed Beijing attempting to frame itself as a necessary diplomatic center during a moment of U.S.-Iran crisis."
      uncertainty_notes:
        - "The remarks did not amount to a specific peace plan or negotiated breakthrough."
