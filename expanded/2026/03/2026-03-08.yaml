    headline: "International Women's Day brings worldwide marches and warnings about backlash against women's rights"
    summary: >
      International Women's Day on March 8 produced coordinated marches, rallies, and public
      advocacy across multiple regions, with demonstrators emphasizing equal rights,
      reproductive freedom, workplace fairness, and protection from gender-based violence.
      Reuters and AP reported broad participation around the world, while UN Women used the
      occasion to warn that justice and protection systems for women and girls were under
      severe strain. The day combined symbolic public mobilization with a more pointed
      institutional message that legal gains were facing organized political and social
      rollback.
    key_data: []
    details:
      what_happened:
        - "Protesters and advocates marked International Women's Day with marches and demonstrations in many countries."
        - "The public actions focused on themes including equal pay, safety, bodily autonomy, and resistance to discrimination."
        - "UN Women tied the observance to a broader warning that systems meant to protect women and girls were weakening or failing."
        - "The mobilization also fed into the run-up to the annual UN Commission on the Status of Women session."
      why_it_matters:
        - "The scale and geographic spread of the marches showed that gender-equality issues remained a major transnational civil-society concern."
        - "UN Women framed 2026 as a moment of backlash rather than steady linear progress, raising the political stakes of the observance."
      uncertainty_notes:
        - "Crowd sizes and local agendas varied widely by country."
