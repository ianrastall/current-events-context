strategic_conclusion: >
  The leadership succession in Tehran and the intensified strikes on the capital marked a
  new phase of the Iran war, while the G7's decision to delay a reserve release left markets
  volatile and pushed importing states toward emergency conservation. Attacks on diplomatic
  and religious sites in Norway and Belgium indicated that security effects were extending
  into Europe. Political change continued elsewhere, with new governments or leadership
  arrangements in Portugal, Madagascar and Kosovo and a fragmented outcome in Colombia's
  congressional vote.

