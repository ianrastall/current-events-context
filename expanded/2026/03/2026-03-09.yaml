    headline: "FBI subpoenas Maricopa County audit records as 2020 election probe expands in Arizona"
    summary: >
      Reuters reported on March 9 that the FBI obtained Arizona legislative records tied to
      a Republican-led audit of the 2020 election in Maricopa County, expanding federal
      inquiry into claims of election fraud promoted by Trump and allies. PBS and the
      Arizona Attorney General’s office detailed political and legal backlash, with
      Democratic Attorney General Kris Mayes criticizing the move and warning about
      potential politicization and voter-data risks as federal investigators sought
      documentation from the state Senate’s prior audit process.
    key_data: []
    details:
      what_happened:
        - "Reuters reported the FBI subpoenaed the Arizona Senate for records linked to the 2021 Maricopa County audit and that Senate President Warren Petersen said the FBI had the records."
        - "Reuters reported the 2021 audit reaffirmed Joe Biden’s victory and was criticized for unsubstantiated allegations, yet helped sustain fraud narratives."
        - "PBS reported the move reflected widening federal election scrutiny and noted privacy and legitimacy concerns raised by officials and observers."
        - "The Arizona Attorney General’s office published a statement condemning the federal subpoena and criticizing Petersen’s continued fraud claims."
      why_it_matters:
        - "Subpoena-driven reexamination of settled election outcomes can undermine trust in election administration and intensify partisan conflict ahead of future elections."
        - "Access to sensitive election records raises questions about data protection, legal standards for subpoenas, and potential precedent for federal intervention into state-run election systems."
