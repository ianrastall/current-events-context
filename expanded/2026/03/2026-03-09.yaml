      with Reuters reporting the announcement via a spokesperson’s statement and situating
      the decision in the post-October power transition. AP reporting in the following days
      described the dismissal as part of an effort to reshuffle governance amid public
      pressure and corruption concerns, reflecting continued volatility in executive
      authority and government formation.
