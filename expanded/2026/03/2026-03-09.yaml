    importance: 6
    headline: "Liège synagogue blast treated as antisemitic act; Belgium opens terrorism-linked investigation"
    summary: >
      A pre-dawn explosion damaged a synagogue in Liège on March 9, shattering windows and
      damaging nearby property but causing no injuries. Reuters reported Belgian authorities
      labeled the incident a “despicable antisemitic act,” with federal authorities taking
      over the investigation, while AP and Jewish Telegraphic Agency reporting described
      Europe-wide alerts after the incident and parallel security concerns following the
      Oslo embassy blast.
    key_data: []
