      sign defense partnerships with Australia, Iceland, and Ghana “in the coming days,”
      framing the move as part of a wider shift by countries seeking to diversify
      partnerships amid heightened global risk. EUobserver and EEAS material situated the
      announcement in a Brussels speech context, with Kallas signaling additional countries
      were seeking similar arrangements.
