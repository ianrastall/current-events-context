    headline: "Rare student sit-in protest at University of Havana highlights deepening nationwide crisis in Cuba"
    summary: >
      A small group of Havana university students held a rare sit-in protest on March 9 over
      major disruption to education amid severe electricity, transport, and connectivity
      problems that Reuters and AP linked to deepening energy shortages and tightened
      external constraints on fuel inflows. Reuters reported senior officials intervened and
      said there would be no punitive measures, while students warned they would protest
      again if demands were not taken seriously—underscoring a sensitive moment for public
      dissent in Cuba.
    key_data: []
    details:
      what_happened:
        - "Reuters reported just over 20 students staged an hours-long sit-in on the University of Havana steps, criticizing distance learning and inadequate measures amid energy and internet shortages."
        - "Reuters reported Higher Education Vice Minister Modesto Ricardo Gomez spoke with students and said there would be no punitive actions, while attributing crisis drivers largely to tightened U.S. sanctions."
        - "AP reported the protest occurred amid an energy crisis that reduced classes and “paralyzed” parts of the country, with U.S. policy described as an “oil blockade” worsening conditions."
        - "Reuters reported students said they would protest again if their demands were not addressed, noting Cuba’s constitution permits protests but lacks a clear framework."
      why_it_matters:
        - "Student protests are politically sensitive in Cuba; even small demonstrations can signal widening social strain and test the government’s tolerance for public dissent."
        - "The protest spotlighted immediate service failures—power and connectivity—that can accelerate migration pressures and economic contraction."
