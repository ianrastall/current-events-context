      defense ministry statements cited by Ekathimerini, began) deploying six F-16 fighter
      jets and air defense systems to northern Cyprus to bolster security for the Turkish
      Cypriot community amid broader regional instability tied to the Iran war. The move was
      reported as part of a wider Turkish readiness posture as conflicts spread and military
      resources repositioned in the Eastern Mediterranean.
