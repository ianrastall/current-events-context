analytical_overview: >
  On March 9, 2026, Iran named Mojtaba Khamenei as Supreme Leader while U.S. and Israeli
  forces carried out their heaviest raids yet on Tehran, and Iranian missiles and drones
  targeted the UAE, with one ballistic missile intercepted over Turkey by NATO. An Israeli
  strike in central Beirut killed senior Quds Force and Hezbollah figures. Oil and commodity
  markets swung sharply as G7 finance ministers discussed but held off on releasing
  emergency reserves, and energy-importing states including Pakistan and Bangladesh imposed
  fuel-saving measures. Presidents Putin and Trump spoke by phone about the war, Ukraine and
  energy prices.

  Beyond the war, blasts damaged the U.S. embassy in Oslo and a synagogue in Liège, a
  migrant boat collision off Turkey left at least 14 dead, and coordinated militant raids
  struck northeast Nigeria. Colombia's legislative election produced a fragmented Senate led
  by the Historic Pact, Portugal inaugurated President António José Seguro, Kosovo's
  Constitutional Court froze the president's dissolution of parliament, and Madagascar's
  president dismissed his government. Nairobi's flood toll rose to 42.

