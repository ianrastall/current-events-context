    importance: 9
    headline: "Iran names Mojtaba Khamenei as Supreme Leader as Israel and the United States intensify the Iran war"
    summary: >
      On March 9, Iran identified Mojtaba Khamenei as successor to his father as Supreme
      Leader while heavy air raids shook Tehran, including reports of more than 20 large
      explosions and localized power cuts. Donald Trump publicly framed the leadership
      change as “more of the same” and avoided saying whether Iran’s new leader could be
      targeted, while the conflict’s reported death toll continued to rise across multiple
      countries.
    key_data: []
    details:
      what_happened:
        - "Reuters reported that Iran’s succession announcement signaled hardliners remained firmly in charge about a week into the conflict."
        - "AP reported that Tehran experienced the heaviest raids since the war began, with witnesses describing sustained aircraft noise, heavy blasts, and power cuts in some neighborhoods; Iranian media did not provide damage/casualty details for those strikes at the time."
        - "AP reported that Trump said naming Mojtaba Khamenei would likely bring “more of the same,” and said it would be “inappropriate” to speculate about targeting the new leader."
        - "AP’s running casualty summary cited official figures indicating at least 1,230 killed in Iran, at least 397 in Lebanon, and 11 in Israel (as reported by officials in those countries)."
        - "AP’s live coverage also said new footage had “raised the likelihood” the U.S. military struck an Iranian elementary school where a blast killed at least 165 people, mostly children (a claim characterized as developing/under review)."
      why_it_matters:
        - "Leadership succession under wartime pressure can shape escalation decisions, bargaining positions, and internal cohesion in Iran."
        - "Intensified strikes on Tehran and rising cross-border casualty totals heighten risks of wider regional spillover and further retaliatory cycles."
      uncertainty_notes: []
