        - "AP reported the government was dissolved and a new prime minister appointed, as authorities described anti-corruption motivations."
        - "The Guardian reported the March 9 cabinet dismissal preceded subsequent anti-corruption measures (including proposed polygraph screening for ministers), illustrating attempts to project reform credibility after the reshuffle."
