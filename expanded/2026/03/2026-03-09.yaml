      ballistic missiles and 18 drones targeting the United Arab Emirates, demonstrating
      continued offensive capacity despite sustained allied airstrikes on its military
      infrastructure. In a separate and significant escalation, an Iranian ballistic missile
      violated Turkish airspace and was subsequently intercepted by NATO air defenses, with
      debris falling in Turkey's southeastern Gaziantep Province. The breach of a NATO
      member's airspace by an Iranian projectile marked a dangerous widening of the
      conflict's geographic footprint and triggered formal protests from Ankara.
