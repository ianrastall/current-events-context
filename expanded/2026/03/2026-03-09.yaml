      expected to step down by the end of the following week to run for governor of São
      Paulo, amid political pressure and election positioning around President Luiz Inácio
      Lula da Silva’s broader strategy. The report cited sources describing Lula’s push for
      Haddad to contest a key state contest while polling suggested Haddad trailed the
      incumbent governor, underscoring political uncertainty for Brazil’s fiscal leadership
      during a period of global energy and market stress.
