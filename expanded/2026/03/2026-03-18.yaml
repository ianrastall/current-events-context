strategic_conclusion: >
  March 18 marked a turn toward direct attacks on energy infrastructure: strikes on Iran's
  South Pars field were followed by Iranian missiles on Qatar's Ras Laffan LNG complex,
  Qatar's expulsion of Iranian attachés, and a joint call by twelve regional foreign
  ministers for Iran to stop its attacks. Israel's campaign against Iranian leadership
  continued with the killing of the intelligence minister. The Sudan war crossed into Chad,
  prompting Chadian retaliation orders, while Pakistan and Afghanistan agreed an Eid pause.
  Arrests of senior cartel figures in Mexico and major announcements in U.S. sport and
  computing made up much of the rest of the day's record.

