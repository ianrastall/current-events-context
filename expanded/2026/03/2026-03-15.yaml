strategic_conclusion: >
  The day combined a cluster of state-managed or contested votes, in Vietnam, the Republic
  of the Congo, Kazakhstan and North Korea, with coordinated emergency action on oil supply
  led by the IEA. U.S.–China trade talks opened a separate diplomatic channel even as the
  Iran war and the Afghanistan–Pakistan conflict continued to cause casualties across the
  region.

