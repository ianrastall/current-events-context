    importance: 6
    headline: "Kazakhstan votes to approve a new constitution that critics say could entrench presidential power"
    summary: >
      Kazakhstan held a referendum on March 15, 2026, and exit polls indicated strong
      support for a new constitution. Reuters reported roughly 87% approval with turnout
      around 73%, while AP said the constitutional package would strengthen President
      Kassym-Jomart Tokayev's grip on power by reshaping parliament, restoring the vice
      presidency, and allowing the president to appoint key officials.
    key_data: []
    details:
      what_happened:
        - "Kazakh voters cast ballots in a referendum on a new constitution."
        - "Reuters reported two exit polls showing about 87% support and turnout of about 73%."
        - "The proposed constitutional order would streamline parliament and recreate the office of vice president."
        - "AP reported the reforms would also expand the president's appointment powers and create additional institutional tools under presidential influence."
      why_it_matters:
        - "The referendum could reshape Kazakhstan's political system and succession dynamics."
        - "Critics and some analysts argued it may allow Tokayev to consolidate or extend power beyond the spirit of existing term limits."
        - "Kazakhstan is a strategically important energy and minerals producer in Central Asia."
      uncertainty_notes:
        - "On March 15, the approval figures were based on exit polls rather than final certified results."
        - "Competing interpretations remained over whether the new structure pointed to succession planning or term-resetting."
