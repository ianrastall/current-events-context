    importance: 5
    headline: "Republic of Congo votes in a presidential election marked by low turnout and an internet blackout"
    summary: >
      The Republic of Congo voted in a presidential election on March 15, 2026, with
      incumbent Denis Sassou Nguesso widely expected to extend his rule. Reuters reported
      sparse lines at many polling stations in Brazzaville and a nationwide internet
      blackout that transparency monitors said reduced connectivity to about 3% of normal
      levels.
    key_data: []
    details:
      what_happened:
        - "More than 3.2 million Congolese were registered to vote in the presidential election."
        - "Reuters reported visibly thin turnout in Brazzaville and noted that Sassou faced six little-known challengers."
        - "Several opposition parties boycotted the election and prominent opposition figures were imprisoned or in exile."
        - "NetBlocks reported a nation-scale internet outage during the vote."
      why_it_matters:
        - "The vote was expected to extend the decades-long rule of one of Africa's longest-serving leaders."
        - "The low-competition environment and internet outage raised questions about openness and public confidence."
        - "The election mattered for the governance of an oil-producing state where poverty remains widespread."
      uncertainty_notes:
        - "Election-day visibility was constrained by the internet blackout."
        - "Turnout and perceived credibility were disputed by government critics and civil society actors."
