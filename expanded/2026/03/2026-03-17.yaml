    headline: "Chile begins constructing anti-migration trenches at the Peru border under President José Antonio Kast"
    summary: >
      Reuters reported Chile’s new right-wing government began deploying heavy machinery to
      dig trenches along its northern border with Peru, fulfilling a campaign pledge by
      President José Antonio Kast to clamp down on irregular migration and increase border
      security. AP reported Kast described the first trenching work as a milestone under his
      “Border Shield” plan, including ditches, fences, surveillance (including drones), and
      military patrols. Spanish news agency EFE reported additional plan elements including
      fences/walls and expanded surveillance measures, framing the move as a central early
      initiative of the new administration.
    key_data: []
    details:
      what_happened:
        - "Reuters reported trench construction began near the Chacalluta border post area, as part of a broader crackdown on illegal migration and organized crime."
        - "Reuters reported the policy was tied to a stated intent to reinforce sovereignty and public safety, while human-rights groups raised rights concerns."
        - "AP reported Kast highlighted a “Border Shield” concept combining physical barriers with drones and military patrols, using emergency powers for rapid implementation."
        - "EFE reported planned border infrastructure and surveillance expansions, including deepening/excavating trenches and adding fencing/walls."
      why_it_matters:
        - "Chile’s shift toward physical border hardening reflects a broader regional trend of securitized migration policy and can reshape asylum and labor-mobility dynamics."
        - "Barrier construction raises operational and legal questions about humanitarian access, due process, and cross-border coordination with Peru."
