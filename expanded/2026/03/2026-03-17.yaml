        - "AP reported four teenagers arrested for alleged terror offenses (explosion/arson/attempted arson with terrorist intent), with no injuries in Rotterdam."
        - "NOS reported the minister saying indications pointed to recruitment of the young suspects and reiterated the Iran-link probe."
      why_it_matters:
        - "A substantiated state-linked component (if proven) would represent a significant escalation in European homeland security risk tied to the broader Middle East conflict."
        - "Even absent attribution, a cluster of attacks targeting Jewish sites increases societal tension and drives heightened protective security measures."
