    headline: "Netherlands probes possible Iran link to Rotterdam synagogue attack; prosecutors cite terrorist intent"
    summary: >
      Reuters reported that Dutch authorities were investigating whether Iran was involved
      in an attack on a synagogue in Rotterdam, with Justice Minister David van Weel telling
      parliament the possibility was being explicitly examined while stressing there was not
      yet a conclusive link. Reuters said Dutch prosecutors described four suspects (aged
      17–19) apprehended after the Friday arson/explosion incident as acting with terrorist
      intent, and noted a broader string of attacks on Jewish sites in the Netherlands and
      neighboring areas. AP reported similarly that four teenagers were arrested on
      suspicion of terror offenses linked to the Rotterdam synagogue explosion and arson,
      with no injuries reported. Dutch public broadcaster NOS reported the minister stating
      “everything points” to recruitment of the suspects and that an Iran link was under
      investigation.
    key_data: []
