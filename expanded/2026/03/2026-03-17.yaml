    importance: 5
    headline: "Cuba restores power after 29-hour nationwide blackout as a magnitude 5.8–6.0 earthquake strikes eastern Cuba"
    summary: >
      Reuters reported Cuba reconnected its power grid on March 17 after a nationwide
      blackout lasting more than 29 hours, bringing its largest oil-fired power plant back
      online, while warning that shortages could continue due to insufficient generation. AP
      likewise reported an islandwide blackout affecting all residents amid a deepening
      energy crisis and described fragile restoration efforts and the role of aging
      infrastructure and constrained fuel supply. Separately, the U.S. Geological Survey
      reported a magnitude 5.8 earthquake south-southwest of Maisí, Cuba, at a depth around
      11.6 km, while Reuters reported EMSC estimating a magnitude 6.0 quake at 15 km depth;
      no casualties were confirmed in these immediate reports. The combined shocks
      underscored the island’s compounding vulnerability: infrastructure stress from fuel
      and maintenance constraints alongside geological hazard exposure.
    key_data: []
    details:
      what_happened:
        - "Reuters reported Cuba’s grid returned online by evening March 17 after a 29+ hour nationwide blackout, with officials warning shortages may persist."
        - "AP reported the blackout stemmed from systemic grid deterioration and constrained energy inputs, and described fragile restoration progress."
        - "USGS reported a magnitude 5.8 earthquake (reviewed) south-southwest of Maisí at ~11.6 km depth at 2026-03-17 04:28:25 UTC."
        - "Reuters reported EMSC measured a magnitude 6.0 quake at 15 km depth; immediate casualty/damage details were not provided in that brief report."
      why_it_matters:
        - "Prolonged nationwide blackouts can rapidly degrade food, water, healthcare, and economic function, increasing near-term humanitarian and political stress."
        - "Even moderate earthquakes can compound crisis conditions by damaging already-fragile infrastructure and straining emergency response capacity."
