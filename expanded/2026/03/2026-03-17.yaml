analytical_overview: >
  March 17, 2026 was dominated by the intensifying war involving United States, Israel, and
  Iran, with ripple effects across security, diplomacy, and energy markets. Key developments
  included reported leadership casualties in Iran, sustained bombardment and rescue
  operations, and attacks on U.S. diplomatic facilities in Iraq. Strait of Hormuz remained
  effectively constrained, driving extraordinary oil-supply dislocation, according to both
  media reporting and International Energy Agency analysis.

  Outside the Middle East crisis, major news included a mass-casualty strike reported in
  Kabul, suspected coordinated suicide bombings in Maiduguri, a decisive re-election in the
  Republic of the Congo, and a cluster of shocks in Cuba combining a nationwide power-grid
  failure and a moderate offshore earthquake.

