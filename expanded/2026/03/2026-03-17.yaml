    headline: "Congo Republic’s Denis Sassou Nguesso wins re-election with nearly 95% amid boycott claims and a tightly managed vote"
    summary: >
      Reuters reported provisional results showing Denis Sassou Nguesso re-elected with
      94.82% of the vote, extending decades of rule, in an election Reuters described as
      tightly managed with major opposition parties boycotting and key opposition figures
      imprisoned. Reuters also reported a nationwide internet blackout on election day and
      late openings at some polling stations, while officially reported turnout was high. AP
      likewise reported provisional results near 94.8%, noting limited competition and
      skepticism among residents. Al Jazeera reported the landslide win and the extension of
      Sassou Nguesso’s long hold on power.
