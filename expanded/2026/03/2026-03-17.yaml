        - "Reuters reported state TV announcing Sassou Nguesso won 94.82% of the vote, with his closest challenger at 1.48%."
        - "Reuters reported major opposition parties declined to field candidates, citing lack of transparency, and described arrests/suspensions of activists and parties ahead of voting."
        - "AP reported provisional results at 94.8% and described an election environment marked by shutdowns/restrictions and public skepticism about legitimacy."
        - "Al Jazeera reported the outcome as extending nearly 42 years of rule, based on provisional results."
      why_it_matters:
        - "The result consolidates continuity in a major oil-producing state while sharpening succession questions and governance legitimacy concerns."
        - "Election-management issues (boycott, internet outage, arrests) can exacerbate domestic political tension and affect international confidence and investment dynamics."
