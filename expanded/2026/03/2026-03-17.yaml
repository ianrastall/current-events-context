strategic_conclusion: >
  Israel's killing of Ali Larijani and the Basij commander, and Mojtaba Khamenei's rejection
  of de-escalation, left the Iran war without a diplomatic opening on March 17, while
  strikes on Gulf energy assets and shipping pushed exporters to seek routes around Hormuz.
  The resignation of the U.S. counterterrorism chief in protest and reports of Russian
  intelligence support for Iran pointed to widening political stakes. In the Americas,
  Ecuador's curfew deployment and the Colombia–Ecuador dispute over cross-border bombings
  escalated, and Argentina completed its withdrawal from the WHO.

