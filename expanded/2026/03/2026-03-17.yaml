      Reuters reported Colombian President Gustavo Petro saying the charred remains of 27
      people were found in Colombia following bombings near the Ecuador border, while
      Ecuador’s President Daniel Noboa said Ecuador was bombing drug traffickers within its
      own territory and denied crossing into Colombia. Reuters reported Petro said Colombian
      security forces were not responsible and that he “didn’t give that order,” after
      initially suggesting Ecuador bombed Colombian territory. The Guardian reported the
      episode triggered sharp bilateral tensions, including claims about an unexploded
      aerial bomb near civilian homes and linkages to broader anti-narcotics operations. El
      País (English edition) reported the dispute as a fresh diplomatic crisis, with Noboa
      rejecting Petro’s allegation and describing targets as “narco-terrorist” hideouts.
