      Maiduguri—Borno State’s capital and a hub for counter-insurgency operations—killing at
      least 23 people and injuring 108. Reporting described explosions at a post office, a
      Monday market, the University of Maiduguri Teaching Hospital area, and the Kaleri
      neighborhood, with authorities tightening security and launching investigations. No
      group immediately claimed responsibility; both Reuters and AP indicated suspicion fell
      on jihadist groups active in the region, including Boko Haram and Islamic State West
      Africa Province, though attribution remained unconfirmed in the immediate aftermath.
      Al Jazeera similarly reported the casualty figures and cited police statements
      describing suspected suicide bombers.
