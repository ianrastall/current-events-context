    importance: 7
    headline: "Drone strike on a truck carrying mourners kills 40 in Sudan's West Kordofan"
    summary: >
      A drone strike hit a pick-up truck carrying mourners to a funeral on the road between
      Abu Zabad and El-Fula in Sudan's West Kordofan, killing 40 people, most of them women,
      according to a medical source cited by AFP. Subsequent reporting described the attack
      as part of a widening pattern of drone warfare against civilians in Sudan's Kordofan
      and nearby regions. The available sources confirmed the deaths and location but did
      not firmly attribute responsibility for this specific strike.
    key_data: []
    details:
      what_happened:
        - "A pick-up truck carrying civilians to a funeral was struck by a drone on the road between Abu Zabad and El-Fula in West Kordofan."
        - "AFP, citing a medical source at Abu Zabad Hospital, reported that 40 people were killed and that most of the dead were women."
        - "The attack occurred amid escalating drone warfare in Sudan's broader civil conflict."
      why_it_matters:
        - "The strike highlighted the growing lethality of drone attacks against civilians in Sudan."
        - "It added to evidence that the Kordofan front was becoming one of the war's most dangerous zones for noncombatants."
      uncertainty_notes:
        - "The sources reviewed did not conclusively identify the force responsible for this specific strike."
