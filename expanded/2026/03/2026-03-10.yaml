      five others on March 10. Swiss authorities said the blaze was likely the result of a
      deliberate act by a passenger who apparently set himself alight with a flammable
      substance, while ruling out any initial indication of terrorism. Reuters and AP both
      reported that the incident triggered a criminal investigation and shocked the local
      community.
