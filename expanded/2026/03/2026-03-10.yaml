      A group of international jurists filed a report with the Inter-American Commission on
      Human Rights arguing that Salvadoran authorities had likely committed crimes against
      humanity during the country's prolonged state of emergency. Reuters reported that the
      filing accused the government of systematic torture, murder, forced disappearances,
      and other abuses linked to anti-gang policies. An accompanying release from the
      International Commission of Jurists described the allegations as the product of a
      state policy rather than isolated misconduct.
