  - id: "evt-2000-01-08-012"
    category: "Science and technology"
    subcategory: ""
    topics:
      - "Spain"
    importance: 5
    headline: "Large blocks of ice fall from a clear sky in Tocón de Quéntar and Soria, Spain, igniting a nationwide mystery over \"megacryometeors\""
    summary: >
      On January 8, 2000, a 4-kilogram block of ice fell from a cloudless sky onto the
      windshield of a parked Peugeot 309 in the village of Tocón de Quéntar (Granada) and
      another chunk of ice fell in Soria, Spain—the first documented impacts in a wave of
      more than 50 falling ice chunks across Spain in January 2000 that sparked nationwide
      media sensation and led Spanish National Research Council (`CSIC`) geologist Jesús
      Martínez-Frías to coin the scientific term megacryometeor.
    key_data:
      - label: "Mass of ice block recovered in Tocón de Quéntar (Granada) on Jan 8, 2000"
        value: "~4 kg (crushed the hood and windshield of a parked car)"
        citation_refs: [16]
      - label: "Total falling-ice reports investigated in Spain during January 2000"
        value: "Over 50 reported cases (9 scientifically verified as megacryometeors by CSIC)"
        citation_refs: [16]
      - label: "Casualties"
        value: "None"
        citation_refs: [16]
    details:
      what_happened:
        - "On Saturday, January 8, 2000, residents in the Andalusian village of Tocón de Quéntar near Granada and in the Castilian province of Soria reported large blocks of layered, milky-white ice plummeting from clear skies with loud whistling sounds, smashing the hood and windshield of a parked car in Tocón de Quéntar; pieces were preserved in home freezers by local residents and Civil Guard officers."
        - "Over the next two weeks of January 2000, dozens of additional ice blocks weighing between 1 and 8 kilograms fell across Seville, Cádiz, Valencia, Murcia, and Madrid—initially misreported in the Spanish press as \"aerolites\" (stony meteorites) or fragments of a passing comet before planetary geologist Jesús Martínez-Frías at Spain's Centro de Astrobiología (`CSIC–INTA`) analyzed their isotopic and chemical composition."
      why_it_matters:
        - "Chemical analysis by `CSIC` scientists ruled out aircraft lavatory leaks (\"blue ice\") for at least nine of the specimens and established that unusual tropopause temperature and wind-shear anomalies had formed massive atmospheric ice aggregations under cloudless conditions, introducing the recognized atmospheric phenomenon of megacryometeors."
        - "Once the January 8–18 cases received saturated television coverage in Spain, scientists determined that many subsequent late-January reports were hoaxes made from commercial freezer ice."
      uncertainty_notes: []
