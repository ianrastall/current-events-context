    details:
      what_happened:
        - "On Saturday, January 8, 2000, human rights groups and officials from the International Criminal Tribunal for the former Yugoslavia (`ICTY`) in The Hague highlighted that despite occasional `SFOR` commando snatches in late 1999, dozens of indicted Bosnian war criminals continued to live openly or move under protection in Republika Srpska and neighboring Serbia."
        - "Advocacy groups urged NATO Secretary General Lord Robertson and U.S., British, and French `SFOR` sector commanders to abandon passive patrol postures and execute pending sealed and public arrest warrants to enable minority refugees to return home safely in 2000."
