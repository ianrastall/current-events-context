    summary: >
      On January 8, 2000, fighting between the Sudan People's Liberation Army (`SPLA`) led
      by John Garang and Sudanese government troops backed by allied militias intensified in
      Upper Nile (Unity State) and Bahr el Ghazal, threatening foreign oil workers and
      prompting humanitarian agencies under Operation Lifeline Sudan to warn of severe
      winter food-aid disruptions.
