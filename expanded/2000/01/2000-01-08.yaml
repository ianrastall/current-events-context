    importance: 4
    headline: "Legendary German Olympic show-jumping equestrian Fritz Thiedemann dies in Schleswig-Holstein at age 81"
    summary: >
      On January 8, 2000, German equestrian legend Fritz Thiedemann—winner of two Olympic
      team show-jumping gold medals (1956 Stockholm and 1960 Rome) and the only athlete in
      Olympic history to win two bronze medals in different equestrian disciplines on the
      same day at the 1952 Helsinki Games—died in Heide, Schleswig-Holstein at the age of
      81.
    key_data:
      - label: "Age of Fritz Thiedemann at death"
        value: "81 years old (born March 3, 1918 in Weddinghusen, Dithmarschen)"
        citation_refs: [18]
      - label: "Olympic medals won (1952–1960)"
        value: "4 Olympic medals: 2 Gold (1956, 1960 team jumping), 2 Bronze (1952 individual jumping & team dressage)"
        citation_refs: [18]
      - label: "Casualties"
        value: "1 death (natural causes)"
        citation_refs: [18]
    details:
      what_happened:
        - "Born on a farm in Weddinghusen in Schleswig-Holstein on March 3, 1918, Fritz Thiedemann became one of post-war West Germany's most beloved sports figures through his partnership with the heavy-set Holsteiner gelding Meteor, winning individual show-jumping bronze and team dressage bronze on the same day at the 1952 Helsinki Olympics before capturing team show-jumping gold at the 1956 Stockholm equestrian games and the 1960 Rome Olympics."
        - "Voted West Germany's Sportsman of the Year in 1958 and chosen as the flag bearer for the United Team of Germany at the 1960 Rome Summer Olympics, Thiedemann died in Heide, Dithmarschen on Saturday, January 8, 2000 at age 81."
      why_it_matters:
        - "Thiedemann and his horse Meteor (whose bronze statue stands in front of the state chancellery in Kiel) remain icons of Germany's post-World War II return to the Olympic movement."
        - "None."
