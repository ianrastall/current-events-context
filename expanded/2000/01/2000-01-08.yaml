analytical_overview: >
  On Saturday, January 8, 2000, a bold Chechen counteroffensive behind Russian lines in the
  North Caucasus, a major magnitude 7.2 earthquake in the Tonga Trench—the first `M7.0+`
  seismic event of the year 2000—and a diplomatic freeze at the Shepherdstown Israeli–Syrian
  peace talks coincided with cross-border fighting along the Angola–Namibia frontier and one
  of the most dramatic finishes in American professional football history. In Chechnya,
  hundreds of fighters under field commanders Shamil Basayev and Ruslan Gelayev infiltrated
  through thick winter fog to attack the Russian-occupied eastern railway towns of Argun,
  Shali, and Gudermes, surrounding federal garrisons, ambushing supply columns, and
  prompting Moscow to replace its North Caucasus operational commanders. In West Virginia,
  the sixth day of the Shepherdstown peace summit stalled as Syrian Foreign Minister Farouk
  al-Sharaa refused to reconvene working committees until Israel committed in writing to
  withdraw to the June 4, 1967 border line.

  Across the Pacific and South America, the United States Geological Survey (`USGS`)
  recorded the year's first major (`M7.0+`) earthquake—a magnitude 7.2 intermediate-depth
  event south-southwest of Hihifo, Tonga (`usp0009kx3`)—alongside two strong magnitude 6.4
  earthquakes on Guadalcanal in the Solomon Islands (`usp0009kvr`) and near Antofagasta,
  Chile (`usp0009kwj`), topping a 14-earthquake global `M4.5+` sequence. Meanwhile, Beijing
  warned New Delhi against granting political asylum to the 17th Karmapa Lama while holding
  U.S.-based scholar Song Yongyi on state-secrets charges; Angolan and Namibian forces
  battled UNITA insurgents along the Kavango border; the Tennessee Titans stunned the
  Buffalo Bills 22–16 in the NFL Wild Card playoffs on the "Music City Miracle" lateral
  return; a mysterious falling block of ice in Spain ignited a nationwide scientific and
  media investigation into megacryometeors; Queensland Labor MP Bill D'Arcy resigned his
  parliamentary seat in Australia; and Olympic gold medalists Fritz Thiedemann of Germany
  and Hilary Smart of the United States died.

