    importance: 6
    headline: "Republican presidential candidates George W. Bush and John McCain clash over tax cuts in televised South Carolina debate"
    summary: >
      On January 8, 2000, the six contenders for the 2000 Republican presidential
      nomination—Texas Governor George W. Bush, Arizona Senator John McCain, businessman
      Steve Forbes, Senator Orrin Hatch, Gary Bauer, and Alan Keyes—met in Columbia, South
      Carolina for a nationally televised debate centered on Bush's $483 billion five-year
      tax-cut plan versus McCain's proposal to use more of the projected federal budget
      surplus to shore up Social Security and pay down the national debt.
    key_data:
      - label: "Estimated 5-year cost of George W. Bush's tax-cut proposal"
        value: "$483 billion over 5 years (~$1.3 trillion over 10 years)"
        citation_refs: [15]
      - label: "Estimated 5-year cost of John McCain's competing tax-cut proposal"
        value: "$237 billion over 5 years (allocating more surplus to Social Security and debt)"
        citation_refs: [15]
      - label: "Casualties"
        value: "None"
        citation_refs: [15]
    details:
      what_happened:
        - "Meeting at the Koger Center for the Arts at the University of South Carolina in Columbia on Saturday night, January 8, 2000—the second of three debates in four days across New Hampshire, South Carolina, and Michigan—front-runner George W. Bush and his chief challenger John McCain engaged in their sharpest policy exchange of the primary campaign to date."
        - "Bush defended his across-the-board income-tax rate cuts by declaring, \"Wait a minute—this is not the government's money; this is the people's money,\" while McCain argued that cutting taxes on the wealthiest Americans before securing the long-term solvency of Social Security and Medicare risked repeating fiscal deficits."
      why_it_matters:
