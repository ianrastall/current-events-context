  - id: "evt-2000-01-08-013"
    category: "Politics and elections"
    subcategory: ""
    topics:
      - "Australia"
    importance: 5
    headline: "Queensland Labor MP Bill D'Arcy resigns from the Queensland Parliament amid the Net Bet scandal and criminal investigation"
    summary: >
      On January 8, 2000, veteran Queensland Australian Labor Party (`ALP`) parliamentarian
      Bill D'Arcy—Member of the Legislative Assembly (`MLA`) for Woodridge since
      1977—resigned his seat in the Queensland Parliament amid the "Net Bet" internet-gaming
      licensing controversy and an active Queensland Police investigation into historical
      child sexual offenses committed during his career as a schoolteacher in the 1960s and
      1970s.
    key_data:
      - label: "Tenure of Bill D'Arcy in the Legislative Assembly of Queensland"
        value: "1972–1974 (Albert) and 1977–2000 (Woodridge) — 25 years"
        citation_refs: [17]
      - label: "Result of subsequent Woodridge by-election (February 5, 2000)"
        value: "Won by Mike Kaiser (Labor) after a 21.8% primary swing against Labor"
        citation_refs: [17]
      - label: "Casualties"
        value: "None"
        citation_refs: [17]
    details:
      what_happened:
        - "Having already come under political pressure in 1999 over the \"Net Bet\" scandal—in which several Queensland Labor figures secretly held shares in an internet gambling company awarded a license by Premier Peter Beattie's government—59-year-old Woodridge MLA Bill D'Arcy announced his immediate resignation from the Queensland Parliament on Saturday, January 8, 2000."
        - "D'Arcy's resignation eroded Premier Peter Beattie's one-seat parliamentary majority ahead of the February 5, 2000 Woodridge by-election; two months later, in March 2000, Queensland Police arrested and charged D'Arcy with dozens of counts of child sexual abuse committed while he was a state primary-school teacher between 1963 and 1971, for which he was convicted in November 2000 and sentenced to up to 14 years' imprisonment."
      why_it_matters:
        - "D'Arcy's resignation and subsequent conviction—together with the Electoral and Administrative Review Inquiry (Shepherdson Inquiry) into Labor branch-stacking triggered later in 2000 by his Woodridge successor Mike Kaiser—precipitated a major integrity overhaul inside the Queensland Labor Party under Premier Peter Beattie."
        - "At the time of his January 8 parliamentary resignation, D'Arcy cited personal and political controversy surrounding the Net Bet affair; the criminal child-abuse charges were formally laid by police in March 2000."
      uncertainty_notes: []
