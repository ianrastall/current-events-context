    importance: 8
    headline: "Israeli–Syrian peace talks at Shepherdstown stall as Syria demands border commitment before committee sessions"
    summary: >
      On January 8, 2000—the sixth day of the Shepherdstown peace summit—bilateral committee
      negotiations between Israel and Syria stalled as Syrian Foreign Minister Farouk
      al-Sharaa declined to reconvene working groups after the Jewish Sabbath unless Israeli
      Prime Minister Ehud Barak committed to full withdrawal from the Golan Heights to the
      June 4, 1967 line, prompting intensive separate shuttle meetings by U.S. Secretary of
      State Madeleine Albright.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000108`, Israeli <-> Syrian)"
        value: "170 combined mentions across 78 articles (highest global cluster on Jan 8)"
        citation_refs: [6]
      - label: "Casualties"
        value: "None"
        citation_refs: [6]
    details:
      what_happened:
        - "On Saturday, January 8, 2000, negotiations at the Clarion Hotel in Shepherdstown remained deadlocked over the U.S. draft working paper tabled two days earlier: Syrian negotiators objected that convening the normal-relations and security committees without an upfront Israeli pledge to vacate the entire Golan Heights to the June 4, 1967 line favored Israel's negotiating agenda."
        - "U.S. Secretary of State Madeleine Albright held separate discussions with Foreign Minister Farouk al-Sharaa and Prime Minister Ehud Barak on Saturday evening while preparing to brief President Bill Clinton ahead of his Sunday evening return to West Virginia."
      why_it_matters:
        - "The January 8 impasse made clear that the first Shepherdstown round would adjourn on January 10 without a signed framework agreement, shifting pressure onto a planned—and ultimately aborted—second round later in January."
        - "None."
      uncertainty_notes: []
