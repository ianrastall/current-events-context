strategic_conclusion: >
  January 8, 2000 marked a sharp military and geophysical inflection point at the end of the
  year's first full week. In Chechnya, the surprise Chechen counteroffensive into Argun,
  Shali, and Gudermes exposed the vulnerability of Russian rear areas and forced a command
  shake-up in Moscow; in Shepherdstown, procedural deadlock stalled the Israeli–Syrian peace
  summit; and along the Tonga Trench, Guadalcanal, and northern Chile, a magnitude 7.2
  mainshock and two magnitude 6.4 earthquakes produced the year's first major global seismic
  surge.

