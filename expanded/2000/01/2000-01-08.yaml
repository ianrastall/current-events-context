    importance: 6
    headline: "Tennessee Titans defeat the Buffalo Bills 22–16 in the NFL Wild Card playoffs on the \"Music City Miracle\" kickoff lateral"
    summary: >
      On January 8, 2000, in the AFC Wild Card playoff game at Adelphia Coliseum in
      Nashville, Tennessee, the Tennessee Titans defeated the Buffalo Bills 22–16 on the
      "Music City Miracle"—a 75-yard kickoff return touchdown with 16 seconds remaining in
      which tight end Frank Wycheck threw a cross-field backward pass (lateral) to wide
      receiver Kevin Dyson, who sprinted down the left sideline as time expired and the play
      was upheld after video replay review.
    key_data:
      - label: "Final score of the AFC Wild Card game (Jan 8, 2000)"
        value: "Tennessee Titans 22, Buffalo Bills 16"
        citation_refs: [10]
      - label: "Time remaining at start of kickoff return / end of touchdown"
        value: "0:16 remaining at kickoff; 0:03 remaining at touchdown (75-yard return)"
        citation_refs: [10]
      - label: "Attendance at Adelphia Coliseum, Nashville"
        value: "66,672 spectators"
        citation_refs: [10]
      - label: "Wikidata day-precision item (`2000-01-08`)"
        value: "`Q6941481` (Music City Miracle, sitelinks=5)"
        citation_refs: [10]
      - label: "Casualties"
        value: "None"
        citation_refs: [10]
    details:
      what_happened:
        - "Trailing 15–13 in the final minute of the AFC Wild Card playoff game in Nashville on Saturday afternoon, January 8, 2000, the Buffalo Bills took a 16–15 lead with 16 seconds left on a 41-yard field goal by Steve Christie."
        - "On the ensuing squib kickoff by Christie, Titans fullback Lorenzo Neal fielded the ball at the 25-yard line and handed it off to tight end Frank Wycheck, who ran right to draw the Buffalo coverage team before throwing the ball across the field along the 25-yard line to wide receiver Kevin Dyson; Dyson caught the ball in stride behind a convoy of blockers and raced 75 yards down the left sideline for a touchdown with three seconds remaining."
        - "Referee Phil Luckett reviewed the instant replay for several minutes to determine whether Wycheck's cross-field throw was an illegal forward pass or a legal lateral, ruling that the ball had not traveled forward and confirming the touchdown for a 22–16 Tennessee victory."
      why_it_matters:
        - "Ranked among the greatest and most replayed finishes in National Football League history, the \"Music City Miracle\" propelled the Tennessee Titans all the way to Super Bowl XXXIV while marking the start of a 17-season NFL playoff drought for the Buffalo Bills (1999–2016)."
        - "None."
      uncertainty_notes: []
