    details:
      what_happened:
        - "Less than a month after Sudanese President Omar al-Bashir dissolved parliament and declared a three-month state of emergency on December 12, 1999 to sideline Islamist rival Hassan al-Turabi, `SPLA` and allied southern factions pressed attacks on January 7–8, 2000 near the Heglig and Bentiu oilfields in Unity State (Western Upper Nile), which had begun exporting crude via the 1,600-km pipeline to Port Sudan in August 1999."
        - "Simultaneously, international humanitarian relief organizations operating out of Nairobi and Lokichoggio reported security restrictions and flight denials affecting aid workers in southern Sudan."
      why_it_matters:
        - "The early 2000 battles around Unity State oilfields underscored how oil revenues had become the central strategic prize of the Second Sudanese Civil War while al-Bashir consolidated executive power in Khartoum."
