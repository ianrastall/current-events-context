    importance: 7
    headline: "Angolan and Namibian forces battle UNITA rebels along the Kavango and Caprivi border regions"
    summary: >
      On January 8, 2000, Angolan Armed Forces (`FAA`) units operating jointly with the
      Namibian Defence Force (`NDF`) pressed cross-border sweeps against National Union for
      the Total Independence of Angola (`UNITA`) rebel bases along the Okavango River and
      Caprivi Strip border, following weeks of clashes and roadside ambushes that killed
      dozens of soldiers and civilians and drew Namibia directly into the Angolan Civil War.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000108`, Luanda / Windhoek / Rebel)"
        value: "75 combined mentions across 65 articles"
        citation_refs: [9]
      - label: "Casualties"
        value: "Dozens killed or wounded in cross-border Kavango and Cuando Cubango clashes"
        citation_refs: [9]
    details:
      what_happened:
        - "After Namibian President Sam Nujoma granted the Angolan Armed Forces (`FAA`) permission in December 1999 to launch offensive operations against Jonas Savimbi's `UNITA` strongholds in southern Angola from Namibian soil, joint Angolan and Namibian columns battled UNITA guerrillas around Jamba, Calai, and the Kavango/Caprivi frontier on January 7–8, 2000."
        - "Retaliatory night raids, landmine attacks, and highway ambushes inside Namibia's Kavango Region—including an attack on French tourists and local villagers—prompted Windhoek to impose dusk-to-dawn military escorts along the Trans-Caprivi Highway and deploy additional Namibian troops to the border."
      why_it_matters:
        - "The opening of a southern front from Namibian territory deprived UNITA of its historic logistical sanctuaries in Cuando Cubango Province, fatally weakening Savimbi's conventional military capability over the final two years of the Angolan Civil War."
        - "Both UNITA and the Namibian Defence Force accused each other of cross-border looting and attacks on border villages."
