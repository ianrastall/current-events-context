  - id: "evt-2000-01-08-004"
    category: "International relations"
    subcategory: ""
    topics:
      - "China"
      - "India"
    importance: 7
    headline: "China warns India against granting asylum to the 17th Karmapa Lama while detaining U.S.-based historian Song Yongyi in Beijing"
    summary: >
      On January 8, 2000, Chinese officials in Beijing warned the Indian government that
      granting political asylum to the 14-year-old 17th Karmapa Lama would violate the Five
      Principles of Peaceful Coexistence, while U.S. diplomats and academics protested
      Beijing's formal arrest and prosecution of Dickinson College librarian and Cultural
      Revolution researcher Song Yongyi on charges of "illegally providing intelligence to
      foreigners."
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000108`, Beijing / Scholar <-> Lawyer)"
        value: "222 combined mentions across 202 articles"
        citation_refs: [7]
      - label: "Date of Song Yongyi's formal arrest warrant in Beijing"
        value: "December 24, 1999 (publicly confirmed and protested January 2000)"
        citation_refs: [8]
      - label: "Casualties"
        value: "None; 1 academic detained"
        citation_refs: [8]
    details:
      what_happened:
        - "Following Beijing's January 7 acknowledgment that the 14-year-old 17th Karmapa Lama had left Tsurphu Monastery, Chinese diplomats and Foreign Ministry spokesmen warned New Delhi on Saturday, January 8, 2000 that allowing the Karmapa to remain in India as a political refugee would harm improving Sino-Indian relations, while Indian external affairs officials stated they were still gathering facts on the boy's arrival in Dharamshala."
        - "Simultaneously in Beijing, Chinese state security officials blocked U.S.-based bibliographer and Dickinson College (Pennsylvania) librarian Song Yongyi—detained since August 1999 while collecting published Red Guard newspapers and Cultural Revolution documents in Beijing—from meeting his defense lawyer Tong Lihua after formally charging him with \"illegally providing intelligence to foreign organizations,\" prompting protests from the U.S. Embassy and the American Library Association."
      why_it_matters:
        - "International diplomatic and congressional outcry over Song Yongyi's prosecution—at a sensitive moment when the Clinton administration was seeking congressional approval of Permanent Normal Trade Relations (`PNTR`) with China—led Beijing to drop the charges and release Song on January 28, 2000, allowing him to return to the United States immediately before becoming a U.S. citizen."
        - "India avoided formally granting the 17th Karmapa \"political asylum\" on January 8, eventually permitting him to reside in India as a religious guest under strict travel restrictions."
      uncertainty_notes: []
