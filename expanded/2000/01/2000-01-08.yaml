    details:
      what_happened:
        - "Born in New York City on July 29, 1925, Hilary Hurlburt Smart won the 1948 Star World Championship in Cascais, Portugal and the Olympic gold medal in the Star class at Torquay during the 1948 London Summer Olympics while crewing for his father, Paul Smart (a founder and president of the International Star Class Yacht Racing Association), aboard their boat Hilarius."
