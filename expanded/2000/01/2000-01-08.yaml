  - id: "evt-2000-01-08-002"
    category: "Disasters and accidents"
    subcategory: ""
    topics:
      - "Tonga"
      - "Solomon Islands"
    importance: 8
    headline: "Magnitude 7.2 earthquake in Tonga—the first M7.0+ earthquake of 2000—and twin M6.4 earthquakes in the Solomon Islands and Chile lead 14 global M4.5+ events"
    summary: >
      On January 8, 2000 at 16:47:20 UTC, a major magnitude 7.2 intermediate-depth
      earthquake (`usp0009kx3`, depth 183.4 km) ruptured the Tonga subduction slab 117 km
      south-southwest of Hihifo, Tonga—becoming the first `M7.0+` earthquake of the year
      2000 worldwide—hours after two strong magnitude 6.4 earthquakes struck Guadalcanal in
      the Solomon Islands (`usp0009kvr` at 01:19:46 UTC) and northern Chile near Antofagasta
      (`usp0009kwj` at 11:59:21 UTC) at the head of 14 global `M4.5+` earthquakes.
    key_data:
      - label: "Hihifo, Tonga major earthquake (`usp0009kx3`)"
        value: "M 7.2 at 16:47:20 UTC (16.925°S, 174.248°W, depth 183.4 km)"
        citation_refs: [3]
      - label: "Malango / Guadalcanal, Solomon Islands earthquake (`usp0009kvr`)"
        value: "M 6.4 at 01:19:46 UTC (9.805°S, 159.811°E, depth 33.0 km)"
        citation_refs: [4]
      - label: "Antofagasta, Chile earthquake (`usp0009kwj`)"
        value: "M 6.4 at 11:59:21 UTC (23.169°S, 70.122°W, depth 36.0 km)"
        citation_refs: [5]
      - label: "Total global M4.5+ earthquakes on January 8, 2000"
        value: "14 earthquakes (including M5.6 Indonesia and M5.4 offshore California)"
        citation_refs: [3]
      - label: "Casualties"
        value: "None"
        citation_refs: [3]
    details:
      what_happened:
        - "At 01:19:46 UTC on Saturday, January 8, 2000, a strong magnitude 6.4 shallow thrust earthquake (`usp0009kvr`, depth 33.0 km) struck 15 km southeast of Malango on Guadalcanal Island near the Solomon Islands capital of Honiara, followed at 02:17:31 UTC by a magnitude 5.4 earthquake (`usp0009kvv`) on the Mendocino Fracture Zone 189 km west of Ferndale, California and at 03:44:54 UTC by a magnitude 5.6 earthquake (`usp0009kw1`) near Labuan in the Sunda Strait, Indonesia."
        - "At 11:59:21 UTC (08:59 local time in Chile), a second magnitude 6.4 interplate earthquake (`usp0009kwj`, depth 36.0 km) struck 60 km north-northeast of Antofagasta and south of Mejillones in northern Chile, shaking buildings across the Antofagasta Region (`MMI V–VI`) without causing serious damage or injuries."
        - "At 16:47:20 UTC, a major magnitude 7.2 (`Mw`) intraslab earthquake (`usp0009kx3`) ruptured at a depth of 183.4 km within the subducting Pacific Plate 117 km south-southwest of Hihifo (Niuatoputapu) in northern Tonga, felt across the Tonga, Samoa, and Lau island groups without generating a tsunami due to its intermediate focal depth."
      why_it_matters:
        - "Recording one `M7.2` and two `M6.4` earthquakes within a single 16-hour UTC window, January 8, 2000 marked the first major global seismic peak of the 21st century's opening year."
        - "None."
      uncertainty_notes: []
