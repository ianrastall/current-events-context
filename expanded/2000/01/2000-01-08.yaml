        - "On the same day in Colombo, thousands of mourners attended the funeral of assassinated All Ceylon Tamil Congress (`ACTC`) leader Kumar Ponnambalam while President Chandrika Kumaratunga delivered a combative television broadcast alleging a broader LTTE conspiracy to assassinate Sri Lanka's political leadership."
