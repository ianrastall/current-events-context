    headline: "Human rights groups criticize NATO peacekeepers over indicted war criminals remaining at large in Bosnia-Herzegovina"
    summary: >
      On January 8, 2000, international human rights organizations and war-crimes monitors
      criticized NATO's Stabilization Force (`SFOR`) and authorities in Bosnia and
      Herzegovina's Republika Srpska over the slow pace of arrests of publicly indicted
      war-crimes suspects—including wartime Bosnian Serb leader Radovan Karadžić and
      military commander Ratko Mladić—warning that the continued impunity of indicted
      figures was obstructing refugee returns four years after the Dayton Agreement.
