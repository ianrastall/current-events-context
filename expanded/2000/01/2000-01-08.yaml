    headline: "American 1948 Olympic Star-class sailing gold medalist Hilary Smart dies in Massachusetts at age 74"
    summary: >
      On January 8, 2000, American yachtsman Hilary Smart—who won the Olympic gold medal in
      the two-person Star keelboat class crewing for his father Paul Smart aboard Hilarius
      at the 1948 London Summer Olympics—died in Weston, Massachusetts at the age of 74.
