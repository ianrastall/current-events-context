    details:
      what_happened:
        - "With Spain on maximum counterterrorism alert following ETA's announcement terminating its 14-month truce effective December 3, 1999 and the Civil Guard's December 21–22 seizure of two vans carrying 950 kg and 750 kg of explosives near Zaragoza, Spanish National Court (Audiencia Nacional) magistrates and police carried out raids and remand hearings on January 5, 2000 targeting suspected ETA logistics operatives and prison-support networks."
        - "Prime Minister José María Aznar's government vowed no concessions to ETA ahead of Spain's March 2000 general election and urged Basque nationalist parties to sever all political pacts with ETA's political wing, Euskal Herritarrok (`EH`)."
      why_it_matters:
        - "The early January 2000 counterterrorism alerts foreshadowed ETA's return to lethal bombings just 16 days later on January 21, 2000, when twin car bombs in Madrid killed Spanish Army Lieutenant Colonel Pedro Antonio Blanco."
