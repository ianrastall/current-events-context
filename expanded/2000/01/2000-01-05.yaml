    importance: 5
    headline: "Democratic presidential candidates Al Gore and Bill Bradley clash in televised New Hampshire primary debate"
    summary: >
      On the evening of January 5, 2000, U.S. Vice President Al Gore and former New Jersey
      Senator Bill Bradley met at the University of New Hampshire in Durham for their first
      televised debate of the year 2000 ahead of the January 24 Iowa caucuses and the
      February 1 New Hampshire primary, clashing sharply over universal health-care
      coverage, campaign finance reform, and federal agricultural subsidies.
    key_data:
      - label: "Venue of the January 5, 2000 Democratic presidential debate"
        value: "University of New Hampshire, Durham, New Hampshire"
        citation_refs: [16]
      - label: "Days remaining until the February 1, 2000 New Hampshire primary"
        value: "27 days"
        citation_refs: [16]
      - label: "Casualties"
        value: "None"
        citation_refs: [16]
    details:
      what_happened:
        - "With polls showing former Senator Bill Bradley running neck-and-neck with or slightly ahead of Vice President Al Gore in New Hampshire while Gore led in Iowa and national polls, the two contenders for the 2000 Democratic presidential nomination debated for 90 minutes at the University of New Hampshire in Durham on Wednesday, January 5, 2000."
        - "Gore attacked Bradley's $65 billion-per-year health-care proposal as fiscally irresponsible and harmful to Medicaid and the working poor, while Bradley accused Gore of misrepresenting his record and failing to champion bold systemic reform during seven years in the Clinton-Gore administration."
      why_it_matters:
        - "Gore's aggressive debate performances in early January 2000 helped stem Bradley's momentum in New Hampshire, enabling Gore to sweep both the January 24 Iowa caucuses and the February 1 New Hampshire primary (`50%` to `46%`) on his way to the Democratic nomination."
        - "None."
