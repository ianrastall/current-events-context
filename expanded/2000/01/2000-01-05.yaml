    importance: 7
    headline: "Federal prosecutors expand charges in the al-Qaeda millennium plot after the arrest of Ahmed Ressam and alleged co-conspirators"
    summary: >
      On January 5, 2000, U.S. federal prosecutors and the Federal Bureau of Investigation
      (`FBI`) expanded their multi-state investigation into the Algerian terror network
      linked to Ahmed Ressam—arrested at Port Angeles, Washington on December 14, 1999 with
      130 pounds of explosives chemicals intended to bomb Los Angeles International Airport
      (`LAX`)—bringing suspected Brooklyn contact Abdelghani Meskini and Montreal associates
      before federal courts in Seattle and New York while customs authorities tightened
      security along the U.S.–Canadian border.
    key_data:
      - label: "Explosives and precursors seized in Ahmed Ressam's car at Port Angeles"
        value: "~130 lb (59 kg) of urea, sulfate, RDX/nitroglycerin components, and 4 timing devices"
        citation_refs: [17]
      - label: "Casualties"
        value: "None"
        citation_refs: [17]
    details:
      what_happened:
        - "Following the December 14, 1999 arrest of 32-year-old Algerian national Ahmed Ressam as he disembarked the ferry MV Coho from Victoria, British Columbia at Port Angeles, Washington with a trunkload of bomb-making materials, FBI agents traced Ressam's Seattle hotel reservation and telephone records to Brooklyn resident Abdelghani Meskini and a Montreal-based Algerian cell trained at al-Qaeda camps in Afghanistan."
        - "On January 5, 2000, federal authorities in New York and Seattle coordinated detention and grand-jury proceedings against Ressam, Meskini, and suspected cell contacts in Boston, New York, and Montreal, revealing that Ressam had traveled to Los Angeles in 1999 to scout luggage carousels at Los Angeles International Airport (`LAX`) for a New Year's Eve bombing."
      why_it_matters:
        - "The Ressam investigation—alongside the simultaneous Jordanian disruption of a plot against millennium tourists in Amman—exposed al-Qaeda's first major operational attempt to strike inside the continental United States prior to the September 11, 2001 attacks."
        - "Full details of Ressam's target selection (`LAX`) were only publicly confirmed after co-defendant Abdelghani Meskini agreed to plea-bargain and after Ressam himself began cooperating with investigators in 2001."
      uncertainty_notes: []
