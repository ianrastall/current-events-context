    importance: 8
    headline: "President Bill Clinton returns to Shepherdstown as U.S. mediators press Israeli and Syrian committees on borders and security"
    summary: >
      On January 5, 2000—the third day of the Shepherdstown peace summit—U.S. President Bill
      Clinton traveled back to West Virginia for a third consecutive day of mediation with
      Israeli Prime Minister Ehud Barak and Syrian Foreign Minister Farouk al-Sharaa as two
      of the four planned joint working committees (covering borders and security
      arrangements) held their first substantive sessions.
    key_data:
