    importance: 5
    headline: "Magnitude 6.1 earthquake strikes the Santa Cruz Islands (Solomon Islands), leading 17 global M4.5+ earthquakes including an M5.8 off Java and an M5.5 in Tibet"
    summary: >
      On January 5, 2000 at 07:40:40 UTC, a strong magnitude 6.1 earthquake (`usp0009ksx`,
      depth 33 km) struck 84 km south-southwest of Lata in the Santa Cruz Islands, Solomon
      Islands, triggering an eight-earthquake swarm (`M4.6` to `M5.5`) along the northern
      New Hebrides Trench. In total, the USGS ANSS Comprehensive Catalog recorded 17 `M4.5+`
      earthquakes worldwide on January 5, including a magnitude 5.8 earthquake off southern
      Java, Indonesia (`usp0009ktm`), a magnitude 5.6 earthquake in Tonga (`usp0009ksw`), a
      magnitude 5.6 earthquake in the Scotia Sea (`usp0009ktl`), and a shallow magnitude 5.5
      earthquake northeast of Nagqu, Tibet (`usp0009kt2`).
    key_data:
      - label: "Solomon Islands mainshock (`usp0009ksx`)"
        value: "M 6.1 at 07:40:40 UTC (11.411°S, 165.495°E, depth 33.0 km)"
        citation_refs: [18]
      - label: "Southern Java, Indonesia earthquake (`usp0009ktm`)"
        value: "M 5.8 at 18:26:07 UTC (9.247°S, 109.754°E, 156 km SSW of Srandakan)"
        citation_refs: [19]
      - label: "Nagqu, Tibet earthquake (`usp0009kt2`)"
        value: "M 5.5 at 09:45:18 UTC (32.163°N, 92.750°E, 102 km NE of Nagqu)"
        citation_refs: [18]
      - label: "Total global M4.5+ earthquakes on January 5, 2000"
        value: "17 earthquakes (including 9 in the Santa Cruz Islands swarm)"
        citation_refs: [18]
      - label: "Casualties"
        value: "None"
        citation_refs: [18]
    details:
      what_happened:
        - "Following an `M4.6` foreshock at 05:39:11 UTC, a strong magnitude 6.1 (`Mw`) interplate thrust earthquake (`usp0009ksx`) ruptured 84 km south-southwest of Lata on Nendo Island in Temotu Province, Solomon Islands at 07:40:40 UTC on January 5, 2000, followed over the next 13 hours by seven aftershocks of magnitudes 5.5, 5.1, 5.4, 4.9, 4.8, 4.7, and 4.6 in the same segment."
        - "Less than nine minutes before the Solomon Islands mainshock, at 07:32:19 UTC, a magnitude 5.6 earthquake (`usp0009ksw`) struck 97 km east-northeast of 'Ohonua, Tonga, followed at 09:45:18 UTC by a magnitude 5.5 continental earthquake (`usp0009kt2`) 102 km northeast of Nagqu on the central Tibetan Plateau, at 17:55:11 UTC by a magnitude 5.6 event (`usp0009ktl`) in the Scotia Sea, and at 18:26:07 UTC by a magnitude 5.8 subduction earthquake (`usp0009ktm`) in the Indian Ocean 156 km south-southwest of Srandakan (Yogyakarta region), Java, Indonesia."
      why_it_matters:
        - "The January 5 `M6.1` Santa Cruz Islands earthquake was the first `M6.0+` seismic event of the year 2000 globally, marking an energetic pulse of subduction-zone slip across the Southwest Pacific and Sunda arcs."
        - "Because the `M6.1` Solomon Islands and `M5.8` Java epicenters were located offshore, neither event generated destructive tsunami waves or reported fatalities on land."
