    details:
      what_happened:
        - "Following China's December 20, 1999 sovereignty handover of Macau from Portugal—which Beijing hailed as the second application of Deng Xiaoping's \"One Country, Two Systems\" model after Hong Kong—Chinese Vice Premier Qian Qichen and Taiwan Affairs Office spokesmen stated on January 5, 2000 that settling the Taiwan question was China's next historic task."
        - "Beijing warned Taiwanese voters and the three leading presidential candidates—Vice President Lien Chan of the Kuomintang (`KMT`), independent James Soong, and pro-independence Democratic Progressive Party (`DPP`) candidate Chen Shui-bian—that enshrining Lee Teng-hui's July 1999 \"two-state\" theory into policy would provoke grave consequences across the Taiwan Strait."
      why_it_matters:
        - "The early January 2000 warnings opened Beijing's escalating rhetorical campaign ahead of the March 2000 election, which culminated in China's February 2000 Taiwan White Paper and the historic election of DPP candidate Chen Shui-bian on March 18, 2000."
        - "None."
