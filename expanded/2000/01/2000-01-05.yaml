    headline: "Beijing warns Taiwan against independence ahead of the March 2000 Taiwanese presidential election"
    summary: >
      On January 5, 2000, senior Chinese officials in Beijing led by Vice Premier Qian
      Qichen and the Taiwan Affairs Office issued a sharp New Year warning to Taipei ahead
      of Taiwan's March 18, 2000 presidential election, condemning outgoing Taiwanese
      President Lee Teng-hui's "two-state" (special state-to-state) formula and warning that
      any move toward formal Taiwanese independence would rule out peaceful reunification.
