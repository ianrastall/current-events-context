    importance: 6
    headline: "Thousands of Muslim demonstrators rally in Jakarta demanding government action and jihad over North Maluku sectarian killings"
    summary: >
      On January 5, 2000, thousands of Indonesian Muslim protesters rallied in central
      Jakarta outside the United Nations mission and government ministries to denounce the
      massacre of hundreds of Muslims in Tobelo and Galela on Halmahera Island in North
      Maluku, demanding that President Abdurrahman Wahid dismiss military commanders and
      vowing to launch a jihad (holy war) to defend Muslims in the Maluku islands.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000105`, Jakarta)"
        value: "`RESIDENTS -> INDONESIAN (CAMEO 010)` — 46 mentions across 32 articles"
        citation_refs: [15]
      - label: "Casualties"
        value: "None in the January 5 Jakarta demonstrations"
        citation_refs: [15]
    details:
      what_happened:
        - "As displaced survivors arriving in Ternate recounted the late-December and New Year massacres of hundreds of Muslim villagers in Tobelo and Galela, Islamic student and activist groups staged demonstrations in Jakarta on Wednesday, January 5, 2000 accusing Christian militias and foreign powers of instigating the bloodshed and condemning President Abdurrahman Wahid's administration as ineffective."
        - "Indonesian military spokesman Rear Admiral Sudarto stated on January 5 that additional battalions deployed to North Maluku had begun restoring fragile order in Tobelo and Ternate, though sporadic arson and clashes continued in Ambon and Haruku Island."
      why_it_matters:
        - "The January 5 Jakarta protests built directly toward the massive January 7 \"Million Ummah\" rally at Jakarta's National Monument (Monas) attended by leading opposition politicians including Amien Rais and Hamzah Haz, which catalyzed the mobilization of Laskar Jihad fighters to Maluku."
        - "Crowd size estimates in Jakarta varied between police and protest organizers."
