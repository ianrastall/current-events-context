  - id: "evt-2000-01-05-003"
    category: "International relations"
    subcategory: ""
    topics:
      - "India"
      - "China"
    importance: 8
    headline: "Fourteen-year-old 17th Karmapa Lama Ogyen Trinley Dorje arrives in Dharamshala, India after an eight-day escape across the Himalayas from Tibet"
    summary: >
      On January 5, 2000, 14-year-old Ogyen Trinley Dorje, the 17th Gyalwang
      Karmapa—spiritual head of the Karma Kagyu school of Tibetan Buddhism and the only high
      reincarnate lama recognized by both the 14th Dalai Lama and the government of the
      People's Republic of China—arrived in Dharamshala, India and was received by the Dalai
      Lama after a secret eight-day, 900-mile (1,450 km) escape from Tsurphu Monastery near
      Lhasa that began on December 28, 1999.
    key_data:
      - label: "Age of the 17th Karmapa Ogyen Trinley Dorje upon arrival"
        value: "14 years old (enthroned at Tsurphu Monastery in 1992)"
        citation_refs: [5]
      - label: "Distance and duration of escape from Tsurphu to Dharamshala"
        value: "~900 miles (1,450 km) over 8 days (Dec 28, 1999 – Jan 5, 2000)"
        citation_refs: [5]
      - label: "Casualties"
        value: "None"
        citation_refs: [5]
    details:
      what_happened:
        - "Late on the night of December 28, 1999, 14-year-old Ogyen Trinley Dorje slipped out of a window at Tsurphu Monastery northwest of Lhasa—pretending to enter a solitary meditation retreat so Chinese guards would not notice his absence for days—and traveled with a small group of monks by four-wheel-drive vehicle, on foot, on horseback across the snowbound Mustang border into Nepal, by chartered helicopter to Pokhara, and by train and car into Himachal Pradesh, India."
        - "On the morning of Wednesday, January 5, 2000, the young Karmapa reached the seat of the Tibetan Government-in-Exile at McLeod Ganj, Dharamshala, where he had an emotional meeting with the 14th Dalai Lama, Tenzin Gyatso."
        - "Caught off guard by the defection of a lama whom Beijing had officially enthroned in 1992 as a symbol of patriotic religious harmony in Tibet, Chinese authorities stated on January 6–7 that the Karmapa had left a letter at Tsurphu saying he had gone abroad only to collect \"black hats and musical instruments\" of previous Karmapas and had not betrayed the state."
      why_it_matters:
        - "The 17th Karmapa's dramatic escape dealt a major blow to Beijing's religious legitimacy policy in Tibet while creating delicate diplomatic challenges for New Delhi, which sought to avoid provoking China while sheltering the third-highest figure in Tibetan Buddhism."
        - "Exact details of the escape route through Mustang, Nepal were initially withheld by Tibetan exile officials on January 5 to protect local guides and monastery staff from reprisals."
      uncertainty_notes: []
