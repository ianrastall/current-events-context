  - id: "evt-2000-01-05-004"
    category: "International relations"
    subcategory: ""
    topics:
      - "Israel"
      - "Palestine"
    importance: 8
    headline: "Israeli Cabinet approves maps transferring an additional 5% of West Bank land to Palestinian Authority control"
    summary: >
      On January 5, 2000, Israel's Security Cabinet formally approved the redeployment maps
      signed the previous night in Jerusalem, authorizing the Israel Defense Forces (`IDF`)
      to hand over an additional 5% of West Bank territory to full or partial Palestinian
      Authority administration. The transfer—the highest-volume global diplomatic cluster in
      the GDELT 1.0 archive for January 5 (`100 mentions` across `44 articles`)—placed
      roughly 40% of the West Bank under full (`Area A`) or civil (`Area B`) Palestinian
      jurisdiction.
    key_data:
      - label: "West Bank territory approved for transfer on January 5, 2000"
        value: "5% (2% to full PA security/civil Area A; 3% to PA civil Area B)"
        citation_refs: [7]
      - label: "GDELT 1.0 CAMEO cluster (`20000105`, Israel -> Palestinian)"
        value: "100 mentions across 44 articles (highest global cluster on Jan 5)"
        citation_refs: [7]
      - label: "Casualties"
        value: "None"
        citation_refs: [7]
    details:
      what_happened:
        - "Meeting on Wednesday, January 5, 2000 while Prime Minister Ehud Barak negotiated with Syria in Shepherdstown, the Israeli Security Cabinet ratified the maps signed on January 4 by negotiators Oded Eran and Saeb Erekat, covering sparsely populated areas and villages near Ramallah, Jenin, Nablus, and Hebron."
        - "Israeli troops began pulling back from the designated zones on January 5–6, bringing approximately 18% of the West Bank under full Palestinian security and civil control (`Area A`) and another 21–22% under Palestinian civil administration with joint Israeli security control (`Area B`)."
      why_it_matters:
        - "Completing the second Sharm el-Sheikh tranche preserved momentum on the Israeli–Palestinian track ahead of Palestinian President Yasser Arafat's scheduled late-January 2000 summit with President Clinton in Washington."
        - "Disagreements immediately resurfaced over the next 6.1% West Bank withdrawal scheduled for January 20, 2000, which Israel subsequently sought to postpone while focusing on the Syrian track."
      uncertainty_notes: []
