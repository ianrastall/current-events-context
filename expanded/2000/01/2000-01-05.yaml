  - id: "evt-2000-01-05-002"
    category: "Law and crime"
    subcategory: ""
    topics:
      - "United States"
      - "Cuba"
    importance: 9
    headline: "U.S. Immigration and Naturalization Service rules that six-year-old Elián González must be returned to his father in Cuba by January 14"
    summary: >
      On January 5, 2000, U.S. Immigration and Naturalization Service (INS) Commissioner
      Doris Meissner announced a landmark custody decision finding that Juan Miguel González
      of Cárdenas, Cuba possessed the sole legal authority to speak for his six-year-old son
      Elián González, withdrawing the asylum petitions filed by the boy's Miami relatives
      and ordering that arrangements be completed for his return to Cuba by January 14,
      2000. The ruling received the immediate endorsement of President Bill Clinton and
      Attorney General Janet Reno but sparked protests and port blockades in Miami as
      Florida Governor Jeb Bush and congressional Republicans vowed to block the boy's
      repatriation.
    key_data:
      - label: "Deadline set by INS for Elián González's return to his father"
        value: "January 14, 2000"
        citation_refs: [3]
      - label: "GDELT 1.0 CAMEO cluster (`20000105`, Cuba / Miami)"
        value: "89 mentions across 56 articles"
        citation_refs: [3]
      - label: "Casualties"
        value: "None"
        citation_refs: [3]
    details:
      what_happened:
        - "At a Washington press conference on Wednesday, January 5, 2000, INS Commissioner Doris Meissner announced that following two detailed interviews conducted by U.S. officials in Cuba with Juan Miguel González (on December 13 and December 31, 1999), the agency had determined that the father had a close, loving relationship with six-year-old Elián and was expressing his genuine, uncoerced parental will in demanding the boy's return and withdrawing any U.S. asylum application."
        - "Meissner declared, \"This little boy, who has been through so much, belongs with his father,\" and set a January 14, 2000 deadline for transferring custody from great-uncle Lázaro González in Miami back to Juan Miguel González."
        - "In Miami, Cuban-American demonstrators blocked streets and the Port of Miami, resulting in dozens of arrests on January 5–6, while attorneys for the Miami relatives petitioned Attorney General Janet Reno and prepared federal lawsuits and a Florida state family-court emergency custody petition to halt the January 14 transfer."
      why_it_matters:
        - "The January 5 INS determination established the core federal legal position that governed the remaining six months of the Elián González crisis, which was ultimately upheld by the U.S. Court of Appeals for the Eleventh Circuit in June 2000 before the boy returned to Cuba with his father."
        - "Following emergency state court filings and federal appeals by the Miami relatives, Attorney General Janet Reno subsequently extended the January 14 deadline to allow federal court review of the INS's statutory authority."
      uncertainty_notes: []
