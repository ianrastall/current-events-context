    headline: "Spanish and French authorities arrest Basque separatist suspects and investigate ETA bomb plots after expiration of 14-month ceasefire"
    summary: >
      On January 5, 2000, Spanish judicial authorities and counterterrorism police pressed
      arrests and court proceedings against suspected Basque separatist militants and legal
      intermediaries following the formal expiration of ETA's 14-month ceasefire on December
      3, 1999 and the late-December interception near Calatayud of two ETA vans packed with
      1,700 kilograms of explosives bound for Madrid.
