analytical_overview: >
  On Wednesday, January 5, 2000, high-profile political violence in South Asia, a landmark
  U.S. immigration ruling in the Elián González custody crisis, and a dramatic Himalayan
  escape by one of Tibetan Buddhism's highest reincarnate lamas converged with intensifying
  counterterrorism and diplomatic developments across the globe. In Colombo, Sri Lanka, a
  female Liberation Tigers of Tamil Eelam (LTTE) suicide bomber blew herself up outside the
  office of Prime Minister Sirimavo Bandaranaike when challenged by police, killing 13
  people and injuring nearly 30; hours later in the capital's Wellawatte district, prominent
  Tamil human rights lawyer and All Ceylon Tamil Congress leader Kumar Ponnambalam was
  assassinated in his car by unidentified gunmen, prompting an immediate curfew across
  Colombo. In Washington, U.S. Immigration and Naturalization Service (INS) Commissioner
  Doris Meissner ruled that Juan Miguel González of Cárdenas, Cuba held the sole parental
  authority to speak for his six-year-old son Elián González and ordered the boy returned to
  Cuba by January 14, triggering street blockades across Miami and immediate legal appeals
  by the boy's Florida relatives.

  Meanwhile, in Dharamshala, India, 14-year-old Ogyen Trinley Dorje—the 17th Gyalwang
  Karmapa and the only high Tibetan Buddhist lama recognized by both the 14th Dalai Lama and
  the government of the People's Republic of China—arrived safely after a clandestine
  eight-day, 900-mile escape across the Himalayas from Tsurphu Monastery in Tibet. In the
  Middle East and North America, President Bill Clinton returned to the Shepherdstown summit
  as Israeli and Syrian negotiators worked in four parallel committees, while the Israeli
  Cabinet approved maps transferring an additional 5% of the West Bank to Palestinian
  control. Elsewhere, Russian forces suffered heavy casualties in Chechen ambushes at
  Alkhan-Kala and Grozny as Moscow tightened military censorship, Spanish police arrested
  alleged ETA militants following the end of the Basque group's ceasefire, British medical
  specialists examined former Chilean dictator Augusto Pinochet in London, clashes in Lagos
  involving the Oodua People's Congress left dozens dead in Nigeria, and a magnitude 6.1
  earthquake struck the Santa Cruz Islands in the Solomon Islands at the head of a
  17-earthquake global `M4.5+` sequence.

