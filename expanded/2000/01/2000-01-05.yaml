strategic_conclusion: >
  January 5, 2000 highlighted how local political flashpoints and cross-border movements
  rapidly acquired international significance in the opening week of 2000. In Colombo, the
  back-to-back LTTE suicide bombing outside the Prime Minister's office and the
  assassination of Tamil leader Kumar Ponnambalam plunged Sri Lanka deeper into civil war;
  in Washington and Miami, the INS order returning six-year-old Elián González to his father
  in Cuba ignited a months-long legal and political confrontation; and in Dharamshala, the
  surprise arrival of the 14-year-old 17th Karmapa Lama from Tibet reshaped the religious
  geopolitics of the Himalayas even as mediators at Shepherdstown and Jerusalem pushed
  forward on the Israeli–Syrian and Israeli–Palestinian peace tracks.

