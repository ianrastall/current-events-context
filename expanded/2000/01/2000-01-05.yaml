    importance: 7
    headline: "British medical panel examines former Chilean dictator Augusto Pinochet in London as human rights groups challenge fitness inquiry"
    summary: >
      On January 5, 2000, a panel of four British medical specialists appointed by UK Home
      Secretary Jack Straw carried out an intensive seven-hour medical and neurological
      examination of 84-year-old former Chilean military ruler General Augusto Pinochet at
      the Northwick Park Hospital in northwest London to determine whether brain damage from
      recent strokes rendered him mentally and physically unfit to be extradited to Spain to
      stand trial for torture. Human rights organizations led by Amnesty International
      demanded transparency and independent verification of the medical findings.
    key_data:
      - label: "Age of former Chilean dictator Augusto Pinochet"
        value: "84 years old (under UK house arrest since October 16, 1998)"
        citation_refs: [10]
      - label: "Medical specialists on the Home Office panel"
        value: "4 independent British clinicians (geriatrics, neurology, neuropsychology)"
        citation_refs: [10]
      - label: "GDELT 1.0 CAMEO cluster (`20000105`, Human Rights Group -> Britain)"
        value: "34 mentions across 34 articles"
        citation_refs: [10]
      - label: "Casualties"
        value: "None"
        citation_refs: [10]
    details:
      what_happened:
        - "Following diplomatic representations by the Chilean government that 84-year-old Senator-for-Life Augusto Pinochet had suffered a series of minor strokes while under house arrest at the Wentworth estate in Surrey, UK Home Secretary Jack Straw commissioned an independent four-member medical team to examine Pinochet at Northwick Park Hospital in Harrow, London on Wednesday, January 5, 2000."
        - "Human rights groups including Amnesty International and lawyers acting for Spanish investigating magistrate Baltasar Garzón protested on January 5 that prosecutors and victims' representatives were excluded from observing the examination and demanded the right to review the medical report."
      why_it_matters:
        - "The January 5 medical examination produced the unanimous clinical conclusion—announced by Jack Straw six days later on January 11, 2000—that Pinochet was medically unfit to stand trial, leading ultimately to his release and return to Chile on March 2, 2000 after 503 days of detention in Britain."
        - "While the examination took place on January 5, 2000, the Home Office kept the doctors' conclusions confidential until Straw's formal statement on January 11, 2000."
