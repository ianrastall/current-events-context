    headline: "Deadly clashes in Lagos between Oodua People's Congress (OPC) militants and Nigerian police prompt federal crackdown warning"
    summary: >
      On January 5, 2000, violent street battles erupted in the Mushin and Bariga districts
      of Lagos and in Ibadan, southwestern Nigeria, between militant factions of the ethnic
      Yoruba nationalist Oodua People's Congress (`OPC`), rival community groups, and
      Nigerian police, leaving dozens of people dead and scores of buildings burned.
      Following the abduction and murder of a senior Divisional Police Officer in Bariga,
      Lagos, Nigerian President Olusegun Obasanjo deployed reinforced police squads and
      warned Lagos State Governor Bola Tinubu that the federal government would impose
      emergency measures if order was not restored.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000105`, Lagos)"
        value: "`LAGOS -> Fight / armed battle (CAMEO 190)` — 36 mentions across 18 articles"
        citation_refs: [11]
      - label: "Casualties"
        value: "At least 20–30 killed in early January Lagos and Ibadan OPC clashes"
        citation_refs: [11]
    details:
      what_happened:
        - "Armed members of the militant wing of the Oodua People's Congress (`OPC`)—a Yoruba self-determination organization that had taken on vigilante policing roles in Lagos—clashed fiercely with police and Hausa/non-Yoruba residents in the Mushin, Bariga, and Ketu areas of Lagos as well as in Ibadan on January 4–5, 2000."
        - "After OPC militants abducted and killed the Divisional Police Officer (`DPO`) of Bariga, Afolabi Amao, and dumped his body in the Lagos Lagoon, Nigerian Inspector General of Police Musiliu Smith ordered shoot-on-sight patrols against armed militia members and placed a bounty on militant OPC faction leader Gani Adams."
      why_it_matters:
        - "The January 2000 Lagos violence highlighted the rise of ethnic militias across Nigeria less than eight months after the return to civilian rule under President Olusegun Obasanjo in May 1999, triggering a constitutional confrontation between Abuja and Lagos State Governor Bola Tinubu over state versus federal policing powers."
        - "Exact casualty figures across the sprawling Lagos suburbs varied between police tallies and local hospital reports."
