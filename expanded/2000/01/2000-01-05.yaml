    details:
      what_happened:
        - "Following the January 4 trilateral meeting that broke the initial procedural impasse, Israeli and Syrian experts convened in joint committees on borders and security at Shepherdstown on Wednesday, January 5, 2000, while President Bill Clinton and Secretary of State Madeleine Albright met separately and jointly with Barak and al-Sharaa to launch the remaining committees on water rights and normal diplomatic relations."
        - "White House Press Secretary Joe Lockhart reported that discussions had entered the \"hard issues\" of defining the June 4, 1967 line around the northeastern shore of the Sea of Galilee and demilitarization ratios on the Golan plateau."
