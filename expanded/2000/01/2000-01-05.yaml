      - "Sri Lanka"
    importance: 9
    headline: "Female suicide bomber kills 13 outside the Sri Lankan Prime Minister's office in Colombo hours before Tamil politician Kumar Ponnambalam is assassinated"
    summary: >
      On the morning of January 5, 2000, a female Liberation Tigers of Tamil Eelam (LTTE)
      "Black Tiger" suicide bomber detonated a concealed explosive vest outside the office
      of Sri Lankan Prime Minister Sirimavo Bandaranaike on Flower Road in Colombo when
      stopped by security personnel, killing 13 people (including seven police officers and
      six civilians) and wounding 29 others. Less than three hours later in Colombo's
      Wellawatte neighborhood, unidentified gunmen shot dead prominent 61-year-old Tamil
      human rights lawyer and All Ceylon Tamil Congress (ACTC) president Kumar Ponnambalam,
      prompting President Chandrika Kumaratunga's government to impose an immediate curfew
      across Colombo and lock down the capital.
    key_data:
      - label: "Fatalities in Colombo Prime Minister's Office suicide bombing"
        value: "13 killed (7 police officers, 6 civilians; plus the bomber)"
        citation_refs: [1]
      - label: "Injured in Colombo suicide bombing"
        value: "28–30 injured"
        citation_refs: [1]
      - label: "Age of assassinated Tamil political leader Kumar Ponnambalam"
        value: "61 years old (born August 12, 1938)"
        citation_refs: [2]
      - label: "GDELT 1.0 CAMEO cluster (`20000105`, Colombo)"
        value: "`SUICIDE BOMBER -> SRI LANKA (CAMEO 1831)` — 51 mentions across 35 articles"
        citation_refs: [1]
      - label: "Casualties"
        value: "15 killed (13 victims + 1 bomber in Flower Road blast; Kumar Ponnambalam assassinated), ~30 injured"
        citation_refs: [1]
    details:
      what_happened:
        - "Around 08:45 local time on Wednesday, January 5, 2000, ministerial security guards outside Prime Minister Sirimavo Bandaranaike's office on Flower Road (Sir Ernest de Silva Mawatha) in central Colombo stopped a woman wearing a shalwar kameez for a routine body search; she immediately detonated a suicide vest packed with plastic explosives and steel ball bearings, killing 13 people and wounding nearly 30. Prime Minister Bandaranaike (the 83-year-old mother of President Chandrika Kumaratunga, who had herself lost an eye in an LTTE suicide bombing on December 18, 1999) was not in the building at the time."
        - "Around 11:15 local time the same morning, 61-year-old Tamil defense lawyer and All Ceylon Tamil Congress (ACTC) leader Kumar Ponnambalam—an outspoken critic of the Sri Lankan government's war conduct and defender of Tamil detainees—was lured from his home and shot dead at close range inside his Mercedes-Benz on Ramakrishna Terrace in Wellawatte, Colombo."
        - "Sri Lankan authorities imposed an immediate emergency curfew across Colombo and neighboring Gampaha district, deploying thousands of troops and police who detained more than 1,000 Tamil residents for questioning during house-to-house searches."
      why_it_matters:
        - "The twin attacks in Colombo—coming less than three weeks after the December 18, 1999 suicide assassination attempt against President Chandrika Kumaratunga—plunged Sri Lanka's capital into a state of siege and underscored the lethal escalation of urban warfare and political assassinations during the \"Third Eelam War.\""
        - "A shadowy group calling itself the \"National Front Against Tigers\" claimed responsibility for killing Kumar Ponnambalam, though Tamil parties and human rights organizations alleged state-linked paramilitary involvement."
      uncertainty_notes: []
