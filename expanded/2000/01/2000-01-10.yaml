      - "Iran"
    importance: 8
    headline: "Iranian Foreign Minister Kamal Kharrazi holds talks in London with Robin Cook and Tony Blair in the first UK visit since 1979"
    summary: >
      On January 10, 2000, Iranian Foreign Minister Kamal Kharrazi began an official two-day
      visit to London—the first visit to the United Kingdom by an Iranian foreign minister
      since the 1979 Islamic Revolution—holding talks with Foreign Secretary Robin Cook and
      Prime Minister Tony Blair on counter-narcotics cooperation, regional stability in Iraq
      and Afghanistan, and a reciprocal visit by Cook to Tehran.
    key_data:
      - label: "Interval since the previous visit to Britain by an Iranian foreign minister"
        value: "21 years (since the 1979 Iranian Revolution)"
        citation_refs: [7]
      - label: "GDELT 1.0 CAMEO cluster (`20000110`, London <-> Iran / Ambassador)"
        value: "393 combined mentions across 292 articles (highest global cluster on Jan 10)"
        citation_refs: [7]
      - label: "British anti-narcotics equipment aid pledged for Iran's Afghan border"
        value: "£1 million ($1.6 million) for body armor and night-vision equipment"
        citation_refs: [7]
      - label: "Casualties"
        value: "None"
        citation_refs: [7]
    details:
      what_happened:
        - "Following the September 1998 agreement at the United Nations in which President Mohammad Khatami's reformist government formally distanced the Iranian state from Ayatollah Ruhollah Khomeini's 1989 fatwa against British author Salman Rushdie—and the subsequent upgrade of UK–Iranian ties to full ambassadorial level in May 1999—Iranian Foreign Minister Kamal Kharrazi arrived in London on Monday, January 10, 2000."
        - "Kharrazi met Foreign Secretary Robin Cook at the Foreign and Commonwealth Office and called on Prime Minister Tony Blair at 10 Downing Street as small groups of anti-regime Iranian dissidents protested in Whitehall; the two sides signed a declaration on joint counter-narcotics efforts along Iran's border with Taliban-controlled Afghanistan, while Cook raised European concerns over the upcoming trial of 13 Iranian Jews arrested for alleged espionage in Shiraz."
      why_it_matters:
        - "Kharrazi's landmark London visit symbolized the diplomatic thaw between Western Europe and President Mohammad Khatami's administration ahead of Iran's February 2000 parliamentary elections, where reformist candidates won a sweeping majority."
        - "Disagreements over the Middle East peace process and the Shiraz espionage arrests later prompted Robin Cook to postpone his planned spring 2000 return visit to Tehran."
      uncertainty_notes: []
