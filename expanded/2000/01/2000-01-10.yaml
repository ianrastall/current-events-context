    importance: 4
    headline: "Cherie Blair, wife of UK Prime Minister Tony Blair, is fined £10 for traveling without a valid train ticket from Blackfriars to Luton"
    summary: >
      On January 10, 2000, Cherie Booth QC (Cherie Blair)—prominent human-rights barrister
      and wife of British Prime Minister Tony Blair—was issued a £10 penalty fare plus the
      £9.20 ticket price after traveling without a valid ticket on a Thameslink commuter
      train from London Blackfriars station to Luton to appear as defense counsel in court.
    key_data:
      - label: "Penalty fare and ticket price paid by Cherie Blair"
        value: "£10 penalty fare + £9.20 single fare (£19.20 total)"
        citation_refs: [18]
      - label: "Route traveled"
        value: "London Blackfriars to Luton (Thameslink)"
        citation_refs: [18]
      - label: "Casualties"
        value: "None"
        citation_refs: [18]
    details:
      what_happened:
        - "Rushing on Monday morning, January 10, 2000 to Luton Crown Court in Bedfordshire to represent a young offender after returning from the Blair family's New Year holiday in Portugal, 45-year-old barrister Cherie Booth QC boarded a Thameslink train at Blackfriars station in central London without a ticket after finding she had only Portuguese escudos in her purse and could not locate a ticket machine at Blackfriars that accepted her credit card."
        - "When she sought to pay the fare upon arriving at Luton station, a Thameslink ticket inspector issued a mandatory £10 penalty notice on top of the £9.20 single fare; Downing Street confirmed that Mrs. Blair immediately arranged payment by credit card over the telephone without asking for special treatment."
      why_it_matters:
        - "Widely covered across the British press, the incident highlighted both the strict no-discretion penalty-fare regime introduced on UK privatized railways and Cherie Blair's continuing working career as a courtroom barrister while residing at 10 Downing Street."
        - "None."
