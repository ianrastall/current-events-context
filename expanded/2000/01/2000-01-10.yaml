    importance: 7
    headline: "Australia's Civil Aviation Safety Authority grounds 5,000 piston-engine aircraft nationwide over Mobil Avgas fuel contamination"
    summary: >
      On January 10, 2000, Australia's Civil Aviation Safety Authority (`CASA`) issued an
      emergency Airworthiness Directive grounding approximately 5,000 piston-engine aircraft
      across eastern and southern Australia after discovering that aviation gasoline (`Avgas
      100/130`) refined at Mobil's Altona refinery in Melbourne remained contaminated with
      ethylene diamine, a corrosive chemical capable of clogging fuel injectors and
      carburetors in flight.
    key_data:
      - label: "Piston-engine aircraft grounded by CASA on January 10, 2000"
        value: "~5,000 aircraft across Victoria, NSW, ACT, Tasmania, and South Australia"
        citation_refs: [15]
      - label: "Contaminant identified in Mobil Altona refinery Avgas"
        value: "Ethylene diamine (used in refinery anti-corrosion treatment)"
        citation_refs: [15]
      - label: "Casualties"
        value: "None (no fatal crashes attributed to the fuel batch, though in-flight engine failures were reported)"
        citation_refs: [15]
    details:
      what_happened:
        - "Following an initial late-December 1999 alert over contaminated aviation fuel from Mobil Oil Australia's Altona refinery in western Melbourne, Mobil notified the Civil Aviation Safety Authority (`CASA`) on Sunday, January 9, 2000 that fresh batches of `Avgas` distributed since December 22 also contained traces of ethylene diamine, which reacted with brass and copper aircraft fuel-system components to form sticky deposits."
        - "On Monday, January 10, 2000, `CASA` issued a mandatory Airworthiness Directive immediately grounding around 5,000 light and regional piston-engine aircraft—roughly half of Australia's general aviation fleet, including Royal Flying Doctor Service, charter, agricultural, and commuter planes—across Victoria, New South Wales, the Australian Capital Territory, Tasmania, and South Australia until fuel tanks and engine systems were flushed and inspected."
      why_it_matters:
        - "The January 2000 Mobil Avgas crisis paralyzed Australian general and regional aviation for weeks, triggered a parliamentary inquiry and a Federal Court class-action lawsuit by thousands of aircraft owners and charter operators, and resulted in tens of millions of dollars in compensation payments by Mobil."
        - "None."
      uncertainty_notes: []
