    importance: 7
    headline: "Florida family-court judge grants temporary custody of Elián González to Miami relatives in challenge to federal INS order"
    summary: >
      On January 10, 2000, Miami-Dade Circuit Court Family Division Judge Rosa Rodriguez
      issued an emergency temporary protective order granting temporary custody of
      six-year-old Elián González to his Miami great-uncle, Lázaro González, and scheduling
      a March 6 evidentiary hearing in Florida state court, directly challenging the U.S.
      Immigration and Naturalization Service (`INS`) order that the boy be returned to his
      father in Cuba by January 14.
    key_data:
      - label: "State family-court hearing date set by Judge Rosa Rodriguez"
        value: "March 6, 2000"
        citation_refs: [13]
      - label: "Original federal INS deadline for Elián González's return to Cuba"
        value: "January 14, 2000 (subsequently lifted by AG Janet Reno on Jan 12 for federal court review)"
        citation_refs: [13]
      - label: "Casualties"
        value: "None"
        citation_refs: [13]
    details:
      what_happened:
        - "Acting on an emergency petition filed on January 7 by attorneys for Lázaro González, Miami-Dade Circuit Judge Rosa Rodriguez ruled on Monday, January 10, 2000 that six-year-old Elián González should remain in Miami under his great-uncle's temporary care until a full family-court hearing on March 6 could determine whether returning him to Cuba would subject him to imminent harm."
        - "U.S. Justice Department officials immediately responded that federal immigration jurisdiction supersedes state family court rulings, and two days later (on January 12) Attorney General Janet Reno informed the family's lawyers that the Florida state court lacked legal authority over an immigration parole matter while lifting the January 14 deadline so the family could test the INS decision in federal district court."
      why_it_matters:
        - "The January 10 state-court order—later voided after revelations that a political consultant for Judge Rodriguez had ties to the Miami relatives' legal team and after a second family-court judge dismissed the state case for lack of jurisdiction in April 2000—Temporarily delayed Elián's transfer and shifted the battle into the federal courts."
        - "Judge Rosa Rodriguez later stepped aside from the case after disclosures that political consultant Armando Gutierrez served both as her campaign adviser and as spokesman for the Miami relatives."
      uncertainty_notes: []
