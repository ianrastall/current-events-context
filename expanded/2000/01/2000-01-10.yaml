  - id: "evt-2000-01-10-003"
    category: "International relations"
    subcategory: ""
    topics:
      - "United States"
      - "Israel"
    importance: 8
    headline: "First round of Israeli–Syrian peace talks at Shepherdstown adjourns without a framework agreement"
    summary: >
      On January 10, 2000, Israeli Prime Minister Ehud Barak and Syrian Foreign Minister
      Farouk al-Sharaa concluded eight days of U.S.-mediated peace negotiations in
      Shepherdstown, West Virginia without reaching a framework accord on the Golan Heights,
      as U.S. President Bill Clinton and Secretary of State Madeleine Albright announced
      that both sides would return to the United States on January 19 for a second round of
      talks.
    key_data:
      - label: "Duration of the first Shepherdstown summit round"
        value: "8 days (January 3–10, 2000)"
        citation_refs: [5]
      - label: "Scheduled date for the second round (later postponed indefinitely)"
        value: "January 19, 2000"
        citation_refs: [5]
      - label: "GDELT 1.0 CAMEO cluster (`20000110`, Washington / Damascus / Jerusalem)"
        value: "266 combined mentions across 91 articles"
        citation_refs: [5]
      - label: "Casualties"
        value: "None"
        citation_refs: [5]
    details:
      what_happened:
        - "After a final late-night mediation session with President Bill Clinton on January 9 and morning wrap-up meetings with Secretary of State Madeleine Albright on Monday, January 10, 2000, the Israeli and Syrian delegations adjourned the Shepherdstown summit to consult with their respective governments in Jerusalem and Damascus."
        - "While all four joint working committees (borders, security, water, and normal relations) had held initial discussions based on the seven-page U.S. working paper tabled on January 6, fundamental disagreements remained over whether Israel would commit to the June 4, 1967 shoreline of the Sea of Galilee before Syria detailed security and normalization terms."
      why_it_matters:
        - "Although Washington announced on January 10 that negotiators would reconvene on January 19, the leak of the confidential U.S. working paper to the Israeli newspaper Haaretz three days later on January 13 led Syrian President Hafez al-Assad to indefinitely postpone the January 19 round, making the January 3–10 Shepherdstown summit the last formal bilateral Israeli–Syrian peace conference before Assad's death in June 2000."
        - "None."
      uncertainty_notes: []
