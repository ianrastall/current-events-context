    details:
      what_happened:
        - "Having gained independence from the United Kingdom in October 1978, the tiny Polynesian island nation of Tuvalu had previously been unable to afford the annual assessment and New York mission costs of full United Nations membership."
        - "Enabled by a multi-million-dollar commercial agreement leasing Tuvalu's prized `.tv` internet country-code top-level domain (`ccTLD`) and seeking a direct voice in UN climate-change negotiations over rising sea levels, Prime Minister Ionatana Ionatana initiated Tuvalu's formal UN membership application on January 10, 2000 (`GDELT 20000110`: `35 mentions`)."
      why_it_matters:
        - "Endorsed by UN Security Council Resolution 1290 on February 17, 2000, Tuvalu was formally admitted as the 189th Member State of the United Nations at the opening of the Millennium Summit in New York on September 5, 2000, becoming one of the foremost global advocates for small island developing states facing climate change."
