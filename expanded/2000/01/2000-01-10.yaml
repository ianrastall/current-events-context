    headline: "Acting Russian President Vladimir Putin promotes Mikhail Kasyanov to First Deputy Prime Minister and dismisses Pavel Borodin in Kremlin shake-up"
    summary: >
      On January 10, 2000, on the first working day after Russia's New Year and Orthodox
      Christmas holidays, Acting President Vladimir Putin carried out his first major
      reorganization of the Russian government and Kremlin administration—promoting Finance
      Minister Mikhail Kasyanov to sole First Deputy Prime Minister, demoting Yeltsin-era
      favorite Nikolai Aksyonenko, and removing embattled Kremlin property chief Pavel
      Borodin.
    key_data:
      - label: "Key promotion announced by Acting President Putin on January 10, 2000"
        value: "Finance Minister Mikhail Kasyanov appointed sole First Deputy Prime Minister"
        citation_refs: [11]
      - label: "GDELT 1.0 CAMEO cluster (`20000110`, Moscow Ministry / Russia)"
        value: "107 combined mentions across 77 articles"
        citation_refs: [11]
      - label: "Casualties"
        value: "None"
        citation_refs: [11]
    details:
      what_happened:
        - "Ten days after assuming the powers of the Russian presidency from Boris Yeltsin, Acting President and Prime Minister Vladimir Putin signed a series of decrees in Moscow on Monday, January 10, 2000 restructuring cabinet authority and distancing his administration from figures associated with Yeltsin's inner circle (\"the Family\")."
        - "Putin elevated 42-year-old liberal Finance Minister and chief foreign-debt negotiator Mikhail Kasyanov to serve as sole First Deputy Prime Minister, stripping rival First Deputy Prime Minister Nikolai Aksyonenko of his overarching economic portfolio and returning him to the Railways Ministry."
        - "On the same day, Putin transferred longtime Kremlin Property Department head Pavel Borodin—who was under investigation by Swiss prosecutors in the Mabetex Kremlin renovation kickback scandal—to the largely ceremonial post of State Secretary of the Russia–Belarus Union, and dismissed CIS Affairs Minister Leonid Drachevsky and several deputy heads of the Presidential Administration."
      why_it_matters:
        - "The January 10 appointments established Mikhail Kasyanov as Putin's second-in-command and direct successor as Prime Minister of Russia (2000–2004) following Putin's formal presidential inauguration in May 2000."
        - "None."
      uncertainty_notes: []
