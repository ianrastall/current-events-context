  - id: "evt-2000-01-10-015"
    category: "International relations"
    subcategory: ""
    topics:
      - "Tajikistan"
    importance: 6
    headline: "Tajik President Emomali Rahmonov and United Tajik Opposition advance post-civil-war parliamentary transition in Dushanbe"
    summary: >
      On January 10, 2000, Tajik President Emomali Rahmonov, leaders of the former rebel
      United Tajik Opposition (`UTO`), and representatives of the Contact Group of guarantor
      states and the United Nations Mission of Observers in Tajikistan (`UNMOT`) held joint
      implementation sessions in Dushanbe to finalize multi-party electoral preparations for
      the February 27, 2000 parliamentary elections—the final milestone of the 1997 General
      Agreement on the Establishment of Peace and National Accord.
    key_data:
      - label: "Scheduled date of Tajikistan's first post-civil-war multi-party parliamentary election"
        value: "February 27, 2000"
        citation_refs: [20]
      - label: "GDELT 1.0 CAMEO cluster (`20000110`, Dushanbe, Tajikistan cooperation)"
        value: "180 combined mentions across 18 articles"
        citation_refs: [20]
      - label: "Casualties"
        value: "None"
        citation_refs: [20]
    details:
      what_happened:
        - "Following the November 1999 presidential election and the formal dissolution of the armed wing of the United Tajik Opposition (`UTO`) under Sayid Abdulloh Nuri, Tajik government officials, Commission on National Reconciliation (`CNR`) delegates, and foreign envoys met in Dushanbe on January 10, 2000 to verify opposition representation on electoral commissions and the integration of former `UTO` fighters into Tajikistan's armed forces and border guards."
        - "The January 2000 preparations cleared the way for the February 27, 2000 election of Tajikistan's new bicameral parliament (Majlisi Oli)—the only Central Asian legislature in 2000 to include a legalized Islamic opposition party (the Islamic Revival Party of Tajikistan)—and the formal completion of `UNMOT`'s peacekeeping mandate in May 2000."
      why_it_matters:
        - "The successful transition from the 1992–1997 Tajikistani Civil War to the February 2000 parliamentary elections ended a conflict that had claimed between 50,000 and 100,000 lives and displaced over one million people."
        - "Opposition parties and international observers continued to raise concerns over media access and registration hurdles ahead of the February 27 vote."
      uncertainty_notes: []
