    importance: 7
    headline: "Sixteen Serbian opposition parties sign a landmark unity pact in Belgrade demanding early elections against Slobodan Milošević"
    summary: >
      On January 10, 2000, leaders of 16 Serbian democratic opposition parties—bridging a
      long-standing rivalry between Serbian Renewal Movement (`SPO`) leader Vuk Drašković,
      Democratic Party (`DS`) leader Zoran Đinđić, and Democratic Party of Serbia (`DSS`)
      leader Vojislav Koštunica—met at the `SPO` headquarters in Belgrade and signed a joint
      agreement demanding early democratic parliamentary and presidential elections in
      Serbia and the Federal Republic of Yugoslavia by the end of April 2000.
    key_data:
      - label: "Serbian opposition parties signing the January 10 Belgrade unity pact"
        value: "16 opposition parties and coalitions"
        citation_refs: [14]
      - label: "Deadline demanded for early democratic elections in Serbia"
        value: "End of April 2000"
        citation_refs: [14]
      - label: "GDELT 1.0 CAMEO cluster (`20000110`, Representatives in Belgrade, Serbia)"
        value: "34 mentions across 34 articles"
        citation_refs: [14]
      - label: "Casualties"
        value: "None"
        citation_refs: [14]
    details:
      what_happened:
        - "Hosted by Serbian Renewal Movement (`SPO`) president Vuk Drašković—whose party had previously boycotted street rallies organized by Zoran Đinđić's Alliance for Change (Savez za promene)—leaders of 16 Serbian opposition parties met in Belgrade for seven hours on Monday, January 10, 2000 and signed a joint strategic manifesto against Yugoslav President Slobodan Milošević."
        - "The 16 parties demanded free and fair early elections at all levels by late April 2000, an end to state media repression and political violence, and called on the European Union and the United States to ease sanctions affecting ordinary Serbian citizens in exchange for democratic reforms."
      why_it_matters:
        - "The January 10, 2000 Belgrade summit laid the direct organizational foundation for the 18-party Democratic Opposition of Serbia (`DOS`) coalition, which nominated Vojislav Koštunica later in 2000, defeated Slobodan Milošević in the September 24, 2000 Yugoslav presidential election, and toppled his regime in the Bulldozer Revolution of October 5, 2000."
        - "Vuk Drašković later withdrew the `SPO` from the final `DOS` presidential ticket after surviving a June 2000 assassination attempt in Budva, while the remaining opposition parties united behind Vojislav Koštunica."
      uncertainty_notes: []
