    headline: "Pacific island nation of Tuvalu submits formal application for membership in the United Nations"
    summary: >
      On January 10, 2000, the Government of Tuvalu—led by Prime Minister Ionatana
      Ionatana—announced and transmitted its formal application to United Nations
      Secretary-General Kofi Annan for admission as a full member state of the United
      Nations, using revenue from the commercial licensing of its `.tv` internet
      country-code top-level domain to fund its UN membership dues and diplomatic mission.
    key_data:
