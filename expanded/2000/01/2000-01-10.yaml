    headline: "Deep-focus magnitude 5.7 earthquake in the Bonin Islands, Japan leads 14 global M4.5+ earthquakes on January 10"
    summary: >
      On January 10, 2000 at 16:40:42 UTC, a deep-focus magnitude 5.7 earthquake
      (`usp0009m08`, depth 453.2 km) ruptured the subducting Pacific Plate beneath the Bonin
      (Ogasawara) Islands region of Japan, leading 14 `M4.5+` earthquakes recorded globally
      by the USGS on January 10 alongside an `M5.4` intermediate-depth earthquake in Tonga
      (`usp0009kze`) and moderate events in Oaxaca, Mexico (`M4.8`), Santa Cruz, Bolivia
      (`M4.7`), and Fars Province, Iran (`M4.6`).
    key_data:
      - label: "Bonin Islands, Japan deep earthquake (`usp0009m08`)"
        value: "M 5.7 at 16:40:42 UTC (27.350°N, 139.979°E, depth 453.2 km)"
        citation_refs: [17]
      - label: "Haveluloto, Tonga intermediate earthquake (`usp0009kze`)"
        value: "M 5.4 at 03:07:42 UTC (21.792°S, 176.732°W, depth 174.0 km)"
        citation_refs: [17]
      - label: "Total global M4.5+ earthquakes on January 10, 2000"
        value: "14 earthquakes recorded in USGS ANSS ComCat"
        citation_refs: [17]
      - label: "Casualties"
        value: "None"
        citation_refs: [17]
    details:
      what_happened:
        - "Global `M4.5+` seismic activity on Monday, January 10, 2000 included five events along the Fiji–Tonga–Kermadec subduction zone—led by a magnitude 5.4 earthquake (`usp0009kze`, depth 174.0 km) 172 km west-southwest of Haveluloto, Tonga at 03:07:42 UTC and two `M4.6` aftershocks (`usp0009kzu` and `usp0009m0k`) near Hihifo following the January 8 `M7.2` mainshock."
        - "Continental and coastal events included a magnitude 4.8 subduction earthquake (`usp0009kzc`, depth 42.2 km) 22 km southeast of San Francisco del Mar Viejo in Oaxaca, Mexico at 02:26:53 UTC, a magnitude 4.7 earthquake (`usp0009kzn`) near Abapó in Santa Cruz Department, Bolivia at 07:49:25 UTC, and a shallow magnitude 4.6 Zagros fold-belt earthquake (`usp0009kzs`, depth 33.0 km) 15 km east-southeast of Kazerun in Fars Province, Iran at 08:50:54 UTC."
        - "At 16:40:42 UTC, the day's largest seismic event—a magnitude 5.7 deep-focus earthquake (`usp0009m08`, depth 453.2 km)—ruptured within the Izu–Bonin subduction slab south of Tokyo."
      why_it_matters:
        - "The 14 `M4.5+` earthquakes on January 10 brought the ten-day opening total for January 1–10, 2000 in the USGS ANSS Comprehensive Catalog to 108 `M4.5+` earthquakes worldwide."
