analytical_overview: >
  On Monday, January 10, 2000, the announcement of the largest corporate merger in global
  business history—America Online's $162 billion–$165 billion acquisition of Time
  Warner—converged with the fatal crash of Crossair Flight 498 near Zurich, the adjournment
  of the first round of Israeli–Syrian peace talks in Shepherdstown, and the first visit to
  London by an Iranian foreign minister since the 1979 Islamic Revolution. In New York, AOL
  Chairman Steve Case and Time Warner Chairman Gerald Levin unveiled an all-stock
  combination valued at roughly $350 billion in total market capitalization, uniting the
  world's largest internet service provider with the world's premier print, film, cable, and
  music empire at the zenith of the dot-com boom. Hours earlier in Niederhasli, Switzerland,
  Crossair Flight 498, a Saab 340B commuter aircraft bound for Dresden, Germany, spiraled
  into the ground two minutes after taking off from Zurich-Kloten Airport, killing all 10
  people on board in the regional carrier's first fatal accident.

  In diplomacy and European politics, Israeli Prime Minister Ehud Barak and Syrian Foreign
  Minister Farouk al-Sharaa concluded eight days of U.S.-mediated talks in Shepherdstown,
  West Virginia without an agreement, scheduling a second round for January 19; Iranian
  Foreign Minister Kamal Kharrazi met British Foreign Secretary Robin Cook and Prime
  Minister Tony Blair in London; and German Christian Democratic Union (`CDU`) Chairman
  Wolfgang Schäuble confessed on national television that he had personally accepted a
  100,000-mark cash donation in 1994 from fugitive arms dealer Karlheinz Schreiber.
  Meanwhile, Acting Russian President Vladimir Putin promoted Mikhail Kasyanov to First
  Deputy Prime Minister and dismissed Kremlin property chief Pavel Borodin while federal
  forces retook central Argun in Chechnya; a Florida family-court judge awarded temporary
  state custody of Elián González to his Miami great-uncle; 16 Serbian opposition parties
  signed a joint pact in Belgrade against Slobodan Milošević; Australia's aviation regulator
  (`CASA`) grounded 5,000 piston aircraft nationwide over Mobil fuel contamination; and
  Hollywood producer Sam Jaffe died at age 98.

