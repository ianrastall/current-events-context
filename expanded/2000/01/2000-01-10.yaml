  - id: "evt-2000-01-10-014"
    category: "Arts and culture"
    subcategory: ""
    topics:
      - "United States"
    importance: 4
    headline: "Veteran Hollywood talent agent and Born Free film producer Sam Jaffe dies in Beverly Hills at age 98"
    summary: >
      On January 10, 2000, pioneering Hollywood studio executive, talent agent, and
      independent film producer Sam Jaffe—who represented stars including Humphrey Bogart,
      Lauren Bacall, David Niven, and Stanley Kubrick through the Jaffe Agency before
      producing the 1944 World War II drama The Fighting Sullivans and the 1966 Academy
      Award-winning wildlife film Born Free—died in Beverly Hills, California at the age of
      98.
    key_data:
      - label: "Age of producer Sam Jaffe at death"
        value: "98 years old (born May 21, 1901 in Harlem, New York City)"
        citation_refs: [19]
      - label: "Career span in the motion picture industry"
        value: "Over 70 years (joined Paramount Famous Lasky in the silent era, 1920s)"
        citation_refs: [19]
      - label: "Casualties"
        value: "1 death (natural causes)"
        citation_refs: [19]
    details:
      what_happened:
        - "Born in Harlem, New York City on May 21, 1901, Sam Jaffe joined his brother-in-law B. P. Schulberg at Paramount Pictures in the 1920s, rising to production manager at Paramount and later executive at RKO and Columbia Pictures during the transition from silent films to sound."
        - "In 1935 he founded the Sam Jaffe Agency on the Sunset Strip, becoming one of Hollywood's most influential talent agents during the Golden Age of the studio system (representing Humphrey Bogart, Lauren Bacall, Fritz Lang, Mary Astor, Richard Burton, Zero Mostel, and early-career Stanley Kubrick) while also co-producing The Fighting Sullivans (1944); moving to London in 1959, he produced the classic Kenyan lion conservation film Born Free (1966), starring Virginia McKenna and Bill Travers, before dying in Beverly Hills on Monday, January 10, 2000 at age 98."
      why_it_matters:
        - "Spanning from silent-era Paramount productions with Clara Bow and Ernst Lubitsch to late-20th-century independent cinema, Jaffe was one of the last surviving studio pioneers of early Hollywood."
        - "Producer Sam Jaffe (1901–2000) is frequently distinguished in film reference works from the identically named character actor Sam Jaffe (1891–1984)."
      uncertainty_notes: []
