  - id: "evt-2000-01-10-005"
    category: "Politics and elections"
    subcategory: ""
    topics:
      - "Germany"
    importance: 8
    headline: "German CDU Chairman Wolfgang Schäuble admits accepting a 100,000-mark cash donation from arms dealer Karlheinz Schreiber"
    summary: >
      On the evening of January 10, 2000, Wolfgang Schäuble—Chairman of Germany's opposition
      Christian Democratic Union (`CDU`) and its parliamentary group leader in the
      Bundestag—confessed in an interview on ARD public television that he had personally
      accepted an envelope containing 100,000 Deutsche Marks in cash in 1994 from fugitive
      arms lobbyist Karlheinz Schreiber, directly contradicting his December 1999 statement
      to the Bundestag and plunging the CDU into a leadership crisis alongside the Helmut
      Kohl slush-fund scandal.
    key_data:
      - label: "Cash donation accepted by CDU Chairman Wolfgang Schäuble in 1994"
        value: "100,000 Deutsche Marks (~$52,000 USD) in cash from Karlheinz Schreiber"
        citation_refs: [9]
      - label: "Date of Schäuble's prior Bundestag statement omitting the cash handover"
        value: "December 2, 1999"
        citation_refs: [9]
      - label: "Casualties"
        value: "None"
        citation_refs: [9]
    details:
      what_happened:
        - "Having previously told the Bundestag on December 2, 1999 that a September 1994 encounter with German-Canadian arms dealer Karlheinz Schreiber had yielded no improper financial transactions, CDU Chairman Wolfgang Schäuble appeared on the ARD television program Beckmann on Monday night, January 10, 2000 and admitted that Schreiber had handed him 100,000 marks in cash in his parliamentary office in Bonn in late 1994."
        - "Schäuble stated that he had passed the cash envelope unopened to then-CDU treasurer Brigitte Baumeister, who recorded it only as an anonymous \"miscellaneous receipt,\" and apologized for misleading parliament while insisting he would not resign as CDU leader."
      why_it_matters:
        - "Schäuble's January 10 confession devastated his credibility as the clean reformer pressing former Chancellor Helmut Kohl to name his secret donors; amid subsequent contradictions between Schäuble and Baumeister over how the 100,000 marks were handled, Schäuble was forced to resign as CDU Chairman and parliamentary leader on February 16, 2000, clearing the path for Angela Merkel's election as CDU Chairwoman in April 2000."
        - "Schäuble and former CDU treasurer Brigitte Baumeister subsequently gave conflicting accounts of whether the 100,000 marks was handed first to Schäuble or to Baumeister."
      uncertainty_notes: []
