    importance: 7
    headline: "Lebanese Army battles Sunni Islamist insurgents in the Dinniyeh mountains east of Tripoli"
    summary: >
      Heavy fighting raged in the snow-covered Dinniyeh mountains east of Tripoli in
      northern Lebanon on January 1, 2000 as up to 13,000 Lebanese Army troops backed by
      artillery and armor assaulted Sunni Islamist militants belonging to the Takfir
      wal-Hijra group led by Bassam Ahmad Kanj (Abu Aisha). The clashes, which began on
      December 31, 1999 when militants ambushed an army patrol in Assoun, represented the
      largest internal military operation by the Lebanese Armed Forces since the end of the
      Lebanese Civil War in 1990.
    key_data:
      - label: "Lebanese Armed Forces troops deployed"
        value: "Approximately 13,000 soldiers"
        citation_refs: [11]
      - label: "Estimated Islamist militant force"
        value: "200–300 fighters"
        citation_refs: [11]
      - label: "Overall Dinniyeh campaign casualties (Dec 31, 1999 – Jan 6, 2000)"
        value: "11 soldiers, 5 civilians, and ~25 militants killed"
        citation_refs: [11]
    details:
      what_happened:
        - "After militants led by Bassam Kanj—a veteran of the Afghan mujahideen who had established training camps in the rugged Dinniyeh district—ambushed a Lebanese Army unit on December 31, 1999 and seized several soldiers as hostages, the Lebanese military launched a full-scale mountain offensive on January 1, 2000."
        - "Lebanese troops shelled militant positions around the villages of Kfar Habou, Assoun, and Taran while advancing through snowstorms and steep terrain to rescue hostages and surround the insurgent stronghold."
      why_it_matters:
        - "The Dinniyeh uprising marked the first major armed confrontation between the post-civil-war Lebanese state and transnational Salafi-jihadist networks linked to veterans of the Afghan and Bosnian conflicts."
        - "Note on GDELT 1.0 automated geocoding: GDELT 1.0 (`GlobalEventID 30612041`) recorded 30 articles on `2000-01-01` for `ARMY PATROL -> TRIPOLI (CAMEO 180)`, but its automated gazetteer mis-resolved the toponym \"Tripoli\" to Tripoli, Libya (`LBY`) rather than Tripoli, Lebanon (`LBN`)."
