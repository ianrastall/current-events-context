  - id: "evt-2000-01-01-008"
    category: "Armed conflicts and attacks"
    subcategory: ""
    topics:
      - "Egypt"
    importance: 7
    headline: "Sectarian clashes erupt between Muslims and Coptic Christians in Al-Kosheh, Upper Egypt"
    summary: >
      Armed sectarian clashes broke out on January 1, 2000 in the predominantly Coptic
      Christian village of Al-Kosheh in Sohag Governorate, Upper Egypt, approximately 440
      kilometers south of Cairo. Sparked on December 31, 1999 by an argument between a
      Coptic shopkeeper and a Muslim street vendor, the unrest escalated on New Year's Day
      into widespread looting, arson of Christian-owned shops and homes, and armed gunfire
      that spread into neighboring hamlets on January 2.
    key_data:
      - label: "Distance from Cairo to Al-Kosheh"
        value: "440 kilometers south"
        citation_refs: [12]
      - label: "Businesses and homes burned or looted (Jan 1–2)"
        value: "Over 50 shops and homes"
        citation_refs: [12]
      - label: "Casualties (initial Jan 1 clashes, escalating Jan 2)"
        value: "Multiple injured on Jan 1; 21 killed by Jan 2"
        citation_refs: [12]
    details:
      what_happened:
        - "Following a verbal dispute late on December 31, 1999 between a Muslim peddler and a Christian merchant in Al-Kosheh—a village of roughly 25,000 inhabitants where Coptic Christians formed a local majority—crowds began attacking shops and exchanging gunfire on January 1, 2000."
        - "Local police initially failed to contain the rioting on January 1 as armed groups attacked Christian residences and commercial properties in Al-Kosheh and nearby Dar el-Salam villages, setting the stage for lethal firearm assaults the following day."
      why_it_matters:
        - "The Al-Kosheh violence—coming less than two years after a 1998 police abuse scandal in the same village—became the deadliest sectarian confrontation in Egypt in two decades and drew international scrutiny over the protection of Egypt's Coptic Christian minority."
        - "Most fatalities occurred on Sunday, January 2, 2000, when armed mobs attacked Coptic residents in surrounding fields and homes before central security forces imposed a curfew."
