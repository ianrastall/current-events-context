    importance: 5
    headline: "Yugoslav President Slobodan Milošević releases imprisoned CARE Australia aid worker Branko Jeken"
    summary: >
      On January 1, 2000, Yugoslav President Slobodan Milošević granted a New Year's
      clemency releasing Australian humanitarian worker Branko Jeken from prison in Serbia,
      where he had been serving a four-year sentence on espionage charges since his arrest
      during the 1999 NATO bombing of Yugoslavia. Jeken, a field officer for CARE Australia,
      was freed after serving nine months, while his supervisor Steve Pratt and Yugoslav
      colleague Petar Wallace remained imprisoned in Belgrade.
    key_data:
      - label: "Time served in Yugoslav custody prior to release"
        value: "9 months (arrested March 31, 1999)"
        citation_refs: [15]
      - label: "Original prison sentence imposed by Yugoslav military court"
        value: "4 years (reduced from 8 years)"
        citation_refs: [15]
      - label: "Casualties"
        value: "None"
        citation_refs: [15]
    details:
      what_happened:
        - "Jeken and fellow CARE Australia worker Steve Pratt had been detained by Yugoslav authorities in March 1999 during the Kosovo War and convicted by a Belgrade military court of passing information under the guise of humanitarian relief."
        - "Following diplomatic appeals by former Australian Prime Minister Malcolm Fraser—then chairman of CARE Australia—and international envoys, Milošević ordered Jeken's release on January 1, 2000, allowing him to depart Serbia for reunions with his family and CARE officials."
      why_it_matters:
        - "The partial release was viewed by Western diplomats as a calculated gesture by Belgrade to ease international isolation while retaining Steve Pratt as diplomatic leverage (Pratt and Wallace were subsequently pardoned in September 2000 shortly before Milošević's downfall)."
        - "None."
      uncertainty_notes: []
