    importance: 5
    headline: "Magnitude 5.2 Kipawa (\"Millennium\") earthquake strikes the Quebec–Ontario border in Canada"
    summary: >
      At 06:22:57 EST (11:22:57 UTC) on January 1, 2000, a magnitude 5.2 intraplate
      earthquake (`mb 5.2` / `Mn 5.2`) struck the Western Quebec Seismic Zone near Lake
      Kipawa on the Quebec–Ontario border, approximately 10 kilometers north of Témiscaming,
      Quebec and 60 kilometers northeast of North Bay, Ontario. Dubbed the "Millennium
      earthquake," the tremor was felt across Ontario, southern Quebec, New York,
      Pennsylvania, Michigan, and northern New England, causing minor structural damage near
      the epicenter but no injuries.
    key_data:
      - label: "Magnitude"
        value: "5.2 (`Mn 5.2` / `Mw 4.7`, USGS ID `usp0009kmr`)"
        citation_refs: [14]
      - label: "Origin time"
        value: "2000-01-01 11:22:57 UTC (06:22:57 EST)"
        citation_refs: [14]
      - label: "Epicenter coordinates"
        value: "46.84°N, 78.92°W (depth 18.0 km, near Lake Kipawa, Quebec)"
        citation_refs: [14]
      - label: "Casualties"
        value: "None"
        citation_refs: [14]
    details:
      what_happened:
        - "The reverse-fault earthquake ruptured at a focal depth of approximately 18 kilometers beneath the Ottawa–Bonnechere Graben near Lake Kipawa, Quebec on New Year's morning."
        - "Residents in Témiscaming, Kipawa, and North Bay reported loud booming sounds, fallen plaster, cracked chimneys, and toppled merchandise, while emergency dispatch centers from Toronto and Ottawa to Buffalo and Syracuse received thousands of calls from residents who initially wondered whether the shaking was connected to Y2K disruptions."
      why_it_matters:
        - "Recorded in both the USGS ComCat catalog (`usp0009kmr`) and Wikidata (`Q4597556`), the Kipawa earthquake was the strongest seismic event in eastern Canada since the 1997 Cap-Rouge earthquake and provided key strong-motion data for seismic hazard models along the Ottawa River valley."
        - "Geological Survey of Canada (`GSC`) assigned a Nuttli magnitude of `Mn 5.2`, whereas USGS body-wave and moment magnitude estimates ranged from `4.7` to `5.2`."
