    importance: 6
    headline: "U.S. Coast Guard intercepts grounded freighter carrying over 400 Haitian, Dominican, and Chinese migrants in Biscayne Bay, Florida"
    summary: >
      On the morning of January 1, 2000, the United States Coast Guard intercepted an
      overloaded 60-foot wooden freighter that ran aground in Biscayne Bay near Key Biscayne
      and Miami, Florida, carrying more than 400 undocumented migrants—predominantly
      Haitians alongside Dominican and Chinese nationals. The New Year's Day landing was one
      of the largest single migrant vessel interdictions in South Florida in years and
      immediately intensified debate in Miami over disparate federal treatment of Haitian
      versus Cuban arrivals amid the Elián González custody dispute.
    key_data:
