  - id: "evt-2000-01-01-012"
    category: "2000 in Australia"
    subcategory: ""
    topics:
      - "Australia"
    importance: 4
    headline: "National Archives of Australia releases declassified 1969 federal Cabinet documents under the 30-year rule"
    summary: >
      On January 1, 2000, the National Archives of Australia publicly released federal
      Cabinet submissions, decisions, and defense papers from 1969 under the Commonwealth's
      thirty-year declassification rule. The records documented Prime Minister John Gorton's
      government debates over the phased withdrawal of Australian troops from the Vietnam
      War, nuclear non-proliferation treaty deliberations, and Australia's defense posture
      in Malaysia and Singapore following Britain's East of Suez retreat.
    key_data:
      - label: "Declassification statutory threshold"
        value: "30-year rule (1969 Cabinet records opened January 1, 2000)"
        citation_refs: [16]
      - label: "Prime Minister whose Cabinet papers were opened"
        value: "John Gorton"
        citation_refs: [16]
      - label: "Casualties"
        value: "None"
        citation_refs: [16]
    details:
      what_happened:
        - "In Canberra, the National Archives of Australia opened the 1969 federal Cabinet notebooks and files for public inspection on New Year's Day 2000."
        - "The declassified files revealed confidential friction between the Gorton government and Washington after U.S. President Richard Nixon began unilateral American troop reductions in South Vietnam under the Guam Doctrine, as well as Australian ministerial debates over whether to sign the Treaty on the Non-Proliferation of Nuclear Weapons (`NPT`)."
      why_it_matters:
        - "The annual New Year's Day Cabinet release provided primary archival evidence on Australia's strategic pivot during the late Vietnam War era and its early consideration of indigenous nuclear capabilities before signing the NPT in February 1970."
        - "None."
      uncertainty_notes: []
