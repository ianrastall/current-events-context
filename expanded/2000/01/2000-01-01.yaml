  - id: "evt-2000-01-01-013"
    category: "2000 in Australia"
    subcategory: ""
    topics:
      - "Australia"
      - "Pakistan"
    importance: 4
    headline: "Pakistani fast bowler Shoaib Akhtar returns to Pakistan after the ICC suspends him over an illegal bowling action"
    summary: >
      Pakistani fast bowler Shoaib Akhtar departed Australia for Pakistan on January 1, 2000
      after the International Cricket Council (`ICC`) banned him from bowling in
      international matches on December 30, 1999 following an independent biomechanical
      review of his bowling action during the Perth Test between Australia and Pakistan. The
      Pakistan Cricket Board (`PCB`) lodged an immediate formal appeal challenging the ICC's
      throwing regulations and biomechanics protocols.
    key_data:
      - label: "Match cited by umpires for suspect action"
        value: "Third Test vs. Australia at the WACA Ground, Perth (December 1999)"
        citation_refs: [17]
      - label: "Casualties"
        value: "None"
        citation_refs: [17]
    details:
      what_happened:
        - "Match umpires Darrell Hair and Peter Willey and match referee John Reid reported Akhtar's hyperextension delivery action after Pakistan's Test series in Australia in December 1999."
        - "Following the ICC bowling advisory committee's suspension ruling, Akhtar left the Pakistani squad in Australia on January 1, 2000 to undergo biomechanical testing at the University of Western Australia and support from the Pakistan Cricket Board (`PCB`), which argued that Akhtar's congenital elbow hyperextension created an optical illusion of throwing."
      why_it_matters:
        - "The controversy prompted ICC President Jagmohan Dalmiya and biomechanical researchers to overhaul international cricket's throwing laws, eventually establishing a universal 15-degree elbow-extension tolerance across all international bowlers."
        - "Akhtar's suspension was overturned weeks later by ICC President Jagmohan Dalmiya pending comprehensive biomechanical studies."
      uncertainty_notes: []
