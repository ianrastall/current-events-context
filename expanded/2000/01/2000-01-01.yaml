  - id: "evt-2000-01-01-003"
    category: "Armed conflicts and attacks"
    subcategory: ""
    topics:
      - "India"
      - "Afghanistan"
    importance: 9
    headline: "Freed hostages from hijacked Indian Airlines Flight 814 return to New Delhi as released militants cross into Pakistan"
    summary: >
      Following the December 31, 1999 hostage-exchange deal at Kandahar Airport in
      Afghanistan—under which India released three imprisoned militants (Maulana Masood
      Azhar, Ahmed Omar Saeed Sheikh, and Mushtaq Ahmed Zargar) in exchange for the
      remaining hostages aboard hijacked Indian Airlines Flight 814—the freed passengers and
      crew returned to New Delhi and received medical care on January 1, 2000. Meanwhile,
      the five Harkat-ul-Mujahideen hijackers and the three freed militants departed
      Kandahar after Taliban authorities gave them ten hours to leave Afghan territory,
      crossing into Pakistan.
    key_data:
      - label: "Duration of hijacking crisis"
        value: "8 days (December 24–31, 1999; aftermath January 1, 2000)"
        citation_refs: [5]
      - label: "Hostages freed in final Kandahar exchange"
        value: "155 passengers and crew"
        citation_refs: [5]
      - label: "Militants released by India in exchange"
        value: "3 (Masood Azhar, Ahmed Omar Saeed Sheikh, Mushtaq Ahmed Zargar)"
        citation_refs: [5]
      - label: "Casualties during hijacking"
        value: "1 killed (passenger Rupin Katyal), 17 injured"
        citation_refs: [5]
    details:
      what_happened:
        - "After Indian Foreign Minister Jaswant Singh flew to Kandahar on December 31 with the three released militants to conclude the hostage exchange, the freed passengers and crew arrived back in New Delhi aboard relief aircraft in the late hours of December 31 and reunited with families across India on January 1, 2000."
        - "The hijacked Airbus A300 (`VT-EDW`) was prepared for return to New Delhi on January 1 after spending a week on the tarmac at Kandahar International Airport surrounded by armed Taliban fighters."
        - "Taliban authorities granted the five masked hijackers and three freed prisoners ten hours to leave Afghanistan; on January 1, reports indicated the group had crossed the border toward Quetta in Balochistan Province, Pakistan."
      why_it_matters:
        - "The Kandahar release had profound long-term security consequences: Masood Azhar founded Jaish-e-Mohammed (`JeM`) in Pakistan weeks later (linked to the 2001 Indian Parliament attack and 2019 Pulwama bombing), while Ahmed Omar Saeed Sheikh was later convicted in the 2002 kidnapping and murder of journalist Daniel Pearl."
        - "The crisis prompted India to overhaul its aviation security doctrine, deploy sky marshals, and adopt a strict policy against future hostage concessions."
        - "On January 1, 2000, the exact whereabouts of the hijackers after leaving Kandahar remained contested between New Delhi, which stated they had entered Pakistan, and Islamabad, which denied knowledge of their location."
      uncertainty_notes: []
