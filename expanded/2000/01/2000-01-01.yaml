    details:
      what_happened:
        - "Shortly before dawn on January 1, 2000, a severely overcrowded 60-foot wooden boat ran aground on a sandbar in Biscayne Bay within sight of the Miami skyline after a voyage from Haiti and the Bahamas."
        - "U.S. Coast Guard cutters and small boats transferred more than 400 passengers—including men, women, and children packed above and below deck—onto Coast Guard vessels for medical screening and immigration processing with the Immigration and Naturalization Service (`INS`)."
      why_it_matters:
        - "Because the freighter ran aground offshore before its passengers reached dry land, federal authorities classified the landing as an at-sea interdiction subject to rapid repatriation for Haitian nationals, sparking immediate protests from Haitian-American leaders who contrasted the policy with the \"wet foot, dry foot\" protections afforded to Cubans under the Cuban Adjustment Act."
        - "Exact passenger counts on January 1 varied between 407 and 411 as Coast Guard and INS officers separated suspected smugglers and Chinese nationals from Haitian passengers."
