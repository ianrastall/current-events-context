  - id: "evt-2000-01-01-005"
    category: "2000 in Canada"
    subcategory: ""
    topics:
      - "United Kingdom"
    importance: 6
    headline: "Queen Elizabeth II and Prime Minister Tony Blair open the Millennium Dome in Greenwich, London"
    summary: >
      Following a midnight inauguration ceremony attended by Queen Elizabeth II, Prince
      Philip, and British Prime Minister Tony Blair on the Prime Meridian at Greenwich,
      London, the £758 million Millennium Dome opened for its year-long Millennium
      Experience exhibition on January 1, 2000. While marketed by the Labour government as a
      showcase of British innovation, the opening was marred by severe ticketing and
      security bottlenecks that left thousands of invited journalists and VIP guests
      stranded at Stratford station for hours.
    key_data:
      - label: "Total project cost of the Millennium Dome"
        value: "£758 million GBP"
        citation_refs: [8]
      - label: "Diameter of the Richard Rogers cable-stayed dome"
        value: "365 meters"
        citation_refs: [8]
      - label: "Opening night invited attendance"
        value: "10,000 guests"
        citation_refs: [8]
      - label: "Casualties"
        value: "None"
        citation_refs: [8]
    details:
      what_happened:
        - "Designed by architect Richard Rogers and engineered by Buro Happold on the Greenwich Peninsula along the River Thames, the Millennium Dome—the largest single-roofed structure in the world at 365 meters in diameter—hosted Britain's flagship national millennium ceremony."
        - "Queen Elizabeth II, accompanied by Prime Minister Tony Blair, linked hands with attendees to sing Auld Lang Syne and lit the National Millennium Timepiece at the start of January 1, 2000."
        - "Administrative failures by the New Millennium Experience Company (`NMEC`) caused up to 4,000 guests and reporters whose tickets had not arrived by mail to be held in long security queues at Stratford London Underground station for up to four hours."
      why_it_matters:
        - "The chaotic opening night foreshadowed a year of lower-than-projected attendance (6.5 million visitors vs. the projected 12 million) and repeated National Lottery bailouts that turned the Dome into a persistent political controversy for the Blair government before its eventual conversion into The O2 Arena."
        - "None."
      uncertainty_notes: []
