  - id: "evt-2000-01-01-004"
    category: "2000"
    subcategory: ""
    topics:
      - "Vatican City"
      - "United States"
    importance: 8
    headline: "Worldwide millennium celebrations welcome the arrival of the year 2000"
    summary: >
      Hundreds of millions of people participated in coordinated celebrations across all
      twenty-four time zones on January 1, 2000 to mark the arrival of the year 2000 and the
      popular observance of the new millennium. Major ceremonies took place from Kiribati,
      Sydney Harbour, and Tokyo to the Giza Pyramids in Egypt, St. Peter's Square in Vatican
      City—where Pope John Paul II delivered his New Year's Day Urbi et Orbi message for the
      Great Jubilee of 2000—Paris, London, Rio de Janeiro, and New York City's Times Square.
    key_data:
      - label: "Estimated crowd in Times Square and surrounding Manhattan"
        value: "2 million spectators"
        citation_refs: [7]
      - label: "NYPD security deployment in New York City"
        value: "8,000 police officers"
        citation_refs: [7]
      - label: "Estimated crowd at Copacabana Beach, Rio de Janeiro"
        value: "2.5 million spectators"
        citation_refs: [7]
      - label: "Casualties"
        value: "None (at major official ceremonies)"
        citation_refs: [7]
    details:
      what_happened:
        - "Following Pacific Island nations Kiribati and New Zealand and a massive fireworks display over the Sydney Harbour Bridge, midnight celebrations progressed westward across Asia, the Middle East, Europe, Africa, and the Americas throughout January 1, 2000."
        - "In Vatican City, 79-year-old Pope John Paul II marked the World Day of Peace during the Catholic Church's Great Jubilee Year 2000, calling on humanity to leave behind the wars and genocides of the twentieth century."
        - "In the United States, President Bill Clinton presided over the \"America's Millennium\" celebration on the National Mall at the Lincoln Memorial in Washington D.C., while two million people gathered in Times Square under heavy counterterrorism security following the mid-December arrest of Ahmed Ressam in the 2000 millennium attack plots."
      why_it_matters:
        - "The global satellite television broadcast (2000 Today), produced by a consortium of sixty international broadcasters led by the BBC and WGBH, linked live feeds from every time zone to an audience exceeding one billion viewers, representing the largest synchronized global media event to that date."
        - "Heightened security protocols in major Western capitals reflected growing concern over transnational terrorism after the December 1999 border arrest of al-Qaeda operative Ahmed Ressam and the Jordanian millennium plot raids."
        - "Strictly speaking under the Gregorian calendar (which has no Year Zero), the 21st century and 3rd millennium formally began on January 1, 2001, though public and governmental millennium celebrations overwhelmingly centered on January 1, 2000."
      uncertainty_notes: []
