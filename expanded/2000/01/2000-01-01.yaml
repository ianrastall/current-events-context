  - id: "evt-2000-01-01-002"
    category: "2000"
    subcategory: ""
    topics:
      - "United States"
      - "Japan"
    importance: 9
    headline: "Global Year 2000 (Y2K) computer rollover completes across all time zones without catastrophic infrastructure failure"
    summary: >
      The Year 2000 (Y2K) date rollover—caused by legacy software storing two-digit calendar
      years (`99` rolling over to `00`)—passed across all twenty-four time zones on January
      1, 2000 without causing major disruptions to global power grids, aviation, banking
      systems, nuclear facilities, or telecommunications. Government monitoring centers
      including the White House Information Coordination Center and the UN-backed
      International Y2K Cooperation Center reported only minor, isolated software glitches
      following a multi-year global remediation effort estimated at $300 billion.
    key_data:
      - label: "Estimated global Y2K remediation cost"
        value: "$300 billion USD"
        citation_refs: [3]
      - label: "Estimated U.S. federal and private remediation spending"
        value: "$100 billion USD"
        citation_refs: [4]
      - label: "Major aviation, power grid, or financial clearing failures"
        value: "0"
        citation_refs: [3]
      - label: "Casualties"
        value: "None"
        citation_refs: [3]
    details:
      what_happened:
        - "As midnight UTC and local midnight swept from the South Pacific across Asia, Europe, Africa, and the Americas on January 1, 2000, national Y2K command centers monitored electrical grids, nuclear reactors, air traffic control, and financial settlement networks."
        - "Only minor non-critical anomalies occurred—such as faulty ticket-validation machines on public transit in Australia, minor radiation-monitoring display errors at two Japanese nuclear plants that did not affect reactor safety, and incorrect date stamps (`1900` or `19100`) on miscellaneous websites and weather fax systems."
        - "U.S. Y2K coordinator John Koskinen and international monitoring officials confirmed on New Year's Day that core global infrastructure had transitioned intact, while noting that monitors would continue watching the first full post-holiday business days on January 2–4."
      why_it_matters:
        - "The seamless rollover validated one of the largest coordinated preventive engineering and systems-auditing campaigns in computing history, during which governments and corporations rewrote or retired millions of lines of legacy COBOL and embedded code."
        - "Paradoxically, the absence of visible disasters prompted immediate public debate over whether the Y2K threat had been overstated or whether massive pre-2000 engineering expenditure had averted genuine systemic failures."
        - "Estimates of total global Y2K spending ranged between $200 billion and $500 billion because private-sector hardware upgrades were often bundled with routine IT modernization."
      uncertainty_notes: []
