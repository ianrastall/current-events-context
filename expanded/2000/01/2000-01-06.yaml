analytical_overview: >
  On Thursday, January 6, 2000, the fourth day of the Israeli–Syrian peace summit in
  Shepherdstown, West Virginia, escalating legal and street confrontations in Miami and
  Havana over the INS order to return six-year-old Elián González to Cuba, and an Orthodox
  Christmas Eve ceasefire announcement in Grozny combined with a historic wildlife
  extinction in the Spanish Pyrenees and counterterrorism arrests in India. In
  Shepherdstown, U.S. President Bill Clinton presented Israeli Prime Minister Ehud Barak and
  Syrian Foreign Minister Farouk al-Sharaa with a seven-page American working paper
  outlining areas of convergence and remaining gaps on borders, security, water, and normal
  relations. In Florida and Washington, Cuban-American demonstrators staged rolling street
  blockades across Miami while Governor Jeb Bush and congressional Republicans petitioned
  Attorney General Janet Reno to overturn the January 5 INS custody ruling, even as hundreds
  of thousands of Cubans marched in Havana demanding the boy's immediate return.

  In Russia, Acting President Vladimir Putin ordered federal forces in Chechnya to suspend
  offensive air and artillery strikes in Grozny overnight for Orthodox Christmas while
  Russia's Central Electoral Commission formally set the early presidential election for
  March 26, 2000. In South Asia, Mumbai police announced the arrest of four suspected
  Harkat-ul-Mujahideen operatives linked to the December 1999 hijacking of Indian Airlines
  Flight 814, while Sri Lankan security forces detained more than 1,200 Tamil residents
  during sweeps across Colombo following the previous day's twin assassinations. Meanwhile,
  in Spain's Ordesa y Monte Perdido National Park, park rangers discovered the body of
  Celia, the last living Pyrenean ibex (Capra pyrenaica pyrenaica), crushed beneath a fallen
  beech tree—marking the formal extinction of the subspecies—while a magnitude 6.2
  earthquake off Luzon, Philippines and a magnitude 6.1 earthquake in Southeast Alaska led
  14 global `M4.5+` seismic events.

