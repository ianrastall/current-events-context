    importance: 8
    headline: "Miami protesters block streets and congressional Republicans subpoena Elián González as Cuba mobilizes mass rallies following INS ruling"
    summary: >
      On January 6, 2000, the day after the U.S. Immigration and Naturalization Service
      (`INS`) ordered six-year-old Elián González returned to his father in Cuba by January
      14, hundreds of Cuban-American demonstrators blocked intersections and traffic lanes
      across Miami—leading to more than 100 arrests—while U.S. Attorney General Janet Reno
      rejected immediate demands by Florida Governor Jeb Bush to reverse the decision and
      House Government Reform Committee Chairman Dan Burton prepared a congressional
      subpoena to keep the boy in the United States.
    key_data:
      - label: "Demonstrators arrested in Miami street protests on January 6"
        value: "Over 100 arrested by Miami-Dade and city police"
        citation_refs: [3]
      - label: "GDELT 1.0 CAMEO cluster (`20000106`, Havana / Fidel Castro)"
        value: "57 mentions across 46 articles"
        citation_refs: [4]
      - label: "Casualties"
        value: "None; over 100 protesters arrested"
        citation_refs: [3]
    details:
      what_happened:
        - "Beginning at dawn on Thursday, January 6, 2000, Cuban-American exiles formed human chains across downtown Miami intersections, Biscayne Boulevard, and entrances to the Port of Miami to protest INS Commissioner Doris Meissner's January 5 ruling recognizing Juan Miguel González's parental custody; police arrested more than 100 protesters for disorderly conduct and obstructing traffic."
        - "At her weekly Justice Department briefing in Washington on January 6, Attorney General Janet Reno backed Meissner's legal authority and declined requests from Florida Governor Jeb Bush to intervene immediately, while Republican Representative Dan Burton announced plans to issue a congressional subpoena compelling six-year-old Elián to testify before Congress in February."
        - "In Havana, President Fidel Castro's government organized mass marches and youth rallies welcoming the INS ruling as a partial victory while demanding that the boy be returned to Cuba immediately without legal delay."
      why_it_matters:
        - "The January 6 clashes in Miami and legal maneuvers by congressional Republicans transformed an administrative immigration decision into a full-scale constitutional and political confrontation between federal authorities, Florida state courts, and Congress."
        - "None."
      uncertainty_notes: []
