        value: "77 combined mentions across 61 articles"
        citation_refs: [14]
      - label: "Casualties"
        value: "Over 30 killed in early January Lagos violence; ~100 arrested on Jan 6"
        citation_refs: [14]
    details:
      what_happened:
        - "Following the abduction and killing of Bariga Divisional Police Officer Afolabi Amao—whose body was dumped in the Lagos Lagoon after he attempted to negotiate the release of detainees held by militants—Lagos State Police Commissioner Mike Okiro deployed mobile police (\"Kill and Go\") units across Mushin and Bariga on Thursday, January 6, 2000."
        - "Police arrested nearly 100 suspected OPC fighters and declared factional leader Gani Adams wanted for murder and treason, while moderate OPC founder Dr. Frederick Fasehun distanced his wing from the killings and Lagos State Governor Bola Tinubu urged federal authorities to address severe understaffing in the state's police force."
      why_it_matters:
        - "The January 6 police sweep foreshadowed President Olusegun Obasanjo's controversial January 13 letter threatening to declare a federal state of emergency in Lagos State if Governor Tinubu failed to curb OPC vigilantism."
        - "Human rights groups in Lagos accused mobile police units of arbitrary arrests and summary shootings during the Mushin and Bariga raids."
