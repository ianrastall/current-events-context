  - id: "evt-2000-01-06-004"
    category: "Politics and elections"
    subcategory: ""
    topics:
      - "Russia"
    importance: 8
    headline: "Russian Central Electoral Commission formally confirms March 26, 2000 presidential election schedule as campaign opens"
    summary: >
      On January 6, 2000, Russia's Central Electoral Commission (`CEC`), chaired by
      Alexander Veshnyakov, formally published the election calendar and
      signature-collection rules following the Federation Council's confirmation of March
      26, 2000 as the date for Russia's early presidential election, requiring each
      presidential nominee to gather 500,000 voter signatures by February 13 under the
      shortened post-Yeltsin campaign timetable.
    key_data:
      - label: "Scheduled date of the 2000 Russian presidential election"
        value: "March 26, 2000"
        citation_refs: [6]
      - label: "Voter signatures required for candidate registration (shortened schedule)"
        value: "500,000 signatures (halved from 1,000,000 for an early election)"
        citation_refs: [6]
      - label: "GDELT 1.0 CAMEO cluster (`20000106`, Moscow Electoral Commission)"
        value: "41 mentions across 41 articles"
        citation_refs: [6]
      - label: "Casualties"
        value: "None"
        citation_refs: [6]
    details:
      what_happened:
        - "Following President Boris Yeltsin's surprise resignation on December 31, 1999 and the Federation Council's January 5 vote scheduling the early presidential election for Sunday, March 26, 2000, Central Electoral Commission Chairman Alexander Veshnyakov outlined the compressed statutory timetable in Moscow on January 6, 2000."
        - "Under Russia's Law on Presidential Elections, because the vote was called early within three months of a presidential vacancy, the signature threshold for nominating initiative groups was reduced by half from one million to 500,000 signatures, with a submission deadline of February 13, 2000."
        - "Communist Party (`KPRF`) leader Gennady Zyuganov was endorsed by his party plenum on January 6 as the main opposition challenger to Acting President Vladimir Putin, while Yabloko leader Grigory Yavlinsky and Liberal Democratic Party leader Vladimir Zhirinovsky also prepared nomination filings."
      why_it_matters:
        - "The compressed three-month election calendar—moving the vote forward from June to March 2000—prevented centrist rivals such as Yevgeny Primakov and Yuri Luzhkov from mounting viable campaigns and enabled Vladimir Putin to win an outright first-round majority (`52.9%`) on March 26, 2000."
        - "None."
      uncertainty_notes: []
