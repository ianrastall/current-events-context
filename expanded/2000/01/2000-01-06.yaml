    importance: 6
    headline: "Cambodian Prime Minister Hun Sen defends draft Khmer Rouge tribunal law linking domestic judicial majority to sovereignty"
    summary: >
      On January 6, 2000, Cambodian Prime Minister Hun Sen announced that his Cabinet had
      finalized a draft law to establish a special tribunal to try surviving senior leaders
      of the Khmer Rouge for the 1975–1979 genocide, insisting that Cambodian judges hold a
      majority on the bench despite warnings from United Nations legal experts that a
      domestic majority without international safeguards failed UN standards.
    key_data:
      - label: "Estimated deaths under the Khmer Rouge regime (1975–1979)"
        value: "~1.7 million people"
        citation_refs: [15]
      - label: "GDELT 1.0 CAMEO cluster (`20000106`, Cambodia -> Judge)"
        value: "41 mentions across 17 articles"
        citation_refs: [15]
      - label: "Casualties"
        value: "None"
        citation_refs: [15]
    details:
      what_happened:
        - "With only two senior Khmer Rouge figures—military commander Ta Mok (\"The Butcher\") and Tuol Sleng (`S-21`) prison chief Kaing Guek Eav (\"Duch\")—in Cambodian military custody following Pol Pot's death in 1998, Prime Minister Hun Sen's Council of Ministers approved a draft Khmer Rouge trial bill in Phnom Penh on January 6, 2000 for submission to the National Assembly."
        - "Under the Cambodian draft, Cambodian judges and prosecutors would outnumber UN-appointed foreign judges, but any conviction or acquittal would require a \"supermajority\" vote including at least one foreign judge—a formula that UN Secretary-General Kofi Annan's legal counsel Hans Corell continued to scrutinize over fears of political interference."
      why_it_matters:
        - "The \"supermajority\" compromise introduced in Cambodia's January 2000 draft law ultimately became the institutional foundation of the Extraordinary Chambers in the Courts of Cambodia (`ECCC`), which convicted Duch, Nuon Chea, and Khieu Samphan of crimes against humanity and genocide."
        - "Years of additional negotiations between Phnom Penh and the United Nations were required before the `ECCC` agreement was finally signed in June 2003."
      uncertainty_notes: []
