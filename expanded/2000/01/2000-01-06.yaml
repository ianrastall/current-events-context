    headline: "Ecumenical Patriarch Bartholomew I and Orthodox leaders celebrate millennial Epiphany services in the Holy Land"
    summary: >
      On January 6, 2000—the feast of the Epiphany on the Western and revised Julian
      calendars and Christmas Eve on the traditional Julian calendar—Ecumenical Patriarch
      Bartholomew I of Constantinople joined Eastern Orthodox patriarchs and Christian
      pilgrims in Jerusalem, Bethlehem, and the Jordan River to mark the 2,000th anniversary
      of the birth and baptism of Jesus Christ while calling for inter-Orthodox unity and
      peace in the Middle East.
