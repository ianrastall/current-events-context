    importance: 7
    headline: "Sri Lankan security forces detain more than 1,200 Tamil residents in Colombo cordon-and-search sweeps after twin assassinations"
    summary: >
      On January 6, 2000, Sri Lankan police and soldiers lifted the emergency daytime curfew
      in Colombo after rounding up more than 1,200 Tamil men and women during overnight
      cordon-and-search operations triggered by the January 5 LTTE suicide bombing outside
      the Prime Minister's office and the assassination of Tamil politician Kumar
      Ponnambalam, while Tamil political parties accused pro-government elements of
      Ponnambalam's murder.
    key_data:
