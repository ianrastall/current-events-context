  - id: "evt-2000-01-06-005"
    category: "Law and crime"
    subcategory: ""
    topics:
      - "India"
      - "Pakistan"
    importance: 8
    headline: "Indian police in Mumbai arrest four suspected Harkat-ul-Mujahideen operatives linked to the hijacking of Indian Airlines Flight 814"
    summary: >
      On January 6, 2000, Indian police in Mumbai and Home Minister Lal Krishna Advani in
      New Delhi announced the arrest of four Harkat-ul-Mujahideen operatives—including two
      Pakistani nationals, a Nepali national, and an Indian collaborator—who had operated a
      safe house in suburban Jogeshwari, Mumbai to procure fake Indian passports, airline
      tickets, and funds for the five hijackers of Indian Airlines Flight 814 (`IC 814`).
    key_data:
      - label: "Suspected Harkat-ul-Mujahideen operatives arrested in Mumbai"
        value: "4 operatives (Mohammed Rehan, Mohammed Iqbal, Yusuf Nepali, Abdul Latif)"
        citation_refs: [7]
      - label: "Weapons and explosives recovered at Jogeshwari safe house"
        value: "Hand grenades, rocket launchers, automatic pistols, and detonators"
        citation_refs: [7]
      - label: "Casualties"
        value: "None; 4 suspects arrested"
        citation_refs: [7]
    details:
      what_happened:
        - "Acting on intercepted satellite-phone and pager communications between the hijackers in Kandahar and handlers in Pakistan and Mumbai, Mumbai Police crime branch officers raided an apartment in Jogeshwari, northwest Mumbai, arresting four Harkat-ul-Mujahideen operatives—Indian national Abdul Latif (who had obtained fraudulent passports and driven the hijackers' weapons to Kathmandu), Pakistani nationals Mohammed Rehan and Mohammed Iqbal, and Nepali national Yusuf Nepali."
        - "Presenting the breakthrough on Thursday, January 6, 2000, Mumbai Police Commissioner R. H. Mendonca and Union Home Minister L. K. Advani stated that interrogation of the four men proved that all five hijackers of `IC 814` were Pakistani nationals directed from Karachi and Rawalpindi with support from Pakistan's Inter-Services Intelligence (`ISI`)."
      why_it_matters:
        - "The January 6 Mumbai arrests provided India's Central Bureau of Investigation (`CBI`) with the forensic evidence and confessions used to identify the five `IC 814` hijackers (including Ibrahim Athar, brother of released cleric Masood Azhar) and to convict Abdul Latif and Yusuf Nepali to life imprisonment."
        - "Pakistan's Foreign Ministry rejected India's allegations that the arrested men had official Pakistani state backing."
      uncertainty_notes: []
