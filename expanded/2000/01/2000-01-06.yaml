    details:
      what_happened:
        - "On Thursday, January 6, 2000, Ecumenical Patriarch Bartholomew I of Constantinople—the spiritual \"first among equals\" of the world's 250 million Eastern Orthodox Christians—led millennial Epiphany and Christmas Eve ceremonies in Jerusalem and Bethlehem alongside Patriarch Diodoros I of Jerusalem, Russian Orthodox Patriarch Alexy II of Moscow, and nine other heads of autocephalous Orthodox churches."
        - "Palestinian Authority President Yasser Arafat hosted the Orthodox leaders in Bethlehem for the traditional Julian Christmas Eve procession to the Church of the Nativity, which was also attended by Russian former President Boris Yeltsin on his first foreign trip since resigning on New Year's Eve."
      why_it_matters:
        - "The January 6–7 gathering of twelve Orthodox patriarchs and primates in Bethlehem and Jerusalem was the largest summit of Eastern Orthodox church leaders in the Holy Land in centuries, combining millennial religious commemorations with high-level political diplomacy."
