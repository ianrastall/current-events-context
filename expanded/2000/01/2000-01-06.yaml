    importance: 6
    headline: "Magnitude 6.2 earthquake off Luzon, Philippines and magnitude 6.1 earthquake in Southeast Alaska lead 14 global M4.5+ events"
    summary: >
      On January 6, 2000, two strong `M6.0+` earthquakes struck the Pacific Rim within an
      11-hour span: a shallow magnitude 6.1 strike-slip earthquake (`usp0009ktq`, depth 1.0
      km) 35 km west-southwest of Elfin Cove in Southeast Alaska at 10:42:25 UTC, followed
      at 21:31:06 UTC by a magnitude 6.2 subduction earthquake (`usp0009kub`, depth 33.0 km)
      off the western coast of Luzon, Philippines, which was felt across Pangasinan,
      Zambales, and Metro Manila.
    key_data:
      - label: "Luzon, Philippines earthquake (`usp0009kub`)"
        value: "M 6.2 at 21:31:06 UTC (16.095°N, 119.484°E, depth 33.0 km)"
        citation_refs: [18]
      - label: "Elfin Cove, Southeast Alaska earthquake (`usp0009ktq`)"
        value: "M 6.1 at 10:42:25 UTC (58.040°N, 136.870°W, depth 1.0 km)"
        citation_refs: [19]
      - label: "Gili Air / Lombok, Indonesia earthquake (`usp0009ktf`)"
        value: "M 5.4 at 04:31:58 UTC (8.293°S, 116.071°E, depth 33.0 km)"
        citation_refs: [18]
      - label: "Total global M4.5+ earthquakes on January 6, 2000"
        value: "14 earthquakes recorded in USGS ANSS ComCat"
        citation_refs: [18]
      - label: "Casualties"
        value: "None"
        citation_refs: [18]
    details:
      what_happened:
        - "At 10:42:25 UTC on Thursday, January 6, 2000, a shallow magnitude 6.1 earthquake (`usp0009ktq`) ruptured along the Queen Charlotte–Fairweather fault system 35 km west-southwest of Elfin Cove on Chichagof Island in Southeast Alaska (followed at 11:36:45 UTC by an `M4.6` aftershock `usp0009ktv`), shaking communities across Glacier Bay, Pelican, Sitka, and Juneau without causing structural damage."
        - "Nearly 11 hours later, at 21:31:06 UTC on January 6 (05:31 PST on January 7 in the Philippines), a magnitude 6.2 earthquake (`usp0009kub`) struck along the Manila Trench off Bolinao, Pangasinan in western Luzon, waking residents across western and central Luzon and swaying high-rise buildings in Manila."
        - "Earlier on January 6, a magnitude 5.4 earthquake (`usp0009ktf`) struck 7 km north of Gili Air off Lombok, Indonesia at 04:31:58 UTC, alongside a magnitude 5.2 event (`usp0009ku9`) in the Northern Mariana Islands and a magnitude 5.1 event (`usp0009kte`) near Singkil, Sumatra."
      why_it_matters:
        - "Pairing two `M6.0+` earthquakes on opposite sides of the northern Pacific Basin within 11 hours, January 6 continued the heightened circum-Pacific seismic sequence that culminated two days later in the `M7.2` Tonga earthquake of January 8, 2000."
        - "None."
