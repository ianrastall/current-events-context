    headline: "King Abdullah II of Jordan holds talks in Moscow with Acting Russian President Vladimir Putin on Middle East peace and Iraq"
    summary: >
      On January 6, 2000, King Abdullah II of Jordan paid a working visit to Moscow for his
      first face-to-face summit with Acting Russian President Vladimir Putin at the
      Kremlin—Putin's first meeting with a foreign head of state since Boris Yeltsin's
      resignation—discussing the Israeli–Syrian and Israeli–Palestinian peace tracks, United
      Nations sanctions on Iraq, and Russian–Jordanian defense cooperation.
    key_data:
