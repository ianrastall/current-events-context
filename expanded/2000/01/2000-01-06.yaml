        value: "31 mentions across 31 articles"
        citation_refs: [11]
      - label: "Casualties"
        value: "None on January 6; 1,200+ detained"
        citation_refs: [11]
    details:
      what_happened:
        - "During a 21-hour curfew imposed across Colombo and Gampaha district from midday on January 5 until the morning of Thursday, January 6, 2000, thousands of Sri Lankan troops and police searched Tamil boarding houses, lodges, and residential neighborhoods in Wellawatte, Kotahena, and Pettah, detaining more than 1,200 Tamils for questioning over suspected links to Liberation Tigers of Tamil Eelam (`LTTE`) suicide cells."
        - "President Chandrika Kumaratunga ordered a special police investigation into the killing of All Ceylon Tamil Congress (`ACTC`) leader Kumar Ponnambalam after Tamil members of parliament and international human rights observers rejected claims by the previously unknown \"National Front Against Tigers\" and demanded an independent inquiry."
      why_it_matters:
        - "The mass detentions of Tamil civilians in Colombo deepened ethnic polarization in the Sri Lankan capital and drew scrutiny from human rights organizations over emergency detention practices under the Prevention of Terrorism Act."
        - "Most of the 1,200 detainees were released within 48 hours after police registration, while several dozen suspects were held for further interrogation."
