    importance: 8
    headline: "U.S. President Bill Clinton tables a seven-page American bridging document at the Shepherdstown peace summit between Israel and Syria"
    summary: >
      On January 6, 2000—the fourth day of the Shepherdstown peace negotiations—U.S.
      President Bill Clinton and Secretary of State Madeleine Albright presented Israeli
      Prime Minister Ehud Barak and Syrian Foreign Minister Farouk al-Sharaa with a draft
      seven-page American "working paper" summarizing Israeli and Syrian positions on the
      four core issues of borders, security arrangements, water rights, and normal
      diplomatic relations in an effort to accelerate substantive trade-offs.
    key_data:
      - label: "Length of draft U.S. working paper tabled on January 6, 2000"
        value: "7 pages covering borders, security, water, and normal relations"
        citation_refs: [1]
      - label: "GDELT 1.0 CAMEO cluster (`20000106`, Israel / Jerusalem)"
        value: "70 mentions across 56 articles"
        citation_refs: [1]
      - label: "Casualties"
        value: "None"
        citation_refs: [1]
    details:
      what_happened:
        - "After four days of procedural wrangling over which working committees should meet first—with Syria demanding priority for defining the June 4, 1967 border line and Israel insisting on simultaneous progress on security arrangements, early-warning stations, and diplomatic normalization—U.S. mediators led by President Bill Clinton and Secretary of State Madeleine Albright submitted a formal seven-page U.S. working document to both delegations at the Clarion Hotel in Shepherdstown on Thursday, January 6, 2000."
        - "The working paper bracketed points of disagreement between Israel and Syria while proposing a synchronized framework for phased Israeli withdrawal from the Golan Heights, demilitarized zones, monitoring on Mount Hermon, and water-sharing guarantees around the Sea of Galilee and upper Jordan River."
      why_it_matters:
        - "The January 6 U.S. working paper became the central negotiating text of the Shepherdstown round; its subsequent leak to the Israeli daily Haaretz a week later exposed the exact depth of the concessions under discussion and contributed to Damascus suspending the second round of talks."
        - "Under the strict news blackout imposed by the State Department at Shepherdstown, the exact text of the working paper remained confidential on January 6 until its publication by Haaretz on January 13, 2000."
      uncertainty_notes: []
