        value: "92 combined mentions across 64 articles"
        citation_refs: [12]
      - label: "Casualties"
        value: "None"
        citation_refs: [12]
    details:
      what_happened:
        - "Arriving in Moscow on a brief working visit on Thursday, January 6, 2000, King Abdullah II of Jordan met with Acting President Vladimir Putin and Foreign Minister Igor Ivanov at the Kremlin, becoming the first foreign monarch or head of state to hold talks with Putin following his December 31 assumption of the Russian presidency."
        - "Putin reaffirmed Russia's role as formal co-sponsor of the Madrid Middle East peace process alongside the United States, while the two leaders discussed coordinating positions on the Shepherdstown Israeli–Syrian talks, the Palestinian final-status track, the humanitarian impact of UN sanctions on Iraq, and potential Jordanian procurement of Russian military equipment."
      why_it_matters:
        - "The January 6 Kremlin summit allowed Acting President Putin to project diplomatic continuity on the international stage within days of taking office while strengthening Moscow's outreach to moderate Arab states."
