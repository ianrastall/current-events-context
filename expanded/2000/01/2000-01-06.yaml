  - id: "evt-2000-01-06-015"
    category: "Sports"
    subcategory: ""
    topics:
      - "Russia"
    importance: 4
    headline: "Russian chess grandmaster and 1989 Soviet co-champion Alexey Vyzmanavin is found dead in Moscow at age 40"
    summary: >
      On January 6, 2000, Russian chess grandmaster Alexey Vyzmanavin—three-time Moscow
      champion, joint winner of the 57th USSR Chess Championship in 1990, and gold medalist
      with the Russian national team at the 1992 Manila Chess Olympiad—was found dead of a
      heart attack in his Moscow apartment at the age of 40.
    key_data:
      - label: "Age of Grandmaster Alexey Vyzmanavin at death"
        value: "40 years old (born January 1, 1960 in Moscow)"
        citation_refs: [20]
      - label: "Peak FIDE world ranking"
        value: "World No. 21 (January 1993, Elo rating 2620)"
        citation_refs: [20]
      - label: "Casualties"
        value: "1 death (natural causes / heart failure)"
        citation_refs: [20]
    details:
      what_happened:
        - "Born on New Year's Day 1960 in Moscow, Alexey Borisovich Vyzmanavin rose through the Soviet military sports system as one of the sharpest tacticians and fastest blitz players of the late Soviet era, winning the Moscow Chess Championship in 1984 and 1986, earning the Grandmaster title in 1989, and sharing first place with Alexander Beliavsky, Leonid Yudasin, and Evgeny Bareev in the final Leningrad USSR Championship in 1990."
        - "After helping Russia win team gold at the 30th Chess Olympiad in Manila in 1992 and reaching the final of the 1993 PCA Groningen rapid tournament against Viswanathan Anand, Vyzmanavin retired from tournament chess in 1997; he was found dead in his Moscow apartment on January 6, 2000 after living alone for several days following a fatal heart attack."
      why_it_matters:
        - "Vyzmanavin's premature death at age 40 was mourned across the international chess world as a symbol of the economic and personal hardships faced by many elite post-Soviet grandmasters during the 1990s transition."
        - "Because Vyzmanavin lived alone in Moscow, coroner estimates indicated he died around New Year's Day 2000 before his body was discovered on January 6, 2000, which is recorded as his official date of death."
      uncertainty_notes: []
