    importance: 7
    headline: "Nigerian police deploy armored patrols across Lagos and arrest scores of suspected OPC militants after presidential warning"
    summary: >
      On January 6, 2000, reinforced units of the Nigeria Police Force backed by armored
      personnel carriers swept through the Mushin, Bariga, and Somolu districts of Lagos,
      arresting nearly 100 suspected members of the militant Yoruba nationalist Oodua
      People's Congress (`OPC`) after the murder of a senior police officer and days of
      street clashes that killed more than 30 people.
    key_data:
      - label: "Suspected OPC militia members arrested in Lagos sweeps"
        value: "~100 suspects detained by January 6, 2000"
        citation_refs: [14]
      - label: "Bounty offered by Nigerian police for militant OPC leader Gani Adams"
        value: "100,000 naira (~$1,000 USD)"
