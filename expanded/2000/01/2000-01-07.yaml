strategic_conclusion: >
  January 7, 2000 captured both institutional milestones and intensifying political and
  sectarian fault lines across the globe. In Ottawa, Beverley McLachlin's swearing-in as the
  first female Chief Justice of Canada marked a constitutional landmark, while on Wall
  Street a surge of 315,000 December jobs lifted the Dow Jones Industrial Average to a
  record `11,522.56`. At the same time, Beijing's awkward confirmation of the 17th Karmapa
  Lama's flight from Tibet, the mobilization of 100,000 demonstrators demanding jihad at
  Jakarta's National Monument, the congressional subpoena of six-year-old Elián González in
  Washington, and the stealthy infiltration of Chechen fighters during the Orthodox
  Christmas pause in Grozny set in motion dramatic confrontations that unfolded over the
  coming days.

