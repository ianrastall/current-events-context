  - id: "evt-2000-01-07-003"
    category: "Law and crime"
    subcategory: ""
    topics:
      - "Canada"
    importance: 8
    headline: "Beverley McLachlin is sworn in as the 17th Chief Justice of Canada, becoming the first woman to lead the Supreme Court of Canada"
    summary: >
      On January 7, 2000, Justice Beverley McLachlin was formally sworn in at Ottawa as the
      17th Chief Justice of Canada following the retirement of Chief Justice Antonio Lamer,
      becoming the first woman in Canadian history to hold the country's highest judicial
      office.
    key_data:
      - label: "Order as Chief Justice of Canada"
        value: "17th Chief Justice of Canada (first female Chief Justice)"
        citation_refs: [4]
      - label: "Age of Beverley McLachlin at swearing-in"
        value: "56 years old (appointed puisne justice of the Supreme Court in March 1989)"
        citation_refs: [4]
      - label: "Casualties"
        value: "None"
        citation_refs: [4]
    details:
      what_happened:
        - "Nominated by Prime Minister Jean Chrétien on November 3, 1999 to succeed retiring Chief Justice Antonio Lamer, 56-year-old Alberta-born jurist Beverley McLachlin took the oath of office as Chief Justice of Canada on Friday, January 7, 2000 in Ottawa before Governor General Adrienne Clarkson."
        - "Having previously served on the British Columbia Court of Appeal and as Chief Justice of the Supreme Court of British Columbia before joining the Supreme Court of Canada in 1989, McLachlin pledged at her swearing-in to defend judicial independence, Charter rights, and public access to justice in the new century."
      why_it_matters:
        - "Beyond breaking the gender barrier at the pinnacle of the Canadian judiciary, McLachlin went on to serve nearly 18 years as Chief Justice (until December 2017), becoming the longest-serving Chief Justice in Canadian history and shaping landmark constitutional jurisprudence on Indigenous rights, assisted dying, and freedom of expression."
        - "None."
      uncertainty_notes: []
