analytical_overview: >
  On Friday, January 7, 2000, official Chinese acknowledgment of the 17th Karmapa Lama's
  flight from Tibet, a massive Muslim protest rally in Jakarta over the Maluku sectarian
  bloodshed, and the historic swearing-in of Beverley McLachlin as the first female Chief
  Justice of Canada coincided with escalating legal maneuvers in the Elián González custody
  battle and a record close on Wall Street. In Beijing, the State Council Information Office
  and Xinhua confirmed for the first time that 14-year-old Ogyen Trinley Dorje—the 17th
  Karmapa and the highest Tibetan Buddhist lama recognized by both Beijing and the Dalai
  Lama—had secretly left Tsurphu Monastery, asserting that he had left behind a letter
  stating he had gone abroad only to retrieve "black hats and musical instruments" used by
  previous Karmapas. In Jakarta, more than 100,000 Muslim demonstrators led by People's
  Consultative Assembly (`MPR`) Speaker Amien Rais rallied at the National Monument (Monas)
  to demand a jihad (holy war) in the Maluku islands if President Abdurrahman Wahid failed
  to halt Christian–Muslim bloodshed within weeks.

  In Ottawa, Justice Beverley McLachlin took the oath of office as the 17th Chief Justice of
  Canada, becoming the first woman to lead the Supreme Court of Canada. In Melbourne,
  86-year-old suspected Latvian Nazi collaborator Konrad Kalejs arrived on a flight from
  London after being ordered deported by British Home Secretary Jack Straw, walking past
  furious protesters at Tullamarine Airport. Meanwhile, in the United States, Republican
  Representative Dan Burton issued a congressional subpoena ordering six-year-old Elián
  González to appear before a House committee in February to block his January 14 return to
  Cuba, while a strong December jobs report (`315,000` new jobs, `4.1%` unemployment)
  propelled the Dow Jones Industrial Average up 269 points to a record close of `11,522.56`.
  Elsewhere, Japanese Prime Minister Keizō Obuchi arrived in Phnom Penh for the first visit
  to Cambodia by a Japanese premier in 43 years, Turkish security forces stormed a rioting
  ward at Bandırma Prison, a magnitude 5.5 earthquake struck the Falkland Islands region,
  and Soviet-Chechen dance legend Makhmud Esambayev, German actor Klaus Wennemann, and
  American wrestler Gary Albright died.

