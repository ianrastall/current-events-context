    importance: 5
    headline: "Magnitude 5.5 earthquake in the Falkland Islands region leads seven global M4.5+ earthquakes on January 7"
    summary: >
      On January 7, 2000 at 23:37:20 UTC, a shallow magnitude 5.5 earthquake (`usp0009kvk`,
      depth 10.0 km) struck the Falkland Islands region along the northern Scotia Ridge in
      the South Atlantic Ocean, leading seven `M4.5+` earthquakes recorded globally by the
      USGS on January 7 alongside intermediate-depth and deep events in northwestern
      Argentina (`M4.8`), the Fiji–Tonga subduction zone (`M4.7`, `M4.7`, `M4.6`), the South
      Sandwich Islands (`M4.5`), and western Luzon, Philippines (`M4.5`).
    key_data:
      - label: "Falkland Islands region earthquake (`usp0009kvk`)"
        value: "M 5.5 at 23:37:20 UTC (54.326°S, 55.126°W, depth 10.0 km)"
        citation_refs: [14]
      - label: "Catamarca–La Rioja, Argentina earthquake (`usp0009kuf`)"
        value: "M 4.8 at 01:08:19 UTC (28.210°S, 67.351°W, depth 144.4 km)"
        citation_refs: [14]
      - label: "Total global M4.5+ earthquakes on January 7, 2000"
        value: "7 earthquakes recorded in USGS ANSS ComCat"
        citation_refs: [14]
      - label: "Casualties"
        value: "None"
        citation_refs: [14]
    details:
      what_happened:
        - "Global `M4.5+` seismic activity on Friday, January 7, 2000 opened at 01:08:19 UTC with an intermediate-depth magnitude 4.8 intraslab earthquake (`usp0009kuf`, depth 144.4 km) beneath the Catamarca–La Rioja border region of northwestern Argentina, followed at 03:07:24 UTC by an `M4.5` event (`usp0009kuj`, depth 183.6 km) in the South Sandwich Islands."
        - "Three deep-focus earthquakes ruptured along the Tonga–Kermadec–Fiji slab (`M4.7` `usp0009kur` at 336 km depth at 06:05:30 UTC; `M4.6` `usp0009kuw` at 160.2 km depth near Haveluloto, Tonga at 09:14:59 UTC; and `M4.7` `usp0009kvf` at 620.9 km depth at 21:45:49 UTC), while an `M4.5` aftershock (`usp0009kva`) struck off western Luzon, Philippines at 16:00:02 UTC following the previous day's `M6.2` mainshock."
        - "At 23:37:20 UTC, the day's strongest tremor—a shallow magnitude 5.5 transform-boundary earthquake (`usp0009kvk`, depth 10.0 km)—ruptured along the North Scotia Ridge southeast of the Falkland Islands."
      why_it_matters:
        - "The January 7 deep-focus activity (`160–621 km` depth) beneath the Fiji–Tonga arc directly preceded the major magnitude 7.2 intermediate-depth earthquake (`183.4 km` depth) south-southwest of Hihifo, Tonga less than 19 hours later on January 8, 2000."
        - "None."
      uncertainty_notes: []
