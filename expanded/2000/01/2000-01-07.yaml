  - id: "evt-2000-01-07-014"
    category: "Arts and culture"
    subcategory: ""
    topics:
      - "Germany"
    importance: 4
    headline: "German film and television actor Klaus Wennemann, star of Das Boot and Der Fahnder, dies in Bavaria at age 59"
    summary: >
      On January 7, 2000, acclaimed German film and television actor Klaus
      Wennemann—internationally known as Chief Engineer (Leitender Ingenieur) Fritz Grade in
      Wolfgang Petersen's 1981 World War II epic Das Boot and beloved in Germany for his
      nine-year starring role as Ruhr-valley police investigator Hannes Faber in the ARD
      crime drama Der Fahnder—died of lung cancer in Bad Aibling, Bavaria at age 59.
    key_data:
      - label: "Age of Klaus Wennemann at death"
        value: "59 years old (born December 18, 1940 in Oer-Erkenschwick, Westphalia)"
        citation_refs: [16]
      - label: "Episodes starred in ARD crime series Der Fahnder (1984–1993)"
        value: "90 episodes (winner of the 1986 Grimme-Preis)"
        citation_refs: [16]
      - label: "Casualties"
        value: "1 death (lung cancer)"
        citation_refs: [16]
    details:
      what_happened:
        - "Born on December 18, 1940 in the coal-mining town of Oer-Erkenschwick in the Ruhr region, Klaus Wennemann trained at the Folkwang University of the Arts in Essen and worked at theaters in Landshut, Recklinghausen, and Frankfurt before achieving international recognition in 1981 as the stoic Chief Engineer (\"LI\") of U-96 in Wolfgang Petersen's Academy Award-nominated film Das Boot."
        - "From 1984 to 1993, Wennemann became one of West Germany's most popular television actors as unconventional detective Hannes Faber in 90 episodes of Der Fahnder, followed by a starring role as Father Maxim in the SAT. series Schwarz greift ein (1994–1999); he died of lung cancer at a clinic in Bad Aibling, Upper Bavaria on January 7, 2000, three weeks after his 59th birthday."
      why_it_matters:
        - "Wennemann's portrayal of working-class Ruhr-valley authenticity helped redefine West German television crime drama in the 1980s and 1990s alongside Götz George's Schimanski."
        - "None."
      uncertainty_notes: []
