  - id: "evt-2000-01-07-015"
    category: "Sports"
    subcategory: ""
    topics:
      - "United States"
    importance: 4
    headline: "American professional wrestler Gary Albright collapses and dies of a heart attack in the ring in Hazleton, Pennsylvania at age 36"
    summary: >
      On the night of January 7, 2000, 36-year-old American amateur and professional
      wrestler Gary Albright—a star performer for All Japan Pro Wrestling (`AJPW`), UWF
      International, and Stampede Wrestling and a member by marriage of the Anoaʻi wrestling
      family—collapsed and died of a massive heart attack in the ring during a World Xtreme
      Wrestling (`WXW`) show in Hazleton, Pennsylvania.
    key_data:
      - label: "Age of Gary Albright at death"
        value: "36 years old (born May 18, 1963 in Rhode Island)"
        citation_refs: [17]
      - label: "Official cause of death determined by Luzerne County Coroner"
        value: "Acute heart attack (cardiomegaly, severe coronary artery blockage, diabetes)"
        citation_refs: [17]
      - label: "Casualties"
        value: "1 death (natural causes / cardiac arrest in ring)"
        citation_refs: [17]
    details:
      what_happened:
        - "A standout heavyweight collegiate wrestler at the University of Nebraska (where he set the school's single-season pin record of 34 falls in 1985–86), Gary Mitchell Albright became one of the most feared foreign suplex specialists (\"The Master of Suplexes\") in Japan during the 1990s with UWF International (`UWFi`) and Giant Baba's All Japan Pro Wrestling (`AJPW`), twice winning the World Tag Team Championship alongside Stan Hansen and Steve Williams."
        - "On Friday night, January 7, 2000, while wrestling Lucifer Grimm (Bill Owens) at a World Xtreme Wrestling (`WXW`) independent card promoted by his father-in-law Afa Anoaʻi in Hazleton, Pennsylvania, Albright suffered a fatal heart attack after taking a three-quarter facelock bulldog; paramedics were unable to revive him and he was pronounced dead at Hazleton General Hospital at age 36."
      why_it_matters:
        - "Albright's sudden in-ring death at age 36—followed later in 2000 by the death of his cousin-in-law Yokozuna (Rodney Anoaʻi) at age 34—intensified scrutiny of cardiovascular health and premature mortality among heavyweight professional wrestlers."
        - "The Luzerne County Coroner ruled that Albright's death resulted from natural medical causes (an enlarged heart, coronary artery blockages, and diabetes) and was not caused by physical trauma from the wrestling maneuver."
      uncertainty_notes: []
