    headline: "German prosecutors and parliamentary investigators widen the CDU secret-accounts probe as pressure mounts on Helmut Kohl"
    summary: >
      On January 7, 2000, German prosecutors and Bundestag investigators expanded inquiries
      into the Christian Democratic Union (`CDU`) slush-fund scandal following the opening
      of a formal criminal breach-of-trust investigation against former Chancellor Helmut
      Kohl, while regional prosecutors in Schleswig-Holstein reviewed party and state
      financial records amid revelations of undeclared cash transfers in Hesse and federal
      party accounts.
