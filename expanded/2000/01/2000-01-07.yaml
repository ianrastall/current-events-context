    headline: "House Committee Chairman Dan Burton subpoenas six-year-old Elián González to block his January 14 return to Cuba"
    summary: >
      On January 7, 2000, Republican Representative Dan Burton of Indiana, Chairman of the
      U.S. House Committee on Government Reform, issued a congressional subpoena ordering
      six-year-old Cuban castaway Elián González to appear before a congressional panel on
      February 10, 2000, in a direct move to prevent the Immigration and Naturalization
      Service (`INS`) from returning the boy to his father in Cuba by the agency's January
      14 deadline.
    key_data:
      - label: "Scheduled congressional hearing date in Rep. Dan Burton's subpoena"
        value: "February 10, 2000 (four weeks after the INS's January 14 deadline)"
        citation_refs: [9]
      - label: "GDELT 1.0 CAMEO cluster (`20000107`, United States)"
        value: "61 combined mentions across 41 articles"
        citation_refs: [9]
      - label: "Casualties"
        value: "None"
        citation_refs: [9]
    details:
      what_happened:
        - "Two days after INS Commissioner Doris Meissner ruled that Elián González must be returned to his father Juan Miguel González in Cuba by January 14, House Government Reform Committee Chairman Dan Burton signed and served a congressional subpoena on Friday, January 7, 2000 requiring the six-year-old boy to remain in the United States to testify at a February 10 committee hearing."
        - "Simultaneously, lawyers for Elián's Miami great-uncle, Lázaro González, filed an emergency petition in Miami-Dade Circuit Family Court seeking temporary state custody of the boy and challenging the INS ruling."
        - "White House officials and Justice Department lawyers criticized the congressional subpoena of a six-year-old child as an improper political interference with federal immigration law and parental custody."
      why_it_matters:
        - "The January 7 congressional subpoena and state family-court filing prompted Attorney General Janet Reno on January 12 to lift the immediate January 14 deadline and direct that the custody dispute be resolved in federal district court, where the INS ultimately prevailed."
        - "Constitutional scholars noted that a congressional committee subpoena had no legal authority to override the statutory jurisdiction of the Executive Branch under the Immigration and Nationality Act."
      uncertainty_notes: []
