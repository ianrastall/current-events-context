    headline: "U.S. economy adds 315,000 jobs in December 1999 at a 4.1% unemployment rate, sending the Dow Jones Industrial Average to a record 11,522.56"
    summary: >
      On January 7, 2000, the U.S. Department of Labor reported that nonfarm payroll
      employment surged by 315,000 in December 1999 while the national unemployment rate
      held steady at a 30-year low of 4.1% and average hourly earnings rose a modest 0.4%,
      igniting a broad Wall Street rally that sent the Dow Jones Industrial Average up
      269.30 points (`+2.39%`) to an all-time closing record of 11,522.56.
    key_data:
      - label: "U.S. nonfarm payroll additions in December 1999 (reported Jan 7, 2000)"
        value: "+315,000 jobs (full-year 1999 job growth: 2.7 million)"
        citation_refs: [10]
      - label: "U.S. civilian unemployment rate (December 1999)"
        value: "4.1% (lowest annual average since 1969)"
        citation_refs: [10]
      - label: "Dow Jones Industrial Average close on January 7, 2000"
        value: "11,522.56 (+269.30 points, +2.39%, all-time closing record)"
        citation_refs: [10]
      - label: "Casualties"
        value: "None"
        citation_refs: [10]
    details:
      what_happened:
        - "On Friday morning, January 7, 2000, the Bureau of Labor Statistics (`BLS`) released the December 1999 employment situation report, showing that U.S. payrolls expanded by 315,000—well above Wall Street expectations of ~220,000—while the unemployment rate remained at 4.1% for the third consecutive month and full-year 1999 wage inflation remained contained at 3.5%."
        - "Relieved after the violent technology sell-off earlier in the week on January 4, investors poured back into both blue-chip industrials and technology equities: the Dow Jones Industrial Average surged 269.30 points to a record close of 11,522.56, the S&P 500 rose 2.71% to 1,441.47, and the Nasdaq Composite climbed 4.17% (+155.49 points) to 3,882.62."
      why_it_matters:
        - "The January 7 rally set the stage for the Dow Jones Industrial Average's historic cyclical peak four trading days later on January 14, 2000 (`11,722.98`), while the sizzling 315,000 jobs figure reinforced the Federal Reserve's decision to raise interest rates at its February 2000 meeting."
        - "None."
