    headline: "Turkish security forces storm rioting ward at Bandırma Prison in Balıkesir Province, leaving one inmate dead and dozens injured"
    summary: >
      On January 7, 2000, Turkish Gendarmerie troops and prison guards stormed a dormitory
      ward held by far-left political inmates at Bandırma Prison in Balıkesir Province,
      northwestern Turkey, freeing prison staff taken hostage during a protest against
      planned transfers to high-security cell-type ("F-type") prisons; one prisoner was
      killed and more than 25 inmates and security personnel were injured.
    key_data:
      - label: "Fatalities in the January 7 Bandırma Prison operation"
        value: "1 inmate killed"
        citation_refs: [11]
      - label: "Injured in Bandırma Prison clashes"
        value: "~25 inmates and gendarmes injured"
        citation_refs: [11]
      - label: "GDELT 1.0 CAMEO cluster (`20000107`, Bandirma, Balikesir, Turkey)"
        value: "37 mentions across 21 articles"
        citation_refs: [11]
      - label: "Casualties"
        value: "1 killed, ~25 injured"
        citation_refs: [11]
    details:
      what_happened:
        - "On Friday, January 7, 2000, inmates belonging to outlawed far-left revolutionary factions at Bandırma Prison on the Sea of Marmara seized prison guards as hostages and barricaded their dormitory ward to protest prison conditions and the Turkish Justice Ministry's program to replace large communal dormitories with small-cell \"F-type\" maximum-security prisons."
        - "Turkish paramilitary gendarmes breached the ward using tear gas and batons to rescue the hostages; one inmate died during the assault and roughly two dozen prisoners and guards were hospitalized."
      why_it_matters:
        - "The January 7 Bandırma Prison clash was an early flashpoint in Turkey's year-long struggle over the transition to F-type prisons, which culminated in the nationwide prisoner hunger strikes (\"death fasts\") of October 2000 and the December 2000 \"Operation Return to Life\" raids across 20 Turkish prisons."
        - "Turkish authorities stated that the deceased inmate died from injuries sustained during inmate resistance, while human rights advocates alleged excessive force by gendarmes."
