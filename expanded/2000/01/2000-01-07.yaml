        citation_refs: [13]
    details:
      what_happened:
        - "Beginning a six-day Southeast Asian diplomatic tour covering Cambodia, Laos, and Thailand ahead of the July 2000 G8 Summit in Okinawa, Japanese Prime Minister Keizō Obuchi landed in Phnom Penh on Friday, January 7, 2000 and held summit talks with Cambodian Prime Minister Hun Sen."
        - "As Cambodia's largest bilateral aid donor (providing roughly $100 million annually), Obuchi pledged Japanese financial and technical assistance for demining, infrastructure reconstruction, and military demobilization, while encouraging Hun Sen to ensure that Cambodia's newly drafted Khmer Rouge genocide tribunal law met international credibility standards negotiated with the United Nations."
      why_it_matters:
        - "Obuchi's historic visit underscored Japan's active diplomatic and financial leadership in post-conflict Indochina and laid the groundwork for Japanese funding that later sustained the UN-backed Khmer Rouge tribunal (`ECCC`)."
