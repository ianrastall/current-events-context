    headline: "Japanese Prime Minister Keizō Obuchi visits Phnom Penh in the first trip to Cambodia by a Japanese premier in 43 years"
    summary: >
      On January 7, 2000, Japanese Prime Minister Keizō Obuchi arrived in Phnom Penh for
      official talks with Cambodian Prime Minister Hun Sen and King Norodom Sihanouk—marking
      the first visit to Cambodia by a sitting Japanese prime minister since Nobusuke Kishi
      in 1957—pledging continued Japanese economic aid and urging Cambodia and the United
      Nations to resolve their differences over the draft Khmer Rouge tribunal law.
    key_data:
      - label: "Interval since the previous Japanese prime ministerial visit to Cambodia"
        value: "43 years (since Prime Minister Nobusuke Kishi in November 1957)"
