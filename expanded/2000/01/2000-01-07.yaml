  - id: "evt-2000-01-07-004"
    category: "International relations"
    subcategory: ""
    topics:
      - "United States"
      - "Israel"
    importance: 8
    headline: "Israeli and Syrian delegations debate U.S. working paper at Shepherdstown as Damascus demands priority on 1967 Golan border"
    summary: >
      On January 7, 2000—the fifth day of the Shepherdstown peace summit—Israeli Prime
      Minister Ehud Barak and Syrian Foreign Minister Farouk al-Sharaa reviewed the
      seven-page U.S. draft working paper with Secretary of State Madeleine Albright, as
      Syrian negotiators objected that the document addressed Israeli security and
      normalization requests in greater detail than Syria's core demand for a binding
      Israeli commitment to withdraw to the June 4, 1967 border.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000107`, Golan Heights / Syria / Israel)"
        value: "91 combined mentions across 40 articles"
        citation_refs: [5]
      - label: "Casualties"
        value: "None"
        citation_refs: [5]
    details:
      what_happened:
        - "Following President Clinton's presentation of the seven-page American bridging text on January 6, Israeli and Syrian working groups and delegation heads met with U.S. Secretary of State Madeleine Albright and Middle East Envoy Dennis Ross in Shepherdstown on Friday, January 7, 2000 before pausing for the Jewish Sabbath."
        - "Syrian delegates led by Foreign Minister Farouk al-Sharaa pressed U.S. mediators to obtain an explicit commitment from Prime Minister Ehud Barak to the June 4, 1967 boundary line along the Sea of Galilee before Syria would engage fully in the normal-relations committee, while Barak insisted on knowing the full scope of peace, embassy exchange, and Lebanese border security first."
      why_it_matters:
        - "The January 7 debates over the U.S. working paper highlighted the structural chicken-and-egg dilemma—territory first versus security and normalization package first—that prevented a breakthrough before the Shepherdstown round adjourned on January 10."
        - "None."
      uncertainty_notes: []
