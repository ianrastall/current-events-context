        citation_refs: [12]
    details:
      what_happened:
        - "Four days after Bonn public prosecutors opened a formal criminal investigation (Ermittlungsverfahren) against former Chancellor Helmut Kohl on suspicion of breach of trust (Untreue), auditors from the firm Ernst & Young examining the CDU's finances uncovered additional discrepancies worth millions of Deutsche Marks in federal and Hesse state CDU accounts on January 6–7, 2000."
        - "Senior CDU leaders including party chairman Wolfgang Schäuble and general secretary Angela Merkel pressed Kohl on January 7 to disclose the identities of the anonymous donors, while Kohl reiterated on German television that he had given his word of honor (Ehrenwort) never to reveal their names."
      why_it_matters:
        - "The widening financial audit findings in early January 2000 led within days toWolfgang Schäuble's admission on January 10 that he had personally accepted a 100,000-mark cash donation from arms lobbyist Karlheinz Schreiber, triggering Kohl's resignation as CDU honorary chairman on January 18 and Schäuble's resignation as party leader in February 2000."
