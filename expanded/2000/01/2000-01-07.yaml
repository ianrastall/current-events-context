  - id: "evt-2000-01-07-002"
    category: "Politics and elections"
    subcategory: ""
    topics:
      - "Indonesia"
    importance: 8
    headline: "Over 100,000 Indonesian Muslims rally at Jakarta's National Monument demanding jihad over Maluku sectarian bloodshed"
    summary: >
      On January 7, 2000—the final Friday of Ramadan (Jumat terakhir Ramadan)—more than
      100,000 Indonesian Muslims gathered at the National Monument (Monas) in central
      Jakarta for the "Million Ummah" rally (Tabligh Akbar Sejuta Ummat), where People's
      Consultative Assembly (`MPR`) Speaker Amien Rais and leading Islamic politicians gave
      President Abdurrahman Wahid's government an ultimatum to end the killing of Muslims in
      the Maluku islands or face a nationwide call for jihad (holy war).
    key_data:
      - label: "Estimated crowd at the January 7 Monas rally in Jakarta"
        value: "~100,000 demonstrators"
        citation_refs: [3]
      - label: "GDELT 1.0 CAMEO cluster (`20000107`, Christian <-> Muslim in Jakarta)"
        value: "58 combined mentions across 44 articles"
        citation_refs: [3]
      - label: "Casualties"
        value: "None at the Jakarta rally (hundreds killed in North Maluku the preceding week)"
        citation_refs: [3]
    details:
      what_happened:
        - "Outraged by reports that Christian militias had killed hundreds of Muslims in Tobelo and Galela on Halmahera Island in late December 1999, roughly 100,000 white-robed Muslim demonstrators converged on Merdeka Square (Monas) in Jakarta after Friday prayers on January 7, 2000."
        - "Addressing the crowd from the podium, `MPR` Speaker Amien Rais, Crescent Star Party (`PBB`) leader Yusril Ihza Mahendra, United Development Party (`PPP`) chairman Hamzah Haz, and cleric Ja'far Umar Thalib accused President Abdurrahman Wahid and Vice President Megawati Sukarnoputri of negligence and gave the government two to four weeks to restore order in Maluku before volunteers would be dispatched for jihad."
      why_it_matters:
        - "The January 7 Monas rally was the founding catalyst for the paramilitary organization Laskar Jihad led by Ja'far Umar Thalib, which subsequently trained and shipped thousands of armed fighters from Java to Ambon in the spring of 2000, dramatically escalating the Maluku conflict and destabilizing Wahid's presidency."
        - "Organizers claimed up to several hundred thousand participants at Merdeka Square, while Jakarta police and foreign correspondents estimated the crowd at around 100,000."
      uncertainty_notes: []
