  - id: "evt-2000-01-03-003"
    category: "Business and economy"
    subcategory: ""
    topics:
      - "Hong Kong"
      - "United States"
    importance: 8
    headline: "Global financial markets pass their first full post-Y2K trading day without computer disruptions, sending the Hang Seng, DAX, and Nasdaq to record highs"
    summary: >
      On Monday, January 3, 2000, the world's major stock, bond, foreign-exchange, and
      commodities markets reopened for the first business day of the year 2000 without any
      significant Year 2000 (Y2K) software failures across clearinghouses, payment networks,
      or brokerage platforms. Relief over the smooth technological rollover sparked early
      surges across Asian and European bourses—pushing Hong Kong's Hang Seng Index past
      17,000 for the first time and lifting Germany's DAX and France's CAC 40 to intraday
      records—while the technology-heavy Nasdaq Composite closed at a new all-time high of
      4,131.15 even as rising U.S. bond yields pulled the Dow Jones Industrial Average down
      139.61 points.
    key_data:
      - label: "Nasdaq Composite closing level on January 3, 2000"
        value: "4,131.15 (+61.84 points / +1.52%)"
        citation_refs: [5]
      - label: "Hong Kong Hang Seng Index closing level"
        value: "17,369.63 (+407.53 points / +2.4%)"
        citation_refs: [5]
      - label: "Dow Jones Industrial Average closing level"
        value: "11,357.51 (-139.61 points / -1.21%)"
        citation_refs: [5]
      - label: "Casualties"
        value: "None"
        citation_refs: [5]
    details:
      what_happened:
        - "Financial regulators and central banks—led by the Bank for International Settlements (BIS), the European Central Bank (ECB), and the U.S. Federal Reserve—monitored the Monday, January 3, 2000 reopening of global settlement systems (including SWIFT, Fedwire, TARGET, and CHIPS) and reported zero Y2K-related disruptions to trading or interbank clearing."
        - "In Asia, where Sydney, Hong Kong, Singapore, and Seoul opened first, investors poured unlocked Y2K cash reserves into equities, driving Hong Kong's Hang Seng Index up 2.4% to a record 17,369.63 and Singapore's Straits Times Index to an all-time high."
        - "European markets rallied strongly at the open, with Frankfurt's Xetra DAX surging above 7,100 intraday before closing at 6,750.76 and Paris's CAC 40 touching a record above 6,000, while in New York the Nasdaq Composite climbed 61.84 points (+1.52%) to close at a record 4,131.15 as higher Treasury yields pulled the Dow Jones Industrial Average down 139.61 points."
      why_it_matters:
        - "Because January 1 and 2 fell on a weekend, Monday, January 3 was the true operational test of whether batch-processing software in banking, derivatives clearing, and securities settlement would fail on the first business date of 2000; its smooth completion effectively closed the global Y2K crisis."
        - "The divergence on January 3 between surging technology valuations on the Nasdaq and rising long-term Treasury bond yields foreshadowed the monetary tightening cycle that would peak with the dot-com market top in March 2000."
        - "A handful of major financial centers (including Tokyo and London) observed a public bank holiday on Monday, January 3, 2000, shifting their first full domestic equity trading session to Tuesday, January 4."
      uncertainty_notes: []
