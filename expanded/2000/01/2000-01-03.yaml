    importance: 7
    headline: "Pro-Chechen Palestinian gunman fires rocket-propelled grenades at the Russian Embassy in Beirut, killing a Lebanese policeman before being shot dead"
    summary: >
      On the afternoon of January 3, 2000, a Palestinian gunman identified as Ahmad Abu
      Kharroub fired four rocket-propelled grenades (RPGs) and automatic rifle rounds at the
      heavily guarded Russian Embassy compound in Beirut's Corniche el-Mazraa district to
      protest Russia's military campaign in Chechnya. A 30-minute firefight with Lebanese
      Internal Security Forces left one Lebanese policeman and the attacker dead and wounded
      seven people, occurring on the same day the Lebanese Army completed clearing
      operations against Sunni Islamist insurgents in the northern Dinniyeh mountains.
    key_data:
      - label: "Rocket-propelled grenades fired at Russian Embassy"
        value: "4 RPGs"
        citation_refs: [10]
      - label: "Casualties"
        value: "2 killed (1 Lebanese policeman, 1 attacker), 7 injured"
        citation_refs: [10]
    details:
      what_happened:
        - "Around 14:30 local time on Monday, January 3, 2000, a gunman armed with an RPG-7 launcher, hand grenades, and a Kalashnikov assault rifle approached the security perimeter of the Russian Embassy on Corniche el-Mazraa in central Beirut and fired four rocket-propelled grenades toward the embassy complex."
        - "Lebanese Internal Security Forces and army troops guarding the embassy engaged the gunman in a 30-minute street battle; one Lebanese police officer was killed and seven people were wounded before troops shot the gunman dead."
        - "Lebanese authorities identified the dead attacker as Ahmad Abu Kharroub, a resident of the Ein el-Hilweh Palestinian refugee camp near Sidon, who carried a handwritten note stating that he was martyring himself in solidarity with Muslims in Chechnya; meanwhile, in northern Lebanon, the Lebanese Army completed mopping-up operations in the snowbound Dinniyeh mountains."
      why_it_matters:
        - "Coming directly on the heels of the December 31–January 2 Dinniyeh insurgency in northern Lebanon, the RPG attack on the Russian Embassy in Beirut underscored how Russia's war in Chechnya was mobilizing transnational Sunni jihadist networks across the Levant."
        - "Initial reports suggested two gunmen may have participated in the Beirut embassy attack after police detained a suspect nearby, though subsequent Lebanese military prosecutor findings concluded Abu Kharroub acted as the primary shooter."
      uncertainty_notes: []
