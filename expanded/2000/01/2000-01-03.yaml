  - id: "evt-2000-01-03-011"
    category: "2000 in Australia"
    subcategory: ""
    topics:
      - "United Kingdom"
      - "Australia"
    importance: 6
    headline: "UK Home Secretary Jack Straw orders deportation of suspected Nazi war criminal Konrad Kalejs as Australian Justice Minister Amanda Vanstone sparks controversy"
    summary: >
      On January 3, 2000, British Home Secretary Jack Straw announced that he had signed
      notice of intention to deport 86-year-old Konrad Kalejs—an Australian citizen and
      former company commander in the Nazi-sponsored Latvian Arajs Kommando auxiliary police
      unit found living at a retirement home in Leicestershire—on the grounds that his
      presence in the United Kingdom was not conducive to the public good. In Australia,
      Federal Justice Minister Senator Amanda Vanstone provoked domestic and international
      controversy on January 3 when asked whether Kalejs would be welcome back in Australia,
      replying: "Would you expect a situation where any Australian citizen would not be?"
    key_data:
      - label: "Age of suspected war criminal Konrad Kalejs"
        value: "86 years old"
        citation_refs: [13]
      - label: "Prior countries that deported Kalejs"
        value: "United States (1994) and Canada (1997)"
        citation_refs: [13]
      - label: "Casualties"
        value: "None"
        citation_refs: [13]
    details:
      what_happened:
        - "Following the discovery by Nazi-hunters at the Simon Wiesenthal Center in late December 1999 that 86-year-old Konrad Kalejs was living at Catthorpe Manor, a Latvian-run retirement home near Lutterworth, Leicestershire, Leicestershire Police and Scotland Yard's War Crimes Unit informed Home Secretary Jack Straw on January 3, 2000 that there was insufficient immediately admissible evidence in Britain to arrest and charge Kalejs under the UK War Crimes Act 1991."
        - "Straw immediately signed an immigration notice on January 3 initiating Kalejs's deportation from the United Kingdom as an undesirable alien—echoing Kalejs's earlier deportations from the United States in 1994 and Canada in 1997 over his service as an officer in the Latvian Arajs Kommando."
        - "Because Kalejs had acquired Australian citizenship in 1957, Australian Federal Justice Minister Senator Amanda Vanstone was asked on January 3 whether Kalejs would be welcome when he returned to Australia and replied, \"Would you expect a situation where any Australian citizen would not be?\"—drawing sharp condemnation from the Australian Labor Party opposition and Jewish community leaders."
      why_it_matters:
        - "The Kalejs affair exposed gaps in war-crimes prosecution coordination among Britain, Australia, and Latvia, sparking a parliamentary inquiry in London into how a twice-deported war-crimes suspect had entered the UK undetected in 1999."
        - "Kalejs denied personal participation in mass executions and departed Britain voluntarily for Melbourne on January 6, 2000 before the deportation order was enforced; he died in Australia in November 2001 while fighting a Latvian extradition warrant."
