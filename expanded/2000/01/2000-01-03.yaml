    headline: "High Court in Kuala Lumpur resumes the sodomy trial of imprisoned former Malaysian Deputy Prime Minister Anwar Ibrahim"
    summary: >
      On January 3, 2000, the High Court in Kuala Lumpur reconvened for the new year in the
      sodomy trial of deposed Malaysian Deputy Prime Minister Anwar Ibrahim—already serving
      a six-year prison sentence from his April 1999 corruption conviction—amid calls from
      opposition leaders and human rights groups to drop the charges following Prime
      Minister Mahathir Mohamad's November 1999 general election victory.
    key_data:
      - label: "Existing prison sentence served by Anwar Ibrahim"
        value: "6 years (imposed April 1999)"
        citation_refs: [15]
      - label: "GDELT 1.0 CAMEO cluster (`20000103`, Kuala Lumpur)"
        value: "31 mentions across 27 articles"
        citation_refs: [15]
