    importance: 5
    headline: "Magnitude 5.2 earthquake strikes near Union, Surigao del Norte in the southern Philippines, leading seven M4.5+ Western Pacific quakes"
    summary: >
      On January 3, 2000 at 02:38:27 UTC, a moderate intermediate-depth earthquake of
      magnitude 5.2 (`usp0009kqb`, depth 67.9 km) struck 23 km southeast of Union, Surigao
      del Norte (Siargao/Mindanao region), Philippines. According to the USGS ANSS
      Comprehensive Catalog, it was the strongest of seven `M4.5+` earthquakes recorded
      globally on January 3, alongside a magnitude 4.7 tremor off Hualien City, Taiwan
      (`02:20:09 UTC`), two magnitude 4.7 shocks in Indonesia (Tobelo, Halmahera and
      Waingapu, Sumba), a magnitude 4.7 quake off Hachinohe, Japan, and a magnitude 4.6
      tremor near Saiha in Mizoram, India.
    key_data:
      - label: "Philippines earthquake (`usp0009kqb`)"
        value: "M 5.2 at 02:38:27 UTC (9.622°N, 126.197°E, depth 67.9 km)"
        citation_refs: [17]
      - label: "Total global M4.5+ earthquakes on January 3, 2000"
        value: "7 earthquakes (range M 4.5 to M 5.2)"
        citation_refs: [17]
      - label: "Casualties"
        value: "None"
        citation_refs: [17]
    details:
      what_happened:
        - "At 02:38:27 UTC (10:38:27 PST) on January 3, 2000, a magnitude 5.2 (`mb`) earthquake (`usp0009kqb`) occurred along the Philippine Trench at 9.622°N, 126.197°E, approximately 23 km southeast of Union on Siargao Island in Surigao del Norte province, Mindanao, at a focal depth of 67.9 km."
        - "Less than 19 minutes earlier, at 02:20:09 UTC, a magnitude 4.7 earthquake (`usp0009kqa`) struck 135 km south-southeast of Hualien City, Taiwan (22.852°N, 122.142°E, depth 33.0 km), followed later on January 3 by five additional `M4.5–4.7` earthquakes in Indonesia, Japan, Fiji, and northeastern India."
      why_it_matters:
        - "Recording the daily `M4.5+` USGS ComCat baseline provides continuous geophysical tracking along the Philippine, Ryukyu, Sunda, and Japan subduction zones, while confirming that no destructive `M6.0+` earthquake occurred globally on January 3, 2000."
        - "None of the seven moderate earthquakes on January 3, 2000 caused reported fatalities or structural damage on land."
