  - id: "evt-2000-01-03-002"
    category: "International relations"
    subcategory: ""
    topics:
      - "United States"
      - "Israel"
    importance: 9
    headline: "U.S. President Bill Clinton and Secretary of State Madeleine Albright open the Israel–Syria peace summit in Shepherdstown, West Virginia"
    summary: >
      On January 3, 2000, U.S. President Bill Clinton and Secretary of State Madeleine
      Albright opened intensive peace negotiations at the National Conservation Training
      Center in Shepherdstown, West Virginia between Israeli Prime Minister Ehud Barak and
      Syrian Foreign Minister Farouk al-Sharaa. On the opening day, Clinton held extended
      separate bilateral sessions with the Israeli and Syrian delegations to establish four
      joint working committees covering borders, security arrangements, water resources, and
      normal diplomatic relations.
    key_data:
      - label: "Summit opening date in Shepherdstown, West Virginia"
        value: "January 3, 2000"
        citation_refs: [3]
      - label: "Joint negotiating committees planned"
        value: "4 committees (borders, security, water, normalization)"
        citation_refs: [4]
      - label: "Casualties"
        value: "None"
        citation_refs: [3]
    details:
      what_happened:
        - "Following Prime Minister Ehud Barak's departure from Tel Aviv on January 2, Israeli and Syrian delegations arrived at the secluded U.S. Fish and Wildlife Service National Conservation Training Center in Shepherdstown, West Virginia on the morning of Monday, January 3, 2000."
        - "U.S. Secretary of State Madeleine Albright welcomed the delegations and President Bill Clinton helicoptered from the White House to Shepherdstown, holding back-to-back bilateral meetings first with Barak and his advisers and then with Syrian Foreign Minister Farouk al-Sharaa."
        - "Because the separate bilateral discussions on the sequencing of committee work—specifically Syria's insistence that border demarcation along the June 4, 1967 line be addressed first versus Israel's demand for parallel security and normalization talks—ran late into the evening, a planned opening three-way plenary dinner was deferred."
      why_it_matters:
        - "The Shepherdstown summit represented the highest-level substantive negotiations ever held between Israel and Syria, attempting to close the final northern front of the Arab–Israeli conflict prior to Israel's pledged May–July 2000 military withdrawal from southern Lebanon."
        - "Procedural disagreements on Day One over whether territorial withdrawal boundaries or security and normalization commitments took precedence foreshadowed the core deadlock that would dominate the week-long summit."
        - "Strict U.S. State Department media blackouts inside the Shepherdstown compound meant that specific map proposals and committee drafts were not publicly released on January 3; contemporary reporting relied on briefings by White House Press Secretary Joe Lockhart and State Department officials."
