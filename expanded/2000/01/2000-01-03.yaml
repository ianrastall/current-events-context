analytical_overview: >
  Monday, January 3, 2000—the first full business, trading, and diplomatic working day of
  the new millennium—combined major democratic and diplomatic transitions with escalating
  regional insurgencies and a decisive test of the world's financial infrastructure
  following the Year 2000 (Y2K) computer rollover. In Central and Southeastern Europe,
  voters in Croatia went to the polls in a watershed parliamentary election less than a
  month after the death of authoritarian President Franjo Tuđman, delivering a landslide
  victory to the center-left opposition coalition led by Ivica Račan's Social Democratic
  Party (SDP) and Dražen Budiša's Croatian Social Liberal Party (HSLS) and ending a decade
  of nationalist Croatian Democratic Union (HDZ) rule. In Western Europe, state prosecutors
  in Bonn opened a formal criminal investigation for breach of trust (Untreue) against
  former German Chancellor Helmut Kohl over secret, undeclared Christian Democratic Union
  (CDU) bank accounts, deepening the gravest political financing crisis in post-war German
  history. Meanwhile, on the first trading day of 2000 across Asia, Europe, and North
  America, global equity and money markets operated without Y2K computer disruptions,
  driving the Nasdaq Composite, Germany's DAX, France's CAC 40, and Hong Kong's Hang Seng
  Index to record peaks as central banks began withdrawing emergency millennium liquidity
  facilities.

  Across the Middle East, South Asia, the Caucasus, and Southeast Asia, high-stakes
  diplomacy unfolded alongside intense sectarian and insurgent violence. In Shepherdstown,
  West Virginia, U.S. President Bill Clinton and Secretary of State Madeleine Albright
  convened high-level peace talks between Israeli Prime Minister Ehud Barak and Syrian
  Foreign Minister Farouk al-Sharaa aimed at resolving the status of the Golan Heights and
  forging a comprehensive Israel–Syria peace treaty. That same day in Beirut, a lone
  pro-Chechen gunman fired rocket-propelled grenades at the Russian Embassy in the Mazraa
  district—killing a Lebanese policeman and dying in the ensuing shootout—even as the
  Lebanese Army completed its counter-insurgency sweep against Sunni Islamist militants in
  the Dinniyeh mountains. In South Asia, a powerful bomb ripped through a crowded vegetable
  market in Srinagar, Jammu and Kashmir, killing at least 18 people and wounding dozens,
  while Pakistan's military government formally rejected Indian Prime Minister Atal Bihari
  Vajpayee's campaign to have Pakistan designated a "terrorist state" following the Indian
  Airlines Flight 814 hijacking. In Russia's North Caucasus, Chechen fighters mounted
  concerted counterattacks in Grozny, Shali, and Argun that forced Russian federal
  commanders to pause ground advances, while security forces in Egypt's Sohag Governorate
  sealed off the village of Al-Kosheh after two days of anti-Coptic violence left 21 dead,
  and the Indonesian military deployed marine and army reinforcements to North Maluku ("the
  Spice Islands") amid continuing sectarian massacres on Halmahera.

