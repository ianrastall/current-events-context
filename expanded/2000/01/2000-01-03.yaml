    importance: 8
    headline: "Powerful bomb explosion in a crowded vegetable market in Srinagar kills at least 18 people in Indian-administered Jammu and Kashmir"
    summary: >
      On the morning of January 3, 2000, an improvised explosive device exploded inside a
      crowded wholesale vegetable market in the Batamaloo area of Srinagar, the summer
      capital of Indian-administered Jammu and Kashmir. The blast killed between 15 and 18
      people—including four Indian security personnel and at least a dozen civilian vendors
      and shoppers—and injured more than 30 others, while separate cross-border firing and
      clashes along the Line of Control killed four additional people.
    key_data:
