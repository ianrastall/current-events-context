    importance: 6
    headline: "Diplomatic and legal standoff between Washington, Havana, and Miami exiles intensifies over six-year-old Cuban castaway Elián González"
    summary: >
      On January 3, 2000—the first federal working day after New Year's following U.S.
      Immigration and Naturalization Service (INS) officials' December interviews in Cuba
      with Juan Miguel González—lawyers for Elián González's Miami relatives pressed asylum
      claims while the Cuban government staged mass rallies and diplomatic consultations
      demanding the six-year-old boy's immediate return to his father in Cárdenas, Cuba. The
      dispute ranked among the top diplomatic clusters in the GDELT 1.0 archive for January
      3 (`53 mentions` across `16 articles`), directly preceding INS Commissioner Doris
      Meissner's landmark January 5 ruling that only the boy's father could speak for him.
    key_data:
      - label: "Age of Cuban castaway Elián González"
        value: "6 years old (rescued November 25, 1999)"
        citation_refs: [14]
      - label: "GDELT 1.0 CAMEO cluster (`20000103`, Havana)"
        value: "53 mentions across 16 articles"
        citation_refs: [14]
      - label: "Casualties"
        value: "None"
        citation_refs: [14]
    details:
      what_happened:
        - "Following Elián González's rescue off Fort Lauderdale on Thanksgiving Day (November 25, 1999) after the sinking of a small boat that drowned his mother and ten others, INS officials in Washington reconvened on Monday, January 3, 2000 to finalize their legal review of interviews conducted in Havana with the boy's father, Juan Miguel González."
        - "In Havana, President Fidel Castro's government organized continuous public mobilizations and diplomatic exchanges demanding that the Clinton administration return Elián immediately without court delays, while in Miami's Little Havana, great-uncle Lázaro González and Cuban-American attorneys prepared legal filings to block any INS repatriation order."
      why_it_matters:
        - "The Elián González custody battle became one of the defining U.S. domestic and foreign-policy flashpoints of the year 2000, polarizing Miami's Cuban-American electorate during a U.S. presidential election year that would ultimately be decided in Florida by 537 votes."
        - "While media reporting on January 3 anticipated an imminent INS determination, INS Commissioner Doris Meissner formally announced the agency's decision recognizing Juan Miguel González's sole parental authority two days later, on January 5, 2000."
      uncertainty_notes: []
