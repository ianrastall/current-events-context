      - label: "Casualties"
        value: "18–22 killed, 35 injured across Jammu and Kashmir on January 3, 2000"
        citation_refs: [7]
    details:
      what_happened:
        - "Around 09:45 IST on Monday, January 3, 2000, a powerful explosive device planted near a Border Security Force (BSF) bunker at the busy Batamaloo wholesale vegetable market in central Srinagar detonated as morning traders and shoppers gathered."
        - "Police and hospital authorities in Srinagar reported that 15 to 18 people were killed instantly or died of wounds—among them four BSF personnel and civilian market workers—while more than 30 people suffered shrapnel injuries and several market stalls and vehicles were destroyed."
        - "Indian security officials attributed the bombing to separatist militants seeking to escalate violence in the Kashmir Valley immediately after the December 31 release of three militant leaders in the Indian Airlines Flight 814 hostage swap; four more people died in separate militant clashes and artillery exchanges along the Line of Control the same day."
      why_it_matters:
        - "As the deadliest bombing in Srinagar in several months, the Batamaloo market attack underscored warnings by Indian security agencies that the Kandahar hostage concessions would immediately embolden militant groups operating in Jammu and Kashmir."
        - "Initial wire dispatches and Wikipedia's retrospective chronology recorded 15 killed in the market blast and 4 in border skirmishes, while subsequent police tallies rose to 18 dead as critically wounded victims succumbed in Srinagar hospitals."
