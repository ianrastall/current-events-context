    importance: 5
    headline: "Cartoonist Charles M. Schulz's final original daily Peanuts comic strip is published in more than 2,600 newspapers worldwide"
    summary: >
      On Monday, January 3, 2000, newspapers around the world published the final original
      daily (weekday) Peanuts comic strip drawn by 77-year-old American cartoonist Charles
      M. Schulz, who had announced his retirement in December 1999 following a stroke and a
      diagnosis of colon cancer. The strip—featuring Snoopy typing a farewell letter from
      Schulz thanking his readers after nearly 50 years—marked the end of the longest
      continuous daily storytelling run by a single creator in modern newspaper syndication
      history.
    key_data:
      - label: "Newspapers carrying Peanuts worldwide"
        value: "~2,600 newspapers in 75 countries"
        citation_refs: [16]
      - label: "Total Peanuts comic strips drawn by Charles M. Schulz"
        value: "17,897 strips (since October 2, 1950)"
        citation_refs: [16]
      - label: "Casualties"
        value: "None"
        citation_refs: [16]
    details:
      what_happened:
        - "Having drawn every single Peanuts daily and Sunday strip himself without assistants since the strip's debut on October 2, 1950, 77-year-old cartoonist Charles M. Schulz announced on December 14, 1999 that he was retiring following emergency abdominal surgery and a diagnosis of colon cancer."
        - "Because daily comic strips have a shorter production lead time than color Sunday pages, Schulz's final original weekday daily strip appeared in approximately 2,600 newspapers across 75 countries on Monday, January 3, 2000, depicting Snoopy sitting atop his doghouse with a typewriter above a signed farewell note from Schulz."
        - "United Feature Syndicate began running classic Peanuts daily reprints starting January 4, 2000, while five already-completed Sunday strips continued to run through February 13, 2000—the morning after Schulz died at his home in Santa Rosa, California."
      why_it_matters:
        - "Spanning 17,897 strips over nearly half a century and read by an estimated 355 million people in 21 languages, Peanuts helped define twentieth-century American and global popular culture; in accordance with Schulz's wishes, no new artist was ever hired to continue the strip."
        - "None; January 3, 2000 is the exact syndication date of the final daily strip, distinct from the final Sunday strip published on February 13, 2000."
      uncertainty_notes: []
