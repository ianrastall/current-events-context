        value: "None"
        citation_refs: [15]
    details:
      what_happened:
        - "Proceedings resumed in the Kuala Lumpur High Court before Justice Arifin Jaka on Monday, January 3, 2000, where former Deputy Prime Minister and Finance Minister Anwar Ibrahim was tried jointly with his adopted brother Sukma Darmawan Sasmitaat Madja on charges of sodomizing his wife's former driver, Azizan Abu Bakar."
        - "Anwar's defense team challenged inconsistencies in the prosecution's timeline—which had already been amended twice—and demanded that Prime Minister Mahathir Mohamad be subpoenaed to testify in support of Anwar's defense of a high-level political conspiracy."
      why_it_matters:
        - "The resumption of Anwar Ibrahim's trial in January 2000—paired with the subsequent sedition arrests of opposition lawyer Karpal Singh and Harakah editor Zulkifli Sulong the following week—marked a renewed post-election crackdown by Mahathir Mohamad's government against Malaysia's Reformasi opposition."
        - "Justice Arifin Jaka later convicted Anwar in August 2000, a conviction that Malaysia's Federal Court ultimately overturned in September 2004."
