  - id: "evt-2000-01-04-002"
    category: "2000 in the United States"
    subcategory: ""
    topics:
      - "United States"
      - "United Kingdom"
    importance: 9
    headline: "President Bill Clinton renominates Alan Greenspan for a fourth term as Federal Reserve Chairman as the Nasdaq plunges a record 229 points"
    summary: >
      On January 4, 2000, U.S. President Bill Clinton formally nominated Alan Greenspan to
      serve a fourth four-year term as Chairman of the Board of Governors of the Federal
      Reserve System, praising his stewardship of the longest peacetime economic expansion
      in U.S. history. Despite the White House announcement, mounting investor fears that
      the Federal Reserve would aggressively raise interest rates to cool the economy
      triggered a global equity sell-off: the Nasdaq Composite plunged 229.46 points
      (-5.55%) to 3,901.69—its largest one-day point drop on record at the time—while the
      Dow Jones Industrial Average fell 359.58 points (-3.17%) and London's FTSE 100 shed
      3.8% on its first trading day of 2000.
    key_data:
      - label: "Term of Alan Greenspan's renomination as Fed Chairman"
        value: "4th four-year term (appointed originally in August 1987)"
        citation_refs: [3]
      - label: "Nasdaq Composite close on January 4, 2000"
        value: "3,901.69 (-229.46 points / -5.55%, record point drop)"
        citation_refs: [4]
      - label: "Dow Jones Industrial Average close on January 4, 2000"
        value: "10,997.93 (-359.58 points / -3.17%)"
        citation_refs: [4]
      - label: "London FTSE 100 close on January 4, 2000"
        value: "6,665.9 (-264.3 points / -3.8%, record point drop)"
        citation_refs: [4]
      - label: "Casualties"
        value: "None"
        citation_refs: [3]
    details:
      what_happened:
        - "Appearing with Federal Reserve Chairman Alan Greenspan and Treasury Secretary Lawrence Summers in the Oval Office on the morning of Tuesday, January 4, 2000, President Bill Clinton announced that he was reappointing the 73-year-old Greenspan for a fourth four-year term as Fed Chairman ahead of the June 2000 expiration of his third term."
        - "Rather than sparking a relief rally, Greenspan's renomination coincided with intense institutional profit-taking and bond-market anxiety that the Federal Open Market Committee (`FOMC`) would hike interest rates at its February 2000 meeting now that the Y2K computer rollover was safely behind the banking system."
        - "Technology and blue-chip stocks tumbled across Europe and North America: London's FTSE 100 fell 264.3 points (-3.8%) on its first post-holiday trading session, the Dow Jones Industrial Average lost 359.58 points (-3.17%) to close below 11,000 at 10,997.93, and the Nasdaq Composite plummeted 229.46 points (-5.55%) to 3,901.69, its steepest single-day point loss up to that date."
      why_it_matters:
        - "Greenspan's reappointment ensured monetary policy continuity through the 2000 U.S. presidential transition, while the violent January 4 tech-stock sell-off provided the first major warning of the valuation fragility and interest-rate sensitivity that would burst the dot-com bubble two months later."
        - "Greenspan's fourth-term nomination required formal confirmation by the U.S. Senate, which confirmed him overwhelmingly on February 3, 2000."
      uncertainty_notes: []
