  - id: "evt-2000-01-04-007"
    category: "2000"
    subcategory: ""
    topics:
      - "Philippines"
    importance: 6
    headline: "The Philippines executes convicted rapist Alex Bartolome by lethal injection—the country's final execution before abolition of capital punishment"
    summary: >
      On January 4, 2000 at 15:08 PST, the Philippines executed 42-year-old Alex Bartolome
      by lethal injection at New Bilibid Prison in Muntinlupa following his conviction for
      repeatedly raping his teenage daughter. After President Joseph Estrada declined
      last-minute clemency appeals from the Catholic Bishops' Conference of the Philippines
      and human rights groups, Bartolome became the seventh—and ultimately the last—prisoner
      executed in the Philippines before Estrada declared a Jubilee Year moratorium in March
      2000 and Congress abolished the death penalty in June 2006.
    key_data:
      - label: "Age of executed prisoner Alex Bartolome"
        value: "42 years old"
        citation_refs: [9]
      - label: "Total prisoners executed under the 1993 Philippine death penalty law (1999–2000)"
        value: "7 prisoners (Bartolome was the 7th and final execution)"
        citation_refs: [9]
      - label: "Casualties"
        value: "1 executed (Alex Bartolome)"
        citation_refs: [9]
    details:
      what_happened:
        - "On the afternoon of Tuesday, January 4, 2000, prison authorities at the maximum-security New Bilibid Prison in Muntinlupa, south of Manila, administered a lethal injection to 42-year-old construction worker Alex Bartolome, who had been sentenced to death in 1996 for raping his daughter more than 100 times over two years."
        - "President Joseph Estrada announced earlier on January 4 that he would not exercise executive clemency to stay the execution, despite appeals from Cardinal Jaime Sin, the Catholic Bishops' Conference of the Philippines, and European Union diplomats."
      why_it_matters:
        - "Bartolome's execution proved to be a historical landmark in Southeast Asian criminal justice: it was the final legal execution ever carried out in the Philippines prior to President Estrada's March 2000 moratorium and President Gloria Macapagal Arroyo's signing of Republic Act No. 9346 abolishing capital punishment in 2006."
        - "None; prison records confirm Bartolome was pronounced dead at 15:18 local time on January 4, 2000."
