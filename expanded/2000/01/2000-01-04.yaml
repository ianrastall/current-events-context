  - id: "evt-2000-01-04-003"
    category: "International relations"
    subcategory: ""
    topics:
      - "United States"
      - "Israel"
    importance: 8
    headline: "President Bill Clinton hosts three-way meeting with Ehud Barak and Farouk al-Sharaa to break procedural deadlock at the Shepherdstown summit"
    summary: >
      On January 4, 2000—the second day of the Shepherdstown peace summit in West
      Virginia—U.S. President Bill Clinton intervened to resolve a procedural dispute
      between Israeli Prime Minister Ehud Barak and Syrian Foreign Minister Farouk al-Sharaa
      over the order in which border demarcation and security arrangements would be
      negotiated. Clinton hosted a two-hour trilateral meeting with Barak and al-Sharaa,
      securing agreement to convene joint working committees on security and borders
      simultaneously.
    key_data:
      - label: "Duration of trilateral meeting hosted by President Clinton"
        value: "~2 hours on January 4, 2000"
        citation_refs: [5]
      - label: "GDELT 1.0 CAMEO cluster (`20000104`, Damascus / Israel)"
        value: "66 mentions across 26 articles (Goldstein scale `+4.0`)"
        citation_refs: [5]
      - label: "Casualties"
        value: "None"
        citation_refs: [5]
    details:
      what_happened:
        - "After Day One of the Shepherdstown talks ended without the planned plenary dinner or committee launches because Syria demanded that Israel first commit to withdrawing to the June 4, 1967 border line before discussing security and normalization, President Clinton returned to Shepherdstown on Tuesday, January 4, 2000."
        - "Clinton convened a two-hour face-to-face trilateral session around a conference table with Prime Minister Barak, Foreign Minister al-Sharaa, and Secretary of State Madeleine Albright, persuading both sides to begin technical subcommittee sessions on borders and security in parallel."
      why_it_matters:
        - "Clinton's personal mediation prevented an early collapse of the Shepherdstown summit and established the four-committee negotiating structure through which the United States presented its comprehensive working draft later that week."
        - "Neither delegation yielded on its core substantive position during the January 4 procedural compromise."
