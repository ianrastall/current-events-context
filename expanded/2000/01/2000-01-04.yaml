  - id: "evt-2000-01-04-013"
    category: "Politics and elections"
    subcategory: ""
    topics:
      - "Bangladesh"
    importance: 5
    headline: "Bangladeshi opposition alliance stages nationwide general strike (hartal) demanding Prime Minister Sheikh Hasina's resignation"
    summary: >
      On January 4, 2000, a four-party opposition alliance led by former Prime Minister
      Khaleda Zia's Bangladesh Nationalist Party (BNP) enforced a nationwide dawn-to-dusk
      general strike (hartal) across Dhaka and major Bangladeshi cities, shutting down
      schools, businesses, and road transport while demanding that Prime Minister Sheikh
      Hasina step down and call early parliamentary elections under a neutral caretaker
      administration.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000104`, Bangladesh)"
        value: "29 mentions across 29 articles"
        citation_refs: [15]
      - label: "Casualties"
        value: "Scores injured in street clashes between opposition activists, Awami League supporters, and police in Dhaka and Chittagong"
        citation_refs: [15]
    details:
      what_happened:
        - "Opposition activists from the Bangladesh Nationalist Party (BNP), Jamaat-e-Islami, the Jatiya Party, and Islami Oikya Jote detonated homemade firecrackers (cocktails) and clashed with riot police and ruling Awami League supporters in Dhaka and Chittagong on January 4, 2000 during a nationwide general strike."
        - "Opposition leader Khaleda Zia accused Prime Minister Sheikh Hasina's government of corruption, political repression, and compromising Bangladeshi sovereignty in transit agreements with India, while the government deployed thousands of police and paramilitary Bangladesh Rifles personnel to keep ports and government offices open."
      why_it_matters:
        - "The early January 2000 hartal campaign escalated the bitter parliamentary boycott and street confrontation between Sheikh Hasina and Khaleda Zia ahead of US President Bill Clinton's planned March 2000 visit to South Asia."
        - "Injury counts varied between police statements and opposition party spokesmen."
