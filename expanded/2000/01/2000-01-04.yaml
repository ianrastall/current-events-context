  - id: "evt-2000-01-04-014"
    category: "Disasters and accidents"
    subcategory: ""
    topics:
      - "Tonga"
      - "Malawi"
    importance: 5
    headline: "Magnitude 5.4 deep earthquake strikes near Haveluloto, Tonga alongside a shallow magnitude 4.9 earthquake in southern Malawi"
    summary: >
      On January 4, 2000, the USGS ANSS Comprehensive Catalog recorded eight `M4.5+`
      earthquakes worldwide, led by a deep magnitude 5.4 earthquake (`usp0009krx`, depth
      336.4 km) 254 km west-northwest of Haveluloto, Tonga at 09:14:51 UTC and a shallow
      magnitude 4.9 earthquake (`usp0009krj`, depth 10.0 km) along the southern East African
      Rift 49 km southeast of Phalombe, Malawi at 00:25:05 UTC.
    key_data:
      - label: "Tonga deep earthquake (`usp0009krx`)"
        value: "M 5.4 at 09:14:51 UTC (20.415°S, 177.523°W, depth 336.4 km)"
        citation_refs: [16]
      - label: "Malawi East African Rift earthquake (`usp0009krj`)"
        value: "M 4.9 at 00:25:05 UTC (16.050°S, 36.110°E, depth 10.0 km)"
        citation_refs: [17]
      - label: "Total global M4.5+ earthquakes on January 4, 2000"
        value: "8 earthquakes (4 in Papua New Guinea, 1 each in Tonga, Malawi, Loyalty Islands, and Solomon Islands)"
        citation_refs: [16]
      - label: "Casualties"
        value: "None"
        citation_refs: [16]
    details:
      what_happened:
        - "At 00:25:05 UTC on January 4, 2000, a shallow crustal earthquake of magnitude 4.9 (`usp0009krj`, depth 10.0 km) struck the southern Malawi Rift segment near Mount Mulanje, 49 km southeast of Phalombe, Malawi near the Mozambique border, where tremors were felt across southern Malawi and Zambezia Province, Mozambique."
        - "Later at 09:14:51 UTC, a deep-focus magnitude 5.4 earthquake (`usp0009krx`, depth 336.4 km) ruptured within the subducting Pacific slab 254 km west-northwest of Haveluloto, Tonga, accompanied over the course of the day by four `M4.5–4.8` shocks across Papua New Guinea (near Madang, Kimbe, Kavieng, and New Ireland) and `M4.6–4.7` tremors in the Solomon and Loyalty Islands."
      why_it_matters:
        - "The Malawi tremor highlighted active normal-faulting seismicity along the southern branch of the East African Rift System, while the Tonga and Melanesian events reflected sustained Southwest Pacific subduction activity that culminated the following morning in a magnitude 6.1 earthquake in the Santa Cruz Islands."
        - "No structural damage or casualties were reported from either the deep Tonga event or the shallow Malawi tremor."
      uncertainty_notes: []
