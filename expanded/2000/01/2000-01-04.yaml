    importance: 7
    headline: "Indonesian President Abdurrahman Wahid orders naval blockade of Maluku arms shipments as Aceh separatist clashes escalate"
    summary: >
      On January 4, 2000, Indonesian President Abdurrahman Wahid ordered the Indonesian Navy
      to blockade the Maluku islands to stop illegal arms shipments and prevent outside
      provocateurs from entering Ambon and Halmahera, where sectarian massacres since
      December 26 had killed more than 500 people. On the same day in Aceh province at the
      northern tip of Sumatra, Free Aceh Movement (`GAM`) separatist guerrillas ambushed
      Indonesian police and military patrols, wounding several security personnel amid
      escalating pro-independence violence.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000104`, Jakarta / Rebel -> Police)"
