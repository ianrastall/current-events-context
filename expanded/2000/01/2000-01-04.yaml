      - label: "Casualties"
        value: "Multiple police and combatants killed or wounded in Aceh ambushes and ongoing Maluku clashes"
        citation_refs: [12]
    details:
      what_happened:
        - "Facing mounting criticism over the failure to prevent the Tobelo and Galela massacres in North Maluku, President Abdurrahman Wahid ordered Indonesian warships on January 4, 2000 to intercept vessels carrying weapons or militant volunteers to the Maluku archipelago and announced plans to replace regional military and police commanders."
        - "Meanwhile in Aceh province, guerrillas of the separatist Free Aceh Movement (`Gerakan Aceh Merdeka`, GAM) attacked Indonesian police posts and convoys in North and East Aceh on January 4, wounding policemen and soldiers as Jakarta rejected demands for an East Timor-style independence referendum."
      why_it_matters:
        - "Simultaneous crises in Maluku and Aceh at the start of 2000 severely strained Indonesia's post-Suharto democratic transition under President Wahid and tested civilian control over the Indonesian National Armed Forces (`TNI`)."
        - "Despite the naval blockade order announced on January 4, thousands of Laskar Jihad volunteers from Java later succeeded in reaching Ambon in spring 2000."
