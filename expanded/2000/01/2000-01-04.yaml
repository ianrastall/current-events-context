    headline: "ICTY Chief Prosecutor Carla Del Ponte and NATO address Balkan war-crimes investigations as KFOR confronts ethnic violence in Kosovo"
    summary: >
      On January 4, 2000, International Criminal Tribunal for the former Yugoslavia (ICTY)
      Chief Prosecutor Carla Del Ponte and NATO officials addressed ongoing Balkan
      war-crimes investigations—including a preliminary ICTY staff review of complaints
      regarding NATO's 1999 air campaign and continuing SFOR arrests of Bosnian war-crimes
      indictees—while NATO-led KFOR peacekeepers stepped up patrols in Kosovo following
      deadly inter-ethnic attacks around Đakovica (Gjakova) and Kosovska Mitrovica.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000104`, NATO / Bosnia-Herzegovina)"
        value: "52 mentions across 30 articles"
        citation_refs: [11]
      - label: "GDELT 1.0 CAMEO cluster (`20000104`, Tribunal / Carla Del Ponte)"
        value: "45 mentions across 26 articles"
        citation_refs: [11]
      - label: "Casualties"
        value: "Multiple Kosovo Serb and Albanian civilians killed in New Year / early January attacks in Kosovo"
        citation_refs: [11]
    details:
      what_happened:
        - "Following reports that ICTY legal staff had prepared an internal preliminary assessment of complaints submitted by international legal groups and Moscow regarding civilian casualties during NATO's 78-day air campaign against Yugoslavia in 1999, ICTY Chief Prosecutor Carla Del Ponte's office and White House/NATO spokesmen responded on January 4, 2000: Washington criticized any equation of NATO air operations with Serbian ethnic cleansing, while the tribunal emphasized that no formal criminal investigation of NATO had been opened and that its primary focus remained indicted Yugoslav leaders including Slobodan Milošević."
        - "Simultaneously in Kosovo and Bosnia-Herzegovina, NATO's KFOR peacekeepers reinforced checkpoints around Đakovica and Kosovska Mitrovica after grenade and shooting attacks targeted Serb and Roma homes and Albanian returnees during the first days of January 2000."
      why_it_matters:
        - "The controversy highlighted the jurisdictional reach of the Hague tribunal under Carla Del Ponte (who later announced in June 2000 that there was no basis to open a criminal investigation into NATO's bombing campaign) as well as the severe postwar security challenges facing KFOR in Kosovo."
        - "The internal ICTY committee review of the 1999 NATO bombing campaign was a preliminary legal assessment rather than an indictment proceeding."
