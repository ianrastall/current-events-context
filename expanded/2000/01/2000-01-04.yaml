  - id: "evt-2000-01-04-012"
    category: "2000 in the United Kingdom"
    subcategory: ""
    topics:
      - "United Kingdom"
    importance: 5
    headline: "British mountaineers Fiona Thornewill and Catharine Hartley become the first British women to ski to the Geographic South Pole"
    summary: >
      On January 4, 2000, British explorers Fiona Thornewill (age 33) and Catharine Hartley
      (age 34) arrived at the Geographic South Pole after a 56-day, 700-mile (1,125 km)
      overland ski expedition from Hercules Inlet on the Ronne Ice Shelf, becoming the first
      British women to walk/ski to the South Pole.
    key_data:
      - label: "Distance skied from Hercules Inlet to the South Pole"
        value: "~700 miles (1,125 km) in 56 days"
        citation_refs: [14]
      - label: "Weight of sledges hauled by the expedition members"
        value: "~200 lb (90 kg) each"
        citation_refs: [14]
      - label: "Casualties"
        value: "None"
        citation_refs: [14]
    details:
      what_happened:
        - "Setting out from Hercules Inlet on the Antarctic coast in November 1999 as part of a five-person British polar team (and joined on the ice by another British expedition after severe weather delayed their drop-off flight), Nottinghamshire IT consultant Fiona Thornewill and London production manager Catharine Hartley hauled 200-lb sledges across crevasse fields and sastrugi in temperatures dropping below -40°C."
        - "On Tuesday, January 4, 2000, Thornewill and Hartley reached the Amundsen–Scott South Pole Station after 56 days on the ice, becoming the first British women to complete the overland journey to the South Pole."
      why_it_matters:
        - "Their expedition set a milestone in British polar exploration and launched Thornewill's subsequent solo unsupported speed-record trek to the South Pole in 2003–2004."
        - "Because a support plane drop-off had been delayed by blizzards in November 1999, the team received an air-dropped resupply en route rather than an \"unsupported\" designation, while still completing the full 700-mile overland ski trek from Hercules Inlet."
