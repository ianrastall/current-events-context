  - id: "evt-2000-01-04-004"
    category: "International relations"
    subcategory: ""
    topics:
      - "Israel"
      - "Palestine"
    importance: 8
    headline: "Israel and the Palestinian Authority sign agreement in Jerusalem to implement delayed 5% West Bank land transfer"
    summary: >
      On January 4, 2000, chief Israeli negotiator Oded Eran and Palestinian negotiator Saeb
      Erekat signed an agreement in Jerusalem finalizing maps for the transfer of an
      additional 5% of West Bank territory to Palestinian control under the September 1999
      Sharm el-Sheikh Memorandum. The handover—originally scheduled for November 15, 1999
      but delayed for seven weeks by Palestinian objections over which villages and areas
      were included—transferred 3% of West Bank land from Israeli civil/security control to
      joint Area B control and 2% from Area B to full Palestinian Area A control.
    key_data:
      - label: "Total West Bank territory transferred in accord"
        value: "5% (3% to Area B civil control; 2% to Area A full control)"
        citation_refs: [6]
      - label: "Cumulative West Bank land under full or partial PA control"
        value: "~40% of the West Bank"
        citation_refs: [6]
      - label: "GDELT 1.0 CAMEO cluster (`20000104`, Jerusalem -> West Bank)"
        value: "66 mentions across 28 articles (Goldstein scale `+10.0`)"
        citation_refs: [6]
      - label: "Casualties"
        value: "None"
        citation_refs: [6]
    details:
      what_happened:
        - "Following weeks of deadlock since the missed November 15, 1999 deadline under the Sharm el-Sheikh accord, Palestinian President Yasser Arafat and Israeli Prime Minister Ehud Barak approved revised deployment maps that included clusters of villages around Hebron, Ramallah, Jenin, and Nablus."
        - "On Tuesday, January 4, 2000, Israeli ambassador Oded Eran and Palestinian chief negotiator Saeb Erekat signed the handover protocol in Jerusalem, scheduling Israeli Cabinet ratification and IDF troop withdrawals for January 5–6."
      why_it_matters:
        - "Resolving the overdue November 1999 land transfer cleared the way for the third scheduled redeployment (an additional 6.1% due later in January 2000) and reassured Palestinian leaders that Israel's parallel peace talks with Syria at Shepherdstown would not freeze the Palestinian track."
        - "Follow-on negotiations over the February 2000 framework agreement deadline and the selection of land for the subsequent 6.1% transfer remained unresolved."
      uncertainty_notes: []
