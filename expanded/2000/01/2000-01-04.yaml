  - id: "evt-2000-01-04-015"
    category: "2000 in Germany"
    subcategory: ""
    topics:
      - "Germany"
      - "Greece"
    importance: 4
    headline: "German actor and comedian Diether Krebs dies in Hamburg at age 52 alongside former Greek Prime Minister Spyros Markezinis in Athens at age 90"
    summary: >
      On January 4, 2000, acclaimed German actor, cabaret artist, and comedian Diether
      Krebs—renowned for his roles in the satirical sitcom Ein Herz und eine Seele (A Heart
      and a Soul) and the sketch comedy series Sketchup—died of lung cancer in Hamburg at
      age 52. On the same day in Athens, former Greek Prime Minister and economic reformer
      Spyros Markezinis, who orchestrated the landmark 1953 devaluation of the Greek drachma
      and briefly served as Prime Minister during the 1973–1974 military junta's abortive
      liberalization experiment, died at age 90.
    key_data:
      - label: "Age of German actor Diether Krebs at death"
        value: "52 years old (born August 11, 1947 in Essen)"
        citation_refs: [18]
      - label: "Age of former Greek Prime Minister Spyros Markezinis at death"
        value: "90 years old (born April 22, 1909 in Athens)"
        citation_refs: [19]
      - label: "Casualties"
        value: "2 deaths (natural causes)"
        citation_refs: [18]
    details:
      what_happened:
        - "Diether Krebs died late on January 4, 2000 at the University Medical Center Hamburg-Eppendorf (`UKE`) at age 52 from lung cancer; across three decades on German television and film, Krebs became a household figure through his portrayal of the rebellious son-in-law Michael \"Micha\" Graf in Wolfgang Menge's 1970s social satire Ein Herz und eine Seele, his ARD sketch show Sketchup alongside Beatrice Richter and Iris Berben, and his Ruhr-region detective series SOKO 5113."
        - "Also on January 4, 2000, Greek politician and historian Spyros Markezinis died in Athens at age 90; as Minister of Coordination in Marshal Alexandros Papagos's government in April 1953, Markezinis engineered the 50% devaluation of the drachma that launched Greece's postwar economic miracle, and in October–November 1973 he served for 48 days as civilian Prime Minister under dictator Georgios Papadopoulos until the Athens Polytechnic uprising and Brigadier Dimitrios Ioannidis's hardline coup."
      why_it_matters:
        - "Krebs's death prompted tributes across German public broadcasting (`ARD` and `WDR`) as one of post-war Germany's most versatile comic and dramatic actors, while Markezinis's passing marked the loss of one of the last senior architects of post-World War II Greek economic policy."
        - "Krebs's death in Hamburg late on the evening of January 4, 2000 was formally announced by his family and management on January 5, 2000."
      uncertainty_notes: []
