    importance: 6
    headline: "Spanish opposition parties and human rights lawyers press Madrid to challenge any British medical release of Augusto Pinochet"
    summary: >
      On January 9, 2000, four days after British medical specialists examined former
      Chilean dictator General Augusto Pinochet in London, Spanish opposition politicians,
      human rights lawyers, and associations of Chilean torture victims demanded that Prime
      Minister José María Aznar's government instruct British authorities to allow Spanish
      doctors to examine Pinochet and to appeal if UK Home Secretary Jack Straw halted his
      extradition to Spain on health grounds.
    key_data:
      - label: "Days Augusto Pinochet had spent under UK house arrest as of Jan 9, 2000"
        value: "450 days (arrested in London on October 16, 1998)"
        citation_refs: [12]
      - label: "GDELT 1.0 CAMEO cluster (`20000109`, British -> Spain)"
        value: "23 mentions across 23 articles"
        citation_refs: [12]
      - label: "Casualties"
        value: "None"
        citation_refs: [12]
    details:
      what_happened:
        - "Amid British weekend press reports that the four-member medical panel appointed by Home Secretary Jack Straw had found 84-year-old General Augusto Pinochet mentally unfit to stand trial following his January 5 hospital examination, Spanish Socialist (`PSOE`) and United Left (`IU`) leaders alongside attorneys representing victims before Judge Baltasar Garzón's court demanded on Sunday, January 9, 2000 that Foreign Minister Abel Matutes defend Spain's extradition request."
        - "Matutes reiterated that the conservative Spanish government would respect the decisions of the British government and courts and would not file a political appeal against Straw's discretionary authority if Straw terminated the extradition process on humanitarian grounds."
      why_it_matters:
        - "Two days later, on January 11, 2000, Home Secretary Jack Straw formally announced that the medical panel had unanimously found Pinochet unfit to stand trial and that he was \"minded\" to halt extradition to Spain—a decision that triggered High Court challenges by Belgium and Amnesty International before Pinochet was freed in March 2000."
        - "None."
