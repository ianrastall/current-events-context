    headline: "Prolific Scottish historical novelist and patriot Nigel Tranter dies in Gullane, East Lothian at age 90"
    summary: >
      On January 9, 2000, Scottish author and historian Nigel Tranter—whose more than 130
      historical novels, children's books, and five-volume architectural survey The
      Fortified House in Scotland popularized centuries of Scottish history from Kenneth
      MacAlpin and Macbeth to William Wallace and Robert the Bruce—died at his home in
      Gullane, East Lothian at the age of 90.
    key_data:
      - label: "Age of Nigel Tranter at death"
        value: "90 years old (born November 23, 1909 in Glasgow)"
        citation_refs: [18]
      - label: "Total books published over a 65-year career"
        value: "Over 130 books (~30 million copies sold worldwide)"
        citation_refs: [18]
      - label: "Architectural buildings sketched in The Fortified House in Scotland (1962–1970)"
        value: "663 Scottish castles, peel towers, and fortified manor houses"
        citation_refs: [18]
      - label: "Casualties"
        value: "1 death (natural causes)"
        citation_refs: [18]
    details:
      what_happened:
        - "Born in Glasgow on November 23, 1909 and raised in Edinburgh, Nigel Godwin Tranter began writing while working in his uncle's insurance office and serving as a Royal Artillery officer during World War II, typing most of his more than 130 books on an old portable typewriter during daily walks along the Firth of Forth at Aberlady Bay."
        - "His landmark Robert the Bruce trilogy (The Steps to the Empty Throne, The Path of the Hero King, and The Price of the King's Peace, 1969–1971) and The Wallace (1975), together with his five-volume illustrated survey The Fortified House in Scotland (1962–1970) and his 1950–51 campaign over the Christmas Day theft of the Stone of Destiny from Westminster Abbey, made him a household name in Scotland; he died at Quarry House in Gullane, East Lothian on Sunday, January 9, 2000 at age 90."
      why_it_matters:
        - "Credited by Scottish First Minister Donald Dewar and historians across the political spectrum with keeping Scottish historical consciousness alive throughout the late 20th century, Tranter lived just long enough to witness the reconvening of the devolved Scottish Parliament in Edinburgh in May 1999."
        - "None."
