    importance: 7
    headline: "Turkish coalition leaders prepare crucial Ankara summit as the European Union urges a stay of execution for PKK leader Abdullah Öcalan"
    summary: >
      On January 9, 2000, Turkish Prime Minister Bülent Ecevit and European diplomats
      engaged in intensive consultations ahead of a decisive January 12 coalition summit
      with far-right Nationalist Movement Party (`MHP`) leader Devlet Bahçeli and Motherland
      Party (`ANAP`) leader Mesut Yılmaz on whether to forward Kurdistan Workers' Party
      (`PKK`) leader Abdullah Öcalan's death sentence to the Turkish Grand National Assembly
      or comply with the European Court of Human Rights (`ECHR`) interim request to stay the
      execution.
    key_data:
      - label: "Date of ECHR Rule 39 interim measure requesting stay of Öcalan's execution"
        value: "November 30, 1999"
        citation_refs: [10]
      - label: "GDELT 1.0 CAMEO cluster (`20000109`, European -> Turkey in Istanbul)"
        value: "23 mentions across 23 articles"
        citation_refs: [10]
      - label: "Casualties"
        value: "None"
        citation_refs: [10]
    details:
      what_happened:
        - "After Turkey's Court of Cassation (Yargıtay) upheld PKK founder Abdullah Öcalan'sJune 1999 treason death sentence in November 1999, the European Court of Human Rights (`ECHR`) in Strasbourg issued an interim measure on November 30 requesting that Ankara suspend execution until the court completed its review, and the European Union made human-rights compliance a core condition when granting Turkey official EU candidate status at the Helsinki Summit in December 1999."
        - "On Sunday, January 9, 2000, Prime Minister Bülent Ecevit warned that executing Öcalan while the `ECHR` review was pending would derail Turkey's newly won EU candidacy and reignite the 15-year Kurdish insurgency (which had largely subsided since Öcalan called a ceasefire from İmralı Island prison in August 1999), while nationalist coalition partner Devlet Bahçeli (`MHP`) faced grassroots pressure not to abandon his campaign pledge to hang Öcalan."
      why_it_matters:
        - "The consultations culminated three days later on January 12, 2000 when Ecevit, Bahçeli, and Yılmaz signed a historic coalition accord shelving Öcalan's execution file until the `ECHR` ruled—paving the way for Turkey's complete abolition of peacetime capital punishment in August 2002."
        - "None."
