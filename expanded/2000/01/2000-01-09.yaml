analytical_overview: >
  On Sunday, January 9, 2000, a lopsided presidential election in Uzbekistan, a fierce
  Russian military retaliation and border lockdown in Chechnya following the Argun–Shali
  rebel counteroffensive, and a massive Tel Aviv demonstration against relinquishing the
  Golan Heights converged with U.S. Pentagon disclosures on the Iraqi no-fly zone and a
  strong magnitude 6.5 earthquake in the Fiji region. In Uzbekistan, incumbent President
  Islam Karimov won a further five-year term with 91.9% of the vote in an election dismissed
  by the Organization for Security and Co-operation in Europe (`OSCE`) as lacking genuine
  competition after his sole nominal opponent, Abdulhafiz Jalolov, told reporters at the
  ballot box that he had cast his own vote for Karimov. In the North Caucasus, Russian
  commanders ended their Orthodox Christmas bombing pause, unleashed heavy airstrikes and
  tactical missile fire against Argun, Shali, and Grozny after acknowledging 26 soldiers
  killed in Chechen raids, and ordered Chechnya's borders sealed to all males between the
  ages of 10 and 60.

  In the Middle East and the United States, an estimated 150,000 Israelis packed Rabin
  Square in Tel Aviv under pouring rain to oppose Prime Minister Ehud Barak's proposed Golan
  Heights withdrawal even as U.S. President Bill Clinton returned to Shepherdstown, West
  Virginia for late-night mediation with Barak and Syrian Foreign Minister Farouk al-Sharaa.
  On the same day, the U.S. Department of Defense reported that Iraqi air-defense batteries
  had fired on coalition aircraft enforcing Operation Southern Watch more than 420 times
  since December 1998. Meanwhile, a magnitude 6.5 earthquake struck the Fiji region
  (`usp0009kz2`), boards of directors at America Online (`AOL`) and Time Warner met secretly
  in New York to approve the largest corporate merger in history, German Catholic bishops
  debated Pope John Paul II's order to withdraw from Germany's state abortion-counseling
  system, the 26th People's Choice Awards honored The Sixth Sense in Pasadena, and British
  aerospace pioneer Sir Arnold Hall and Scottish historical novelist Nigel Tranter died.

