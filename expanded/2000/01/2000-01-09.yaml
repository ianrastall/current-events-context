        citation_refs: [13]
      - label: "Casualties"
        value: "None"
        citation_refs: [13]
    details:
      what_happened:
        - "Nine months after Libya surrendered intelligence agents Abdelbaset al-Megrahi and Lamin Khalifah Fhimah for trial under Scots law at Camp Zeist in the Netherlands—leading the UN Security Council to suspend its seven-year air and arms embargo against Libya—and weeks after British Foreign Secretary Robin Cook re-established full diplomatic ties and appointed the first British Ambassador to Tripoli in 15 years (Richard Dalton), foreign diplomatic and trade delegations held talks in Tripoli on January 9, 2000."
        - "Discussions in Tripoli focused on resuming scheduled European commercial flights, upgrading Libyan oil and gas infrastructure, and advancing Libyan leader Muammar Gaddafi's proposal for an African Union ahead of the March 2000 Europe–Africa summit."
      why_it_matters:
        - "The early 2000 diplomatic traffic in Tripoli marked the first phase of Libya's reintegration into European diplomatic and energy markets, even as the United States maintained unilateral bilateral sanctions pending a Lockerbie compensation settlement."
