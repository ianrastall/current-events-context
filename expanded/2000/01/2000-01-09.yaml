    details:
      what_happened:
        - "Less than 30 hours after the `M7.2` intermediate-depth earthquake in neighboring Tonga on January 8, a strong shallow magnitude 6.5 earthquake (`usp0009kz2`, depth 33.0 km) ruptured a transform fault in the southern North Fiji Basin (`18.823°S, 174.370°E`) at 21:54:40 UTC on Sunday, January 9, 2000."
        - "Earlier on January 9, a magnitude 5.4 subduction earthquake (`usp0009kxw`, depth 56.0 km) struck 50 km east-southeast of Namie off the coast of Fukushima Prefecture, Japan at 04:02:23 UTC, followed at 10:48:30 UTC by a shallow magnitude 5.5 earthquake (`usp0009kyd`, depth 10.0 km) 34 km west-northwest of Abepura near Jayapura in Indonesia's Papua (Irian Jaya) province, and at 19:07:42 UTC by an `M5.1` aftershock (`usp0009kyv`) near Lata in the Solomon Islands."
      why_it_matters:
        - "The January 9 `M6.5` North Fiji Basin event was the fifth `M6.0+` earthquake worldwide in a five-day span (`Jan 5–9, 2000`), underscoring intense strain release along the Melanesian and Tonga–Kermadec plate boundaries."
        - "Because the `M6.5` epicenter lay roughly 350 km west of Viti Levu in the open North Fiji Basin, no damage or tsunami occurred on Fijian islands."
