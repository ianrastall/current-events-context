  - id: "evt-2000-01-09-003"
    category: "International relations"
    subcategory: ""
    topics:
      - "Israel"
      - "United States"
    importance: 8
    headline: "Over 150,000 Israelis rally in Tel Aviv against Golan Heights withdrawal as President Clinton returns to Shepherdstown"
    summary: >
      On the evening of January 9, 2000, an estimated 150,000 to 200,000 Israelis
      demonstrated in pouring rain at Rabin Square in Tel Aviv under the slogan "The People
      Are with the Golan" to oppose Prime Minister Ehud Barak's negotiations to hand the
      Golan Heights back to Syria, even as U.S. President Bill Clinton flew back to
      Shepherdstown, West Virginia for a fifth round of personal mediation with Barak and
      Syrian Foreign Minister Farouk al-Sharaa.
    key_data:
      - label: "Estimated crowd at the January 9 pro-Golan rally in Rabin Square, Tel Aviv"
        value: "150,000–200,000 demonstrators"
        citation_refs: [5]
      - label: "Israeli settlers residing on the Golan Heights in January 2000"
        value: "~17,000 Israelis in 33 settlements (plus ~18,000 Druze residents)"
        citation_refs: [5]
      - label: "GDELT 1.0 CAMEO cluster (`20000109`, Washington / Israel / Syria)"
        value: "211 combined mentions across 150 articles"
        citation_refs: [5]
      - label: "Casualties"
        value: "None"
        citation_refs: [5]
    details:
      what_happened:
        - "Braving cold winter rain on Sunday night, January 9, 2000, between 150,000 and 200,000 Israelis—organized by the Golan Residents Committee and joined by Likud opposition leader Ariel Sharon and two cabinet ministers from Prime Minister Ehud Barak's own governing coalition, Interior Minister Natan Sharansky (Yisrael BaAliyah) and Housing Minister Yitzhak Levy (National Religious Party)—packed Rabin Square in central Tel Aviv to warn Barak against ceding the strategic plateau captured from Syria in the 1967 Six-Day War."
        - "Hours later in West Virginia, President Bill Clinton returned to the Shepherdstown summit site for late-night discussions with Barak and Syrian Foreign Minister Farouk al-Sharaa after the four technical working committees finally convened briefly on Sunday afternoon before preparing to adjourn the first round of talks on January 10."
      why_it_matters:
        - "The massive Tel Aviv turnout demonstrated the formidable domestic opposition Barak faced in both the Knesset and the national referendum he had promised before any Golan withdrawal, stiffening his reluctance to make unilateral territorial pledges at Shepherdstown."
        - "Tel Aviv police estimated the crowd at 120,000–150,000, while rally organizers claimed more than 200,000 attendees."
      uncertainty_notes: []
