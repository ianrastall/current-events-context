  - id: "evt-2000-01-09-002"
    category: "Armed conflicts and attacks"
    subcategory: ""
    topics:
      - "Russia"
    importance: 9
    headline: "Russia resumes full-scale bombardment of Grozny, Argun, and Shali and bars males aged 10 to 60 from crossing Chechnya's borders"
    summary: >
      On January 9, 2000, stung by the surprise Chechen counteroffensive into Argun, Shali,
      and Gudermes that killed at least 26 federal troops in 24 hours, the Russian military
      command terminated its Orthodox Christmas bombing pause, unleashed intense airstrikes,
      artillery barrages, and a tactical ballistic missile strike on Shali, and announced
      that beginning January 11 no male between the ages of 10 and 60 would be allowed to
      enter or leave Chechnya through refugee corridors.
    key_data:
      - label: "Russian military fatalities acknowledged in 24 hours of Jan 8–9 raids"
        value: "26 soldiers and Interior Ministry troops killed (highest 1-day toll acknowledged to date)"
        citation_refs: [3]
      - label: "Age range of Chechen males barred from crossing refugee checkpoints"
        value: "Males aged 10 to 60 years old"
        citation_refs: [3]
      - label: "GDELT 1.0 CAMEO cluster (`20000109`, Staraya Sunzha / Argun / Shali / Alkhan-Kala)"
        value: "187 combined mentions across 118 articles (highest combat cluster on Jan 9)"
        citation_refs: [3]
      - label: "Casualties"
        value: "26+ Russian soldiers and scores of Chechen fighters and civilians killed in Argun, Shali, and Grozny"
        citation_refs: [3]
    details:
      what_happened:
        - "On Sunday, January 9, 2000, North Caucasus Military District commander Colonel General Viktor Kazantsev went on Russian television to blame the heavy federal losses in Argun, Shali, and Gudermes on Russian \"soft-heartedness\" toward Chechen civilians, declaring that henceforth only children under age 10, men over 60, and women would be treated as refugees and that all males aged 10 to 60 attempting to cross checkpoints would be detained and screened in \"filtration camps.\""
        - "Russian forces sealed Argun and Shali with tanks and artillery while a surface-to-surface Tochka-U (`SS-21 Scarab`) tactical ballistic missile struck the central square of Shali during a gathering of fighters and residents, causing heavy casualties."
      why_it_matters:
        - "General Kazantsev's January 9 order treating boys as young as 10 as potential combatants provoked immediate condemnation from the United States, the European Union, and the United Nations High Commissioner for Refugees (`UNHCR`), forcing Moscow to rescind the 10-to-60 age ban days later while escalating the siege of Grozny."
        - "In the GDELT 1.0 historical archive (`20000109`), automated CAMEO geocoding misassigned the Chechen towns of Argun (`38 mentions`) to `Argun, Irkutskaya Oblast', Russia` and Shali (`31 mentions`) to `Shali, Tatarstan, Russia`; contemporary dispatches confirm both battles took place in Argun and Shali in lowland Chechnya southeast of Grozny."
      uncertainty_notes: []
