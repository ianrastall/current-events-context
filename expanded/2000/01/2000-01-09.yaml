    importance: 6
    headline: "South Korean and U.S. military investigators in Seoul review witness accounts in the 1950 No Gun Ri civilian killings inquiry"
    summary: >
      On January 9, 2000, South Korean Defense Ministry officials and U.S. Army
      investigators in Seoul coordinated witness interviews, archival document reviews, and
      on-site ballistic surveys ahead of high-level U.S.–South Korean review panels
      examining the July 1950 killing of South Korean civilian refugees by U.S. 7th Cavalry
      Regiment troops under a railway bridge at No Gun Ri during the opening weeks of the
      Korean War.
    key_data:
      - label: "Date of the historical No Gun Ri bridge killings under investigation"
        value: "July 26–29, 1950 (Yongdong County, North Chungcheong Province)"
        citation_refs: [14]
      - label: "GDELT 1.0 CAMEO cluster (`20000109`, Seoul <-> Army)"
        value: "60 combined mentions across 46 articles"
