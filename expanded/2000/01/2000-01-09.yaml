strategic_conclusion: >
  January 9, 2000 brought sharp escalations across military, political, and corporate
  arenas. In Uzbekistan, President Islam Karimov's 91.9% re-election—complete with his sole
  rival voting for him—epitomized post-Soviet autocratic consolidation; in Chechnya,
  Russia's resumption of heavy bombardment and its order barring males aged 10 to 60 from
  crossing refugee checkpoints drew international condemnation after fierce rebel
  counterattacks in Argun and Shali; in Tel Aviv and Shepherdstown, 150,000 rain-soaked
  demonstrators underscored the political perils of an Israeli–Syrian Golan deal; and in New
  York, the secret Sunday board approval of the AOL–Time Warner merger set the stage for
  Monday morning's historic corporate shockwave.

