  - id: "evt-2000-01-09-004"
    category: "Armed conflicts and attacks"
    subcategory: ""
    topics:
      - "Iraq"
      - "United States"
    importance: 7
    headline: "U.S. Department of Defense reports over 420 Iraqi air-defense attacks and 140 no-fly-zone violations since Operation Desert Fox"
    summary: >
      On January 9, 2000, the United States Department of Defense and U.S. Central Command
      (`CENTCOM`) released a cumulative operational tally showing that since the four-day
      U.S.–British Operation Desert Fox bombing campaign in mid-December 1998, Iraqi
      surface-to-air missile (`SAM`) and anti-aircraft artillery (`AAA`) batteries had fired
      on or illuminated coalition aircraft patrolling the southern no-fly zone under
      Operation Southern Watch more than 420 times, while Iraqi military aircraft had
      violated the southern no-fly zone more than 140 times.
    key_data:
      - label: "Iraqi SAM and AAA attacks/illuminations in southern no-fly zone (Dec 1998 – Jan 9, 2000)"
        value: "Over 420 incidents"
        citation_refs: [7]
      - label: "Iraqi fixed-wing violations of the southern no-fly zone (below 33rd parallel)"
        value: "Over 140 violations since December 1998"
        citation_refs: [7]
      - label: "Coalition aircraft lost to hostile fire in no-fly zones (Dec 1998 – Jan 2000)"
        value: "0 aircraft lost"
        citation_refs: [7]
      - label: "Casualties"
        value: "None on January 9 (dozens of Iraqi air-defense personnel and civilians killed in 1999 strikes)"
        citation_refs: [7]
    details:
      what_happened:
        - "Marking just over one year of continuous low-intensity aerial attrition since Operation Desert Fox (December 16–19, 1998), U.S. military officials reported on January 9, 2000 that Iraqi air-defense forces had challenged U.S. and British patrols enforcing the southern no-fly zone (south of the 33rd parallel under Joint Task Force Southwest Asia / Operation Southern Watch) more than 420 times with surface-to-air missiles, radar lock-ons, and anti-aircraft artillery fire, alongside more than 140 brief intrusions below the 33rd parallel by Iraqi Air Force MiG-25, MiG-23, and Mirage F1 fighters."
        - "In response to those challenges—and parallel engagements above the 36th parallel under Operation Northern Watch out of Incirlik Air Base, Turkey—U.S. and Royal Air Force jets had struck hundreds of Iraqi radar sites, command bunkers, and `SAM` batteries without losing a single coalition aircraft."
      why_it_matters:
        - "The year-long undeclared air campaign between December 1998 and January 2000 representatively degraded Iraq's integrated air-defense network ahead of the 2003 invasion while fueling ongoing debate in the UN Security Council over the legality and humanitarian toll of the no-fly zones."
        - "Baghdad contended that the U.S. and UK no-fly zones lacked explicit authorization in UN Security Council Resolution 688 and reported more than 140 Iraqi military and civilian deaths from coalition airstrikes during 1999."
      uncertainty_notes: []
