    importance: 6
    headline: "Boards of directors of America Online and Time Warner approve $165 billion merger terms in secret Sunday meetings in New York"
    summary: >
      On Sunday, January 9, 2000, the separate boards of directors of internet service
      provider America Online (`AOL`) and media conglomerate Time Warner met in secret
      session in New York City and voted unanimously to approve an all-stock merger
      agreement—signed late that night by AOL Chairman Steve Case and Time Warner Chairman
      Gerald Levin for formal public announcement the next morning, January 10—valuing Time
      Warner at roughly $162 billion to $165 billion in the largest corporate merger in
      history.
    key_data:
      - label: "Stock exchange ratio approved by both boards on January 9, 2000"
        value: "1.5 shares of new AOL Time Warner for each Time Warner share (55% AOL / 45% Time Warner ownership)"
        citation_refs: [19]
      - label: "Equity value of the transaction at announcement"
        value: "~$162–$165 billion (~$350 billion combined market capitalization)"
        citation_refs: [19]
      - label: "Mutual breakup fee agreed in the January 9 merger contract"
        value: "$5.4 billion"
        citation_refs: [19]
      - label: "Casualties"
        value: "None"
        citation_refs: [19]
    details:
      what_happened:
        - "After three months of secret negotiations initiated in October 1999 between America Online Chairman and CEO Steve Case and Time Warner Chairman and CEO Gerald M. Levin—and a final dinner at Case's home in McLean, Virginia on January 6—the boards of directors of both corporations were summoned to confidential Sunday sessions in New York City on January 9, 2000."
        - "Despite the fact that Time Warner generated more than four times AOL's annual revenue ($27 billion versus $5.7 billion), AOL's soaring dot-com stock market capitalization ($163 billion versus Time Warner's $83 billion at Friday's January 7 close) allowed AOL shareholders to claim 55% of the combined company (`AOL Time Warner`), with Steve Case as Chairman and Gerald Levin as CEO; both boards approved the deal unanimously on Sunday evening with the endorsement of Time Warner's largest individual shareholder, Vice Chairman Ted Turner (holding ~9% of Time Warner stock)."
      why_it_matters:
        - "The Sunday night board vote sealed a transaction that stunned global financial and media markets when announced at dawn on Monday, January 10, 2000, standing forever as the high-water mark of the 1990s dot-com bubble."
        - "None."
      uncertainty_notes: []
