    importance: 6
    headline: "Libya expands diplomatic and commercial talks in Tripoli following the suspension of UN Lockerbie sanctions"
    summary: >
      On January 9, 2000, Libyan authorities in Tripoli hosted visiting European and African
      delegations to expand aviation, energy, and diplomatic ties following the suspension
      of United Nations sanctions after the April 1999 handover of the two Libyan suspects
      in the 1988 Pan Am Flight 103 (Lockerbie) bombing and Britain's restoration of full
      diplomatic relations with Tripoli.
    key_data:
      - label: "GDELT 1.0 CAMEO cluster (`20000109`, Tripoli diplomatic visits)"
        value: "62 combined mentions across 38 articles"
        citation_refs: [13]
