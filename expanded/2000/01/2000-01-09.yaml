      - "Uzbekistan"
    importance: 9
    headline: "Uzbek President Islam Karimov wins re-election with 91.9% of the vote as his sole opponent admits voting for Karimov"
    summary: >
      On January 9, 2000, incumbent Uzbek President Islam Karimov—who had ruled Uzbekistan
      since 1989—won a landslide victory with 91.90% of the vote on an official turnout of
      95.10% in Uzbekistan's presidential election, after secular and Islamic opposition
      parties were barred from running and Karimov's sole registered challenger, People's
      Democratic Party philosophy professor Abdulhafiz Jalolov, told journalists upon
      leaving his polling station in Tashkent that he had voted for Karimov.
    key_data:
      - label: "Official vote share for incumbent President Islam Karimov"
        value: "91.90% (11,147,621 votes)"
        citation_refs: [1]
      - label: "Official vote share for challenger Abdulhafiz Jalolov"
        value: "4.17% (505,161 votes)"
        citation_refs: [1]
      - label: "Official voter turnout reported by Uzbek Central Election Commission"
        value: "95.10% of 12.7 million registered voters"
        citation_refs: [1]
      - label: "Wikidata day-precision item (`2000-01-09`)"
        value: "`Q2945302` (2000 Uzbek presidential election, sitelinks=10)"
        citation_refs: [1]
      - label: "Casualties"
        value: "None"
        citation_refs: [1]
    details:
      what_happened:
        - "Polling stations opened across Uzbekistan on Sunday, January 9, 2000 for the second presidential election since independence from the Soviet Union (following a 1995 referendum that had extended Karimov's first term to 2000); the Organization for Security and Co-operation in Europe (`OSCE`) refused to send a full election observation mission after concluding that genuine opposition parties (Erk and Birlik) were banned and state media permitted no debate."
        - "Nominated by the pro-governmentFidokorlar (Self-Sacrificers) National Democratic Party, 61-year-old President Islam Karimov faced only one registered candidate: 52-year-old Marxist philosophy professor Abdulhafiz Jalolov of the People's Democratic Party (`XDP`), who stunned foreign reporters outside his Tashkent polling booth by smiling and announcing that he had cast his own ballot for Karimov \"for stability, peace, and the continuation of reforms.\""
      why_it_matters:
        - "The January 9, 2000 Uzbek presidential election became an international archetype of post-Soviet authoritarian \"facade elections,\" cementing Karimov's autocratic rule in Tashkent—which lasted until his death in September 2016—while driving political opposition underground."
        - "Western diplomatic observers and human rights groups noted widespread proxy voting (one family member casting ballots for an entire household) at Tashkent and regional polling stations."
      uncertainty_notes: []
