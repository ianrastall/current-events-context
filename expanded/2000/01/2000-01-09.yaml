      On the evening of January 9, 2000, the 26th People's Choice Awards were broadcast live
      on CBS from the Pasadena Civic Auditorium in Pasadena, California, with M. Night
      Shyamalan's supernatural thriller The Sixth Sense sweeping Favorite Motion Picture and
      Favorite Dramatic Motion Picture alongside acting honors for Bruce Willis, Harrison
      Ford, and Julia Roberts and television trophies for Friends and ER.
