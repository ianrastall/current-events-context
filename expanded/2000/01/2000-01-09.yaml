      - label: "Casualties"
        value: "None on January 9 (150–300+ South Korean refugees killed in July 1950)"
        citation_refs: [14]
    details:
      what_happened:
        - "Following the September 1999 Associated Press investigative report—which subsequently won the 2000 Pulitzer Prize for Investigative Reporting—revealing that U.S. soldiers of the 2nd Battalion, 7th Cavalry Regiment had machine-gunned South Korean refugees beneath a twin-arch concrete railroad bridge at No Gun Ri in July 1950, U.S. Defense Secretary William Cohen and South Korean President Kim Dae-jung ordered parallel Pentagon and South Korean government investigations."
        - "On January 9, 2000, South Korean military and government investigators in Seoul compiled testimonies from dozens of Korean survivors and U.S. veterans and reviewed declassified U.S. Fifth Air Force and Eighth Army war diaries ahead of joint meetings in Washington and Seoul with U.S. Army Secretary Louis Caldera's review panel."
      why_it_matters:
        - "The year-long joint inquiry culminated in January 2001 when President Bill Clinton issued an official statement of deep regret over the No Gun Ri civilian deaths and the U.S. Army acknowledged that U.S. forces had killed an \"unknown number\" of Korean refugees at No Gun Ri."
        - "U.S. and South Korean investigators continued to debate whether the July 1950 shootings resulted from explicit division-level written orders to fire on approaching refugee columns or from panicked local command decisions amid North Korean infiltration fears."
