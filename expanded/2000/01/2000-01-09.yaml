    importance: 7
    headline: "Magnitude 6.5 shallow earthquake in the Fiji region leads six global M4.5+ earthquakes on January 9"
    summary: >
      On January 9, 2000 at 21:54:40 UTC, a strong magnitude 6.5 shallow earthquake
      (`usp0009kz2`, depth 33.0 km) ruptured the North Fiji Basin west of Viti Levu in the
      Fiji region, leading six `M4.5+` earthquakes recorded globally by the USGS on January
      9 alongside a shallow magnitude 5.5 earthquake near Abepura (Jayapura) in Papua,
      Indonesia (`usp0009kyd`) and a magnitude 5.4 earthquake off Namie, Fukushima
      Prefecture, Japan (`usp0009kxw`).
    key_data:
      - label: "Fiji region strong earthquake (`usp0009kz2`)"
        value: "M 6.5 at 21:54:40 UTC (18.823°S, 174.370°E, depth 33.0 km)"
        citation_refs: [8]
      - label: "Abepura (Jayapura), Papua, Indonesia earthquake (`usp0009kyd`)"
        value: "M 5.5 at 10:48:30 UTC (2.476°S, 140.350°E, depth 10.0 km)"
        citation_refs: [9]
      - label: "Namie (Fukushima), Japan earthquake (`usp0009kxw`)"
        value: "M 5.4 at 04:02:23 UTC (37.280°N, 141.515°E, depth 56.0 km)"
        citation_refs: [8]
      - label: "Total global M4.5+ earthquakes on January 9, 2000"
