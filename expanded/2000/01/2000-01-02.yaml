      - label: "Casualties"
        value: "1 death"
        citation_refs: [10]
    details:
      what_happened:
        - "O'Brian died suddenly on January 2, 2000 in Dublin, Ireland, where he had been staying at the Burlington Hotel while spending the winter writing at Trinity College Dublin following the 1998 death of his wife Mary Tolstoy."
        - "Born Richard Patrick Russ in Buckinghamshire in 1914, he adopted the name Patrick O'Brian after World War II, settled in Collioure in French Catalonia, translated Simone de Beauvoir and Jean Lacouture from French, and achieved towering literary acclaim in the 1990s for his portrayal of Royal Navy Captain Jack Aubrey and Catalan-Irish physician and intelligence agent Stephen Maturin."
      why_it_matters:
        - "Widely compared by critics in Britain and the United States to Jane Austen and C. S. Forester for his command of eighteenth- and early nineteenth-century prose and naval history, O'Brian's work was adapted into the 2003 Academy Award-winning film Master and Commander: The Far Side of the World."
