    headline: "Twin magnitude 5.8 earthquakes strike the Andreanof Islands, Alaska and the Tonga Trench"
    summary: >
      Global seismic networks operated by the United States Geological Survey (`USGS`)
      recorded two magnitude 5.8 subduction-zone earthquakes on January 2, 2000: an M5.8
      earthquake 88 kilometers east-southeast of Adak in the Andreanof Islands of Alaska at
      12:58:42 UTC (`usp0009kng`) and an M5.8 earthquake 95 kilometers east-northeast of
      Kolonga in the Kingdom of Tonga at 15:16:32 UTC (`usp0009knu`). Neither event
      generated a destructive tsunami or reported onshore casualties.
    key_data:
      - label: "Adak, Alaska earthquake (`usp0009kng`)"
        value: "M 5.8 at 12:58:42 UTC (51.45°N, 175.56°W, depth 33.0 km)"
        citation_refs: [13]
      - label: "Kolonga, Tonga earthquake (`usp0009knu`)"
        value: "M 5.8 at 15:16:32 UTC (20.77°S, 174.29°W, depth 33.0 km)"
        citation_refs: [14]
      - label: "Total M4.5+ earthquakes globally on January 2, 2000"
        value: "8 events recorded by USGS ComCat"
        citation_refs: [13]
      - label: "Casualties"
        value: "None"
        citation_refs: [13]
    details:
      what_happened:
        - "At 12:58:42 UTC on January 2, 2000, a magnitude 5.8 thrust earthquake ruptured along the Aleutian megathrust 88 kilometers east-southeast of Adak, Alaska, followed later at 17:25:30 UTC by an M5.2 aftershock (`usp0009knz`) in the same zone."
        - "Just over two hours after the main Alaskan event, at 15:16:32 UTC, a second magnitude 5.8 earthquake struck the northern Tonga Trench 95 kilometers east-northeast of Kolonga, Tonga at a focal depth of 33 kilometers."
      why_it_matters:
        - "The two M5.8 events were the strongest earthquakes globally on January 2, 2000 and confirmed uninterrupted post-Y2K telemetry across the Global Seismographic Network (`GSN`) and Pacific Tsunami Warning Center (`PTWC`)."
        - "Both events were assigned a standard fixed teleseismic focal depth of 33.0 km by USGS PDE analysts."
