    headline: "Oil spill off Phillip Island, Victoria threatens little penguin colony in Australia"
    summary: >
      On January 2, 2000, an offshore fuel oil slick washed ashore along the southern
      coastline of Phillip Island in Victoria, Australia, fouling hundreds of fairy (little)
      penguins (Eudyptula minor) at the Phillip Island Nature Park colony. Wildlife rangers
      and volunteers mounted an emergency rescue and rehabilitation operation to clean oiled
      penguins and prevent toxic bunker fuel from contaminating nesting burrows during the
      summer breeding season.
    key_data:
