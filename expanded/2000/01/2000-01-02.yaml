    headline: "British historical novelist Patrick O'Brian, author of the Aubrey–Maturin naval series, dies in Dublin at age 85"
    summary: >
      English novelist, biographer, and translator Patrick O'Brian (born Richard Patrick
      Russ), celebrated internationally for his twenty-volume Aubrey–Maturin series of
      historical naval novels set during the Napoleonic Wars beginning with Master and
      Commander (`1969`), died in a Dublin hotel on January 2, 2000 at the age of 85.
      O'Brian had been working in Dublin as writer-in-residence at Trinity College Dublin on
      the unfinished twenty-first novel of the series (21).
    key_data:
      - label: "Age at death"
