      - "Haiti"
    importance: 7
    headline: "U.S. Coast Guard repatriates nearly 400 Haitian migrants from Biscayne Bay freighter, sparking protests in Miami"
    summary: >
      On January 2, 2000, the United States Coast Guard and the Immigration and
      Naturalization Service (`INS`) began forcibly repatriating nearly 400 Haitian migrants
      who had been taken off a grounded 60-foot wooden freighter in Biscayne Bay on New
      Year's Day. The rapid summary return aboard Coast Guard cutters triggered protests
      outside Coast Guard Base Miami Beach by Haitian-American activists and civil rights
      advocates, who contrasted the summary repatriation of Haitians with the automatic
      parole granted to Cuban migrants who reached U.S. waters or soil amid the ongoing
      Elián González custody crisis.
    key_data:
      - label: "Haitian migrants transferred to Coast Guard cutters for return to Haiti"
        value: "Approximately 393–400 migrants"
        citation_refs: [6]
      - label: "Non-Haitian passengers detained in Florida for smuggling investigation"
        value: "14 (including Chinese and Dominican nationals)"
        citation_refs: [6]
      - label: "Casualties"
        value: "None"
        citation_refs: [6]
    details:
      what_happened:
        - "After completing medical checks aboard the cutters Dauntless and Valiant, the U.S. Coast Guard began transporting approximately 400 Haitian passengers back to Port-au-Prince on January 2, 2000 without formal asylum hearings unless individuals actively expressed a credible fear of political persecution to Creole-speaking INS screeners."
        - "Dozens of demonstrators gathered at the MacArthur Causeway entrance to Coast Guard Base Miami Beach waving Haitian flags and chanting slogans accusing the Clinton administration of a racially discriminatory double standard between Haitian and Cuban refugees."
      why_it_matters:
        - "Coming at the height of the Elián González dispute in Miami, the January 1–2 Biscayne Bay interdiction galvanized bipartisan congressional support for the Haitian-American community's push for parity in U.S. immigration law alongside the 1998 Haitian Refugee Immigration Fairness Act (`HRIFA`)."
        - "INS officials stated that all passengers were monitored by Creole interpreters aboard the cutters, whereas immigrant-rights attorneys argued that exhausted passengers aboard crowded cutters had no meaningful access to legal counsel."
      uncertainty_notes: []
