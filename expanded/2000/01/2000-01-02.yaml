  - id: "evt-2000-01-02-003"
    category: "Armed conflicts and attacks"
    subcategory: ""
    topics:
      - "Egypt"
    importance: 8
    headline: "Death toll in Al-Kosheh sectarian massacre in Upper Egypt reaches 21 as security forces impose curfew"
    summary: >
      Sectarian violence in Al-Kosheh and neighboring hamlets in Sohag Governorate, Upper
      Egypt escalated into a lethal massacre on Sunday, January 2, 2000 as armed mobs
      attacked Coptic Christian farmers, shopkeepers, and families with automatic rifles,
      clubs, and firebombs. Twenty Coptic Christians and one Muslim were killed and more
      than forty people injured before Egyptian Central Security Forces sealed off the town,
      arrested dozens of suspects, and imposed an indefinite curfew.
    key_data:
      - label: "Confirmed fatalities on January 2, 2000"
        value: "21 killed (20 Coptic Christians and 1 Muslim)"
        citation_refs: [4]
      - label: "Confirmed injuries"
        value: "At least 44 injured"
        citation_refs: [4]
      - label: "Casualties"
        value: "21 killed, 44 injured"
        citation_refs: [4]
    details:
      what_happened:
        - "Following two days of commercial arson and rioting that began after a New Year's Eve dispute in Al-Kosheh, armed assailants moved into agricultural fields and residential quarters in Al-Kosheh and nearby El-Awamer on January 2, shooting Coptic villagers and burning homes and warehouses."
        - "Egyptian Interior Minister Habib el-Adly dispatched armored Central Security Forces reinforcements to Sohag Governorate late on January 2, establishing checkpoints around Al-Kosheh and ordering a strict curfew while Coptic Orthodox Bishop Wissa of Baliana appealed for state protection."
      why_it_matters:
        - "With 21 dead, the January 2, 2000 Al-Kosheh massacre was the deadliest single day of anti-Coptic communal violence in modern Egypt prior to the 2011 Alexandria church bombing, prompting subsequent controversial trials in which most defendants were initially acquitted."
        - "Local Coptic clergy and human rights monitors reported that local police delayed intervening for several hours during the height of the shootings on January 2."
      uncertainty_notes: []
