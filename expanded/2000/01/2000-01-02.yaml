analytical_overview: >
  On January 2, 2000—the second day of the new calendar year—diplomatic, military, and
  communal developments tested governments across the Middle East, the North Caucasus, South
  Asia, and the Caribbean. In Russia's North Caucasus, Chechen fighters mounted stiff
  counterattacks inside Grozny and along the eastern approaches near Argun and Shali just
  twenty-four hours after Acting President Vladimir Putin's visit to Gudermes, taking
  advantage of dense winter fog that grounded Russian close air support. In the Middle East,
  Israeli Prime Minister Ehud Barak departed Jerusalem for Shepherdstown, West Virginia
  ahead of U.S.-mediated peace negotiations with Syrian Foreign Minister Farouk al-Sharaa
  over the Golan Heights, while in northern Lebanon the Lebanese Armed Forces pressed their
  mountain offensive against Sunni Islamist insurgents in Dinniyeh.

  Meanwhile, sectarian attacks in Al-Kosheh, Upper Egypt reached their deadliest phase on
  Sunday, January 2, leaving twenty Coptic Christians and one Muslim dead before Egyptian
  Interior Ministry forces sealed off the village and imposed a curfew. In South Asia,
  Indian Prime Minister Atal Bihari Vajpayee publicly accused Pakistan of orchestrating the
  Indian Airlines Flight 814 hijacking after the hijackers and three freed militants crossed
  from Taliban-controlled Kandahar into Pakistan. In the United States, the Coast Guard
  began repatriating nearly 400 Haitian migrants from the freighter grounded in Biscayne Bay
  on New Year's Day, prompting street protests in Miami over disparate asylum standards,
  while the country mourned retired Admiral Elmo "Bud" Zumwalt Jr., the reformist 19th Chief
  of Naval Operations, and English historical novelist Patrick O'Brian died in Dublin at age
  85.

