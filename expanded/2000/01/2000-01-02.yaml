    importance: 6
    headline: "Lebanese Army retakes mountain villages in Dinniyeh from Sunni Islamist militants on fourth day of clashes"
    summary: >
      On January 2, 2000, Lebanese Army commandos and armored units backed by heavy
      artillery captured the mountain village of Kfar Habou and surrounding heights in the
      Dinniyeh district east of Tripoli after fierce clashes with Sunni Islamist fighters of
      the Takfir wal-Hijra group. Advancing soldiers recovered the mutilated bodies of
      several Lebanese soldiers who had been captured in an ambush on December 31 and freed
      civilian hostages held by the insurgents as surviving militants retreated higher into
      the snowbound mountains toward Assoun and Bqaa Safrine.
    key_data:
      - label: "Militants killed or captured by January 2, 2000"
        value: "At least 15 killed, 25 captured"
        citation_refs: [7]
      - label: "Lebanese soldiers confirmed killed by January 2, 2000"
