    details:
      what_happened:
        - "Rangers at Phillip Island Nature Park south-east of Melbourne discovered Little Penguins coming ashore coated in heavy bunker oil on January 2, 2000, believed to have been illegally discharged bilge fuel from a commercial cargo ship passing through Bass Strait."
        - "Emergency teams captured and washed hundreds of oiled penguins while maritime safety investigators searched shipping logs to identify vessels transiting Bass Strait over the New Year holiday."
      why_it_matters:
        - "The spill at one of Australia's premier ecotourism and seabird conservation sites spurred stricter Victorian and federal maritime penalties against illegal bilge-oil dumping in Bass Strait and led to the famous Phillip Island rehabilitation program using knitted wool sweaters to keep oiled penguins from ingesting toxins while preening."
        - "The exact vessel responsible for the illegal bilge discharge in Bass Strait could not be conclusively identified on January 2."
