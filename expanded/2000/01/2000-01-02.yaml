  - id: "evt-2000-01-02-004"
    category: "International relations"
    subcategory: ""
    topics:
      - "India"
      - "Pakistan"
    importance: 7
    headline: "Indian Prime Minister Atal Bihari Vajpayee accuses Pakistan over Flight 814 hijacking as freed militants surface in Pakistan"
    summary: >
      On January 2, 2000—the day after the hijacked Indian Airlines Flight 814 Airbus A300
      and its freed hostages returned to New Delhi—Indian Prime Minister Atal Bihari
      Vajpayee publicly accused Pakistan of orchestrating the week-long hijacking and urged
      the United States and the international community to designate Pakistan a state
      sponsor of terrorism. Pakistani military ruler General Pervez Musharraf's
      administration rejected the accusation, condemned the hijacking, and stated that
      Pakistan would arrest the hijackers if they were found on Pakistani territory, even as
      reports confirmed that freed cleric Masood Azhar had crossed into Pakistan.
    key_data:
      - label: "GDELT 1.0 CAMEO event cluster (`20000102`, Quetta/Islamabad)"
        value: "56 mentions across 44 articles (CAMEO `173` / `120`)"
        citation_refs: [5]
      - label: "Hijackers and freed militants sought after leaving Kandahar"
        value: "5 hijackers and 3 released prisoners"
        citation_refs: [5]
      - label: "Casualties"
        value: "None on January 2, 2000"
        citation_refs: [5]
    details:
      what_happened:
        - "Speaking in New Delhi on January 2, 2000 after debriefings of the returned IC-814 flight crew and intelligence services, Prime Minister Atal Bihari Vajpayee stated that intercepted communications and recovered identity documents showed the five hijackers were Pakistani nationals backed by Pakistan's Inter-Services Intelligence (`ISI`)."
        - "In Islamabad, Pakistan's Foreign Ministry dismissed Vajpayee's charges as baseless propaganda while confirming that the three prisoners released by India at Kandahar faced no criminal charges in Pakistan and could not be detained under Pakistani law."
      why_it_matters:
        - "The diplomatic confrontation over the IC-814 hijackers deepened the freeze in India–Pakistan relations that followed the 1999 Kargil War and the October 1999 Pakistani military coup, setting the stage for Masood Azhar's public rallies in Karachi and formation of Jaish-e-Mohammed later in January 2000."
        - "Pakistani authorities maintained on January 2 that the five hijackers had not formally crossed through official Pakistani border checkpoints from Afghanistan."
      uncertainty_notes: []
