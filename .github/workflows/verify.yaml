name: Verify offline extraction and synthesis
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify annual archive and readable companion
        run: |
          python - <<'PY'
          from pathlib import Path
          from seed import annual_archive as annual, archive_access, annual_legacy, yearbook
          for path in sorted(Path('archive').glob('*.sqlite')):
              conn = annual.connect(path, readonly=True)
              try:
                  if archive_access.publication(conn):
                      # Each pinned published renderer performs full verification.
                      expected = annual_legacy.render(conn, annual.digest(path.read_bytes()))
                      report = {'verification': 'full replay in pinned renderer',
                                'year': archive_access.publication(conn)['year'],
                                'events': yearbook.review_report(conn)['source_events']}
                  else:
                      annual_legacy.verify(conn)
                      report = yearbook.review_report(conn)
                      expected = yearbook.render(conn, annual.digest(path.read_bytes()))
                  assert path.with_suffix('.md').read_bytes() == expected, f'Stale Markdown: {path}'
                  print(path, report)
              finally:
                  conn.close()
          PY
      - name: Verify annual preservation recovery exports
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tools import build_tiers
          with TemporaryDirectory() as temporary:
              for database in sorted(Path('archive').glob('*.sqlite')):
                  report = build_tiers.build(database, Path(temporary) / (database.stem + '.tar'))
                  print(database, report)
          PY
      - name: Validate complete synthesis archive
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = sorted(Path('expanded').glob('20*/*/*.yaml'))
          subprocess.run(['python', 'reference/schema/validate.py', '--archive-root', 'expanded', *map(str, paths)], check=True)
          PY
