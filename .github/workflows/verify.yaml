name: Verify offline extraction and synthesis
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate complete synthesis archive
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = sorted(Path('expanded').glob('20*/*/*.yaml'))
          subprocess.run(['python', 'reference/schema/validate.py', '--archive-root', 'expanded', *map(str, paths)], check=True)
          PY
