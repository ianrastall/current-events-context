name: Backfill 2026-07-31

on:
  push:
    paths:
      - '.github/workflows/backfill_2026-07-31.yaml'

permissions:
  contents: write

concurrency:
  group: backfill-2026-07-31
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests mwparserfromhell pyyaml

      - name: Generate Missing Date
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4; do
            if python update_data.py 2026-07-31; then
              exit 0
            fi

            if [[ "$attempt" -lt 4 ]]; then
              delay=$((attempt * 30))
              echo "Attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "Failed to generate 2026-07-31 after 4 attempts." >&2
          exit 1

      - name: Commit Backfill and Remove One-Time Workflow
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -- 2026/07/2026-07-31.yaml
          git rm -- .github/workflows/backfill_2026-07-31.yaml
          git commit -m "Backfill missing daily update for 2026-07-31"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; retrying."
            sleep $((attempt * 5))
          done

          echo "Failed to push after 3 attempts." >&2
          exit 1
