name: Daily Wikipedia Update

on:
  schedule:
    - cron: '0 23 * * *' # Runs at 23:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests mwparserfromhell pyyaml

      - name: Run Script for Today
        run: python update_data.py

      - name: Commit and Push
        run: |
          set -e

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .
          if git diff --staged --quiet; then
            echo "No changes today. Skipping commit."
            exit 0
          fi

          git commit -m "Automated daily update for $(date +'%Y-%m-%d')"

          # Integrate any changes that landed on main after checkout.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
