wikipedia:
  categories:
    Uncategorized:
    - A suicide attacker detonates a car bomb near United Nations headquarters in
      Baghdad, killing himself and an Iraqi guard and injuring at least 11 others.
      The attack came a month after a massive truck bomb devastated the complex and
      as the UN considers expanding its role in Iraq. UN Secretary-General Kofi Annan
      states that personnel are assessing the situation following the attack.
    - 90% of the delegates elected to the November 15 convention of the Liberal Party
      of Canada support Paul Martin, thereby assuring that he will win the leadership
      of the party and thereby become Prime Minister of Canada after Jean Chrétien
      retires in February 2004.
    - The journal Science publishes an article on a jawbone of an early modern human
      found in 2002 near the entrance of the Peștera cu Oase (cave with bones) in
      the southwestern Carpathian Mountains in Romania. Radiocarbon dating places
      its age at between 34,000 and 36,000 years, making it the oldest fossil from
      an early modern human. The jawbone suggests interbreeding between modern humans
      and Neanderthals.
