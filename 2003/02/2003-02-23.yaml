    - The 45th Grammy Awards ceremony is held in New York City, dominated by newcomer
      Norah Jones receiving eight awards including Record of the Year, Album of the
      Year, Song of the Year and Best New Artist.
    - British athlete Paula Radcliffe sets a new 10 km road race world record of 30:21
      in San Juan, Puerto Rico.
