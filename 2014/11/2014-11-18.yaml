date: '2014-11-18'
source_page:
  portal: Portal:Current events/2014 November 18
  language: en
  wikipedia_revision_id: 1116052967
wikipedia:
  categories:
    Armed conflict and attacks:
    - A suicide bombing attack in Kabul kills at least two people.,
    - Four rabbis (three American and one British) are killed, and eight other people
      wounded in a terrorist attack on a Jerusalem synagogue by two men armed with
      meat cleavers and guns. The two attackers were killed by police who arrived
      at the scene. One of the policemen died from his wounds.
    - Benjamin Netanyahu vows for a heavy response and blames recent incitement by
      Palestinian leaders as Fatah officially condemns the attack while Hamas and
      Islamic Jihad praise it and call for more similar attacks.
    Arts and culture:
    - UNESCO declares the Rizal Monument in Manila, Machu Picchu of Peru, Camino de
      Santiago of Spain, and the Dampier Archipelago of Australia as World Heritage
      Sites in Danger.
    Disasters and accidents:
    - South Korea launches a new National Safety Agency with more than 10,000 staff
      to replace the Korea Coast Guard, blamed by President Park Geun-hye for a poor
      response to the sinking of MV Sewol.
    - Lake-effect snow pummels areas around the Great Lake states, including New York,
      Pennsylvania, Michigan, Wisconsin and Ohio, stranding hundreds of vehicles and
      causing Erie County, New York, to declare a state of emergency.
    Law and crime:
    - Human Rights Watch claims that police in the Democratic Republic of the Congo's
      capital Kinshasa had killed at least 51 people in extrajudicial killings in
      a crackdown on kuluna gangs last November.
    Politics and elections:
    - Kenneth Mapp, an independent, is elected Governor of the U.S. Virgin Islands
      in the gubernatorial runoff election over Democrat Donna Christensen.
    - Japan's Prime Minister Shinzō Abe calls a snap election for mid-December, two
      years ahead of schedule.
    - Teodor Meleșcanu becomes the second Foreign minister of Romania in just eight
      days to resign because of organizational problems which have left thousands
      of Romanians abroad unable to vote in the elections.
    - Hong Kong authorities start dismantling a protest site in Admiralty following
      a court order.
    - Andrew Little is elected to lead the New Zealand Labour Party following the
      resignation of David Cunliffe in September.
    - The United States Senate narrowly defeats legislation on the Keystone XL Pipeline,
      intended to allow oil from the oil sands of Canada to flow to the Gulf Coast
      of Texas.
    Sports:
    - Jamaica win the 2014 Caribbean Cup defeating Trinidad and Tobago in the final
      following a penalty shootout.
    Releases:
    - LittleBigPlanet 3 releases on the PlayStation 3 and PlayStation 4 in North America.
