Date: '2002-01-05'
Source_URI: Portal:Current events/2002 January 5
Intelligence_Payload:
  Uncategorized:
  - Milan Bandić, mayor of Zagreb tries to bribe a police officer after causing a
    car accident while driving under the influence of alcohol. This will lead to his
    resignation and a three-year-long hiatus in his mayor term
  - Charles J. Bishop, an American pilot, steals a Cessna 172 and crashes into Bank
    of America Tower in Tampa, Florida. This event will be remembered as the 2002
    Tampa plane crash.
