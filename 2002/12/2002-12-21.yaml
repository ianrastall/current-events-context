wikipedia:
  categories:
    Uncategorized:
    - In the Côte d'Ivoire, units of the French Foreign Legion, based at the city
      of Duekoue on Sassandra River have come into contact with rebels advancing southward
      from the city of Man. Colonel Emmanuel Maurin, commander of the French force,
      states "Between what we have here and the river, they shall not pass."
    - South Korean President-elect Roh Moo-hyun states that he will visit Washington
      after receiving an invitation from President George W. Bush. During his campaign,
      Roh stated he would not visit simply for a White House "photo op."
