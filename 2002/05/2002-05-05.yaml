wikipedia:
  categories:
    Uncategorized:
    - Jacques Chirac wins the French presidential elections with 82.21% of the vote
      to 17.79% for Jean-Marie Le Pen, the turnout was 79.71%. Chirac appoints Jean-Pierre
      Raffarin as his prime minister, replacing Lionel Jospin.
    - World Wrestling Federation is renamed to World Wrestling Entertainment due to
      trademark issues with World Wildlife Fund
    - Internazionale awkwardly hands over the Serie A Scudetto to their bitter rivals
      Juventus after losing away to SS Lazio, 4–2.
