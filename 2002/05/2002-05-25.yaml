    - China Airlines Flight 611, breaks up in mid-flight while flying from Chiang
      Kai Shek International Airport in Taipei, Taiwan, to Hong Kong International
      Airport in Hong Kong, China. All 225 passengers and crew on board perished in
      the breakup and crash.
