    - 'September 11, 2001 Terrorist Attack: A wordless ceremony at the World Trade
      Center site marks the end of the recovery effort. In the ceremony, which started
      at with the tolling of a firemen''s bell, a stretcher with an American flag,
      symbolizing the victims whose remains were not recovered or yet identified was
      carried up the 500-foot ramp to an FDNY ambulance, which slowly left the site,
      as did the flatbed truck carrying the last steel beam to be removed. The ceremony
      included the playing of America the Beautiful by the NYPD pipe-and-drum corps,
      a flyover by five NYPD helicopters, and the playing of taps by a NYPD and FDNY
      bugler. The ceremony was attended by hundreds of rescue and recovery workers,
      family members of victims, and New York politicians.'
