wikipedia:
  categories:
    Uncategorized:
    - The United States Department of State issues a travel warning advising all Americans
      except for essential diplomatic personnel (about 60,000 people) to leave India
      because "conditions along India's border with Pakistan and in the state of Jammu
      and Kashmir have deteriorated."
    - The European Union ratifies the Kyoto Protocol treaty, and Japan stated they
      would shortly.
    - 'Football World Cup 2002: Senegal defeats defending champion France 1–0.'
