wikipedia:
  categories:
    Uncategorized:
    - 'Ukraine airshow disaster: A Sukhoi Su-27 fighter plane crashes into a crowd
      at an airshow in Lviv in Ukraine, killing at least 78 people and injuring many
      more.'
    - A series of bomb blasts have rocked the Christian districts of the city of Ambon
      in Indonesia in what appears to be a continuation of violence between Christian
      and Muslim inhabitants. Over the past five years more than 5000 people have
      been killed in this conflict.
    - Nine American miners have been rescued from the Quecreek Mine in Pennsylvania,
      after frantic drilling by rescuers.
    - The Homeland Security Bill passes the United States House of Representatives,
      in a form that appears to kill Operation TIPS.
