wikipedia:
  categories:
    Uncategorized:
    - First near-Earth object to be given a positive rating on the Palermo Technical
      Impact Hazard Scale for potential Earth collision is (89959) 2002 NT7 with a
      potential impact on February 1, 2019.
    - U.S. Congressman James Traficant was expelled from the House of Representatives
      on a vote of 420 to 1. Traficant had been convicted of ten federal counts of
      corruption.
    - The major Millennium Challenge 2002 war game run by the United States armed
      forces begins.
