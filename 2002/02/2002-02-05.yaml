wikipedia:
  categories:
    Uncategorized:
    - 'Secretary of State Colin L. Powell says that the United States is willing to
      sign a treaty with Russia on limiting strategic nuclear weapons, indicating
      a possible shift in administration policy after withdrawing, last December,
      from the Antiballistic Missile Treaty of 1972. President George W. Bush and
      President Vladimir Putin are set to hold an arms reduction summit meeting in
      Moscow in May. – Background material: nuclear disarmament, nuclear warfare,
      nuclear proliferation.'
