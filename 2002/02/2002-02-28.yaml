    Uncategorized:
    - 'Gulbarg Society massacre : During the 2002 Gujarat riots, a mob attacked the
      Gulbarg Society, a lower middle-class Muslim neighbourhood in Chamanpura, Ahmedabad.
      Most of the houses were burnt, and at least 35 victims including a former Congress,
      Member of Parliament, Ehsan Jafri, were burnt alive, while 31 others went missing
      after the incident, later presumed dead, bringing the total of the dead to 69.'
