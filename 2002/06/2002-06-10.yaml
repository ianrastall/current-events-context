wikipedia:
  categories:
    Uncategorized:
    - 'Terrorism: The U.S. government announced that it had prevented an al-Qaida
      attempt to construct and detonate a radiological weapon (sometimes called a
      "dirty bomb") in the United States.'
    - 'Kashmir crisis: Pakistan and India appear to have stepped down their rhetoric
      over the Kashmir crisis, reducing the threat of nuclear war in the subcontinent
      slightly.'
    - 'Recent celebrity deaths: Former mob boss John "Teflon Don" Gotti dies of cancer.'
    - Technology - The first direct electronic communication experiment between the
      nervous systems of two humans is carried out by Kevin Warwick in the United
      Kingdom.
