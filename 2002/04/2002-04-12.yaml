    Uncategorized:
    - Coup d'état in Venezuela. President Hugo Chávez is brought to military barracks.
      Military announces transitional government consisting of mix of civilians and
      military headed by leader of the Chamber of Commerce (Venezuelan Federation
      of Chambers of Commerce), Pedro Carmona, who immediately repeals constitution,
      dissolves supreme court and parliament.
