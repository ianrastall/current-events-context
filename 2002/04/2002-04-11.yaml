wikipedia:
  categories:
    Uncategorized:
    - Ten nations deposit their ratifications for the International Criminal Court
      at a United Nations ceremony, bringing the total to 66, well above the 60 needed
      to bring the Statute into force. The ICC will therefore come into force on 1
      July 2002.
    - More than half a million people march on the streets of Caracas protesting against
      the Venezuelan government.
    - An empty American Airlines jet parked outside a hangar at Los Angeles International
      Airport trolls through a fence before coming to a stop on a service road.
    - A truck full of explosives was detonated close to the El Ghriba synagogue in
      Djerba, Tunisia killing 21 people, of whom 14 were German tourists, 2 French
      nationals and 5 Tunisians. Al Qaeda claimed responsibility for the Ghriba synagogue
      bombing.
