    Uncategorized:
    - In Erfurt, Germany, a nineteen-year-old attacks his high school, killing 13
      teachers, two other pupils, a police officer and himself. The event sparks a
      discussion about enacting stricter weapons laws in Germany and banning violent
      computer games and movies.
