wikipedia:
  categories:
    Uncategorized:
    - Israel ground troops invade the West Bank and Gaza Strip in her largest offensive
      since the 1982 invasion of Lebanon. Dozens of tanks occupy Ramallah. Thirty-seven
      total dead so far, Israeli and Palestinian.
    - Coheed and Cambria release their first album, The Second Stage Turbine Blade,
      on Equal Vision Records.
    - Twentieth Century Fox's American television drama series The Shield premieres.
