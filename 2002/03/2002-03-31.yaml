wikipedia:
  categories:
    Uncategorized:
    - 'Israeli-Palestinian conflict: Israeli troops exchange gunfire with guards of
      Yasir Arafat in Ramallah. A suicide bomber identified as Shadi Tubasi, a resident
      of the refugee camp Jenin, kills 14 and wounds more than 40 in Haifa. Later,
      a suicide bomber wounds four members of an intensive-care unit, one critically,
      in a paramedics'' dispatch station in Efrat. In the past 18 months, according
      to the Associated Press, 1262 people have been killed on the Palestinian side
      and on 401 on the Israeli side.'
