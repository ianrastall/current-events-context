wikipedia:
  categories:
    Uncategorized:
    - The Zimbabwe Congress of Trade Unions calls a three-day general strike protesting
      police interference with union meetings, harassment of trade unionists, and
      general lawlessness following the general elections, which has led to slow-downs
      in business.
    - In South Korea, 5,600 power plant workers are on the 25th day of their strike,
      protesting the neoliberal government plans to privatize the state-run electricity
      plants. A vote among the remaining power plant workers to strike is cancelled
      due to company interference.
