    Uncategorized:
    - Robert Mugabe wins the Zimbabwe elections with 54% of the vote to Morgan Tsvangirai's
      40% on a turnout of 55.9%. His victory is controversial and comes amid claims
      that many have been prevented from voting and there has been a campaign of intimidation.
      But election observers from South Africa and the Organisation of African Unity
      state that the outcome is legitimate.
    - In Australia, the first edition of the Melbourne edition of Seven News is produced
      at the station's new Docklands studios.
