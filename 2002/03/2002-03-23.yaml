wikipedia:
  categories:
    Uncategorized:
    - Two million to three million trade union members rally in Rome in protest both
      of labor legislation filed by Prime Minister of Italy Silvio Berlusconi and
      of the assassination of Marco Biagi, an advisor to the Labor Minister, by the
      re-formed Red Brigades. Labor leaders threaten a general strike if the legislation
      is passed.
