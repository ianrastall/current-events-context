wikipedia:
  categories:
    Uncategorized:
    - Azerbaijan Airlines Flight 217 crashed after taking off from the Azerbaijan
      capital, Baku, killing 23. (BBC)
    - Different sources report that Chadian president Idriss Déby has said his country
      is in a state of either "war" or "belligerence" with Sudan following a recent
      rebel attack in which around 100 people were killed. (BBC) (Reuters)
    - The 2012 Summer Olympics may have been given to London by a voting error, a
      senior IOC official theorised. (BBC)
    - Astronomers have discovered new moons and rings around Uranus using the Hubble
      Space Telescope. (CNN)
    - Lech Kaczyński was sworn in as President of the Republic of Poland. (BBC)
    - U.S. News and World Report claimed that the United States government has been
      monitoring mosques in the United States since September 11 for traces of radiation.
      (US News)
    - The ITV News Channel closes after 5 years
