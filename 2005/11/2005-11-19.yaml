    Uncategorized:
    - The U.S. Marine massacre of Iraqi civilians in Haditha occurs.[Newslink missing]
    - American Grammy Award winning singer Christina Aguilera marries Jordan Bratman
      in Napa Valley, California.[Newslink missing]
    - In a speech to U.S. troops in South Korea, President George W. Bush rejects
      calls for a timetable for withdrawing U.S. forces from Iraq.[Newslink missing]
    - After negotiations, Maoist rebels in Nepal agree to work with opposition politicians
      in a common front against the rule of King Gyanendra. The Nepalese Civil War
      has killed more than 12,000 people since 1996. (Times of India) (BBC)
    - Prince Albert of Monaco is formally enthroned. (CNN)
