Date: '2026-05-04'
Source_URI: Portal:Current events/2026 May 4
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - 2026 Strait of Hormuz campaign
  - Operation Project Freedom
  - The U.S. Central Command says that two US-flagged merchant vessels have passed
    through the Strait of Hormuz, the first vessels to cross the waterway since the
    start of Project Freedom. Additionally, CENTCOM also says that U.S. Navy guided-missile
    destroyers transited through the waterway. (The Hill) (Axios)
  - Danish shipping company Maersk says that the Alliance Fairfax, a US-flagged vehicle
    carrier operated by subsidiary Farrell Lines, has successfully crossed the Strait
    of Hormuz accompanied by U.S. military assets as part of Project Freedom. (U.S.
    News & World Report)
  - Iranian media report that the Iranian navy struck a U.S. Navy warship with two
    missiles, after it ignored warnings off the coast of Jask. United States Central
    Command denies the claim that a ship was hit. (Al Jazeera) (CNBC)
  - A fire and explosion is reported on an anchored HMM vessel in the Strait of Hormuz
    near the United Arab Emirates. No casualties were reported. (Yonhap)
  - A vessel belonging to Abu Dhabi National Oil Company is attacked by two drones
    in the Strait of Hormuz. No injuries were reported. (Gulf News)
  - 2026 United States naval blockade of Iran
  - The Pakistani foreign ministry says that the U.S. has evacuated 22 crew members
    on the Touska and will hand them to Iranian authorities. (Reuters)
  - The IRNA confirms that the 22 sailors returned home to Iran at a border terminal
    in Sistan-Baluchistan. (Pakistan Today)
  - 2025–2026 Iran–United States negotiations, Pakistan in the 2026 Iran war
  - 2026 Iran war ceasefire
  - Iranian foreign minister Abbas Araghchi and Pakistani foreign minister Ishaq Dar
    hold a phone call to discuss Pakistan's efforts to revive ceasefire talks between
    Iran and the United States aimed at ending the war. (AA) (Al Arabiya)
  - Former Pakistan Ambassador to the United States Masood Khan reaffirms Pakistan's
    role as a facilitator in negotiations between the U.S. and Iran. (Daily Parliament
    Times) (UrdoPoint)
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on the United Arab Emirates
  - The United Arab Emirates reports that it has intercepted four missiles from Iran,
    three over projectile water and the 4th falling in sea. This is the first report
    of missile interceptions since the ceasefire began on April 7. (Khaleej Times)
  - A strike on an energy facility in the Fujairah emirate injures three Indian nationals.
    (AFP via LBCI)
  - 2026 Iranian strikes on Oman
  - Two people are injured after a residential building in Bukha, Oman is targeted
    along the coastline of the Strait of Hormuz. (Al Arabiya)
  - Sudanese civil war
  - Rapid Support Forces occupation of the Khartoum International Airport
  - Rapid Support Forces launch drone attacks at several targets in Khartoum, Sudan,
    including the Khartoum International Airport in Khartoum, Sudan. Drone strikes
    are also reported at the Signal Corps in Khartoum Bahri and Al-Markhiyat camp
    in northern Omdurman. (Sudan Tribune)
  - The Sudan Army's air defenses intercept drone strikes at the airport. (Yaffaps)
  - Economic impact of the 2026 Iran war
  - The Dubai International Airport in Dubai, United Arab Emirates, reports a 66%
    drop in passenger traffic in March 2026 amidst a disruption of air traffic in
    the Middle East due to the Iran war. (Bloomberg)
  - Eight people are killed in a road accident in Dandong, Liaoning, China. (Xinhua)
  - Seven people are killed and 13 others critically injured after a bus collided
    head-on with a trailer in Northern Uganda. (Xinhua)
  - Three people are killed and 25 others are injured, including two critically, in
    an explosion at a fireworks plant in Liuyang, Hunan, China. (Xinhua)
  - Three people are killed and 14 others are injured in a fire at a six-story apartment
    building in Manhattan, New York, United States. (The New York Times)
  - At least two people are killed and three others are injured when an Embraer EMB-721
    crashes into a residential building in Belo Horizonte, Minas Gerais, Brazil. (G1
    in Portuguese)
  - Austria–Russia relations
  - Austria and Russian intelligence
  - Austria expels three Russian diplomats over suspected espionage activities involving
    data interception from the Russian embassy and a diplomatic mission in Vienna.
    (AP)
  - Australia–Japan relations
  - Australia and Japan sign agreements on energy and critical minerals. (Reuters)
  - European integration
  - The 8th European Political Community Summit is held in Yerevan, Armenia, with
    leaders from nearly 50 countries participating. (Euronews)
  - Nigeria–South Africa relations, Xenophobia in South Africa
  - Nigeria announces plans for the voluntary repatriation of its citizens from South
    Africa following reported attacks and safety concerns affecting foreign nationals.
    (AFP via The Manila Times)
  - 2026 Leipzig car incident
  - Two people are killed and 22 others are injured, including two seriously, after
    a car was driven into a crowd of people in Leipzig, Saxony, Germany. The perpetrator
    is arrested and the incident is being investigated. (Reuters)
