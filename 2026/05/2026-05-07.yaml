Date: '2026-05-07'
Source_URI: Portal:Current events/2026 May 7
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - The Iranian Ports and Maritime Organization says that ports in Iran are prepared
    to provide maritime services, technical support, supplies, and medical assistance
    to ships operating in the Strait of Hormuz. (AA) (The Economic Times)
  - A U.S. official tells Axios that the United States and Iran have reportedly exchange
    fire at the Strait of Hormuz, with Iran claiming to strike three U.S. Navy ships
    and the U.S. claiming to strike targets on the waterway. (Axios)
  - The U.S. Central Command confirms that the U.S. military carried out "self-defense"
    strikes against military facilities in response to Iran's attacks on the Arleigh
    Burke-class destroyers USS Truxtun, USS Rafael Peralta, and USS Mason as the three
    ships were transiting the Hormuz into the Gulf of Oman. (Times of Israel) (CNN)
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - Pakistan foreign office spokesperson Tahir Andrabi says that a ceasefire agreement
    between Iran and the United States to end the war is expected "sooner rather than
    later". (Arab News PK)
  - Several explosions are heard at a port in Qeshm and Bandar Abbas in the Hormozgan
    province of Iran. Israel denies any involvement in the explosion, while Fox News
    reporter Jennifer Griffin says that the U.S. military was behind the explosions.
    Officials say that the explosions does not mean the restart of the war or the
    end of the ceasefire. (AA) (BNO News) (Reuters)
  - 2026 Cuban crisis
  - Sherritt International suspends its mining operations in Cuba and withdraws expatriate
    staff, citing the risk of expanded United States sanctions affecting its operations.
    (AFP via News Abhiyan)
  - Mastercard says that they are planning to resume services in Syria for the first
    time in 15 years. (SANA) (AA)
  - 2024 South Korean martial law crisis
  - The Seoul High Court reduces former South Korean prime minister Han Duck-soo's
    prison sentence from 23 years to 15 years for crimes related to former president
    Yoon Suk Yeol's 2024 martial law declaration, citing a lack of evidence that Han
    played a leading or premeditated role in the declaration. (AFP via CNA)
  - Anti-corruption campaign under Xi Jinping
  - Former Chinese defense ministers Li Shangfu and Wei Fenghe are both sentenced
    to death with a two-year reprieve following their convictions on graft charges.
    (Politico)
  - Trafficking of Chinese nationals to scam centers abroad
  - Sri Lankan authorities arrest 30 Chinese and Vietnamese nationals in Colombo in
    a crackdown on cyberscams in the country, raising the total number of those detained
    to 261. (AFP via The Straits Times)
  - 2026 United Kingdom local elections
  - 2026 Scottish Parliament election, 2026 Senedd election
  - Voters in England elect six mayors and 5,066 council seats across 136 councils.
    In Scotland, voters elect 129 seats to the Scottish Parliament. In Wales, voters
    elect 96 seats to the Senedd. (BBC News) (The Guardian)
  - Politics of Solomon Islands
  - The parliament of the Solomon Islands debates a no-confidence motion against prime
    minister Jeremiah Manele. The debate is a culmination of a political crisis that
    started with mass resignations of the cabinet on 16 March, recently escalated
    by a ruling on 1 May by the Court of Appeal ordering the reconvening of Parliament.
    (RNZ)
  - Manele is ousted from the premiership following a successful no-confidence motion
    of 26–22, with two MPs absent. Manele remains as caretaker prime minister until
    governor-general David Tiva Kapu declares a new prime minister. (Reuters)
  - The ShinyHunters cybercrime group claims responsibility for breaching Instructure
    Canvas, a web-based learning management system, a second time, affecting at least
    275 million teachers and students across the United States. (Mashable) (SecurityWeek)
  - International sporting sanctions during the Russian invasion of Ukraine
  - Belarus at the Olympics
  - The International Olympic Committee lifts restrictions on Belarusian athletes
    participating in the Olympic Games from 2028, while Russian athletes remain limited
    to individual neutral participation because of the Russian Olympic Committee's
    suspension. (AFP via RFI) (BBC)
  - 2027 NCAA Division I men's basketball tournament
  - It is announced that the NCAA Division I men's basketball tournament will expand
    to 76 teams beginning next year. (AP)
