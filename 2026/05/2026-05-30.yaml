wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - Naval blockade of Iran
    - U.S. military aircraft disable The Gambia-flagged bulk carrier Lian Star and
      leave it adrift in the Gulf of Oman after it ignored warnings while attempting
      to reach a port in Iran. (AP via Politico)
    - Kuwait in the 2026 Iran war
    - Falling debris from a Fateh-110 missile intercepted by air defenses hit the
      Ali Al Salem Air Base in Kuwait, mildly injuring an estimated 5 American servicemen
      and contractors, and damaging two MQ-9 Reaper drones. (Bloomberg) (Stars and
      Stripes)
    - 2026 Lebanon war
    - Israeli Air Force strikes and artillery shelling are reported near Beaufort
      Castle as Israeli troops approach the outskirts of Nabatieh, Lebanon. (Al Jazeera)
    - Operation Southern Spear
    - United States strikes on alleged drug traffickers during Operation Southern
      Spear
    - The United States military carries out a strike on a boat accused of drug trafficking
      in the eastern Pacific Ocean, killing three people. (The Guardian) (NPR)
    - Somali Civil War
    - Constitutional crisis in Somalia, Controversies of Hassan Sheikh Mohamud
    - At least eight people are killed during clashes between forces loyal to disputed
      Somali president Hassan Sheikh Mohamud and ousted South West State president
      Abdiaziz Laftagareen after they enter the regional capital Baidoa. (AFP via
      The New Arab) (Garowe Online) (Horseed Media)
    - MGI All Stars 1st Edition
    - Vanessa Pulgarín from Colombia wins the first MGI All Stars beauty pageant,
      held in Bangkok, Thailand. (ABS-CBN)
    - A truck carrying Afghan refugees returning from Pakistan overturns on a highway
      in Laghman Province, Afghanistan, killing 22 people and injuring 36 others.
      (AP)
    - At least six people are killed and ten others are injured when a four-story
      commercial building collapses in Saidul Ajaib, Delhi, India. (Hindustan Times)
    - Four more men trapped in a flooded cave in Xaisomboun province, Laos, are rescued
      after 10 days, bringing the total number of survivors recovered to five, while
      search operations continue for two missing persons. (AFP via ABS-CBN News) (Reuters)
    - The driver is killed and 23 people are wounded when a bus crashes in Baranya
      County, Hungary. (AP)
    - A person is killed and at least 95 others are injured after a Pangasinan-bound
      bus collides with an SUV and a Baguio-bound bus along Marcos Highway in Tuba,
      Benguet, Philippines. (Philippine Daily Inquirer)
    - A meteor lands off the coast of Massachusetts, United States, causing an explosion
      and a loud sonic boom. The explosion occurred at 2:11 p.m. local time, causing
      major disruption. The remnants of the meteor are presumed to be located in Cape
      Cod Bay. (CBS News) (DW)
    - 2026 Ebola epidemic
    - Uganda's health ministry reports two more cases of ebola in Kampala, bringing
      the total number of cases in the country to nine. (AFP via Channel Africa)
    - MV Hondius hantavirus outbreak
    - The MV Hondius cruise ship, which was at center of hantavirus infections including
      the Andes strain during the outbreak, is cleared to sail again after undergoing
      cleaning and disinfection. (AFP via The Straits Times)
    - Armenia–Russia relations, Armenia–European Union relations
    - Russia recalls its ambassador to Armenia over Armenia's closer relations with
      the European Union, citing concerns about its commitments within the Eurasian
      Economic Union. (AFP via Euractiv) (Reuters)
    - India–Vietnam relations
    - India signs a 60 billion rupees (US$629 million) deal to supply BrahMos missiles
      to Vietnam, which will also include training and logistical support. (DW) (Reuters)
    - A court in the Turks and Caicos Islands sentences former premier Michael Misick
      to over four years in prison for corruption, embezzlement, and accepting bribery.
      (AP)
    - 2026 Maltese general election
    - Maltese citizens vote to elect the members of the House of Representatives.
      (AFP via France 24)
    - 2025–26 UEFA Champions League
    - 2026 UEFA Champions League final
    - In association football, defending champions Paris Saint-Germain (PSG) win their
      second Champions League title after defeating Arsenal 4–3 on penalties following
      a 1–1 draw after extra time during the final at Puskás Aréna in Budapest, Hungary.
      (AP) (CNN)
    - 2026 Paris Saint-Germain celebration riots
    - Following PSG's Champions League victory, police arrest more than 280 people
      in Paris, France, following clashes, vandalism, arson, an attempted intrusion
      into a police station, and disruptions to traffic and public transport during
      celebrations. (AFP via The Guardian) (Reuters)
    - 2026 NBA playoffs
    - In basketball, the San Antonio Spurs defeat the defending champions, the Oklahoma
      City Thunder, in seven games to win the Western Conference finals and reach
      the NBA Finals for the first time since 2014, where they will face the New York
      Knicks. (AFP via The Manila Times) (The Chosun Daily)
