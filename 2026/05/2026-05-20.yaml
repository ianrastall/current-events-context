wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - Iranian foreign ministry spokesperson Esmaeil Baghaei says that Iran has received
      and is reviewing a new proposal from the United States regarding talks to end
      the war, while Pakistani interior minister Mohsin Naqvi visits Tehran to facilitate
      exchanges between the two sides. (AFP via Al-Ahram) (Arab News PK)
    - Saudi Arabia news channels Al Arabiya and Al Hadath reports that Islamabad is
      likely to hold the second round of talks between Iran and the U.S. after the
      Hajj season ends. (Pakistan Observer) (Dunya News)
    - 2026 Strait of Hormuz crisis
    - Two supertankers from China carrying four million barrels ​of Middle East crude
      oil exit the Strait of Hormuz after staying in the Persian Gulf for two months
      since the war started on February 28. (Reuters)
    - A South Korean-flagged oil tanker safely transits the Strait of Hormuz, marking
      the first passage by a South Korean vessel through the waterway since the war
      started. (AFP via AA) (Yonhap)
    - The Iranian Navy claims that it has allowed 26 ships to cross the Strait of
      Hormuz in the past 24 hours. (Oman Observer)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Israeli airstrikes kill at least eight people in Ad-Doueir, Tibnin, Burj el-Shamali,
      and Shebaa in southern Lebanon. (Al Jazeera)
    - Housing in the United States
    - The U.S. House of Representatives votes 396–13 to pass the 21st Century ROAD
      to Housing Act, aimed at helping offset the cost-of-living and support affordable
      housing in the United States. The bill heads back to the U.S. Senate for any
      revisions. (The New York Times) (Politico)
    - The 1,200-year-old Reikado Hall in the Daishō-in temple complex in Itsukushima,
      Hiroshima Prefecture, Japan, burns down completely. (NHK ) (Nippon.com)
    - 2026 Ebola epidemic
    - The World Health Organization reports that the Ebola virus outbreak in the eastern
      Democratic Republic of the Congo likely began two months ago due to a superspreading
      event, and initially went undetected. (Reuters)
    - An Air France flight from Paris, France, to Detroit, Michigan, U.S., is diverted
      to Montreal, Quebec, Canada, due to flight restrictions imposed by the U.S.,
      as a passenger on the flight is from the DR Congo. (CBS News)
    - MV Hondius hantavirus outbreak
    - American MV Hondius passengers quarantined in Nebraska following exposure to
      the hantavirus on the ship will remain in quarantine until the end of May. (NBC
      News)
    - The United Nations General Assembly adopts a resolution reaffirming states'
      obligations to address climate change and recognizing a recent advisory opinion
      by the International Court of Justice on states' legal responsibilities regarding
      climate commitments. (AFP via France 24)
    - Bolivia–Colombia relations, 2026 Bolivian protests
    - Bolivia and Colombia expel each other's ambassadors amid a diplomatic dispute
      over comments by Colombian president Gustavo Petro regarding anti-government
      protests in Bolivia. (BGNES) (Reuters)
    - United States and the United Nations, United States support for Israel in the
      Gaza war
    - The U.S. Office of Foreign Assets Control removes sanctions on Francesca Albanese,
      the UN Special Rapporteur on occupied Palestinian territories, after district
      judge Richard J. Leon of the District of Columbia blocked measures imposed over
      Albanese's criticism of Israel and its actions in Gaza. (AFP via ABS-CBN News)
    - Violations of non-combatant airspace during the Russo-Ukrainian war
    - Lithuania issues an air raid alert in Vilnius after the military detected a
      drone signal near the Belarusian border, marking the first time since the start
      of Russia's full-scale invasion of Ukraine in 2022 that an EU and NATO member
      state has ordered the general population to take shelter. (AFP via RFI) (AP)
    - Somalia–United States relations
    - Government of Puntland officials hosted a high-level United States delegation
      in the presidential palace in Garowe following the expiration of the mandate
      of Somalia’s federal government, where U.S. representatives sought to strengthen
      economic opportunities in Puntland’s oil exploration, fisheries, and mineral
      development sectors. (Garowe Online) (Horseed Media) (FTL Somalia)
    - 2026 Cuban crisis, Cuba–United States relations
    - The U.S. Department of Justice announces that a grand jury in Miami, Florida,
      has indicted former first secretary of the Communist Party of Cuba Raúl Castro
      and five others on murder charges in connection with the 1996 shootdown of an
      aircraft operated by Brothers to the Rescue. (AFP via RFI) (AP) (Reuters)
    - Aftermath of the January 6 United States Capitol attack
    - Two U.S. Capitol Police officers who helped defend the Capitol building in Washington,
      D.C. during the January 6, 2021 riot file a lawsuit to block January 6 rioters
      from receiving payouts from a new $1.8 billion settlement fund. (AP) (Reuters)
    - Chinese intelligence activity abroad, China–Germany relations
    - The German public prosecutor general arrests a Chinese couple in Munich who
      are accused of spying for a Chinese intelligence agency. (Bloomberg) (DW)
    - International Criminal Court investigation in the Philippines
    - The Philippine supreme court rejects an injunction sought by senator Ronald
      dela Rosa against his arrest on an International Criminal Court warrant for
      crimes against humanity related to the Philippine drug war. (Al Jazeera)
    - Mexican Drug War
    - Atlatlahucan mayor Agustín Toledano Amaro and former Yecapixtla mayor Irving
      Sánchez Zavala are arrested in Morelos, Mexico, during "Operación Enjambre",
      a crackdown on officials tied to organized crime. A manhunt is underway for
      Cuautla mayor Jesús Corona Damián. (El Financiero)
    - 2026 Bolivian protests
    - Bolivian president Rodrigo Paz announces plans to reshuffle Bolivia's cabinet
      and create an economic and social council following weeks of anti-government
      protests linked to the country’s economic crisis. (AFP via France 24) (Al Jazeera)
    - The Hungary government proposes a constitutional amendment that would limit
      prime ministers to 8 years in office. (The Guardian)
    - 2025–26 UEFA Europa League
    - 2026 UEFA Europa League final
    - In association football, Aston Villa defeat SC Freiburg 3–0 at Beşiktaş Stadium,
      Istanbul, to win their first UEFA Europa League title, and second European title
      after the 1982 European Cup final. Emiliano Buendía, who scored Villa's second
      goal, is named player of the match. (Sky News)
    - 2026 FIFA World Cup
    - The DR Congo football team cancels a 3-day FIFA World Cup training camp and
      a fan farewell in Kinshasa over ebola concerns in the country. (AP)
    - 2026 Walter Cup playoffs
    - In ice hockey, the Montreal Victoire defeat the Ottawa Charge 3–1 to win their
      first-ever PWHL Walter Cup. (The Athletic via The New York Times)
