wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire, Pakistan in the 2026 Iran war
    - Iranian state TV says that Iran has sent its response to the latest ceasefire
      proposal from the United States via Pakistan. Pakistani prime minister Shehbaz
      Sharif confirms that his country received the response. (Reuters) (Arab News
      PK)
    - United States president Donald Trump calls the Iranian response "totally unacceptable"
      and says he would reject it. (Axios)
    - 2026 Strait of Hormuz crisis
    - The Qatar-linked LNG tanker Al Kharaitiyat, managed by Nakilat, crosses the
      Strait of Hormuz, making it the first oil tanker or vessel from Qatar to transit
      the waterway since the war began on February 28. The ship is expected to head
      to Pakistan. (The Week) (Fortune) (Financial Times)
    - A joint investigation by South Korea concludes that two unidentified airborne
      projectiles struck the HMM cargo ship Namu in the Strait of Hormuz, causing
      a fire and damaging the vessel, while authorities continue investigating the
      type of weapon and the party responsible. (AFP via Arab News) (The Chosun Ilbo)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Israeli attacks kill at least 39 people in Lebanon despite a ceasefire that
      took effect last month. The Israeli Defense Forces states that the target was
      an armed Hezbollah group. (New York Times) (BBC News)
    - Boko Haram insurgency
    - Dozens of Nigerian fishermen are reportedly killed in Chadian airstrikes targeting
      suspected Boko Haram positions by Lake Chad. (AFP via The New Indian Express)
    - Nigerian bandit conflict
    - At least 30 people are killed after gunmen ambushed travelers on a highway in
      Zamfara State, Nigeria. (AFP via The Korea Times)
    - Economic impact of the 2026 Iran war
    - Sri Lanka raises electricity tariffs by up to 18% for high-consumption users
      to offset increased power generation costs linked to the Iran war. (AFP via
      The Daily Star)
    - Seven suspected immigrants reportedly being smuggled are found dead in a train
      boxcar and near train tracks in Laredo and San Antonio, Texas, United States.
      (NBC News) (Reuters)
    - Four people are killed and 10 injured after a jeepney carrying 20 people collides
      into a tree in Oriental Mindoro province, Philippines. (Xinhua)
    - MV Hondius hantavirus outbreak
    - MV Hondius arrives on Tenerife, Spain, after being anchored at the Canary Islands.
      Passengers on the ship evacuate after previously being exposed to the hantavirus.
      (AP)
    - Israeli blockade of the Gaza Strip
    - Israel deports activists Thiago Ávila and Saif Abu Keshek, both of whom were
      detained after the interception of a Gaza-bound aid flotilla in international
      waters near Greece. (AFP via RFI)
    - Morocco–United States relations, Exercise African Lion
    - The remains of an American soldier who went missing during a military exercise
      in Morocco are found on the country's Atlantic coastline by the Moroccan military.
      (AP)
    - 2025–2026 Iranian protests
    - 2026 Iranian diaspora protests
    - Protests organized by exiled Iranian crown prince Reza Pahlavi are held globally
      against the regime’s crackdown of mass arrests, executions, and internet blackout,
      which has lasted 70 days. (Arab Times) (Jerusalem Post)
    - Constitutional crisis in Somalia, 2026 Somali presidential election
    - Controversies of Hassan Sheikh Mohamud
    - One civilian killed and another injured after Somali armed forces opened gunfire
      to disperse an opposition‑led protest in Mogadishu, days before president Hassan
      Sheikh Mohamud's term ends. (Africa News)
    - Violations of non-combatant airspace during the Russo-Ukrainian war
    - Andris Sprūds resigns as Latvian defence minister after Ukrainian drones violated
      Latvian airspace during an attack on Russia. (Politico EU)
