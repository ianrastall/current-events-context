  - 2026 Iran war ceasefire, Pakistan in the 2026 Iran war
  - Iranian state TV says that Iran has sent its response to the latest ceasefire
    proposal from the United States via Pakistan. Pakistani prime minister Shehbaz
    Sharif confirms that his country received the response. (Reuters) (Arab News PK)
  - 2026 Strait of Hormuz crisis
  - The Qatar-linked LNG tanker Al Kharaitiyat, managed by Nakilat, crosses the Strait
    of Hormuz, making it the first oil tanker or vessel from Qatar to transit the
    waterway since the war began on February 28. The ship is expected to head to Pakistan.
    (The Week) (Fortune) (Financial Times)
  - A joint investigation by South Korea concludes that two unidentified airborne
    projectiles struck the HMM cargo ship Namu in the Strait of Hormuz, causing a
    fire and damaging the vessel, while authorities continue investigating the type
    of weapon and the party responsible. (AFP via Arab News) (The Chosun Ilbo)
  - 2026 Lebanon war
  - Israeli attacks kill at least 24 people in Lebanon despite a ceasefire that took
    effect last month. The Israeli Defense Forces states that the target was an armed
    Hezbollah group. (Al Jazeera) (BBC News)
  - Boko Haram insurgency
  - Dozens of Nigerian fishermen are feared dead from Chadian airstrikes targeting
    suspected Boko Haram positions by Lake Chad. (AFP via The New Indian Express)
  - Economic impact of the 2026 Iran war
  - Sri Lanka raises electricity tariffs by up to 18% for high-consumption users to
    offset increased power generation costs linked to the Iran war. (AFP via The Daily
    Star)
  - Israeli direct action against aid delivery to Gaza
  - Israel deports activists Thiago Ávila and Saif Abu Keshek, both of whom were detained
    after the interception of a Gaza-bound aid flotilla in international waters near
    Greece. (AFP via RFI)
  - MV Hondius hantavirus outbreak
  - MV Hondius arrives on Tenerife, Spain, after being anchored on the Canary Islands.
    Passengers on the ship evacuate after previously being exposed to the hantavirus.
    (AP)
