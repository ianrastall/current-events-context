Date: '2026-05-23'
Source_URI: Portal:Current events/2026 May 23
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - Pakistan in the 2026 Iran war
  - Iran, the United States, and mediator Pakistan reports that progress has been
    made in ceasefire talks, with the Iranian foreign ministry saying that Iran is
    focused on finalizing a memorandum of understanding. (Reuters)
  - The Financial Times reports that mediators are nearing a deal to extend the ceasefire
    between Iran and the United States by 60 days and establish a framework for nuclear
    talks. (CNBC) (Financial Times)
  - U.S. president Donald Trump says that the details of the emerging agreement will
    be "announced shortly," and that it will include the reopening of the Strait of
    Hormuz. (Al Jazeera)
  - 2026 Strait of Hormuz crisis
  - The U.S. Central Command says that they have redirected 100 commercial ships and
    disabled four others from the Strait of Hormuz since the blockade started. (AA)
  - Iran's Fars News Agency reports that the agreement will allow Iran to manage the
    Strait of Hormuz. (Reuters)
  - 2026 Lebanon war
  - Lebanese Civil Defense reports that an Israeli airstrike on a residential building
    in Sir el Gharbiyeh, southern Lebanon, has killed at least nine people and injured
    six. (Al Jazeera)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war
  - A Ukrainian drone attack causes a fire at a Transneft oil terminal in Novorossiysk,
    Krasnodar Krai, Russia. (ABC News)
  - 2026 Cannes Film Festival
  - Romanian director Cristian Mungiu wins his second Palme d'Or for the drama film
    Fjord at the 2026 Cannes Film Festival in France. (AP via Korea JoongAng Daily)
  - 2026 Ituri Province Ebola epidemic
  - The International Red Cross announces that three of its local volunteers have
    died from Ebola while working in the Djugu Territory, Ituri Province, Democratic
    Republic of the Congo (DRC), in March. (CBS News)
  - Uganda's health ministry confirms three new Ebola cases, a woman who traveled
    from the DRC and two Ugandan workers that had contact with her, bringing the country's
    total to five cases and one death. (RFI)
  - An Ebola clinic run by Doctors Without Borders is set on fire by residents in
    Mongbwalu, Djugu Territory, Ituri Province, DRC. (AP)
  - France–Israel relations, Blockade of the Gaza Strip
  - France bans Israeli national security minister Itamar Ben-Gvir permanently following
    his actions towards members of the Global Sumud Flotilla who were detained by
    the Israeli Navy several days earlier. (Politico)
  - Ukraine–Vietnam relations, Kazakhstan–Ukraine relations
  - In accordance with bilateral agreements, Vietnam grants 40 scholarships to Ukrainians
    for the 2026–2027 academic year for bachelor's, master's, and postgraduate degrees,
    including a one-year language course for those who do not speak Vietnamese. Kazakhstan
    also grants 40 scholarships for similar degrees. (Interfax-Ukraine)
  - Turkey–Islamic State conflict
  - The Syrian General Intelligence Directorate and the Turkish National Intelligence
    Organization conduct a joint operation in Syria and arrest ten people allegedly
    linked with ISIL. (Al Jazeera)
  - 2024–present Serbian anti-corruption protests
  - Tens of thousands of people rally in Belgrade, Serbia, to protest against the
    government and president Aleksandar Vučić, and call for earlier parliamentary
    and presidential elections. (Al Jazeera)
  - Protests against the 2026 Iran war
  - Anti-war protesters stage a protest rally at the US naval base in Yokosuka, Kanagawa
    Prefecture, Japan, against the US-Israel strikes and call for challenge against
    the Japan-US Security Treaty. (Arab News Japan)
  - Veterans hold a Veterans Speak Out gathering at the Nevada State Capitol in Carson
    City, Nevada, U.S., to honor the U.S. troops who were killed during the Iran war.
    Additionally, veterans also criticize the war as unconstitutional, citing Article
    1 Section 8 of the U.S. Constitution. (CarsonNow) (KOLO-TV)
  - Thousands of people march through Madrid, Spain, to demand prime minister Pedro
    Sánchez to resign following several corruption scandals in his cabinet. (Al Jazeera)
  - 2026 FIFA World Cup
  - Iran at the FIFA World Cup
  - The Iran national football team moves their squad's base to Tijuana, Mexico, with
    approval from FIFA to avoid visa-related issues with the United States. (Al Jazeera)
  - The DR Congo national football team announces that it will maintain its planned
    schedule, including two friendly matches in Belgium and Spain, before going to
    Houston, Texas, United States, for the World Cup, despite being warned to isolate,
    stating the entire squad is based outside of the DRC. (Reuters via Al Jazeera)
