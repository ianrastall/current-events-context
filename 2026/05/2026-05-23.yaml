wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - Iran, the United States, and mediator Pakistan reports that progress has been
      made in ceasefire talks, with the Iranian foreign ministry saying that Iran
      is focused on finalizing a memorandum of understanding. (Reuters)
    - The Financial Times reports that mediators are nearing a deal to extend the
      ceasefire between Iran and the United States by 60 days and establish a framework
      for nuclear talks. (CNBC) (Financial Times)
    - U.S. president Donald Trump says that the details of the emerging agreement
      will be "announced shortly," and that it will include the reopening of the Strait
      of Hormuz. (Al Jazeera)
    - 2026 Strait of Hormuz crisis
    - The U.S. Central Command says that they have redirected 100 commercial ships
      and disabled four others from the Strait of Hormuz since the blockade started.
      (AA)
    - Iran's Fars News Agency reports that the agreement will allow Iran to manage
      the Strait of Hormuz. (Reuters)
    - 2026 Lebanon war
    - The Lebanese Civil Defense reports that an Israeli airstrike on a residential
      building in Sir el Gharbiyeh, southern Lebanon, has killed at least 11 people
      and injured six. (AFP via Dawn)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - A Ukrainian drone attack causes a fire at a Transneft oil terminal in Novorossiysk,
      Krasnodar Krai, Russia. (ABC News)
    - Sudanese civil war
    - During a meeting in Nairobi, Kenya, political groups in Sudan including the
      Somoud alliance and Sudan Liberation Movement led by Abdul Wahid al-Nur approve
      a roadmap in a effort to end the civil war in the country. (Sudan Tribune) (AA)
    - 2026 Cannes Film Festival
    - Romanian director Cristian Mungiu wins his second Palme d'Or for the drama film
      Fjord at the 2026 Cannes Film Festival in France. (AP via Korea JoongAng Daily)
    - 2026 Angola gold mine landslide
    - Twenty-eight gold miners are buried to death after the illegal mineshaft they
      were working collapses due to a landslide. (Reuters)
    - Garden Grove chemical leak
    - California governor Gavin Newsom declares a state of emergency in Orange County,
      California, U.S., in response to a possible release of methyl methacrylate in
      Garden Grove. (BBC News)
    - 2026 Ebola epidemic
    - The International Red Cross announces that three of its local volunteers have
      died from Ebola while working in the Djugu Territory, Ituri Province, Democratic
      Republic of the Congo (DRC), in March. (CBS News)
    - India issues a travel advisory to Uganda, Democratic Republic of the Congo,
      and South Sudan amidst the Ebola outbreak. (The Hindu)
    - Uganda's health ministry confirms three new Ebola cases, a woman who traveled
      from the DRC and two Ugandan workers that had contact with her, bringing the
      country's total to five cases and one death. (RFI)
    - An Ebola clinic run by Doctors Without Borders is set on fire by residents in
      Mongbwalu, Djugu Territory, Ituri Province, DRC. (AP)
    - France–Israel relations, Blockade of the Gaza Strip
    - France permanently bans Israeli national security minister Itamar Ben-Gvir following
      his actions towards members of the Global Sumud Flotilla who were detained by
      the Israeli Navy several days earlier. (Politico)
    - Ukraine–Vietnam relations, Kazakhstan–Ukraine relations
    - In accordance with bilateral agreements, Vietnam grants 40 scholarships to Ukrainians
      for the 2026–2027 academic year for bachelor's, master's, and postgraduate degrees,
      including a one-year language course for those who do not speak Vietnamese.
      Kazakhstan also grants 40 scholarships for similar degrees. (Interfax-Ukraine)
    - May 2026 White House shooting
    - A gunman opens fire at a security checkpoint outside the White House in Washington,
      D.C., wounding a bystander, with the suspect killed by Secret Service guards.
      (AP) (Reuters)
    - Turkey–Islamic State conflict
    - The Syrian General Intelligence Directorate and the Turkish National Intelligence
      Organization conduct a joint operation in Syria and arrest ten people allegedly
      linked with ISIL. (Al Jazeera)
    - 2024–present Serbian anti-corruption protests
    - Tens of thousands of people rally in Belgrade, Serbia, to protest against the
      government and president Aleksandar Vučić, and call for earlier parliamentary
      and presidential elections. (Al Jazeera) (AFP via France 24)
    - Thousands of people march through Madrid, Spain, demanding the resignation of
      prime minister Pedro Sánchez following several corruption scandals involving
      his cabinet and his family. (Reuters)
    - 2026 EFL play-offs
    - 2025–26 EFL Championship
    - 2026 EFL Championship play-off final
    - In association football, amid the expulsion of Southampton F.C. due to the espionage
      incident, Hull City beat Middlesborugh at Wembley Stadium in London 1–0 in the
      play-off finals to secure promotion to the English Premier League for the next
      season. (The Athletic) (BBC Sport)
    - 2026 FIFA World Cup
    - Iran at the FIFA World Cup
    - The Iran national football team moves its squad's base to Tijuana, Mexico, with
      approval from FIFA to avoid visa-related issues with the United States. (Al
      Jazeera)
    - DR Congo at the FIFA World Cup
    - The DR Congo national football team announces that it will maintain its planned
      schedule, including two friendly matches in Belgium and Spain, before going
      to Houston, Texas, United States, for the World Cup, despite being warned to
      isolate, stating the entire squad is based outside of the DRC. (Reuters)
    - 2025–26 Scottish Cup
    - 2026 Scottish Cup final
    - In association football, Celtic beat second-tier Dunfermline Athletic 3–1 to
      win a record-extending 43th Scottish Cup title and complete the double this
      season. (BBC Sport) (ESPN)
    - 2025–26 UEFA Women's Champions League
    - 2026 UEFA Women's Champions League final
    - In women's association football, Spain's FC Barcelona beat France's OL Lyonnes
      4–0 to win their fourth Women's Champions League title at the Ullevaal Stadium
      in Oslo, Norway. (BBC Sport) (The Guardian)
    - 2025–26 AFC Women's Champions League
    - 2026 AFC Women's Champions League final
    - In women's association football, North Korea's Naegohyang beat Japan's Tokyo
      Verdy 1–0 to win the AFC Women's Champions League at the Suwon Sports Complex
      in Suwon, Gyeonggi Province, South Korea. (The Guardian)
    - 2025–26 European Rugby Champions Cup
    - 2026 European Rugby Champions Cup final
    - In rugby union, Union Bordeaux Bègles beat Leinster Rugby 41–19 at the San Mamés
      Stadium in Bilbao, Basque County, Spain, to win the European Rugby Champions
      Cup, thus completing a treble. (BBC Sport)
    - 2025–26 Ekstraklasa
    - In association football, Lech Poznań end their season with a second consecutive
      and 10th-ever Ekstraklasa title. (beIN Sports)
