wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - Pakistani deputy prime minister and foreign minister Ishaq Dar says that Pakistan
      is focusing on making the current ceasefire between Iran and the United States
      permanent. (Pakistan Today)
    - Axios reports that Iran and the U.S. are closing in on a one-page memorandum
      to end the war and set a framework for negotiations regarding Iran's nuclear
      program. (Axios) (Reuters)
    - 2026 Strait of Hormuz crisis
    - 2026 Iran war regional mobilizations
    - France deploys the aircraft carrier Charles de Gaulle and its strike group to
      the Red Sea ahead of a proposed British–French mission aimed at securing maritime
      traffic in the Strait of Hormuz. (AP)
    - Ships attacked during the 2026 Iran war
    - French shipping company CMA CGM says that one of its container ships, San Antonio,
      was attacked yesterday while transiting through the Strait of Hormuz. (AFP via
      Arab News) (Times of Israel)
    - The Islamic Revolutionary Guard Corps Navy says that safe passage on the Strait
      of Hormuz will be assured with new procedures and guidelines following the U.S.
      pause in Operation Project Freedom. (Reuters)
    - 2026 United States military buildup in the Middle East
    - USS Gerald R. Ford officially exits the Mediterranean Sea and enters the Atlantic
      Ocean after its longest deployment since the Cold War during which it participated
      in both the Iran war and the Maduro raid. (USNI) (Stars and Stripes)
    - 2026 Lebanon war
    - Israeli attacks on the Lebanese health sector during the Israel-Hezbollah conflict
    - 16 people are killed and 21 are injured including three paramedics by Israeli
      drone strikes and airstrikes across southern Lebanon despite the ceasefire.
      (AA)
    - Israel carries out an airstrike against a building in Beirut, allegedly killing
      a top commander of Hezbollah's Radwan Force. It is the first strike in the capital
      since the ceasefire started on April 16. (Reuters)
    - 2026 Mali offensives
    - At least 35 people are killed in coordinated attacks in central Mali that are
      claimed by Jama'at Nusrat al-Islam wal-Muslimin. (AFP via LBCI)
    - Sudanese civil war
    - The Sudan Doctors Network says that the death toll from drone strikes launched
      yesterday by the Rapid Support Forces in Kosti, White Nile has risen to 235
      after laboratory doctor Adel Musa al-Tijani was killed in the drone strike.
      (Sudan Tribune)
    - Ethiopia and the United Arab Emirates deny Sudan's accusations that they were
      responsible for the May 4 drone attack on Khartoum International Airport. (BBC
      News) (Medafrica Times) (Khaleej Times)
    - Economic impact of the 2026 Iran war
    - Gold prices rise to more than a one-week high following reports that Iran and
      the U.S. may be nearing a peace deal to end the war. (CNBC)
    - Hungary–Ukraine relations
    - Ukrainian president announces that Hungary has returned cash and gold seized
      from Ukraine's Oschadbank after outgoing Hungarian prime minister Viktor Orbán
      ordered the government to keep the cash and gold for 60 days. (Euronews)
    - 2026 North Musi Rawas collision
    - At least 16 people are killed and four others are injured when a passenger bus
      crashes into a tanker truck in Sumatra, Indonesia. (AFP via Al Arabiya)
    - At least 12 people are killed and 21 others are injured in two separate road
      accidents in Eastern Cape, South Africa. (Xinhua)
    - MV Hondius hantavirus outbreak
    - Three passengers infected with hantavirus pulmonary syndrome from the Andes
      virus are evacuated off the cruise ship while it is stationed off the coast
      of Cape Verde to receive treatment in the Netherlands. At least 145 people remain
      on board, including two suspected asymptomatic cases. (ABC News) (NBC News)
      (Fox News)
    - Spanish authorities allow the ship to dock at the Canary Islands as several
      passengers are Spanish citizens. (BBC News) (Reuters)
    - 2026 Strait of Hormuz crisis, China in the 2026 Iran war, China–Iran relations
    - Chinese foreign minister Wang Yi and Iranian foreign minister Abbas Araghchi
      meet in Beijing, China, to discuss reopening the Strait of Hormuz, among other
      related topics, ahead of potential Iran–U.S. talks. (Al-Monitor) (Times of Israel)
    - Ivory Coast dissolves its election commission following criticism over its management
      and independence, with authorities planning to establish a new electoral administration
      system. (Reuters)
    - North Korea drops mention of unification with South Korea from its constitution.
      (Euronews)
    - AirAsia purchases 150 Airbus A220 aircraft from Airbus, the largest single aircraft
      order in Canadian history, with options for 150 more if Airbus develops a stretched
      version.
