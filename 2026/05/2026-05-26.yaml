wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Israeli airstrikes across eastern and southern Lebanon kill at least 31 people
      and injure dozens more, as Hezbollah and Israel report intensified ground operations
      and cross-border attacks despite an existing ceasefire. (AFP via France 24)
    - Gaza war
    - Israel says that it has killed the new military chief of Hamas, Mohamed Odeh,
      just 11 days after his predecessor was killed. (AFP via Arab News) (Ynet)
    - Sudanese civil war
    - 2026 Blue Nile campaign
    - Sudanese Armed Forces announce that they have recaptured four more towns in
      the Blue Nile region following clashes with the Rapid Support Forces and the
      Sudan People's Liberation Movement–North. (AFP via TRT World) (Sudan Tribune)
    - BP chairperson Albert Manifold is removed with immediate effect over "serious"
      conduct concerns. (BBC News)
    - Uzbekistan resumes the export of gold in April with an export of US$1.5 billion
      following a six-month pause. (Bloomberg) (Zamin)
    - 2026 Longview, Washington implosion
    - One person is killed, ten people are injured, and nine others are missing in
      a major chemical explosion at a paper mill in Longview, Washington, United States.
      (AP) (BBC News)
    - Buggenhout train collision
    - Four people, including two children, are killed, and five more are injured in
      a collision between a train and a school bus in Buggenhout, Belgium. (BBC News)
      (CNN)
    - Six people are killed after a house fire in the village of Yuryevka, Omsk Oblast,
      Russia. (Reuters) (Xinhua)
    - Six people are killed after entering an under-construction septic tank in Kalahandi
      District, India. (Azerbaijan) (Xinhua)
    - Three people are killed and three others are injured after an overpass collapses
      in Seoul, South Korea. (AP) (The Korea Herald) (Xinhua)
    - One person is killed and eleven others are injured after a magnitude 4.6 earthquake
      in Jhelum District, Punjab, Pakistan. (Pakistan Today)
    - 2026 Ebola epidemic
    - The Bahamas announces enhanced health screening and possible quarantine measures
      for travelers who recently visited the Democratic Republic of the Congo (DRC),
      South Sudan, and Uganda following the Ebola epidemic in central Africa. (Reuters)
    - Canada announces a 90-day entry ban on residents of the DRC, South Sudan, and
      Uganda and imposes quarantine measures on some travelers following the Ebola
      epidemic. (Reuters)
    - Russian health minister Mikhail Murashko says that Russia has developed a breakthrough
      vaccine for the Bundibugyo ebolavirus strain of the disease. (Health and Me)
    - The United States announces plans to send health officers to Kenya to open a
      potential quarantine facility amidst the Ebola epidemic. (Reuters)
    - Mexican drug war
    - Mexico arrests Isai Martínez Zepeda, identified by authorities as a nephew of
      imprisoned former Sinaloa Cartel leader El Chapo, in Sonora. (AFP via Vanguard)
    - Trial of Jeffrey Donaldson
    - A jury is sworn in for the criminal trial of former Northern Irish MP Jeffrey
      Donaldson for sexual offences, which is to begin at 10:30 the following day.
      His wife Eleanor is undergoing a separate trial of the facts as she was deemed
      to be unfit to stand trial by medical experts. (Demócrata) (RTÉ)
    - American football player Josh Jacobs is arrested in Wisconsin on five charges
      of domestic violence. (ESPN) (Reuters)
    - 2025–2026 United States redistricting
    - The South Carolina Senate rejects a redistricting effort to change the congressional
      districts in the U.S. state of South Carolina before the upcoming U.S. midterm
      elections. (Al Jazeera) (The Hill) (NPR)
    - 2026 Bolivian protests
    - The Chamber of Deputies of Bolivia approves legislation allowing president Rodrigo
      Paz to declare a state of emergency and deploy the military amid anti-government
      protests over economic conditions in the country. (AFP via Barron's)
    - 2028 United States presidential election
    - American television writer Dan Greaney announces that he will run for the Republican
      nomination to succeed incumbent U.S. president Donald Trump in 2028. (The Independent)
      (People.com)
