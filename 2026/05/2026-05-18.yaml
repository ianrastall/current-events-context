wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan reportedly shares a revised proposal with the United States from Iran
      aimed at ending the war. (Reuters)
    - Iranian foreign ministry spokesperson Esmaeil Baghaei says that talks between
      Iran and the U.S. are still ongoing via Pakistani mediation. (AA)
    - 2026 Strait of Hormuz crisis
    - Iran's Persian Gulf Strait Authority announces that any passage through the
      Strait of Hormuz that is not coordinated with it and the Iranian armed forces
      is "illegal". (Al Jazeera)
    - U.S. president Donald Trump announces that he has called off planned military
      strikes against Iran for tomorrow at the request of Middle East allies including
      Qatari emir Tamim bin Hamad Al Thani, Saudi crown prince Mohammed bin Salman,
      and Emirati president Mohamed bin Zayed Al Nahyan, citing "serious negotiations"
      taking place. (PBS) (Middle East Eye)
    - 2026 Lebanon war
    - Hezbollah–Israel conflict
    - Hezbollah states that it shot down an Israeli military aircraft over Ayta al-Jabal
      in southern Lebanon. (Al Jazeera)
    - The Lebanese health ministry announces that the death toll has surpassed 3,000
      people, with at least 3,020 people killed and 9,273 wounded since the war began
      on March 2. (Al Jazeera)
    - Sudanese civil war
    - Kordofan campaign
    - Sudanese Armed Forces breaks the siege in Dilling, South Kordofan, for a third
      time. (Sudan Tribune)
    - War crimes during the Sudanese civil war
    - It is reported that Rapid Support Forces has released commander Abu Lulu after
      previously being arrested last year after videos were seen of him executing
      and massacring civilians in El Fasher, Sudan. He is back in combat following
      his release. (Reuters)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - Oil prices rise amid fears of a prolonged war and the draining of world oil
      reserves, including West Texas Intermediate to US$102.76 per barrel and Brent
      Crude to US$112.89 per barrel. (The Wall Street Journal)
    - Australia–China relations
    - Australian treasurer Jim Chalmers orders several China-linked shareholders to
      divest their stakes in Northern Minerals under foreign investment laws aimed
      at protecting the country's rare earths sector. (AFP via HKFP)
    - At least 13 people are killed and more than 20 others are injured, most seriously,
      when a tempo carrying wedding guests collides with a container truck on the
      Mumbai-Ahmedabad Highway in Palghar district, Maharashtra, India. (CNN-News18)
    - Five students drown while swimming in the Lô River in Phú Thọ province, Vietnam.
      (Xinhua)
    - Three people are killed and four others are missing after flash floods caused
      a river to overflow in Xuan'en County, Hubei Province, China. (Xinhua)
    - 2026 Ebola epidemic
    - The U.S. Centers for Disease Control and Prevention announces that it is suspending
      entry into the United States for 30 days to travelers without a U.S. passport
      that have been to the Democratic Republic of the Congo, South Sudan, or Uganda
      amidst the ongoing Ebola outbreak in these countries. (Politico)
    - MV Hondius hantavirus outbreak
    - ', the cruise ship at center of the hantavirus outbreak, arrives at the Port
      of Rotterdam in the Netherlands for disinfection after passengers disembarked
      the ship. (Reuters) (Travel and Tour World)'
    - 2026 Cuban crisis, Cuba–United States relations
    - The U.S. Office of Foreign Assets Control imposes sanctions on Cuba's intelligence
      agency and several senior Communist Party and military officials as part of
      expanded pressure on the government amid the country's energy and financial
      crisis. (AFP via Arab News)
    - Pakistan–Saudi Arabia relations
    - Pakistan deploys 8,000 troops, HQ-9 air defense systems, and a full air force
      squadron, mostly of JF-17 fighter jets, to assist Saudi Arabia under their mutual
      defense agreement. (Reuters)
    - 2026 Bolivian protests
    - Prosecutors in Bolivia issue an arrest warrant for Mario Argollo, general secretary
      of the Bolivian Workers' Center, on charges including terrorism and incitement
      amid protests and road blockades in La Paz. (AFP via Indo Premier)
    - 2026 Islamic Center of San Diego shooting
    - Three people are killed in a drive-by shooting outside a mosque in San Diego,
      California, United States. Both of the perpetrators die by suicide. (AFP via
      France 24) (BNO News)
    - 2026 Mersin shooting
    - Six people are killed and eight others are injured in a shooting spree, including
      one inside a restaurant, in Mersin, Mediterranean Region, Turkey. A widespread
      manhunt is underway to catch the suspect. (Mersin Haber in Turkish) (CBS News)
    - Protests against the 2026 Iran war, Economy of Kenya
    - Four people are killed and more than 30 others are injured in nationwide protests
      and transport strikes triggered by a massive surge in fuel prices due to the
      Iran war, which has raised petroleum costs by more than 20% to record highs
      in Nairobi, Kenya. (BBC News) (Reuters)
    - Abnub shooting
    - Eight people are killed and five others are injured in a mass shooting at a
      crowded transportation hub in Abnub, Asyut Governorate, Egypt. The perpetrator
      is killed by security forces. (AFP via Al Arabiya)
    - Two people are killed and four others are seriously injured in a mass shooting
      at a home in El Ejido, Andalusia, Spain. The perpetrator is arrested. (Reuters)
    - Second impeachment of Sara Duterte
    - The Philippine senate resumes the impeachment process against Vice President
      Sara Duterte following last week's lockdown. (Reuters)
    - The Belarusian defence ministry announces that its military has began joint
      training exercises with Russia on nuclear weapons combat. (Al Jazeera)
    - World Gymnastics lifts its ban on Russian and Belarusian athletes, allowing
      them to compete with their flags and anthems in all five disciplines governed
      by the organization, including artistic, rhythmic, acrobatic, and aerobic gymnastics,
      as well as trampolining. (BBC Sports via Yahoo Sports)
