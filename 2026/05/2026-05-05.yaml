wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - U.S. secretary of state Marco Rubio and U.S. military leaders, including U.S.
      defense secretary Pete Hegseth, say that the ceasefire is holding despite recent
      attacks on the United Arab Emirates and Strait of Hormuz. (Times of Israel)
      (Reuters)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - U.S. president Donald Trump announces a pause in Operation Project Freedom aimed
      at helping ships transit the Strait of Hormuz, citing Pakistan's request to
      do so and progress in negotiations. (CNBC) (Arab News PK)
    - Rubio announces that Operation Epic Fury, the codename for the initial phase
      of U.S. military operations in the war with Iran, has concluded. (The Hill)
      (Time)
    - Israeli–Palestinian conflict
    - Gaza war
    - The Israel Defense Forces confirms that Hamas Nukhba commander Anas Muhammad
      Ibrahim Hamed, who took part in the October 7, 2023 attacks including the Nova
      music festival massacre, was eliminated in a airstrike yesterday in the central
      Gaza Strip. (Israel National News) (Times of Israel)
    - Sudanese civil war
    - Ethiopia–Sudan relations
    - The Sudan News Agency reports that Sudan has recalled its ambassador to Ethiopia,
      accusing them of involvement in recent drone strikes targeting the airport in
      Khartoum. (EWN)
    - Five people are killed and nine others are injured following a drone strike
      launched by the Rapid Support Forces on two fuel stations in Kosti, White Nile.
      (Sudan Tribune)
    - Boko Haram insurgency
    - Boko Haram militants attack a Chadian military base on the shores of Lake Chad,
      killing 23 security personnel and injuring dozens of others. (DW)
    - Russo-Ukrainian war
    - At least 27 people are killed and more than 80 injured in Russian drone and
      missile attacks on Ukraine. (Al Jazeera)
    - Great Israeli Real Estate Event
    - Anti-Israeli protests are held outside the Park East Synagogue in New York City,
      U.S., after the synagogue hosted the Great Israeli Real Estate Event, an expo
      for land sales in both Israel and the occupied West Bank. (Jewish Insider) (The
      New York Times) (Times of Israel)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - Kentucky governor Andy Beshear announces emergency regulations in effort to
      combat the high gas prices in Kentucky as a result of the war. (Kentucky Today)
      (Reuters)
    - As a result of the motion of no confidence against Romanian prime minister Ilie
      Bolojan, exchange rates between the Romanian leu and the euro rise to their
      highest level in history as the leu's value plummets. (Economica.net ) (Digi
      FM )
    - More than twenty people are killed over the past 24 hours in storms, heavy rainfall,
      and lightning strikes across Bihar, India. (The Hans India)
    - Fourteen people are killed in a road accident involving a bus in Mutoko District,
      Zimbabwe. (The Star)
    - Eight people are killed and 41 others are injured in a fire at a commercial
      complex in Andisheh, Tehran province, Iran. (AA)
    - COVID-19 drug development
    - German biotechnology company BioNTech announces it will halt production of its
      COVID-19 vaccine due to drastic restructuring plans, leaving sole production
      of the vaccine to its partner Pfizer. (DW) (Wall Street Journal)
    - Mass shootings in the United States
    - Two people are killed and three others injured in a mass shooting at a Korean
      supermarket in Carrollton, Texas, U.S., after a 69-year-old man opened fire
      on his coworkers at a business meeting. The suspect is taken into custody. (NBC
      News)
    - 2026 Rio Branco school shooting
    - Two people are killed and seven others are injured in a school shooting in Rio
      Branco, Acre, Brazil. A 13-year-old suspect is taken into custody. (Xinhua)
      (Central Brasileira de Notícias in Portuguese)
    - In Pasig, Philippines, the National Bureau of Investigation arrests the founder
      of an online news site, Peanut Gallery Media Network, and four other people,
      in an entrapment operation for an alleged extortion attempt on former House
      speaker Martin Romualdez. (Gulf News) (PNA)
    - Politics of Romania
    - The Parliament of Romania votes 281–4 to pass a motion of no confidence, called
      by the Social Democratic Party and Alliance for the Union of Romanians, against
      prime minister Ilie Bolojan. (AP) (AFP via France 24)
    - President Nicușor Dan refuses the possibility of holding snap elections, saying
      that a new government will be formed comprising a coalition of pro-Western parties.
      (Radio Romania )
    - Louise Arbour is announced by prime minister Mark Carney as the next governor
      general of Canada. (The Guardian)
    - The Ugandan parliament passes the Protection of Sovereignty Bill, which restricts
      foreign involvement in policymaking without government approval and imposes
      penalties of up to 10 years' imprisonment for violations. (Reuters)
