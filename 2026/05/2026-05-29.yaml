wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - Iranian state media says that Iran shot down an American aircraft near the city
      of Jam, Bushehr province. However, the U.S. Central Command denies any such
      claim, stating that no U.S. aircraft has been shot down. (Middle East Eye) (Reuters)
    - 2026 Lebanon war
    - Three people, including two children, are killed and fifteen others are injured
      in an Israeli airstrike in Choueifat, Mount Lebanon Governorate, Lebanon. (Naharnet)
    - Russo-Ukrainian war
    - Violations of non-combatant airspace during the Russo-Ukrainian war, Russia–NATO
      relations
    - A Russian drone enters Romanian airspace during an attack on Ukraine and crashes
      into an apartment building in Galați, causing a fire and injuring two people.
      (AFP and CBS News)
    - Sudanese civil war
    - Kordofan campaign
    - The Sudan Doctors Network accuse the Rapid Support Forces of killing 27 civilians
      in the Al-Murra village in the Bara area of North Kordofan, Sudan, during the
      second day of the Islamic holiday Eid al-Adha. (AA)
    - Allied Democratic Forces insurgency
    - A human rights group reports that more than 100 people were killed by Allied
      Democratic Forces attacks during May in the Mambasa Territory, Ituri Province,
      Democratic Republic of the Congo (DRC). (Radio Okapi in French)
    - Five people are killed and 34 others are injured when a bus collides with six
      vehicles on Interstate 95 in Stafford County, Virginia, United States. (AP)
      (BBC News)
    - 2026 Ebola epidemic
    - Mexican airlines Aeroméxico, Viva, and Volaris restrict travel to Mexico for
      passengers who have been in the DRC, South Sudan, or Uganda within the previous
      21 days, citing the ongoing Ebola outbreak in central Africa. (AFP via The Straits
      Times)
    - Nigeria restricts inbound flights from the DRC, South Sudan, and Uganda amidst
      the spread of Ebola. (The Guardian)
    - 2026 Gilgil school fire
    - The fire at a girls school in Gilgil, Nakuru County, Kenya yesterday is investigated
      as an arson attack. Eight students of the academy are arrested as suspects.
      Separately, the school's board of management is dissolved amidst suspicions
      of negligence in fire safety measures. (BBC News)
    - LGBTQ rights in Ghana
    - The Ghanaian parliament approves legislation that criminalizes same-sex relations
      and the promotion or support of LGBTQ activities, with penalties including imprisonment.
      (AFP via RFI) (Reuters)
    - Iran and weapons of mass destruction
    - International Atomic Energy Agency director Rafael Grossi says that Kazakhstan
      is open to taking custody of Iran's enriched uranium if a deal is reached on
      their nuclear program. (Middle East Eye)
    - 2025–26 NHL season
    - In ice hockey, the NHL's Carolina Hurricanes beat the Montreal Canadiens in
      five games during the Eastern Conference Final to advance to the Stanley Cup
      Final, making it their first appearance in the Stanley Cup since 2006. (The
      Guardian) (NHL.com)
    - International sporting sanctions during the Russian invasion of Ukraine
    - The International Ice Hockey Federation says that it will decide regarding Russia's
      participation in the upcoming season on a case-by-case basis, following a January
      decision that lifted the ban on Russian teams. (ESPN)
