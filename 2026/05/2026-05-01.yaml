wikipedia:
  categories:
    Uncategorized:
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - State media IRNA reports that Iran has sent a proposal for negotiations with
      the United States to mediators from Pakistan in an effort to end the Iran war.
      (Reuters)
    - Terrorism in the United Kingdom, 2026 London antisemitic attacks
    - 2026 Golders Green attack, Antisemitism during the 2026 Iran war
    - A 45-year-old man is charged with three counts of attempted murder after attacking
      three people in London, England, on Wednesday. (BBC News)
    - 2026 United States military buildup in the Middle East
    - USS Gerald R. Ford officially exits the Middle East after taking part in operations
      in Iran during the war, leaving only the USS Abraham Lincoln and USS George
      H. W. Bush in the region. (AFP via The Straits Times)
    - U.S. president Donald Trump notifies Congress that it is planning to close the
      Civil-Military Coordination Center. The Board of Peace denies such reports.
      (The Times of Israel)
    - Mali War
    - 2026 Mali attacks
    - Jihadist group Jama'at Nusrat al-Islam wal-Muslimin takes over a base outside
      of Tessalit, Kidal Region, Mali, after it is abandoned by Malian troops and
      Russia's Africa Corps. (AFP via Barron's)
    - Al Qaeda-linked insurgents call for Malians to rise up against the Mali military
      junta and transition to Sharia law. (Reuters)
    - Myanmar civil war
    - Six civilians are killed and nine more were injured after the military junta
      bombed a village in Falam Township, Chin State. (BNI) in Burmese
    - Dissident Irish republican campaign
    - A 66-year-old man is charged with several offences, including terrorism, following
      a car bombing outside of a police station in Dunmurry, Belfast, Northern Ireland.
      (Sky News)
    - World War II bomb disposal in Europe
    - A World War II-era German SC250 bomb is safely detonated by the British Army
      in Plymouth, England, following its discovery on a building site that prompted
      the emergency evacuation of 1,000 homes. (BBC News)
    - Crisis in Venezuela
    - Venezuelan acting president Delcy Rodríguez raises the minimum income package
      by 26.3% to US$240 and increases pensions to $70, as the government responds
      to protests over low wages amid high inflation. (AFP via France 24)
    - Fourteen Islamic Revolutionary Guard Corps members are killed and two others
      are injured when an unexploded ordnance detonated in Zanjan province, Iran.
      (Al Jazeera)
    - Eleven people are killed after a passenger bus carrying medical staff and patients
      collided head-on with a truck near Otjiwarongo, Namibia. (Xinhua)
    - At least eleven people are killed and 31 others are injured when a passenger
      bus veers off a highway and overturns near Amatlán de Cañas, Nayarit, Mexico.
      (Reuters)
    - Nine people are killed, including two children, when a cruise boat capsizes
      in the Bargi Dam in Jabalpur, Madhya Pradesh, India. (Hindustan Times)
    - Three people are killed and 30 others are injured after a minibus rolls over
      in Balıkesir, Turkey. (AA in Turkish)
    - Three people are killed and two others are injured when a bridge collapses in
      Jammu, Jammu and Kashmir, India. (India Today)
    - A gold mine collapses in a remote area of the Shahri Buzurg District of Badakhshan
      province, Afghanistan, killing five people including two children. (KabulNow)
    - Russia–European Union relations, Legality of the 2022 Russian invasion of Ukraine
    - The European Parliament adopts a resolution supporting the establishment of
      a special tribunal to prosecute Russian leaders for crimes related to the war
      in Ukraine and calls for sanctions to remain until a peace agreement is fully
      implemented. (Euromaidan Press)
    - 2026 May Day protests
    - 2025–2026 Turkish protests
    - Turkish police arrest at least 57 people and use tear gas to disperse May Day
      demonstrators in Istanbul, where authorities block access to Taksim Square to
      prevent marches. (AFP via FMT)
    - Protests and demonstrations are held worldwide on May Day to call for peace,
      higher wages and better working conditions. Additionally, protests are held
      against the Iran war and the global energy and fuel crisis caused by the war.
      (PBS) (Common Dreams)
    - A Labour Day rally organized by Kilusang Mayo Uno is held in Manila, Philippines.
      During the rally, protesters attempt to storm the U.S. embassy to demand an
      end to the Iran war and clash with police, injuring seven officers. (Philippine
      Daily Inquirer) (Xinhua)
    - May Day protests are held across the U.S., including an economic blackout as
      part of 3,500 "May Day Strong" events across the country. Additionally, demonstrations
      are held outside institutions such as the New York Stock Exchange. (Time) (The
      Guardian)
    - Connections of Jeffrey Epstein
    - Leon Botstein, president of Bard College in New York, U.S., announces his retirement
      over his ties to the late financier and sex offender Jeffrey Epstein. (AP) (The
      Independent)
    - Killing of Kumanjayi Little Baby
    - Members of Alice Springs' Aboriginal community in Northern Territory, Australia,
      clash with police outside a hospital where a man charged with the murder of
      a five-year-old Warlpiri girl is being treated, demanding the suspect be punished
      under traditional law. This follows a five-day search for the missing girl with
      large community participation before she was confirmed dead. (The Guardian)
    - Mexican drug war
    - Rubén Rocha Moya announces he will temporarily step down as governor of Sinaloa,
      Mexico, after the U.S. files charges alleging links to the Sinaloa Cartel. (Reuters)
    - The Renters' Rights Act 2025 formally enters force in England, banning Section
      21 notices (no-fault evictions), limiting rent increases to once per year, giving
      tenants the legal right to keep pets, abolishing assured shorthold tenancies,
      and making it illegal to discriminate against tenants based on them having children,
      or receiving benefits. (The Independent)
    - One person is killed and 11 others are injured in a vehicle-ramming attack in
      Chengdu, Sichuan, China. The suspect is arrested. (The Standard)
    - Spain's Civil Guard seizes between 30,000 to 45,000kg of cocaine on a cargo
      ship off the Canary Islands in what is the country's largest ever seizure of
      the illegal drug. Twenty people on board the vessel are arrested. (BBC News)
    - 2026 Antiguan general election
    - Official results from yesterday's election indicated that the ABLP led by Antiguan
      prime minister Gaston Browne won 15 of 17 seats, while UPP leader Jamale Pringle
      and BPM leader Trevor Walker each retained their own seats. Browne is sworn
      in for a fourth term in office. (Antigua.news) (AP)
