  - Crisis in Venezuela
  - Venezuelan acting president Delcy Rodríguez raises the minimum income package
    by 26.3% to US$240 and increases pensions to $70, as the government responds to
    protests over low wages amid high inflation. (AFP via France 24)
  - Fourteen Islamic Revolutionary Guard Corps members are killed and two others are
    injured when an unexploded ordnance detonated in Zanjan province, Iran. (Al Jazeera)
  - Eleven people are killed after a passenger bus carrying medical staff and patients
