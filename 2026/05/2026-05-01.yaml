  - Russia–European Union relations, Legality of the 2022 Russian invasion of Ukraine
  - The European Parliament adopts a resolution supporting the establishment of a
    special tribunal to prosecute Russian leaders for crimes related to the war in
    Ukraine and calls for sanctions to remain until a peace agreement is fully implemented.
    (Euromaidan Press)
  - 2026 May Day protests
  - 2025–2026 Turkish protests
  - Turkish police arrest at least 57 people and use tear gas to disperse May Day
    demonstrators in Istanbul, where authorities block access to Taksim Square to
    prevent marches. (AFP via FMT)
  - Protests and demonstrations are held worldwide on May Day to call for peace, higher
    wages and better working conditions. Additionally, protests are held against the
    Iran war and the global energy and fuel crisis caused by the war. (PBS) (Common
