    Guardian)
  - Killing of Sharon Granites
  - Members of Alice Springs' Aboriginal community in Northern Territory, Australia,
    clash with police outside a hospital where a man charged with the murder of a
    five-year-old Warlpiri girl is being treated, demanding the suspect be punished
    under traditional law. This follows a five-day search for the missing girl with
    large community participation before she was confirmed dead. (The Guardian)
  - The Renters' Rights Act 2025 formally enters force in England, banning Section
    21 notices (no-fault evictions), limiting rent increases to once per year, giving
    tenants the legal right to keep pets, abolishing assured shorthold tenancies,
    and making it illegal to discriminate against tenants based on them having children,
    or receiving benefits. (The Independent)
  - One person is killed and 11 others are injured in a vehicle-ramming attack in
    Chengdu, Sichuan, China. The suspect is arrested. (Sina in Chinese)
  - 2026 Antiguan general election
  - Official results from yesterday's election indicated that the ABLP led by Antiguan
    prime minister Gaston Browne won 15 of 17 seats, while UPP leader Jamale Pringle
    and BPM leader Trevor Walker each retained their own seats. Browne is sworn in
    for a fourth term in office. (Antigua.news) (AP)
