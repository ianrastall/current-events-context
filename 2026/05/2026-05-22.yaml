    in an effort to secure a peace deal between the United States and Iran to end
    the war. (Reuters) (Shafaq)
  - Iranian foreign minister Abbas Araghchi says that "excessive demands" by the U.S.
    are the main obstacle in the peace talks. (Al Jazeera)
  - An Iranian foreign ministry spokesman says that Iran will not agree to give its
    highly enriched uranium to the U.S. (Al Jazeera)
  - 2026 Strait of Hormuz crisis
  - A Qatari liquefied natural gas tanker crosses the Strait of Hormuz for the first
    time in nearly two weeks, bound from Ras Laffan to Tianjin, China. (Al Jazeera)
  - 2026 Lebanon war
  - 2026 Israel–Lebanon ceasefire
  - Six people are killed and six more injured in an Israeli airstrike in Deir Qanoun
    an-Naher. Two paramedics are among the fatalities, while three more are injured.
    (Al Jazeera)
  - A paramedic is killed and four more are injured in two separate Israeli airstrikes
    in Tyre District. (Al Jazeera)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war, Luhansk Oblast campaign
  - 2026 Starobilsk strike
  - Russian president Vladimir Putin says that a drone strike on a dormitory and school
    in Russian-occupied Luhansk Oblast has killed at least six people and injured
    dozens more, attributing the attack to Ukraine, but Ukraine's military described
    the comments from Russia as manipulation, saying it hit a drone command unit in
    Starobilsk. (ABC Australia) (AFP via Asharq Al-Awsat) (Reuters)
  - Peace negotiations in the Russo-Ukrainian war
  - U.S. secretary of state Marco Rubio says that no peace talks are currently taking
    place, but the United States is "ready" to play a role if they resume. (AA)
  - Mexico–European Union relations
  - Free Trade Agreement between Mexico and the European Union
  - Mexico and the European Union sign an updated trade agreement that reduces tariffs
    and expands market access. (AFP via RFI)
  - Israel–Netherlands relations
  - The Dutch cabinet approves a bill to ban the importation of goods from Israeli
    settlements, and will explore if the ban can be extended to services and investments.
    (NU.nl in Dutch)
  - The death toll from a building collapse in Fez, Morocco, yesterday rises to 15.
    (AFP via Arab News PK)
  - At least one person is killed and nine others are injured in an explosion at the
    petrochemical plant of MOL in Tiszaújváros, Borsod–Abaúj–Zemplén County, Hungary.
    (Reuters)
  - 2026 Ituri Province Ebola epidemic
  - The World Health Organization raises its assessment of the risk from the Ebola
    outbreak within the Democratic Republic of the Congo (DRC) from "high" to "very
    high" due to its rapid spread, while keeping it "low" at the global level. Director-general
    Tedros Adhanom Ghebreyesus says that the outbreak in Uganda is stable. (AA) (AP)
  - The Ituri provincial government orders funerals to be conducted only by specialized
    personnel, limits public gatherings to no more than fifty people, and suspends
    the local football league. (Reuters)
  - Rwanda imposes a travel ban on foreign nationals that have been to the DRC in
    the past thirty days, and requires a quarantine for Rwandan citizens or residents
    who have been there. (Reuters)
  - United Nations emergency relief coordinator Tom Fletcher announces that the organization
    is providing US$60 million in funding for the outbreak response. (Reuters)
  - Reactions to the 2026 Iran war, Taiwan–United States relations
  - Acting U.S. navy secretary Hung Cao says that the United States has put on hold
    US$14 billion of arms sales to Taiwan to preserve munitions during the Iran war.
    (Al Jazeera)
  - NATO conducts Operation Arcade Strike, an exercise in drone warfare, at an unused
    platform of the London Underground's Charing Cross tube station to be prepared
    for potential conflict with Russia by 2030. (The Independent) (The New Voice of
    Ukraine)
  - 2026 Slovenian parliamentary election
  - Slovenia elects Democratic Party leader Janez Janša as prime minister after lawmakers
    approve a minority coalition government, replacing former prime minister Robert
    Golob of the Freedom Movement. (AFP via The Times of Israel) (Bloomberg)
