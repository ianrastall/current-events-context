  - 2026 Iran war ceasefire
  - Pakistan in the 2026 Iran war
  - Pakistan Army field marshal Asim Munir visits Tehran, Iran, in a effort to broker
    a ceasefire deal between Iran and the United States to end the war. (AFP via The
    Daily Star) (Axios)
