wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Iran confirms that it has sent a proposal to the United States for ceasefire
      talks including a withdrawal of American troops from areas close to Iran, an
      end to all conflicts in the region, and compensation for damages caused by the
      war. (VOV)
    - United States vice president JD Vance says that progress has been made in talks
      with Iran regarding its nuclear program. However, he also stated that the U.S.
      is ready to resume strikes if talks fail. (Israel National News)
    - Regime change efforts in the 2026 Iran war
    - The New York Times reports that the early goal of Israel and the U.S. following
      the assassination of former supreme leader Ali Khamenei was to install former
      Iranian president Mahmoud Ahmadinejad, who reportedly survived a strike on his
      home himself, despite making inflammatory comments about Israel. (Jerusalem
      Post) (AA)
    - Gaza war
    - Israeli blockade of the Gaza Strip
    - The Israeli Navy intercepts a flotilla boat taking part in the Global Sumud
      Flotilla that was to be headed for the Gaza Strip in a effort to break the blockade.
      (The Jerusalem Post)
    - Syrian conflict
    - A Syrian soldier is killed and at least twelve others are injured in a car bomb
      explosion in Damascus. (The New Region)
    - 2026 Lebanon war
    - Israeli airstrikes kill 19 people and injure 34 in the Nabatieh District and
      the Tyre District, Lebanon. (Al Jazeera) (Al Jazeera)
    - Israel seizes control of approximately of territory across the Gaza Strip, Lebanon,
      and Syria, an area equivalent to roughly 5% of the country's landmass. (Financial
      Times)
    - Russo-Ukrainian war
    - Violations of non-combatant airspace during the Russo-Ukrainian war
    - Estonia reports that a Romanian NATO F-16 fighter jet shot down a drone, suspected
      to be of Ukrainian origin impacted by Russian electronic warfare mechanisms,
      over Estonian territory. (BBC News)
    - Sudanese civil war
    - Kordofan campaign
    - The Sudanese Emergency Lawyers reports that 28 people have been killed in a
      drone strike on a market in West Kordofan, Sudan. (Toronto Star)
    - Boko Haram insurgency
    - The U.S. African Command says that U.S. and Nigerian forces have launched airstrikes
      on a ISIS camp in Nigeria. (Peoples Gazette)
    - In literature, Taiwan Travelogue by Yang Shuang-zi and translated by Lin King
      wins the 2026 International Booker Prize. (BBC News)
    - 2026 California wildfires
    - At least 10,000 homes are evacuated amid spreading wildfires in Santa Rosa Island
      and Simi Valley, California, United States. (BBC News)
    - Ten people are killed in torrential rain and flooding in Guizhou, Hubei, and
      Hunan provinces, China. (Reuters)
    - The death toll from a pickup truck crash in Huanjiang Maonan Autonomous County,
      Guangxi, China, rises to ten after the bodies of nine missing people were recovered.
      (Reuters)
    - At least 27 people are injured in a earthquake off the coast of Ica Department,
      Peru. (DW )
    - 2026 Ebola epidemic
    - The death toll in the Ebola outbreak in eastern Democratic Republic of the Congo
      rises to 131. (Reuters)
    - Sudan begins implementing Ebola measures, including screening passengers at
      the international airport in Port Sudan. (Sudan Tribune)
    - 2023–2026 mpox epidemic
    - Thailand reports two cases of mpox, prompting the Department of Disease Control
      to increase surveillance of the disease. (Nation Thailand)
    - Taiwan reports its first case of the transmissible mpox clade Ib variant in
      a man in his 20s in northern Taiwan. (Taiwan News)
    - 2020–2026 H5N1 outbreak
    - Norway reports the first recorded case of avian influenza in a polar bear in
      Europe after the H5N5 virus was detected in the animal in Svalbard. (AFP via
      GMA News Online)
    - Israel–Somaliland relations
    - Somaliland announces that the country will open an embassy in Jerusalem to strengthen
      its ties with Israel, for now the only country to recognize Somaliland as an
      independent nation. Israel announces that it will reciprocrate by opening an
      embassy in Hargeisa. (Reuters)
    - The cabinet of Thailand approves plans to reduce the length of visa-free stays
      for travelers from more than 90 countries as part of measures targeting crimes
      involving foreign nationals. (AFP via ABS-CBN News)
    - Corruption in Spain
    - Former Spanish prime minister José Luis Rodríguez Zapatero is charged with money
      laundering and membership of a criminal organisation in connection with an investigation
      into the alleged laundering of the €53 million public bailout that incumbent
      prime minister Pedro Sánchez's second government provided to the airline Plus
      Ultra and La Liga Airlines in 2021. (Politico)
    - Catalonian police arrest Jonathan Andic, the son of Mango founder Isak Andic,
      as part of an investigation into Isak's death during a hiking trip to Collbató
      in 2024. (AFP via Cebu Daily News)
    - Vietnamese police arrest five Chinese nationals and a local accused of operating
      a gold smuggling network in Hanoi that allegedly traded more than US$45 million
      worth of gold. (AFP via New Straits Times)
    - Three people, including two Japanese nationals and a Chinese national, are injured
      in a stabbing attack at a restaurant in Shanghai, China. (AP)
    - Constitutional crisis in Somalia, 2026 Somali presidential election
    - Controversies of Hassan Sheikh Mohamud
    - Opposition coalition Somali Future Council says Somali president Hassan Sheikh
      Mohamud can no longer perform key presidential functions, including military
      oversight or dismissing government officials. They propose that parliamentary
      speaker Aden Madobe serve as acting president until elections scheduled for
      30 June. The president has lost full executive authority following the expiry
      of his mandate on 15 May. (Idil News)
    - 2026 Bolivian protests
    - Several banks close in La Paz as protests intensify across Bolivia, with demonstrators
      demanding the resignation of president Rodrigo Paz. (Reuters)
    - Reactions to the 2026 Iran war
    - The War Powers Resolution, requiring a halt to hostilities in Iran not approved
      by the United States Congress, passes a preliminary vote in the U.S. Senate
      by 50–47 following several failed attempts, after the defection of Louisiana
      Republican senator Bill Cassidy. (CNBC)
    - 2025–26 in English football
    - 2025–26 Premier League
    - In association football, Arsenal win the Premier League, their fourth Premier
      League title and 14th English title, with one match to spare, after runner-ups
      Manchester City fail to win against AFC Bournemouth at Dean Court. (London Evening
      Standard)
    - Southampton F.C. spying incident
    - The English Football League's Independent Disciplinary Commission expels Southampton
      from the 2026 EFL play-offs after finding the club guilty of spying on a Middlesbrough
      training session ahead of their semi-final match on 12 May, 2026, which Southampton
      won. Southampton are also found guilty of spying on Oxford United and Ipswich
      Town earlier this season, and will be deducted four points for the following
      season. (Sky Sports)
    - 2026 FIFA World Cup
    - The Athletic reports that FIFA is planning to ban the Iranian Lion and Sun flag
      and related apparel in World Cup stadiums during the upcoming games. (Iran International)
    - World Cup co-host United States allows the DR Congo football team to participate
      in the upcoming games in the country despite ebola concerns. (Al Jazeera)
