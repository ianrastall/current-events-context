wikipedia:
  categories:
    Uncategorized:
    - Middle East crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Tasnim News Agency reports that Iran has submitted a 14-point proposal to Pakistan
      via an intermediary. (AA)
    - United States president Donald Trump says that he is reviewing Iran's new proposal
      to end the war. (AP)
    - 2026 United States naval blockade of Iran
    - The U.S. Central Command says that the U.S. has redirected its 48th vessel attempting
      to exit or enter an Iranian port since the start of the blockade. (Middle East
      Monitor)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - Forty-one people have been killed in the last 24 hours in a series of Israeli
      airstrikes across multiple locations in Lebanon. (Al Jazeera)
    - Mali War
    - 2026 Mali offensives
    - EgyptAir cancels Hajj flights to and from Mali amidst a crisis in which separatist
      and Islamist militants are targeting the Malian military-led junta. (AFP via
      Arab News)
    - Sudanese civil war
    - Rapid Support Forces atrocities in Khartoum
    - Five civilians are killed in a drone strike launched by the Rapid Support Forces
      in Khartoum, Sudan. (Asharq Al-Awsat)
    - Economic impact of the 2026 Iran war
    - In the U.S., Spirit Airlines ceases operations following a failed government
      bailout deal and oil price surges amidst the Iran war. (CBS News) (AP)
    - The General Civil Aviation Authority says that the United Arab Emirates has
      resumed normal traffic operations and lifted temporary precautions imposed during
      the start of the war on February 28. (Khaleej Times)
    - 2026 Kenya floods
    - At least 10 people are killed after heavy rains cause flooding and landslides
      in several regions of Kenya. (Reuters)
    - 2026 Ōtsuchi wildfires
    - Wildfires in Ōtsuchi, Iwate Prefecture, Japan, are brought under control after
      burning about 1,600 hectares for 11 days, marking one of the country's largest
      fires in decades. (AFP via Dawn)
    - Sixteen people are killed and 21 others are injured when a truck carrying bamboo
      overturns in Naypyidaw, Myanmar. (Xinhua)
    - At least nine people are killed and several others are injured in a fire at
      a four-story residential building in Vivek Vihar, Shahdara district, Delhi,
      India. (CNN-News18)
    - Six people are killed and five others are rescued in a fire at a massage parlor
      in Lingbao City, Henan, China. (Xinhua)
    - Five people are killed after a truck lost its brakes and crashed into several
      vehicles near Jaén, Peru. (Infobae)
    - Three personnel of the District Reserve Guard are killed and another is injured
      after an improvised explosive device detonated during a demining operation in
      Kanker district, Chhattisgarh, India. (Hindustan Times)
    - Eswatini–Taiwan relations
    - Taiwanese president Lai Ching-te arrives in Eswatini after an earlier trip was
      cancelled when several countries revoked overflight permissions, a move attributed
      by Taiwanese officials to pressure from China. (AFP via The Caledonian-Record)
    - 2026 May Day protests
    - 2025–2026 Turkish protests
    - Lawyer associations say that all 576 protesters who were detained during yesterday’s
      May Day protests in Istanbul, Turkey, are released. (Turkish Minute)
    - 2026 Bolivian Air Force Lockheed C-130 crash
    - Bolivian law enforcement authorities arrest the pilot and co-pilot of a military
      cargo plane that crashed near El Alto International Airport, killing 22 people,
      and place them in pre-trial detention on involuntary manslaughter charges. (AFP
      via The Manila Times)
    - 2026 Niuean general election
    - Niueans vote to elect 20 members of the Assembly amid a cost-of-living crisis.
      Incumbent prime minister Dalton Tagelagi is running for re-election in Alofi
      South, seeking a third term in office. (Pacific Media Network)
    - 2026 Peruvian general election
    - The National Jury of Elections launches a comprehensive audit of Peru's presidential
      election first round after reported irregularities, with results showing leading
      candidates separated by a narrow margin and multiple contested tally sheets
      under review. (AFP via The Manila Times)
    - 2025–26 Polish Cup
    - "In association football, Górnik Zabrze\tbeats Raków Częstochowa 2–0 in the\
      \ final to win their 7th Polish Cup. (Polish Radio)"
    - 2026 Kentucky Derby
    - In horse racing, American horse Golden Tempo wins the 152nd Kentucky Derby after
      entering the race with 24–1 odds, making Cherie DeVaux the first female trainer
      to win the derby. (NBC News)
