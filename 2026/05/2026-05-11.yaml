    24)
  - International Criminal Court investigation in the Philippines
  - The Philippine senate is placed under lockdown after an altercation involving
    the National Bureau of Investigation and senator Ronald dela Rosa during an attempt
    to serve the arrest order from the International Criminal Court against dela Rosa.
    (Philippine Daily Inquirer) (Reuters)
  - United Kingdom anti-immigration protests
  - British Home Secretary Shabana Mahmood bans seven far-right activists, including
