date: '2026-05-11'
source_page:
  portal: Portal:Current events/2026 May 11
  language: en
  wikipedia_revision_id: 1356908784
wikipedia:
  categories:
    Uncategorized:
    - 2026 Iran war
    - 2026 Iran war ceasefire
    - Pakistani deputy prime minister and foreign minister Ishaq Dar meets with United
      States chargé d'affaires Natalie A. Baker in Islamabad to discuss efforts to
      secure a ceasefire and broader agreement between Iran and the U.S. to end the
      war. (Arab News)
    - United Arab Emirates in the 2026 Iran war
    - The Wall Street Journal reports that the United Arab Emirates has secretly joined
      Israel and the U.S. in carrying out airstrikes on Iran during the war. Additionally,
      Emirati forces have reportedly struck a oil refinery on Lavan Island in April.
      (Middle East Eye)
    - Sudanese civil war
    - War crimes during the Sudanese civil war
    - The United Nations reports that 880 civilians in Sudan had been killed in drone
      strikes by the Rapid Support Forces (RSF) between January and April, mostly
      in the Darfur and Kordofan regions in the first three months of 2026. (Euronews)
    - RSF field commander Ali Rizq announces that he will defect from the paramilitary
      group, making it the second high-profile departure from the paramilitary group
      in less than two months. (Sudan Tribune)
    - Haitian conflict
    - At least 40 people are reported injured following gang violence in Cité Soleil,
      Port-au-Prince, Haiti. (AP)
    - 2026 Georgian patriarchal election
    - Shio III is elected Catholicos-Patriarch of All Georgia, becoming head of the
      Georgian Orthodox Church. (Reuters)
    - Eurovision Song Contest 2026, International reactions to the Gaza war
    - Public broadcasters in Ireland, Slovenia, and Spain announce that they will
      not air the 70th Eurovision Song Contest in protest over Israel's participation
      amid the Gaza war. (AFP via Al Arabiya)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - Saudi Aramco CEO Amin Nasser says that the oil market will not normalize until
      2027 if the Strait of Hormuz remains closed beyond mid-June. (CNBC)
    - Five people are killed as a speeding motorcycle crashes into a car in Mahabubnagar,
      Telangana, India. (NDTV)
    - A boat carrying undocumented migrants sinks off Pangkor Island, Malaysia, leaving
      14 people missing and 23 others rescued. (AFP via Daily Tribune)
    - At least one person is killed, three others are injured and others are possibly
      trapped after a pipeline explosion damages at least 35 properties during construction
      by Sabesp in Jaguaré, São Paulo, Brazil. (BNO News)
    - 2026 Bangladesh measles outbreak
    - The Bangladeshi Directorate General of Health Services reports eleven children
      have died of measles in the past 24 hours, bringing the total to 344 child deaths
      since the outbreak began in March. (Bernama)
    - 2026 Cuban crisis, Cuba–Mexico relations
    - Mexican president Claudia Sheinbaum announces a new shipment of humanitarian
      aid to Cuba in response to the island's worsening economic and humanitarian
      conditions linked to the U.S. oil blockade. (AFP via Jamaica Observer)
    - Denmark–United States relations, Greenland crisis
    - Denmark and the United States hold high-level talks for the U.S. to open three
      military bases and expand military presence in Greenland in an effort to resolve
      the crisis there. (BBC News) (Sweden Herald)
    - Evacuations during the Gaza war, Italy–Palestine relations
    - Italy evacuates 72 Palestinian students in Gaza under the "university corridor"
      initiative that allows them to continue studying at universities in Italy and
      San Marino. (Middle East Monitor)
    - United States sanctions against Iran
    - The U.S. government issues sanctions against three people and nine companies
      accused of aiding shipping of Iranian oil to China. (Reuters)
    - International Criminal Court investigation in the Philippines
    - 2026 Philippine senate lockdown
    - The Philippine senate is placed under lockdown after an altercation involving
      the National Bureau of Investigation and senator Ronald dela Rosa during an
      attempt to serve the arrest order from the International Criminal Court against
      dela Rosa. (Philippine Daily Inquirer) (Reuters)
    - 14th floor case
    - Former Thai prime minister Thaksin Shinawatra is released from prison on parole
      after serving eight months of a one-year sentence for corruption. (AFP via France
      24)
    - United Kingdom anti-immigration protests
    - British Home Secretary Shabana Mahmood bans seven foreign far-right activists,
      including American influencer Valentina Gomez, from entering the UK, who were
      planning to attend a far-right rally in London, England, led by Tommy Robinson.
      Prime minister Keir Starmer says "agitators" will be blocked from entering the
      country ahead of the rally on May 16. (The Guardian)
    - Three people are killed and five others are injured in a suspected arson attack
      on a seven-story building in Décines-Charpieu, Auvergne-Rhône-Alpes, France.
      (Entrevue)
    - The Israeli parliament passes a law that allows military trials for Palestinian
      suspects involved in the October 7 attacks by Hamas. (The New York Times)
    - 2026 FIFA World Cup
    - Mexico's Secretariat of Public Education reverses a proposal to shorten the
      academic year ahead of the 2026 FIFA World Cup following criticism from parents,
      local authorities, and education groups. (AFP via RFI)
    - 2026 Philippine senate presidential election
    - Thirteen Philippine senators vote to install minority leader Alan Peter Cayetano
      as senate president, ousting Tito Sotto in a surprise move. (Gulf News) (Philippine
      Daily Inquirer)
    - Politics of Bosnia and Herzegovina
    - Christian Schmidt announces his resignation as High Representative for Bosnia
      and Herzegovina. He will stay in office until a replacement is found. (AP) (BBC
      News)
    - Second impeachment of Sara Duterte
    - Philippine vice president Sara Duterte is impeached by the House of Representatives
      for the second time. (AFP via RFI) (BBC News)
