wikipedia:
  categories:
    Uncategorized:
    - Russo-Ukrainian war
    - Peace negotiations in the Russo-Ukrainian war
    - Russian president Vladimir Putin says that he thinks the Russo-Ukrainian war
      may come to an end soon after previously vowing victory over Ukraine during
      the Victory Day military parade in Moscow. (Reuters) (The Moscow Times)'
    - Kharkiv strikes (2022–present)
    - Kharkiv Oblast governor Oleh Syniehubov says that a Russian drone has struck
      a residential building in Kharkiv during the beginning of the 3-day ceasefire
      between Russia and Ukraine. (Kyiv Independent)
    - Mali War
    - 2026 Mali offensives
    - Sources say that 70 people were killed in a new wave of attacks in central Mali
      the previous day. Al-Qaeda-linked Jama'at Nusrat al-Islam wal-Muslimin claims
      responsibility. (Daily Beirut) (Times of India)
    - Supporters of the Mali military junta gather in Bamako gather to reaffirm their
      support of Transitional Council authorities. (Africanews)
    - Insurgency in Khyber Pakhtunkhwa
    - 2026 Bannu attacks
    - At least 21 police officers are killed and three others are injured in a car
      bomb, followed by gunfire and other explosions, at a checkpoint in Bannu, Khyber
      Pakhtunkhwa, Pakistan. (Al Jazeera)
    - Sudanese civil war
    - 2026 Blue Nile campaign
    - The Sudanese Army announces that it has seized control of the Al-Kili area in
      the Blue Nile State from Rapid Support Forces and SPLM–N. (AA)
    - Ituri conflict
    - The DR Congolese military reports that at least 69 people were killed in an
      attack by CODECO in Ituri Province in April. (AFP via Arab News)
    - 61st Venice Biennale
    - The 61st Venice Biennale in Italy opens to the public without a jury after the
      jury quit in protest of Israel's and Russia's participation and loud protests
      outside their pavilions. (AP)
    - Exhibits from over 100 countries are shown on display including Belgium. (Brussels
      Times)
    - 2026 Moscow Victory Day Parade
    - Russia marks the Victory Day with a scaled-down military parade in Moscow. (Sky
      News)
    - Four miners are found dead following an explosion at a coal mine in Cucunubá,
      Ubaté Province, Colombia. (AFP via Citizen Digital)
    - MV Hondius hantavirus outbreak
    - British Army medics are parachuted from an RAF A400M onto the remote Atlantic
      island of Tristan da Cunha to deliver vital supplies to a British national with
      suspected hantavirus. (BBC News)
    - Arrest of Jair Bolsonaro
    - Brazilian Supreme Federal Court justice Alexandre de Moraes suspends the implementation
      of a law that could reduce prison sentences for individuals convicted over the
      2022–2023 coup plot, including former president Jair Bolsonaro, pending a constitutional
      review by the full court. (AFP via France 24)
    - Bahrain arrests 41 individuals in connection with Iran's Islamic Revolutionary
      Guard Corps, including Shia clerics. (MENA via The New Arab)
    - 2026 Hungarian parliamentary election
    - Magyar Government
    - Péter Magyar of the Tisza Party is sworn in as the prime minister of Hungary,
      ending the 16-year tenure of Fidesz's Viktor Orbán. (Reuters)
    - The National Assembly of Hungary reconvenes for the first time since the election
      as elected members are sworn in. Ágnes Forsthoffer is elected as speaker. (Budapest
      Business Journal)
    - 2026 Farrer by-election
    - Farrer MP David Farley becomes the first One Nation candidate elected to the
      Australian House of Representatives. (ABC News Australia)
