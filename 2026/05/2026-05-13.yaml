    Court warrant for alleged crimes against humanity. (AFP via The Peninsula) (Reuters)
  - Sussex Police say they have recovered the bodies of three women off a beach in
    Brighton, England, and are working to identify the women. (The Guardian)
  - The U.S. Senate blocks a War Powers Resolution to curtail U.S. president Donald
