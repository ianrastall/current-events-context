Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - Chinese supertanker Yuan Hua Hu, which carries 2 million barrels of Iraqi crude,
    crosses the Strait of Hormuz after previously being stranded in the Gulf for two
    months following the Iran war. The crossing comes ahead of an upcoming meeting
    between U.S. president Donald Trump and Chinese president Xi Jinping. (Jerusalem
    Post)
  - Four other vessels from China cross the Strait of Hormuz within the past 24 hours,
    including vehicle carrier Xian Jiang Kou and oil chemical tanker Starway. (AA)
  - 2026 Lebanon war
  - At least 12 people, including two children, are killed from Israeli drone strikes
    on cars on a major highway linking Beirut to southern Lebanon. (AFP via RTÉ)
  - Gaza war
  - ACLED reports that April was the deadliest month in Gaza this year, with more
    than 120 reported fatalities related to Israeli violence. (Reuters)
  - Russo-Ukrainian war
  - Russian attacks on civilians in the Russo-Ukrainian war
  - Nine people are killed and at least 28 others are injured in the latest Russian
    drone strikes across Ukraine. (BBC News)
  - Sudanese civil war
  - Darfur campaign
  - At least two people are killed and several others were injured in a drone strike
    in El Geneina, West Darfur, Sudan. (Sudan Tribune)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - The U.S. Energy Information Administration reports that the oil flow through the
    Strait of Hormuz has fallen to 30% in the first quarter of 2026 as compared to
    the previous quarter. (AA)
  - Germany approves reforms to its heating law and adopts new electricity supply
    legislation that enables support for 9 GW of new gas-fired power plants. (S&P
    Global)
  - According to Bangladesh Jatri Kalyan Samity, a total of 563 people were killed
    and 1,279 others injured in accidents on roads, railways and waterways in Bangladesh
