wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - A U.S. official says that U.S. Secretary of State Marco Rubio has spoken with
      Lebanese president Joseph Aoun and Israeli Prime Minister Benjamin Netanyahu
      in a effort to push for a new ceasefire in Lebanon, including an ending of Hezbollah
      attacks on Israel with Israel refraining from escalation in Beirut in return.
      (Al-Monitor)
    - Israeli forces capture the Beaufort medieval castle in Nabatieh Governorate,
      Lebanon, during a ground offensive despite a temporary ceasefire. (AFP via DW)
      (NPR) (BBC News)
    - Eight people are killed and 19 others are injured in an Israeli strike on Deir
      ez-Zahrani, Nabatieh District, Lebanon. (AFP via The Times of Israel)
    - Hezbollah launches drones and over 50 rockets at Northern Israel. (The Jerusalem
      Post)
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - The New York Times reports that the U.S. Central Command has guided 70 commercial
      ships through the Strait of Hormuz in the last three weeks, using routes closer
      to the Omani coast. (The Asia Business Daily) (The New York Times)
    - Casualties of the 2026 Iran war
    - An U.S. Army soldier and a service member from the British Army's Royal Anglian
      Regiment are both reported dead following a military training exercise at Harir
      Air Base in Erbil in Iraq's Kurdistan Region. (Stars and Stripes) (BBC)
    - CENTCOM announces that they have conducted strikes against radar and command-and-control
      sites for drones in Goruk, Hormozgan, and Qeshm Island. (CENTCOM) (Reuters)
    - Israeli–Palestinian conflict
    - Gaza war
    - An Israeli airstrike kills at least two Palestinians at a cafe in Gaza City.
      ‌(Reuters)
    - The Israel Defense Forces says that it destroyed three Hamas weapon depots in
      the Gaza Strip last week to "remove a threat" to its troops, and that the weapons
      were intended to be used against forces operating along the Yellow Line and
      Israeli civilians. (The Times of Israel)
    - Two teenage girls are injured in a vehicle-ramming attack at a bus stop in Gush
      Etzion Junction, West Bank. The perpetrator, identified as a Palestinian, is
      shot dead by Israeli troops. (The Times of Israel)
    - Herder–farmer conflicts in Nigeria
    - Nigerian bandit conflict
    - At least eight villagers are killed and 15 others were injured after more than
      a hundred Fulani bandits carried out a shooting in Plateau State. (Daily Post)
    - Two policemen are killed after unidentified gunmen attacked them on a road in
      Anambra State. (Daily Post)
    - Sudanese civil war
    - Kordofan campaign
    - The National Umma Party says that ten people, including eight children, have
      been killed in a drone strike on two civilian vehicles driving on the Abu Zabad–Al-Fula
      road in West Kordofan state, Sudan. (Sudan Tribune)
    - Tribal clashes erupt in South Darfur between the Beni Halba and Salamat tribes,
      killing 50 people. (Darfur24) (Sudan Tribune)
    - Allied Democratic Forces insurgency
    - An Allied Democratic Forces attack kills at least 19 civilians in the Ruwenzori
      commune, North Kivu, Democratic Republic of the Congo (DRC). (Radio Okapi in
      French) (Radio Okapi in French)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis, Sri Lanka and the International Monetary Fund
    - Sri Lanka increases fuel prices by up to six percent as part of economic reforms
      linked to its International Monetary Fund assistance program, which includes
      plans to phase out fuel subsidies and achieve cost recovery in the energy sector.
      (AFP via The Hindu)
    - 2026 Angeles City building collapse
    - The death toll from the collapse of an under construction nine-story building
      in Angeles, Pampanga, Philippines, on May 24, rises to twelve. (The Philippine
      Star)
    - 2026 Namhkam Township explosion
    - More than 55 people are killed, including six children, and 74 others are injured
      in an explosion at a building storing explosives for mining in Namhkam Township,
      Shan State, Myanmar. (AP) (BBC News)
    - Five people are killed, at least 19 others are injured and three are reported
      missing after a suspected shell from World War II explodes under a stilt house
      in Papua, Western New Guinea, Indonesia. (CBS News)
    - Five people are killed and another is injured when an illegal mine collapses
      in Huize County, Yunnan, China. (AP) (Reuters)
    - Sudanese cholera epidemic
    - Sudan holds an emergency meeting led by Health Minister Haitham Mohamed Ibrahim
      after the Federal Ministry of Health reports 308 cases and 77 deaths in West
      Kordofan from cholera since the outbreak in Sudan. (Sudan Tribune)
    - A study published by The New England Journal of Medicine reports that the daraxonrasib,
      a RAS inhibitor drug that targets KRAS-mutated cancers, has doubled median overall
      survival in patients with metastatic pancreatic cancer as compared to chemotherapy.
      (NPR) (Reuters) (NEJM)
    - 2026 Colombian presidential election
    - The National Salvation Movement's candidate Abelardo de la Espriella wins the
      election and will face Iván Cepeda from Historic Pact in the runoff on 21 June.
      (AP)
    - President Gustavo Petro announces that it does not recognize the results due
      to doubts about the computerised vote-counting system. (NBC News)
    - 2026 Guinean parliamentary election
    - Guineans vote to elect 147 members of the National Assembly. (AFP via Free Malaysia
      Today)
    - 2026 Maltese general election
    - Preliminary results from yesterday's election revealed that the Labour Party,
      currently led by incumbent prime minister Robert Abela, won a record fourth
      consecutive term in government. (Reuters)
    - Hungarian president Tamás Sulyok announces that he will not resign despite the
      prime minister Peter Magyar's ultimatum after accusing him of being an "Orbán
      puppet". (Euronews)
    - 2026 Indian Premier League
    - In Twenty20 cricket, the Indian Premier League concludes with Royal Challengers
      Bengaluru defeating the Gujarat Titans in the final at Narendra Modi Stadium
      in Ahmedabad, Gujarat, India. (India Today) (Telegraph India)
