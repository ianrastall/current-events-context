Date: '2026-05-24'
Source_URI: Portal:Current events/2026 May 24
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - The Islamic Revolutionary Guard Corps Navy reports that 33 ships passed through
    the Strait of Hormuz after receiving permission in the past 24 hours. (Iran International)
  - The Iranian military shoots down an alleged Israeli surveillance drone over Hormozgan
    province, Iran. (Iran International)
  - Insurgency in Balochistan
  - 2026 Quetta bombing
  - At least 30 people are killed and over 52 are injured after the explosion of a
    bomb at a car park near a train station in Quetta, Balochistan, Pakistan. The
    Balochistan Liberation Army claims responsibility. (Al Jazeera) (The Independent
    Urdu)
  - Russo-Ukrainian war
  - Four people are killed and over a hundred are injured in a Russian Oreshnik missile
    and drone attack on Kyiv, Ukraine. (BBC News) (The Washington Post)
  - 2026 Angeles City building collapse
  - A Malaysian citizen dies after a nine-storey building, under construction as a
    condo-hotel, collapses in Angeles, Pampanga, Philippines. At least 26 people are
    rescued, while search operations are ongoing for 23 others still missing. (The
    Philippine Star) (BBC) (AFP via CNA)
  - Five people are killed and another is injured in a fire at a shop in Qidong County,
    Hunan, China. (Xinhua)
  - Three people are killed and 17 others are reported missing after overnight torrential
    rains in Yongchuan, Chongqing, China. (Reuters)
  - At least 16 people die from heat stroke in Telangana, India, as temperatures exceed
    during a heat wave, prompting public safety measures from the government. (AFP
    via The Straits Times)
  - Reactions to the 2026 Iran war, Bahrain–Iran relations
  - Bahrain sentences nine people to life in prison for espionage on behalf of Iran's
    Islamic Revolutionary Guard Corps. (Iran International)
  - Four people are killed and one of the gunmen is injured in a mass shooting in
    Kabul, Afghanistan. Two suspects are arrested. (Pajhwok Afghan News)
  - 2026 Beninese presidential election
  - Romuald Wadagni is sworn in as the president of Benin, succeeding Patrice Talon.
    (Reuters)
  - 2026 Cypriot legislative election
  - Cypriots vote to elect 56 of the 80 seats in the House of Representatives. Recent
    opinion polls have indicated that the conservative DISY and the leftist AKEL are
    competing for first place, while the hard-right ELAM is also expected to make
    gains in the legislature. (Cyprus Mail) (DW)
  - DISY wins the most with 17 seats, followed by AKEL in second with 15 seats and
    ELAM in third with eight seats. ALMA and Direct Democracy Cyprus enter the legislature
    with four seats each. (Phileleftheros)
  - 2025–2026 Turkish protests
  - Turkish police raid the headquarters of the Republican People's Party and evict
    its leadership, including Özgür Özel. (AFP via France 24) (BBC News) (Reuters)
  - Thousands of people protest in Madrid, Spain, against increasing housing costs.
    (AP)
  - Residents of Kraków have overwhelmingly backed the dismissal of Mayor Aleksander
    Miszalski (Civic Platform) and the city council in a local recall referendum for
    the first time in the city's history. Exit polls have shown a 33.4% voter turnout
    with 97.8% of voters backing dismissing Miszalski, while 96.0% supported removing
    the council. (TVP World)
  - 2026 FIFA World Cup
  - The president of the Iranian FA says FIFA has approved the country's World Cup
    training base being switched from the United States to Mexico due to the ongoing
    conflict. (BBC Sport)
  - 2026 Indianapolis 500
  - In auto racing, Swedish driver Felix Rosenqvist defeats David Malukas to win the
    110th Indianapolis 500, giving Meyer Shank Racing its second victory in the event.
    The margin of victory is 0.023 seconds, making it the closest finish in Indianapolis
    500 history. (FOX Sports)
