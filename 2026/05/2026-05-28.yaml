wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Axios reports that American and Iranian negotiators have agreed to a deal to
      extend the ceasefire. (AP) (Axios) (Reuters)
    - U.S. treasury secretary Scott Bessent says Washington will halt Iranian airlines’
      access to landing spots until a deal is signed. (The Times of Israel)
    - 2026 Strait of Hormuz crisis
    - U.S. treasury secretary Scott Bessent says that Oman will not participate in
      imposing tolls on ships and vessels transiting the Strait of Hormuz after previously
      threatening to impose sanctions against them earlier in the day if it were to
      join Iran in doing so. (AA) (AFP via The Straits Times)
    - Kuwait in the 2026 Iran war
    - The Kuwaiti military says that they have activated air defenses to intercept
      a missile along with drones. (AP)
    - The Islamic Revolutionary Guards Corps says that it targeted an American base
      in Kuwait in retaliation for the recent U.S. strikes near Bandar Abbas including
      yesterday's. (AA)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - At least 19 people, including two children, are killed from Israeli attacks
      in southern Lebanon, as Israel intensifies its assault and issues mass displacement
      orders across the region. The Israeli military alleges that it is a targeted
      attack. (Al Jazeera) (BBC News)
    - Gaza war
    - Israeli prime minister Benjamin Netanyahu orders Israeli forces to seize 70%
      of the Gaza Strip. (Financial Times)
    - An Israeli military air raid kills ten people, including four children, in northern
      Gaza. (Al Jazeera)
    - The Israeli military announces that it has assassinated Ihab Khrizim, a leader
      of a central Hamas funds transfer network, in a strike in the Khan Yunis area
      of the Gaza Strip in Palestine. (BBC News) (The Jerusalem Post)
    - Colombian conflict
    - Clashes between FARC dissidents kill at least 48 people in Guaviare, Colombia,
      amid ongoing disputes over territorial and criminal control. (AFP via Abhiyan
      News)
    - Terrorism in Switzerland
    - 2026 Winterthur stabbing attack
    - Three people are injured in a mass stabbing at a train station in Winterthur,
      Switzerland. The perpetrator is arrested and authorities declare the attack
      as an act of terrorism. (BBC News) (NBC News)
    - 2026 Longview, Washington paper mill implosion
    - The death toll from the implosion of a white liquor paper mill in Longview,
      Cowlitz County, Washington, U.S., rises to eight. (The New York Times)
    - 2026 Gilgil school burning
    - Sixteen students are killed and 79 others injured in a fire in a dormitory at
      a girls school in Gilgil, Nakuru County, Kenya. (BBC News)
    - Thirteen people are killed and three others are injured when an overloaded passenger
      bus crashes into a large truck on G40 Shanghai–Xi'an Expressway in Nanyang,
      Henan, China. (AFP via CNA) (Reuters)
    - Six people are killed and four others are trapped when an under-construction
      bridge collapses during a storm in Hamirpur district, Uttar Pradesh, India.
      (Azerbaijan) (NDTV)
    - Five people are killed while 22 others are injured after a truck overturns on
      Cong. Andres Acop Cosalan Road in Kabayan, Benguet, Philippines. (Philippine
      Daily Inquirer) (Xinhua)
    - At least three people are killed, four others are injured, and 11 more are reported
      missing in an explosion at an apartment building in Dallas, Texas, United States.
      (The Guardian) (Newsweek)
    - 2026 Ebola epidemic
    - World Health Organization chief Tedros Adhanom Ghebreyesus visits the Democratic
      Republic of the Congo and states that the Ebola outbreak can still be contained.
      (AFP via France 24) (DW)
    - MV Hondius hantavirus outbreak
    - The European Union receives a shipment of the Favipiravir for potential use
      against hantavirus infections. (AA) (Brussels Times)
    - International reactions to the Gaza war
    - Israel and the United Nations
    - Israel announces it will cut ties with UN Secretary-General António Guterres
      and his office in response to the United Nations adding the country to its blacklist
      of countries and organizations that employ wartime sexual violence. (New York
      Times)
    - The Council of the European Union sanctions four Israeli settler organizations
      and three settler leaders for their roles in the increasing settler violence
      in the occupied West Bank. Simultaneously, they expand existing sanctions for
      members of the Hamas's Political Bureau. (Al Jazeera) (Reuters)
    - Japan–Philippines relations
    - Japan and Philippines agree to elevate ties to new level amid China concerns.
      (The Japan Times)
    - Deportation in the second Trump administration, Ghana–United States relations
    - The United States transfers another group of West African deportees to Ghana
      under third-country deportation arrangements, including at least one individual
      reported to hold protection from removal under U.S. immigration law. (AFP via
      Barron's)
    - Terrorism in Australia
    - The Melbourne Magistrates' Court in Victoria, Australia, charges 34-year-old
      Islamic State bride Rayann El Houli, who recently returned from Syria, for being
      a member of a terrorist organization after joining the Islamic State after traveling
      there in the early 2010s. (ABC Australia) (AFP via France 24)
    - Terrorism in Brazil
    - United States Secretary of State Marco Rubio designates Primeiro Comando da
      Capital and Comando Vermelho, the two biggest drug trafficking-related criminal
      organizations in Brazil, as foreign terrorist groups. (Al Jazeera) (AP via The
      Washington Post)
    - The Latvian Saeima approves a four-party coalition government led by prime minister
      Andris Kulbergs after Evika Siliņa's administration collapsed following disputes
      over the handling of suspected Ukrainian drones entering Latvian airspace. (Al
      Jazeera) (AP)
    - 2026 FIFA World Cup
    - Canada, Mexico, and the United States announce coordinated travel health measures
      for travelers arriving from Ebola-affected areas in central and eastern Africa
      ahead of the FIFA World Cup. (CBC) (Reuters)
