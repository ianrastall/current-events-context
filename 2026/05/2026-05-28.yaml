    Republic of the Congo and states that the Ebola outbreak can still be contained.
    (France24) (DW)
  - MV Hondius hantavirus outbreak
  - The European Union receives a shipment of the Favipiravir for potential use against
    hantavirus infections. (AA) (Brussels Times)
