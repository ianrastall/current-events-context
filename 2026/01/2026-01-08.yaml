    defying GOP leadership
  summary: The  voted 230–196 to extend expired Affordable Care Act-related health
    insurance subsidies, after a discharge petition forced floor action over leadership
    objections. Reuters reported the vote included 17 Republicans joining Democrats,
    and described the measure as politically notable but facing uncertainty in a Senate
    that had previously rejected similar legislation and was considering narrower
    options. AP similarly characterized the vote as an unusual rebuke of Republican
    leadership, emphasizing the procedural step that bypassed the Speaker to bring
    the bill forward.
