  summary: Reuters reported that ’s finance ministry planned to scrap restrictions
    imposed in 2020 that required Chinese firms to register and obtain political and
    security clearances to bid for government tenders, effectively barring competition
    for contracts Reuters described as worth roughly $700–$750 billion. Reuters said
    the move—still requiring final approval from ’s office—followed requests from
    ministries facing shortages and project delays, and a recommendation by a high-level
    committee. Indian outlets (including The Economic Times) reported the same plan,
    citing the Reuters report and highlighting the procurement implications for capital
    goods and infrastructure.
