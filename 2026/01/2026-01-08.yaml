  headline: US moves to exit 66 international organizations, intensifying rupture
    with UN climate architecture
  summary: The  government, led by , moved to withdraw from a large slate of international
    bodies—reported as 66 organizations (31 UN-linked and 35 non-UN)—via a White House
    directive following an administration review. Among the withdrawals, multiple
    sources highlighted departure from the , a foundational treaty underpinning global
    climate negotiations. European officials publicly criticized the step; the UN
    climate chief warned it would harm U.S. prosperity and security, and Reuters reported
    the U.S. would also leave climate-finance and scientific bodies connected to the
    UNFCCC architecture.
