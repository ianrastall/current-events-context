  headline: Israeli strikes in Gaza kill at least 11 after failed rocket launch, highlighting
    ceasefire fragility
  summary: 'Reuters reported that Israeli strikes killed at least 11 Palestinians
    in multiple locations across Gaza after Israel said it responded to a failed rocket
    attack from the enclave; Reuters also reported Palestinian medical sources gave
    the 11-death toll. Other outlets described a slightly higher fatality figure:
    The Times of Israel reported Gaza’s Hamas-run civil defense agency said at least
    13 were killed late Thursday, while confirming that Israel’s military and security
    service said strikes followed a “failed launch” from Gaza City toward Israel.
    The episode underscored the instability of an already strained truce as the parties
    disputed ceasefire compliance and attribution for the failed launch.'
