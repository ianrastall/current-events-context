    touching foreign affairs, intelligence, armed services, and China policy. Reuters
    relayed the FT account, noting it could not independently verify the report and
    that the White House had no immediate comment at the time. Separately, Reuters
    reported China’s foreign ministry rejected the allegations as politically motivated
    “disinformation,” with spokesperson  stating China opposes hacking and opposes
