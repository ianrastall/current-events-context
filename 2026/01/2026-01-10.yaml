- id: evt-2026-01-10-006
  category: Disasters and accidents
  subcategory: Landslides
  topics: []
  importance: 5
  headline: Cebu City landfill collapse buries workers, killing at least 4
  summary: On Jan 7, a massive landslide of garbage at the Binaliw landfill in Cebu
    City buried dozens of sanitation workers.  By Jan 10, four workers were confirmed
    dead and many remained missing.  Heavy machinery and rescue crews have been painstakingly
    digging through tons of compacted trash to find survivors.  Officials warned of
    the danger of further collapses as rains and unstable waste piles hampered operations.
  key_data: []
  details:
    what_happened:
    - Early Jan 7, roughly 50 landfill workers and staff were on site when a 20-story-high
      mound of garbage collapsed onto them【71†L187-L195】.
    - The landslide destroyed structures (including a staff house) and sent debris
      spilling into nearby areas【38†L218-L226】【71†L191-L199】.
    - Rescue efforts continued for days; Cebu’s mayor confirmed 4 deaths and 36 people
      unaccounted for by Jan 10【71†L187-L195】【38†L218-L222】.
    - Dozens were rescued alive (about 12 hospitalized). Rescuers faced shifting ground
      and called in cranes for safety【38†L218-L226】.
    why_it_matters:
    - Underlines severe occupational hazards in waste management, raising questions
      about landfill regulation.
    - A human tragedy with significant local impact; dozens of families affected.
    - Prompts review of safety standards and emergency response for industrial accidents.
    uncertainty_notes: []
  actors:
    primary:
    - Cebu City authorities and rescue teams (conducting search and relief).
    secondary:
    - Binaliw Landfill operator (Prime Integrated Waste Solutions) – owner of the
      site.
