  summary: On Jan 10, Egypt’s election authority announced the results for the last
    49 of 596 parliamentary seats from the multi-stage vote that began in September
    2025.  These final seats solidified the pro-President Sisi coalition’s control
    of roughly two-thirds of the legislature.  Opposition parties and independents
    still hold about 28% of elected seats, per state media, but Sisi now has the threshold
    needed to amend the constitution.
