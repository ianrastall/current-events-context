      to reach a **supermajority** (two-thirds of all seats)【47†L195-L204】.
    - The elections had required reruns in some areas due to annulments, delaying
      the final results.
    - State media noted opposition parties and independents may retain about 28% of
      seats (158 of 568 elected), but pro-Sisi forces dominate【47†L205-L213】.
    why_it_matters:
