      in Lubero district【65†L187-L195】【65†L201-L207】.'
    - They used machetes and guns; 9 civilians were killed in Kilonge, 2 in Katanga,
      and at least 2 civilians plus 2 soldiers in Maendeleo【65†L201-L209】.
    - Local leaders said the militants also burned dozens of homes, a church, and
      supplies.
    - Congolese troops said they chased the rebels; reports show the ADF claimed up
