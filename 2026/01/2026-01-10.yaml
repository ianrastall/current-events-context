  headline: Devastating bushfires in southeastern Australia kill one and destroy hundreds
    of homes
  summary: In early January 2026, extreme heat and drought fueled severe bushfires
    across southeast Australia.  Over several days the fires burned more than 350,000
    hectares, destroying at least 300 homes and agricultural land.  On Jan 10, firefighters
    found human remains near Longwood (north of Melbourne), confirming at least one
    fatality. State leaders declared total fire bans and mobilized over 30,000 emergency
    personnel.  Smoke blanketed major cities.  The blazes are the worst since Australia’s
    2019–20 “Black Summer.”
