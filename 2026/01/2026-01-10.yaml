- id: evt-2026-01-10-002
  category: Armed conflicts and attacks
  subcategory: Airstrikes
  topics: []
  importance: 5
  headline: US launches “Operation Hawkeye Strike” airstrikes on ISIS in Syria
  summary: On Jan 10, U.S. Central Command announced large-scale airstrikes across
    eastern Syria targeting Islamic State (ISIS) facilities.  The strikes – the latest
    in a months-long campaign called “Hawkeye Strike” – were ordered in retaliation
    for a December ambush in Palmyra that killed two U.S. soldiers and an interpreter.  A
    U.S. statement said multiple ISIS targets were hit across Syria【21†L121-L128】.  The
    Pentagon noted the strikes were conducted “with partner forces” (Jordan took part)【23†L122-L124】.  U.S.
    officials gave no casualty figures.
  key_data: []
  details:
    what_happened:
    - At ~17:30 GMT on Jan 10, U.S. and allied aircraft struck dozens of ISIS targets
      across Syria【23†L98-L100】.
    - The operation, named Hawkeye Strike, was launched days after an ISIS ambush
      in Palmyra killed U.S. personnel【22†L128-L132】【23†L94-L99】.
    - U.S. Central Command said “multiple strikes” were carried out “against ISIS
      throughout Syria”【21†L121-L128】.
    - Jordan’s air force also participated; combined forces used dozens of aircraft
      and munitions to hit command centers, training grounds, and depots【23†L122-L124】【24†L73-L80】.
    - The Pentagon “did not say whether anyone was killed” in the strikes【23†L119-L120】.
    why_it_matters:
    - Demonstrates continued U.S. military commitment to fighting ISIS in Syria even
      after US-Taliban withdrawal.
    - A retaliatory message after ISIS attacked U.S. forces, aimed at deterring further
      attacks on U.S. personnel.
    - Coordinates with regional partners (Jordan), influencing U.S. alliances and
      regional security.
    uncertainty_notes: []
  actors:
    primary:
    - U.S. military (U.S. Central Command)【21†L121-L128】
    secondary:
    - Jordanian Armed Forces (partner in strikes)【23†L122-L124】
