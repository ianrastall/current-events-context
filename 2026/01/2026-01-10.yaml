- id: evt-2026-01-10-008
  category: International relations
  subcategory: Diplomatic relations
  topics: []
  importance: 5
  headline: Brazil to return Argentine diplomatic representation in Venezuela
  summary: On Jan 11, Brazil’s foreign ministry announced it will hand over custody
    of Argentina’s embassy and consular functions in Venezuela back to the Argentine
    government.  Since 2024, Brazil had represented Argentina in Caracas after Venezuelan
    President Maduro expelled Argentine diplomats.  The handover restores Argentina’s
    direct diplomatic presence in Venezuela under the new U.S.-backed regime.
  key_data: []
  details:
    what_happened:
    - Brazil confirmed it will return “the responsibility for [Argentina’s] diplomatic
      representation and custody of its embassy in Venezuela”【46†L187-L194】.
    - The arrangement dates to 2024, when Venezuela cut ties with Argentina’s previous
      government. Brazil had held Argentina’s keys in Caracas during that period【46†L187-L194】.
    - Both governments were formally notified of the change; no further details or
      statements have been released yet.
    why_it_matters:
