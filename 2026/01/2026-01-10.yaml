- id: evt-2026-01-10-004
  category: International relations
  subcategory: Civil unrest
  topics: []
  importance: 5
  headline: U.S. issues security alert urging Americans to leave Venezuela
  summary: On Jan 10, the U.S. State Department warned American citizens to “immediately
    depart” Venezuela, citing reports that pro-government militias (“colectivos”)
    were setting up roadblocks and searching for U.S. passport holders or regime opponents.  This
    advisory came roughly a week after the U.S. raid that captured President Maduro,
    during which Maduro loyalists warned of vigilante activity.
  key_data: []
  details:
    what_happened:
    - U.S. Embassy Caracas issued a security alert stating that armed “colectivos”
      (government militias) appeared to be “setting up roadblocks and searching vehicles
      for evidence of U.S. citizens or supporters”【25†L174-L181】.
    - The alert noted a deteriorating situation one week after Maduro’s capture by
      U.S. forces, implying those events triggered militia actions【25†L174-L181】.
    - The State Department “urged citizens to depart immediately” by commercial means,
      reflecting heightened danger【25†L174-L181】.
    why_it_matters:
    - Signals a significant security breakdown in Venezuela following the coup-style
      operation; ordinary Americans (and possibly others) face new threats.
    - Highlights the volatility after regime change, affecting foreign nationals and
      complicating U.S.-Venezuela relations.
    - Reflects the power of armed non-state “colectivo” groups and the challenges
      they pose to governance and international travelers.
    uncertainty_notes: []
  actors:
    primary:
    - U.S. State Department (issuing the travel warning)【25†L174-L181】
    secondary:
    - Venezuelan colectivos (pro-Maduro militias conducting roadblocks)【25†L174-L181】
