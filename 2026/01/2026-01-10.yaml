  summary: On Jan 1-2, 2026, fighters from the Allied Democratic Forces (ADF) – an
    Islamic State-linked militia – launched coordinated raids on villages in North
    Kivu province.  They attacked hamlets in Lubero territory, killing at least 15
    people (mostly civilians) and burning homes.  Some reports indicate two Congolese
    soldiers also died.  The ADF has intensified violence in eastern Congo despite
    offensives by Congolese and Ugandan forces.
