- id: evt-2026-01-10-005
  category: Civil unrest
  subcategory: Anti-government protests
  topics: []
  importance: 5
  headline: Iran intensifies crackdown amid nationwide protests
  summary: In early January, Iran saw a surge of anti-government protests spread to
    multiple cities over economic grievances.  State media and rights groups reported
    dozens killed and many arrested.  The Revolutionary Guards labeled demonstrators
    “terrorists” after attacks on security forces.  U.S. President Trump commented
    on the unrest, claiming Iranians “are looking at FREEDOM” and offering help.  By
    Jan 10, the unofficial death toll was at least 65, with some 2,300 detained.
  key_data: []
  details:
    what_happened:
    - Demonstrations continued across Iran’s cities, including Tehran and religious
      centers Qom and Mashhad, driven by rising inflation and broader discontent【33†L1-L3】.
    - State media claimed that security forces had been killed in clashes (deaths
      in Shiraz, Qom, Hamedan were reported by officials)【33†L1-L3】.
    - Local activists and monitoring groups said around 50 protesters and 15 security
      forces were killed【35†L242-L244】.
    - Government-backed media showed funerals for slain security personnel, and the
      IRGC vowed to crush “armed rioters.”
    - 'U.S. political figures weighed in: Trump tweeted support for protesters and
      hinted at intervention【33†L1-L3】.'
    why_it_matters:
    - Represents one of the largest popular challenges to Iran’s leadership in years,
      risking domestic instability.
    - Strains the regime internally and could affect Iran’s foreign policy posture
      (e.g. involvement in Syria) as it struggles to suppress dissent.
    - Involves international actors (U.S. statements) and could influence U.S.-Iran
      tensions further.
    uncertainty_notes: []
  actors:
    primary:
    - Iranian government (President Raisi, Supreme Leader Khamenei, Revolutionary
      Guards) – launching crackdown.
    secondary:
    - Iranian protesters and opposition activists.
