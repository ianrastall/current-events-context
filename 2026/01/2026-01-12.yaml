  headline: Anti-Hamas Militia Assassinates Senior Hamas Police Official in Gaza
  summary: Deepening the internal fragmentation of the Gaza Strip, an armed faction
    identifying itself as the "Counter-Terrorism Strike Force" assassinated a high-ranking
    Hamas police official, highlighting the emergence of localized armed resistance
    to Hamas's governance15. Lieutenant Colonel Mahmoud al-Astal, the director of
    police investigations for Khan Younis, was killed in a drive-by shooting in the
    al-Mawasi area, an enclave currently under Israeli military control17. Following
    the hit, militia leader Hussam al-Astal released a highly provocative video claiming
    responsibility, displaying blood-stained weaponry, and explicitly threatening
    death to anyone collaborating with Hamas17. While the Hamas interior ministry
    swiftly blamed the attack on "agents of the Israeli occupation," Israeli Defense
    Forces personnel denied knowledge of the specific operation, though Israel has
    previously acknowledged permitting rival clans to operate in territories under
    its control17.
