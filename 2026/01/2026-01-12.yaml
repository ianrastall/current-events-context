  importance: 5
  headline: Meta Forcibly Deactivates 544,000 Underage Accounts in Australia
  summary: In a massive compliance sweep mandated by unprecedented national legislation,
    Meta deactivated 544,052 social media accounts across Australia to adhere to a
    new federal law banning platform access for children under the age of 1629. Executed
    between December 4 and December 11, the purge utilized Meta's internal algorithms
    to scrub 330,639 accounts from Instagram, 173,497 from Facebook, and 39,916 from
    Threads29. Facing devastating civil penalties of up to $49.5 million Australian
    dollars ($33 million USD) for non-compliance, Meta executed the deletions but
    simultaneously launched a fierce public relations counter-offensive29. The tech
    giant argued that the blanket ban is fundamentally flawed, driving youth toward
    unregulated, darker corners of the internet, and insisted that the burden of age
    verification must legally be shifted to smartphone operating systems and app stores,
    rather than individual software applications29.
