  headline: Spain Seizes Record 10 Tonnes of Cocaine in Operation White Tide
  summary: In a massive blow to transnational narcotics trafficking, Spanish police
    executed the country's largest-ever maritime cocaine seizure, intercepting nearly
    10 metric tonnes of the drug aboard a cargo ship in the Atlantic Ocean40. The
    complex interdiction, code-named "Operation White Tide," involved elite tactical
    officers boarding a Cameroon-flagged vessel approximately 332 miles off the coast
    of the Canary Islands after the ship inexplicably ran out of fuel while en route
    from Brazil to Europe40. Authorities discovered 9,994 kilograms of cocaine, meticulously
    divided into 294 bales, buried beneath a massive, decoy cargo shipment of salt40.
    The highly coordinated raid, which resulted in the arrest of all 13 crew members
    and the seizure of defensive firearms, was facilitated through extensive intelligence
    sharing with the U.S. Drug Enforcement Administration (DEA), the UK National Crime
    Agency (NCA), and authorities from Brazil, France, and Portugal40.
