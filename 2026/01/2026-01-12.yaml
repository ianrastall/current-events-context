  headline: Former Georgian Prime Minister Irakli Garibashvili Jailed for Money Laundering
  summary: In a watershed moment for Georgia's turbulent domestic politics, former
    Prime Minister Irakli Garibashvili was sentenced to five years in prison and fined
    1 million Georgian lari ($370,000 USD) after pleading guilty to large-scale money
    laundering33. Following a carefully negotiated plea agreement with the Prosecutor's
    Office, the Tbilisi City Court officially approved the sentence, leading to Garibashvili's
    immediate arrest directly inside the courtroom33. Investigators successfully demonstrated
    that the former premier covertly engaged in prohibited business activities during
    his tenure, laundering the illicit proceeds by falsifying his asset declarations
    to categorize the massive revenue as "gifts" from family members33. As part of
    the plea, the state officially confiscated approximately $6.5 million in cash
    that was seized from his residence during a high-profile raid in October 202533.
