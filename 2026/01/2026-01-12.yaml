  headline: Somalia Severs Security Agreements with the UAE, Triggering Regional Defiance
  summary: The Federal Government of Somalia (FGS) enacted a sweeping unilateral termination
    of all defense, security, and port agreements with the United Arab Emirates, plunging
    the fragile Horn of Africa nation into a severe domestic and regional crisis44.
    President Hassan Sheikh Mohamud justified the abrupt ban on January 12 as a defense
    of national sovereignty, acting in direct retaliation for the UAE's alleged covert
    facilitation of Israel's formal recognition of the breakaway region of Somaliland44.
    The federal edict immediately banned UAE military and cargo flights from entering
    Somali airspace45. However, the mandate was swiftly and publicly rejected by the
    semi-autonomous regional governments of Puntland and Jubaland, whose leaders declared
    the ban unconstitutional and vowed to maintain their lucrative, independent security
    and port agreements with Abu Dhabi, including the operation of the UAE-trained
    Puntland Maritime Police Force44. Seizing the strategic vacuum created by the
    rupture, Qatar immediately expanded its security footprint in Mogadishu44.
