  headline: Joint Task Force Dismantles Cambodian Cyber Scam Network
  summary: Demonstrating the escalating severity of transnational cybercrime originating
    in Southeast Asia, a joint law enforcement operation between South Korean and
    Cambodian authorities successfully dismantled a highly sophisticated scam and
    sexual exploitation syndicate operating out of Phnom Penh61. The pan-government
    task force conducted coordinated raids on several offices and residences on January
    5, culminating in the formal arrest of 26 suspects61. The criminal network is
    accused of executing elaborate impersonation scams heavily intertwined with the
    creation and weaponization of sexually exploitative material, successfully defrauding
    165 South Korean victims out of approximately 26.7 billion won ($18.25 million
    USD)20. Following the arrests, South Korean authorities announced comprehensive
    plans to immediately block the digital circulation of the illicit videos and extract
    the suspects back to Seoul to face stringent prosecution, underscoring a newly
    aggressive bilateral posture against borderless digital extortion61.
