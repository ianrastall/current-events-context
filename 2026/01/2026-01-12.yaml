  importance: 5
  headline: Rare Meteotsunami Inundates Argentina's Atlantic Coast
  summary: A highly destructive and unpredictable meteotsunami struck the Atlantic
    coast of Argentina's Buenos Aires Province, killing one person and injuring at
    least 35 others as it swept through crowded summer beaches22. Occurring between
    16:20 and 17:00 local time, the sea abruptly receded before violently returning
    as a massive surge, with wave crests estimated between 5 to 6 meters (16 to 20
    feet) high, vastly exceeding the region's typical 2-meter surf22. The sudden inundation
    caused widespread panic in coastal towns such as Santa Clara del Mar, Mar Chiquita,
    and Mar del Plata, tossing people and heavy debris inland22. Meteorological experts
    confirmed the phenomenon was not seismic, but rather driven by rapid atmospheric
    pressure drops and wind shifts from a passing frontal system that induced a resonant
    oscillation in the shallow continental shelf waters22.
