  headline: Wild Elephant Rampage Leaves 20 Dead in Eastern India
  summary: An unprecedented human-wildlife crisis unfolded in the eastern Indian state
    of Jharkhand, where a lone, rogue wild elephant killed at least 20 people over
    a highly concentrated nine-day period, prompting massive emergency interventions46.
    Operating under the cover of darkness in the Chaibasa and Kolhan forest areas
    of the West Singhbhum district, the male elephant systematically attacked villagers
    who were either guarding their paddy fields or sleeping outside their homes46.
    With the death toll rapidly escalating—including 13 fatalities occurring in just
    a two-day span—regional authorities deployed a specialized task force of over
    100 forest personnel to track and tranquilize the elusive animal46. To aid the
    search operations and prevent further agitation of the animal, officials took
    the extraordinary logistical step of canceling 12 regional train routes, as experts
    assessed the elephant was likely experiencing "musth," a temporary phase characterized
    by severe hormonal aggression46.
