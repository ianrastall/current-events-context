- id: evt-2026-01-12-001
  category: International relations
  subcategory: Sanctions and immigration enforcement
  topics: []
  importance: 5
  headline: U.S. Seizes Venezuelan Oil Assets and Deports Asylum Seekers Amid Political
    Prisoner Release
  summary: The geopolitical landscape surrounding Venezuela experienced extreme volatility
    as the United States simultaneously intensified economic sanctions, engineered
    diplomatic asset maneuvers, and executed highly controversial deportations following
    the recent capture of Nicolás Maduro1. Early on Friday, U.S. Southern Command
    detained the Venezuelan-linked oil tanker *Olina* in the Caribbean Sea, the fifth
    such seizure by the Trump administration since December1. Concurrently, President
    Donald Trump signed an executive order classifying Venezuelan oil revenues held
    in U.S. Treasury accounts as sovereign property, a deliberate legal maneuver to
    block private creditors like ExxonMobil from impounding the funds, ostensibly
    to preserve capital for a U.S.-backed transitional government1. Inside Venezuela,
    the government initiated a "national pacification" process, releasing roughly
    400 political prisoners, though NGOs like Foro Penal note that 600 remain incarcerated
    and the state's systemic repressive apparatus remains fully intact under the 2024
    Simón Bolívar Organic Law3. Complicating the human rights narrative, the U.S.
    administration invoked the archaic Alien Enemies Act to deport 137 Venezuelan
    asylum seekers to El Salvador's draconian Terrorism Confinement Center (CECOT)
    maximum-security prison, frequently profiling individuals based on tattoos2. The
    confluence of these events underscores an aggressive, multifaceted U.S. strategy
    that prioritizes geopolitical leverage and hardline immigration deterrence over
    traditional human rights or corporate debt frameworks1.
