    the paramilitary Rapid Support Forces (RSF) launched a deadly missile strike on
    the city of Singa in Sennar State, resulting in significant civilian casualties20.
    The indiscriminate strike killed ten civilians and wounded nine others, demonstrating
    the lethal expansion of the civil war into previously stable administrative centers49.
    This attack occurs against an apocalyptic backdrop of widespread acute food insecurity
    and a totally collapsed national healthcare infrastructure. According to concurrent
