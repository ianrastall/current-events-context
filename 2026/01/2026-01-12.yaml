  headline: Minnesota Sues DHS Over "Operation Metro Surge" Following Fatal ICE Shooting
  summary: The state of Minnesota, joined by the cities of Minneapolis and St. Paul,
    launched a comprehensive federal lawsuit against the Department of Homeland Security
    (DHS) to immediately halt "Operation Metro Surge," an unprecedented deployment
    of over 2,000 federal immigration agents to the region8. Attorney General Keith
    Ellison alleges the hyper-militarized operation violates the First Amendment by
    politically retaliating against Democratic leadership, and the Tenth Amendment
    by commandeering local police resources and forcing school closures8. The legal
    and civic crisis was catalyzed by the January 7 fatal shooting of 37-year-old
    U.S. citizen Renee Nicole Good by ICE agent Jonathan Ross, an incident federal
    officials praised as self-defense, but which eyewitnesses, video evidence, and
    state officials characterize as a reckless escalation against a fleeing vehicle9.
    The fallout has severely disrupted the regional economy—with local businesses
    reporting 50% to 80% revenue drops due to community terror—while simultaneously
    triggering an internal crisis at the Department of Justice, where four top civil
    rights officials resigned in protest over the agency's refusal to criminally investigate
    Ross8.
