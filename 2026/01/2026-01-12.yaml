  importance: 5
  headline: U.S. DOJ Subpoenas Federal Reserve Chair Jerome Powell
  summary: The United States witnessed an unprecedented constitutional and institutional
    crisis as the Department of Justice (DOJ) served grand jury subpoenas targeting
    sitting Federal Reserve Chair Jerome Powell, effectively opening a criminal probe
    into the head of the nation's independent central bank57. The investigation ostensibly
    centers on statements Powell made during congressional testimony regarding a $2.5
    billion renovation project for Federal Reserve buildings in Washington, D.C.57.
    However, Powell released a highly defiant public statement dismissing the threat
    of a criminal indictment as a fabricated "pretext" orchestrated by President Donald
    Trump—who has relentlessly demanded lower interest rates—to seize control of U.S.
    monetary policy and subjugate the Fed's technocratic independence57. The extreme
    legal maneuver sent immediate shockwaves through global financial markets; while
    the S\&P 500 managed to tick to record highs, the yield on the 10-year Treasury
    briefly spiked to 4.21% amid severe investor concerns that a politicized, captive
    Federal Reserve would trigger runaway long-term inflation58.
