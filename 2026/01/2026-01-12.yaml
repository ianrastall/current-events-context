  summary: The volatility of Myanmar's multi-front civil war spilled across international
    borders as Border Guard Bangladesh (BGB) detained 53 members of the Arakan Rohingya
    Salvation Army (ARSA) who fled intense combat in Rakhine State20. The militants
    crossed the Naf River into Bangladesh to escape severe, ongoing clearance operations
    conducted by the Arakan Army (AA), an ethnic armed organization fighting for regional
    autonomy51. According to local intelligence, coordinated early-morning ambushes
    by ARSA and allied Muslim armed groups against AA security outposts on Kyee Island
    resulted in heavy militant casualties and forced a chaotic, unarmed retreat into
    Bangladeshi territory51. This cross-border violence coincides directly with the
    commencement of merits hearings at the International Court of Justice (ICJ) regarding
    the Myanmar military's alleged genocide of the Rohingya people, while Human Rights
    Watch concurrently released a damning report accusing the Arakan Army of massacring
    Rohingya civilians in Hoyyar Siri51.
