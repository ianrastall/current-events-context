  headline: Former Polish Justice Minister Zbigniew Ziobro Granted Asylum in Hungary
  summary: The Hungarian government officially granted political asylum to Poland's
    former Justice Minister Zbigniew Ziobro, an unprecedented diplomatic maneuver
    that severely escalated tensions between the two European Union member states36.
    Ziobro had fled to Budapest to escape 26 impending criminal charges in Poland,
    which carry a potential 25-year prison sentence, regarding his alleged establishment
    of a criminal enterprise and the illicit diversion of a crime victims' fund to
    purchase Pegasus spyware for surveilling political opponents36. Taking to social
    media, Ziobro announced the asylum decision, expressing gratitude to Hungarian
    Prime Minister Viktor Orbán and asserting that he is the victim of a "creeping
    dictatorship" and a personal vendetta orchestrated by current Polish Prime Minister
    Donald Tusk37. The move, defended by Hungarian officials as protection against
    political repression, effectively shields a key architect of Poland's previous
    right-wing government from domestic accountability36.
