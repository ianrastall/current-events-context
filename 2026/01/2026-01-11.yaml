    importance: 7
    headline: "Kurdish forces complete withdrawal from Aleppo under mediated ceasefire"
    summary: >
      Kurdish forces withdrew from Aleppo following an internationally mediated
      ceasefire with the Syrian government. SDF commander Mazloum Abdi confirmed an
      agreement allowing fighters, civilians and wounded people to evacuate toward
      northern and eastern Syria. Government forces took control of the affected
      districts, and Syrian state media put the cumulative displacement from days of
      fighting at more than 150,000, while DW reported a lower figure of more than
      140,000 and at least 22 killed.
    key_data:
      - label: "Killed (cumulative, DW)"
        value: "At least 22"
