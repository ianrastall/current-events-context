    summary: >
      Federal Reserve Chair Jerome Powell disclosed that the Justice Department served
      the central bank with grand-jury subpoenas on January 9, threatening a criminal
      indictment connected to his June 2025 congressional testimony about renovations
      of Federal Reserve buildings. Powell attributed the threat to disagreement over
      monetary policy. President Trump denied knowing about the investigation, and
      Republican Senator Thom Tillis said he would oppose confirmation of any Federal
      Reserve nominee until the matter was resolved.
