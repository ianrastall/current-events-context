  summary: Following agonizing runner-up finishes in both 2024 and 2025, Team Poland
    finally secured its maiden United Cup tennis championship on January 11, 2026,
    overcoming a dramatic early deficit to defeat Switzerland 2-1 at the Ken Rosewall
    Arena in Sydney, Australia. The tie began with a massive upset, as Switzerland's
    Belinda Bencic—who was subsequently named the tournament's Most Valuable Player—rallied
    from a set down to defeat world No. 2 Iga Świątek 3-6, 6-0, 6-3, capitalizing
    heavily on 36 unforced errors from the Polish star. Facing elimination, Poland
    relied on Hubert Hurkacz, who was playing his first tournament following a seven-month
    knee injury layoff. Hurkacz delivered a dominant performance, hammering 18 aces
    to defeat veteran Stan Wawrinka 6-3, 3-6, 6-3. The championship was decided in
    a tense mixed doubles match, where the Polish duo of Jan Zielinski and Katarzyna
    Kawa utilized aggressive net play to dispatch Bencic and Jakub Paul in straight
    sets, 6-4, 6-3, sparking jubilant celebrations for the long-awaited title.70
