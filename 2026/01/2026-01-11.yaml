analytical_overview: >
  January 11, 2026 brought a sharp domestic escalation in the United States over the
  Federal Reserve and continued fallout from the Venezuela intervention abroad. Fed
  Chair Jerome Powell disclosed that the Justice Department had served the central
  bank with grand-jury subpoenas threatening a criminal indictment tied to his June
  testimony, which he called a pretext for pressuring the Fed over interest rates;
  Senator Thom Tillis said he would oppose any Fed nominee until the matter was
  resolved. President Trump separately demanded a deal with Cuba and threatened to
  cut off Venezuelan oil and money reaching Havana, while Homeland Security announced
  hundreds more federal officers for Minnesota after the fatal ICE shooting of Renée
  Good. Iran's death toll, per HRANA, reached a cumulative 538, and parliament speaker
  Mohammad Bagher Qalibaf warned that a US attack would make US bases and Israel
  targets for retaliation.

  In Syria, Kurdish forces completed their withdrawal from Aleppo under an
  internationally mediated ceasefire. Russia launched 154 drones at Ukraine overnight
  and a Ukrainian drone attack on Voronezh killed a Russian woman. European officials
  pushed back on US pressure over Greenland, Sudan's government returned to Khartoum,
  and Myanmar and Benin both held elections. Coordinated attacks hit petrol stations
  in southern Thailand, a gas explosion killed eight at a wedding in Islamabad, and
  the first bushfire death was confirmed in Victoria, Australia, as the toll there
  passed 300 destroyed structures.

