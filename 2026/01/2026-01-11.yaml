  headline: Myanmar Military Junta Conducts Second Phase of Heavily Boycotted Sham
    Elections
  summary: In a highly engineered attempt to legitimize its ongoing authoritarian
    rule, the military junta in Myanmar executed the second phase of a controversial
    general election on January 11, 2026, opening polling stations across 100 townships.
    The electoral process was universally condemned as a sham by the international
    community, domestic resistance factions, and human rights organizations, who pointed
    to the structural impossibility of a free vote while the country remains engulfed
    in civil war. To ensure the dominance of the military-backed Union Solidarity
    and Development Party (USDP), the junta had previously dissolved the immensely
    popular National League for Democracy (NLD) and transitioned the electoral system
    to proportional representation to dilute opposition influence. Furthermore, the
    regime engaged in extreme digital authoritarianism; data analysis revealed that
    the military blocked 93% of public access to major independent media websites
    (such as Myanmar Now and Frontier Myanmar) during the campaign period. While the
    junta's Union Election Commission claimed a 55% voter turnout for the second phase,
    independent observers noted starkly empty polling stations, representing a massive
    drop from the 70% turnout recorded prior to the 2021 coup.61
