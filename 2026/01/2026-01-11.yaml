  importance: 5
  headline: Iranian Regime Shuts Down Starlink Amid Escalating Death Toll and Regional
    Threats
  summary: As the nationwide 2025–2026 uprising against the Iranian theocracy entered
    a critical phase, the regime executed a sophisticated technological crackdown
    on January 11, 2026, successfully neutralizing Starlink satellite internet access
    for the first time and plunging the nation deeper into an 84-hour digital blackout.
    This suppression of communication infrastructure coincided with a grim milestone
    reported by the Human Rights Activists News Agency (HRANA), which verified that
    the state's lethal response had resulted in the deaths of 483 protesters and 47
    security personnel since the unrest began on December 28\. In stark contrast,
    Iranian state media broadcast footage of mass casualties while officially attributing
    the violence to foreign-backed "urban terrorist criminals." Viewing the domestic
    revolt through an increasingly militarized lens, the Islamic Revolutionary Guards
    Corps (IRGC) classified the riots as a direct extension of a proxy war with the
    West. Consequently, Parliament Speaker Mohammad Bagher Ghalibaf issued an explicit,
    high-level threat warning that any intervention by the United States to support
    the protesters would trigger immediate retaliatory strikes against U.S. military
    bases in the Middle East and sovereign Israeli territory.14
