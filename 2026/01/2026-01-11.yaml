  importance: 5
  headline: Vehicle Ramming Attack Targets Anti-Regime Diaspora Protesters in Los
    Angeles
  summary: The intense geopolitical friction surrounding the Iranian uprising manifested
    violently on American soil on January 11, 2026, when a 48-year-old man, identified
    as Calor Madanescht, intentionally drove a U-Haul box truck into a crowd of anti-Iranian
    regime demonstrators in the Westwood neighborhood of Los Angeles. Thousands of
    diaspora members and activists had gathered near the Wilshire Federal Building
    to express solidarity with the nationwide protests in Iran. As the speeding truck
    plowed toward the marchers on Veteran Avenue, individuals frantically jumped out
    of its path, resulting in two people sustaining minor injuries that did not require
    hospitalization. The truck, adorned with provocative banners reading "No Shah.
    No Regime. USA Don't Repeat 1953," was quickly swarmed by enraged demonstrators
    who shattered the vehicle's windows with flagpoles and tore down the signage.
    The Los Angeles Police Department rapidly intervened, forming a skirmish line
    to protect the driver before taking him into custody for reckless driving, an
    event that immediately drew investigative support from the FBI's Joint Terrorism
    Task Force.14
