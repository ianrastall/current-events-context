      declaring that Venezuelan oil and financial support would no longer reach the
      island, without specifying the terms of the proposed agreement. Cuban President
      Miguel Díaz-Canel rejected the pressure, and Foreign Minister Bruno Rodríguez
      disputed Trump's description of Cuba's security relationship with Venezuela and
      defended Cuba's right to obtain fuel from willing suppliers.
