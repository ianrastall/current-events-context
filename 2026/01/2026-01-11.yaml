- id: evt-2026-01-11-002
  category: Armed conflicts and attacks
  subcategory: Civil War and Insurgency
  topics: []
  importance: 5
  headline: Syrian Democratic Forces Fully Withdraw from Aleppo Under US-Brokered
    Ceasefire
  summary: The long-standing paradigm of Kurdish autonomous enclaves within major
    Syrian urban centers collapsed on January 11, 2026, as the Syrian Democratic Forces
    (SDF) completely withdrew from the Sheikh Maqsoud and Ashrafiyeh neighborhoods
    of Aleppo. This withdrawal, facilitated by a United States-brokered ceasefire,
    concluded days of intense urban warfare against the Syrian transitional government
    that resulted in 23 fatalities and triggered the mass displacement of approximately
    148,000 civilians, the vast majority of whom fled 40 kilometers to relative safety
    in Afrin. As state police units immediately deployed to secure the evacuated districts,
    the Syrian government declared all areas west of the Euphrates River formerly
    held by the SDF as "closed military zones," precipitating further preemptive civilian
    flight. The strategic retreat was highly chaotic; retreating SDF elements abandoned
    their posts at the Shaddadi detention facility, unilaterally releasing hundreds
    of Islamic State (ISIS) prisoners without coordinating with Damascus. This desperate
    tactical maneuver highlighted the total disintegration of the SDF's broader, multiethnic
    coalition—exacerbated by widespread defections of allied Arab tribal fighters—and
    fundamentally altered the balance of power in northeastern Syria in favor of the
    centralized state.5
