  headline: '''One Battle After Another'' and ''Hamnet'' Dominate the 83rd Golden
    Globe Awards'
  summary: 'The 83rd Annual Golden Globe Awards, hosted by comedian Nikki Glaser at
    the Beverly Hilton on January 11, 2026, served as both a celebration of cinematic
    achievement and a platform for pointed political activism. The night was dominated
    by two drastically different films: Paul Thomas Anderson''s dark action satire
    "One Battle After Another" swept the musical or comedy categories, earning Best
    Motion Picture, Best Director, and Best Screenplay, making Anderson only the second
    filmmaker in history to sweep all three awards. Conversely, Chloé Zhao''s historical
    drama "Hamnet," an adaptation exploring the grief of William Shakespeare''s family,
    won Best Motion Picture – Drama, with its lead Jessie Buckley taking home Best
    Actress. In the television sphere, the medical drama "The Pitt" (starring Noah
    Wyle) and Seth Rogen''s industry satire "The Studio" secured the top series awards.
    Beyond the accolades, the ceremony was heavily politicized; host Nikki Glaser
    delivered biting commentary on the pending Warner Bros. sale to Netflix, while
    numerous attendees, including Mark Ruffalo, wore black-and-white "BE GOOD" pins
    in explicit protest of the recent fatal shooting of protester Renee Good by a
    U.S. ICE agent.55'
