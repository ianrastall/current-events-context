      - label: "Displaced (cumulative, Syrian state media via The National)"
        value: "More than 150,000"
        citation_refs: [8]
    details:
      what_happened:
        - "Kurdish fighters and civilians departed Aleppo's Sheikh Maqsoud and Ashrafieh districts by bus."
        - "SDF commander Mazloum Abdi announced an understanding, reached through international mediation, covering the withdrawal."
        - "Government forces deployed into the formerly Kurdish-held neighborhoods."
        - "Access to the area remained restricted Sunday morning as unexploded remnants were cleared."
      why_it_matters:
        - "The agreement ended several days of fighting inside a major Syrian city."
        - "The clashes complicated efforts to integrate Kurdish-led administration and forces into the central state."
      uncertainty_notes:
        - "Displacement figures differ: DW reported more than 140,000, while The National cited Syrian state media's figure of more than 150,000; only the latter is directly quoted in this report's sources."
