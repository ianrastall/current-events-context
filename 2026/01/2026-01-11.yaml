  importance: 5
  headline: Catastrophic Bushfires in Victoria and New South Wales Trigger State of
    Emergency
  summary: Driven by a severe, prolonged heatwave and critically low soil moisture,
    a catastrophic bushfire crisis rapidly expanded across southeastern Australia
    on January 11, 2026, prompting the state of Victoria to declare a formal state
    of emergency across 18 local government areas. Consuming over 350,000 hectares
    of land—an area nearly twice the size of Greater London—the uncontained blazes
    destroyed at least 300 residential properties and buildings, particularly devastating
    the central highland communities of Ruffy and Harcourt. Tragically, police confirmed
    at least one fatality after discovering human remains in the village of Gobur.
    Despite the mobilization of thousands of firefighters and a fleet of over 70 aircraft,
    extreme winds hampered containment efforts for the 30 active fires in Victoria
    and 40 in New South Wales. The massive infrastructural toll, including the destruction
    of nearly 900 kilometers of power lines, combined with thick smoke degrading air
    quality as far as metropolitan Melbourne, marked the current crisis as the most
    severe disaster to strike the region since the historic 2019–2020 Black Summer.31
