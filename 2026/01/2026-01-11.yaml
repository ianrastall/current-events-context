- id: evt-2026-01-11-007
  category: Geopolitics and International Relations
  subcategory: Internal Politics and Diplomacy
  topics: []
  importance: 5
  headline: Sudanese Government Reestablishes Capital in Khartoum After 1,000 Days
    of War
  summary: Exactly 1,000 days after the outbreak of a devastating civil war that fractured
    the nation, Sudanese Prime Minister Kamil Idris formally announced the return
    of the sovereign government to the capital city of Khartoum on January 11, 2026\.
    Operating in exile from the eastern coastal city of Port Sudan since the conflict
    between the Sudanese Armed Forces (SAF) and the paramilitary Rapid Support Forces
    (RSF) erupted in April 2023, the government's relocation represents a monumental
    symbolic and administrative victory following a series of successful territorial
    reclamations by the SAF. Addressing a massive public rally in El Kadru Square
    in Khartoum North (Bahri), Prime Minister Idris officially declared 2026 the "Year
    of Peace" and unveiled the National Peace Initiative, aimed at transitioning the
    state from military crisis management to post-conflict reconstruction. Pledging
    to prioritize the rehabilitation of the heavily damaged University of Khartoum,
    healthcare facilities, and civil infrastructure, the return prompted the African
    Union to initiate rapid security assessments to reopen its liaison office in the
    capital, signaling cautious international validation of the government's renewed
    authority.24
