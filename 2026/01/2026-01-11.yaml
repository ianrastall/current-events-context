    importance: 9
    headline: "HRANA puts Iran protest deaths at 538 as Qalibaf warns of retaliation against a U.S. attack"
    summary: >
      The U.S.-based Human Rights Activists News Agency reported a cumulative toll of
      538 deaths in Iran's protest crackdown, comprising 490 protesters and 48 security
      personnel, and more than 10,600 detentions, though AP and Reuters said the
      figures could not be independently verified amid severe communications
      restrictions. Parliament Speaker Mohammad Bagher Qalibaf warned that a U.S.
      attack on Iran would make U.S. military installations and Israel targets for
      retaliation. President Masoud Pezeshkian said the government would address public
      grievances while condemning people he described as rioters.
    key_data:
      - label: "HRANA cumulative death toll"
        value: "538 (490 protesters, 48 security personnel)"
        citation_refs: [1]
      - label: "Cumulative detentions reported"
        value: "More than 10,600"
        citation_refs: [1]
    details:
      what_happened:
        - "HRANA's updated tally reached 538 deaths over about two weeks of unrest."
        - "AP and Reuters said the figures could not be independently verified because of internet and international telephone restrictions."
        - "Qalibaf warned that a U.S. attack would make U.S. bases, ships, and Israel targets for Iranian retaliation."
        - "President Pezeshkian said the government would address public concerns while condemning those he called rioters."
      why_it_matters:
        - "The reported scale of deaths and arrests marks a further escalation from the toll reported the previous day."
        - "Qalibaf's warning raises the possibility that the domestic crackdown could widen into an interstate military crisis."
      uncertainty_notes:
        - "HRANA's figures are self-reported by an opposition-aligned monitoring group and could not be independently verified by AP or Reuters; the nationwide internet blackout prevents outside confirmation."
        - "The Wikipedia current-events portal separately recorded an HRAI-verified toll of 483 protesters and 47 security personnel (530 total) via Sky News and Reuters on January 11, a slightly lower running count of what is evidently the same HRANA tally at an earlier point in the day."
