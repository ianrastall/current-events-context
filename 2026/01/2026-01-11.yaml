  importance: 5
  headline: Mass Russian Drone and Missile Barrage Weaponizes Winter Against Ukrainian
    Grid
  summary: In a massive escalation designed to exploit plummeting winter temperatures,
    the Russian Aerospace Forces launched a synchronized nationwide bombardment against
    Ukraine late on January 10 and into January 11, 2026, utilizing 156 strike drones
    and dozens of ballistic and cruise missiles. The assault prominently featured
    the combat debut of the "Geran-5," a new jet-powered variant of the Iranian-designed
    Shahed drone capable of carrying a 90-kilogram warhead at significantly higher
    speeds, fundamentally challenging Ukrainian interception algorithms. While Ukrainian
    air defense arrays successfully neutralized 135 UAVs and multiple Iskander missiles,
    the sheer density of the swarm allowed 16 strikes across 11 distinct locations.
    The impacts systematically devastated energy generation facilities and electrical
    substations, immediately plunging 30,000 residents in Kyiv and 46,000 families
    in Odesa into darkness without central heating amid lethal daytime temperatures
    of minus 8 degrees Celsius. The strikes resulted in four civilian fatalities and
    20 injuries nationwide, underscoring Moscow's persistent strategy of attrition
    aimed at breaking civilian morale through the weaponization of extreme weather
    and the methodical dismantling of civil infrastructure.10
