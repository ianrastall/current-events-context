  summary: Just one month after the military violently suppressed a mutiny and attempted
    coup d'état in the capital, over eight million registered voters in Benin went
    to the polls on January 11, 2026, to elect 109 representatives to the National
    Assembly. Despite the recent extreme political instability and the ongoing, severe
    threat of jihadist violence spilling over from Burkina Faso and Niger into northern
    territories, the single-round legislative elections proceeded peacefully. President
    Patrice Talon’s ruling three-party coalition sought to maintain or expand its
    81-seat supermajority against a fractured opposition. Notably, the main opposition
    party, The Democrats, competed vigorously in these parliamentary races despite
    having been structurally barred from the upcoming April presidential election
    due to controversial laws requiring high signature thresholds. Observers viewed
    the election as a critical stress test of Benin's democratic resilience and state
    security apparatuses during a fraught period of democratic backsliding.67
