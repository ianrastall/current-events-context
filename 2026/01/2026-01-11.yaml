- id: evt-2026-01-11-001
  category: Geopolitics and International Relations
  subcategory: Sanctions and Energy Policy
  topics: []
  importance: 5
  headline: United States Consolidates Influence Over Venezuelan Oil Sector Post-Maduro
  summary: The geopolitical calculus surrounding the Western Hemisphere's energy markets
    underwent a profound reconfiguration on January 11, 2026, as the United States
    formally consolidated its administrative and economic grip over Venezuela's oil
    sector following the military capture of Nicolás Maduro. Rather than initiating
    a total sovereign takeover of the state-owned petroleum company PDVSA, the U.S.
    implemented a strict economic quarantine, directing all Venezuelan crude exports
    through American marketers to control revenue flows and repatriate funds. This
    pragmatic policy shift was accompanied by the U.S. Treasury Department’s Office
    of Foreign Assets Control lifting sanctions on interim President Delcy Rodríguez,
    removing her from the Specially Designated Nationals list to facilitate immediate
    foreign direct investment and normalize diplomatic channels. U.S. Energy Secretary
    Chris Wright articulated that the strategy explicitly aims to sever Venezuela's
    deep financial and military dependencies on adversarial actors—namely Russia,
    which recently supplied $20 billion in weaponry, and Cuba—while incentivizing
    American oil executives to commit upwards of $100 billion to rehabilitate the
    nation's decaying energy infrastructure. By engaging surviving elements of the
    Venezuelan state apparatus, including previously indicted figures, the U.S. seeks
    to prevent catastrophic state collapse while firmly anchoring South America's
    largest proven oil reserves within Washington's strategic orbit.1
