- id: evt-2026-01-11-008
  category: Business and Economy
  subcategory: Energy and Infrastructure
  topics: []
  importance: 5
  headline: Egypt Finalizes 1.8 Billion Dollar Renewable Energy Mega-Deals with China
    and Norway
  summary: Confronting a severe domestic energy crisis driven by a sharp decline in
    natural gas production, the Egyptian government executed a massive strategic pivot
    on January 11, 2026, signing renewable energy agreements totaling $1.8 billion
    with the Norwegian developer Scatec and the Chinese technology firm Sungrow. Supervised
    by Prime Minister Mostafa Madbouly in the Suez Canal Economic Zone, the agreements
    grant land under usufruct arrangements to accelerate the deployment of green infrastructure.
    The cornerstone of the deal is the "Energy Valley" project in the Minya governorate,
    where Scatec will construct a 1.7-gigawatt solar photovoltaic plant backed by
    a 25-year, dollar-denominated power purchase agreement, supported by 4 gigawatt-hours
    of battery storage. Complementing this, Sungrow committed to localizing the supply
    chain by building a 50,000-square-meter energy storage battery manufacturing facility
    in the Suez Canal Economic Zone, targeting an annual production capacity of 10
    gigawatt-hours by 2027\. These capital investments are vital to Egypt’s Vision
    2030 strategy, aiming to elevate renewables to 42% of the national power mix and
    eliminate the state's costly dependence on imported liquefied natural gas.14
