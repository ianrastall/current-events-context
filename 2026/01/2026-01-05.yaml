    headline: "Venezuela issues emergency arrest decree after U.S. strikes topple Maduro"
    summary: >
      Reuters reporting summarized in the January 5 deep-research file described the
      aftermath of U.S. strikes and special-forces action in Caracas that captured
      Nicolás Maduro and Cilia Flores, damaged communications and power infrastructure,
      and left Delcy Rodríguez in control of the Venezuelan government. Venezuela
      declared a state of emergency and ordered police to arrest people accused of
      promoting or supporting the U.S. attack. The Wikipedia portal separately reported
      that a Venezuelan decree authorized a national manhunt and that Delcy Rodríguez
      was formally sworn in as acting and first female president.
