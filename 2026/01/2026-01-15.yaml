  - id: "evt-2026-01-15-004"
    category: "Disasters and accidents"
    subcategory: "Floods"
    topics:
      - "South Africa floods"
      - "Kruger National Park"
    importance: 7
    headline: "Floods in northern South Africa kill 19 and force evacuations from Kruger National Park"
    summary: >
      Weeks of torrential rain caused flooding in Limpopo and Mpumalanga provinces
      that had killed 19 people, according to South Africa's disaster management
      authorities. On January 15 Kruger National Park suspended visits and evacuated
      some guests and staff by helicopter. The military rescued people stranded in
      the region, and the weather service issued its highest-level warning with a
      further 100 to 200 millimetres of rain forecast.
    key_data:
      - label: "Killed"
        value: "19"
        citation_refs: [9]
      - label: "Provinces most affected"
        value: "Limpopo and Mpumalanga"
        citation_refs: [9]
      - label: "Forecast rainfall"
        value: "100 to 200 mm over 48 hours"
        citation_refs: [9]
    details:
      what_happened:
        - "Kruger National Park suspended visits because of flooding."
        - "Some guests and staff were evacuated from camps by helicopter."
        - "The regional death toll from the floods reached 19."
        - "Military aircraft rescued stranded civilians, including police officers."
      why_it_matters:
        - "The floods closed one of Africa's best-known wildlife parks and displaced hundreds of people across two provinces."
      uncertainty_notes:
        - "The 19 deaths are cumulative since the rains began in December, not all on January 15."
        - "The portal says hundreds were evacuated; no exact figure is given."
        - "The report lists overflowing rivers (Crocodile, Sabie, Letaba, Sand, Luvuvhu, Limpopo) and a 'red-level 10' warning from AP without a direct quotation."
