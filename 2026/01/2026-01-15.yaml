  - id: "evt-2026-01-15-003"
    category: "Disasters and accidents"
    subcategory: "Explosions"
    topics:
      - "2026 Utrecht explosions"
    importance: 6
    headline: "Explosions and fire collapse buildings in central Utrecht, injuring at least four"
    summary: >
      A series of explosions just before 3:30 p.m. set off a major fire in the
      Visscherssteeg alley near Mariaplaats in central Utrecht, collapsing at least one
      building and damaging others. At least four people were injured. The regional
      safety authority raised the response to a GRIP 2 regional emergency, UMC Utrecht
      activated its calamity hospital, and nearby homes and a parking garage were
      evacuated. Authorities suspected a gas explosion. Mayor Sharon Dijksma went to
      the scene.
