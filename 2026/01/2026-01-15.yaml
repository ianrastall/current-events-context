    details:
      what_happened:
        - "Explosions in the Visscherssteeg alley started a large fire."
        - "Several buildings were damaged and at least one collapsed."
        - "At least four people were injured."
        - "The response was scaled to GRIP 2 and UMC Utrecht's calamity hospital was activated; search teams used dogs and drones to check the rubble."
      why_it_matters:
        - "The blast struck a dense historic district in a major Dutch city and required a regional-level emergency response."
      uncertainty_notes:
        - "The cause was suspected to be gas; no cause had been confirmed."
        - "The report's claim that the buildings dated from the 15th century is not supported by a quotation."
