        citation_refs: [20]
      - label: "Crew remaining on ISS"
        value: "3"
        citation_refs: [21]
    details:
      what_happened:
        - "Crew Dragon splashed down off San Diego at 3:41 a.m. EST."
        - "The four crew members returned about a month early for medical evaluation of one of them."
        - "NASA said the crew were doing fine after the evacuation."
        - "Three crew members remained on the ISS."
      why_it_matters:
        - "It was the first time a crew has been brought home early from the ISS for medical reasons."
      uncertainty_notes:
