  - id: "evt-2026-01-15-001"
    category: "Armed conflicts and attacks"
    subcategory: "Maritime interdiction"
    topics:
      - "Operation Southern Spear"
      - "United States oil blockade during Operation Southern Spear"
    importance: 7
    headline: "U.S. forces seize Guyanese-flagged tanker Veronica in the Caribbean"
    summary: >
      Before dawn on January 15, Marines and sailors of Joint Task Force Southern
      Spear, acting in support of the Department of Homeland Security, launched from
      the aircraft carrier USS Gerald R. Ford and seized the sanctioned motor tanker
      Veronica in the Caribbean without incident. According to gCaptain, the ship
      previously sailed as Pegas under a Russian flag, is now listed as
      Guyanese-flagged, and has a record in the "shadow fleet" carrying Iranian and
      Venezuelan oil. A Coast Guard tactical team took part in the seizure, and the
      cutter Mohawk turned back to the Caribbean to escort the tanker.
    key_data:
      - label: "Vessel"
        value: "Motor tanker Veronica (ex-Pegas), Aframax, Guyanese flag"
        citation_refs: [2, 3]
      - label: "Launch platform"
        value: "USS Gerald R. Ford (CVN 78)"
        citation_refs: [1]
      - label: "Escort"
        value: "U.S. Coast Guard Cutter Mohawk"
        citation_refs: [3]
    details:
      what_happened:
        - "Joint Task Force Southern Spear personnel launched from USS Gerald R. Ford before dawn and boarded the Veronica."
        - "SOUTHCOM said the tanker was apprehended without incident."
        - "A Coast Guard tactical team with Department of War support seized the tanker, and Mohawk returned to escort it."
      why_it_matters:
        - "The seizure extended the U.S. campaign against sanctioned tankers moving Venezuelan oil, which had already produced several seizures in January."
      uncertainty_notes:
        - "gCaptain's account of the vessel's history (ten Iranian oil cargoes, ship-to-ship transfers of Venezuelan crude) is summarized in the report without a direct quotation."
        - "The Coast Guard release confirming the escort was published on February 17, more than a month after the event."
        - "The report's claim that the tanker was escorted 700 nautical miles to an anchorage off Puerto Rico is not supported by a quotation."
