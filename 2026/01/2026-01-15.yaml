    headline: "Uganda votes for president and parliament under an internet shutdown"
    summary: >
      Ugandans voted to elect a president and 529 members of parliament, with public
      internet access cut since January 13 and reports of biometric voter-verification
      failures. President Yoweri Museveni, 81, sought to extend his four-decade rule
      against his main challenger, Robert Kyagulanyi, known as Bobi Wine, of the
      National Unity Platform. AP later reported provisional results from half of the
      polling stations giving Museveni more than 70% and Kyagulanyi 19%; Kyagulanyi
      rejected the results, and police reported arresting more than 20 opposition
      supporters.
