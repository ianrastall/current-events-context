  - id: "evt-2026-01-15-002"
    category: "Business and economy"
    subcategory: "Product recalls"
    topics:
      - "Product recall"
      - "Frigidaire"
    importance: 4
    headline: "Frigidaire mini-fridge recall expanded by 330,000 units over fire risk"
    summary: >
      Curtis International, the distributor of Frigidaire-brand mini-fridges, expanded
      an earlier recall by about 330,000 units of the 6-can model EFMIS121, the U.S.
      Consumer Product Safety Commission announced. The CPSC said the units' internal
      electrical components can short-circuit and ignite the plastic housing; six
      fires causing property damage were reported for this model. The fridges were
      sold only at Target stores and Target.com from January 2020 to October 2023 for
      about $30. With the earlier recall of 634,000 units, the total approaches one
      million.
    key_data:
      - label: "Units added"
        value: "About 330,000 (model EFMIS121)"
        citation_refs: [4, 5]
      - label: "Earlier recall"
        value: "634,000 units"
        citation_refs: [5]
      - label: "Combined total"
        value: "About 964,000"
        citation_refs: [6]
      - label: "Fires reported for this model"
        value: "6, with property damage"
        citation_refs: [4]
    details:
      what_happened:
        - "The CPSC published Curtis International's expanded recall notice."
        - "The hazard is a short circuit in internal components that can ignite the plastic housing."
        - "Six fires causing property damage were reported for the EFMIS121 model."
        - "Owners were told to unplug the units, cut the power cords and register for a refund."
      why_it_matters:
        - "The expansion brings the recall across Frigidaire mini-fridge models to nearly one million units sold through a single retailer."
      uncertainty_notes:
        - "CBS dates the earlier 634,000-unit recall to July 2024; the portal says it was 'last year' (2025)."
        - "The report's figure of more than $700,000 in property damage across all models is attributed to CBS News without a quotation and is not recorded in key_data."
