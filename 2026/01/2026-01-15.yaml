    importance: 7
    headline: "Trump threatens to invoke the Insurrection Act over Minneapolis protests against ICE"
    summary: >
      President Donald Trump threatened to invoke the Insurrection Act so that he could
      send U.S. military forces to Minnesota, where protests against the federal
      immigration-enforcement surge had continued since an ICE agent killed Renée Good
      on January 7 and intensified after an ICE officer shot and wounded a man in
      Minneapolis on January 14. AP reported that roughly 2,000 to 3,000 federal agents
      were operating in the area, compared with fewer than 600 Minneapolis police
      officers. The administration rejected demands from Minnesota Democrats to
      withdraw federal agents.
    key_data:
      - label: "Federal agents in the area (AP)"
        value: "About 2,000 to 3,000"
        citation_refs: [27]
      - label: "Minneapolis police officers (AP)"
        value: "Fewer than 600"
        citation_refs: [27]
    details:
      what_happened:
        - "Trump threatened to invoke the Insurrection Act to send military forces to Minnesota."
        - "AP set out how earlier presidents had used the law."
        - "The administration refused to withdraw federal immigration agents from the Minneapolis area."
      why_it_matters:
        - "Invoking the Insurrection Act would allow the use of the military for domestic law enforcement without a state's consent, a step legal experts described as a major test of presidential power."
      uncertainty_notes:
        - "The report says an ICE agent's 'defensive shots' fatally wounded a civilian who allegedly attacked with a snow shovel and broomstick. That conflates two incidents: the January 14 shooting, in which the portal records a person shot and injured (evt-2026-01-14-015), and the January 7 killing of Renée Good (evt-2026-01-07-007). The conflated account is not used."
        - "The report also cites AP on Vice President JD Vance calling Good's death 'a tragedy of her own making' 'on Thursday'. Those remarks appear to date from Thursday, January 8, the day after the killing, not January 15, so they are not recorded here."
        - "The exact time and form of Trump's threat (for example, a social-media post) are not given in the quoted source."
