  - id: "evt-2026-01-15-005"
    category: "Disasters and accidents"
    subcategory: "Construction accidents"
    topics:
      - "2026 Sikhio train disaster"
      - "Rama II Road"
    importance: 6
    headline: "Second crane collapse in two days kills two on Thailand's Rama II Road"
    summary: >
      A construction crane on an elevated expressway project collapsed onto Rama II
      Road in Samut Sakhon province, crushing two vehicles and killing two people;
      police said five others were injured. Transport Minister Phiphat
      Ratchakitprakarn said Italian-Thai Development was the contractor at this site
      and at the Sikhio rail site where a crane fell on a train the previous day. The
      government moved to cancel the firm's contracts, blacklist it, and suspend about
      a dozen of its state projects.
    key_data:
      - label: "Killed"
        value: "2"
        citation_refs: [10]
      - label: "Injured"
        value: "5"
        citation_refs: [11]
      - label: "State projects to be suspended"
        value: "About a dozen"
        citation_refs: [30]
    details:
      what_happened:
        - "A crane fell from an elevated expressway construction site onto Rama II Road, crushing two vehicles."
        - "Two people were killed and five injured, according to police."
        - "The transport minister said Italian-Thai Development was the contractor at both this site and the January 14 Sikhio rail site."
        - "The government moved to cancel contracts, blacklist the contractor and suspend about a dozen of its state projects."
      why_it_matters:
        - "Two fatal crane failures by the same contractor in two days intensified scrutiny of safety on Thai state infrastructure projects."
      uncertainty_notes:
        - "The report says the Rama II expressway project is locally nicknamed 'Death Road' after earlier fatal accidents; this is not supported by a quotation."
        - "The report's table gives the Sikhio toll as 32 killed and 64 injured; evt-2026-01-14-002 records 32 and 66 per the portal."
