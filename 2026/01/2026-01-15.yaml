        - "The report cites AP on failures of biometric verification machines at polling stations."
        - "Provisional results from half of polling stations showed Museveni above 70% and Kyagulanyi at 19%."
        - "Kyagulanyi rejected the results and said his polling agents had been abducted; police reported more than 20 arrests of opposition supporters."
      why_it_matters:
        - "The vote was held with communications cut and opposition activity restricted, which limited independent scrutiny of the count."
