    headline: "Maharashtra votes in municipal elections for 29 corporations including Mumbai's BMC"
    summary: >
      Voters in Maharashtra elected councils for 29 municipal corporations, including
      the Brihanmumbai Municipal Corporation, India's richest civic body, where polling
      ran from 7:30 a.m. to 5:30 p.m. across 227 wards. About 15,931 candidates
      contested around 2,869 seats statewide. The Indian Express reported Mumbai
      turnout of about 41% by the afternoon, confusion over multiple ballots in
      multi-member wards, and exit polls projecting a win for the BJP and Shiv Sena
      (Shinde) alliance in the BMC. Results were due on January 16.
