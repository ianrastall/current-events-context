    importance: 6
    headline: "Crew-11 returns to Earth a month early after first medical evacuation from the ISS"
    summary: >
      The SpaceX Crew Dragon carrying NASA's Zena Cardman and Mike Fincke, Japan's
      Kimiya Yui and Russian cosmonaut Oleg Platonov splashed down in the Pacific off
      San Diego at 3:41 a.m. EST, ending the first medical evacuation in the history of
      the International Space Station. The crew returned about a month early because of
      an undisclosed medical issue affecting one member; NASA said the astronaut was
      stable and that the return was not an emergency deorbit. The crew had docked at
      the station in August 2025, and their departure left three people aboard.
