    importance: 8
    headline: "U.S. to suspend immigrant-visa processing for nationals of 75 countries"
    summary: >
      The State Department announced that it would suspend the processing of
      immigrant visas for applicants from 75 countries whose nationals it deems likely
      to need public assistance, effective January 21. The hold applies to immigrant
      visas leading to permanent residence; tourist and business visas are not
      affected. The announcement followed reports that the United States recorded
      negative net migration in 2025, which DrydenWire, citing Brookings, called the
      first such year in at least half a century.
