  - id: "evt-2026-01-14-003"
    category: "International relations"
    subcategory: "Peace diplomacy"
    topics:
      - "Sudanese civil war"
      - "Sudan Quad"
    importance: 6
    headline: "Cairo meeting calls for renewed Sudan peace push after government's return to Khartoum"
    summary: >
      Egypt hosted a meeting in Cairo with representatives of the United States,
      the United Arab Emirates, Saudi Arabia and several European countries to press
      Sudan's warring parties toward a humanitarian truce and ceasefire, according to
      The National. The meeting came days after Prime Minister Kamil Idris announced
      that the army-backed government would return to Khartoum after nearly three
      years in Port Sudan. Sudan's higher education ministry separately ordered
      universities back to their original Khartoum campuses by August 1, 2026 under
      Ministerial Decree No. 83. The war has displaced about 13.6 million people.
    key_data:
      - label: "Participants named in the report"
        value: "Egypt (host), United States, UAE, Saudi Arabia, several European states"
        citation_refs: [10]
      - label: "Displaced by the war"
        value: "About 13.6 million"
        citation_refs: [10]
      - label: "University return deadline (Decree No. 83 of 2026)"
        value: "August 1, 2026"
        citation_refs: [11]
    details:
      what_happened:
        - "Egyptian officials hosted Quad and European representatives in Cairo to push for a ceasefire in Sudan."
        - "The National reported that Prime Minister Idris had announced the government's return to Khartoum earlier in the week."
        - "Sudan's higher education minister issued Decree No. 83 requiring institutions to resume at their original campuses by August 1, 2026."
      why_it_matters:
        - "The meeting showed regional and Western governments still pressing for a negotiated truce despite the army's territorial gains and its symbolic return to the capital."
      uncertainty_notes:
        - "The deep-research report provides no direct quotation about the Cairo meeting itself; its participants and purpose are taken from the report's summary of The National."
        - "The date of Decree No. 83 is not established by the sources; INHEA is an undated running page."
        - "The report's figure of nearly 21 million people facing acute food insecurity is attributed to The National without a quotation and is not recorded in key_data."
        - "The government's return to Khartoum was announced before January 14 and is recorded as evt-2026-01-11-012."
