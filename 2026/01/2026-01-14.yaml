      - "2026 Sikhio train disaster"
      - "Thailand high-speed rail"
    importance: 8
    headline: "Construction crane falls onto passenger train in Sikhio, Thailand, killing at least 32"
    summary: >
      A construction crane working on an elevated high-speed rail line collapsed onto a
      passing passenger train in Sikhio district, Nakhon Ratchasima province, derailing
      carriages and briefly setting them alight. The portal and The Nation put the
      death toll at 32 at least, with 66 injured per the portal; earlier reports gave
      lower death counts and up to 80 injured. Prime Minister Anutin Charnvirakul
      ordered the contractors, the Italian-Thai Development and China Railway
      Engineering Corporation joint venture, blacklisted, and the Department of Special
      Investigation opened a probe. The Ministry of Transport launched its own
      investigation.
    key_data:
      - label: "Killed"
        value: "At least 32"
        citation_refs: [7, 25]
      - label: "Injured"
        value: "66 (portal); up to 80 in earlier reports"
        citation_refs: [6, 25]
      - label: "Carriages hit"
        value: "3"
        citation_refs: [6]
      - label: "Contractor"
        value: "ITD-CREC joint venture"
        citation_refs: [7]
    details:
      what_happened:
        - "A crane on an elevated high-speed rail construction site collapsed onto three carriages of a passing train."
        - "The train derailed and briefly caught fire, trapping passengers in damaged carriages."
        - "Reported deaths rose through the day from 19 and 22 to 25, 28 and at least 32."
        - "Prime Minister Anutin ordered the ITD-CREC joint venture blacklisted and a Department of Special Investigation probe."
        - "The Ministry of Transport launched an investigation."
      why_it_matters:
        - "The disaster raised questions about safety oversight on Thailand's high-speed rail construction and about the contractors involved."
        - "The Nation noted that CREC had been linked to the collapse of the State Audit Office building in Bangkok in 2025."
      uncertainty_notes:
        - "Casualty figures varied by source and time: ThePrint (Reuters) headline 19 killed and 80 injured, its body 25 killed; Al Jazeera's URL and headline 22 and 28 killed; The Nation and the portal at least 32 killed, the portal with 66 injured. casualty_report records 32 and 66."
        - "The report identifies the train as Special Express No. 21 from Bangkok to Ubon Ratchathani; none of the quoted source material confirms the train number."
