    topics:
      - "Anglophone Crisis"
      - "Mbororo people"
    importance: 7
    headline: "Gunmen kill about 15 Mbororo villagers, including eight children, in Gidado, northwest Cameroon"
    summary: >
      Gunmen attacked the Gidado neighbourhood near Ndu in Cameroon's Northwest Region
      at about 5:30 a.m., firing into homes while residents slept. AP, citing an
      official, reported at least 15 killed, including eight children; other outlets
      gave 12 or 14 dead as the count rose through the day. The victims were from the
      Mbororo pastoralist community, which separatist fighters have accused of
      collaborating with the security forces. Officials blamed "Ambazonia terrorists",
      though no group claimed responsibility. Houses and granaries were burned, cattle
      killed and motorcycles taken. Prime Minister Joseph Dion Ngute later met Mbororo
      representatives and promised security measures.
    key_data:
      - label: "Killed (AP, citing an official)"
        value: "At least 15, including 8 children"
        citation_refs: [1]
      - label: "Killed and wounded (Namibia Daily News)"
        value: "14 killed, 14 wounded"
        citation_refs: [3]
      - label: "Time of attack"
        value: "About 5:30 a.m. local time"
        citation_refs: [2]
      - label: "Property damage (Mimi Mefo Info, per the report)"
        value: "6 houses and 2 granaries burned, at least 15 cattle killed, 8 motorcycles stolen"
        citation_refs: [5]
    details:
      what_happened:
        - "Gunmen stormed Gidado at about 5:30 a.m. and fired into homes while residents slept."
        - "Between 12 and 15 civilians were reported killed, depending on the source and time of reporting; AP's figure of 15 included eight children."
        - "Attackers burned six houses and two granaries, killed at least 15 cattle and stole eight motorcycles, according to the report's local sources."
        - "Officials attributed the attack to Ambazonian separatists; no faction claimed it."
        - "Prime Minister Dion Ngute later met Mbororo representatives and assured them of security measures."
      why_it_matters:
        - "The deliberate targeting of the Mbororo community reflects the ethnic dimension that the Anglophone conflict has taken on in the Northwest Region."
        - "The destruction of granaries and livestock hit the livelihoods of a pastoralist community in an area where aid access is limited."
      uncertainty_notes:
        - "Death toll varies by source and time: Xinhua's early report gave at least 12 killed and 15 wounded; Namibia Daily News gave 14 killed and 14 wounded; AP gave at least 15 killed including eight children. casualty_report records AP's 15 and Namibia Daily News' 14 wounded."
        - "The report gives six women among the dead and children aged two to 17, citing local reporting; these details are not independently confirmed."
        - "The Guardian Post report on the prime minister's meeting was published January 24; the meeting took place after the attack, not necessarily on January 14."
