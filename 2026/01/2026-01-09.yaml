  importance: 5
  headline: Five U.S. States Sue Trump Administration Over $10 Billion Public Safety
    Net Funding Freeze
  summary: The attorneys general of five Democratic-led states—California, Colorado,
    Illinois, Minnesota, and New York—have launched a highly coordinated legal assault
    against the Trump administration, filing a lawsuit to block a sudden executive
    order freezing $10 billion in federal funding allocated for critical child care
    subsidies, social services, and low-income family cash support.4 The federal government
    suspended the Administration for Children and Families (ACF) funds by citing unspecified
    claims of fraud linked to a billion-dollar scheme in Minnesota, subsequently demanding
    an exhaustive four to six years' worth of documentation regarding every receiving
    organization—a mandate state officials derided as an "intentionally impossible
    task".43 In response to the lawsuit, which argues that the funding freeze is arbitrary,
    ultra vires, and deeply violates both the Separation of Powers and the Congressional
    Appropriations Clause, a federal judge in the Southern District of New York issued
    an injunction temporarily halting the freeze while expressing skepticism over
    the executive branch's authority.4
