  headline: Russia Deploys Oreshnik Ballistic Missile in Deadly Strikes on Ukraine
  summary: The Russian Federation executed a devastating and highly advanced wave
    of drone and missile strikes deep into sovereign Ukrainian territory, resulting
    in at least four civilian fatalities and 28 severe injuries in the capital.1 In
    a massive escalation of force capabilities, the attacks involved the operational
    deployment of the nuclear-capable "Oreshnik" intermediate-range ballistic missile,
    which successfully penetrated defenses to strike a critical infrastructure site
    in the western city of Lviv.1 In Kyiv, the widespread bombardment severely damaged
    multiple high-rise apartment buildings and notably inflicted collateral structural
    damage upon the Qatari embassy, drawing immediate international condemnation.1
    European leaders, alongside figures such as Mark Carney, rapidly condemned the
    escalation, warning that the battlefield deployment of intermediate-range ballistic
    weaponry represents a severe, unmitigated risk to global strategic stability.3
