- id: evt-2026-01-09-002
  category: Civil Unrest
  subcategory: Protests and State Crackdowns
  topics: []
  importance: 5
  headline: Total Internet Blackout Conceals Mass Casualties in Iranian Anti-Government
    Uprising
  summary: The Islamic Republic of Iran is navigating an existential domestic crisis
    as severe, nationwide anti-government protests—initially triggered by a deepening
    economic collapse—are met with overwhelming and lethal state violence.3 In a calculated
    effort to obscure the true scale of the massacre and paralyze protest coordination,
    Iranian authorities have implemented a near-total blackout of internet and telecommunications
    infrastructure, causing national data traffic to drop to effectively zero since
    January 8\.3 Operating under the cover of this digital darkness, security forces
    have utilized live ammunition against civilian demonstrators in cities such as
    Kerman and deliberately blocked emergency fire apparatus from responding to protest-related
    fires in Rasht.14 Human rights monitors and independent tracking organizations
    report catastrophic casualty figures that severely conflict with state narratives;
    while localized reports document at least 392 dead in Rasht alone, broader estimates
    suggest an unverified nationwide death toll reaching up to 12,000, compounded
    by a systematic state effort involving morgue staff and medical workers to secretly
    execute the wounded and conduct mass burials of the disappeared.14 As the regime
    of Supreme Leader Ayatollah Khamenei vows to punish demonstrators "without any
    leniency," figures such as Reza Pahlavi have publicly urged further mobilization,
    indicating a protracted and highly destabilizing internal conflict.3
