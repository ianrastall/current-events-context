  summary: Bowing to immense political pressure and community outrage, Australian
    Prime Minister Anthony Albanese formally announced the establishment of the Royal
    Commission on Antisemitism and Social Cohesion to exhaustively investigate the
    horrific terrorist attack at Bondi Beach and the broader, systemic issue of antisemitism
    across the nation.29 The Governor-General issued Letters Patent appointing former
    High Court Justice The Honourable Virginia Bell AC SC as the sole Royal Commissioner,
    tasking her with delivering a rapid interim report by April 30 and a final report
    by December 14, 2026\.60 The Commission is designed to aggressively probe intelligence
    gaps and the social drivers of racial violence, accompanied by newly passed, bespoke
    legislation explicitly creating legal protections for whistleblowers providing
    highly sensitive intelligence to the inquiry.60 This marks the mobilization of
    Australia's highest form of public inquiry to address acute fractures in domestic
    social cohesion following mass-casualty hate crimes.
