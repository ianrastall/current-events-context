  summary: Preliminary results from Benin's legislative elections indicate a massive,
    systematic victory for the political coalition backing President Patrice Talon,
    though official reporting on the exact distribution of parliamentary seats remains
    deeply conflicted and opaque.20 The ruling Progressive Union for Renewal (UPR)
    and the Republican Bloc (BR) captured 41.21% and 36.62% of the vote respectively,
    amidst an alarmingly low voter turnout of just 36.74%.20 While some official commission
    sources report that the UPR and BR swept all 109 seats by utilizing electoral
    threshold laws to shut out the opposition Democrats, other analytical sources
    suggest the Democrats successfully secured 28 seats, which would end their four-year
    parliamentary absence.20 The election was heavily marred by allegations of massive
    voter corruption and ballot box stuffing; while the Constitutional Court acknowledged
    these irregularities, it controversially dismissed them as insufficient to invalidate
    the overall ballot, ensuring Talon's continued legislative dominance.20
