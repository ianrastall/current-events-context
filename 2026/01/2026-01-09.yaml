  headline: Explosive Device Targets Conservative Lawmaker in Honduran National Congress
  summary: The deeply volatile political transition in Honduras deteriorated into
    direct physical violence when an unidentified assailant hurled a homemade explosive
    device into an outdoor hallway of the National Congress building in Tegucigalpa,
    directly injuring conservative National Party lawmaker Gladis Aurora López.17
    The device detonated mere centimeters from López while she was conducting a news
    briefing, inflicting visible shrapnel wounds and bleeding to her back.17 This
    targeted attack occurs in a climate of extreme institutional mistrust following
    the highly disputed November 2025 presidential election; the National Party has
    openly denounced the blast as an act of political terrorism and accused affiliates
    of the ruling Liberty and Refoundation (LIBRE) Party of orchestrating the violence
    to intimidate democratic institutions.17 The explosion occurred specifically as
    lawmakers convened to consider a LIBRE proposal to mandate an election recount,
    further destabilizing the path toward the inauguration of President-elect Nasry
    Asfura.17
