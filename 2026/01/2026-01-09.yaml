  headline: Constitutional Council Confirms Touadéra's Third Term in Central African
    Republic
  summary: The Constitutional Council of the Central African Republic has officially
    validated the highly contested provisional election results, granting incumbent
    President Faustin-Archange Touadéra a controversial third term in office after
    securing a claimed 76.15% of the vote.19 The historic election, which saw citizens
    vote simultaneously for all tiers of government for the first time, was fundamentally
    compromised by a massive boycott from the main opposition coalition, who vehemently
    denounced the removal of presidential term limits via a prior referendum and cited
    a fundamentally unequal political environment.19 The runner-up, former Prime Minister
    Anicet-Georges Dologuélé, who received just 14.66% of the vote, has fiercely contested
    the outcome, self-proclaiming victory while alleging widespread electoral fraud,
    systemic malpractice by the National Elections Authority, and restricted campaign
    travel.19 This institutional validation solidifies Touadéra's consolidation of
    power in a nation deeply reliant on Russian mercenary groups for state security,
    raising alarms over the potential resurgence of armed rebellion.19
