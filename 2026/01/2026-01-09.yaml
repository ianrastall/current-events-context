  headline: Storm Goretti Causes Widespread Devastation and Fatalities Across Northern
    Europe
  summary: Storm Goretti, a rapidly intensifying extratropical cyclone, battered Northern
    Europe with catastrophic force, unleashing destructive winds and heavy snowfall
    that resulted in massive infrastructure failure and at least two fatalities in
    the United Kingdom.22 Deepening to a central pressure of 947 hPa over the Atlantic,
    the storm generated phenomenal wind gusts reaching up to 132 mph in Barfleur,
    France, and 100 mph in the UK, prompting meteorological agencies to issue rare
    red wind warnings and triggering the temporary closure of several major regional
    airports and cross-channel ferry services.22 The severe weather system completely
    overwhelmed utility grids, knocking out electricity for nearly half a million
    customers—including 380,000 households in France alone—while downed trees and
    airborne debris caused catastrophic property damage, rail blockages, and transport
    gridlock across Cornwall and the Channel Islands.22
