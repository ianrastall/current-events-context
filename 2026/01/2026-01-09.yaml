  headline: Release of ICE Agent Shooting Video Sparks Massive Protests in Minneapolis
  summary: Heated, large-scale protests have erupted across Minneapolis and threaten
    to trigger nationwide civil unrest following the public release of body-worn and
    civilian video footage depicting a federal Immigration and Customs Enforcement
    (ICE) agent fatally shooting a woman on a residential street.24 The agent, identified
    as Jonathan Ross, opened fire and killed civilian Renee Good; federal officials
    have staunchly defended the use of lethal force, claiming the action was taken
    in self-defense after Good allegedly attempted to strike the agent with her vehicle.24
    As the community vehemently demands transparency and accountability, Minnesota
    Governor Tim Walz declared a formal "day of unity" to honor the victim, though
    local and state law enforcement officials have publicly complained that they are
    being systematically shut out of the federal investigation surrounding her death,
    further inflaming public mistrust.3
