  summary: The U.S. Department of Justice released translated transcripts of video
    confessions on January 6, 2026, confirming the premeditated nature of the mass
    shooting at Brown University and the subsequent murder of an MIT professor in
    December 2025\.49 The videos were recorded by the perpetrator, Portuguese national
    Claudio Manuel Neves Valente, and recovered by the FBI from a storage facility
    in New Hampshire prior to his suicide.49 The chilling transcripts reveal Valente's
    deep-seated personal grievances and absolute lack of remorse, as he blamed the
    victims for their own deaths.49 Critically, the release dispels persistent rumors
    of international terrorism, with Valente explicitly denying any ideological or
    religious motives for the rampage.49
