    importance: 9
    headline: "Venezuela confirms 23 soldiers among 80 killed as fallout from Maduro's capture widens"
    summary: >
      Venezuela confirmed that 23 members of its military were among the 80 people
      killed during the U.S. strikes on the country, including its capital Caracas, on
      January 3. The strikes accompanied a U.S. special-operations raid, reported by The
      Guardian as lasting two hours and 28 minutes, that captured Nicolás Maduro and his
      wife Cilia Flores, who pleaded not guilty to narcotrafficking charges in a
      Manhattan federal court on January 5. Delcy Rodríguez was sworn in as acting
      president, President Donald Trump discussed reviving Venezuela's oil sector with
      U.S. oil executives, and China's foreign ministry said at a United Nations Security
      Council emergency meeting that military means are not the solution.
    key_data:
      - label: "Total reported killed in U.S. strikes"
        value: "80"
        citation_refs: [37]
      - label: "Venezuelan military personnel among the dead"
        value: "23"
        citation_refs: [37]
      - label: "Reported duration of the capture operation"
        value: "2 hours 28 minutes"
        citation_refs: [2]
      - label: "Plea entered by Maduro in Manhattan federal court"
        value: "Not guilty"
        citation_refs: [1]
    details:
      what_happened:
        - "Venezuela confirmed that 23 members of its military were among the 80 people killed in the U.S. airstrikes three days earlier."
        - "The Guardian reported that the U.S. mission that captured Nicolás Maduro and Cilia Flores lasted two hours and 28 minutes and relied on tactical surprise and air dominance."
        - "Maduro appeared in a federal court in Manhattan and pleaded not guilty to narcotrafficking charges."
        - "Delcy Rodríguez was sworn in as acting president, and Trump held discussions with U.S. oil executives about Venezuela's petroleum sector."
        - "At a United Nations Security Council emergency meeting, China's representative stressed that military means are not the solution to problems."
      why_it_matters:
        - "The confirmation of military deaths is the first official Venezuelan breakdown of the casualty figure from the January 3 strikes."
        - "The removal of a sitting head of state by U.S. military force drew condemnation at the United Nations and raised questions about international legal norms in the Western Hemisphere."
        - "Trump's linkage of the operation to Venezuela's oil sector connects the intervention directly to global energy markets."
      uncertainty_notes:
        - "The 80-death figure matches the January 4 portal total; a Venezuelan official cited on January 5 gave a figure of 100, which remains unreconciled."
        - "The deep-research report also claimed that multiple sanctioned tankers evaded a U.S. maritime blockade; that claim is omitted here because no cited source for January 6 supports it directly."
        - "The source report was compiled on 2026-03-25 and its synthesis references later events (U.S. and Israeli strikes on Iran in March 2026); those references are excluded from this event."
