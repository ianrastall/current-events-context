  headline: Civil Society Accuses Mozambican Police of Massacring 38 Artisanal Miners
  summary: A severe crisis of state legitimacy emerged in early January 2026 following
    violent clashes in the Marraca mining area of Mozambique's Mogovolas district
    on December 28-29, 2025\.27 Local civil society organizations, spearheaded by
    the NGO Kóxukhoro, allege that heavily armed police indiscriminately fired upon
    artisanal gold and gemstone miners, massacring at least 38 people to protect elite,
    illicit economic interests after a local bribery extortion system collapsed.27
    In stark contrast, the Police of the Republic of Mozambique (PRM) officially maintain
    that only seven individuals died—including one police officer—and assert that
    their camp was assaulted by the Naparamas militia and armed supporters of the
    political opposition.27 Human Rights Watch has demanded an urgent, impartial investigation
    into the disproportionate use of lethal force.27
