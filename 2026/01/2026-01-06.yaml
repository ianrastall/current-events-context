    headline: "Fifth anniversary of the January 6 Capitol attack marked by rival narratives"
    summary: >
      The fifth anniversary of the January 6, 2021 attack on the U.S. Capitol was the
      first since President Donald Trump pardoned or commuted the sentences of nearly
      1,600 people prosecuted in connection with the riot. A smaller crowd of his
      supporters, including pardoned defendants, returned to the Capitol, while the
      White House published material defending the pardons and House Democrats released
      their own account of the attack. The Associated Press reported that the parties
      still do not share a history of the day and that an official plaque honoring the
      police who defended the Capitol has never been hung.
