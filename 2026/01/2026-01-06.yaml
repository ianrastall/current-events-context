  headline: U.S. Military Capture of Venezuelan President Nicolás Maduro
  summary: In a profound escalation of hemispheric geopolitics, the United States
    executed Operation Absolute Resolve in the early hours of January 3, 2026, launching
    a massive, coordinated military raid on Caracas to capture Venezuelan President
    Nicolás Maduro and his wife, Cilia Flores.3 Following their extraction, the pair
    appeared in a Manhattan federal court on January 5, pleading not guilty to extensive
    narco-terrorism and weapons charges.3 The U.S. intervention, which involved Delta
    Force operatives and heavy suppression of Venezuelan air defenses, effectively
    decapitated the incumbent government, leading Vice President Delcy Rodríguez to
    be sworn in as acting president amidst immediate deployments of armed civilian
    paramilitaries (*colectivos*).3 The Trump administration has explicitly linked
    the military action to the restructuring of Venezuela's vast oil reserves, initiating
    immediate talks with domestic energy executives while simultaneously confronting
    deep diplomatic backlash from Latin American neighbors and the United Nations.3
