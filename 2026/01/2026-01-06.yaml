    importance: 8
    headline: "European leaders and Denmark reject U.S. pressure over Greenland as Canada backs Nuuk"
    summary: >
      Leaders of several European states joined Denmark and Greenland in a joint
      statement defending Greenland's sovereignty after President Donald Trump renewed
      his interest in acquiring the Arctic territory. Greenlandic Prime Minister
      Jens-Frederik Nielsen rejected what he called fantasies about annexation, and
      Danish Prime Minister Mette Frederiksen warned that a U.S. attack on Greenland would
      mean the end of NATO. Canadian Prime Minister Mark Carney said Greenland's security
      is included in NATO and announced plans to open a Canadian consulate in Nuuk.
    key_data:
      - label: "Signatories reported for the joint statement"
        value: "France, Germany, Italy, Poland, Spain, the United Kingdom, Denmark and Greenland"
        citation_refs: [5]
      - label: "Canadian diplomatic step"
        value: "Planned consulate in Nuuk"
        citation_refs: [5]
    details:
      what_happened:
        - "European leaders issued a joint declaration affirming Greenland's sovereignty and supporting a stronger NATO presence in the Arctic."
        - "Greenlandic Prime Minister Jens-Frederik Nielsen said there should be no more pressure, innuendo or fantasies about annexation."
        - "Danish Prime Minister Mette Frederiksen warned that a U.S. military attack on Greenland would mean the end of NATO."
        - "Canadian Prime Minister Mark Carney said Greenland's security is included in NATO and announced plans for a consulate in Nuuk."
      why_it_matters:
        - "Open public disagreement between the United States and several NATO allies over the territory of a NATO member exposed strains in the alliance."
        - "Canada's diplomatic move and the European statement signal growing allied attention to Arctic security independent of Washington."
      uncertainty_notes:
        - "The deep-research report also cited the NATO Unity Protection Act in the U.S. Senate via an LSE blog post dated January 23, 2026; that later development is not treated as part of this January 6 event."
