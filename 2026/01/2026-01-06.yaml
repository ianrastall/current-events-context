strategic_conclusion: >
  January 6 showed the U.S. intervention in Venezuela spreading into alliance politics
  and international law. Venezuela's confirmation of military deaths, Chinese criticism
  at the Security Council, and European and Canadian responses to renewed U.S. interest
  in Greenland all reflected concern about the use of force and territorial pressure
  by Washington. China's ban on dual-use exports to Japanese military end users added a
  separate economic-coercion front in East Asia, with extraterritorial liability for
  third-country companies.

  Elsewhere, fragile arrangements were tested rather than broken: the Thailand-Cambodia
  truce held after an incident Cambodia called an operational error, and SDF-government
  fighting in Aleppo coincided with continuing integration talks and renewed
  Israel-Syria negotiations. Violence against civilians in Nigeria and disputed police
  killings in Mozambique, deadly road crashes in Ethiopia and Kenya, and the Mayon
  evacuation defined the humanitarian picture. In the United States, the Capitol-attack
  anniversary and a narrower House majority framed the domestic political calendar
  for 2026.

