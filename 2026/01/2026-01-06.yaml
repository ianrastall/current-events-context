    65 on January 6, 2026, following a sudden medical emergency at his home.68 LaMalfa
    died during an emergency surgical procedure at a local hospital in Chico, California.69
    His unexpected death immediately alters the partisan calculus in Washington, trimming
    the Republican Party's already razor-thin majority in the House of Representatives
    to 218-213.69 Under California law, Governor Gavin Newsom is required to call
