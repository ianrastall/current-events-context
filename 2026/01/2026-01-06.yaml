    as Syria's state news agency confirmed the resumption of U.S.-mediated security
    negotiations between Israel and the Syrian transitional government.3 The highly
    sensitive diplomatic talks are centered on Damascus's demands for the withdrawal
    of Israeli military forces from territories seized during the recent collapse
    of the Bashar al-Assad regime.3 However, this diplomatic progress is fundamentally
    threatened by intelligence reports from the Israel Defense Forces (IDF) warning
    that Iranian operatives and allied hostile elements are actively plotting to assassinate
    the newly appointed Syrian President, Ahmed al-Sharaa.3 Attempting to manage the
    multi-front escalation, Israeli Prime Minister Benjamin Netanyahu utilized Russian
    President Vladimir Putin to pass a message to Tehran, stating Israel does not
    seek a direct war.3
