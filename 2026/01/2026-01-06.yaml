  headline: Five Farmers Killed in Suspected Herder Attack in Benue State, Nigeria
  summary: The lethal intersection of climate-induced resource scarcity and ethnic
    polarization manifested violently on January 6, 2026, when armed Fulani herders
    attacked the Udeku Maav-Ya village in the Kwande Local Government Area of Benue
    State, Nigeria.32 The attackers targeted agricultural workers, shooting and killing
    five Christian farmers as they tended to their fields.32 Local government officials
    confirmed the assault, noting it as part of a persistent and escalating pattern
    of violence by armed herdsmen against sedentary farming communities across Nigeria's
    Middle Belt.32 The attack occurred concurrently with other deadly assaults in
    the state, demonstrating the total collapse of rural security frameworks despite
    regional bans on open livestock grazing.32
