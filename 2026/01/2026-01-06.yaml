      - "KUHP"
      - "KUHAP"
      - "Civil liberties in Indonesia"
    importance: 6
    headline: "Indonesia's new criminal and procedural codes draw civil-society criticism after taking effect"
    summary: >
      Indonesia's new criminal code (KUHP) and criminal procedure code (KUHAP), which
      replace colonial-era legislation, took effect on January 2, 2026. Officials
      presented the reform as a shift from a retributive to a restorative justice model,
      but civil-society groups warned that it criminalizes sex outside marriage and
      cohabitation, penalizes insulting the president and state institutions, and
      expands police powers. JURIST reported that minimum penalties for corruption were
      reduced from four years to two years.
    key_data:
      - label: "Effective date"
        value: "2026-01-02"
        citation_refs: [12]
      - label: "Minimum corruption sentence"
        value: "Reduced from four years to two years"
        citation_refs: [12]
      - label: "Penalty for sex outside marriage"
        value: "Up to one year in prison"
        citation_refs: [14]
      - label: "Penalty for cohabitation"
        value: "Up to six months in prison"
        citation_refs: [14]
    details:
      what_happened:
        - "The new KUHP and KUHAP took effect, introducing restorative-justice mechanisms such as community service and mediation."
        - "The code criminalizes sex outside marriage, punishable by up to one year in prison, and cohabitation, punishable by six months."
        - "Articles 218 to 220 criminalize acts that 'attack the honor or dignity' of the president or vice president."
        - "The minimum prison sentence for corruption was reduced from four years to two years."
        - "Civil-society groups said the procedure code allows arrests, wiretaps and electronic data seizures without court orders in urgent situations."
      why_it_matters:
        - "The reform replaces a colonial-era legal framework in the world's fourth most populous country."
        - "Rights groups argue that broadly worded offenses could be used against journalists, activists and minority groups."
      uncertainty_notes:
        - "The codes took effect on January 2; this entry reflects the deep-research report's January 6 coverage rather than a new development on January 6."
        - "The Hivos and PBS items were dated only 'January 2026' in the deep-research report; their publication dates here are approximated as 2026-01-02, the effective date."
        - "The reduction of the minimum corruption fine (from 200 million to 10 million rupiah) appears in the deep-research report but is not quoted from a cited source and is omitted from key_data."
