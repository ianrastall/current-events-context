  importance: 5
  headline: Fifth Anniversary of the January 6 Capitol Attack Met with Deep Political
    Division
  summary: The fifth anniversary of the January 6, 2021, attack on the U.S. Capitol
    occurred on January 6, 2026, against a backdrop of intense national polarization
    and heavily contested historical framing.22 The commemoration was fundamentally
    altered by the sweeping blanket pardons issued by President Donald Trump upon
    his return to office in 2025, which granted clemency to nearly 1,600 individuals
    convicted or charged in relation to the riot.24 While far-right activists and
    pardoned rioters marched down Constitution Avenue to celebrate the anniversary
    and their legal exoneration, Democratic lawmakers held solemn hearings condemning
    the violence.25 Democrats warned that the executive pardons severely undermine
    the rule of law and serve to normalize political extremism and violence as legitimate
    tools of partisan expression.25
