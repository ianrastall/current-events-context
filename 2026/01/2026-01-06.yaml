        - "House Judiciary Committee Democrats released a report titled 'January 6: Five Years Later'."
        - "The official plaque honoring police officers who defended the Capitol remained unhung."
      why_it_matters:
        - "The competing official accounts reflect continued partisan division over the attack on the transfer of power."
