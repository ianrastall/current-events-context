    importance: 8
    headline: "China bans dual-use exports to Japanese military end users over Takaichi's Taiwan remarks"
    summary: >
      China's Ministry of Commerce prohibited the export of all dual-use items to Japanese
      military users, military uses and any other end users that could enhance Japan's
      military capabilities. Beijing tied the measure to remarks by Japanese Prime
      Minister Sanae Takaichi about a possible Taiwan contingency. The rules also state
      that organizations and individuals in any country that transfer Chinese-origin
      dual-use items to Japan in violation of the ban will be held legally responsible,
      and Japan lodged a protest demanding the measure be withdrawn.
    key_data:
      - label: "Scope of the ban"
        value: "All dual-use items for Japanese military users, military uses, and end users that could enhance Japan's military capabilities"
        citation_refs: [7, 9]
      - label: "Third-country liability"
        value: "Entities in any country transferring PRC-origin dual-use items to Japan in violation are liable"
        citation_refs: [8]
    details:
      what_happened:
        - "MOFCOM announced a prohibition on exports of all dual-use items to Japanese military users, military uses, and other end users that could strengthen Japan's military capabilities."
        - "Chinese authorities linked the measure to Prime Minister Sanae Takaichi's remarks about a Taiwan contingency."
        - "The measure includes a provision holding organizations and individuals in any country or region liable for transferring PRC-origin dual-use items to Japan in violation of the ban."
        - "Japan lodged a diplomatic protest and called for the measure to be withdrawn."
      why_it_matters:
        - "The ban extends the 2025–2026 China–Japan diplomatic crisis into export controls, affecting supply chains for technology and defense-related goods."
        - "The extraterritorial liability clause exposes third-country companies to Chinese legal risk if they re-export affected items to Japan."
      uncertainty_notes:
        - "The MOFCOM spokesperson remarks were dated January 8 in the deep-research report and the Greenberg Traurig analysis was published in February 2026; both are used for the content of the January 6 measure rather than as same-day reporting."
