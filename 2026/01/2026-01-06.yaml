  summary: A highly fragile 10-day ceasefire between Thailand and Cambodia was severely
    jeopardized on January 6, 2026, when cross-border mortar fire struck Thailand's
    Ubon Ratchathani province, wounding a Thai soldier.61 The Royal Thai Army immediately
    accused Cambodian forces of violating the December truce, issuing a stark warning
    of retaliatory military action in self-defense if further incidents occurred.62
    The Cambodian military subsequently contacted Thai units, claiming the mortar
    fire was entirely unintentional and caused by an "operational error," seeking
    to de-escalate the situation.62 The rapid exchange highlights the extreme volatility
    of the decades-old territorial dispute, which had displaced nearly one million
