  headline: China Imposes Export Controls on Dual-Use Technology to Japan
  summary: In a severe escalation of economic statecraft and regional geopolitical
    tension, China's Ministry of Commerce (MOFCOM) enacted Announcement No. 1 on January
    6, 2026, prohibiting the export of all dual-use items destined for Japan.4 The
    sweeping ban explicitly targets Japanese military end-users and any entities whose
    applications could enhance Japan's military capabilities.4 Beijing publicly justified
    the draconian measure as a direct retaliation against Japanese Prime Minister
    Sanae Takaichi, whose recent remarks hinting at potential military intervention
    in a Taiwan contingency were condemned by China as gross interference in its internal
    affairs.15 The mandate introduces a highly disruptive extraterritorial liability
    clause, legally threatening global third-party entities that facilitate the transfer
    of restricted Chinese materials to Japan.15
