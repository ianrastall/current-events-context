  headline: European Leaders Reject U.S. Threats to Annex Greenland
  summary: The structural cohesion of the NATO alliance faced an unprecedented test
    on January 6, 2026, as European leaders issued a joint statement defending Danish
    sovereignty over Greenland against renewed U.S. threats of military annexation.6
    Following the aggressive U.S. military action in Venezuela, President Donald Trump
    reiterated his desire to acquire the Arctic territory, citing national security
    concerns and the presence of adversarial assets, while dismissing Denmark's defensive
    capabilities.42 Greenlandic and Danish leadership categorically rejected the rhetoric,
    characterizing it as unacceptable coercion between allies.6 In a direct counter-maneuver
    to signal allied solidarity and territorial defense, Canadian Prime Minister Mark
    Carney affirmed NATO's mutual defense obligations toward Greenland and announced
    the imminent establishment of a Canadian consulate in Nuuk.6
