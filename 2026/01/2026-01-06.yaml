    Queensland state governments jointly announced a $38 million large-scale disaster
    recovery package on January 6, 2026, targeted at devastated communities in north-west
    Queensland.71 The financial commitment, disbursed through the Commonwealth-state
    Disaster Recovery Funding Arrangements (DRFA), prioritizes agricultural resilience
    and infrastructure repair.71 The package includes $21.5 million specifically earmarked
    for primary producer Disaster Recovery Grants to assist farmers whose livestock
    and crops were destroyed, alongside $11.5 million for critical structural repairs
    to the Cloncurry Airport.71 Prime Minister Anthony Albanese emphasized that the
