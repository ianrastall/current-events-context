    importance: 7
    headline: "NGO says Mozambican police killed at least 38 artisanal miners; police report seven dead"
    summary: >
      Local civil-society organizations in Mozambique, led by the NGO Kóxukhoro, said
      police killed at least 38 people and injured at least 13 during clashes in the
      Marraca mining area of Mogovolas district, Nampula Province, on December 28-29,
      2025. The Police of the Republic of Mozambique gave a much lower account of seven
      dead, including a police officer, and said its camp had been attacked by the
      Naparamas militia and opposition supporters. Human Rights Watch later called for
      an impartial investigation.
