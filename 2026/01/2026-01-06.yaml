      - label: "Arrests reported by police"
        value: "5"
        citation_refs: [15]
    details:
      what_happened:
        - "Kóxukhoro said police fired on artisanal miners in the Marraca mining area, killing at least 38 people and injuring at least 13."
        - "The NGO reported that 27 motorcycles were burned during the clashes."
        - "Mozambican police said their camp was attacked by the Naparamas militia and armed opposition supporters, and reported seven deaths and five arrests."
        - "Relatives reported family members disappearing after seeking medical treatment following the clashes."
      why_it_matters:
        - "The gap between the NGO and police accounts raises questions about the use of lethal force by Mozambican security forces."
        - "The violence occurred in a country already facing an Islamic State-linked insurgency in its northern provinces."
      uncertainty_notes:
        - "Civil-society groups reported at least 38 deaths; police reported seven. The casualty_report records the police-confirmed figure of 7 as the minimum and the NGO figure is noted here."
        - "The clashes took place on December 28-29, 2025; the NGO's claims were reported on January 5, 2026, and Human Rights Watch's statement was published on January 19, 2026."
