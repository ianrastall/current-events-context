strategic_conclusion: >
  January 7 showed the United States pursuing its aims through direct action rather
  than institutions: tanker seizures and an oil-transfer arrangement with Venezuela's
  interim authorities on one side, and withdrawal from 66 international bodies,
  including the core UN climate frameworks, on the other. The Somalia aid suspension
  and the Minneapolis shooting during a large immigration enforcement operation
  extended that pattern of assertive executive action abroad and at home.

  Allies and rivals were also redrawing arrangements. The UK, France and Ukraine
  formalized planning for a post-ceasefire multinational force, Saudi-led strikes on
  the STC and al-Zoubaidi's removal opened a rift inside Yemen's anti-Houthi camp, and
  China extended its sanctions against Taiwanese officials. Anti-corruption actions in
  Malaysia and Nigeria, Cambodia's extradition of Chen Zhi, and Germany's recognition
  of Niue rounded out a day in which most developments were institutional rather than
  battlefield events.

