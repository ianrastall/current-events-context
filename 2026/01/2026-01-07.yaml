analytical_overview: >
  January 7, 2026 extended the U.S. campaign around Venezuela from the capture of
  Nicolás Maduro to control of the country's oil. U.S. forces boarded and seized the
  Russian-flagged tanker Marinera in the North Atlantic and the tanker M Sophia in the
  Caribbean, while the Trump administration said Venezuela's interim authorities would
  transfer 30 to 50 million barrels of oil to the United States. The same day, the
  White House ordered withdrawal from 66 international organizations, including the
  Intergovernmental Panel on Climate Change and the UN Framework Convention on Climate
  Change, and the State Department suspended assistance to Somalia's federal
  government over alleged diversion of food aid.

  In Europe, the United Kingdom, France and Ukraine signed a declaration of intent on
  a multinational force for Ukraine after a ceasefire. In Yemen, the Saudi-led
  coalition struck Southern Transitional Council positions and the STC's leader was
  removed from the Presidential Leadership Council. In the United States, an ICE agent
  fatally shot Renée Good in Minneapolis, prompting protests and a National Guard
  warning order. Other developments included China's entry ban on two Taiwanese
  ministers, Germany's recognition of Niue, anti-corruption actions in Malaysia and
  Nigeria, Cambodia's extradition of Prince Group founder Chen Zhi to China, and a
  fatal bus crash in Chakwal, Pakistan.

