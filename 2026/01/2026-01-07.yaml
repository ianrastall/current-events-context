    importance: 7
    headline: "Saudi-led coalition strikes STC positions as al-Zoubaidi is removed from Yemen's leadership council"
    summary: >
      The Saudi-led coalition launched airstrikes on Southern Transitional Council
      positions in Yemen's Dhale Governorate, and strikes were also reported on bases in
      Seiyun, Hadhramaut. STC leader Aidarus al-Zoubaidi was dismissed from the
      Presidential Leadership Council after failing to attend peace negotiations; Horn
      Review reported he had failed to board a scheduled flight to Riyadh and was
      referred for prosecution. Hospital staff recorded at least four civilian deaths,
      while the STC said seven people were killed.
    key_data:
