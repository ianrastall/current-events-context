  - id: "evt-2026-01-07-004"
    category: "International relations"
    subcategory: "Security agreements"
    topics:
      - "Russian invasion of Ukraine"
      - "Coalition of the willing"
      - "Multinational Force Ukraine"
    importance: 8
    headline: "UK, France and Ukraine sign declaration of intent on a multinational force for Ukraine"
    summary: >
      The United Kingdom, France and Ukraine signed a declaration of intent relating to
      the deployment of multinational forces in support of the defence, reconstruction
      and strategic sustainability of Ukraine. A House of Commons Library briefing said
      the forces would be able to use the necessary means, including force, and the
      Council on Foreign Relations reported that the U.S. contribution would be a
      ceasefire-monitoring role using drones, sensors and satellites rather than U.S.
      troops.
    key_data:
      - label: "Signatories"
        value: "United Kingdom, France, Ukraine"
        citation_refs: [9]
      - label: "U.S. role reported"
        value: "Ceasefire monitoring using drones, sensors and satellites, without U.S. troops"
        citation_refs: [11]
    details:
      what_happened:
        - "Keir Starmer, Emmanuel Macron and Volodymyr Zelenskyy signed the declaration in Paris."
        - "The declaration covers the deployment of multinational forces in support of Ukraine's defence, reconstruction and strategic sustainability after a ceasefire."
        - "The forces would be permitted to 'use the necessary means, including the use of force' to carry out their mission."
        - "Plans include military hubs in Ukraine and facilities for equipment regeneration and training."
        - "U.S. envoys Steve Witkoff and Jared Kushner took part, with the U.S. role limited to monitoring and verification."
      why_it_matters:
        - "It is the first formal commitment by the UK and France to prepare deployments of their forces in Ukraine after a ceasefire."
        - "The arrangement sits outside NATO command and relies on the United States for technical monitoring rather than troops."
      uncertainty_notes:
        - "The GOV.UK publication is dated January 7; the cited sources in the deep-research report do not state whether the signing itself took place on January 6 or January 7."
        - "The deep-research report stated the coalition had 35 members; that figure is not quoted from a cited source and is omitted."
