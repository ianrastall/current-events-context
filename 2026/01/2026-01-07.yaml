    importance: 8
    headline: "Venezuela's interim authorities agree to transfer 30 to 50 million barrels of oil to the U.S."
    summary: >
      Anadolu Agency reported that Venezuela's interim authorities, led by Delcy
      Rodríguez after Nicolás Maduro's capture, agreed to supply 30 to 50 million
      barrels of oil to the United States to be sold at market price, with President
      Donald Trump saying the proceeds would be controlled by the U.S. president to
      benefit the people of both countries. Chevron was reported to have chartered at
      least 11 tankers to load crude from the Venezuelan ports of Jose and Bajo Grande.
    key_data:
      - label: "Oil to be transferred"
        value: "30 to 50 million barrels"
        citation_refs: [4]
      - label: "Tankers reported chartered by Chevron"
        value: "At least 11"
        citation_refs: [4]
      - label: "U.S. service members reported injured in the January 3 operation"
        value: "7"
        citation_refs: [4]
    details:
      what_happened:
        - "Venezuela's interim authorities agreed to supply 30 to 50 million barrels of oil to the United States, to be sold at market price."
        - "Trump said the funds would be controlled by the U.S. president to benefit the people of Venezuela and the United States."
        - "Chevron was reported to have chartered at least 11 tankers to load crude at Jose and Bajo Grande."
        - "Reports confirmed that seven U.S. service members were injured in the operation that captured Maduro."
      why_it_matters:
        - "The agreement ties the new Venezuelan leadership's relations with Washington directly to oil exports."
        - "U.S. control over the sale of Venezuelan crude gives Washington direct influence over a significant oil supply."
      uncertainty_notes:
        - "The deep-research report headlined this event as Rodríguez being sworn in; she was sworn in on January 5 (see evt-2026-01-05-001), so the swearing-in is not treated as a January 7 development."
        - "The Anadolu source is a January 7 morning briefing; whether the agreement was announced on January 6 or January 7 is not stated in the cited material."
