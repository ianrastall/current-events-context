    importance: 8
    headline: "U.S. orders withdrawal from 66 international organizations, including UN climate bodies"
    summary: >
      President Donald Trump signed a memorandum withdrawing the United States from 66
      international organizations, which Al Jazeera counted as 31 United Nations
      entities and 35 non-UN bodies. The list includes the Intergovernmental Panel on
      Climate Change, the UN Framework Convention on Climate Change, the UN Population
      Fund, UN Trade and Development and four regional commissions of the Economic and
      Social Council. Secretary of State Marco Rubio said the organizations had
      "morphed into a sprawling architecture of global governance, often dominated by
      progressive ideology."
    key_data:
      - label: "Organizations affected"
        value: "66 (31 UN entities, 35 non-UN organizations)"
        citation_refs: [8]
      - label: "Selected UN bodies"
        value: "IPCC, UNFCCC, UNFPA, UNCTAD, four ECOSOC regional commissions"
        citation_refs: [31]
    details:
      what_happened:
        - "Trump signed a memorandum directing withdrawal from 66 international organizations, conventions and treaties."
        - "The memorandum defines withdrawal as ceasing participation in or funding to the entities to the extent permitted by law."
        - "The State Department published the list and a statement by Marco Rubio describing the bodies as wasteful or harmful."
        - "Affected UN bodies include the IPCC, the UNFCCC, the UN Population Fund, UN Trade and Development and four ECOSOC regional commissions."
      why_it_matters:
        - "Withdrawal from the UNFCCC and IPCC removes the United States from the main multilateral frameworks for climate science and negotiation."
        - "The loss of U.S. funding and participation affects the budgets and work of many international bodies."
      uncertainty_notes: []
