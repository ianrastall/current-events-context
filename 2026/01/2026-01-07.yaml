    importance: 8
    headline: "U.S. seizes Russian-flagged tanker Marinera and tanker M Sophia over Venezuela blockade"
    summary: >
      The United States boarded and seized the sanctioned Russian-flagged tanker
      Marinera, formerly Bella 1, in the North Atlantic Ocean south of Iceland after it
      breached the U.S. naval blockade around Venezuela. In a separate pre-dawn
      operation, U.S. forces seized the tanker M Sophia in the Caribbean Sea. Vice
      President JD Vance called the Marinera a fake Russian oil tanker, and U.S.
      officials said Venezuelan oil would have to move through channels approved by the
      United States.
    key_data:
      - label: "Vessels seized"
        value: "Marinera (formerly Bella 1) and M Sophia"
        citation_refs: [1, 31]
      - label: "Marinera location"
        value: "North Atlantic Ocean, south of Iceland"
        citation_refs: [1, 2]
      - label: "M Sophia location"
        value: "Caribbean Sea"
        citation_refs: [3, 31]
    details:
      what_happened:
        - "U.S. personnel boarded the Russian-flagged Marinera in the North Atlantic after it had earlier refused to be boarded and switched to a Russian flag."
        - "U.S. forces seized the M Sophia, a tanker carrying Venezuelan oil, in the Caribbean in a pre-dawn operation."
        - "U.S. Southern Command described the M Sophia operation as apprehending a stateless, sanctioned dark fleet tanker without incident."
        - "Vice President JD Vance described the Marinera as a 'fake Russian oil tanker'."
        - "U.S. officials said oil moving in and out of Venezuela would have to pass through U.S.-approved channels."
      why_it_matters:
        - "Seizing a Russian-flagged vessel raised the risk of a diplomatic confrontation with Moscow."
        - "The seizures moved U.S. pressure on Venezuelan oil from sanctions toward physical interdiction at sea."
      uncertainty_notes:
        - "The portal describes M Sophia as Panamanian-flagged, while U.S. Southern Command described the tanker it seized as stateless."
        - "The deep-research report's mention of a Russian submarine nearby is not quoted from a cited source and is omitted."
