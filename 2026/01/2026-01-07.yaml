    importance: 6
    headline: "Wyoming Supreme Court strikes down the state's abortion bans"
    summary: >
      The Wyoming Supreme Court ruled 4-1 in State v. Johnson that the state's 2023
      abortion bans, including its ban on medication abortion, are unconstitutional. The
      court relied on Article 1, Section 38 of the Wyoming Constitution, adopted in 2012
      to limit the reach of the Affordable Care Act, which provides that each competent
      adult shall have the right to make his or her own health care decisions. The
      ruling was issued on January 6 and was widely reported on January 7.
    key_data:
      - label: "Vote"
        value: "4-1"
        citation_refs: [18]
      - label: "Case"
        value: "State v. Johnson, No. S-24-0326, 2026 WY 1"
        citation_refs: [18]
      - label: "Constitutional provision"
        value: "Article 1, Section 38 (health care freedom)"
        citation_refs: [19]
    details:
      what_happened:
        - "The Wyoming Supreme Court upheld a lower-court ruling that the state's abortion bans were unconstitutional."
        - "Justices Boomgaarden, Fox, Jarosh and Fenn voted to strike down the 2023 laws."
        - "The court applied strict scrutiny and found the state had not shown the bans were narrowly tailored."
        - "The court noted that voters could amend the constitution if they wished to restrict abortion explicitly."
      why_it_matters:
        - "The ruling restores legal abortion access in Wyoming."
        - "It relies on a health-care freedom amendment originally passed to oppose the Affordable Care Act, a theory that may be tested in other states with similar provisions."
      uncertainty_notes:
        - "The ruling was issued on January 6, 2026; it is recorded in this file because the deep-research report treated it as January 7 news."
        - "The American Bar Association article was dated only 'January 2026' in the deep-research report; its publication date is approximated as 2026-01-07."
