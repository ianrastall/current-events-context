    details:
      what_happened:
        - "A technical failure disrupted Greek air traffic control communication systems around 09:00 local time."
        - "Authorities imposed a nationwide ground stop and closed Greek airspace."
        - "Inbound flights were diverted to nearby countries, including Italy, Albania, Cyprus, Hungary, and Turkey."
        - "Limited operations resumed later using backup frequencies."
        - "Greek authorities launched investigations and initially ruled out a coordinated cyberattack."
      why_it_matters:
        - "A national aviation communications failure reveals systemic vulnerability in critical transport infrastructure."
        - "The shutdown disrupted a peak holiday travel period and created cross-border diversion and cancellation effects."
        - "The inquiry may affect future aviation resilience and backup-system investment."
      uncertainty_notes:
