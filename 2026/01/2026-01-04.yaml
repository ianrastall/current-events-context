    headline: "North Korea conducts first ballistic missile test of 2026"
    summary: >
      North Korea launched at least two short-range ballistic missiles from the
      Pyongyang region toward the Sea of Japan. Japanese and South Korean tracking
      data cited in the deep-research report said the missiles flew roughly 900 and
      950 kilometers at about 50 kilometers of altitude, followed irregular trajectories,
      and landed outside Japan's exclusive economic zone. The test took place ahead of
      regional diplomatic activity and was followed by emergency consultations in Seoul
      and Tokyo.
