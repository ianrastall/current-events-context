    importance: 10
    headline: "U.S. special forces capture Nicolás Maduro in Venezuela raid"
    summary: >
      Reporting on January 4 described the aftermath of a U.S. operation that captured
      Venezuelan President Nicolás Maduro and first lady Cilia Flores and transferred
      Maduro toward federal custody in New York. Kultura Press and Anadolu summarized
      U.S. and international coverage of President Donald Trump's statement that the
      United States would temporarily run Venezuela during a transition, while ABC
      reported on Maduro's transfer to New York and oil-pressure measures. Singapore's
      foreign ministry publicly expressed grave concern over the U.S. intervention and
      urged restraint.
    key_data:
      - label: "Captured officials"
        value: "Nicolás Maduro and Cilia Flores"
        citation_refs: [1, 3]
      - label: "Reported U.S. transition position"
        value: "Trump said the United States would temporarily run Venezuela"
        citation_refs: [1, 2]
      - label: "Diplomatic reaction"
        value: "Singapore said it was gravely concerned and urged restraint"
        citation_refs: [4]
    details:
      what_happened:
        - "U.S. elite forces were reported to have detained Nicolás Maduro and Cilia Flores during an overnight raid in Caracas."
        - "Reporting described Maduro being transported by U.S. military assets and then toward federal detention in Brooklyn, New York."
        - "Donald Trump said the United States would temporarily run Venezuela during a transition and linked the intervention to Venezuela's oil sector."
        - "Acting Venezuelan leader Delcy Rodríguez declared a state of emergency and condemned the raid."
        - "Singapore's foreign ministry expressed grave concern about the intervention and urged restraint by all parties."
      why_it_matters:
        - "The detention of a sitting head of state by foreign forces is a major challenge to sovereignty norms and regional diplomacy."
        - "Explicit discussion of Venezuelan oil reserves raised the strategic and economic stakes of the intervention."
        - "The event intensified the transition and legitimacy questions opened by the January 3 Venezuela strikes and capture reports."
      uncertainty_notes:
