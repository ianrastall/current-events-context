        - "The missiles reportedly flew at a depressed altitude of about 50 kilometers and landed outside Japan's EEZ."
        - "South Korea convened emergency security consultations and Japan issued maritime and aviation safety directives."
      why_it_matters:
        - "Low-altitude, maneuverable missile trajectories complicate regional missile-defense planning."
