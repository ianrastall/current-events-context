    headline: "Technical failure forces nationwide Greek airspace closure"
    summary: >
      Greece imposed a roughly seven-hour nationwide ground stop and airspace closure
      after a technical failure in air traffic control communications affected the
      Athens and Macedonia Area Control Centers. Reporting cited radio-system collapse,
      diversions to neighboring countries, widespread delays and cancellations, and a
      government inquiry that initially ruled out a coordinated cyberattack.
