    importance: 7
    headline: "Deadly flash floods and snowfall across Afghanistan"
    summary: >
      The season's first heavy rains and snowfall triggered catastrophic flash floods in
      several areas of Afghanistan on January 1, killing at least 17 people and injuring
      11 others. The extreme weather ended a prolonged dry spell but proved fatal for
      vulnerable communities, particularly in Herat province, where five members of a
      single family died after their roof collapsed. The flooding damaged or destroyed
      over 640 houses and impacted approximately 2,100 families, exacerbating a
      humanitarian crisis that aid agencies warn will remain one of the world's largest
      in 2026. The disaster underscores Afghanistan's extreme vulnerability to
      climate-related shocks following decades of conflict and deforestation.
    key_data:
      - label: "Confirmed Dead"
        value: "17"
        citation_refs: [8]
      - label: "Number of Injured"
        value: "11"
        citation_refs: [50]
      - label: "Houses Destroyed"
        value: "256 completely, 385 partially"
        citation_refs: [52]
      - label: "Affected Families"
        value: "1,800–2,100"
        citation_refs: [50]
      - label: "Agricultural Impact"
        value: "8,400 jeribs of land damaged; 494 livestock lost"
        citation_refs: [52]
    details:
      what_happened:
        - "Heavy and sustained rainfall throughout the week culminated in flash floods on January 1, primarily affecting low-lying areas and riverbed settlements in Farah, Herat, and Uruzgan provinces."
        - "In the Kabkan district of Herat, a mud-brick home's roof caved in due to the weight of snow and rain, killing two children and three adults from the same household."
        - "The Afghan National Disaster Management Authority dispatched assessment teams to the worst-hit regions, while the Afghan Red Crescent Society provided initial emergency shelter to displaced families."
        - "Severe weather also disrupted daily life and transportation across central and northern regions, making the distribution of food and medicine difficult for aid organizations."
        - "The United Nations launched a $1.7 billion appeal earlier in the week to assist 18 million Afghans, noting that the country remains highly susceptible to extreme weather events."
      why_it_matters:
        - "Afghanistan's \"poor infrastructure and widespread deforestation\" have amplified the lethality of seasonal rain, turning a much-needed end to a drought into a deadly catastrophe."
        - "The loss of nearly 500 livestock and 8,400 jeribs of agricultural land will likely worsen food insecurity in rural areas where families rely on pastoral and farming livelihoods."
        - "The high impact on mud-brick homes — which offer \"scant protection against sudden deluges\" — highlights the urgent need for climate-resilient housing in remote Afghan provinces."
