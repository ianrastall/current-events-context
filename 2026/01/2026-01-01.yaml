  - id: "evt-2026-01-01-002"
    category: "Business and economy"
    subcategory: "Enlargement of the eurozone"
    topics:
      - "Bulgaria and the euro"
      - "eurozone"
      - "European integration"
      - "currency adoption"
    importance: 8
    headline: "Bulgaria integrates into the eurozone as 21st member state"
    summary: >
      On January 1, 2026, Bulgaria officially adopted the euro, replacing the Bulgarian
      lev and becoming the 21st member state of the eurozone. This historic milestone
      follows decades of monetary alignment, specifically a currency board that has
      pegged the lev to the euro since 1997, and the country's successful fulfillment
      of convergence criteria as verified by the European Commission and the European
      Central Bank in June 2025. A one-month dual circulation period commenced on New
      Year's Day, allowing the lev and the euro to coexist for cash payments, although
      change is provided exclusively in euros to facilitate the withdrawal of the former
      currency. European Commission President Ursula von der Leyen hailed the accession
      as a symbol of European strength and unity, while Bulgarian President Rumen Radev
      expressed a mixture of pride in the integration and regret over the lack of a
      popular referendum.
    key_data:
      - label: "Official Accession Date"
        value: "January 1, 2026"
        citation_refs: [9]
      - label: "Fixed Conversion Rate"
        value: "1.95583 BGN = 1 EUR"
        citation_refs: [9]
      - label: "Dual Circulation Period"
        value: "January 1–31, 2026"
        citation_refs: [9]
      - label: "Mandatory Dual Pricing"
        value: "August 8, 2025 – August 8, 2026"
        citation_refs: [9]
      - label: "Sole Legal Tender Date"
        value: "February 1, 2026"
        citation_refs: [11]
    details:
      what_happened:
        - "At midnight on January 1, 2026, the Bulgarian lev ceased to be the sole legal tender, and the European Central Bank (ECB) assumed direct supervision of significant Bulgarian financial institutions."
        - "Commercial establishments across Bulgaria began receiving euro payments while dual pricing in lev and euros remained mandatory to ensure consumer transparency and prevent inflationary price gouging."
        - "President Rumen Radev delivered a televised address shortly before midnight, characterizing the move as the \"final step\" in Bulgaria's EU integration but noting public skepticism regarding potential price increases."
        - "The Bulgarian National Bank began the final phase of the cash changeover, distributing euro coins that notably feature a Christian character, a first for the eurozone."
        - "Despite recent political instability and the resignation of the conservative government earlier in the month, the technical implementation of the euro was carried out without reported operational disruptions."
      why_it_matters:
        - "Adoption of the single currency eliminates currency conversion costs and exchange rate risks, which is expected to significantly boost Bulgaria's attractiveness for Foreign Direct Investment (FDI) and lower borrowing costs for the government and private sector."
        - "Bulgaria's entry into the eurozone reinforces the geopolitical stability of the Balkan region and signals the continued viability of the single currency despite broader European economic headwinds."
        - "The transition marks the end of 146 years of the Bulgarian lev, representing a profound shift in national identity and economic sovereignty."
