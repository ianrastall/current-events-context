  - id: "evt-2026-01-01-003"
    category: "Politics and elections"
    subcategory: "Immigration policy"
    topics:
      - "Presidential Proclamation 10998"
      - "US travel ban"
      - "visa restrictions"
      - "immigration"
    importance: 8
    headline: "Implementation of US Presidential Proclamation 10998 expansion"
    summary: >
      Effective 12:01 a.m. EST on January 1, 2026, the United States government
      implemented Presidential Proclamation 10998, a sweeping expansion of entry
      restrictions aimed at protecting national security. The proclamation, titled
      "Restricting and Limiting the Entry of Foreign Nationals to Protect the Security
      of the United States," fully or partially suspends the issuance of immigrant and
      nonimmigrant visas for nationals of 39 countries and holders of Palestinian
      Authority travel documents. This order continues and augments the restrictions
      previously imposed by Presidential Proclamation 10949, while simultaneously
      removing several critical categorical exceptions, such as those for immediate
      family members. The implementation of this policy marks a definitive shift toward
      more rigorous, security-focused screening and vetting procedures under the Trump
      administration, likely disrupting global mobility and bilateral relations with
      affected nations.
    key_data:
      - label: "Full Suspension (All Visas)"
        value: "19 countries (e.g., Afghanistan, Iran, Somalia, Syria, Yemen) and Palestinian Authority"
        citation_refs: [15]
      - label: "Partial Suspension (Visitor/Student)"
        value: "19 countries (e.g., Cuba, Nigeria, Venezuela, Senegal, Togo)"
        citation_refs: [15]
      - label: "Immigrant Visa Suspension Only"
        value: "Turkmenistan"
        citation_refs: [15]
      - label: "Rescinded Exceptions"
        value: "Immediate family (IR-1/CR-1, IR-2/CR-2, IR-5) and Afghan SIVs"
        citation_refs: [15]
    details:
      what_happened:
        - "At 12:01 a.m. EST, U.S. embassies and consulates worldwide officially suspended routine visa operations for the specific categories outlined in Proclamation 10998, affecting millions of potential applicants."
        - "The State Department clarified that the proclamation only applies to foreign nationals who were outside the United States and did not hold a valid visa as of the effective date; no existing visas were revoked solely based on this order."
        - "Previous exceptions for children being adopted and immediate family members of U.S. citizens were officially terminated, forcing applicants to seek \"National Interest Exceptions\" on a case-by-case basis."
        - "Expanded screening and vetting procedures were introduced for H-1B and dependent H-4 visa applicants, increasing the administrative burden for high-skilled labor migration."
        - "In response, several countries, including Argentina, took parallel steps in other areas, such as withdrawing from international health organizations, reflecting a trend toward isolationist policies."
      why_it_matters:
        - "The removal of categorical exceptions for immediate family members and Afghan Special Immigrant Visas represents a significant hardening of the U.S. border, prioritizing security vetting over humanitarian or familial considerations."
        - "This policy could lead to significant brain drain in affected nations or, conversely, a reduction in the available high-skilled labor pool in the United States, particularly from countries like Nigeria and Venezuela."
        - "The proclamation reinforces the current U.S. administration's \"America First\" posture, further distancing the United States from multilateral commitments and traditional diplomatic norms."
      uncertainty_notes: []
