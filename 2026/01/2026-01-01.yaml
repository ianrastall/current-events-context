    importance: 9
    headline: "Lethal escalation of economic protests across Iran"
    summary: >
      The New Year began in Iran with a violent escalation of nationwide protests that
      have been dubbed the largest uprising since the 1979 revolution. Fueled by a
      deepening economic crisis, hyperinflation, and the free-fall of the Iranian rial,
      demonstrations on January 1, 2026, resulted in the killing of at least five
      civilians and one member of the security forces. Security forces, including the
      Islamic Revolutionary Guard Corps (IRGC) and the Basij paramilitary unit,
      reportedly used live fire and metal pellets to disperse crowds in several
      provinces, including Lorestan and Chaharmahal and Bakhtiari. Despite the lethal
      crackdown, protests spread to over 200 cities, with many Iranians calling for the
      end of the current clerical establishment regardless of the cost.
    key_data:
      - label: "Mostafa Fallahi"
        value: "Age 15, killed in Azna, Lorestan"
        citation_refs: [24]
      - label: "Taha Safari"
        value: "Age 15, killed in Azna, Lorestan"
        citation_refs: [23]
      - label: "Shayan Asadollahi"
        value: "Age 30, killed in Azna, Lorestan"
        citation_refs: [23]
      - label: "Sajjad Valamanesh Zilayi"
        value: "Age 28, killed in Lordegan, Chaharmahal and Bakhtiari"
        citation_refs: [24]
      - label: "Ahmad Jalil"
        value: "Age 21, killed in Lordegan, Chaharmahal and Bakhtiari"
        citation_refs: [23]
    details:
      what_happened:
        - "In Azna, Lorestan province, security forces opened fire on peaceful protesters near the county governor's office on the evening of January 1, killing at least six people throughout the day."
        - "Protesters in Lordegan engaged in clashes with security forces, resulting in two fatalities and 17 injuries as anger over living costs and unemployment boiled over."
        - "State media confirmed that a member of the Basij volunteer paramilitary force died in Kuhdasht, Lorestan, during clashes with demonstrators, indicating the increasing risk to state actors."
        - "Major markets in Tehran were shuttered on January 1 as merchants joined marches against the economic mismanagement and international sanctions that have crippled the nation's industry."
        - "Supreme Leader Ali Khamenei and senior IRGC officials issued statements declaring that the period of \"tolerance\" was over and pledging to put \"rioters in their place\"."
      why_it_matters:
        - "The use of lethal force against teenage protesters suggests a regime strategy of absolute repression that risks further radicalizing the population and deepening the internal crisis."
        - "The economic drivers of the protests — rial depreciation and basic commodity shortages — remain unaddressed, suggesting that the unrest will persist despite the violent crackdown."
        - "The assassination of key officials and the subsequent escalation of the \"2026 Iran war\" suggests that the domestic uprising is increasingly intertwined with regional military conflicts involving the U.S. and Israel."
      uncertainty_notes: []
