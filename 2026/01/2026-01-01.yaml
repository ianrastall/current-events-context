      - "Saudi-UAE rift"
      - "Southern Transitional Council"
    importance: 7
    headline: "Aden Airport closure amid Saudi-UAE geopolitical rift"
    summary: >
      Aden International Airport, the primary air gateway for Yemen's internationally
      recognized government, suspended operations on January 1, 2026, following a severe
      diplomatic and logistical dispute between Saudi Arabia and the United Arab Emirates
      (UAE). The Southern Transitional Council (STC), backed by the UAE, accused Saudi
      Arabia of imposing an air blockade by requiring all international flights to
      transit through Jeddah Airport for mandatory inspections. This incident marks the
      most significant crisis in relations between Riyadh and Abu Dhabi in a decade, as
      both nations vie for control over strategic territories and ports in southern Yemen.
      The closure effectively isolates Aden and has led to conflicting reports from Yemeni
      authorities regarding the cause and duration of the flight restrictions.
    key_data:
      - label: "Primary Trigger"
        value: "Saudi demand for all flights to transit through Jeddah"
        citation_refs: [40]
      - label: "STC Position"
        value: "Labeled it an \"air blockade\" and suspended operations"
        citation_refs: [40]
      - label: "Regional Context"
        value: "Rift between Saudi Arabia and the UAE over southern Yemen"
        citation_refs: [41]
      - label: "Impacted Routes"
        value: "Flights to Saudi Arabia, Egypt, and Jordan"
        citation_refs: [40]
      - label: "Infrastructure Status"
        value: "Operations fully suspended as of Jan 1"
        citation_refs: [40]
    details:
      what_happened:
        - "The STC-affiliated AIC channel claimed that Saudi Arabia had unilaterally halted all domestic and international flights to and from Aden, prompting the STC to shut down the facility in protest."
        - "A senior source in the internationally recognized Presidential Leadership Council (PLC) denied that a shutdown had been ordered, describing the situation as \"limited regulatory measures\" coordinating with the Saudi-led coalition."
        - "Tensions escalated as STC forces established checkpoints around Aden and the presidential office reported a campaign of arrests within the city, further destabilizing the temporary capital."
        - "The U.S. embassy received reports of the closure and noted that flights were being redirected to Socotra Island or canceled entirely, impacting hundreds of travelers."
        - "The rift follows recent Saudi airstrikes on STC positions in Hadhramaut, which the kingdom justified as necessary for its national security against separatist encroachment."
      why_it_matters:
        - "The closure of Aden Airport cripples the mobility of the internationally recognized government and disrupts the delivery of aid and personnel to non-Houthi areas."
        - "This event signals a fundamental fracturing of the anti-Houthi coalition, as Saudi Arabia and the UAE pursue divergent goals: Riyadh seeks a unified Yemen while Abu Dhabi supports southern secession."
        - "Continued friction in Aden could lead to a full-scale military confrontation between PLC and STC forces, as occurred in early January when government forces briefly retook the airport."
      uncertainty_notes: []
