  - United Kingdom–United States relations
  - 2026 RAF Fairford arrests
  - The United States Air Force withdraws all of its B-1 Lancer strategic bombers
    from RAF Fairford in Gloucestershire, England. The US Department of Defense confirms
    the bombers have returned to bases in the United States. (BBC News)
  - 2026 Nigerian Air Force ATR 42 crash
  - A Nigerian Air Force ATR 42-500 aircraft carrying 32 people crashes in Ondo State,
    Nigeria. (DW) (Reuters)
  - The death toll increases to over 30 people, with dozens still missing, of the
    two ships that collided yesterday on the Congo River near Lukolela, Congo. (AP)
  - International Criminal Court investigation in Afghanistan
  - The International Criminal Court unseals arrest warrants for Taliban education
    minister Habibullah Agha and higher education minister Neda Mohammad Nadeem, accusing
    them of the crime against humanity of gender-based persecution in Afghanistan.
    (AFP via France 24)
  - 2025–2026 Kosovo political deadlock
  - In Kosovo, the acting presidency of Albulena Haxhiu becomes de facto due to her
    having continuously served in the position for more than six months since assuming
    office on 4 April, violating the third paragraph of Article 90 in the constitution.
    The Kuvendi, which is set to meet for amendments to the Kosovo Specialist Chambers,
    has two days left until the presidential election deadline by the Constitutional
    Court expires. (Kosovo Online) (RKS)
  - 2026 Quebec general election
  - Voters in Quebec, Canada, elect members to the National Assembly. (CBC) (The Guardian)
  - 2026 Spanish general election, 2026 Spanish housing protests
  - Spanish prime minister Pedro Sánchez calls a snap general election for 29 November
    after Parliament voted down two emergency housing decrees that would have restricted
    evictions, frozen rents, and blocked vulture-fund property buys. (The Guardian)
    (Reuters)
  - American Karl Deisseroth of Stanford University, and Germans Peter Hegemann of
    Humboldt University and Georg Nagel of the University of Würzburg are jointly
    awarded the Nobel Prize in Medicine for "their discoveries concerning light-gated
    ion channels and optogenetics". (Reuters)
