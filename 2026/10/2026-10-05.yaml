  - Yemeni civil war (2014–present)
  - 2026 Yemen offensives, Operation Dawn of Yemen
  - The Presidential Leadership Council launches a large-scale military operation
    against Houthis in Yemen, with the aim to capture all Houthi-controlled territories.
    (TRT) (Al Arabiya) (Al Jazeera)
