wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Israeli military raids 15 cities in the occupied West Bank, arresting several
      Palestinians, forcing over 2,000 from their homes, and destroying a three-storey
      building in Hebron.
    - Unknown gunmen attack a village in Taraba State, Nigeria, killing at least ten
      people. Locals place the death toll at 20, while Amnesty International claims
      at least 40.
    Disasters and accidents:
    - At least one person is killed and 527 others are injured as Typhoon Champi swept
      near Taiwan.
    - Six people are killed and another is injured when a passenger train collides
      with a minibus in Jewish Autonomous Oblast, Russia.
    - Two people are killed and over 2,000 others are displaced by flooding in Chaco
      and Corrientes, Argentina.
    Law and crime:
    - Survivors of sexual abuse by Catholic clergy reach a settlement with the Archdiocese
      of New York in the United States, which will see the archdiocese paying at least
      $250,000 to around 1,300 plaintiffs, totaling over $800 million.
    - Two people succumb to their injuries sustained the day before during a mass
      shooting at a Greek Orthodox Church in Karak Governorate, Jordan, bringing the
      toll to nine killed and 40 injured.
    Politics and elections:
    - The Yellow vests hold a second wave of mass demonstrations across France. About
      410,000 people participate and over 1,000 people are arrested.
    - About 110,000 protesters march in Paris, France.
    - Rioters in Paris attack police with projectiles, but are dispersed with tear
      gas and water cannons. A gendarmerie helicopter is deployed to locate remaining
      rioters.
    - Party leader Marine Le Pen holds the National Rally congress in Orléans, France.
      Protesters, including left-wing politicians, marched in opposition.
    - A new wave of protests is held across Italy. Clashes are reported in Bologna
      and Turin.
    - Anti-government protests break out in Tirana, Albania. Various government buildings
      are attacked.
    - A student protest in Barcelona, Spain, ends in riots, looting and clashes with
      the police.
    - At least 25,000 people gather in Madrid, Spain, in support of the country's
      state pension fund as it could significantly weaken following the general election
      in November.
    - Thousands of Israelis rally in Hostages Square in Tel Aviv to protest against
      the government, prime minister Benjamin Netanyahu's cabinet, and the continuation
      of the Gaza war.
