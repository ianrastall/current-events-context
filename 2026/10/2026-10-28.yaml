wikipedia:
  categories:
    Armed conflicts and attacks:
    - Saudi Arabia launches an airstrike at a market in Al Hazm, Al-Jawf Governorate,
      Yemen, killing 14 civilians and wounding ten more.
    - Eight woman and children are reported to be injured in a airstrike in Kadugli,
      South Kordofan, Sudan.
    Business and economy:
    - The Bank of Canada raises its policy interest rate by 25 basis points to 2.5%,
      its first increase since July 2023, citing persistent inflation driven partly
      by higher oil and gasoline prices linked to the Iran war.
    - Jio Platforms raises US$3.2 billion in India's largest-ever initial public offering
      (IPO), attracting about $77 billion in bids and becoming the country's most-subscribed
      IPO before its stock-market debut in Mumbai.
    Disasters and accidents:
    - At least three people are killed as Cyclone Arnab makes landfall in Andhra Pradesh,
      India.
    - At least 68 people are killed and 179 injured during a collision between two
      high speed trains carrying over 500 passengers between Los Yébenes and Urda,
      in the Province of Toledo, Spain.
    International relations:
    - The United States imposes sanctions on the Rwandan ministry of defence over
      its role in the conflict in eastern Democratic Republic of the Congo, alleging
      that Rwanda is backing the M23 rebels to fight against Congolese forces.
    - The United Nations General Assembly adopts a resolution calling for an end to
      the American embargo against Cuba by 130 votes to 17, with 25 abstentions, the
      measure's lowest support since 1995.
    Law and crime:
    - A youth armed with two knives wounds a police officer outside the Israeli embassy
      in Belgrade, Serbia, before being shot and killed.
    - British far-right activist Tommy Robinson is convicted of harassing two journalists
      and causing them to fear violence.
    Politics and elections:
    - Incumbent prime minister Benjamin Netanyahu and his Likud party-led governing
      coalition loses a plurality of seats in the Knesset, though no alliance wins
      a majority, leaving government formation unclear.
    - Brazilian senator Flávio Bolsonaro, following his escape from Brazil and arrival
      in Florida, United States, after the general election, proclaims himself the
      "rightful" president-elect of Brazil.
    - Brazilian president Luiz Inácio Lula da Silva responds by accusing the U.S.
      government of colluding with Bolsonaro to install him as president.
    Sports:
    - In baseball, the Fukuoka SoftBank Hawks defeat the Yokohama DeNA BayStars in
      four games to win their 13th Japan Series championship.
    - In baseball, the Milwaukee Brewers defeat the Tampa Bay Rays in five games to
      win their first World Series championship in franchise history.
