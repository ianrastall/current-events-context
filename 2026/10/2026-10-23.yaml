wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Israeli government orders the military to prepare for a complete lockdown
      of the West Bank. This comes after two men who allegedly planned an attack were
      killed.
    - A merchant ship is hit by drones of unknown origins in the Romanian Black Sea,
      killing a crew member and leaving three more missing. Nine people are rescued.
    - Ukrainian police detain a 17-year-old girl suspected of helping Russia's Federal
      Security Service send methadone-laced capsules to Ukrainian soldiers, which
      killed two in Zhytomyr Oblast and allegedly targeting four others.
    Disasters and accidents:
    - Typhoon Champi kills a person and injures 163 others in Taiwan as the government
      evacuates 2,639 people from mountainous areas.
    - An 18-storey building under construction collapses in Eastleigh, Nairobi, Kenya,
      leaving seven people missing and at least one injured. Rescue teams establish
      contact with some people trapped beneath the rubble.
    International relations:
    - The Australian Government imposes financial sanctions and travel bans on two
      North Koreans and sanctions two companies accused of supporting fraudulent overseas
      information technology work that funds North Korea's weapons programs.
    Law and crime:
    - Seven people are killed and 34 others are wounded in a mass shooting during
      a funeral procession at a Greek Orthodox Church in Hamoud, Karak Governorate,
      Jordan. All of the gunmen escape from the scene.
    - A person is killed and five other people are injured in a drive-by shooting
      spree at three separate locations in Trappes and La Verrière, France. A suspect
      is arrested.
    - The Eagle's Nest in Germany is lit on fire. A suspect is arrested.
    Politics and elections:
    - The Greek parliament approves a law banning children under 15 from using social
      media from January 1, 2027, requiring age verification and penalties for platforms
      that fail to comply.
    Sports:
    - Argentine football player Lionel Messi is awarded the 2026 Princess of Asturias
      Award for Sports for his career at FC Barcelona in Catalonia, Spain.
