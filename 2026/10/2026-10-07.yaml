Date: '2026-10-07'
Source_URI: Portal:Current events/2026 October 7
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - Bulgaria halts the search for the 12 Syrian sailors missing since yesterday after
    a merchant ship sank after being hit by a drone strike in its waters. The perpetrators
    are still unknown. (Al Jazeera) (Reuters)
  - Yemeni civil war
  - 2026 Yemen offensives
  - Houthi forces claim attacks on Abha International Airport and Riyadh's King Khalid
    International Airport in Saudi Arabia that killed three civilians and injured
    36 others since yesterday. (AFP via France 24)
  - Israeli settler violence
  - Israeli settlers launch an attack in the occupied West Bank targeting Palestinians,
    killing a man and wounding 16 other people. (Al Jazeera)
  - Ethiopian civil conflict
  - 2026 Ethiopian offensive
  - Eritrean forces are reported to have entered Ethiopia's Tigray Region and are
    moving south toward Mekelle. (Addis Standard) (Al Jazeera)
  - Mali War
  - 2026 Mali offensives
  - The Malian Armed Forces and the Russian Africa Corps retake Kidal, which was captured
    by the Azawad Liberation Front five months ago, after days of airstrikes and ground
    operations. (Al Jazeera)
  - Guinea sets nationwide price ceilings for bottled water after a ban on single-use
    plastic sachets causes shortages and higher prices, with retail packs of several
    bottle sizes capped at 25,000 francs (US$2.84). (AFP via France 24)
  - The Reserve Bank of India raises its benchmark repo rate by 25 basis points to
    5.5%, its first increase since February 2023. (AFP via France 24)
  - Climate change in Australia, Mining in Australia
  - Australia's High Court rejects MACH Energy's appeal to expand the Mount Pleasant
    coal mine in New South Wales, finding that planning authorities failed to adequately
    consider greenhouse gas emissions from burning exported coal overseas. (AFP via
    France 24)
  - Climate change in Antarctica
  - The British Antarctic Survey reports that Zavodovski Island in Antarctica has
    lost more than 500,000 chinstrap penguins since 2011, ending its status as the
    world's largest penguin colony as warming waters reduce access to Antarctic krill.
    (AFP via France 24)
  - Elections in Mexico
  - Mexican president Claudia Sheinbaum signs a decree prohibiting Mexicans with dual
    citizenship from running for president or governor. (AA) (El Economista)
  - Libor scandal
  - The Court of Appeal in London, United Kingdom, quashes the convictions of five
    former Barclays traders for manipulating Libor and Euribor, following a 2025 Supreme
    Court ruling that found legal errors had made similar convictions unsafe. (AFP)
  - Spillover of the 2026 French lycée protests
  - For a second consecutive day, riots occur in Liège, Belgium, following earlier
    student protests, prompting authorities to close the Guillemins railway station
    and urge local businesses to shut down. Over 100 people are arrested. (Al Jazeera)
    (RTBF)
  - Nine people are injured in a mass stabbing at a high school in Ostrołęka, Poland.
    The suspect, a 19-year-old student, is arrested after being injured himself. (Reuters)
  - French Henri B. Kagan from the Paris-Saclay University and Japanese Kensō Soai
    from the Tokyo University of Science are jointly awarded the Nobel Prize in Chemistry
    for "the discovery of non-linear effects and autocatalysis in asymmetric organic
    synthesis". (Reuters)
