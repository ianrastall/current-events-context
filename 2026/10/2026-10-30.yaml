wikipedia:
  categories:
    Armed conflicts and attacks:
    - Oman rescues 25 crew members from a burning Panamanian-flagged oil tanker in
      the Strait of Hormuz. The Iranian military confirms it was a result of attempting
      to pass through an unauthorised route.
    - The Saudi Arabia-led coalition announces it intercepted a drone allegedly launched
      by the Houthis towards the Mecca region, which the Houthis deny.
    - Civilian evacuations commence in Oleshky, Ukraine, as a humanitarian convoy
      arrives in the Russian-held and besieged city, as part of a local ceasefire
      that U.S. first lady Melania Trump says she brokered.
    Business and economy:
    - Russian independent newspaper Novaya Gazeta announces plans to cease operations
      on 9 November, citing pressure from Russian authorities.
    Disasters and accidents:
    - At least five people, including four children, are killed, seven people are
      injured, and five others are missing in flash floods caused by heavy rainfall
      across Syria.
    - Six people are killed when their helicopter crashes near Joshimath, Uttarakhand,
      India.
    Law and crime:
    - The Court of Appeal of Victoria, Australia, rejects Erin Patterson's appeal
      against her murder convictions and removes her 33-year parole eligibility, effectively
      imposing life imprisonment without parole for killing three relatives with death
      cap mushrooms in 2023.
    - Cryptocurrency exchange Binance confirms that assets worth US$6.3 billion were
      stolen, making it the largest cryptocurrency theft in history.
    - The Swiss supreme court upholds a 20-year jail sentence for former Liberian
      rebel commander Alieu Kosiah after he was found guilty in 2021 for atrocities
      committed during the First Liberian Civil War, but overturns a conviction for
      crimes against humanity.
    Politics and elections:
    - Polish police enter the Constitutional Tribunal following the suspension of
      its president Bogdan Święczkowski, announced by judge Anna Korwin-Piotrowska.
      The tribunal describes the suspension as a coup d'état, while three protesters
      in support of PiS are detained after breaching the tribunal's fence.
    - Polish justice minister Waldemar Żurek requests stripping the tribunal's president
      and vice president Bartłomiej Sochański of their immunity from prosecution in
      order to charge them. President Karol Nawrocki cuts short his visit to Senegal
      due to the situation and lands back in Poland.
    - A general strike and multiple protests are held across Italy against the rising
      cost of living and prime minister Giorgia Meloni's government, with clashes
      breaking out in multiple cities.
    Sports:
    - In thoroughbred horse racing, race horse Sun Goddess dominates the Juvenile
      Fillies Turf at the Keeneland racetrack in Lexington, Kentucky, United States,
      during the Breeders' Cup. Additionally, Emphatic wins the Juvenile Fillies.
    - In ice hockey, the Court of Arbitration for Sports rules that Russian teams
      must be allowed to take part in all international tournaments, overturning previous
      International Ice Hockey Federation decisions.
