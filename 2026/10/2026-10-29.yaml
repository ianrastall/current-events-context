wikipedia:
  categories:
    Armed conflicts and attacks:
    - Saudi Arabia launches airstrikes against two residential buildings in Taiz,
      Yemen, killing 12 civilians and wounding three more.
    - The Salvadoran government deploys 2,000 troops to Haiti in response to the kidnapping
      of four Salvadoran Gang Suppression Force members that occurred earlier this
      month.
    Business and economy:
    - Canada's federal government invests up to C$1.6 billion (US$1.1 billion) in
      Toronto-based artificial intelligence company Cohere, taking an equity stake
      as part of a C$7 billion (US$5 billion) funding round intended to expand domestic
      computing infrastructure and AI development.
    - KuCoin ends services for customers in Russia and Belarus, citing sanctions.
    - Christine Lagarde, the president of the European Central Bank, resigns, saying
      she could not remain neutral on current events. She will step down from office
      in February 2027, eight months before her term officially ends.
    - American food delivery company DoorDash announces an intent to acquire grocery
      delivery company Instacart for $17 billion in late 2027.
    Disasters and accidents:
    - An oxygen cylinder explodes inside an ambulance parked at a medical facility
      in Tharparkar, Sindh Province, Pakistan, killing ten people.
    - Three people are killed and five more injured during the collapse of a hoodoo
      at Göreme's Open Air Museum in the Nevşehir District, Turkey. It is suspected
      to be caused by heavy rainfall over the preceding days.
    - Four people are killed and eleven more are injured after an Italian Air Force
      Boeing CH-47 Chinook crashes near Brčko, Bosnia and Herzegovina.
    Politics and elections:
    - Andreas Norlén, speaker of the Swedish parliament, announces a second vote to
      elect the next prime minister. He proposes a coalition led by the Center Party's
      leader, Elisabeth Thand Ringqvist, alongside the Social Democrats, Greens, Christian
      Democrats, and the Moderates.
    - Haiti's Provisional Electoral Council sets the first round of presidential and
      legislative elections for August 29, 2027, with a second round scheduled for
      December 5, as the country prepares for its first national elections since 2017.
