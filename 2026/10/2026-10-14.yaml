Date: '2026-10-14'
Source_URI: Portal:Current events/2026 October 14
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - Two cargo ships, the Singapore-flagged container ship GFS Pride and the Antigua
    and Barbuda-flagged dry bulk carrier Cape Dao, sink after both are attacked by
    projectiles near the Strait of Hormuz while trying to navigate through what Iran's
    Islamic Revolutionary Guard Corps called an "illegal and dangerous route." At
    least one crew member is killed in the attacks. (Reuters) (The Guardian)
  - Russo-Ukrainian war
  - Russian strikes against Ukrainian infrastructure
  - A Russian ballistic missile attack strikes a power station in the Dniprovskyi
    District, Kyiv, Ukraine, leaving more than 1,000 residential buildings without
    heating. (BBC)
  - Yemeni civil war
  - Houthi–Saudi conflict
  - The Houthis claim to have shot down a Royal Saudi Air Force Eurofighter Typhoon
    aircraft over Saada Governorate, Yemen. Saudi authorities did not comment on the
    claim. (AA)
  - A 14-year-old is killed and at least three others are injured after torrential
    rainfall triggers widespread flooding across Istanbul, Turkey. (Bianet)
  - 2026 Southeast Asian haze
  - Singapore records its highest air pollution level of 2026 as one-hour PM concentrations
    reach about 288 micrograms per cubic metre amid haze from Indonesian wildfires.
    (AFP)
  - Timor-Leste suspends in-person classes nationwide from October 15 to 17 due to
    worsening air quality from wildfire smoke and pollutant particles across Southeast
    Asia. (AFP)
  - Russo-Ukrainian war
  - Nord Stream pipelines sabotage
  - The Ukrainian citizen accused of sabotaging the Nord Stream pipelines in 2022
    faces trial at the Higher Regional Court in Hamburg, Germany, raising again the
    questions about Ukraine's possible role in the attack. (DW)
  - 2026 Delhi Jantar Mantar protests
  - A court in New Delhi, India, remands Cockroach Janta Party spokespeople Saurav
    Das and Ashutosh Ranka in custody for five days after police detained them for
    entering the restricted Jantar Mantar protest site. (AFP via RFI)
  - Censorship in Turkey
  - Turkish opposition-leaning and independent news channel Halk TV goes offline as
    it is raided by police and new administrators are appointed by the government.
    (BBC)
  - Three Indian nationals are killed and five others are injured in a suspected arson
    attack in Bochum, Germany. A 41-year-old resident is arrested. (CNN-News18)
  - 2026 Irish public sector strikes
  - Over 300,000 public sector workers in Ireland, including teachers, health workers,
    and and other civil servants, start a general strike, the first in the country
    since 2009, to protest against a deadlock in pay negotiations. (Reuters)
