date: '2026-10-27'
source_page:
  portal: Portal:Current events/2026 October 27
  language: en
  wikipedia_revision_id: 1382354946
wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Ethiopian Orthodox Tewahedo Church reports that at least 60 Christians have
      been killed in attacks in Oromia, Ethiopia, over the last week.
    - The casualty toll from yesterday's drone strike at a market Nyala, South Darfur,
      Sudan, increases to over 100 people killed and 112 more injured.
    - The casualty toll from the massacre by unknown gunmen four days ago in Taraba
      State, Nigeria, increases to 62 people killed and 52 more wounded.
    - A bomb explodes near a bridge in Cúcuta, Colombia, at the border with Venezuela,
      injuring four police officers.
    - The United States launches an airstrike against an alleged drug boat in the
      Pacific Ocean, killing five people.
    Business and economy:
    - China's Shanghai Stock Exchange STAR Market index plummets 40% in less than
      four months.
    Arts and culture:
    - Netherlands Public Broadcasting (NPO) withdraws the Netherlands from the 2027
      Eurovision Song Contest over concerns about Israel's participation, after AVROTROS
      withdrew in August and NPO failed to find another broadcaster.
    Disasters and accidents:
    - Indian authorities order nearly 100,000 people to evacuate parts of Andhra Pradesh
      and Odisha as Cyclone Arnab approaches, with the India Meteorological Department
      forecasting landfall as a very severe cyclonic storm.
    - Four people are killed, two are missing and several homes are destroyed during
      floods in Haiti and the Dominican Republic.
    - A construction site is hit by a tornado in Kepez, Antalya, Turkey, killing four
      workers and injuring another.
    Health and environment:
    - The World Meteorological Organization reports that global concentrations of
      carbon dioxide, methane, and nitrous oxide reached record highs in 2025, with
      carbon dioxide averaging 426.8 parts per million.
    Law and crime:
    - A Salvadoran court issues an order to release former president Antonio Saca
      from prison after the end of his 10-year sentence for corruption.
    - Algerian-Palestinian activist Mahmoud Khalil returns to Columbia University
      in New York City, United States, after immigration authorities detained him
      for more than three months over his role in pro-Palestinian campus protests
      before a federal judge ordered his release.
    - Nigerian police arrest 34 foreigners, including 16 Cameroonians and 18 Nigeriens,
      suspected of engaging in "illicit activities" in Benue State. The commissioner
      opens an investigation into their immigration status.
    - Brazilian senator Flávio Bolsonaro leaves Brazil for the United States, despite
      orders to surrender his passports to the Federal Police, two days after his
      defeat in the presidential election runoffs to incumbent president Luiz Inácio
      Lula da Silva. The government subsequently cancels Bolsonaro's passports, while
      the U.S. grants him and his family visas.
    - The Persian Gulf Strait Authority says that vessels belonging to South Korean
      shipping company Sinokor would face legal action beginning on November 1.
    Politics and elections:
    - The French Senate passes a bill that would make people who knowingly participate
      in violent protest groups jointly liable for up to €10,000 (US$11,118) in damage
      and allow authorities to seize certain welfare payments. The bill heads to the
      National Assembly for a vote.
    - Israelis vote to elect the 120 members of the Knesset.
