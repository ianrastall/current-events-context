date: '2026-10-22'
source_page:
  portal: Portal:Current events/2026 October 22
  language: en
  wikipedia_revision_id: 1381510634
wikipedia:
  categories:
    Armed conflicts and attacks:
    - Iran's Islamic Revolutionary Guard Corps reports that seven oil tankers have
      been hit in the Strait of Hormuz. Donald Trump and a spokesperson for U.S. Central
      Command denies the IRGC’s claim.
    - An al-Qaeda in the Arabian Peninsula attack in Shabwah Governorate kills two
      soldiers.
    Arts and culture:
    - The European Parliament awards its 2026 Sakharov Prize to the International
      Criminal Court and its officials for their work in global justice and upholding
      international law.
    Disasters and accidents:
    - A {{M|w|link=y}} 7.0 earthquake strikes Tibet, with an epicenter in Nagqu, killing
      16 people and wounding 32 more.
    - At least six people are killed and 25 others are injured when a bus collides
      with a tree in Manendragarh-Chirmiri-Bharatpur district, Chhattisgarh, India.
    Health and environment:
    - France reports the first human case of the livestock Shamonda virus in a patient
      who died after being hospitalized with an unrelated condition.
    International relations:
    - Canada and Turkey open negotiations for a free trade agreement during Canadian
      prime minister Mark Carney's visit to Ankara.
    - Emirati diplomat Lana Nusseibeh announces her candidacy to Secretary-General
      of the United Nations.
    Law and crime:
    - A Guatemalan court sentences seven former police officers to prison terms of
      up to 60 years for offenses related to the 2024 torture and killing of a gay
      couple at a police station.
    - Ecuadorian opposition leader and former presidential candidate Luisa González
      is arrested over allegations on money laundering in campaign financing.
    Science and technology:
    - The Finnish Government grants Posiva an operating license for the Onkalo spent
      nuclear fuel repository in Eurajoki, making it the world's first licensed deep
      geological disposal facility for spent nuclear fuel.
    Sports:
    - In women's association football, FIFA announces that the United States will
      host the inaugural FIFA Women's Club World Cup in 2028.
    - The Athletics Integrity Unit bans Ethiopian marathon runner Ruti Aga for six
      years after she tested positive for methylprednisolone and submitted false information
      and a forged prescription during an investigation.
