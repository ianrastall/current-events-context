  - 2026 French lycée protests
  - Mass rioting continues for a third day across France with hundreds reportedly
    injured and over 735 schools shut, while more than 2,000 people are arrested.
    (BBC News)
  - Riot police clash with protesters in Paris, Montpellier, Nantes and Marseille
    as justice minister Gérald Darmanin says protests had "gone from high-school student
    demonstrations to a public order disturbance" and urges an immediate end to violence.
    (BBC News)
  - French government ministers, including right-wing education minister Édouard Geffray,
    accuse the far-left of inciting the youth-led unrest across the country. Intelligence
    agencies briefing the government during a crisis meeting on the riots accuse the
    left-wing La France Insoumise of actively inciting people to join the protests.
    (AFP via NDTV) (Ynet News)
  - 2026 Spanish housing protests
  - Spain's parliament rejects two government housing decrees that would have expanded
    protections against evictions, limited some real-estate practices, encouraged
    rentals through tax incentives, and allowed tenants to renew residential leases
    automatically. (AP)
  - 2026 Swiss Federal Council election
  - Swiss president Guy Parmelin announces his resignation from the Federal Council
    effective December 31. Parliament is expected to elect his successor on 9 December.
    (AFP) (Swissinfo)
