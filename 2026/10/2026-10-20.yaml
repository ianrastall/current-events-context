Date: '2026-10-20'
Source_URI: Portal:Current events/2026 October 20
Intelligence_Payload:
  Uncategorized:
  - Sudanese civil war
  - Abyei border conflict
  - Amiet market massacre
  - The death toll in the market drone attack in Abyei rises to 220. (Sudans Post)
  - Blue Nile campaign
  - The Sudanese Army says that they have repelled an attack by the Rapid Support
    Forces and Sudan People's Liberation Movement–North (SPLM–N) on the Blue Nile
    state. (Sudan Tribune)
  - War crimes in the Sudanese civil war
  - The Rapid Support Forces launches a drone strike on a power plant in Tendelti
    in Sudan's White Nile State, knocking out the main transition line connecting
    North Kordofan. (Sudan Tribune)
  - At least 14 people are killed and 20 others are injured after a bus and a truck
    collide head-on in Natore District, Bangladesh. (Xinhua)
  - Twelve people are killed and 30 others are injured after a bus crashes into a
    truck near Cairo, Egypt. (Xinhua)
  - Libya–Turkey relations
  - Libya (GNA)–Turkey maritime deal
  - Libya's eastern-based House of Representatives approves a 2019 maritime boundary
    agreement with Turkey and repeals two 2020 decisions that rejected the accord.
    (Reuters)
  - South Korea–Ukraine relations
  - South Korea withdraws additional embassy staff from Ukraine following a dispute
    over two captured North Korean soldiers who were transferred to South Korea. (AFP
    via RFI)
  - Saudi Arabia–United Kingdom relations
  - United Kingdom says it will deploy RAF Typhoons to help Saudis defend against
    Houthi attacks. (Reuters)(BBC)
  - 2022 San Antonio migrant deaths
  - A United States federal judge sentences a Guatemalan national to 30 years in prison
    for helping organize a 2022 migrant-smuggling operation in San Antonio, Texas,
    that left 53 migrants dead and 11 injured. (AFP via France 24)
  - The U.S. state of Florida executes William Reaves Jr. for the 1986 murder of Richard
    Raczkoski. (USA Today)
  - Malaysia's deregisters the opposition coalition Perikatan Nasional, citing internal
    disputes and breaches of the constitution, preventing its component parties from
    contesting forthcoming elections under a common coalition banner. (Reuters)
  - Japanese space program
  - JAXA launches the Martian Moons eXploration spacecraft from the Tanegashima Space
    Center toward Phobos aboard an H3 rocket, aiming to collect at least 10 grams
    of surface material from the Martian moon and return the samples to Earth in 2031.
    (Reuters)
