wikipedia:
  categories:
    International relations:
    - Poland's ambassador to Romania, Paweł Soloch, and Poland's ambassador to China,
      Jakub Kumoch, resign from their positions in protest of the suspension of Polish
      Constitutional Tribunal president Bogdan Święczkowski.
    Law and crime:
    - Madagascar's justice ministry announces dismantling 13 Chinese-run scam centers
      since August, linked to 148 Chinese nationals who had previously operated scam
      centers in Cambodia, and who might have been involved in trafficking Africans
      to commit fraud. The 148 Chinese are extradited to China.
    - Police arrest 139 people outside the United States embassy in London, United
      Kingdom, during a protest supporting Palestine Action, which the UK banned as
      a terrorist organisation in 2025. Police say most arrests involve support for
      a proscribed organisation.
    - A pregnant woman is shot dead and six others are injured in a Spirit Halloween
      store in Fairfield, California, United States. Another person is shot and killed
      in another Spirit Halloween store near Detroit, Michigan.
    Politics and elections:
    - Protests are held across France for the third consecutive weekend.
    - Protests are held in dozens of German cities.
    Sports:
    - In thoroughbred horse racing, thoroughbred racehorse Sovereignty wins the Breeders'
      Cup classic at the Keeneland racetrack in Lexington, Kentucky, U.S.
    - In figure skating, France's Kevin Aymoz wins the men's singles title at Skate
      Canada in Kelowna, British Columbia, overtaking Japan's Rio Nakata and becoming
      the second-oldest men's Grand Prix champion at age 29.
    - The 2026 Summer Youth Olympics opens in Dakar, Senegal, marking the first IOC
      event in Africa.
    - In women's basketball, the Golden State Valkyries defeat the Atlanta Dream in
      game seven to win their first WNBA championship. Gabby Williams is named MVP.
