wikipedia:
  categories:
    Armed conflicts and attacks:
    - Saudi-led coalition air defences intercept a Houthi ballistic missile and two
      drones targeting Riyadh Province as King Khalid International Airport resumes
      limited operations after a two-week closure caused by earlier Houthi attacks.
    - Three staff members are killed and eight students are wounded in an Israeli
      airstrike against the Islamic University of Gaza in Gaza City. Four other Palestinians
      are also killed in more airstrikes in the Gaza Strip.
    Business and economy:
    - Western Sydney Airport in New South Wales, Australia, commences passenger operations
      as Greater Sydney's second airport.
    Disasters and accidents:
    - Twenty-four people are killed and 24 more are injured after a bus collides with
      a truck on a highway in Makueni County, Kenya.
    Health and environment:
    - The Nigerian health ministry expands contact tracing after confirming an imported
      Bundibugyo Ebola case in Abuja, identifying at least 44 contacts while investigating
      additional people who may have been exposed and strengthening infection-control
      measures.
    Politics and elections:
    - Brazilians vote in the second round of presidential elections between incumbent
      center-left president Luiz Inácio Lula da Silva of the Workers' Party and right-wing
      challenger Flávio Bolsonaro of the Liberal Party.
    - Lula wins re-election 52 to 48 percent, defeating Bolsonaro for a fourth non-consecutive
      term and becoming the first Brazilian presidential candidate to have placed
      second in the first round but win the second round.
    - Bulgarians vote in the first round of the presidential election. Incumbent Iliana
      Iotova wins and will face former acting prime minister Andrey Gyurov in a second
      round due to record low turnout and no candidate having a majority of the vote.
    - Serbians vote for all seats in the National Assembly in a snap election, amid
      the student-led protests against the incumbent United Serbia government.
    - The Student List wins the election, with former president Aleksandar Vučić conceding
      defeat.
    - Marine Le Pen of the National Rally announces her presidential campaign.
    - Venezuelan opposition leader and Nobel Peace Prize laureate María Corina Machado
      announces she has returned to Venezuela from exile.
    Sports:
    - In auto racing, American driver Kyle Larson of Hendrick Motorsports wins the
      YellaWood 500 at the Talladega Superspeedway in Alabama, winning his first NASCAR
      Cup Series race at the circuit.
    - In rally raid, Dakar Rally organizers move the 2027 event from Saudi Arabia
      because of security concerns regarding the conflict with the Houthis.
    - In golf, Japan's Yuri Yoshida wins her first LPGA Tour title at the BMW Ladies
      Championship in South Jeolla Province, South Korea, finishing ahead of Australia's
      Minjee Lee and South Korea's Kim Sei-young.
    - The International Weightlifting Federation awards Moscow, Russia, the hosting
      rights to the 2030 World Weightlifting Championships, making it the first IOC-recognised
      sports federation to grant Russia hosting rights for a world championship since
      the 2022 Russian invasion of Ukraine.
