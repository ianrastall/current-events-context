date: '2026-10-21'
source_page:
  portal: Portal:Current events/2026 October 21
  language: en
  wikipedia_revision_id: 1381383764
wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Israel Defense Forces and Shin Bet say that they have killed a Hamas Nukhba
      forces militant that took part in planning the killing of four IDF soldiers
      in September 2025.
    - Salvadoran president Nayib Bukele announces the start of a military operation
      to rescue four Air Force technicians. The technicians, attached to the international
      Gang Suppression Force, were taken hostage after gangs attacked their armored
      vehicle on 18 October.
    Business and economy:
    - South Africa cuts fuel levies by R3.00 (US$0.18) per litre of diesel and R1.50
      ($0.09) per litre of petrol from November 4 to December 1 after fuel prices
      reach record highs.
    - The North Sea Transition Authority (NSTA) of the United Kingdom approves production
      from the Jackdaw gas field after energy secretary Miatta Fahnbulleh authorized
      the NSTA to grant consent, allowing operator Adura to begin supplying gas by
      late October.
    International relations:
    - The U.S. Department of State orders non-emergency employees at its embassy in
      Riyadh, Saudi Arabia, to leave the country as Houthi attacks ramp up.
    - United States special envoy Steve Witkoff arrives in Saint Petersburg to talk
      with Russian president Vladimir Putin about potentially resolving the war with
      Ukraine. Putin states he would resume U.S.-mediated trilateral peace talks with
      Ukraine and the United States, on or after November 10.
    - American military veteran Stephen James Hubbard, who was arrested by Russian
      authorities in 2022 during the Battle of Izium, is released from custody during
      the meeting between Putin and Witkoff.
    - Qatar, Turkey, Pakistan, and Indonesia jointly sign the Badr Memorandum of Understanding,
      a major agreement to deepen their defence industry cooperation. The agreement
      aims to support joint military production projects and strengthen cooperation
      in technical training, research, and development.
    Law and crime:
    - Taiwanese prosecutors indict five people for allegedly accepting money and planning
      to injure an anti-Chinese Communist Party comedian in New Taipei City.
    - A district judge in New Mexico, United States, orders Meta to pay $25 billion
      after a jury found it guilty of misleading Facebook users about privacy violations,
      marking its largest fine ever.
    - The Mexican government launches an investigation into former attorney general
      of Chihuahua César Jáuregui Moreno for allowing U.S. Central Intelligence Agency
      agents to take part in an anti-drug trafficking operation in Chihuahua earlier
      this year. Under Mexican law, the federal government must approve the activities
      of foreign forces on Mexican soil. Authorities later arrest Jáuregui Robles
      and accuse him of treason.
    - Over 80 Americans, British citizens, and Israelis are detained by settlers in
      the Israel-occupied West Bank, including U.S. House of Representatives candidate
      Brad Lander.
    Politics and elections:
    - Thousands of students and teachers march through Athens, Thessaloniki, and Patras
      in Greece to protest against the rising cost of living, calling for affordable
      student housing and more state investment in education.
    - Paul St-Pierre Plamondon is sworn in as the 34th premier of Quebec following
      the Parti Québécois's victory in the general election.
    Science and technology:
    - American video game publisher Electronic Arts, which was recently bought-out
      by the Saudi Public Investment Fund, announces the closing of its Canadian studio
      BioWare.
    - Node.js releases three security updates. These address 10 different vulnerabilities,
      including 4 high-severity ones, which affect how Node.js handles DNS resolution,
      TLS handshakes, and Brotli decoding.
