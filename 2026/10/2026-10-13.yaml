Date: '2026-10-13'
Source_URI: Portal:Current events/2026 October 13
Intelligence_Payload:
  Uncategorized:
  - Yemeni civil war
  - Houthi–Saudi conflict
  - The Royal Saudi Air Force strikes a fuel depot near Sanaa, Yemen. The Houthis
    launch missiles upon multiple Saudi Arabian cities, including Riyadh and Dammam,
    in response. (CNN) (BBC)
  - An administrative building belonging to Saudi Aramco in Dhahran, Eastern Province,
    Saudi Arabia, is partially consumed by a fire after a Houthi missile is intercepted
    over the city by Saudi forces. (Al Jazeera) (Reuters)
  - Bulgaria–Russia relations
  - Two merchant ships are hit by unknown drones off Bulgaria's Black Sea coast, with
    one sinking. Eleven crew members are missing and 20 in total are rescued. Bulgarian
    prime minister Rumen Radev has blamed Russia and summoned its ambassador. It is
    the second such attack in six days. (Reuters)
  - Hezbollah–Israel conflict
  - Hezbollah spokesperson Ali Damoush announces they will pay up to $14,000 in aid
    to families whose homes in Lebanon were destroyed or made uninhabitable during
    its war with Israel. Families in Beirut and its suburbs will receive $14,000,
    while the rest of Lebanon will receive $12,000. (AP)
  - 2026 Atlantic hurricane season
  - Six deaths are confirmed in Florida from Hurricane Isaias. (Fox Weather)
  - 2026 Multan train derailment
  - At least four people are killed and 17 people are injured in a train derailment
    near Multan, Punjab, Pakistan. (AFP via The Straits Times)
  - The World Health Organization reports a surge in cholera cases in Yemen over the
    past three weeks. (Arab News)
  - 2024 Cornell University rape allegations
  - Cornell University in Ithaca, New York, United States, suspends all fraternity
    parties and social events for the remainder of the 2026–27 academic year following
    allegations that seven Chi Phi members drugged and gang-raped a student in 2024.
    (AFP) (BBC News)
  - Impeachment trial of Sara Duterte
  - Philippine prosecutors in the impeachment trial of vice president Sara Duterte
    drop three of the four impeachment charges in an attempt to speed up the trial.
    The Senate, sitting as an impeachment court, approve the move. (AP)
  - LGBTQ rights in Hungary
  - The Hungarian National Assembly passes an amendment repealing most provisions
    of the anti-LGBTQ child protection law that was previously passed during former
    prime minister Viktor Orbán's tenure in 2021. (DW)
  - Murder of Tupac Shakur
  - The Clark County District Court in Nevada, United States, sentences former Crips
    gang leader Duane "Keffe D" Davis to a minimum of 40 years in prison for orchestrating
    the 1996 murder of rapper Tupac Shakur in Las Vegas. (AFP via France 24) (DW)
  - Eight people are injured in a mass stabbing at a supermarket in Incheon, South
    Korea. A suspect is arrested. (CNA)
  - Students in Tirana, Albania, throw bricks at the Ministry of Education building,
    prompting riot police to respond. (Reuters)
  - The Vatican reports that Pope Leo XIV has been diagnosed with an early-stage lung
    cancer after receiving surgery to remove nodules in his lower lobe. (The New York
    Times) (NBC News)
  - 2026 World Artistic Gymnastics Championships
  - The Netherlands denies visas to Russian artistic gymnasts Anna Kalmykova, Viktoria
    Listunova, and Angelina Melnikova for the world championships in Rotterdam, while
    four other Russian gymnasts receive permission to enter the country. (AP)
