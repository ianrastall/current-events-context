wikipedia:
  categories:
    Armed conflicts and attacks:
    - Senior officials representing the members of the Mecca Defence Alliance, including
      Pakistani military chief Asim Munir, Saudi defense minister Khalid bin Salman
      Al Saud, and Turkish intelligence director İbrahim Kalın, meet with Iranian
      leadership, including President Masoud Pezeshkian, in Tehran to discuss efforts
      to de-escalate the 2026 Iran war and the Yemeni civil war.
    - Israel launches an airstrike against a tent for displaced people in Khan Yunis,
      Gaza Strip, killing four Palestinians, including a child, and wounding many
      more.
    - The Israel Defense Forces says that they have killed four Hamas and Palestinian
      Islamic Jihad militants in the Gaza Strip over the weekend.
    - Egypt's parliament authorizes President Abdel Fattah el-Sisi to provide military
      support to Saudi Arabia if requested amid Houthi attacks in Saudi territory.
    - The United Nations (UN) announces it will conclude its support for the Transitional
      Assistance Mission to support the Somali federal government by October 31. The
      UN will continue supporting Somalia through other smaller agencies.
    - Drone strikes by the Rapid Support Forces are reported across power stations
      in southeast Sudan, cutting power across the region.
    - The three gunmen who carried out a mass shooting at a Greek Orthodox Church
      in Karak Governorate, Jordan, are wounded and arrested after a shootout with
      security forces at an abandoned building.
    - The Jordanian Armed Forces announces that it has carried out airstrikes against
      positions of unspecified armed groups in southern Syria, reporting that the
      gunmen are linked to them. Several civilians are killed.
    Disasters and accidents:
    - Two people are killed and around 90,000 more are left without electricity after
      the impact of Storm Boelo in Scotland, parts of Northern Ireland, and northern
      England.
    Law and crime:
    - The Federal Police of Brazil orders Brazilian Federal Senator Flávio Bolsonaro
      to surrender his Brazilian passport after Supreme Federal Court justice Alexandre
      de Moraes barred him from leaving Brazil, one day after Bolsonaro lost the runoff
      of the 2026 Brazilian general election to incumbent President of Brazil Luiz
      Inácio Lula da Silva.
    - A Swiss court convicts former Belarusian security officer Yuri Harauski over
      the 1999 abduction of businessman Anatol Krasouski, later killed, and gives
      him a two-year suspended sentence. He is acquitted over Yury Zacharanka's enforced
      disappearance.
    - The United States Federal Bureau of Investigation announces they have arrested
      nine people involved in Nigerian scam centers, as part of an international operation
      targeting Organised crime in Nigeria; they also locate $11 million in funds
      purloined by the scammers.
    Politics and elections:
    - Protests and riots are held in Bilbao, Spain, after and during a political event
      hosted by far-right commentator Vito Quiles. At least nine people are arrested.
    Sports:
    - In association football, English player Harry Kane wins the men's Ballon d'Or
      for the first time, while Spanish player Alexia Putellas receives the women's
      award for a record-tying third time.
