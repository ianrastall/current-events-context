Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Islamabad Memorandum
  - Axios reports from American officials that Iran and the United States have agreed
    to halt strikes near the Strait of Hormuz and will hold a Qatar-mediated meeting
    in Doha on Tuesday. (Axios) (The Kenya Times)
  - Iran cancels its participation in technical talks scheduled for today due to recent
    strikes against the country and unfulfilled conditions of ⁠the memorandum of understanding
    ceasefire agreement. (Reuters)
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on Bahrain
  - The Bahraini Army says on X that Bahrain has successfully intercepted and destroyed
    "a number" of Iranian missiles and drone attacks on the country. (AA) (AFP via
    The Times of Israel)
  - 2026 Iranian strikes on Kuwait
  - Kuwait's Chief of the General Staff says that his forces have activated air defense
    systems to intercept missiles and drones. (Times Kuwait)
  - Iran's Islamic Revolutionary Guard Corps says it has carried out retaliatory strikes
    against United States military bases in Bahrain and Kuwait, including the Ali
    Al Salem Air Base and U.S. Fifth Fleet naval base. (The New Region)
  - 2026 Strait of Hormuz crisis
  - South Korea's ocean ministry says that two more vessels have transited through
    the Strait of Hormuz, bringing the total amount of ships to do so to 23 after
    weeks of disruption caused by the war. The ocean ministry also says that only
    three more South Korean-operated ships are remaining in the Persian Gulf, including
    the Panama–flagged HMM Namu, which was damaged in a explosion on May 4. (The Korea
    Herald)
  - Iraq in the 2026 Iran war, Iran–Iraq relations, Reactions to the assassination
    of Ali Khamenei
  - Iranian foreign minister Abbas Araghchi arrives in Baghdad, Iraq, for talks with
    Iraqi authorities on arrangements for the funeral of former supreme leader Ali
    Khamenei. (AA) (Kurdistan24)
  - Gaza war
  - Gaza war ceasefire violations
  - Israel reports that it has killed three Palestinian police officers in a latest
    violation of the ceasefire. (MENAFN)
  - Israel says its military has killed Mansour Sami Mahmoud Shahtout, a Hamas naval
    police commander who ran the Central Camps and took part in the October 7 attacks,
    in an airstrike in the Gaza Strip. (The Times of Israel)
  - 2026 Lebanon war
  - Israeli occupation of Southern Lebanon
  - Israel says its military has destroyed a Hezbollah tunnel in Majdal Zoun, southern
    Lebanon, after notifying the United States. Israeli officials state that the tunnel
    contained weapons and rocket launcher shafts. (AFP via Daily Sun) (Reuters)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war
  - Ukrainian forces launch FP-5 Flamingo cruise missiles at strategic targets in
    Russia, striking the Titan-Barrikady complex in Volgograd, which produces launchers
    for Russia's Yars and Iskander missile systems. Authorities say ten people have
    been wounded in the strikes. A separate missile strike destroys a Pantsir missile
    system in Crimea. (The Telegraph)
  - 2026 Saudi Aramco AW139 crash
  - Fourteen people are killed as a helicopter belonging to the Saudi Aramco oil company
    crashes in Ras Tanura, Saudi Arabia. (Al Jazeera) (CNN)
  - 2026 Tomblaine Pilatus PC-6 Porter crash
  - Ten passengers and the pilot are killed in a plane crash during a skydiving trip
    in Tomblaine, Meurthe-et-Moselle, France. The passengers are identified as five
    instructors and five students. (Al Jazeera) (CNN)
  - 2026 European heatwaves
  - France records an additional 1,000 deaths as the country grapples with a severe
    heat wave. (AP)
  - Poland records a provisional national high temperature of in Słubice, Lubusz Voivodeship,
    exceeding a 1921 record. (AA)
  - Armenia–Israel relations, Armenian genocide recognition
  - Israel's government unanimously approves recognition of the World War I-era mass
    killings of Armenians by the Ottoman empire as genocide, pending parliamentary
    ratification. (AFP via Le Monde) (AP)
  - Crime in Israel
  - Five people are killed and a child is injured in car bombing attacks and murders
    in Tel Aviv, Holon, and Arab-Israeli communities in Israel. The attacks are linked
    to organized crime or criminal violence. (DPA via Yahoo News)
  - Iraqi forces raid the Green Zone in Baghdad, Iraq, reportedly arresting at least
    47 officials suspected of corruption, including lawmakers and senior government
    officials. Videos on social media appear to show Iraqi Army tanks entering the
    diplomatic district. The military also begins arresting officials in Salahuddin,
    Al Anbar, and Nineveh. (i24 News) (Kurdistan24) (Middle East Eye)
  - 2026 New Caledonian legislative election
  - New Caledonians vote to elect 54 seats of their local Congress for the first time
    since 2019, after the vote was delayed three times following unrest in 2024 and
    the Bougival Accord in 2025. Preliminary results indicate the loyalist bloc taking
    24 seats and the separatist bloc taking 26 seats, with Oceanian Awakening taking
    a crossbench position with four seats. (RNZ) (France Info)
  - Mass media in Uganda
  - Uganda's military surrounds the offices of Nation Media Group outlets in Kampala
    after army chief Muhoozi Kainerugaba orders the shutdown of the company's newspapers,
    television station, and radio networks. (AFP via The Daily Star)
  - The British government announces that it will scrap the 202-year-old Vagrancy
    Act that criminalizes rough sleeping in England and Wales, saying that a new law
    will aim at "preventing homelessness" rather than "punishing" it. (The Independent)
