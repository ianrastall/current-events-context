Date: '2026-06-08'
Source_URI: Portal:Current events/2026 June 8
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Israeli prime minister Benjamin Netanyahu says that Israel has agreed to stop
    the airstrikes on Iran at United States president Donald Trump's request, but
    an official states that Israeli attacks on southern Lebanon will continue. Netanyahu
    also warns that Israel will respond if Iran resumes military action. (AFP via
    Dawn) (Al Jazeera)
  - 2026 Iranian strikes on Israel
  - The Israeli Air Force launches strikes against military sites in western and central
    Iran, making it the first time Israel launched strikes against Iran since the
    April 7 ceasefire. The strikes come as Iranian state media reported explosions
    were heard in Isfahan, Kermanshah, Tabriz, and Tehran. (The Jerusalem Post) (Israel
    National News)
  - The Iranian military says that attacks on Israel will resume if it continues the
    war against Lebanon. (Al Jazeera)
  - 2026 Iranian strikes on the Kurdistan Region
  - The Islamic Revolutionary Guard Corps launches strikes in the Sulaymaniyah Governorate
    against the Kurdish opposition group headquarters in the Kurdistan region of Iraq.
    (AA)
  - 2026 Houthi strikes on Israel
  - The Houthis fire two missiles at Israel, one of which was intercepted, and another
    that did not reach it. (Al Jazeera)
  - 2026 Strait of Hormuz crisis
  - Iran ambassador to Russia Kazem Jalali tells the Russian newspaper Izvestia that
    the Strait of Hormuz will reopen, but with new conditions set by Iran and Oman,
    including transit fees. (Reuters)
  - Sudanese civil war
  - A U.S.-led coalition consisting of Belgium, France, Germany, Greece, Italy, Norway,
    and the United Kingdom endorses a civilian-led political dialogue for Sudan to
    end the war under the facilitation of the African Union, the Arab League, the
    European Union, IGAD, and the United Nations. (Capital FM Kenya) (Radio Tamazuj)
  - Kashmir conflict, Protests in Pakistan
  - Eleven people, including four police officers, are killed and dozens others are
    injured during clashes between police and supporters of the banned Joint Awami
    Action Committee (JAAC) in Azad Kashmir, Pakistan. Police arrest more than 70
    JAAC members. (Al Jazeera)
  - Economic impact of the 2026 Iran war
  - The Iraqi Civil Aviation Authority reopens Iraq's airspace after Iran announced
    that it was halting attacks against Israel. Additionally, Syria reopens its airspace,
    including resuming operations at the Damascus International Airport. (Middle East
    Eye) (Arabian Business)
  - 2026 Mindanao earthquake
  - A earthquake, whose epicenter is located off Maasim, Sarangani, Philippines, strikes
    Mindanao, hitting as far as Leyte, the provinces of North Maluku and North Sulawesi,
    Indonesia, and Sabah, Malaysia. At least 35 people are killed while more than
    200 others are injured and 12 are missing. (AP and AFP via Philippine Daily Inquirer)
    (The Guardian) (Malay Mail) (The Philippine Star)
  - Tsunamis are recorded in Palau and parts of Indonesia, Japan, and the Philippines.
    The Pacific Tsunami Warning Center (PTWC) cancels its tsunami advisory issued
    for Guam and the Northern Mariana Islands; while agencies in Australia, Malaysia,
    and New Zealand lift their respective warnings. The warning issued by the PTWC
    for parts of the Pacific remains in effect. (BBC News) (NHK) (The Straits Times)
    (RNZ)
  - Philippine president Bongbong Marcos orders the suspension of classes in affected
    areas across Mindanao, coinciding with the country's first day of the new school
    year. (Nikkei Asia)
  - Climate change in the United States
  - The U.S. National Oceanic and Atmospheric Administration records the country's
    second-warmest spring since records began, while drought conditions affect more
    than half of the contiguous states despite above-average precipitation in some
    regions. (AFP via Terra Daily)
  - Human trafficking in Finland
  - A Finnish court sentences former chief executive Jukka Kristo to two and a half
    years' imprisonment for human trafficking after finding that dozens of Thai berry
    pickers were subjected to forced labour and exploitative working conditions in
    Finland. (AFP via CNA)
  - 2026 Armenian parliamentary election
  - Preliminary results from yesterday's election reveal that the governing Civil
    Contract party won 49.8% of votes, translating to a parliamentary majority, but
    falling short of the two-thirds majority required to call a constitutional referendum
    for a peace deal with Azerbaijan and the restart of border trade with Turkey.
    Opposition alliances Strong Armenia and Armenia Alliance entered parliament after
    winning 23.2% and 9.9% of the vote ​respectively. A fourth party, Prosperous Armenia,
    narrowly missed entering parliament after a later tally of electronic votes. (Reuters)
  - 2026 Jersey general election
  - Declared results indicate that Reform Jersey leader Sam Mézec will not be re-elected
    to the States Assembly after placing tenth in the senatorial race. (BBC News)
  - Illegal immigration to India
  - The government of West Bengal, India, deports nearly 5,000 Bangladeshi nationals
    and detains hundreds more as part of a campaign targeting undocumented migrants
    following the state's recent election. (AFP via Daily Tribune)
  - 2026 FIFA World Cup
  - 2026 FIFA World Cup controversies
  - Several members from Iran, Iraq, and Somalia, along with international sports
    delegations including referee Omar Abdulkadir Artan, are denied visas and blocked
    from entering the United States for the FIFA World Cup. (AFP via France 24) (BBC
    Sport) (The Guardian)
