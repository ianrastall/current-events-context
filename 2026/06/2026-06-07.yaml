  - 2026 Lebanon war
  - 2026 Israel–Lebanon ceasefire
  - At least two people are killed and 11 are injured by Israeli airstrikes in Beirut,
    Lebanon, which Israel claimed targeted Hezbollah infrastructure. (Al Jazeera)
    (The Guardian)
  - Gaza war
  - At least 13 Palestinians are killed by Israeli airstrikes across Gaza City, Deir
    al-Balah, and al-Mawasi, in Gaza. (Al Jazeera)
  - Reactions to the 2026 Iran war
  - Bahrain–Iran relations, Reactions to the assassination of Ali Khamenei
  - Bahrain Interior Minister Rashid bin Abdullah Al Khalifa says that the country
    will prohibit mourning of the former supreme leader Ali Khamenei during the Ashura
    commemorations. (The National News)
  - Economic impact of the 2026 Iran war
  - Iraq and Syria temporarily close their airspace, and the Damascus International
    Airport suspends its operations, amidst the Iranian strikes on Israel. (Al Jazeera)
  - Iran closes its airspace in the western part of the country. (Al Jazeera)
  - Israel's Ben Gurion Airport will remain open despite Iranian missile launches
    at Israel. However, officials say that they are prepared to close the airport
    if missile fire from Iran or Hezbollah expands. (Ynetnews)
  - Kuwait in the 2026 Iran war
  - The Public Authority of Civil Aviation files a second protest complaint to the
    International Civil Aviation Organization over Iran's attacks on Kuwait, including
    the international airport. (Times Kuwait)
  - Terrorism in Greece
  - The Hellenic Police reports that the Greek Anti-Terrorist Service (DAEEB) and
    National Intelligence Service have arrested a Palestinian-born alleged Hamas operative
    who resides in Crete after he allegedly joined the militant group. (The Jerusalem
    Post)
  - A Palestinian man kills one person and injures five others before being shot and
    killed by police during an attack through several towns in central Israel. (AP)
  - 2026 Armenian parliamentary election
  - Armenia begins conducting an election for the National Assembly, the first since
    the expulsion of Nagorno-Karabakh Armenians in late 2023. Incumbent prime minister
    Nikol Pashinyan seeks a third term in office and the retention of a Civil Contract
    government. (AP)
  - 2026 Jersey general election
  - Islanders of Jersey vote to elect 49 seats of the States Assembly. (BBC)
  - 2026 Kosovan parliamentary election
  - Kosovo holds its third elections for the Kuvendi in 18 months amid continued political
    deadlock and the lack of a two-thirds majority to elect a president. Vetëvendosje,
    led by incumbent prime minister Albin Kurti, remains the largest party in the
    Kuvendi but falls short of a majority government. (AP)
  - 2026 Peruvian general election
  - Peruvians vote in the second round of presidential elections between Together
    for Peru candidate Roberto Sánchez and Popular Force candidate Keiko Fujimori.
    (AP)
  - South Korean president Lee Jae Myung names Han Seong-sook as the new prime minister.
    If Parliament approves her appointment, she will become the first woman in twenty
    years to hold the post. (Reuters)
  - 2026 Real Madrid CF presidential election
  - Florentino Pérez is re-elected president of Real Madrid, defeating Enrique Riquelme.
    (The New York Times)
