wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - At least two people are killed and 11 are injured by Israeli airstrikes in Beirut,
      Lebanon, which Israel claimed targeted Hezbollah infrastructure, violating the
      ongoing ceasefire. (Al Jazeera) (The Guardian)
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - Iranian state media reports that Pakistani interior minister Mohsin Naqvi handed
      Iranian foreign minister Abbas Araghchi a "written message" from prime minister
      Shehbaz Sharif for supreme leader Mojtaba Khamenei. (Arab News PK)
    - U.S. president Donald Trump urges Iran to return to ceasefire negotiations and
      finalize a deal. He also says that Israeli prime minister Benjamin Netanyahu
      will have "no choice" but to accept any deal that the U.S. reaches with Iran.
      (Shafaq) (Financial Times)
    - Nuclear program of Iran
    - U.S. president Trump threatens that the United States will seize and destroy
      Iran's highly enriched uranium, with or without their cooperation. (Al Jazeera)
    - 2026 Iranian strikes on Israel
    - The Israeli Air Force intercepts multiple waves of Iranian missiles fired at
      northern Israel, the first launches at Israel since the ceasefire began in April,
      targeting the Ramat David Airbase. (Axios) (Al Jazeera) (Al Jazeera)
    - The Iranian military command says that the Israeli attacks on southern Lebanon
      and the Dahieh suburb of Beirut "crossed all red lines" and that there will
      be a response if they continue. (Axios) (Al Jazeera)
    - Gaza war
    - At least 13 Palestinians are killed by Israeli airstrikes across Gaza City,
      Deir al-Balah, and al-Mawasi, in Gaza, in violation of the ongoing ceasefire.
      (Al Jazeera)
    - Reactions to the 2026 Iran war
    - Bahrain–Iran relations, Reactions to the assassination of Ali Khamenei
    - Bahraini interior minister Rashid bin Abdullah Al Khalifa says that the country
      will prohibit mourning of the former Iranian supreme leader Ali Khamenei during
      the Ashura commemorations. (The National News)
    - 79th Tony Awards
    - The Broadway play Death of a Salesman wins the most Tony Awards in 2026 with
      six, including Best Revival of a Play, while Liberation, Ragtime, and Schmigadoon!
      all win the second-most awards with four each, including Best Play, Best Revival
      of a Musical, and Best Musical, respectively. (AFP via France 24)
    - Economic impact of the 2026 Iran war
    - Iraq and Syria temporarily close their airspace, and the Damascus International
      Airport suspends its operations, amidst the Iranian strikes on Israel. (AFP
      via The Times of Israel) (Al Jazeera)
    - Iran closes its airspace in the western part of the country. (Al Jazeera)
    - Twenty-one people are killed and 19 others injured after a bus overturned and
      caught fire near Nasiriyah, Iraq. (Reuters)
    - Six people are killed after a van collided with a truck in Sichuan Province,
      China. (Xinhua)
    - Two people are killed when a Gulfstream G200 private jet crashes at La Romana
      International Airport in La Romana, Dominican Republic. (AFP via The New Zealand
      Herald)
    - Buildings are seriously damaged and landslides occur after two 5.1 and 4.9 earthquakes
      strike Euboea, Greece. (Skai)
    - Kuwait in the 2026 Iran war
    - Kuwait's civil aviation authority files a second protest complaint to the International
      Civil Aviation Organization over Iran's attacks on the country, including the
      international airport. (Times Kuwait)
    - Terrorism in Greece
    - Greek police reports that the Anti-Terrorist Service and National Intelligence
      Service have arrested a Palestinian-born alleged Hamas operative who resides
      in Crete after he allegedly joined the militant group. (The Jerusalem Post)
    - A Palestinian man kills one person and injures five others before being shot
      and killed by police during an attack through several towns in central Israel.
      (AP)
    - 2026 Armenian parliamentary election
    - Armenia begins conducting an election for the National Assembly, the first since
      the expulsion of Nagorno-Karabakh Armenians in late 2023. Incumbent prime minister
      Nikol Pashinyan seeks a third term in office and the retention of a Civil Contract
      government. (AP)
    - 2026 Jersey general election
    - Islanders of Jersey vote to elect 49 seats of the States Assembly. (BBC)
    - 2026 Kosovan parliamentary election
    - Kosovo holds its third elections for the Kuvendi in 18 months amid continued
      political deadlock and the lack of a two-thirds majority to elect a president.
      Vetëvendosje, led by incumbent prime minister Albin Kurti, remains the largest
      party in the Kuvendi but falls short of a majority government. (AP)
    - 2026 Peruvian general election
    - Peruvians vote in the second round of presidential elections between Popular
      Force candidate Keiko Fujimori and Together for Peru candidate Roberto Sánchez.
      (AP)
    - South Korean president Lee Jae Myung names Han Seong-sook as the new prime minister.
      If parliament approves her appointment, she will become the first woman in twenty
      years to hold the post. (Reuters)
    - 2026 Real Madrid CF presidential election
    - In association football, Florentino Pérez is re-elected president of Real Madrid,
      defeating Enrique Riquelme. (The New York Times)
