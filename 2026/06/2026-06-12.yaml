wikipedia:
  categories:
    Uncategorized:
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - Pakistani prime minister Shehbaz Sharif says that a ceasefire deal between Iran
      and the United States has a "final, agreed upon text" to end the war. (CNBC)
    - Iranian foreign minister Abbas Araghchi says that a ceasefire deal with the
      U.S. to extend the ceasefire, reopen the Strait of Hormuz, and launch negotiations
      on the Iranian nuclear program has "never been closer". (Axios)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - The United States Central Command says that American forces have intercepted
      multiple Iranian drones targeting commercial ships in the Strait of Hormuz.
      They also reaffirm that the "international trade corridor remains open for transit".
      (Haaretz) (The Hill)
    - Iranian foreign minister Abbas Araghchi says that the Strait of Hormuz will
      not return to the way it was before the war, that it will be under Iranian and
      Omani sovereignty, and will have a fee. (Al Jazeera)
    - War on cartels
    - Operation Southern Spear
    - U.S. president Donald Trump announces that a joint U.S.–Venezuela operation
      has killed Tren de Aragua leader Niño Guerrero. (Politico)
    - Initial public offering of SpaceX
    - Businessman Elon Musk becomes the world's first U.S.-dollar trillionaire after
      his company SpaceX debuts on the Nasdaq stock market. (Bloomberg) (Reuters)
    - Eight people are killed after a bus veered off a cliff in Kavrepalanchok, Nepal.
      (Xinhua)
    - One person is killed, and twenty-two others are injured after a tent collapses
      at a church event in Moneta, Virginia, United States. (AA) (AP)
    - 2026 Kent meningitis outbreak
    - Health authorities in the United Kingdom launch a vaccination program against
      the Meningitis B virus in the wake of an outbreak that occurred at the University
      of Kent in Kent, England, which has killed two people. (Reuters)
    - Northern Irish health minister Mike Nesbitt announces that students aged up
      to 25 in Northern Ireland will be offered the meningitis vaccine in the wake
      of the outbreak at the University of Kent. (Irish News)
    - 2026 Midland shooting
    - One person is killed, and ten others are injured in a mass shooting at an abandoned
      veterinary clinic in Midland, Texas, United States. The suspect dies from a
      self-inflicted gunshot wound. (CNN)
    - 2024 South Korean martial law crisis
    - Former South Korean president Yoon Suk Yeol is found guilty of treason and abuse
      of power for ordering drones to be flown into North Korea in order to provoke
      North Korea and help justify his martial law declaration, and is sentenced to
      30 years imprisonment on top of a pre-existing life sentence. (AFP via Cebu
      Daily News) (The Korea Herald)
    - A judge in Los Angeles County, California, sets a trial date for February 14,
      2028, for Wade Robson and James Safechuck, who both allege that they were sexually
      abused as children by the late American singer Michael Jackson. (Rolling Stone)
      (People.com)
    - 2025–2026 Indonesian protests
    - Hundreds of students protest against Indonesian president Prabowo Subianto prompted
      by a fuel price hike, governmental tensions, and mismanaged government spending
      on the Free Nutritious Meals program. (AP) (Reuters)
    - Regulation of artificial intelligence in the United States
    - The U.S. Department of Commerce orders artificial intelligence company Anthropic
      to ban non-Americans from accessing its large language models Claude Mythos
      and Fable 5. (BBC News) (CNBC)
    - 2026 FIFA World Cup
    - 2026 FIFA World Cup controversies, Ghana at the FIFA World Cup
    - Ghanaian midfielder Thomas Partey is denied a visa to enter Canada, thus missing
      his team's World Cup opener against Panama in Toronto. The IRCC cites ongoing
      legal proceedings stemming from charges of rape and sexual assault in the UK.
      He has pled not guilty to all charges. (Al Jazeera) (The New York Times)
    - Canada at the FIFA World Cup, United States at the FIFA World Cup
    - The opening ceremonies of the FIFA World Cup in Canada and the United States
      occur at the Toronto Stadium and SoFi Stadium in Inglewood, California, respectively.
      (AFP via The Globe and Mail) (BBC News) (FIFA)
    - In their opening match, Canada earn their first point in World Cup history after
      drawing 1–1 with Bosnia and Herzegovina. (ESPN)
    - Israel at the FIFA World Cup, Gaza war protests
    - Pro-Palestinian protests are held near the Toronto Stadium, against FIFA's association
      with Israel. Additionally, a red banner was displayed near the Gardiner Expressway.
      (Reuters)
