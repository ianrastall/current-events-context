Date: '2026-06-22'
Source_URI: Portal:Current events/2026 June 22
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Mediators Pakistan and Qatar say that Iran and the United States have agreed to
    a roadmap aimed at reaching a final deal within 60 days. (BBC News)
  - 2026 Strait of Hormuz crisis
  - The Indian government confirms that four India-bound fertilizer cargo ships carrying
    urea, diammonium phosphate, and sulfur have successfully transited through the
    Strait of Hormuz. (Reuters)
  - Shipping data from Kpler shows that two crude oil tankers carrying 2 ​million
    barrels of oil have transited through the Strait of Hormuz coming from the east,
    including one of the vessels showing Basra, Iraq, as its destination. (Reuters)
  - Russo-Ukrainian war
  - Aerial warfare in the Russo-Ukrainian war
  - Ukrainian Deputy Prime Minister Oleksiy Kuleba says Russian drone attacks in Ukraine
    kill at least five people, including an Egyptian crew member aboard a Panamanian-flagged
    vessel in the Black Sea and three members of the same family in Sumy Oblast. The
    attack also damages the vessel and forces its crew to evacuate. (Hurriyet Daily
    News) (Firstpost)
  - Myanmar civil war
  - The United Nations reports that the Tatmadaw's Army has killed over 700 Myanmar
    civilians. (BBC)
  - Economic impact of the 2026 Iran war
  - Iran–United States relations, United States sanctions against Iran
  - The U.S. treasury department lifts sanctions against Iran and authorizes the production,
    delivery and sale of Iranian oil for 60 days amidst ongoing talks in Switzerland.
    (AFP via NDTV) (CNBC) (The New York Times)
  - 2026 Iran war fuel crisis
  - U.S. crude oil prices fall 2.7% to about $74 per barrel for the first time since
    early March after U.S. Treasury Secretary Scott Bessent announced a 60-day waiver
    of sanctions on the purchase of Iranian oil. (NBC News)
  - At least 15 people are killed, including children, and several others are injured
    in a fire at a commercial building in Lucknow, Uttar Pradesh, India. (India Today)
  - 2026 Ebola epidemic
  - The total amount of cases of Ebola in the Democratic Republic of the Congo reaches
    past 1,000. (The Hill)
  - 2024 South Korean martial law crisis
  - A South Korean court sentences former justice minister Park Sung-jae to 25 years
    in prison for being involved in former president Yoon Suk Yeol's martial law declaration.
    Prosecutors state that Park assisted preparations for implementing the measure.
    (AFP via Khmer Times)
  - 2026 Tacloban school shooting
  - Three people are killed and 13 others are injured in a mass shooting at a secondary
    school in Tacloban, Philippines. Two suspects, including a student, are arrested.
    (AFP via ABS-CBN News) (DZRH)
  - Trial of Jeffrey Donaldson
  - A British court finds former DUP leader Jeffrey Donaldson guilty of all 18 charges,
    including one count of rape, in relation to two victims who were children at the
    time of the offense. In a related trial of the facts, the jury found that his
    wife, Eleanor, had aided and abetted five offenses. (BBC News) (The Guardian)
    (The New York Times)
  - Corruption in Spain
  - Former deputy leader of ruling PSOE and former minister of transport José Luis
    Ábalos is sentenced to 24 years in prison for taking bribes in connection with
    public contracts for face masks during the COVID-19 pandemic in Spain. His advisor
    Koldo García is sentenced to 19 years and the businessman Víctor de Aldama to
    four and a half years. (The Guardian)
  - 2026 Côte-des-Neiges shooting
  - A police officer, a civilian, and the suspect are killed in a mass shooting in
    Montreal, Quebec, Canada. (New York Times), (CBC)
  - Egypt’s security forces detain 87 Egyptians and 136 other foreigners over illegal
    gold mining and smuggling including the Sudanese border. (The Independent)
  - 2026 Labour Party leadership crisis
  - Keir Starmer announces his resignation as British prime minister and leader of
    the Labour Party in an address to the nation outside 10 Downing Street. He will
    remain as caretaker prime minister until a new party leader is elected. (AP) (BBC
    News)
  - 2026 South Sudanese general election
  - Authorities in South Sudan announce that the first general election in the country
    will be held on December 22, 2026, the first since its independence in 2011. (The
    Sudan Times)
  - Mass media in the Czech Republic
  - Employees of the Czech public broadcasters Czech Television and Czech Radio are
    on a 24-hour warning strike to protest against the abolition of licence fees and
    tying of the public media budget to the government budget. (AP) (Swissinfo)
  - Iran and weapons of mass destruction
  - U.S. vice president JD Vance says that Iran has agreed to allow International
    Atomic Energy Agency inspections of its nuclear program following the first round
    of post-war peace negotiations at the Bürgenstock Resort in Switzerland. (BBC
    News) (The Washington Post)
  - 2026 FIFA World Cup
  - Argentina at the FIFA World Cup
  - In association football, Argentine forward Lionel Messi sets a new record for
    career goals scored at the FIFA World Cup at 18, scoring two goals in a 2–0 win
    over Austria in the group stage. (NBC News)
