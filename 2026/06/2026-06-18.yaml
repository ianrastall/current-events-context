    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Islamabad Memorandum
    - Pakistan in the 2026 Iran war
    - Pakistani prime minister Shehbaz Sharif postpones his visit to Switzerland after
      the memorandum of understanding (MOU) between Iran and the United States was
      signed remotely. (AFP via Al Arabiya) (Dunya News)
    - Sharif reaffirms that the MOU to end the war will take effect immediately and
      that Iran will "instantly" reopen the Strait of Hormuz and that the American
      blockade on ports will end "immediately". (TRT World) (CBS News)
    - The U.S. presidential executive office provides a text of the details on the
      agreement to the U.S. Congress. (Reuters)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - 2026 United States naval blockade of Iran
    - U.S. vice president JD Vance says that his country will allow ships through
      to Iranian ports, and that the naval blockade will be lifted as part of a agreement
      to end the war. (AP)
    - The United States Central Command confirms that the naval blockade imposed by
      the U.S. Navy on Iranian ports and coastal areas has ended. (CNBC)
    - Iran announces that it will begin charging fees for passage through the Strait
      of Hormuz at the end of the 60 days in the agreement. (The Guardian)
    - According to data from Kpler, three oil supertankers from Saudi Arabia carrying
      6 million barrels of crude oil were seen transiting through the Strait of Hormuz.
      (CNBC)
    - 2026 Lebanon war
    - Israeli airstrikes kill at least three people across southern Lebanon. (Al Jazeera)
    - Israel publishes a map of southern Lebanon that it will continue to illegaly
      occupy, and says it may launch attacks beyond it, as Israeli prime minister
      Benjamin Netanyahu rules out a withdrawal of Israeli troops from Lebanon. (Reuters)
      (South China Morning Post)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Ukraine launches its largest ever drone attack on Moscow, Russia, targeting
      the Moscow Refinery and damaging several residential buildings. (AP) (CNN)
    - Residents of Moscow report oil raining down as massive plumes of black smoke
      are visible over the city. (BBC News)
    - Following the attack, Ukrainian president Volodymyr Zelenskyy threatened Moscow
      saying, "If Ukraine burns, your Moscow will burn", warning against further Russian
      attacks on the country. (The Guardian)
    - Russia says it will carry out a "massive retaliation" against Ukraine with Russian
      foreign minister Sergey Lavrov saying the Russian Armed Forces will from now
      on, carry out "massive group strikes" on a "regular basis" following the attack
      on Moscow. (MSN)
    - War in the Sahel
    - Islamist insurgency in Niger
    - June 2026 Diori Hamani International Airport attack
    - Eleven soldiers, two civilians and 22 gunmen are killed in a mass shooting and
      shootout at the Diori Hamani International Airport in Niamey, Niger. Twenty
      suspects are also arrested. (AP)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - The American Automobile Association reports that gas prices in the United States
      are at $3.999 per gallon, making it the first time gas prices have gone below
      $4 since March 30 after rising amidst the Iran war. (CBS News) (PBS)
    - The United Kingdom lifts its travel advisory for Bahrain, Kuwait, Qatar, the
      United Arab Emirates, and the Riyadh and Eastern provinces of Saudi Arabia after
      the signing of the peace deal. (The Independent)
    - A fire at a Wyndham resort in Bayahíbe, Dominican Republic, kills one person,
      injures several others, and prompts the evacuation of nearly 1,700 tourists.
      Authorities state that combustible roofing materials and wind conditions contribute
      to the fire's spread. (Reuters)
    - 2026 Ebola epidemic
    - The Africa Centres for Disease Control and Prevention reports that the Ebola
      outbreak in the Democratic Republic of the Congo has caused 202 deaths from
      875 confirmed cases. Health officials cite difficulties in contact tracing,
      while the Red Cross warns that the outbreak has not yet peaked. (AFP via Jamaica
      Observer)
    - MV Hondius hantavirus outbreak
    - Two more passengers who were on the MV Hondius cruise ship during the hantavirus
      outbreak exit the National Quarantine Unit at the University of Nebraska Medical
      Center in Omaha, Nebraska, making the total amount of people remaining in quarantine
      to six. (Omaha World-Herald) (Central Nebraska Today)
    - A study published in the The Lancet medical journal, led by the Queen Mary University
      of London and funded by Cancer Research UK, estimates that the HPV vaccine has
      prevented around 200 deaths from cervical cancer in England. Additionally, the
      study also finds that no women aged 20–24 have died from the disease between
      2020 and 2024. (Sky News)
    - Australian researchers report that an H5 avian influenza outbreak on Heard Island
      and McDonald Islands has killed more than 13,000 southern elephant seal pups
      and has infected local bird and penguin populations, marking the virus's first
      detection in an Australian external territory. (AFP via The Straits Times)
    - Scientists confirm that Major Oak, a 1,000-year-old oak tree in Sherwood Forest,
      Nottinghamshire, England, has died. The tree failed to produce any new leaves
      this year after becoming "stressed" by a series of hot, dry summers over the
      last decade. (The Guardian)
    - 2026 Labour Party leadership crisis
    - 2026 Makerfield by-election
    - Former Greater Manchester mayor Andy Burnham is elected to the House of Commons
      of the United Kingdom after winning a by-election in Makerfield, setting up
      a leadership challenge to prime minister Keir Starmer. (The Guardian)
    - Kyrgyz president Sadyr Japarov signs an order to dismiss Abdupaty Matkalikov
      from his post as mayor of Manas, Jalal-Abad Region, Kyrgyzstan. (24.kg) (Akipress)
    - The National Assembly of Zimbabwe approves a bill extending presidential terms
      from five to seven years, which will allow president Emmerson Mnangagwa, whose
      second term was scheduled to end in 2028, to remain in power until 2030. The
      constitutional amendment also scraps direct presidential elections, electing
      future presidents through parliament. (BBC News)
    - The National Nutrition Agency of Indonesia suspends its free meal programme
      during public holidays, citing efficiency and programme review measures. The
      policy is expected to reduce spending as the government seeks to address budget
      pressures and economic challenges. (AFP via New Straits Times)
    - 2026 FIFA World Cup
    - Canada at the FIFA World Cup
    - In association football, co-hosts Canada win their first-ever FIFA World Cup
      match after defeating Qatar 6–0 on the second matchday. (AFP via France 24)
    - 2026–27 NHL season
    - In ice hockey, the National Hockey League clears former head coach Mike Babcock
      to coach again in the league after the league opened an investigation into his
      resignation in September 2023 from the Columbus Blue Jackets before coaching
      a game with them in the wake of allegations that he requested that players on
      the team share personal photos. (ESPN)
