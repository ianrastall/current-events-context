wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - The Bahraini defense force intercepts three Iranian missiles and multiple drones
      that it says were targeting "civilian" facilities. (AA)
    - Kuwait in the 2026 Iran war
    - The Kuwaiti defense ministry says that the military shot down 13 ballistic missiles
      and 17 drones from Iran, during attacks that killed one person and injured 63
      at Kuwait International Airport. (Al Jazeera) (Reuters) (Reuters)
    - 2025–2026 Iran–United States negotiations
    - Iranian foreign minister Abbas Araghchi says that "no tangible progress" has
      been made in the peace talks, though Iran is still in contact with the United
      States to prevent an attack on Beirut, Lebanon, which would cause "full-scale
      resumption" of war. (France 24)
    - Amidst a continuation of strikes, U.S. Secretary of State Marco Rubio during
      a House Foreign Affairs Committee hearing reaffirms that Operation Epic Fury,
      the codename for the initial phase of U.S. military operations during the war,
      has concluded. (AFP via France 24)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Israeli strikes kill at least nine people, including two paramedics, in southern
      Lebanon, violating the ongoing ceasefire. (BBC News)
    - Following a fourth round of peace talks, the governments of Israel and Lebanon
      reach an agreement to renew the ceasefire if Hezbollah ceases its attacks and
      both countries will implement pilot zones in security zones across Lebanon where
      Hezbollah militants would be banned. (BBC) (Times of Israel)
    - Somali Civil War
    - Constitutional crisis in Somalia, Controversies of Hassan Sheikh Mohamud
    - 2026 Mogadishu clashes
    - Heavy fights erupt with several casualties reported across major routes in Mogadishu
      after opposition Somali Future Council was attacked by forces loyal to disputed
      president Hassan Sheikh Mohamud, ahead of planned anti-government protests.
      (Garowe Online) (AFP via Yahoo) (Al Jazeera)
    - Kivu conflict
    - Allied Democratic Forces insurgency
    - Allied Democratic Forces fighters kill 16 civilians in a village in the Beni
      Territory, North Kivu Province, Democratic Republic of the Congo (DRC). (Reuters)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Ukrainian president Volodymyr Zelenskyy says that Ukrainian drones have struck
      an oil terminal in Saint Petersburg, Russia, amidst the economic forum scheduled
      to be held in the city and military facilities at a naval base in Kronstadt.
      (Kyiv Post)
    - Sudanese nomadic conflicts
    - A cattle raid in the South Sudanese state of Unity State kills 14 people, including
      four children. (Medafrica Times)
    - German filmmaker Wim Wenders withdraws his 1975 film The Wrong Move from distribution
      after actress Nastassja Kinski objected to a nude scene filmed when she was
      13 years old, calling for the film to be re-edited. (AP)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis, India in the 2026 Iran war
    - India approves a ₹96 billion (US$1 billion) support package for airlines through
      interest-free advances to oil companies to help stabilize aviation fuel prices
      amid rising costs linked to disruptions in global oil supplies. (AFP via The
      Manila Times)
    - Kuwait in the 2026 Iran war
    - Kuwait Airways resumes flights from Kuwait International Airport after the latest
      Iranian attack. (Reuters)
    - 2026 Delhi hotel fire
    - At least 23 people are killed and 40 others are injured in a fire at a building
      in New Delhi, India. (AP)
    - Twelve people are killed and eight others are injured in an overnight fire at
      a nursing home in Anguruwatota, Sri Lanka. (AP)
    - Three people are killed when a Royal Navy AgustaWestland AW101 crashes into
      a field in Sourton, Devon, England. (BBC News) (ASN)
    - Local authorities report that more than 60 people are missing after a boat sank
      on the Aruwimi River the previous day in the Banalia Territory, Tshopo Province,
      DRC. (Radio Okapi in French)
    - 2026 Ebola epidemic
    - The DRC's public health ministry reports that 344 cases of the Ebola virus have
      been confirmed across three provinces. (Financial Times)
    - The U.S. state of Arizona reports its first death of the Sin Nombre strain of
      hantavirus pulmonary syndrome. (Forbes)
    - Agricultural minister John Steenhuisen announces that South Africa has approved
      vaccines for bird flu. (Business Day) (SA News)
    - Iran–Kuwait relations
    - Kuwait expels two Iranian diplomats, declaring them persona non grata, and summons
      Iran's acting chargé d'affaires to hand him a protest note over the recent attacks.
      (Reuters) (AA)
    - Ecuadorian conflict
    - Ecuadorian police discover the bodies of eight individuals missing since Sunday
      in plastic bags near Babahoyo, Los Ríos Province. (AFP via CBS News)
    - Murder of Natalie McNally
    - The Belfast Crown Court in Northern Ireland sentences Stephen McCullagh to 31
      years' imprisonment for the murder of his pregnant partner, Natalie McNally,
      after investigators determine that a gaming livestream presented as an alibi
      was pre-recorded before the killing. (AFP via The Manila Times)
    - Reactions to the 2026 Iran war
    - The U.S. House of Representatives votes 215–208 to pass a resolution to limit
      war powers and halt military operations in Iran following previous failed attempts.
      (Politico) (PBS)
    - Philippine senators end a gridlock after a quorum allows the election of senator
      Sherwin Gatchalian as Senate president pro tempore, while senators also reorganize
      committee leadership. (Rappler) (Reuters)
