Date: '2026-06-01'
Source_URI: Portal:Current events/2026 June 1
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Red Sea crisis, 2026 Strait of Hormuz crisis
  - Iran announces a pause on peace talks with the United States, and, alongside the
    Axis of Resistance, announces plans to "completely block" the Strait of Hormuz
    and threatens to close the Strait of Mandeb, ruling out any further talks until
    Israel ends its military operations in Lebanon and Gaza. (The Guardian) (CNBC)
  - Iranian parliamentary speaker and chief negotiator Mohammad Bagher Ghalibaf says
    that the U.S. naval blockade of Iran and the Israeli attacks on Lebanon are violations
    of the Iran–U.S. ceasefire agreement. (Al Jazeera)
  - Pakistan in the 2026 Iran war, Iran–Pakistan relations
  - Iranian foreign minister Abbas Araghchi asks Pakistani foreign minister and deputy
    prime minister Mohammad Ishaq Dar to help facilitate de-escalation and express
    concern about Israel's violations of the ceasefire in Lebanon. (AA) (Al Jazeera)
    (Radio Pakistan)
  - U.S. president Donald Trump says that ceasefire negotiations are still ongoing,
    contradicting reports of Iran backing out of talks. (The Hill)
  - 2026 Strait of Hormuz crisis
  - Iran–Japan relations
  - Iranian president Masoud Pezeshkian says that Iran will allow ships from Japan
    to pass the Strait of Hormuz. (Dawn)
  - Iran–Oman relations
  - Iranian deputy foreign minister Kazem Gharibabadi says that Iran and Oman are
    the only two countries with the right to "exercise sovereignty" over the Strait
    of Hormuz, and that Iran implemented a new process for controlling maritime traffic
    in coordination with Oman. (Al Jazeera)
  - 2026 Strait of Hormuz campaign
  - United States president Donald Trump says that Iran's pause on peace talks does
    not mean the U.S. will resume airstrikes, but the naval blockade will continue.
    (Al Jazeera)
  - Kuwait in the 2026 Iran war
  - The U.S. Central Command intercepts two Iranian ballistic missiles targeting the
    U.S. military base in Kuwait that the Islamic Revolutionary Guard Corps says was
    used for on attack on Bandar Sirik, Iran. (CNBC) (Al Jazeera)
  - The Islamic Revolutionary Guard Corps says that their naval forces have attacked
    the Panama-flagged "US-owned" container ship MSC Sariska in response to a alleged
    US attack on a Iranian ship in the Sea of Oman. (AA) (Gulf News) (ANI News)
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - 2026 Israel–Lebanon ceasefire
  - U.S. president Donald Trump says that Israel and Hezbollah have agreed to dial
    back on fighting after holding a call with Israeli prime minister Benjamin Netanyahu
    and Hezbollah. (PBS)
  - The U.S. Embassy in Beirut confirms that Hezbollah has accepted a proposal by
    the United States for a “mutual cessation of attacks" after Israel threatened
    Beirut with strikes on the eve of a fourth round of peace talks. (Reuters) (The
    Guardian)
  - The Lebanese government receives confirmation about Hezbollah’s agreement to a
    new ceasefire with Israel. (Times of Israel)
  - The Iranian military command warns residents of northern Israel to evacuate if
    the Israeli military strikes the Dahieh suburb of Beirut, Lebanon, in response
    to an Israeli evacuation order. (Al Jazeera)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - Oil prices increase by nearly 8% on the announcement of the peace talks ending,
    with West Texas Intermediate rising to US$94.20 per barrel and Brent Crude to
    US$97.23 per barrel. (CNBC)
  - Terminal 1 at Kuwait International Airport resumes operations as part of a phased
    reopening plan following repair, development, and upgrade works. Additionally,
    the airport resumes operations to Arab and foreign airlines after the airport
    has been closed since the war started on February 28. (Kuwait Times) (Arab Times
    Kuwait)
  - 2026 Cuban crisis
  - Canadian hotel operator Blue Diamond Resorts ends its operations in Cuba, citing
    reduced air service and operational challenges after managing 62 properties on
    the island. (AFP via Indo Premier)
  - Five employees are killed and two others are injured after an explosion at an
    aerospace plant owned by Hanwha Group in Daejeon, South Korea. (AP) (Reuters)
  - A British Army soldier is killed in an accident during a military training exercise
    in northern Iraq, according to the UK defence ministry. (BBC News)
  - Two people are hospitalized, livestock are killed and serious property damage
    is reported after a massive explosion at a fireworks factory in Magħtab, Malta.
    (The Jerusalem Post)
  - 2026 Central Africa Ebola epidemic
  - Gen Z protests
  - Youths gather in Nanyuki, Kenya to protest against the establishment of a quarantine
    center at the Laikipia Air Base for American citizens exposed to the Ebola virus.
    (AP)
  - The UAE Ministry of Foreign Affairs advises citizens and residents against traveling
    to South Sudan, Uganda, and the Democratic Republic of the Congo amidst the Ebola
    outbreak in these African countries. (Sudans Post)
  - Moderna announces that it will partner with the Coalition for Epidemic Preparedness
    Innovations (CEPI) to develop a vaccine for the Bundibugyo strain of the Ebola
    virus. (Reuters) (The Hill)
  - 2023–2026 mpox epidemic
  - Around 200 cases of mpox are reported in the Jebel Marra region of Darfur, Sudan.
    (Sudan Tribune) (Telegraph)
  - France–Russia relations
  - The French military, with military assistance from a Royal Navy warship, seizes
    a Russian shadow fleet tanker in international waters of the Atlantic Ocean. Russia
    says the "illegal" seizure was "bordering on international piracy". (BBC News)
  - United Kingdom–United States relations
  - The British Home Office announces that the United Kingdom has banned The Young
    Turks co-creator Cenk Uygur and American Twitch streamer Hasan Piker from entering
    the country. (The New York Times) (BBC News)
  - Murder of Henry Nowak
  - Vickrum Digwa, a 23-year-old Sikh man, is sentenced to life imprisonment, with
    a minimum of 21 years, for murdering 18-year-old university student Henry Nowak
    in Southampton, England, on 3 December 2025. Digwa's mother is also found guilty
    of assisting an offender by hiding the murder weapon, a knife. (The Guardian)
  - Bodycam footage is released showing police officers arresting Henry Nowak on the
    night of his death, with Nowak repeatedly heard telling the officers he had been
    stabbed and that he couldn't breathe before being handcuffed while on the ground
    on suspicion of assault. Vickrum Digwa is heard in the video calling Nowak a racist
    and claiming that Nowak has knocked his turban off. Nowak died from his wounds
    a short time later despite receiving first aid. (Sky News)
  - Flood control projects scandal in the Philippines
  - Philippine senator Jinggoy Estrada and former public works secretary Manuel Bonoan
    surrender to police after an anti-graft court orders their arrest on plunder charges
    related to an alleged ₱573-million (US$9.3-million) corruption scheme involving
    flood control projects. (Reuters) (Philippine Daily Inquirer)
  - Censorship in Malaysia
  - A ban on children aged under 16 using social media formally enters force in Malaysia.
    Companies that fail to comply with the new rules could face penalties of up to
    10 million ringgit ($2.5 million). (AP)
  - Multiple people are reportedly shot in an active shooter situation at a clinic
    in Pelican Narrows, Saskatchewan, Canada. The shooter fled on foot and is at large.
    (BNO News)
  - Florida Attorney General James Uthmeier announces that Florida has filed a lawsuit
    against OpenAI CEO Sam Altman and AI-chatbot ChatGPT, accusing the chatbot of
    putting profit over safety. This lawsuit is the first to be filed by a U.S. state
    against ChatGPT. (NPR)
  - 2026 Ethiopian general election
  - Ethiopians vote to elect the House of Peoples' Representatives amid continued
    tensions in Tigray and the ongoing Fano insurgency. (Al Jazeera) (AP)
