wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - Secretary-General Arsenio Dominguez says that the International Maritime Organization
      will pause an evacuation effort for 11,000 seafarers on stranded ships in the
      Strait of Hormuz after Iran objected to the plan and after a vessel was attacked
      near Oman. (Axios) (NBC News)
    - The Islamic Revolutionary Guard Corps Navy rejects United Nations-backed temporary
      shipping routes through the Strait of Hormuz proposed with Oman while negotiations
      continue over the waterway's future administration. (CNBC) (The Guardian)
    - Singapore-flagged container ship Ever Lovely is damaged after being struck by
      a unknown projectile off the coast of Oman, near Dahit in the Musandam Governorate.
      No casualties are reported. (The Edge Malaysia) (CNBC)
    - Omani foreign minister Badr bin Hamad Al Busaidi confirms that no transit fees
      would be imposed on ships using the Strait of Hormuz as part of future management
      of the waterway. (Arab News)
    - Two liquefied natural gas carriers from Qatar, the Marshall Islands-flagged
      Bu Samra bound for the Far East, and the Liberia-flagged Patris, transit through
      the Strait of Hormuz after being stranded for a period of time since the waterway
      was closed. (MENAFN)
    - 2026 Lebanon war
    - France–Italy relations, France–Lebanon relations, Italy–Lebanon relations
    - France and Italy agree to establish a multinational coalition to support Lebanon
      after the United Nations Interim Force in Lebanon ends its mission on 31 December
      2026. The initiative aims to strengthen Lebanon's armed forces and maintain
      international security support. (Xinhua)
    - Israel and Lebanon deny a claim from a United States official that some Israeli
      troops have been withdrawn from southern Lebanon as a goodwill gesture during
      their negotiations. (The Guardian)
    - Israeli defense minister Israel Katz says that the military will keep troops
      in occupied Lebanon, Syria, and Gaza in Palestine forever. (AA via Middle East
      Monitor)
    - Sudanese civil war
    - Darfur campaign, Darfur genocide
    - The International Organization for Migration reports that 1,430 people were
      displaced from five villages in Sudan's North Darfur state in a single day due
      to worsening insecurity. (AA)
    - Two people are killed and seven others are injured in a drone strike by the
      paramilitary group Rapid Support Forces on a fuel station in Rabak, White Nile.
      (AA via Middle East Monitor)
    - Mexican drug war
    - Three gunmen and a National Guard officer are killed in an attempted ambush
      on the outskirts of Acapulco, Guerrero. (Proceso in Spanish)
    - Patricia Negrete Tafoya, a madre buscadora, is shot dead upon leaving from work
      in Pénjamo, Guanajuato, marking the fifth killing of activists in the last four
      months. (La Jornada in Spanish)
    - Colombian conflict
    - Two police officers are killed and four others are others injured after FARC
      dissidents attack a police post in Calima, Valle del Cauca. (El Tiempo in Spanish)
    - France–Russia relations
    - French president Emmanuel Macron announces that the navy intercepted and boarded
      the Cameroon-flagged, Russia-linked oil tanker Deliver off the coast of Sicily,
      Italy, two days earlier. (The Moscow Times)
    - Economic impact of the 2026 Iran war
    - Economy of the United States
    - The Federal Reserve inflation rises to a three-year high in May. Additionally,
      the U.S. Department of Commerce reported a 4.1% increase in consumer prices
      driven by high gas prices, the largest since April 2023. (The New York Times)
    - 2026 Strait of Hormuz crisis
    - Reuters reports that, over the past week, crude oil shipments through the Strait
      of Hormuz have risen to their highest level since the start of the war, but
      traffic still remains a fraction of pre-war levels. (Al Jazeera) (Reuters)
    - 2026 United States wildfires
    - 2026 Utah wildfires
    - Utah governor Spencer Cox announces a state of emergency due to ongoing wildfires
      in the state, including the Cottonwood Fire. (Deseret News) (The Guardian)
    - 2026 Piła train collision
    - At least two people are injured after two trains collide near Piła, Poland.
      (TVP World)
    - 2026 Venezuela earthquakes
    - The confirmed toll of yesterday's earthquakes in Venezuela rises to 188 people
      killed, over 1000 people injured, and more than 36,000 others believed to be
      missing. (Al Jazeera) (Reuters)
    - Two people are killed and another is injured in a plane crash in Warsaw, Poland.
      (Caliber.az)
    - 2026 European heatwaves
    - A monitoring system in Spain estimates that a heat wave contributed to 212 deaths
      between Sunday and Wednesday. The country also records its highest average June
      temperatures since at least 1950. (AFP via New Straits Times)
    - Switzerland and the United Kingdom both record their hottest ever temperatures
      in June with a provisional high of 36.7°C (98.06F), recorded in Somerset, England,
      and a temperature of 38°C recorded by a weather station in Basel, Switzerland.
      (The Guardian)
    - Immigration detention in the second Trump administration
    - Florida governor Ron DeSantis confirms that the Alligator Alcatraz detention
      center in Ochopee, Florida, U.S., will close operations, a year after it opened.
      (AFP via The Straits Times) (Politico)
    - Somalia–United States relations
    - Abdikerm Abdelahi Eidleh, a central suspect in the Feeding Our Future child
      nutrition aid fraud scheme, is apprehended in Mogadishu, Somalia. The U.S. Federal
      Bureau of Investigation says he fled the country in 2022 and evaded prosecution
      for more than four years before his capture. (Al Jazeera) (AP via CNN) (CBS
      News)
    - Turkish police seize more than 10,000 historical artifacts during a raid on
      a residence in Istanbul and arrest two people in connection with an investigation
      into the alleged illegal possession of cultural property. (AFP via Arab News)
    - 2026 Cook Islands general election
    - King's Representative Tom Marsters dissolves the Parliament of the Cook Islands,
      setting an election for 12 August 2026. (Cook Islands News)
    - Corruption in Spain
    - In Spain, the Congress of Deputies approves a motion calling on the prime minister
      Pedro Sánchez to face a vote of confidence following the escalation of corruption
      cases involving his PSOE party and his family. (Reuters)
    - 2026 FIFA World Cup
    - Ivory Coast at the FIFA World Cup
    - In association football, Ivory Coast reaches the knockout stage of a FIFA World
      Cup for the first time after defeating Curaçao 2–0 to place second in Group
      E. (The Athletic via The New York Times)
