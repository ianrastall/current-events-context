Date: '2026-06-25'
Source_URI: Portal:Current events/2026 June 25
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - 2026 Strait of Hormuz campaign
  - Secretary-General Arsenio Dominguez says that the United Nations' International
    Maritime Organization will pause an evacuation effort for 11,000 seafarers on
    stranded ships in the Strait of Hormuz after Iran objected to the plan and after
    a vessel was attacked near Oman. (Axios) (NBC News)
  - The Islamic Revolutionary Guard Corps Navy rejects the UN- and Omani-proposed
    plan, stating that passage is only permitted through the routes approved by Iran,
    and that it will take action against ships violating instructions. (CNBC) (The
    Guardian)
  - Singapore-flagged container ship Ever Lovely is damaged after being struck by
    a unknown projectile off the coast of Oman, near Dahit in the Musandam Governorate.
    A United States official tells MS NOW that Iran was behind the attack. No casualties
    are reported. (The Edge Malaysia) (CNBC)
  - Omani foreign minister Badr bin Hamad Al Busaidi confirms that no transit fees
    would be imposed on ships using the Strait of Hormuz as part of future management
    of the waterway. (Arab News)
  - Two liquefied natural gas (LNG) carriers from Qatar, the Marshall Islands-flagged
    Bu Samra bound for the Far East and Liberia-flagged Patris, transit through the
    Strait of Hormuz after being stranded for a period of time since the waterway
    was closed. (Menafn)
  - 2026 Lebanon war
  - Israel and Lebanon deny a claim from a US official that some Israeli troops have
    been withdrawn from southern Lebanon as a goodwill gesture during their negotiations.
    (The Guardian)
  - Israeli defense minister Israel Katz says that the Israeli military will keep
    troops in Lebanon, Syria, and Gaza indefinitely. (AA via Middle East Monitor)
  - Sudanese civil war
  - Two people were killed and seven others were injured in a drone strike by the
    paramilitary group Rapid Support Forces on a fuel station in Rabak, White Nile
    in the southern region of Sudan. The Sudan Doctors Network confirms the attack
    in a statement. (AA via Middle East Monitor)
  - France–Russia relations
  - French president Emmanuel Macron announces that the French Navy intercepted and
    boarded the Cameroon-flagged, Russia-linked oil tanker Deliver off the coast of
    Sicily two days earlier. (The Moscow Times)
  - Economic impact of the 2026 Iran war
  - Economy of the United States
  - The Federal Reserve inflation rises to a three-year high in May. Additionally,
    the U.S. Department of Commerce reported a 4.1% increase in consumer prices driven
    by high gas prices, the largest since April 2023. (The New York Times)
  - 2026 Strait of Hormuz crisis
  - Reuters reports that over the past week crude oil shipments through the Strait
    of Hormuz have risen to their highest level since the start of the war, but traffic
    still remains a fraction of pre-war levels. (Reuters)
  - 2026 Venezuela earthquakes
  - The confirmed toll of yesterday's earthquakes in Venezuela rises to 188 people
    killed, over 1000 people injured, and more than 36,000 others believed to be missing.
    (Al Jazeera) (Reuters)
  - Two people are killed and another is injured in a plane crash in Warsaw, Poland.
    (Caliber.az)
  - At least two are injured after two trains collide near Piła, Poland. (TVP World)
  - 2026 European heatwaves
  - A monitoring system in Spain estimates that a heat wave contributed to 212 deaths
    between Sunday and Wednesday. The country also records its highest average June
    temperatures since at least 1950. (AFP via New Straits Times)
  - Corruption in Spain
  - The Congress of Deputies approves a motion calling on the Prime Minister Pedro
    Sánchez to face a vote of confidence following the escalation of corruption cases
    involving his ruling PSOE party and Sánchez's family. (Reuters)
