    internationally recognized border of Lebanon. (Al Jazeera) (NPR)
  - 2026 Lebanon war
  - 2026 Israel–Lebanon ceasefire
  - Secretary-General of Hezbollah Naim Qassem rejects a ceasefire without an Israeli
    withdrawal, saying that Hezbollah will fight as long as the occupation and attacks
    continue, and refuses disarmament. (Al Jazeera)
  - French president Emmanuel Macron says that France and the U.S. plan to establish
    a ceasefire coordination mechanism, and calls on Hezbollah to give up its weapons
