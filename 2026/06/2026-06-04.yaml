  - China–New Zealand relations, New Zealand–Taiwan relations
  - China imposes travel bans on New Zealand MPs Ingrid Leary, Laura McClure, Simon
    O'Connor, and Duncan Webb following a visit to Taiwan, prompting New Zealand's
    foreign ministry to reaffirm the country's One China policy. (AFP via UCA News)
  - Attempts to overturn the 2020 United States presidential election
