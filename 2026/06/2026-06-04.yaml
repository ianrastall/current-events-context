    (Times of Israel)
  - Somali Civil War
  - Constitutional crisis in Somalia, Controversies of Hassan Sheikh Mohamud
  - As clashes in Mogadishu that started yesterday continue, former prime minister
    Hassan Ali Khaire accuses de facto president Hassan Sheikh Mohamud of ordering
    a targeted military assault to eliminate opposition, while defence minister Ahmed
    Moalim Fiqi accuses both former president Sharif Sheikh Ahmed and Khaire of orchestrating
    a coup attempt to destabilise Somalia. (Garowe Online) (The New York Times)
  - Sudanese civil war
  - 2026 Blue Nile campaign
  - The Fourth Infantry Division of the Sudanese Armed Forces says that the army has
    repelled a major attack by the Rapid Support Forces and SPLM-N on the town of
    Al-Barka in the Blue Nile region in Sudan. (Sudan Tribune)
  - The Indonesian rupiah falls to its lowest recorded level against the United States
