  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - Islamic Revolutionary Guard Corps officer Esmail Qaani says that the ceasefire
    between Iran and the United States depends on the ceasefire in Lebanon, and that
