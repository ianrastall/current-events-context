wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - A United States Army AH-64 Apache helicopter crashes near the Strait of Hormuz
      while on patrol. Both crew members are rescued by an unmanned vessel. In response,
      the U.S. Central Command launches "self-defense" missile strikes at targets
      across Iran at 5 p.m. ET, with an American official claiming the helicopter
      was downed by an Iranian drone. (BBC News) (NBC News)
    - 2026 Lebanon war
    - Israel issues an evacuation warning for Tyre, Lebanon, after an Israeli airstrike
      there killed at least eight civilians and injured 32, violating the ongoing
      ceasefire. (The Guardian) (Al Jazeera)
    - Israeli troops kill one civilian in northern Israel, near the border of Israel
      and Lebanon. (Al Jazeera)
    - Russo-Ukrainian war
    - Kharkiv strikes
    - At least 10 people are killed and 106 others are injured in a Russian missile
      and drone attack on Kharkiv Oblast, Ukraine. (Kyiv Independent)
    - Sudanese civil war
    - Darfur campaign
    - The administration of the Rapid Support Forces in West Darfur accuses the Sudanese
      Army of destroying the Ardamata bridge in a drone strike in Geneina, Sudan.
      (Sudan Tribune)
    - Mexican drug war
    - A car bomb explodes in the city of Escuinapa de Hidalgo, leaving property damage
      also affecting the city's energy supply. There are no casualties reported in
      the attack. In the same city a ring of violence leaves four people dead including
      a minor. (Milenio Noticias) (Noroeste)
    - List of ongoing armed conflicts
    - A study published by the Journal of Peace Research, using data from the Uppsala
      Conflict Data Program at Uppsala University in Sweden, reports that 2025 saw
      65 active conflicts, the highest amount of conflicts between states since World
      War II and the highest amount of fatalities since the Rwandan genocide. (NPR)
      (JPR)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - The United States Energy Information Administration reports that Middle Eastern
      oil producers have reduced output by more than 11 million barrels per day, due
      to the Strait of Hormuz closure. (Al Jazeera)
    - The National Highway Traffic Safety Administration reports that Stellantis has
      recalled over 1 million Jeep Wrangler and Gladiator models from 2021 to 2025
      in the United States over fire concerns. (Reuters) (CBS News)
    - 2026 Mindanao earthquake
    - The death toll from yesterday's earthquake in Mindanao, Philippines, increases
      to 41 people killed, with 479 more injured and four missing. All casualties
      come from the Davao and Soccsksargen regions. (AFP via RFI) (The Guardian)
    - 2026 Johannesburg shooting
    - Twelve people are killed in a mass shooting in Johannesburg, South Africa. (BBC
      News)
    - 2026 Northern Ireland riots
    - Riots erupt in Belfast and Newtownards, Northern Ireland due to yesterday’s
      knife attack. (BBC)
    - Corruption in Sri Lanka
    - The Sri Lankan High Court sentences former deputy minister Sarana Gunawardena
      to 16 years' imprisonment after convicting him on corruption charges related
      to kickbacks from government procurement contracts. (AFP via The Manila Times)
    - Kidnapping and killing of Jee Ick-Joo
    - Philippine police arrest former superintendent Rafael Dumlao, who was convicted
      in the 2016 kidnapping and killing of South Korean businessman Jee Ick-Joo at
      Camp Crame and had been evading imprisonment. (AFP via The Straits Times)
    - War crimes during the Sudanese civil war
    - Victims of atrocities linked to the civil war in Sudan urges Kenya's Director
      of Public Prosecutions to approve charges against 10 members of the paramilitary
      group Rapid Support Forces, including some believed to reside in Kenya, making
      it the first war crimes complaint filed against the RSF outside of Sudan. (AP)
    - Three people are injured in a mass stabbing at a school in Blackley, Manchester,
      England. A 14-year-old student is arrested. (BBC News)
    - Artemis program
    - NASA announces that its astronauts Randy Bresnik, Frank Rubio, and Andre Douglas,
      and ESA astronaut Luca Parmitano will crew the Artemis III mission in late 2027.
      The mission's goal is to evaluate rendezvous and docking operations with SpaceX's
      Starship HLS and Blue Origin's Blue Moon spacecraft. (NBC News)
