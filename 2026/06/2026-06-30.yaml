Date: '2026-06-30'
Source_URI: Portal:Current events/2026 June 30
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - The Qatari foreign ministry confirms that United States envoys Jared Kushner and
    Steve Witkoff have arrived in Doha for technical indirect talks with Iran and
    talks with mediators regarding negotiations with Iran. However, they also state
    that no high-level talks have occurred. (BBC News) (QNA) (The Times of Israel)
  - 2026 Strait of Hormuz crisis
  - South Korean president Lee Jae Myung says that all but two Korean vessels have
    successfully transited through the Strait of Hormuz after previously being stranded
    in the waterway amidst the war. (The Korea Times) (Korea Herald)
  - Gaza war
  - The Israel Hayom newspaper reports that the Board of Peace will begin managing
    humanitarian shelter centers in areas of the Gaza Strip not under Hamas control.
    (AA)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war
  - Ukrainian forces launch a major drone attack on Moscow Oblast, Russia, striking
    the Dubna Space Communications Center to the north of Moscow. Russian authorities
    say a Ukrainian drone struck a residential building in Yegoryevsk, killing an
    infant, while another drone strike reportedly kills a 61-year-old woman in Tver
    Oblast. (CNN)
  - Somali Civil War
  - Turkish involvement in the Somali civil war
  - Somalia's defence ministry says a Turkish F-16 conducted an airstrike in the Godey
    area of Lower Shabelle region, South West State, killing 35 Al-Shabaab and injuring
    more than 20 other. (Hiiraan Online) (Somali Guardian)
  - Sudanese civil war
  - Sudan's army says that it has destroyed two tanks and 224 combat vehicles used
    by Rapid Support Forces and seized 36 others in two weeks of military operations
    including in Blue Nile State and the Darfur and Kordofan regions. (AA)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - CNBC reports that the Brent Crude oil price declined by 21% during June 2026,
    its largest monthly decline since March 2020, amidst the ongoing negotiations
    between Iran and the United States. (CNBC)
  - Mexico–United States relations, Mexican drug war
  - The U.S. treasury department announces sanctions on two men and nine companies
    accused of being involved in transportation, financial services, and real estate
    for the Jalisco New Generation Cartel. (AFP via France 24) (AP)
  - A truck veers off a road in River Nile State, Sudan, and collides with a passenger
    vehicle, killing 18 people and wounding another. (Xinhua)
  - Five people are killed and fifteen others missing after monsoon rains cause a
    jade mine to collapse in Kachin State, Myanmar. (AFP via The Hindu)
  - At least 14 schoolchildren are killed and eight others are hospitalized after
    the roof of an under-construction tutoring center collapses in Lahore, Pakistan.
    (AP)
  - Nine children are killed when a motorized tricycle plunges into a canal in Abu
    Tig, Asyut Governorate, Egypt. (AP)
  - At least 24 people are killed in floods and landslides caused by torrential rain
    in Accra, Ghana, and Abidjan, Ivory Coast. (AP)
  - 2026 European heatwaves
  - Hungary and Slovakia set national temperature records during a central European
    heat wave, reaching and respectively, as some municipalities impose water restrictions
    and tank trucks supply areas facing water scarcity. (AFP via CNA)
  - Cabinet of Lee Jae Myung
  - The South Korean National Assembly approves the nomination of Han Seong-sook as
    the country's new prime minister, succeeding Kim Min-seok, as well as the country's
    first female prime minister in 20 years. The main opposition People Power Party
    boycotted the vote. (Yonhap News Agency)
  - Corruption in the Philippines
  - More than 14,000 people participate in rallies organized by the Iglesia ni Cristo
    (INC) in Metro Manila, Philippines, mainly to support senator and INC member Rodante
    Marcoleta who is under investigation for plunder. Five people are arrested at
    the People Power Monument in Quezon City and three police officers are injured.
    (AFP via France 24) (Manila Bulletin) (Philippine Daily Inquirer)
  - Second presidency of Donald Trump
  - Deportation in the second Trump administration
  - A coalition of human rights lawyers file a lawsuit against Ghana at the ECOWAS
    Court of Justice, accusing the country of violating non-refoulement by accepting
    deportees from the U.S. and forcing them back to the home countries they had fled.
    (Al Jazeera) (AP)
  - Trump v. Barbara
  - The Supreme Court of the United States rules 6–3 that president Donald Trump's
    executive order restricting birthright citizenship violates the 14th Amendment,
    with chief justice John Roberts writing that citizenship "was the right to have
    rights." (AP) (Reuters)
  - Chromebook procurement scandal
  - Former Indonesian education minister Nadiem Makarim, who co-founded the super
    app Gojek, is sentenced to 10 years in prison for corruption. (BBC News)
  - Human rights in Kenya
  - One person is killed and two others are injured when Kenyan police open fire during
    a protest in Mathare, Nairobi, against reported abductions, according to witnesses,
    amid concerns over security abuses. (Reuters)
  - Ford issues a recall order of over 741,000 vehicles, mainly F-150, Explorer, Expedition,
    Lincoln Aviator, and Navigator models, in the U.S. due to a transmission issue
    that may damage the park system. (AP) (Reuters)
