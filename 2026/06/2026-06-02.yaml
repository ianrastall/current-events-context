wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain, Kuwait in the 2026 Iran war
    - The U.S., Bahraini, and Kuwaiti militaries intercept ballistic missiles and
      drones fired by the Islamic Revolutionary Guard Corps at U.S. military bases
      in Bahrain and Kuwait after a U.S. "self-defense" strike on Iran's Qeshm Island.
      (Al Jazeera) (The Warzone)
    - The Islamic Revolutionary Guards Corps Navy coordinates the passage of 24 commercial
      ships through the Strait of Hormuz over the past day after they obtained permission.
      (Al Jazeera)
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - U.S. Secretary of State Marco Rubio in a Congress testimony says that Iran has
      agreed to negotiate aspects of its nuclear program despite pausing peace talks
      and closing the Strait of Hormuz. (The Guardian)
    - U.S. president Donald Trump and U.S. Secretary of State Rubio says that ceasefire
      talks are ongoing, contradicting Iranian media statements. (CNBC)
    - Iraq in the 2026 Iran war, Disarmament of Iraqi militias
    - The Iran-backed militia groups Asaib Ahl al-Haq and Imam Ali Brigades say that
      they will hand their weapons to the Iraqi government. However, Kataib Hezbollah
      and Harakat Hezbollah al-Nujaba reject an offer and will keep theirs. (Al Arabiya)
      (AP)
    - The U.S. Central Command says that a fighter jet has fired a Hellfire missile
      to disable the Botswana-flagged oil tanker M/T Lexie as it was transiting towards
      Kharg Island. (AA) (The Hill)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Israel accuses Hezbollah of violating the ceasefire negotiated yesterday by
      launching drones and missiles. (Al Jazeera)
    - Israeli airstrikes are reported in Nabatieh, in other towns of the Nabatieh
      District, and in the Tyre District, Lebanon, in violation of an ongoing ceasefire.
      (Al Jazeera)
    - Lebanon's health ministry updates the toll from yesterday's Israeli airstrike
      near a hospital in Tyre to at least four people killed and 127 wounded, including
      39 health workers. (Al Jazeera)
    - Gaza war
    - Gaza Strip under Hamas
    - Hamas reaffirms that it is ready to hand control of governance of the Gaza Strip.
      (Bastille Post)
    - Gaza health officials say that Israeli fire has killed four Palestinians. (Middle
      East Eye)
    - Russo-Ukrainian war
    - Kyiv strikes
    - A series of Russian airstrikes across Ukraine, including the cities of Kyiv
      and Dnipro, kill at least 23 people and injure more than 100 others. Mayor of
      Kyiv Vitali Klitschko reports power outages and a fire in the Podil district
      on a non-residential property and nine-story apartment building. (AFP via Kyiv
      Independent) (Reuters)
    - War against the Islamic State
    - Iraqi insurgency
    - Popular Mobilization Forces in Nineveh announce that three Islamic State suspects
      have been killed during a military operation in the Al-Ba'aj District. (Shafaq)
    - Economic impact of the 2026 Iran war
    - Bloomberg reports that Russia's exports of crude oil have reached their highest
      level since before the 2022 invasion of Ukraine during 2026, with the country
      benefiting from the overall rise in oil prices amidst the Iran war fuel crisis.
      (Bloomberg) (OilPrice.com)
    - 2026 Angeles City building collapse
    - Seven more bodies are retrieved from the collapsed under-construction building
      in Angeles, Philippines, raising the death toll to 21. (Philippine Daily Inquirer)
      (GMA News)
    - 2026 Pacific typhoon season
    - At least 15 people are injured as Tropical Storm Jangmi brings heavy rainfall,
      lanslides, floods, and strong winds from Kyushu and the Okinawa Islands to the
      Greater Tokyo Area in Japan, prompting evacuation advisories for more than 800,000
      residents. (AFP via CNA) (Kyodo News)
    - List of earthquakes in Poland
    - A magnitude 3.5 earthquake struck the Silesian Voivodeship, Poland. The epicenter
      was located approximately 8 kilometers southeast of Gliwice. The quake was felt
      across a large area of the Silesian metropolitan area. (TwojaPogoda.pl)
    - Fifteen people are killed and 25 others severely injured after two vehicles
      collide head-on in the Volta Region, Ghana. (Xinhua)
    - Eleven people are killed after a landslide at an illegal mining site in Vatomandry,
      Madagascar. (Xinhua)
    - Eight people are killed and 16 others injured after a vehicle veers off a mountain
      road and plunges into a deep ravine in Parwan Province, Afghanistan. (Xinhua)
    - Seven people are killed while two others are injured when a tricycle is hit
      by an SUV attempting to overtake a coaster bus in San Juan, Batangas, Philippines.
      (The Philippine Star)
    - Six children are killed and one injured after the roof of a mud house collapses
      in Shangla District, Pakistan. (Dawn)
    - 2026 Ebola epidemic
    - A court in Kenya blocks the U.S. from opening a new Ebola quarantine facility
      in the country for three weeks amidst protests that broke out against the facility
      in which two people were killed. (Reuters)
    - U.S Secretary of State Rubio says the United States will reengage with GAVI
      amidst the Ebola outbreak. (Irish Independent)
    - Reactions to the 2026 Iran war
    - Bahrain–Iran relations, Bahrain–Iraq relations
    - The Bahraini interior ministry bans its citizens from traveling to Iran or Iraq
      due to "the ongoing tension in the current security situation." (Al Jazeera)
    - Cambodian–Thai border dispute
    - Cambodia initiates a compulsory conciliation process under the United Nations
      Convention on the Law of the Sea to address its maritime boundary dispute with
      Thailand in the Gulf of Thailand. (Reuters)
    - Hungary–Ukraine relations
    - Politico reports that Hungary will abandon its opposition to Ukraine joining
      the European Union ahead of the upcoming EU conference in Luxembourg after previously
      blocking it from doing so under former prime minister Viktor Orbán. (The New
      Voice of Ukraine) (Politico EU)
    - Murder of Henry Nowak
    - Protesters clash with police in Southampton, England, as thousands gather to
      protest against the murder of 18‑year‑old university student Henry Nowak. (BBC
      News)
    - The Independent Office for Police Conduct confirms it has launched an investigation
      into police handling of the incident. (BBC News)
    - Xenophobia in South Africa
    - Mozambique reports that five of its nationals were killed during anti-immigration
      violence in Mossel Bay, Western Cape, South Africa, over the weekend. (Reuters)
    - Impact of the 2026 Iran war on Iran
    - State funeral of Ali Khamenei
    - Iranian officials and state media announce a three-day funeral plan in the cities
      of Mashhad, Tehran, and Qom for former supreme leader Ali Khamenei, who was
      killed during the initial phase of the Israeli–US airstrikes on his compound.
      (The New York Times) (Shafaq) (Iran International)
    - 2026 Bolivian protests
    - Bolivian defense minister Marcelo Salinas and education minister Beatriz García
      resign amid ongoing anti-government protests, becoming the highest-ranking officials
      to leave President Rodrigo Paz's administration since the protests began. (Reuters)
    - Flamingo Revolution
    - Thousands of people gather in Tirana, Albania, to protest against a development
      planned by Jared Kushner on the Adriatic coast that would intrude on environmentally
      protected areas of the Vjosa-Narta regions. (The Independent)
    - The Philippine House of Representatives votes 265–14 with eight abstentions
      to expel Cavite 4th district representative Kiko Barzaga over "disruptive" and
      "disorderly" behavior following two prior suspensions. Barzaga is the third
      representative in Philippine history to have been expelled. (Gulf News) (Philippine
      Daily Inquirer)
