wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - The Islamic Revolutionary Guard Corps says that they have attacked the U.S.
      Fifth Fleet in Bahrain in retaliation for yesterday's strikes by the United
      States, accusing the U.S. of attacking a water plant and telecommunications
      mast in Sirik. (AFP via Philippine Daily Inquirer) (The Times of Israel)
    - 2026 Iranian strikes on Jordan
    - The Jordanian military says that it has successfully intercepted five missiles
      from Iran in the Azraq area of the Zarqa Governorate, Jordan, in which Iran
      said that it has targeted the Muwaffaq Salti Air Base. No casualties or material
      damage is reported. (Asharq Al-Awsat) (ANI)
    - 2026 Iranian strikes on Kuwait
    - Kuwait's army general staff says that its army air defense systems intercepted
      "hostile" aerial targets. (AA) (Kuwait Times)
    - The United States Central Command launches a second round of airstrikes on targets
      throughout Iran. Additionally, CENTCOM released video footage of the strikes
      on their website and X. (Al Jazeera) (India Today) (CENTCOM)
    - U.S. president Donald Trump tells a Fox News reporter from the White House Situation
      Room that the bombing will stop shortly. (NBC News)
    - 2026 Lebanon war
    - Israeli airstrikes kill at least 12 people and injure 13 across southern Lebanon,
      including two paramedics. (Al Jazeera)
    - Russo-Ukrainian war
    - Odesa strikes
    - Two merchant ships operated by Barbados and Panama in Ukraine's Black Sea shipping
      corridor sustain damage and fire during reported drone attacks near Odesa. No
      injuries are reported. (Reuters)
    - Sudanese civil war
    - Kordofan campaign
    - Four people are killed and 12 others are injured in a drone strike by the Rapid
      Support Forces in civilian areas across El-Obeid, North Kordofan, including
      a cemetery during a funeral procession and fuel station. (AA)
    - 2026 Afghanistan–Pakistan war
    - The Pakistani military conducts airstrikes along the Afghanistan-Pakistan border
      targeting alleged TTP militants. The Afghan government reports that 13 civilians,
      including 11 children, are killed, while Pakistan claims the killing of 26 militants.
      (Reuters)
    - Communal conflicts in Nigeria
    - Three people are killed in an attack on a secondary school and its surrounding
      community in Kogi State, Nigeria, where security forces repelled the assailants
      after a shootout and launched operations to locate those who escaped. (Reuters)
    - Mexican drug war
    - Five state troopers are killed and five more wounded in an ambush by suspected
      Jalisco New Generation Cartel gunmen near the town of Mojonera, Nahuatzen, Mexico.
      (El Financiero)
    - Visit by Pope Leo XIV to Spain
    - Pope Leo XIV blesses and inaugurates the Tower of Jesus Christ at the Sagrada
      Família in Barcelona, Spain, coinciding with the centenary of the death of its
      architect Antoni Gaudí, during his visit to the country. (Reuters)
    - Economy of Sudan
    - The value of the Sudanese pound plunges to a record-low against other foreign
      currencies amidst the ongoing civil war in the country. (Sudan Tribune)
    - A Pakistan Army Mil Mi-17 helicopter crashes during takeoff near Muzaffarabad,
      Azad Kashmir, killing all 22 personnel on board. The military attributes the
      crash to a technical fault. (Reuters)
    - A minibus carrying schoolchildren catches fire in Gweru, Zimbabwe, killing seven
      people. ZBC confirms that all of the dead are children, while the driver and
      conductor are both being treated in hospital. (AP)
    - 2026 Ebola epidemic
    - The Democratic Republic of the Congo's Ebola outbreak spreads to the Tchomia
      health zone in Ituri Province, with the health ministry reporting 37 new confirmed
      cases and 12 deaths. The outbreak has recorded 635 confirmed cases and 127 deaths
      across three provinces. (Reuters)
    - 2026 Northern Ireland riots
    - Police use water cannons as anti-migrant rioting continues for a second day
      in Belfast, Northern Ireland. (BBC News)
    - An Indonesian military court sentences four soldiers to prison terms of up to
      three years for a premeditated acid attack on activist that left him blind in
      one eye. Two of the convicted soldiers are dismissed from military service.
      (AFP via CNA)
    - 2026 Colombian presidential election
    - An investigatory commission in the Chamber of Representatives proposes to suspend
      the powers of Colombian president Gustavo Petro until election day on 21 June
      2026. (CNN in Spanish) (Reuters)
    - Prevalence of female genital mutilation
    - The Senate of Colombia approves legislation prohibiting female genital mutilation,
      which continues in some Indigenous communities. If President Petro approves
      the measure, it would make Colombia the first Latin American country to enact
      such a ban. (AFP via The Hindu)
    - Protests against the 2026 Iran war
    - Hundreds of people rally in Hezbollah strongholds in southern suburbs of Beirut,
      Lebanon, in support of Iran and its allies during the war. Additionally, the
      Al-Masirah, a TV channel run by the Houthis, reports a similar gathering in
      Sanaa, Yemen. (AFP via Arab News)
    - Chinese scientists discover the largest known whale graveyard in the Indian
      Ocean, identifying nearly 500 whale skeletons spanning millions of years and
      documenting deep-sea ecosystems associated with the remains. A new species,
      Pterocetus diamantinae named after the location, was also discovered. (AFP via
      France 24) (The Guardian)
    - Maritime Launch Services test-launches its first Barracuda hypersonic rocket
      from Canso, Nova Scotia, Canada, but falls short of reaching the Karman Line.
      (The Globe and Mail)
    - 2026 NBA Finals
    - In basketball, the New York Knicks rally from a 29-point deficit to beat the
      San Antonio Spurs 107–106 in Game 4, taking a 3–1 series lead in the NBA Finals
      after OG Anunoby tipped in the game-winning basket with 1.2 seconds remaining.
      The comeback is the largest in NBA Finals history, surpassing the Boston Celtics'
      24-point comeback in Game 4 of the 2008 finals. (BBC Sport) (ESPN) (Sportsnet)
