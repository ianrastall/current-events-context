Date: '2026-06-10'
Source_URI: Portal:Current events/2026 June 10
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on Bahrain
  - The Islamic Revolutionary Guard Corps says that they have attacked the U.S. Fifth
    Fleet in Bahrain in retaliation for yesterday's strikes by the United States,
    accusing the U.S. of attacking a water plant and telecommunications mast in Sirik.
    (AFP via Philippine Daily Inquirer) (The Times of Israel)
  - 2026 Iranian strikes on Jordan
  - The Jordanian military says that it has successfully intercepted five missiles
    from Iran in the Azraq area of the Zarqa Governorate, Jordan, in which Iran said
    that it has targeted the Muwaffaq Salti Air Base. No casualties or material damage
    is reported. (Asharq Al-Awsat) (ANI)
  - 2026 Iranian strikes on Kuwait
  - Kuwait's army general staff says that its army air defense systems intercepted
    "hostile" aerial targets. (AA) (Kuwait Times)
  - The United States Central Command launches airstrikes on targets throughout Iran.
    (Al Jazeera)
  - 2026 Lebanon war
  - Israeli airstrikes kill at least 12 people and injure 13 across southern Lebanon,
    including two paramedics. (Al Jazeera)
  - Russo-Ukrainian war
  - Odesa strikes
  - Two merchant ships operated by Barbados and Panama in Ukraine's Black Sea shipping
    corridor sustain damage and fire during reported drone attacks near Odesa. No
    injuries are reported. (Reuters)
  - Sudanese civil war
  - Kordofan campaign
  - The Sudan Doctors Network reports that four people have been killed and 12 others
    were injured in a drone strike by the Rapid Support Forces in civilian areas across
    El-Obeid, North Kordofan, including a cemetery during a funeral procession and
    fuel station. (AA)
  - 2026 Afghanistan–Pakistan war
  - The Pakistani military conducts airstrikes along the Afghanistan-Pakistan border
    targeting militants belonging to the Tehreek-e-Taliban Pakistan (TTP) following
    cross-border attacks. Taliban government spokesperson Zabihullah Mujahid states
    that 13 civilians, including 11 children, were killed. Pakistan's Information
    Minister Attaullah Tarar claims the precision strikes targeted and killed 26 militants.
    (Reuters)
  - Communal conflicts in Nigeria
  - Three people are killed in an attack on a secondary school and its surrounding
    community in Kogi State, Nigeria, where security forces repelled the assailants
    after a shootout and launched operations to locate those who escaped. (Reuters)
  - 2026 Northern Ireland riots
  - Police use water cannons as anti-migrant rioting continues for a second day in
    Belfast, Northern Ireland. (BBC News)
  - Pope Leo XIV blesses and inaugurates the Tower of Jesus Christ at the Sagrada
    Família in Barcelona, Spain, coinciding with the centenary of the death of its
    architect Antoni Gaudí, during his visit to the country. (Reuters)
  - Economy of Sudan
  - The amount of the Sudanese pound plunges to a record-low against other foreign
    currencies amidst the ongoing civil war in the country. (Sudan Tribune)
  - A Pakistan Army Mil Mi-17 helicopter crashes during takeoff near Muzaffarabad,
    Azad Kashmir, killing all personnel on board. The military attributes the crash
    to a technical fault. (Reuters)
  - A minibus carrying schoolchildren catches fire in Gweru, Zimbabwe, killing seven
    people. ZBC confirms that all of the dead are children, while the driver and conductor
    are both being treated in hospital. (AP)
  - 2026 Colombian presidential election
  - An investigatory commission in the Chamber of Representatives proposes to suspend
    the powers of Colombian president Gustavo Petro until election day on 21 June
    2026. (CNN in Spanish) (Reuters)
  - Chinese scientists discover the largest known whale graveyard in the Indian Ocean,
    identifying nearly 500 whale skeletons spanning millions of years and documenting
    deep-sea ecosystems associated with the remains. (AFP via France 24) (The Guardian)
