wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Iranian deputy foreign minister Kazem Gharibabadi confirms that a deal between
      Iran and the United States has been reached to end the war and that the U.S.
      blockade will end beginning tonight. (The Times of Israel)
    - 2026 Strait of Hormuz crisis
    - Indian Petronet liquefied natural gas tanker Disha crosses the Strait of Hormuz,
      the only known ship to pass since the announcement of the peace deal. (Al Jazeera)
    - 2026 Lebanon war, Israeli invasion of Syria, Gaza war
    - Israeli prime minister Benjamin Netanyahu and defense minister Israel Katz say
      that Israel will not withdraw its troops from Lebanon, Syria, or the Gaza Strip.
      (Al Jazeera)
    - Russo-Ukrainian war
    - Kyiv strikes
    - Ukrainian culture during the Russian invasion of Ukraine
    - The Dormition Cathedral in Kyiv Pechersk Lavra is heavily damaged and set ablaze
      during Russian strikes in Kyiv, Ukraine, killing nine people, including five
      rescue workers attending fires set by strikes in Kharkiv. (BBC News)
    - The Dovzhenko Film Studios in Kyiv are attacked. (UNN)
    - Economic impact of the 2026 Iran war
    - The United States Department of Energy reports that the Strategic Petroleum
      Reserve has fallen to its lowest level since 1983, after a decline of 9 million
      barrels per week during the Iran war. (CNBC)
    - 2026 United States Air Force Boeing B-52 crash
    - A B-52 Stratofortress crashes shortly after takeoff at Edwards Air Force Base
      in Kern County, California, United States, killing eight. (ABC News)
    - Thirty-one people are killed after a bus plunged into a ravine in Amhara Region,
      Ethiopia. (AP News)
    - Two Pakistani Air Force pilots are killed when a trainer aircraft crashes near
      Mardan city in Khyber Pakhtunkhwa. (Gulf Today)
    - 52nd G7 summit
    - The 52nd G7 summit is held at Évian-les-Bains in Haute-Savoie, France. Évian
      becomes the first area to host a G7 or G8 summit twice, previously hosting the
      G8 summit in 2003 during the beginning of the Iraq War. (Al Jazeera) (Reuters)
    - Suspicious Russia-related deaths since 2022
    - ', a Russian artist and activist who criticized Russian president Vladimir Putin
      and Chechen Republic head Ramzan Kadyrov, is shot dead in Biała Podlaska, Poland.
      (The Guardian)'
    - British prime minister Keir Starmer announces a ban on social media for children
      under 16. (The Guardian) (The New York Times)
    - Norwegian royal family relative Marius Borg Høiby is convicted of two counts
      of rape and sentenced to four years in prison. (BBC News)
    - Elections in Palestine
    - Palestinian president Mahmoud Abbas issues a decree scheduling legislative elections
      for November, the first since 2006, and presidential elections for early 2027,
      the first since 2005. (AFP via Arab News Japan)
    - Hungary's parliament approves a constitutional amendment limiting prime ministers'
      terms to a maximum of eight years in office. Legislators also remove a constitutional
      provision linked to the planned dissolution of the Sovereignty Protection Office
      established under Viktor Orbán. (AFP via Le Monde) (Reuters)
    - 2026 FIFA World Cup
    - 2026 FIFA World Cup controversies
    - 2026 Iranian diaspora protests, Iran at the FIFA World Cup
    - Iranian Americans hold protests outside SoFi Stadium in Inglewood, California,
      against the Iran regime and the team's participation in the FIFA World Cup ahead
      of its matchup against New Zealand. Additionally, protesters are seen with the
      Iranian Lion and Sun flag despite FIFA banning the flag from appearing at matches.
      (AFP via Barron's) (Seattle Times) (KNBC)
    - Cape Verde at the FIFA World Cup
    - In association football, debutants Cape Verde earn their first-ever World Cup
      point after drawing 0–0 with Spain. (BBC Sport) (CAF)
    - Deaths of Divine Adili and Rene Baterbonia
    - The Ateneo de Manila University in Quezon City, Philippines, accepts the resignation
      of men's basketball coach Tab Baldwin following the fatal drowning of two players
      during a team activity. The university and Philippine authorities continue separate
      investigations into the incident. (The New Zealand Herald) (RNZ)
