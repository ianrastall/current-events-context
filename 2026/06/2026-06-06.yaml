wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - Pakistani interior minister Mohsin Naqvi visits Tehran to talk with Iranian
      authorities, including foreign minister Abbas Araghchi, regarding ending the
      war. (AA)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - United States Central Command forces attack surveillance sites on Iran's Qeshm
      Island after the Islamic Revolutionary Guard Corps fired at four tankers attempting
      to cross the Strait of Hormuz without coordinating with it. (Al Jazeera)
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - The Bahraini army intercepts three Iranian missiles and several drones launched
      against Bahrain. (Al Jazeera)
    - 2026 Iranian strikes on Kuwait
    - The Kuwaiti defense ministry says that the military intercepted seven Iranian
      ballistic missiles fired at the country. (Al Jazeera)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - At least ten people, including three Lebanese soldiers, one of whom is a brigadier
      general, are killed by Israeli airstrikes on approximately 150 Hezbollah-linked
      sites across southern Lebanon over two days, including weapon storage areas,
      command centers, rocket launchers, and other military infrastructure. (AFP via
      Al Arabiya) (Al Jazeera)
    - The Israeli military announces that it is investigating the incident that killed
      three Lebanese troops. (Al Jazeera)
    - Gaza war
    - Gaza peace plan
    - Hamas meets with mediators and Palestinian factions in Cairo, Egypt, to discuss
      implementing the first phase of the ceasefire signed in October 2025 and arrangements
      for the second phase. (AA)
    - Mali War
    - 2026 Mali offensives
    - Al-Qaeda-linked armed group Jama'at Nusrat al-Islam wal-Muslimin releases a
      propaganda video of the 25 April 2026 attacks on Mali against a Malian Army
      camp and Sevaré airport in Mali's Mopti region. (Africanews)
    - Sudanese civil war
    - Kordofan campaign
    - A drone strike hits a market in the Abu Zaeima area of Hamrat Al Sheikh in North
      Kordofan, Sudan, killing 11 people. (AA) (Hindustan Times)
    - Lebanon inaugurates its second international airport, the Rene Mouawad Airport,
      amidst the ongoing fighting between Israel and Hezbollah and the war in the
      country. (The New Arab)
    - Three people are killed and two more injured after the collapse of a building
      caused by the explosion of a gas cylinder in Porto Sant'Elpidio, Province of
      Fermo, Italy. (Il Messaggero)
    - A 35-year-old man is killed in a shark attack off Michaelmas Island in Western
      Australia while spearfishing with his family. A 4.5 metre shark of an unknown
      species was spotted in the area around the same time. (Sky News)
    - 2026 Bangladesh measles outbreak
    - The Directorate General of Health Services reports that three children have
      died from measles in Bangladesh in the past 24 hours. (BSS News)
    - 2026 Ebola epidemic
    - The American physician who contracted Ebola in the Democratic Republic of the
      Congo is discharged from the Charité hospital in Berlin, Germany. (The Independent)
    - Visit by Pope Leo XIV to Spain
    - Pope Leo XIV begins his six-day apostolic visit to Spain, marking the first
      papal visit to the country in 15 years. (AP)
    - 2025–2026 Iranian protests
    - High school students in Iran hold protests in 20 Iranian provinces over the
      country's education policies, final exam rules and changes affecting the admission
      policies of universities. (The Times of Israel) (Iran International)
    - 2026 Armenian parliamentary election
    - Armenia's investigative authority arrests six candidates from the opposition
      Strong Armenia party a day before the election after the Central Election Commission
      authorized criminal proceedings against them. (Reuters)
    - Lithuania's ruling Social Democratic Party votes to remove Dawn of Nemunas (NA)
      from the governing coalition and seeks to replace it with the Union of Democrats
      "For Lithuania", following disputes involving NA leader Remigijus Žemaitaitis
      and coalition policy disagreements. (Reuters)
    - 2026 South Korean local election rerun protests
    - Protests following the ballot paper shortages that disrupted some of the Voters'
      voting during the 2026 South Korean local elections spread to different parts
      of the country including Daejeon, Busan, and Gwangju. (Reuters)
    - 2026 WTA Tour
    - 2026 French Open
    - In tennis, Mirra Andreeva wins her first major title after defeating Maja Chwalińska
      in the women's singles final in two sets, 6–3, 6–2. (CNN)
    - 2026 Belmont Stakes
    - American thoroughbred race horse Golden Tempo wins the 158th Belmont Stakes,
      five weeks after winning the 152nd Kentucky Derby. Thoroughbred racehorse trainer
      Cherie DeVaux becomes the second female trainer to train a winner in the third
      leg of the Triple Crown. (CBS News) (CNBC)
    - 2026 FIFA World Cup
    - 2026 FIFA World Cup controversies
    - Several members from Iran, Iraq, and Somalia, along with international sports
      delegations including referee Omar Abdulkadir Artan, are denied visas and blocked
      from entering the United States for the FIFA World Cup. (AFP via France 24)
      (BBC Sport) (The Guardian)
