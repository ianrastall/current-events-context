Date: '2026-06-16'
Source_URI: Portal:Current events/2026 June 16
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war, 2026 Lebanon war
  - 2025–2026 Iran–United States negotiations
  - Hezbollah states that it received assurances from Iran that the withdrawal of
    Israeli troops from occupied southern Lebanon will be a demand in the next phase
    of negotiations with the United States, before any deal about Iran's nuclear program.
    (Al Jazeera)
  - The Iranian military says that Israel has violated the the ceasefire in Lebanon
    84 times since the Iran–US agreement was announced. (Al Jazeera)
  - Iranian foreign minister Abbas Araghchi says that the continued Israeli occupation
    of Lebanon would be a violation of the Iran–US agreement. (AP)
  - 2026 Lebanon war
  - Israeli airstrikes kill at least four people across southern Lebanon. (AFP via
    BSS News) (Al Jazeera)
  - 2026 English Channel incident
  - The Russian frigate Admiral Grigorovich fires warning shots at a yacht in the
    English Channel between Normandy and the Isle of Wight. (BBC News)
  - Economic impact of the 2026 Iran war
  - The CEO of Mitsui O.S.K. Lines, world's largest operator of tanker ships, says
    that it will take weeks to restore normal traffic through the Strait of Hormuz.
    (Reuters)
  - The Bank of Japan raises its interest rate to 1% from 0.75%, the highest level
    since 1995. (BBC News)
  - One person is killed and 38 others are injured when a earthquake strikes Palu,
    Central Sulawesi, Indonesia. (Detik.com) (The Washington Post)
  - At least nine people are killed, including two children, and 25 others are injured
    when a freight train collides with a bus in Triangle, Masvingo, Zimbabwe. (AP)
  - One person is killed and four others are injured when a earthquake strikes Da
    Qaidam, Haixi, Qinghai, China. (USA Today) (Xinhua)
  - Sudanese cholera epidemic
  - Sudan reports 36 suspected cases of measles in the states of Khartoum and White
    Nile, alongside seven confirmed cases of cholera in West Kordofan. (Sudan Tribune)
  - MapBiomas reports that water levels in the Brazilian Amazon rise to 2.6% above
    the historical average in 2025 following increased rainfall. The organization
    warns that climate change and land-use changes continue to affect long-term hydrological
    stability. (AFP via The Straits Times)
  - In track and field, American sprinter Noah Lyles runs 14.67 seconds in the 150
    metres at the Golden Spike meeting in Ostrava, Czech Republic, setting a world
    record that surpassed the previous mark of 14.72 seconds. (AFP via RFI)
