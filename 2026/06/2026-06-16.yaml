wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - Hezbollah states that it received assurances from Iran that the withdrawal of
      Israeli troops from occupied southern Lebanon will be a demand in the next phase
      of negotiations with the United States, before any deal about Iran's nuclear
      program. (Al Jazeera)
    - Iranian foreign minister Abbas Araghchi says that the continued Israeli occupation
      of Lebanon would be a violation of the Iran–US agreement. (AP)
    - 2026 Lebanon war
    - Israeli airstrikes kill at least four people across southern Lebanon. (AFP via
      BSS News) (Al Jazeera)
    - The Iranian military says that Israel has violated the ceasefire in Lebanon
      84 times since the Iran–US agreement was announced. (Al Jazeera)
    - 2026 English Channel incident
    - The Russian frigate Admiral Grigorovich fires warning shots at a yacht in the
      English Channel between Normandy and the Isle of Wight. (BBC News)
    - 69th Annual Grammy Awards
    - The Recording Academy of the United States announces five new Grammy Award categories
      for 2027, including Best Asian Pop Music Performance, and revises eligibility
      rules for Best New Artist, increasing the maximum number of prior submissions
      from three to four. (AFP via ABS-CBN News)
    - Economic impact of the 2026 Iran war
    - The CEO of Mitsui O.S.K. Lines, world's largest operator of tanker ships, says
      that it will take weeks to restore normal traffic through the Strait of Hormuz.
      (Reuters)
    - Bloomberg reports that QatarEnergy plans to resume liquefied natural gas (LNG)
      production within two months once the Strait of Hormuz officially reopens. (Middle
      East Eye) (Pipeline and Gas Journal)
    - The Bank of Japan raises its interest rate to 1% from 0.75%, the highest level
      since 1995. (BBC News) (Bloomberg)
    - 2026 Central Sulawesi earthquake
    - One person is killed and 38 others are injured when a earthquake strikes Palu,
      Central Sulawesi, Indonesia. (AP) (Reuters) (The Washington Post)
    - At least nine people are killed, including two children, and 25 others are injured
      when a freight train collides with a bus in Triangle, Masvingo, Zimbabwe. (AP)
    - Six people are killed and 20 others are injured when a mini-dump truck collides
      with a pickup truck and plunges into a ravine in Labrador, Pangasinan, Philippines.
      (Xinhua) (Manila Bulletin)
    - One person is killed and eight others are injured when a earthquake strikes
      Da Qaidam, Haixi, Qinghai, China. (AFP via USA Today) (Xinhua)
    - One person is killed and at least five others are injured when a NetJets-operated
      Cessna Citation Latitude business jet, with a San José del Cabo–Austin route,
      catches fire after crashing on Loop 20 highway in Laredo, Texas, United States.
      (CNN)
    - Sudanese cholera epidemic
    - Sudan reports 36 suspected cases of measles in the states of Khartoum and White
      Nile, alongside seven confirmed cases of cholera in West Kordofan. (Sudan Tribune)
    - MapBiomas reports that water levels in the Brazilian Amazon rise to 2.6% above
      the historical average in 2025 following increased rainfall. The organization
      warns that climate change and land-use changes continue to affect long-term
      hydrological stability. (AFP via The Straits Times)
    - China–Kenya relations, Kenya–Taiwan relations
    - Taiwan says the Kenyan foreign ministry revoked visas issued to Taiwanese scientists
      and prevented them from attending the Our Ocean Conference in Mombasa. China
      states that Kenya's actions are consistent with its adherence to the One China
      policy. (Reuters)
    - Terrorism in the United States
    - U.S. FBI director Kash Patel announces that the FBI has thwarted a terrorist
      attack plot during the UFC Freedom 250 event at the White House in Washington,
      D.C., with five people arrested for the plot. (AFP via Le Monde) (NBC News)
    - Brazil's Supreme Federal Court sentences former São Paulo congressman Eduardo
      Bolsonaro to four years and two months in prison and bars him from holding public
      office for eight years after convicting him of threatening public officials
      in connection with U.S. sanctions efforts. (AFP via The Manila Times)
    - A United Nations-backed court in the Central African Republic begins for former
      president François Bozizé, who seized power in a military coup in 2003, in absentia
      for crimes against humanity, including murder, enforced disappearances, torture,
      and rape. (Al Jazeera) (Africanews)
    - Politics of Equatorial Guinea
    - The entire cabinet of Equatorial Guinea, led by prime minister Manuel Osa Nsue
      Nsua, resigns after reaching under 10% of targets surrounding economic diversification.
      (BBC News) (Reuters)
    - Discoveries of exoplanets
    - The NASA's James Webb Space Telescope discovers that the Hot Jupiter exoplanet
      HD 80606 b is being roasted by its home star. The research findings were presented
      at the 248th American Astronomical Society in Pasedena, California, U.S. (Space.com)
    - 2026 FIFA World Cup
    - Argentina at the FIFA World Cup
    - In association football, Argentine forward and captain Lionel Messi becomes
      the first male player to appear in six FIFA World Cups and joins Germany's Miroslav
      Klose as the tournament's all-time leading scorer with 16 goals after scoring
      a hat-trick in Argentina's 3–0 win against Algeria in their opening match. (AFP
      via ABS-CBN News)
    - In track and field, American sprinter Noah Lyles runs 14.67 seconds in the 150
      metres at the Golden Spike meeting in Ostrava, Czech Republic, setting a world
      record that surpassed the previous mark of 14.72 seconds. (AFP via RFI)
