wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - The Israeli military claims to have killed multiple Hezbollah fighters during
      attacks on more than 70 targets in southern Lebanon over the past day. (Al Jazeera)
    - Seven hikers are killed in separate avalanches in the last 24 hours on Mont
      Blanc in the Alps. (Ansa)
    - Five people are killed, and another is seriously injured when an Indian Air
      Force Antonov An-32 aircraft crashes while landing in Jorhat, Assam, India.
      (The Indian Express) (Reuters)
    - 2026 Bangladesh measles outbreak
    - The Directorate General of Health Services reports that five more children in
      Bangladesh have died from measles in the past 24 hours. (BSS News) (Bangladesh
      Pratidin)
    - Anti-American sentiment in Iran
    - Dozens of hardliners and pro-regime demonstrators gather outside a foreign ministry
      office in Mashhad, Iran, to protest against foreign minister Abbas Araghchi
      and a potential deal between Iran and the United States. Protesters also call
      for a deal to not be signed without the approval of supreme leader Mojtaba Khamenei.
      (The Times of Israel) (i24NEWS)
    - 2026 UFL season
    - 2026 United Bowl
    - In American football, the United Football League's Louisville Kings defeat the
      DC Defenders, 27–20, to win their first United Bowl championship in their inaugural
      year in the league. (Fox Sports)
    - 2026 FIFA World Cup, Qatar at the FIFA World Cup
    - In association football, Qatar earns their first point in World Cup history
      after drawing with Switzerland 1–1 in their group stage match. (AFP via The
      Daily Star) (The New York Times)
    - 2026 NBA Finals
    - In basketball, the New York Knicks defeat the San Antonio Spurs 94–90 in Game
      5 of the NBA Finals to win their first championship title since 1973 and their
      third overall. (Reuters) (Sports Illustrated) (Sportsnet)
