  - 2026 Strait of Hormuz crisis
  - The South Korean ocean ministry reports that two vessels operated by Korean shipping
    companies have successfully transited through the Strait of Hormuz after being
    stranded for months during the war. (The Korea Times) (Yonhap News Agency)
  - The United Kingdom Maritime Trade Operations reports that a tanker had been struck
    by unknown projectiles in the Strait of Hormuz. (Open) (Reuters)
  - 2026 Lebanon war
  - Israeli occupation of Southern Lebanon
  - The Lebanese health ministry reports that at least one person was killed and two
    others were injured in Israeli airstrikes on Nabatieh al-Fawqa, southern Lebanon.
    (AFP via The Times of Israel)
  - Insurgency in Sindh
  - Three soldiers and four gunmen are killed in a shootout at a security compound
    in Karachi, Sindh, Pakistan. (Al Jazeera) (AP via Toronto Star)
  - LGBTQ rights in Hungary
  - Over 10,000 people gather at the Budapest Pride in Hungary, the first pride march
    in the city since former prime minister Viktor Orbán was voted out in April. The
    event occurs following attempts by the Orban government to ban the event and amidst
    a heat wave in Europe. (DW) (PBS) (Reuters)
  - 2026 Venezuela earthquakes
  - The confirmed toll of the June 24 earthquakes in Venezuela rises to over 1400
    people killed. (Reuters)
  - The United Nations estimates that the earthquakes caused approximately US$6.7
    billion in direct physical damage, equivalent to about 6% of Venezuela's gross
    domestic product. (AFP via TRT World)
  - 2026 Canadian wildfires
  - A mandatory evacuation in Lynn Lake, Manitoba, Canada, is ordered after a wildfire
    has grown to over 1,600 hectares near the area. (CBC News) (CTV News)
  - Five people are confirmed to have died in rain-related incidents in Afghanistan,
    over the past 48 hours. (Xinhua)
  - 2026 European heatwaves
  - Germany records its highest ever temperature of 41.5°C (106.7 F) in Saxony-Anhalt,
    according to Deutscher Wetterdienst, as an Autobahn highway is closed near Berlin
    due to the concrete bursting. The Czech Republic records its hottest day on record,
    with 40.6°C (105 F) recorded in Doksany, and Denmark records a record high temperature
    of 37.0°C (98.6 F) in Aarhus Municipality, according to the Danish Meteorological
    Institute. (AP)
  - Next Serbian parliamentary election, Next Serbian presidential election, 2024–present
