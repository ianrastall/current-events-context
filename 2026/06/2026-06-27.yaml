wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain, 2026 Iranian strikes on Kuwait
    - The Islamic Revolutionary Guard Corps Navy and Aerospace Force launch retaliatory
      strikes against Bahrain and Kuwait, including the U.S. Navy's Fifth Fleet, in
      response to the U.S. Central Command's (CENTCOM's) strikes against Iran near
      the Strait of Hormuz, which were in response to the attack on the Singapore-flagged
      container ship Ever Lovely in the strait. (The Guardian) (The Hill) (Reuters
      via Times of Israel)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - The U.S. CENTCOM conducts retaliatory strikes against Iranian military surveillance
      infrastructure, communication systems, air defense sites, drone storage facilities,
      and minelayer capabilities in response to an attack on the Panama-flagged oil
      tanker M/T Kiku near the Strait of Hormuz, which carried more than two-million
      barrels of crude oil. (Ynetnews) (The Hill)
    - The United Kingdom Maritime Trade Operations reports that the Panama-flagged
      oil tanker M/T Kiku had been struck by unknown projectiles near the Strait of
      Hormuz. (Open) (Reuters)
    - The South Korean ocean ministry reports that two vessels operated by Korean
      shipping companies have successfully transited through the Strait of Hormuz
      after being stranded for months during the war. (The Korea Times) (Yonhap News
      Agency)
    - 2026 Lebanon war
    - Israeli occupation of Southern Lebanon
    - 2026 Israel–Lebanon peace talks
    - Hezbollah secretary-general Naim Qassem rejects the framework agreement signed
      by Israel and Lebanon, which requires Hezbollah to disarm before an Israeli
      military withdrawal, and accuses the Lebanese government of legitimizing the
      Israeli occupation. (Al Jazeera)
    - The Lebanese health ministry reports that at least one person was killed and
      two others were injured in Israeli airstrikes on Nabatieh al-Fawqa, southern
      Lebanon. (AFP via The Times of Israel)
    - Gaza war
    - The Israeli military confirms that Walid Haniyeh, a Nukhba Force deputy commander
      and nephew of former Hamas leader Ismail Haniyeh, has been killed in an airstrike
      in the Gaza Strip. (Caliber.az) (The Jerusalem Post) (The Times of Israel)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Ukraine's Security Service announces that the Ukrainian forces have struck the
      Vtorovo oil pumping station in Russia's Vladimir Oblast as part of a 40-day
      campaign by Ukrainian President Volodymyr Zelenskyy in an effort at "compelling"
      Russia to end the war. (Kyiv Independent)
    - Aviation shootdowns and accidents during the Russo-Ukrainian war
    - A Ukrainian Air Force MiG-29 is destroyed by a Russian Geran kamikaze drone
      on the ground at an airbase in southern Ukraine, while another MiG-29 is lost
      during a combat mission over Poltava Oblast, with the pilot successfully ejecting
      and reaching safety. (Defence Blog)
    - Sudanese civil war
    - Darfur campaign
    - The Sudanese Armed Forces announces that they have recaptured the North Darfur
      town of Abu Qamra from the paramilitary group Rapid Support Forces in a joint
      offensive with allied joint military forces. (Sudan Tribune)
    - War crimes during the Sudanese civil war, Kordofan campaign
    - Sudan's Humanitarian Aid Commission (HAC) says that the Rapid Support Forces
      have targeted an aid truck heading to El-Obeid, North Kordofan, Sudan. (Sudan
      Horizon) (Sudan Tribune)
    - Insurgency in Sindh
    - Three soldiers and four gunmen are killed in a shootout at a security compound
      in Karachi, Sindh, Pakistan. (Al Jazeera) (AP via Toronto Star)
    - LGBTQ rights in Hungary
    - Over 10,000 people gather at the Budapest Pride in Hungary, the first pride
      march in the city since former prime minister Viktor Orbán was voted out in
      April. The event occurs following attempts by the Orban government to ban the
      event and amidst a heat wave in Europe. (DW) (PBS) (Reuters)
    - Wildfires in 2026
    - 2026 United States wildfires
    - 2026 Utah wildfires
    - The Cottonwood Fire, currently the largest burning in the United States, destroys
      more than 100 condos and cabins as it spreads across Elk Mountain, Utah. Governor
      Spencer Cox declares it the "most destructive fire in the state's history" in
      terms of property loss. (The New York Times)
    - Three firefighters are killed and two others are injured when the Snyder Fire
      grows in size and crosses the Colorado border. (The Guardian) (KJCT-CD)
    - 2026 Canadian wildfires
    - A mandatory evacuation in Lynn Lake, Manitoba, Canada, is ordered after a wildfire
      has grown to over 1,600 hectares near the area. (CBC News) (CTV News)
    - 2026 Venezuela earthquakes
    - The confirmed toll of the June 24 earthquakes in Venezuela rises to over 1400
      people killed. (Reuters)
    - The United Nations estimates that the earthquakes caused approximately US$6.7
      billion in direct physical damage, equivalent to about 6% of Venezuela's gross
      domestic product. (AFP via TRT World)
    - Five people are confirmed to have died in rain-related incidents in Afghanistan,
      over the past 48 hours. (Xinhua)
    - Governor Andy Beshear declares a state of emergency in the U.S. state of Kentucky
      after four people have killed by flooding from thunderstorms in Madison and
      Jackson counties. (AA) (AP)
    - 2026 European heatwaves
    - Germany records its highest ever temperature of 41.5°C (106.7 F) in Saxony-Anhalt,
      according to Deutscher Wetterdienst, as an Autobahn highway is closed near Berlin
      due to the concrete bursting. The Czech Republic records its hottest day on
      record, with 40.6°C (105 F) recorded in Doksany, and Denmark records a record
      high temperature of 37.0°C (98.6 F) in Aarhus Municipality, according to the
      Danish Meteorological Institute. (AP)
    - Politics of Serbia
    - Next Serbian parliamentary election, Next Serbian presidential election, 2024–present
      Serbian anti-corruption protests
    - Serbian president Aleksandar Vučić announces his intention to resign within
      weeks amid anti-corruption protests and will call for early presidential and
      parliamentary elections. (AP) (Reuters)
    - Gaza war protests
    - Demonstrators rally in central Stockholm, Sweden, including the Odenplan area,
      against Israeli strikes against Gaza and restrictions on humanitarian aid entering
      the enclave. (Middle East Monitor)
    - Australia introduces legislation to increase penalties for social media platforms
      that fail to enforce its under-16 ban, raising the maximum fine to A$99 million
      (US$68 million) and expanding regulatory powers to investigate compliance. (AFP
      via CNA)
    - Argentine cabinet chief and government spokesperson Manuel Adorni resigns following
      weeks of controversy over his wealth. (Clarín) (Reuters)
    - 2026 FIFA World Cup
    - Argentina at the FIFA World Cup
    - In association football, Argentine forward and captain Lionel Messi becomes
      the first male player to score in seven consecutive FIFA World Cup matches (including
      matches from the previous edition) after scoring in the team's 3–1 win against
      Jordan in their final group-stage match. (The New York Times) (USA Today)
    - DR Congo at the FIFA World Cup
    - DR Congo qualifies for the knockout stage of a FIFA World Cup for the first
      time after winning 3–1 over Uzbekistan in their final group-stage match to finish
      as the best third-place team in the round. (The Guardian)
    - Egypt at the FIFA World Cup
    - Egypt qualifies for the knockout stage of a FIFA World Cup for the first time
      after drawing 1–1 with Iran and finishing their group stage in second place.
      (AP via NBC News)
