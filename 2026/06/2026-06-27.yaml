  - 2026 Iranian strikes on Bahrain
  - Iran launches retaliatory strikes against Bahrain, including the U.S. Navy's Fifth
    Fleet, in response to the U.S. CENTCOM's strikes against Iran near the Strait
    of Hormuz, which were in response to the attack on the Singapore-flagged container
