wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war, Islamabad Memorandum
    - Pakistani prime minister Shehbaz Sharif and United States president Donald Trump
      announce that Iran and the U.S. have reached an agreement to end the war, extend
      the ceasefire by 60 more days, and reopen the Strait of Hormuz, with the deal
      set to be officially signed in Switzerland on Friday. (Reuters) (Axios)
    - Mediators from Qatar travel to Tehran, Iran, to finalize the ceasefire agreement
      between Iran and the U.S. to end the war. (ABC News) (The Jerusalem Post)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - 2026 United States naval blockade of Iran
    - U.S. president Trump authorizes the end of the blockade imposed since April
      13 after announcing that an agreement had been reached. (AP)
    - U.S. defense secretary Pete Hegseth says that the U.S. has maintained control
      of the Strait of Hormuz, and states that the U.S. has guided 125 million barrels
      of oil through Operation Project Freedom despite regional tensions. (AA)
    - Gaza war
    - Attacks on Jabalia refugee camp
    - At least six people are killed in Gaza, including four in an Israeli airstrike
      on the Jabalia refugee camp and two in separate shooting incidents near Khan
      Yunis. (AFP via The Manila Times)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - Lebanon's health ministry reports that an Israeli attack on the Dahieh suburb
      of Beirut killed three people and injured 16. (Al Jazeera) (Al Jazeera)
    - The Israeli military confirms that Hezbollah commander Ali Musa Daqduq, who
      was responsible for orchestrating the killing of five American troops in Iraq
      during the Iraq War, has been killed in a recent airstrike in southern Lebanon.
      (Al Jazeera)
    - Sudanese civil war
    - Kordofan campaign
    - Rapid Support Forces (RSF) launch drone strikes on El-Obeid, North Kordofan,
      targeting a fuel station at the El Obeid Airport district and a fuel storage
      tank. (Sudan Tribune)
    - The Sudanese Army says that they have killed dozens of RSF fighters and destroyed
      over 141 combat vehicles across Sudan this month, including the Darfur and Kordofan
      regions and Blue Nile and White Nile states. (AA)
    - Russia–United Kingdom relations
    - British Royal Marines storm and seize a Russian shadow fleet tanker in the English
      Channel. (BBC News)
    - Economic impact of the 2026 Iran war
    - Oil prices, including crude oil, fall by 5% after U.S. president Donald Trump
      announced that a deal has been reached to end the war, reopen the Strait of
      Hormuz and end the U.S. blockade. (CNBC)
    - 2026 Butler PAC P-750 crash
    - Twelve people are killed when a plane carrying skydivers crashes in Butler,
      Missouri, United States. (WDAF-TV) (The Guardian)
    - 2026 Rio de Janeiro mid-air collision
    - American singer Oliver Tree, Argentine YouTuber Gaspi, Argentine filmmaker Lucas
      A. Vignale, and three others are killed when two helicopters collide and crash
      into a parking lot in Rio de Janeiro, Brazil. (The Times of India) (CNN Brasil)
    - Six people are killed after a pickup truck collides with a parked truck in Ejin
      Banner, Inner Mongolia Autonomous Region, China. (Xinhua)
    - Four people are killed and four others are injured when a sailboat collides
      with a large passenger catamaran between Brač and Šolta, Croatia. (CTV News)
    - 2020–2026 H5N1 outbreak
    - The Australian agriculture ministry confirms the first cases of H5N1 bird flu
      in the country in a brown skua in remote Western Australia. This means the H5N1
      variant has now reached every continent. (BBC News)
    - 2026 NBA Finals
    - Police arrest 63 people outside Madison Square Garden in New York City, U.S.,
      after ten officers were injured during celebrations of the New York Knicks winning
      the NBA Finals. (AFP via The New Zealand Herald) (The Athletic via The New York
      Times)
    - Gunshots are reported overnight on 42nd Street and Broadway in New York City
      with one teen shot and several buses being damaged during celebrations. (BBC
      News)
    - Extrajudicial killings and enforced disappearances in Bangladesh
    - Former Bangladeshi police chief Benazir Ahmed is arrested by police in Dubai,
      United Arab Emirates, after an Interpol Red Notice was issued on crimes against
      humanity and corruption charges. Bangladeshi home minister Salahuddin Ahmed
      says extradition proceedings for Ahmed will follow. (AFP via Business Recorder)
    - 2026 Swiss referendums
    - Swiss voters reject an initiative to cap Switzerland's permanent resident population
      at 10 million by 2050. (AP) (Reuters)
    - 2026 FIA World Endurance Championship
    - 2026 24 Hours of Le Mans
    - In endurance racing, Toyota Racing wins the 24 Hours of Le Mans with drivers
      Mike Conway, Kamui Kobayashi, and Nyck de Vries. It is Toyota's first victory
      in the event since 2022 and sixth overall. (AFP via The Manila Times) (Motorsport.com)
    - 2025–26 NHL season
    - 2026 Stanley Cup Final
    - In ice hockey, the Carolina Hurricanes defeat the Vegas Golden Knights 3–0 to
      win the Stanley Cup in six games, their first championship since 2006. (ESPN)
      (Reuters)
    - 2026 FIFA World Cup, Curaçao at the FIFA World Cup
    - In association football, Curaçao, the smallest nation to qualify for a FIFA
      World Cup, make their tournament debut and score their first-ever goal in a
      7–1 defeat against Germany. (Yahoo! Sports)
    - UFC Freedom 250
    - In mixed martial arts, the UFC Freedom 250 event, named for the 250th anniversary
      of the U.S. Declaration of Independence, is held on the South Lawn of the White
      House in Washington, D.C. The event coincides with the 80th birthday of U.S.
      president Donald Trump. (CBS News) (News.com.au)
