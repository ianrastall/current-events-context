wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz campaign
    - Naval blockade of Iran
    - United States Indo-Pacific Command forces intercept the stateless vessel M/T
      Davina in the Indian Ocean for allegedly supporting Iran. (Al Jazeera)
    - 2025–2026 Iran–United States negotiations
    - Mohsen Rezaee, the Iranian military advisor to the Supreme Leader, says that
      negotiations are in a "deadlock" and that it is up to the United States to end
      it. (Al Jazeera)
    - Axios reports that U.S. envoys Jared Kushner and Steve Witkoff have traveled
      to the Oak Ridge National Laboratory, Tennessee, to talk with nuclear experts
      who might take part in future negotiations with Iran regarding their nuclear
      program. (Axios) (Reuters)
    - Azerbaijan–Israel relations
    - CNN reports that Israel has deployed commandos, military, and intelligence personnel,
      to Azerbaijan near its border with Iran during the war and carried out a covert
      intel mission in doing so. (Ynetnews) (Haaretz) (Times of Israel)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Lebanese parliament speaker Nabih Berri rejects the ceasefire deal with Israel,
      saying it is not a complete ceasefire and does not require an Israeli withdrawal
      from southern Lebanon at the same time as Hezbollah. (Al Jazeera)
    - Lebanese president Joseph Aoun and prime minister Nawaf Salam criticize Iran
      for the rejection of the ceasefire deal with Israel, stating that Lebanon should
      not be used as a bargaining chip in negotiations between the United States and
      Iran. (AP)
    - At least five people, including a paramedic, are killed by Israeli airstrikes
      in the Nabatieh District, Lebanon. (Al Jazeera)
    - Gaza war
    - Israel's Southern Command says that it killed a Palestinian fighter in Gaza
      who was "planning imminent attacks" on the Israeli military and directing attacks
      inside Israel. (Al Jazeera)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Five Azerbaijani crew members are killed and three others are injured in an
      Ukrainian drone attack on two commercial vessels in Taganrog Bay, Rostov Oblast,
      Russia. (The Moscow Times)
    - Peace negotiations in the Russo-Ukrainian war
    - Russian president Vladimir Putin rejects Ukrainian president Volodymyr Zelenskyy's
      proposal for a face-to-face meeting, stating that he sees "no point" and "the
      only point is for the Ukrainian side to halt the advance of our armed forces".
      (Reuters) (AP)
    - A Ukrainian uncrewed surface vessel explodes in the Port of Constanța, Romania.
      (Reuters)
    - Boko Haram insurgency
    - Jihadist insurgents attack a Nigerian military base in Mandaragirau, Borno State,
      Nigeria, killing five soldiers. (AP)
    - 2026 Cuban crisis
    - Hotel operator Archipelago International ends management agreements for six
      hotels in Cuba, citing compliance with United States sanctions. (AFP via The
      Manila Times)
    - Hungary suspends the issuance of work visas for nationals of Armenia, Georgia,
      and the Philippines, citing plans to regulate non-European Union guest workers
      and concerns about the impact of foreign labor on domestic employment and wages.
      (Reuters)
    - The death toll from a fire at a nursing home two days ago in Galpatha, Sri Lanka,
      rises to 13. (CTV News)
    - Measles resurgence in the United States
    - The U.S. Centers for Disease Control and Prevention reports that the United
      States has surpassed over 2,000 cases of measles for a second year in a row,
      with 2,030 cases recorded in Washington DC and 38 U.S. states. (ABC News)
    - Scientists at the University of Cambridge in the United Kingdom and DIOSynVax
      reports the first human clinical trial of a AI-designed vaccine for coronaviruses
      including SARS, MERS, and COVID-19 and potentially Ebola. (Medical Xpress) (AA)
    - Reactions to the 2026 Iran war
    - Azerbaijan–Israel relations, Azerbaijan–Iran relations
    - The Azerbaijani foreign ministry denies a CNN report claiming that the country
      allowed Israeli military and Mossad personnel to use southern Azerbaijan to
      launch attacks on Iran, one of which allegedly killed an Islamic Revolutionary
      Guard Corps senior officer. (Al Jazeera) (CNN)
    - Deportation in the second Trump administration
    - Rights groups file a case against Equatorial Guinea, demanding that the African
      Commission on Human and Peoples' Rights order the Equatoguinean government to
      immediately stop sending people deported from the United States back to their
      home countries, saying it violates the deportees' rights. (AP)
    - Foreign relations of Israel, Foreign relations of Slovenia
    - Israeli foreign minister Gideon Sa'ar says that Israel will open its first embassy
      in Ljubljana, Slovenia, after its new prime minister Janez Janša ordered the
      Palestine flag at the main government building to be removed within an hour
      after taking office. (Al Jazeera)
    - France–Mali relations
    - A Malian court sentences a French embassy official to 20 years' imprisonment
      for undermining state security, and imposes a F.CFA 3.5 million (US$6,225) fine
      and entry ban. France states that the official was engaged in security cooperation.
      (AFP via France 24)
    - New Zealand–United States relations
    - The United States Department of State approves the potential sale of five Sikorsky
      SH-60 Seahawk helicopters and related equipment to New Zealand's military in
      a deal valued at US$1.5 billion. (Reuters)
    - 2025 Drents Museum heist
    - A Dutch court sentences three men to 47 months' imprisonment for stealing Dacian
      golden artifacts, including the Helmet of Coțofenești, from the Drents Museum
      in Assen, Drenthe, in 2025. (AFP via RFI) (AP)
    - 2026 South Korean local elections
    - South Korea's election commission chairperson resigns after ballot shortages
      affect dozens of polling stations during elections, prompting protests. (AFP
      via UCA News)
    - The United States Department of Energy announces that a nuclear microreactor
      developed by a private company has reached "criticality" for the first time
      under a program to develop the U.S. nuclear industry by the second Trump administration.
      (PBS)
    - 2026 FIFA World Cup
    - 2026 FIFA World Cup controversies
    - Iraqi national footballer Ayman Hussein is detained and questioned by US Customs
      and Border Protection at O'Hare International Airport in Chicago for seven hours
      before he is finally allowed to enter United States, but the team's photographer
      is barred from entering the country. (Reuters)
