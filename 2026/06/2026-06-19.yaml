wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - The Swiss foreign ministry confirms that the planned talks between Iran and
      the United States at the Bürgenstock Resort, Switzerland, have been cancelled
      after U.S. vice president JD Vance cancelled his trip. (Reuters)
    - 2026 Strait of Hormuz crisis
    - Iranian foreign ministry spokesperson Esmail Baghaei rejects reports that Iran
      has re-closed the Strait of Hormuz. (Dawn) (Euronews)
    - 2026 Lebanon war
    - At least 47 people are killed and 97 more injured by Israeli airstrikes across
      southern Lebanon. (NBC News)
    - The United States announces that Israel and Hezbollah agreed to a ceasefire.
      (NBC News)
    - Four Israeli soldiers are killed in a shootout with Hezbollah fighters near
      Nabatieh, Lebanon. (Al Jazeera)
    - Lebanese conservationist and environmentalist Mona Khalil, a advocate for the
      protection of endangered sea turtles, dies from wounds sustained during an Israeli
      attack in southern Lebanon two weeks ago. (The New Arab)
    - Sudanese civil war
    - Darfur campaign
    - The Sudanese human rights organization Emergency Lawyers reports that nine civilians
      have been killed in a Rapid Support Forces (RSF) drone strike on a passenger
      vehicle carrying civilians in North Darfur. Additionally, another drone struck
      the Um Bayada market, causing a massive fire. (Middle East Monitor) (Darfur24)
    - Kordofan campaign
    - The UN secretary general envoy to Sudan calls for RSF head Mohamed Hamdan Dagalo
      to halt attacks on the North Kordofan area of El-Obeid. (AFP via Arab News PK)
    - Rapid Support Forces launch a drone strike on the El-Obeid area of North Kordofan,
      Sudan, amidst warnings about the situation in the area. (Sudan Tribune)
    - Catholic priest Yohanna Al-Amin Komkome is killed alongside two of his associates
      in Kauda near the Nuba Mountains. The Sudan People's Liberation Movement–North
      is accused of the attacks. (Sudan Now)
    - Terrorism in the United Kingdom
    - 2026 Edinburgh attacks
    - Five people are injured in Islamophobic attacks in Edinburgh, Scotland. A 36-year-old
      man is arrested and counter-terrorism police are investigating. (DW)
    - Mexican archaeologists uncover Early Classic-period ruins in Veracruz featuring
      a circular stone platform and other previously undocumented architectural elements
      for the region. Researchers also discover a carved monolith depicting figures
      with possible Maya cultural influences. (AFP via France 24)
    - Economic impact of the 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - Iran's Persian Gulf Strait Authority states that tariffs and insurance will
      not be collected from ship owners during the 60-day period of the Islamabad
      Memorandum. However, it also calls for ships to register with it, and requires
      that a transit request for the Strait of Hormuz must be made 48 hours prior
      to arrival. (AP) (NBC News)
    - The government of Japan revises a Cabinet order on visa fees, where issuance
      fees for foreigners entering Japan will increase fivefold, effective on July
      1; the first since 1978. (Kyodo News via Philippine Daily Inquirer) (ABS-CBN
      News)
    - 2026 Bedford train collision
    - One person is killed and 89 others are injured, including 33 seriously with
      nine in critical condition, after two passenger trains collide near Bedford,
      Bedfordshire, England. (BBC News) (The Daily Telegraph) (BBC News)
    - At least ten people are killed and several injured in the past 24 hours, due
      to strong winds and heavy rain in parts of Pakistan. (The Nation)
    - The Huisekoutermolen windmill in East Flanders, Belgium, is blown down in a
      thunderstorm. (The Brussels Times)
    - Philippines–Russia relations
    - Philippine president Bongbong Marcos announces that 24 Filipino nationals detained
      in Russia will be released and repatriated to the Philippines following a meeting
      with Russian president Vladimir Putin in Kazan. (AP via CBS News)
    - Poland–Ukraine relations
    - Polish president Karol Nawrocki strips Ukrainian president Volodymyr Zelenskyy
      of the country's highest honour, the Order of the White Eagle, for naming an
      army unit after the Ukrainian Insurgent Army, which massacred Poles during World
      War II. (Reuters)
    - Organised crime in Australia
    - The Australian Federal Police seizes 2.7 tonnes of cocaine concealed in underground
      storage containers in Sydney, the largest cocaine seizure in the country's history.
      Authorities arrest two people at the site and charge them with offenses related
      to importing and possessing illicit drugs. (AFP via ABS-CBN News) (Reuters)
    - Hijab in Iran
    - Iranian singer Parastoo Ahmadi is sentenced by a criminal court to 74 lashes
      after performing at a concert in 2024 without the use of the hijab. Additionally,
      she is also banned from performing or leaving the country for two years. (Euronews)
      (The New York Times)
    - The Australian Government agrees to pay A$28 million (US$20 million) in a settlement
      with 38 former asylum seekers who alleged harm while detained at the Baxter
      and Woomera immigration detention centres. The agreement follows a High Court
      ruling on compensation claims for unlawful detention. (AFP via The Manila Times)
    - Costa Rican police arrest a man in connection with an alleged threat against
      president Laura Fernández Delgado. The president is evacuated during a visit
      to northern Costa Rica after an explosion was reported nearby. (Reuters)
    - 2026 Bolivian protests
    - Bolivian president Rodrigo Paz and the Bolivian Workers' Confederation trade
      union reach an agreement aimed at easing a 50-day protest crisis marked by road
      blockades and supply shortages. Other protest groups continue demonstrations
      and demand Paz's resignation. (Reuters)
    - 2026 Labour Party leadership crisis
    - British home secretary Shabana Mahmood, energy secretary Ed Miliband, and transport
      secretary Heidi Alexander meet with prime minister Keir Starmer and reportedly
      urge him to set out a timetable for his departure following Andy Burnham's win
      in the 2026 Makerfield by-election. (The Herald) (The Telegraph)
    - AI boom, Regulation of artificial intelligence
    - Norwegian prime minister Jonas Gahr Støre announces new school guidelines that
      generally prohibit the use of generative AI by primary school pupils and restrict
      its use for older students. The policy takes effect in the next academic year.
      (Reuters)
    - Malaysian researchers identify Pleurocordyceps cornusynnemata, a new fungal
      species in Borneo that parasitizes Ophiocordyceps fungi infecting ants. Scientists
      also report the discovery of a previously undocumented spider-infecting fungus.
      (AFP via CBS News)
    - TYR Pro Swim Series
    - In swimming, American swimmer Kate Douglass sets a world record in the women's
      50-meter freestyle at the Pro Swim Series in Indianapolis, finishing in 23.59
      seconds and surpassing the previous mark of 23.61 seconds set by Sweden's Sarah
      Sjöström. (AFP via RFI)
