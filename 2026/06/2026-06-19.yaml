Date: '2026-06-19'
Source_URI: Portal:Current events/2026 June 19
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - The Swiss foreign ministry confirms that the planned talks between Iran and the
    United States at the Bürgenstock Resort, Switzerland, have been cancelled after
    U.S. vice president JD Vance cancelled his trip. (Reuters)
  - 2026 Strait of Hormuz crisis
  - Iranian foreign ministry spokesperson Esmail Baghaei rejects reports that Iran
    has re-closed the Strait of Hormuz. (Dawn) (Euronews)
  - 2026 Lebanon war
  - At least 47 people are killed and 97 more injured by Israeli airstrikes across
    southern Lebanon. (NBC News)
  - The United States announces that Israel and Hezbollah agreed to a ceasefire. (NBC
    News)
  - Four Israeli soldiers are killed in a shootout with Hezbollah militants near Nabatieh,
    Lebanon. (Al Jazeera)
  - Economic impact of the 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - Iran's Persian Gulf Strait Authority states that tariffs and insurance will not
    be collected from ship owners during the 60-day period of the Islamabad Memorandum.
    However, it also calls for ships to register with it, and requires that a transit
    request for the Strait of Hormuz must be made 48 hours prior to arrival. (AP)
    (NBC News)
  - 2026 Bedford train collision
  - One person is killed and 89 others are injured, including 33 seriously, after
    two passenger trains collide near Bedford, Bedfordshire, England. (BBC News) (The
    Daily Telegraph)
  - Philippines–Russia relations
  - Philippine president Bongbong Marcos announces that 24 Filipino nationals detained
    in Russia will be released and repatriated to the Philippines following a meeting
    with Russian president Vladimir Putin in Kazan. (The Star)
  - Poland–Ukraine relations
  - Polish President Karol Nawrocki strips Ukrainian President Volodymyr Zelenskyy
    of the country's highest honour, the Order of the White Eagle, for naming an army
    unit after the Ukrainian Insurgent Army, which engaged in massacres against Poles
    during World War II. (Reuters)
  - The Australian Government agrees to pay A$28 million (US$20 million) in a settlement
    with 38 former asylum seekers who alleged harm while detained at the Baxter and
    Woomera immigration detention centres. The agreement follows a High Court ruling
    on compensation claims for unlawful detention. (AFP via The Manila Times)
  - 2026 Labour Party leadership crisis
  - British home secretary Shabana Mahmood, energy secretary Ed Miliband, and transport
    secretary Heidi Alexander meet with prime minister Keir Starmer and reportedly
    urge him to set out a timetable for his departure following Andy Burnham's win
    in the 2026 Makerfield by-election. (The Herald) (The Telegraph)
  - Malaysian researchers identify Pleurocordyceps cornusynnemata, a new fungal species
    in Borneo that parasitizes Ophiocordyceps fungi infecting ants. Scientists also
    report the discovery of a previously undocumented spider-infecting fungus. (AFP
    via CBS News)
