wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - Operation Urja Suraksha
    - Indian shipping minister Sarbananda Sonowal says that three Indian oil tankers,
      the Desh Vaibhav, Desh Vibhor, and Sanmar Herald, have safely transited through
      the Strait of Hormuz and are on their way to India. (Hindustan Times) (Reuters)
    - The Iranian military command announces that the Strait of Hormuz is closed to
      traffic because of Israel's violations of the Islamabad Memorandum ceasefire
      in Lebanon. The Islamic Revolutionary Guard Corps Navy warns ships to stay away
      from the strait. (Al Jazeera) (Al Jazeera)
    - The United States Central Command says that 55 ships transporting more than
      17 million barrels of oil and cargo have crossed the strait and that traffic
      on the chokepoint increased, rejecting Iran’s claims that the waterway is closed.
      (BBC News) (Shafaq)
    - Gaza war
    - At least six people are killed in the Gaza Strip, including two children, from
      Israeli strikes on a residential area. (Al Jazeera)
    - An Israeli airstrike kills Al Jazeera cameraman Ahmed Wishah. (Al Jazeera)
    - 2026 Lebanon war
    - Israeli airstrikes on southern Lebanon kill at least 32 people, including sixteen
      people in Nabatieh and two soldiers. (Al Jazeera)
    - The office of Israeli prime minister Benjamin Netanyahu states that Israeli
      troops will remain in southern Lebanon to protect Israel's northern border for
      as long as it is believed to be necessary. (Al Jazeera)
    - Sudanese civil war
    - Kordofan campaign
    - The Sudanese Army says that they have launched drone strikes to foil preparations
      by Rapid Support Forces to launch new assaults on the North Kordofan capital
      of El Obeid in Sudan. (Sudan Tribune)
    - Insurgency in Khyber Pakhtunkhwa
    - Two roadside bomb explosions in Bannu District, Khyber Pakhtunkhwa, Pakistan,
      kill at least seven people and injure three others. The second blast occurred
      as casualties from the first explosion were being transported for medical treatment.
      (AFP via Philippine Daily Inquirer)
    - Former Hurras al-Din leader Sami al-Oraydi is reported to be killed in a airstrike
      in northern Syria. (Islam Times) (Asharq Al-Awsat)
    - Turkey exports a warship to Romania, a NATO and European Union member country,
      for the first time in its history. (TRT World)
    - Three people are killed in a fire at a single-story pavilion in West London,
      London, England. (Sky News)
    - One person is killed when two freight trains collide and fall off of a bridge
      in Munich, Bavaria, Germany. (Reuters)
    - 2020–2026 H5N1 outbreak
    - The Australian Government confirms the first detection of the avian influenza
      subtype H5N1 in the country after identifying the virus in a wild seabird in
      Western Australia. The strain has now been recorded on every continent. (AFP
      via France 24)
    - 2026 European heatwaves
    - Météo-France places 35 departments, including Paris, under red heat wave alert
      as high temperatures persist nationwide. Authorities also prohibit public alcohol
      consumption during Fête de la Musique events in affected areas and implement
      measures to reduce pressure on emergency services. (AFP via Oman Observer)
    - Whaling in Iceland
    - A commercial whaling vessel departs from Reykjavík, marking the resumption of
      Iceland's whale hunt after a two-year suspension. The season proceeds under
      reduced catch recommendations issued by the country's Marine and Freshwater
      Research Institute. (AFP via New Zealand Herald)
    - In a major recovery from climate-related disaster, thousands of flamingo eggs
      hatched at Lake Tuz in Turkey. (Good News Network)
    - Koldo Case
    - A Spanish court orders Begoña Gómez, the wife of prime minister Pedro Sánchez,
      to stand trial on corruption-related charges, confiscates her passport, and
      restricts her international travel pending proceedings. (Reuters)
    - 2026 Bolivian protests
    - Bolivian president Rodrigo Paz declares a state of emergency, deploying the
      military to clear the road blockades. (CNN) (Reuters)
    - Members of Mexico's Coordinadora Nacional de Trabajadores de la Educación end
      a 20-day strike over wages and pensions. The protests included demonstrations
      and road blockades in Mexico City, some of which targeted areas associated with
      the FIFA World Cup. (AFP via The Manila Times)
    - 2026 FIFA World Cup
    - Curaçao at the FIFA World Cup
    - In association football, FIFA World Cup debutants Curaçao, the smallest nation
      by population to play at the World Cup, earn their first-ever point at the tournament
      after drawing 0–0 against Ecuador in the group stage. (AFP via The Philippine
      Star)
    - Tunisia v Japan (2026 FIFA World Cup)
    - The 1,000th FIFA World Cup match is held at the Estadio BBVA in Monterrey, Mexico,
      with Japan defeating Tunisia 4–0 in the group stage. (Japan Times) (RTÉ)
