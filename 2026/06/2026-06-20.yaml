  - 2026 Lebanon war
  - Israeli airstrikes on southern Lebanon kill at least 28 people, including a family
    of four. (RTÉ News) (Anadolu Agency)
  - Multiple Lebanese soldiers are killed by Israeli airstrikes. (Al Jazeera)
  - The office of Israeli prime minister Benjamin Netanyahu states that Israeli troops
    will remain in southern Lebanon to protect Israel's northern border for as long
