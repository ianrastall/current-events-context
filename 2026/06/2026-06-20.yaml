  - 2026 Strait of Hormuz crisis
  - The Iranian military command announces that the Strait of Hormuz is closed to
    traffic because of Israel's violations of the Islamabad Memorandum ceasefire in
    Lebanon. The Islamic Revolutionary Guard Corps Navy warns ships to stay away from
    the strait. (Al Jazeera) (Al Jazeera)
