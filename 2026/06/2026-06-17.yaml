Date: '2026-06-17'
Source_URI: Portal:Current events/2026 June 17
Intelligence_Payload:
  Uncategorized:
  - Gaza war
  - Gaza peace plan
  - The Gaza Health Ministry says that over 1,000 Palestinians have been killed in
    Gaza Strip since the ceasefire was announced last year. (AP)
  - Hamas reports progress in the second phase of ceasefire talks. (Shafaq)
  - The Israel Defense Forces says that they have killed two Hamas militants who allegedly
    took part in the October 7 attacks on Israel over the weekend in a airstrike in
    the central Gaza Strip. (The Times of Israel)
  - 2026 Atlantic hurricane season
  - Tropical Storm Arthur forms, becoming the first tropical cyclone of the season
    after creating significant rainfall across Mexico and Texas, United States. (The
    New York Times)
  - 2026 Ebola epidemic
  - 52nd G7 summit
  - The European Union and G7 nations at the summit in Évian-les-Bains pledge funding
    for the Democratic Republic of the Congo amidst the Ebola epidemic in the country,
    including the Itiru province. (DW)
  - Sudanese cholera epidemic
  - The TASIS-aligned Peace Government officially declares a cholera outbreak in the
    Kordofan region, with laboratory tests in South Sudan confirming the disease,
    after weeks of acute watery diarrhoea cases in West Kordofan. (The Sudan Times)
  - 2027–2028 United States redistricting
  - In the U.S., the Republican-led Georgia General Assembly rejects governor Brian
    Kemp's attempt to redistrict Georgia's congressional districts for the 2028 United
    States House of Representatives elections in the state after state House speaker
    Jon G. Burns announced that he will not hold a vote to do so. (Marietta Daily
    Journal) (The New York Times)
  - June 2026 President of the Senate of the Philippines election
  - The Philippine Senate elects Sherwin Gatchalian as Senate president, formally
    removing Alan Peter Cayetano and ending a leadership dispute that began on June
    3. Gatchalian receives the support of all 13 senators present during a special
    session. (Philippine Daily Inquirer) (Reuters)
  - 2026 FIFA World Cup, DR Congo at the FIFA World Cup
  - In association football, Yoane Wissa scores the DR Congo's first goal at a FIFA
    World Cup during a 1–1 draw against Portugal in their opening match. (AFP via
    Jamaica Observer)
  - Sudan's women's national under-17 football team makes its first appearance on
    international stage in Morocco in an effort to qualify for the upcoming 2028 Summer
    Olympics in Los Angeles amidst the ongoing civil war in the country that erupted
    three years ago. (The Independent)
