wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - Islamabad Memorandum
    - Iran foreign ministry spokesperson Esmail Baghaei tells Iranian state media
      that president Masoud Pezeshkian and U.S. president Donald Trump remotely signed
      the deal to end the war, extend the ceasefire by 60-days, and reopen the Strait
      of Hormuz. Trump reportedly signed the agreement while at the G7 summit during
      a dinner with French president Emmanuel Macron. (Axios) (Arab Times Kuwait)
      (The Hill)
    - American officials officially release the memorandum of understanding agreement
      reached with Iran. (Al Jazeera) (CNN) (Reuters)
    - 2026 Strait of Hormuz crisis
    - 2026 United States naval blockade of Iran
    - Ship tracking websites, including Kpler, MarineTraffic, and TankerTrackers,
      show that three Iranian oil tankers, including two from the National Iranian
      Tanker Company, have escaped the blockade that was imposed on April 13 by the
      United States. Additionally, the Iranian-flagged NITC vessel M/T Stream have
      reached the blockade line as it headed towards the Gulf of Oman. (AFP via Al
      Arabiya) (Al-Monitor)
    - Operation Epic Fury
    - U.S. artificial intelligence chief Cameron Stanley says that the Grok chatbot
      was used to launch 2,000 missiles and munitions at Iran during the operation.
      (The Hill) (Middle East Eye)
    - Gaza war
    - Gaza peace plan
    - The Gaza Health Ministry says that over 1,000 Palestinians have been killed
      in Gaza Strip since the ceasefire was announced last year. (AP)
    - Hamas reports progress in the second phase of ceasefire talks. (Shafaq)
    - The Israel Defense Forces says that they have killed two Hamas militants who
      allegedly took part in the October 7 attacks on Israel over the weekend in a
      airstrike in the central Gaza Strip. (The Times of Israel)
    - 2026 Atlantic hurricane season
    - Tropical Storm Arthur forms, becoming the first tropical cyclone of the season
      after creating significant rainfall across Mexico and Texas, United States.
      (The New York Times)
    - Eleven people are killed and 19 others injured after a bus lost control and
      crashed into a house in Huanuco Region, Peru. (Xinhua)
    - 2026 Ebola epidemic
    - 52nd G7 summit
    - The European Union and G7 nations at the summit in Évian-les-Bains, France,
      pledge funding for the Democratic Republic of the Congo amidst the Ebola epidemic
      in the country, including in Ituri Province. (DW)
    - Sudanese cholera epidemic
    - The TASIS-aligned Peace Government officially declares a cholera outbreak in
      the Kordofan region, with laboratory tests in South Sudan confirming the disease,
      after weeks of acute watery diarrhoea cases in West Kordofan. (The Sudan Times)
    - 2027–2028 United States redistricting
    - In the U.S., the Republican-led Georgia General Assembly rejects governor Brian
      Kemp's attempt to redistrict Georgia's congressional districts for the 2028
      United States House of Representatives elections in the state after state House
      speaker Jon G. Burns announced that he will not hold a vote to do so. (Marietta
      Daily Journal) (The New York Times)
    - Immigration to Europe
    - 'The European Parliament passes a law that aims to accelerate the deportation
      of illegal immigrants. It allows the construction of "return hubs": deportation
      centers outside of the EU. Other provisions of the law regarding illegal immigrants
      include allowing the searching of their residences, increasing their maximum
      prison time, and the imposition of stricter entry bans. (Euronews)'
    - June 2026 President of the Senate of the Philippines election
    - The Philippine Senate elects Sherwin Gatchalian as Senate president, formally
      removing Alan Peter Cayetano and ending a leadership dispute that began on June
      3. Gatchalian receives the support of all 13 senators present during a special
      session. (Philippine Daily Inquirer) (Reuters)
    - Afghanistan's Taliban government imposes a ban on smartphone use by government
      employees, with exemptions requiring approval from supreme leader Hibatullah
      Akhundzada. (AFP via CTV News)
    - The Norwegian palace says that Crown Princess Mette-Marit underwent a lung transplant
      surgery at the Oslo University Hospital. (Reuters)
    - 2026 FIFA World Cup
    - DR Congo at the FIFA World Cup
    - In association football, Yoane Wissa scores the DR Congo's first goal at a FIFA
      World Cup during a 1–1 draw against Portugal in their opening match. (AFP via
      Jamaica Observer)
    - Uzbekistan at the FIFA World Cup
    - Abbosbek Fayzullaev scores Uzbekistan's first goal at a FIFA World Cup during
      a 3–1 loss against Colombia in their opening match. (Reuters)
    - Sudan's women's national under-17 football team makes its first appearance on
      international stage in Morocco in an effort to qualify for the upcoming 2028
      Summer Olympics in Los Angeles amidst the ongoing civil war in the country that
      erupted three years ago. (The Independent)
