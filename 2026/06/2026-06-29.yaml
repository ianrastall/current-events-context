Date: '2026-06-29'
Source_URI: Portal:Current events/2026 June 29
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis, Iran–Oman relations
  - Iran holds its first joint committee meeting with Oman in Muscat to discuss future
    management of the Strait of Hormuz following a preliminary agreement with the
    United States to end the war. U.S. officials say shipping can resume freely. (AFP
    via The Straits Times)
  - 2026 Lebanon war
  - 2026 Israel–Lebanon ceasefire
  - The National News Agency reports that over 40,000 displaced people have returned
    to Lebanon since the ceasefire. (L'Orient Today)
  - Gaza war
  - Israeli forces hit a tent in central Gaza, killing three Palestinians, including
    a 8-year old boy. (AP)
  - Sudanese civil war
  - 2026 Blue Nile campaign
  - The Sudanese Armed Forces announces that they have retaken the towns of Sirkum
    and Mugaja in Sudan's Blue Nile State. (Sudans Post)
  - War crimes during the Sudanese civil war
  - The Armed Conflict Location and Event Data publishes an article accusing the Rapid
    Support Forces of killing more civilians in Sudan, including in 2025, than other
    rebel groups. (Sudan Horizon)
  - 2026 Afghanistan–Pakistan war
  - Pakistani information minister Attaullah Tarar says that Pakistan has carried
    out airstrikes in Afghanistan targeting alleged Jamaat-ul-Ahrar headquarters,
    killing 25 militants in border regions and the eastern provinces of Paktia, Paktika,
    and Kunar. (AFP via Free Malaysia Today)
  - Afghan officials say that over 36 civilians have been killed in overnight strikes
    by Pakistan, and more than 160 have been injured. (AP)
  - Afghan foreign minister Amir Khan Muttaqi summons the chargé d'affaires at the
    Pakistani embassy in Kabul over the airstrikes. (Hasht-e Subh) (India Today)
  - The Michael film grosses to $977 million at the worldwide box office, surpassing
    Oppenheimer as the highest-grossing biographical film. (The Independent)
  - Search for Malaysia Airlines Flight 370
  - Malaysia extends the search for Malaysia Airlines Flight 370, which disappeared
    in 2014 with 239 people aboard, until June 30, 2027, under a contingent fee agreement
    with Ocean Infinity. (AFP via NDTV) (Reuters)
  - China–Japan relations
  - 2025–2026 China–Japan diplomatic crisis
  - China adds 20 Japanese organizations to a dual-use export blacklist and places
    20 others on a watchlist, citing concerns over Japan's military capabilities amid
    worsening relations between China and Japan. (AFP via The Straits Times)
  - Foreign relations of Australia, Foreign relations of Vanuatu
  - Australia and Vanuatu sign the Nakamal Agreement, which expands Australian economic
    support and bars foreign military bases in Vanuatu. Vanuatu also commits to rejecting
    the militarisation of infrastructure. (AFP via Philippine Daily Inquirer)
  - 2026 Stade shooting
  - Six people are killed and several more injured in a mass shooting at a mother-child
    group home facility in Stade, Lower Saxony, Germany. Two people are arrested,
    including the alleged gunman. (CBS News) (DW)
  - 2026 Monaco bombing
  - Three people are injured in a parcel bomb explosion in Monaco. An act of terrorism
    is being suspected. (France 24) (Reuters)
  - Aftermath of the Korean War
  - Recovery of U.S. human remains from the Korean War
  - South Korea holds joint burial ceremonies in Seoul and Daejeon for the remains
    of seven soldiers killed in the Korean War, after recovery efforts from 2007 to
    2025 and DNA identification with surviving relatives. (AA) (Yonhap News Agency)
  - 2026 Peruvian presidential election
  - The National Office of Electoral Processes confirms the victory of Popular Force's
    candidate Keiko Fujimori in the presidential election after 22 days of vote counting.
    Fujimori becomes the first elected female president of Peru. (DW)
