wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - India in the 2026 Iran war
    - Indian petroleum minister Hardeep Singh Puri says that 12 LPG vessels from India
      have successfully transited through the Strait of Hormuz without paying tolls.
      (United News of India)
    - Iran–Oman relations
    - Iran holds its first joint committee meeting with Oman in Muscat to discuss
      future management of the Strait of Hormuz following a preliminary agreement
      with the United States to end the war. U.S. officials say shipping can resume
      freely. (AFP via The Straits Times)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - The National News Agency reports that over 40,000 displaced people have returned
      to Lebanon since the ceasefire. (L'Orient Today)
    - Assassination and terrorism in Iran, Iran internal crisis
    - Gunmen kill two members of Iran's Revolutionary Guards and injure two others
      outside a residence in Paveh, Kermanshah province. Kurdish rights group Hengaw
      says an armed group called Xori Hiwa claims responsibility. (Reuters)
    - Gaza war
    - Israeli forces hit a tent in central Gaza, killing three Palestinians, including
      an 8-year old boy. (AP)
    - Sudanese civil war
    - War crimes during the Sudanese civil war
    - Foreign involvement in the Sudanese civil war
    - Human rights organizations led by the Raoul Wallenberg Centre for Human Rights
      reportedly file a complaint with the International Criminal Court against officials
      from Libya and the United Arab Emirates for their role in atrocities committed
      in the civil war, most notably the Darfur region. (Libya Observer) (Middle East
      Eye)
    - 2026 Blue Nile campaign
    - The Sudanese Armed Forces announces that they have retaken the towns of Sirkum
      and Mugaja in Sudan's Blue Nile State. (Sudans Post)
    - Darfur campaign
    - The joint forces allied with the Sudanese Armed Forces recapture the West Darfur
      town of Kulbus, two years after it was captured by the paramilitary group Rapid
      Support Forces in October 2024. (Sudan Tribune)
    - The Armed Conflict Location and Event Data publishes an article accusing the
      Rapid Support Forces of killing more civilians in Sudan, including in 2025,
      than other rebel groups. (Sudan Horizon)
    - The Yale School of Public Health’s Humanitarian Research Lab reports that the
      Sudanese Armed Forces (SAF) 5th Infantry Division has established checkpoints,
      defensive berms, and trenches in El-Obeid, North Kordofan. (HRL) (Sudan Tribune)
    - 2026 Afghanistan–Pakistan war
    - Pakistani information minister Attaullah Tarar says that Pakistan has carried
      out airstrikes in Afghanistan targeting alleged Jamaat-ul-Ahrar headquarters,
      killing 25 militants in border regions and the eastern provinces of Paktia,
      Paktika, and Kunar. (AFP via Free Malaysia Today)
    - Afghan officials say that over 36 civilians have been killed in overnight strikes
      by Pakistan, and more than 160 have been injured. (AP)
    - Afghan foreign minister Amir Khan Muttaqi summons the chargé d'affaires at the
      Pakistani embassy in Kabul over the airstrikes. (Hasht-e Subh) (India Today)
    - Aftermath of the South Sudanese Civil War
    - Five aid workers are killed and four more injured in an ambush against a convoy
      by unknown gunmen in Duk County, Jonglei State, South Sudan. Several civilians
      are also killed and wounded. (Al Jazeera)
    - Kidnapping in Nigeria
    - Gunmen abduct 36 students and a staff member from a secondary school in Lassa,
      Borno State, Nigeria, while authorities say eight others have been rescued.
      (Reuters)
    - American film Michael grosses to US$977 million in worldwide box offices, surpassing
      Oppenheimer as the highest-grossing biopic. (The Independent)
    - Search for Malaysia Airlines Flight 370
    - Malaysia extends the search for Malaysia Airlines Flight 370, which disappeared
      in 2014 with 239 people aboard, until June 30, 2027, under a contingent fee
      agreement with Ocean Infinity. (AFP via NDTV) (Reuters)
    - Fifteen people are killed and one injured after the collision of a vehicle with
      a cargo truck in Mamou Region, Guinea. (Xinhua)
    - A Seventh Day Adventist church in San Francisco, California, U.S., built in
      1892, catches fire during renovations. (San Francisco Chronicle) (Christian
      News Alert)
    - 2026 European heatwaves
    - The death toll from the heatwaves across Europe increases to over 1,300 people
      killed, including 1,000 in France and over 300 in Spain. (The Independent)
    - Sudanese cholera epidemic
    - Sudan's health ministry and World Health Organization chief Tedros Adhanom Ghebreyesus
      declares a new cholera outbreak, with 117 deaths in the West Kordofan state,
      four months after declaring an end to a previous outbreak that started in July
      2024. (Democrata) (CBC) (AA)
    - China–Japan relations
    - 2025–2026 China–Japan diplomatic crisis
    - China adds 20 Japanese organizations to a dual-use export blacklist and places
      20 others on a watchlist, citing concerns over Japan's military capabilities
      amid worsening relations between China and Japan. (AFP via The Straits Times)
    - Foreign relations of Australia, Foreign relations of Vanuatu
    - Australia and Vanuatu sign the Nakamal Agreement, which expands Australian economic
      support and bars foreign military bases in Vanuatu. Vanuatu also commits to
      rejecting the militarisation of infrastructure. (AFP via Philippine Daily Inquirer)
    - 2026 Stade shooting
    - Six people are killed and several more injured in a mass shooting at a mother-child
      group home facility in Stade, Lower Saxony, Germany. Two people are arrested,
      including the alleged gunman. (CBS News) (DW)
    - 2026 Monaco bombing
    - Ukrainian oligarch Vadym Iermolaiev is critically injured alongside his wife
      and daughter after the explosion of a parcel bomb at a building in Monaco, in
      what seems like an assassination attempt. (France 24) (Reuters)
    - Four family members are found murdered inside their home in Josefina, Zamboanga
      del Sur, Philippines, leaving a sole survivor. (Inquirer)
    - Rough sleeping is formally decriminalized in England and Wales following the
      repeal of the Vagrancy Act 1824 by the government of the United Kingdom. (Housing
      Today)
    - Aftermath of the Korean War
    - Recovery of U.S. human remains from the Korean War
    - South Korea holds joint burial ceremonies in Seoul and Daejeon for the remains
      of seven soldiers killed in the Korean War, after recovery efforts from 2007
      to 2025 and DNA identification with surviving relatives. (AA) (Yonhap News Agency)
    - 2026 Peruvian presidential election
    - The National Office of Electoral Processes confirms the victory of Popular Force's
      candidate Keiko Fujimori in the presidential election after 22 days of vote
      counting. Fujimori becomes the first elected female president of Peru. (DW)
    - Gaza war protests
    - Over 150 demonstrators gather at the presidential palace in Cyprus over a Board
      of Peace multi-day meeting in the country. (Cyprus Mail)
    - Palaeontologists identify a fossil vertebra collected on James Ross Island in
      1985 as the earliest-known dinosaur bone collected in Antarctica, which was
      identified to be a tail bone from a titanosaur. (BBC News) (The Independent)
    - International sporting sanctions during the Russian invasion of Ukraine
    - The International Weightlifting Federation announces that Russian and Belarusian
      weightlifters can return to competition under their national symbols. (Inside
      the Games)
    - 2026 FIFA World Cup
    - In association football, Paraguay defeats Germany in penalty shoot-outs during
      the round of 32, the largest upset since 2018 and the fourth-largest in World
      Cup history. (The Athletic via The New York Times)
    - Palestinian sports during the Gaza war
    - The Palestinian Football Association confirms that Palestinian goalkeeper Saleem
      Khader Al-Ashqar was killed by Israeli forces in the Khan Yunis Governorate
      town of Al-Qarara. (Palestine Chronicle) (WAFA)
