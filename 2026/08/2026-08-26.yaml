Date: '2026-08-26'
Source_URI: Portal:Current events/2026 August 26
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - 2026 Iran–Oman negotiations
  - The Islamic Revolutionary Guard Corps say Iran and Oman have agreed to share revenues
    from the Strait of Hormuz and define their respective maritime areas, while negotiations
    continue over reopening the waterway amid the war. (AFP via The Borneo Post)
  - Iranian deputy foreign minister Kazem Gharibabadi says that Iran will not allow
    military vessels to transit through the strait under the proposed agreement. (AP)
    (Military.com)
  - Analysis of the 2026 Iran war
  - U.S president Donald Trump declares "Mission Accomplished" in Iran amidst signs
    of the war dragging on, invoking the speech by former president George W. Bush
    during the beginning of the Iraq War. (Seattle Times) (New York Daily News)
  - Gaza war
  - The Israel Defense Forces says that they have killed several Hamas members in
    airstrikes in the Gaza Strip city of Jabalia, including on a structure allegedly
    used as a storage facility for weapons. (The Jerusalem Post)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war
  - An overnight Ukrainian drone attack "completely destroys" a Wildberries depot
    in Tambov Oblast, Russia. (Reuters)
  - A man and a 14-year-old child are killed in Lipetsk Oblast, and a woman is killed
    in Belgorod Oblast, in Ukrainian drone strikes. The Russian defence ministry says
    its forces have shot down 426 Ukrainian drones overnight. (Al Jazeera)
  - Luhansk Oblast campaign
  - Nine people are killed after a Ukrainian strike on a bus in Russian-occupied Luhansk.
    (Reuters)
  - 2026 anti-immigrant movement and xenophobia in South Africa
  - A spokesperson for Malian singer Salif Keita confirms that he has cancelled all
    upcoming concerts in South Africa over its response to anti-migrant protests in
    the country. (Channels TV) (Arbiterz)
  - 2026 Nepal floods
  - Flash floods and mudslides along the Trishuli River impact Nepal and Tibet. At
    least 160 people are killed, hundreds are injured and 463 others, including over
    200 tourists, are reported missing in Nepal, while Chinese Communist Party officials
    report three deaths and 265 missing in Tibet, severely affecting Gyirong County
    and its port. (AFP via Jamaica Observer) (AP) (BBC News)
  - Nepali officials say bridges, roads, power stations, and entire villages have
    been swept away by the flash flooding with some areas still completely cut-off
    from search and rescue efforts. (The National)(Al Jazeera)
  - At least 15 infants are killed and another is injured after a fire at a state-run
    hospital in Islamabad, Pakistan. (The Globe and Mail) (The Guardian)
  - Twelve people are killed and at least 54 others are injured as wildfires spread
    across northeastern Algeria during a severe heat wave, with deaths reported in
    Béjaïa, Jijel, and Tizi Ouzou provinces. (AFP via Gulf News)
  - Nineteen cases of Japanese encephalitis are confirmed in Madhesh Province, Nepal,
    causing six deaths. (Nepal News)
  - The U.S. Food and Drug Administration approves the daraxonrasib drug as a treatment
    for metastatic pancreatic cancer, making it the first RAS inhibitor drug to be
    approved for the disease. This came after a previous study showed that it nearly
    doubled the survival rate for patients compared to chemotherapy. (The Guardian)
    (Reuters)
  - South Korea–United States relations, Japan–United States relations
  - The U.S. Pacific Command announces that the United States will conduct trilateral
    military exercises with South Korea's armed forces and Japan's self-defense forces
    despite U.S. president Donald Trump scaling back on the recent Ulchi-Freedom Guardian
    exercises. (AA via TRT World) (Korea Herald)
  - Aftermath of the September 11 attacks
  - The U.S. military trial for al-Qaeda militant Khalid Sheikh Mohammed, the alleged
    mastermind of the September 11 attacks, is set for June 2028 alongside three co-conspirators.
    (NBC News) (Sky News)
  - Deogratius Ndejembi is appointed as Vice President of Tanzania, replacing Emmanuel
    Nchimbi. (The Tanzania Times)
  - In American football, the National Football League announces the elimination of
    the Pro Bowl. (The New York Times)
