wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Ugandan authorities approve a measure to send troops from Uganda to the Gaza
      Strip as part of the International Stabilization Force proposed by the Board
      of Peace to secure the enclave following the war. (NBC News)
    - Yemeni civil war
    - The Houthis announce a military offensive against Saudi-backed government forces
      in Marib Governorate and Hadhramaut Governorate, with over 30 soldiers being
      killed in two missile attacks. (Al Jazeera)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Ukrainian forces launch drone attacks on two oil refineries in Russia, the Yaroslavl
      refinery and a Bashneft-Novoil refinery in Bashkortostan, causing large fires
      at the facilities. (BBC News)
    - Russian strikes against Ukrainian infrastructure
    - Six people are killed in Russian airstrikes across Ukraine, including three
      civilians in Kharkiv Oblast, while a total power outage occurs in the city of
      Kherson after critical infrastructure was targeted overnight by Russian drones.
      (Al Jazeera) (Antikor)
    - Ethiopian civil conflict
    - 2026 Ethiopia–TPLF clashes
    - It is reported that the situation on the border between Ethiopia and Sudan is
      calm following recent clashes between the Ethiopian Army and Tigray People's
      Liberation Front that sparked fears of a new conflict four years after a peace
      agreement was signed in 2022 to end the war in Tigray. (Sudan Tribune)
    - Haitian conflict
    - The United Nations Integrated Office in Haiti reports that 613 people were killed
      and 375 others injured between March 6 and July 31 amid intensifying gang violence
      across the country. (Carribean Broadcasting Corporation)
    - 2026 Damascus bus bombing
    - Two people are killed and 13 others are injured when an explosive device detonates
      on a passenger minibus in Jaramana, Syria. (AA)
    - Proposed acquisition of Warner Bros. Discovery by Paramount Skydance
    - The Competition and Markets Authority of the United Kingdom clears Paramount
      Skydance's US$110 billion acquisition of Warner Bros. Discovery, while culture
      secretary Lisa Nandy declines a public-interest review after receiving commitments
      on editorial independence. (AA)
    - Civil officials state that ten children passengers are reported missing after
      a wooden boat capsized on the Lulua River, Demba Territory, Kasai-Central, Democratic
      Republic of the Congo.(AA)
    - Six people are killed and 19 others are injured after a bus crashed in Constantine
      Province, Algeria. (Xinhua)
    - 2026 Ebola epidemic
    - Congolese health authorities monitor passengers from a boat near Kinshasa, Democratic
      Republic of the Congo, after a traveler died from Ebola complications. (The
      Washington Post)
    - 2026 Morocco–Spain border incident
    - Ceuta mayor-president Juan Jesús Vivas confirms that at least 100 people died
      during last week's migrant surge into the Spanish autonomous city of Ceuta,
      while around 3,500 to 5,000 undocumented migrants remain in the city. (Reuters)
    - Mexican drug war
    - Iguala mass kidnapping
    - Former Guerrero governor Ángel Aguirre Rivero is arrested on charges of forced
      disappearance and obstruction of justice. He is accused of ordering the concealment
      of security camera footage that showed police intercepting a bus carrying students
      in Iguala in 2014, who have never been found. (Reuters)
