  - 2026 Pacific typhoon season
  - Typhoon Dolphin makes landfall in the Ryukyu Islands of Japan, which encompass
    the entirety of Okinawa Prefecture and parts of Kagoshima Prefecture. Additionally,
    China shuts down ports and ferry routes in preparation for the typhoon. (The Japan
    Times)
  - Satellite images show that the British-sanctioned oil tanker Caroline Bezengi,
    believed to be part of the Russian shadow fleet, which was carrying 1 million
    barrels of oil, is leaking oil and sinking further off the coast of Oman, after
    a explosion was reported on the vessel on June 8. The oil leaks have reportedly
    reached the shore of Al-Qibliyah Island. (AP) (Arab News)
