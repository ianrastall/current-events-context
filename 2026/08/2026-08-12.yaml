Date: '2026-08-12'
Source_URI: Portal:Current events/2026 August 12
Intelligence_Payload:
  Uncategorized:
  - Libyan crisis
  - A drone strike is reported on an Zawiya electrical substation in western Libya,
    causing a fire and power outages. (The Hill)
  - Sudanese civil war
  - Kordofan campaign, Siege of El Obeid
  - The Rapid Support Forces launch eight drone and land attacks across El Obeid,
    North Kordofan, and intercepting them using air defenses. Two people are reported
    to be killed during the attacks. (Reuters)
  - RSF launch drone strikes across multiple cities in Sudan, including its capital
    Khartoum, Bahri, and Omdurman in Khartoum State and the River Nile cites of Ad-Damir,
    and Atbara. (Arab News) (The National News)
  - A woman is killed and 172 other people are rescued after a ferry catches fire
    off the coast of Bali, Indonesia. (AFP via RFI)
  - Four people are killed, including the perpetrator, in shooting and stabbing attacks
    at a daycare and a house in Hopkins, Minnesota, United States. (CBS News)
  - 2026 Cook Islands general election
  - Cook Islanders vote to elect all 24 seats of Parliament amid a cost-of-living
    crisis and debate regarding a past partnership agreement with China. Incumbent
    prime minister Mark Brown faces a challenge from Cook Islands United leader Teariki
    Heather. (RNZ) (The Guardian)
  - The Rapid Support Forces-appointed governor of Sudan's Kordofan region, Hamad
    Mohammad Hamad Khalifa, resigns and will defect. (Sudan Tribune) (Al-Arabiya)
  - Solar eclipse of August 12, 2026
  - A total solar eclipse occurs in Greenland, Iceland and Spain, with partial eclipses
    visible over much of northern North America, Europe (except most of Ukraine, Greece,
    Bulgaria and Russia), northwestern Africa and northern Asian Russia. It is the
    first total eclipse observable in mainland Europe since the solar eclipse of August
    11, 1999. (Time and Date) (EclipseWise)
