Date: '2026-08-17'
Source_URI: Portal:Current events/2026 August 17
Intelligence_Payload:
  Uncategorized:
  - Sudanese civil war
  - Kordofan campaign
  - The Sudanese Army says that it has shot down a long-range drone used by the Rapid
    Support Forces in Sudan's North Kordofan state, the second drone shot this month
    in the region. (Sudan Tribune)
  - South Sudanese president Salva Kiir meets with Darfur governor Minni Minnawi in
    Juba, South Sudan, to discuss efforts to end the conflict in Sudan. (Eye Radio)
  - Somali Civil War
  - Constitutional crisis in Somalia, Controversies of Hassan Sheikh Mohamud
  - Several fighters from both sides are killed after Somali federal forces and opposition
    groups clash in the South West State. Two civilians are also killed. Militias
    loyal to former state president Abdiaziz Laftagareen enter the regional capital
    Baidoa, challenging two battalions of the Somali National Army loyal to Somali
    president Hassan Sheikh Mohamud. (Reuters) (Garowe Online) (i24 news)
  - Nigerian bandit conflict
  - At least 22 people are killed in a shooting attack in Kebbe, Sokoto State, Nigeria.
    (Tribune)
  - Terrorism in Afghanistan
  - A explosion is reported at a school in the Dashte Barchi neighborhood of Kabul,
    Afghanistan, injuring several people. Perpetrator is unknown. (Al Jazeera)
  - 2026 Pacific typhoon season
  - Floods and landslides caused by the southwest monsoon and Tropical Storm Kujira
    kill at least 23 people and displace thousands across the Philippines. (AA)
  - A crowd crush at the Ashokdham Temple in Bihar, India, kills at least seven people
    and injures 19 others. (AFP via ABS-CBN News)
  - Seven people are killed and several others are injured after a fire breaks out
    out in a hotel in Birbhum District, West Bengal, India. (Xinhua)
  - Three people are killed when a private helicopter crashes on Sifnos, Greece. (AP)
  - 2026 Ebola epidemic
  - The United Nations reports that at least 2,325 people have died from the current
    Ebola outbreak in the Democratic Republic of Congo, making it the deadliest in
    the country's history. (DW)
  - Seventh cholera pandemic
  - A city official reports that at least 500 people have been hospitalized for severe
    diarrhea, with nearly 150 testing positive for cholera, in Yangon, Myanmar. (AFP
    via CNA)
  - Opposition to Vladimir Putin in Russia, Protests against the Russo-Ukrainian war
  - A Russian court sentences Yabloko deputy chairperson Lev Shlosberg to 11 years
    and one month in prison for discrediting the armed forces and spreading disinformation
    after he publicly condemned the Russo-Ukrainian war. (Reuters)
  - Discord suspends live streaming, screen sharing, and video calls in Brazil to
    comply with an order from the national data protection authority following the
    death of a 13-year-old girl allegedly encouraged to kill herself during an online
    broadcast. (AFP via RFI)
  - The trial of Duane "Keffe D" Davis for his alleged role in the murder of Tupac
    Shakur begins in Las Vegas, Nevada, United States. (BBC News) (CNN)
  - Immigration policy of the second Trump administration
  - United States Customs and Border Protection (CBP) commissioner Rodney S. Scott
    pauses construction of a $1.7 billion border-security project in Big Bend National
    Park, Texas, while the CBP reviews the plan amid bipartisan local opposition and
    environmental concerns. (AFP via RFI)
  - Former South Korean prime minister Kim Min-seok is elected as the new leader of
    the Democratic Party with 54.08% of the vote against its former leader Jung Chung-rae.
    (The Diplomat) (The Korea Herald)
