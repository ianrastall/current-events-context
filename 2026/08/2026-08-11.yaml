  - Pakistan in the 2026 Iran war
  - The Islamic Republic News Agency reports that Pakistani Interior Minister Mohsin
    Naqvi has met Iranian Foreign Minister Abbas Araghchi and Iranian President Masoud
    Pezeshkian, amidst renewed efforts by Pakistan to broker a ceasefire between the
    United States and Iran. (Arab News PK)
  - Pakistani Defence Minister Khawaja Asif says that a deal between the U.S. and
    Iran is close, including arrangement over the Strait of Hormuz. (Bloomberg) (CNBC)
  - 2026 Strait of Hormuz crisis
  - 2026 United States naval blockade of Iran
  - The Wall Street Journal reports that a U.S. military helicopter has fired at the
    rudder of the Panama-flagged container ship Vela ​Nova after crews ignored the
    naval blockade re-imposed in July, contradicting British maritime management that
    it was hit by a missile in the Gulf of Oman. (Reuters)
  - Gaza war
  - The Israeli Army Radio reports that the Israel Defense Forces have targeted a
    Hamas sniper near the Yellow Line in the Gaza Strip, its first strike on the enclave
    in 10 days. (AIN) (The Times of Israel) (The Jerusalem Post)
  - Red Sea crisis
  - The Yemeni government reports that six people have been killed in strikes on a
    cargo ship by the Houthis in the Bab-el-Mandeb. (The New York Times)
  - Sudanese Civil Wars
  - Sudanese civil war
  - Blue Nile campaign
  - A heavy attack on civilians by the Rapid Support Forces and Sudan People's Liberation
    Movement–North is reported in Geissan in Sudan's Blue Nile state, including on
    the main market, surrounding farms, and other shops. (Sudan Tribune)
  - Attacks by the RSF and SPLM-N are also reported in Qaysān on its provincial headquarters
    and a market. (Sudan Tribune in Arabic)
  - Sudanese nomadic conflicts
  - Around 60 people are killed and around 50 others injured in an armed attack during
    a cattle raid in Tonj North County, Warrap State, South Sudan. (AFP via Arab News)
    (Radio Tamazuj)
  - 2026 Colombia earthquake
  - The death toll from the earthquake in Colombia yesterday increases to over 240
    people killed, 570 injured, and at least 3,000 others still missing. Colombian
    president Abelardo de la Espriella declares a national state of emergency in the
    country. (The Guardian)
  - Search operations for the landslide from Sunday conclude in Baguio, Philippines,
    placing the final death toll at 10 people killed. Meanwhile, the national police
    places the nationwide toll from the tropical cyclones and monsoons at 26. (ABS-CBN
    News) (Philippine Daily Inquirer)
  - ​At least 18 killed, around 30 injured in two-vehicle collision in Ismailia Governorate,
    Egypt. (Al Ahram)
  - Three people killed following commercial building fire in Giza, Egypt. (Al Ahram)
  - Four people have been killed and five others injured after an old residential
    building collapsed in Cairo, Egypt. (Gulf News)
  - Syria and weapons of mass destruction
  - The Syrian government confirms their cooperation with the International Atomic
    Energy Agency to purge nuclear materials at a hidden facility following a report
    by Axios on such plan after an agreement between Israel, Syria, and the United
    States. Conversely, Israel threatens to bombard the site again if the materials
    remain, and to prevent access to the site. (AA) (Axios) (The Jerusalem Post)
  - Human rights in Ba'athist Syria, Transitional justice
  - The Criminal Court in Damascus, Syria, sentence deposed president Bashar al-Assad
    and his brother Maher to death in absentia, and former Daraa political security
    director Atef Najib in person, and issue international arrest warrants for all
    for premeditated murder and crimes against humanity. (AFP via The Standard) (The
    National)
  - Capital punishment in Lebanon
  - Lebanon's parliament votes to abolish the death penalty. (BBC News)
  - A United States Marine Corps soldier is released from Russia after having been
    detained there since 2022. (Kyiv Independent)
  - 2026 Hungarian presidential election
  - Former Supreme Court president András Baka is elected as Hungarian president through
    a supermajority and is scheduled to take office on 19 August. He ran uncontested
    as the Tisza Party's candidate, as neither Fidesz nor its partner KNDP nominated
    a candidate. (Reuters)
  - Palestinian sports during the Gaza war
  - The Palestinian Football Association president Jibril Rajoub announces that all
    soccer and sport activities will resume in September, following a three-year suspension
    that began after the outbreak of the Gaza war. (Al Jazeera)
