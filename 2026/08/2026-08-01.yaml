wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - The Bermuda-flagged LNG tanker Gaslog Shanghai, which was carrying LNG oil from
      Qatar, is reported to have been among the two vessels hit yesterday in the Strait
      of Hormuz. (Arab Times Kuwait) (Bloomberg)
    - A tanker near Oman is hit by an unknown projectile. (CNBC)
    - 2026 Iranian strikes on Kuwait
    - The Kuwaiti defense ministry reports that its military has detected and intercepted
      Iranian drones entering the country's airspace. (Kuwait Times)
    - United States embassies in the Middle East warn Americans to depart the region
      amidst fears of a potential escalation in the war. (AFP via Arab News)
    - U.S. president Donald Trump cancels a planned attack against Iran, citing progress
      in ceasefire negotiations. (Axios) (The Japan Times)
    - Gaza war
    - Casualties of the Gaza war, Israeli bombing of the Gaza Strip
    - Israeli airstrikes kill three Palestinians in Gaza City, bringing the total
      casualties in the past 24 hours to seven. (Al-Ahram) (Al Jazeera)
    - Gaza peace plan
    - A Board of Peace official reports that Hamas will disarm its weapons in the
      coming days. (The Times of Israel)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - The Israeli military says it has killed several Hezbollah fighters in an Israeli-held
      area of southern Lebanon, despite a ceasefire framework between Israel and Lebanon.
      (AFP via South China Morning Post)
    - Red Sea crisis
    - The Houthis in Yemen deny reports of imposing tolls on vessels passing through
      the Bab-el-Mandeb strait. (Al Jazeera)
    - Russo-Ukrainian war
    - Foreign involvement in the Russo-Ukrainian war
    - The Washington Post reports that Israeli prime minister Benjamin Netanyahu blocked
      a request by former United States senator Lindsey Graham to transfer an Iron
      Dome system from the U.S. to Ukraine. (Haaretz)
    - Kyiv strikes
    - Kyiv mayor Vitali Klitschko says an overnight Russian missile attack has killed
      at least nine people and injured 24 others, while damaging buildings and causing
      fires across several districts of the Ukrainian capital. (Al Jazeera) (Reuters)
    - Naval warfare in the Russo-Ukrainian war
    - Ukrainian forces sink a Rosatom-owned container ship in the Black Sea, forcing
      its 17-member crew to abandon it. Rosatom says it had been transporting civilian
      goods, including frozen food and construction materials. (BBC News)
    - Sudanese civil war
    - Battle of Khartoum
    - Egypt and Sudan reach an agreement on a 16-month plan to rehabilitate the Jebel
      Aulia Dam south of Khartoum, including the construction of a temporary bridge,
      after the dam was damaged in November 2023 during shelling by the Rapid Support
      Forces. (Sudan Tribune)
    - Terrorism in Colombia
    - 2026 attack on the Norte de Santander Police Command
    - A truck bomb explodes beside a police station in Cúcuta, Norte de Santander,
      Colombia, injuring eleven police officers and three civilians. (AFP via France
      24)
    - Terrorism in Russia
    - 2026 Moscow bombing
    - A woman attempts to set off a bomb inside a coffeehouse in Moscow, Russia, but
      is stopped at the entrance and detonates the explosive. Three people are killed,
      including the perpetrator, and 21 more are injured. (CNN)
    - Iraq in the 2026 Iran war
    - The Arba'in Shia Islam pilgrimage in Iraq is held amidst the Iran war, with
      Iranian pilgrims attending the event. (Al-Monitor)
    - 2026 United States wildfires
    - 2026 Washington wildfires
    - The Old Trails wildfire in northwestern Spokane, Washington, United States,
      burns over , destroying many structures. Residents near Fort Spokane are told
      to evacuate. (CNN) (News.az)
    - 2024–2026 Cuba blackouts
    - Cuba reports a partial collapse of the national power grid, leaving western
      provinces without electricity after transmission lines fail between Matanzas
      and Pinar del Río. (Xinhua)
    - 2026 Aerodiana Cessna 208 crash
    - Thirteen people, including eleven tourists, are killed when a small aircraft
      crashes near the Nazca Lines, Peru, after departing Pisco, Ica. (Firstpost)
    - 2026 Broad Peak avalanche
    - All ten climbers, including Nirmal Purja, are confirmed deceased after an avalanche
      at Broad Peak in Pakistan on July 30. (Al Jazeera)
    - 2026 heat waves
    - Protesters block parts of the main highway connecting Port Sudan and Khartoum
      in Suakin and Jubayt over severe power cuts amidst a heat wave reported by the
      in Red Sea State, Sudan. (Sudan Tribune)
    - Morocco–Spain relations
    - 2026 Morocco–Spain border incident
    - Moroccan security forces clash with hundreds of migrants as they attempt to
      storm the Spanish enclave of Melilla. Several Moroccan security personnel are
      reportedly injured while more than 50 migrants are detained. (Yeni Safak)
    - 2026 Twin Falls shooting
    - Four people are killed, including the perpetrator, and seven others are injured
      in a mass shooting at an In-N-Out restaurant in Twin Falls, Idaho, United States.
      (CNN) (Reuters)
    - Cyberwarfare during the 2026 Iran war
    - The U.S. FBI opens an investigation after the U.S. state of Michigan reports
      a cyberattack on its water systems, including whether Iran was behind the cyberattack,
      a day after Minnesota reported a similar breach. (Al Jazeera) (ABC News)
    - Four workers are killed in a mass shooting in Nyanga, Western Cape, South Africa,
      while they were repairing a flat tyre. (The Witness)
    - 2030 FIFA World Cup controversies
    - UEFA gives FIFA president Gianni Infantino an ultimatum to resign or face an
      emergency no-confidence vote following Infantino's plan to sell stakes in FIFA
      Forward Enterprise, which he has rescinded amidst backlash. (BBC Sport) (The
      Telegraph)
