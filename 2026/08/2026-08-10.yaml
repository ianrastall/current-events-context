Date: '2026-08-10'
Source_URI: Portal:Current events/2026 August 10
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - 2026 United States naval blockade of Iran
  - The United States Central Command says that they have redirected 55 vessels linked
    to Iran since reinstating the blockade last July. (Middle East Eye)
  - Impact of the 2026 Iran war on Iran
  - Iranian Supreme Leader Mojtaba Khamenei appoints new leaders for Iran's military
    to replace their predecessors after they were killed during the initial U.S. and
    Israel airstrikes, including Ali Abdollahi as chief of staff, Kioumars Heydari
    as deputy commander, and Hossein Taeb as Basij commander. (The Jerusalem Post)
    (Al-Monitor)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war
  - Russian state media claims that at least 13 people were killed, including a child,
    and 39 others were injured in a Ukrainian drone attack on an oil refinery in Nizhnekamsk,
    Tartarstan, Russia. (Reuters)
  - 2026 Colombia earthquake
  - A earthquake strikes Chocó Department, Colombia, causing widespread and heavy
    damage, and killing at least 111 people. (El Pais) (BBC News) (Reuters)
  - The Cathedral Basilica of Our Lady of the Rosary in Manizales is confirmed to
    be among the buildings damaged after one of the towers collapsed following the
    earthquake. (The Independent) (The City Paper Bogota) (El Colombiano)
  - Wildfires in 2026
  - A recent wildfire at the Bromo Tengger Semeru National Park in East Java, Indonesia,
    is extinguished after were burnt. However, new hotspots are also reported near
    the caldera. (Reuters)
  - The Philippine civil defense office reports that at least 16 people were killed
    across Luzon, including seven in Baguio, by floods, landslides and weather-related
    accidents after nine days of heavy monsoon rain, while three others remain missing.
    (AFP via RFI)
  - 2026 Ebola epidemic
  - The World Health Organization reports that the Ebola outbreak in the Democratic
    Republic of the Congo started in February before its declaration, with some cases
    attributed to malaria and typhoid. (Al Jazeera)
  - Colombia–Israel relations, Colombia–Syria relations
  - Colombia becomes the second country to recognize the Golan Heights, a region in
    southwestern Syria that has been under Israeli occupation since 1967, as part
    of Israel's sovereignty. (The Jerusalem Post)
  - 2026 Russian legislative election
  - Upon petition from Rodina, the liberal Yabloko party is barred from participating
    in the 2026 Russian legislative election on charges of unregistered funding, copyright
    infringement and extremism by the Supreme Court of Russia. (The Moscow Times)
  - Murder of Mir Raza Ali
  - In Pakistan, the Sindh government announces that a judicial commission headed
    by a judge of the Sindh High Court would investigate businessman Mir Raza Ali's
    death. The decision followed a recommendation by the Sindh Assembly. (Dawn)
  - Aftermath of the 2026 Nonthaburi shootings
  - Nonthaburi Provincial Administrative Organization president Thongchai Yenprasert
    is killed in a shooting at a government building in Nonthaburi province, Thailand.
    Former parliament member Chalong Riewrang is taken into custody over corruption.
    (BBC News) (AFP via CNA) (Thairath)
  - A shooting at a Chicago elementary school kills two staff members, one of whom
    is believed by police to be the gunman. (MSN News)
