wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Gaza peace plan
    - A Board of Peace envoy meets Israeli prime minister Benjamin Netanyahu and urges
      a halt in strikes across the Gaza Strip. However, they also announce that Israel
      will not withdraw from the enclave until Hamas completely disarms. (The New
      Region) (The Washington Post)
    - Casualties of the Gaza war
    - The United Nations Office for the Coordination of Humanitarian Affairs reports
      that dozens of children and civilians have been killed in Israeli attacks on
      Gaza over the weekend, violating the ongoing ceasefire. (Xinhua)
    - Two Palestinian civilians are killed in an Israeli missile strike near a mosque
      which targeted a civilian vehicle southwest of Gaza City. (Middle East Eye)
    - Gaza war hostage crisis
    - The Israel Defense Forces (IDF) claim that they have killed Palestinian Islamic
      Jihad commander Mahmoud Fatair, who took part in the abduction of Rom Braslavski,
      in the Deir al-Balah area of the Gaza Strip during the Nova music festival massacre
      on October 7, 2023.(The Jerusalem Post)
    - The IDF claim that they have killed two Hamas militants in separate airstrikes
      in central Gaza and the Shati camp in Gaza City respectively, violating the
      ongoing ceasefire. (The Times of Israel)
    - Red Sea crisis
    - Shipping data shows that two tanker ships carrying oil from Saudi Arabia, the
      Suezmax Malta-flagged Lesvos and the VLCC Desh Vaibhav, have exited the Red
      Sea through the Bab-el-Mandeb strait. (Reuters)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - At least seven people, including three children, are killed and 40 others are
      injured when drone debris falls on a crowded beach in Gelendzhik, Krasnodar
      Krai, Russia. (CNN)
    - 2026 Venezuela earthquakes
    - The death toll from the two earthquakes that hit Venezuela in June exceeds 6,000
      people according to figures from lawmaker Jorge Rodríguez. (Reuters)
    - At least fourteen people are killed in a series of floods in southern India.
      (Reuters)
    - Guatemala's disaster agency declares a nationwide orange alert following a major
      eruption of Fuego volcano and begins evacuating two nearby villages. (AFP via
      RNZ)
    - 2020–2026 H5N1 outbreak
    - Scotland's NatureScot denies a 2026 licence for hunting northern gannets on
      Sula Sgeir, citing possible harm to the local gannet population after recent
      bird-flu deaths. (AFP via RFI)
    - 2026 European heatwaves
    - Italy experiences its fourth heatwave of the summer with the health ministry
      issuing red alerts for a record 25 cities. (AA)
    - 2026 United States cyclosporiasis outbreak
    - Michigan, U.S., reports the first two deaths of the current cyclosporiasis outbreak,
      which is caused by cyclospora cayetanensis. (AP)
    - COVID-19 pandemic in Poland
    - The Polish health ministry appeals a Brussels court ruling that ordered the
      country to accept and pay approximately €1.3 billion for unwanted COVID-19 vaccine
      doses produced by Pfizer and BioNTech. (Politico EU)
    - South African news outlets report that over 170 people have been murdered in
      the Western Cape, South Africa in the past 2 weeks. (Independent Online)
    - Human rights in Russia
    - Russian opposition politician Boris Nadezhdin, who attempted to contest the
      2024 presidential election on a platform against the Russo-Ukrainian war, announces
      that he has fled the country to France following growing pressure on him and
      his family. (The Moscow Times)
    - 2026 WTA Tour
    - 2026 Mubadala DC Open
    - In tennis, Alexandra Eala becomes the first Filipino player and the first player
      from Southeast Asia to win a WTA Tour title after defeating Jessica Pegula 4–6,
      6–4, 6–0 to win the women's singles title at the 2026 Washington DC Open. (AFP
      via RFI) (ESPN)
    - In horse racing, Churchill Downs Incorporated and the New York Racing Association
      announce a new championship series for 3-year old Thoroughbreds beginning in
      2027, involving the Kentucky Derby and Belmont Stakes, but notably omitting
      the traditional middle leg of the U.S. Triple Crown, the Preakness Stakes. (Courier
      Journal) (The Daily Gazette)
    - Major League Soccer, the top flight of men's soccer in the U.S. and Canada,
      announces that Larry Berg, currently a co-owner of Los Angeles FC (LAFC) in
      that league, will succeed Don Garber as league commissioner at the start of
      2027. Berg will sell his interest in LAFC before assuming his new position.
      (AP) (The Guardian)
