Date: '2026-08-03'
Source_URI: Portal:Current events/2026 August 3
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - Gaza war
  - Gaza peace plan
  - A Board of Peace envoy meets Israeli prime minister Benjamin Netanyahu and urges
    a halt in strikes across the Gaza Strip. However, they also announce that Israel
    will not withdraw from the enclave until Hamas completely disarms. (The New Region)
    (The Washington Post)
  - Casualties of the Gaza war
  - The United Nations Office for the Coordination of Humanitarian Affairs reports
    that dozens of children and civilians have been killed in weekend attacks in Gaza.
    (Xinhua)
  - Two Palestinians are reported to have been killed in an Israeli missile strike
    near a mosque at a civilian vehicle southwest of Gaza City. (Middle East Eye)
  - The Israel Defense Forces says that they have killed two Hamas militants in separate
    airstrikes in central Gaza and the Shati camp in Gaza City respectively, including
    a Nukhba Force commander who took part in the October 7 attacks. (The Times of
    Israel)
  - Red Sea crisis
  - Shipping data shows that two tanker ships carrying oil from Saudi Arabia, the
    Suezmax Malta-flagged Lesvos and the VLCC Desh Vaibhav, have exited the Red Sea
    through the Bab-el-Mandeb strait. (Reuters)
  - Russo-Ukrainian war
  - At least seven people are killed, including three children, and 40 others are
    injured in a Ukrainian drone strike on a crowded beach in Gelendzhik, Krasnodar
    Krai, Russia. (CNN)
  - 2026 Venezuela earthquakes
  - The death toll from the two earthquakes that hit Venezuela in June exceeds past
    6,000 according to figures from lawmaker Jorge Rodríguez. (Reuters)
  - At least fourteen people are killed in a series of floods in southern India. (Reuters)
  - 2020–2026 H5N1 outbreak
  - Scotland's NatureScot denies a 2026 licence for hunting northern gannets (known
    locally as "gugas") on Sula Sgeir, citing possible harm to the local gannet population
    after recent bird-flu deaths. (AFP via RFI)
  - 2026 European heatwaves
  - Italy experiences its fourth heatwave of the summer with the health ministry issuing
    red alerts for a record 25 cities. (AA)
  - 2026 United States cyclosporiasis outbreak
  - Michigan, U.S., reports the first two deaths of the current cyclosporiasis outbreak,
    which is caused by cyclospora cayetanensis. (AP)
  - COVID-19 pandemic in Poland
  - Poland's health ministry appeals a Brussels court ruling ordering the country
    to accept and pay approximately €1.3 billion for unwanted COVID-19 vaccine doses
    produced by Pfizer and BioNTech. (Politico EU)
  - Human rights in Russia
  - Russian opposition politician Boris Nadezhdin, who attempted to contest the 2024
    presidential election on a platform against the Russo-Ukrainian war, announces
    that he has fled the country to France following growing pressure on him and his
    family. (The Moscow Times)
  - 2026 WTA Tour
  - 2026 Mubadala DC Open
  - In tennis, Alexandra Eala becomes the first Filipino player to win a WTA Tour
    title after defeating Jessica Pegula 4–6, 6–4, 6–0 to win the women's singles
    title at the 2026 Washington DC Open. (AFP via RFI)
  - In horse racing, Churchill Downs Incorporated and the New York Racing Association
    announce a new championship series for 3-year old Thoroughbreds beginning in 2027,
    involving the Kentucky Derby and Belmont Stakes, but notably omitting the traditional
    middle leg of the U.S. Triple Crown, the Preakness Stakes. (Courier Journal) (The
    Daily Gazette)
  - Major League Soccer, the top flight of men's soccer in the U.S. and Canada, announces
    that Larry Berg, currently a co-owner of Los Angeles FC (LAFC) in that league,
    will succeed Don Garber as league commissioner at the start of 2027. Berg will
    sell his interest in LAFC before assuming his new position. (AP) (The Guardian)
