Date: '2026-08-28'
Source_URI: Portal:Current events/2026 August 28
Intelligence_Payload:
  Uncategorized:
  - Gaza war
  - Israeli incursions in the West Bank during the Gaza war
  - The Israel Defense Forces (IDF) says that they have killed three Palestinian militants,
    including Islamic Jihad (PIJ) senior member Qais Bitawi, in a drone strike in
    the Israel-occupied West Bank city of Jenin. The PIJ also confirms Bitawi's death.
    (Reuters) (The Times of Israel)
  - Sudanese civil war
  - Blue Nile campaign
  - Sudan's Rapid Support Forces (RSF) says that they have seized the Bakori and Surkum
    army bases in the southeastern Blue Nile region alongside Sudan People's Liberation
    Movement–North (SPLM–N). (Sudan Tribune)
  - Kordofan campaign
  - Emergency Lawyers, an independent group documenting atrocities in Sudan, reports
    that eight civilians have been killed in drone strikes in the Sowdari District
    of North Kordofan. (AP) (Asharq Al Awsat)
  - The Japanese finance ministry says it spent a record ¥15.4 trillion (US$96 billion)
    between July 30 and August 26 to support the yen, marking the country's largest
    monthly currency intervention on record. (AFP via France 24)
  - Seventh cholera pandemic
  - Nigeria records 65,000 cases of cholera, across 35 states, alongside 10,000 cases
    of diphtheria. Additionally, NCDC director Jide Idris reports a decline in cholera
    cases but also warn that transmission of cases remain ongoing. (The Nation NG)
    (Daily Trust)
  - Corruption in Ecuador
  - An Ecuadorian court convicts former president Lenín Moreno of bribery linked to
    the construction of the Coca Codo Sinclair plant in Napo Province. His wife, Rocío
    González Navas, and daughter are also found guilty. (Reuters)
  - Protests against Donald Trump
  - Demonstrators gather in Washington, D.C., United States, to protest against the
    Trump administration's alleged efforts to rollback voting and civil rights, 63
    years after the March on Washington rally by civil rights leader Martin Luther
    King Jr. (Reuters)
  - Scam centers in Cambodia
  - The Cambodian government says that they have closed more than 700 online scam
    centers and arrested nearly 30,000 suspects, including 15 senior officials and
    law-enforcement officers, during a year-long crackdown on cybercrime networks.
    (Euronews)
  - Two men steal a 200-carat platinum-and-diamond necklace from the Museum of Applied
    Arts in Vienna, Austria, after smashing a display case with a hammer and fleeing,
    according to Austrian police. (AFP via CBS News)
  - Two teenagers are arrested in Israel for allegedly pledging allegiance to ISIS
    and plotting an attack on security forces at the Temple Mount and an IDF base
    in northern Israel. (Ynetnews) (The Times of Israel)
  - Death and state funeral of Harald V
  - King Harald V of Norway dies at the age of 89 after a 35-year reign and is succeeded
    by his son Haakon VIII. (AP) (BBC News) (CNN)
  - Forced contraception of women in Greenland
  - Greenland establishes a truth and reconciliation commission after experts conclude
    that a decades-long Danish contraceptive program violated Inuit women's rights
    but disagree on whether it constituted genocide. (Al Jazeera)
  - 2026–27 NHL season
  - In ice hockey, the Colorado Avalanche sign defenceman and alternate captain Cale
    Makar to a eight-year extension worth US$163.2 million, the largest contract in
    National Hockey League history. He is the first player to exceed past $20 million
    in average annual value. (The Athletic via The New York Times) (CBS Sports) (ESPN)
