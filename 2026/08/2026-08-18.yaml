Date: '2026-08-18'
Source_URI: Portal:Current events/2026 August 18
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - The United Kingdom Maritime Trade Operations reports that a cargo vessel has come
    under attack in the Strait of Hormuz, leaving one dead. (Al Jazeera)
  - United Arab Emirates in the 2026 Iran war
  - The United Arab Emirates's defence ministry detects two missiles fired from Iran
    towards the country, including one that fell outside territorial waters and another
    that fell within it. (Gulf News) (Khaleej Times) (Emirates 24/7)
  - Russo-Ukrainian war
  - Attacks in Russia during the Russo-Ukrainian war, Russia–United Kingdom relations
  - British prime minister Andy Burnham confirms that the United Kingdom will continue
    to militarily support Ukraine after Russia warned the UK will face "consequences"
    for allowing Ukraine to use British-made drones to strike targets deep inside
    Russian territory. (BBC News)
  - Russian attacks on civilians in the Russo-Ukrainian war
  - A Russian ballistic missile strike kills ten civilians and injures eight others
    in Pechenihy, Kharkiv Oblast. Several homes are completely destroyed. (AP)
  - Zaporizhzhia Nuclear Power Plant crisis
  - A drone strike hits a bus stop near the Zaporizhzhia Nuclear Power Plant in Enerhodar,
    killing one plant worker and injuring several others. (Reuters)
  - Sudanese civil war
  - Blue Nile campaign
  - The Sudanese Doctors Network reports that recent attacks in Geissan of Sudan's
    Blue Nile region has displaced over 5,000 people to Damazin. (Sudan Horizon)
  - Darfur campaign
  - The Rapid Support Forces launches a major crackdown in Nyala, South Darfur, its
    largest security and military mobilization since seizing the city in 2023. (Sudan
    Tribune)
  - At least eight people are killed and more than 20 others are injured after a vehicle
    rams into a truck in Madhya Pradesh, India. (Xinhua)
  - Three people are killed after an explosion at a thermal power plant in Baniyas,
    Syria. (Xinhua)
  - A second earthquake strikes the province of Granada, in Spain. Damage and injures
    are reported in Granada and the surrounding area, while the Alhambra is evacuated.
    (Expansión in Spanish)
  - The UK Health Security Agency confrims that an outbreak of salmonella in the UK
    has left one person dead and hundreds more ill. The outbreak is believed to be
    linked to imported eggs. (BBC News)
  - 2026 Zamboanga City school shooting
  - A student is killed while nine other people are injured in a mass shooting at
    a junior secondary school building of the Ateneo de Zamboanga University in Zamboanga
    City, Philippines. The perpetrator, also a student, later kills himself. (Reuters)
    (The Philippine Star)
  - Imprisonment of Imran Khan
  - Pakistan's Supreme Court orders imprisoned former prime minister Imran Khan transferred
    from the central jail in Rawalpindi, Punjab, to Shifa International Hospital in
    Islamabad for medical examinations following a petition by his lawyers concerning
    his health. (AFP via RFI)
  - Singapore begins requiring major Internet messaging platforms to restrict unsolicited
    contacts and social media services to verify advertisers and block suspected scam
    advertisements under new anti-scam rules, with penalties of up to S$1 million
    (US$780,000) for non-compliance. (AFP via The Manila Times)
  - 2026 Zambian general election
  - Zambian president Hakainde Hichilema is declared the winner by the electoral commission,
    re-electing him to a second term. (AP)
