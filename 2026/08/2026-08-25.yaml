  - Canada announces retaliatory tariffs on about US$20 billion worth of U.S. annual
    imports in response to the 50% tariffs by U.S. president Donald Trump and his
    administration. (Reuters)
  - Economic consequences of the Russo-Ukrainian war
  - Boycott of Russia and Belarus, Belarus–Latvia relations, Latvia–Russia relations
  - Latvia's cabinet ministry announces that the country will ban imported goods from
    Belarus and Russia starting September 1. (LIGA)
  - South Korean automaker Hyundai Motor Company reaches a deal to end a month of
    walkouts by workers. (AFP)
  - 2026 Venezuela earthquakes
  - The death toll for the earthquakes in Venezuela this June exceeds past 6,500,
