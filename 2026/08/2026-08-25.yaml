  - Sudanese civil war
  - Kordofan campaign
  - Around 27 people, including four children, are reported to be killed by Sudan
    People's Liberation Movement–North (SPLM-N) militants in the South Kordofan areas
    of Kadugli and Abu Hitan. (Middle East Monitor)
  - War crimes in the Sudanese civil war
  - Sudan’s Ministry of Human Resources and Social Welfare reports that 224 cases
    of child sexual violence has been documented since the conflict. (Sudan Tribune)
  - AI boom, Artificial intelligence in music
  - The Australian Recording Industry Association bans wholly AI-generated music from
    appearing on its charts starting in September 2026. The ruling aims to distinguish
    fully AI-generated music and AI-assisted music, where the track is human-created
    but uses AI as a supporting tool. (DW)
  - Death of Dolly Parton
  - American country music singer and actress Dolly Parton, dubbed the Queen of Country,
    dies at the age of 80. (The New York Times) (Reuters) (Variety)
  - Canada–United States relations
