  - Sudanese civil war
  - Blue Nile campaign
  - Sudan's army repels a Rapid Support Forces attack on the town of Al-Keli in the
    Blue Nile region. (Sudan Tribune)
  - Around 12 people are reported killed in a airstrike near border with Chad. (Al
    Jazeera)
  - Sudanese nomadic conflicts
  - Around 49 people are killed in a cattle raid on the Machar-Pakuek cattle camp
    in Mading Juer Boma in Tonj North County of South Sudan's Warrap state. (The New
    Arab)
  - 2026 Canadian wildfires
  - In Canada, British Columbia ends its state of emergency, which was previously
    imposed on August 8 this month in response to wildfires that killed one person.
    (The Canadian Press News) (CTV News)
  - A section of the Trans-Canada Highway in the Fraser Canyon reopens after being
    closed for seven weeks due to the wildfires. (Redfm) (CTV News)
  - 2026 Nepal floods
  - The United States Geological Survey says a glacial collapse and debris flow, not
    an earthquake, caused the seismic event near the Nepal–Tibet border and subsequent
    flooding that killed at least 392 people and left over 900 more missing. (BBC)
  - U.S. officials report that 90 Americans have been reported missing since the floods,
    with the U.S. State Department reporting that three have been rescued. (AP)
  - 2026 Atlantic hurricane season
  - Tropical Storm Dolly forms in the Atlantic Ocean. The World Meteorological Organization
    clarifies there is no connection between the storm's name and to the death of
    former American country singer Dolly Parton, being merely coincidental. (The New
    York Times) (PBS)
  - 2026 Flores earthquake
  - The death toll from the earthquake that struck the Flores island in East Nusa
    Tenggara, Indonesia, rises to 111, with 176,000 people displaced. (A News) (AA)
  - Incidents at Six Flags parks
  - The X2 roller coaster at the Six Flags Magic Mountain amusement park in Valencia,
    California, U.S., closes after two riders were recently hospitalized for brain
    injuries including hemorrhages. (The Hollywood Reporter) (CNN)
  - Six people die after a pump boat carrying 13 passengers capsizes while crossing
    the Mapanuepe Lake in San Marcelino, Zambales, Philippines. Three others remain
    missing. (The Philippine Star)
  - 2026 European heatwaves
  - Germany's Robert Koch Institute estimates 15,800 heat-related deaths during summer
    2026, the highest total in a decade of monitoring, as repeated heat waves push
    temperatures above . (Kurdistan 24).
  - 2026 Gosen-Neu Zittau school stabbing
  - Two people are killed in a stabbing at a private school in Gosen-Neu Zittau, Brandenburg,
    Germany. A suspect is arrested. (Xinhua)
  - Ethnic cleansing in the Bosnian War
  - Former Bosnian Serb Republika Srpska army officer Ratko Mladić, who was convicted
    by the former Yugoslavia International Criminal Tribunal for his role in the Srebrenica
    massacre during the Bosnian genocide, dies in custody at the United Nations Detention
    Unit at the The Hague. (Reuters)
  - 2026 Zambian general election
  - Zambian presidential candidate Brian Mundubile surrenders to police and is questioned
    over an alleged national security threat after two weeks in hiding following the
    disputed presidential election, in which he finished second. (AFP via France 24)
  - U.S. president Donald Trump signs an executive order directing federal agencies
    to call Lake Ontario "Lake America." The change applies only to U.S. federal usage;
    Canada need not adopt it, and no international authority exclusively determines
    names of shared waters. (AP) (The Guardian)
  - The Korea AeroSpace Administration says that the Nuri will launch 15 satellites,
    a record, into space from the Naro Space Center in South Korea's Goheung County
    on October 7. (Korea Times) (Yonhap)
  - August 2026 lunar eclipse
  - A near-total partial lunar eclipse occurs over the Americas, Africa and Europe.
    (TimeandDate)
  - 2026 Diamond League
  - Brazilian Alison dos Santos and American Masai Russell breaks the world records
    in men's 400 metres (45.80 seconds) and women's 100 metres hurdles (12.09 seconds),
    respectively, at the 2026 Weltklasse Zürich in Zurich, Switzerland. (Reuters)
