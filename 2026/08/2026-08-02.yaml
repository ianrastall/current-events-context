Date: '2026-08-02'
Source_URI: Portal:Current events/2026 August 2
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - Iranian lawmaker Hassan Ghashghavi says that efforts to restore the Islamabad
    Memorandum deal between Iran and the United States are underway. (AFP via Arab
    News)
  - 2026 Strait of Hormuz crisis
  - Iranian foreign minister Abbas Araghchi says that Iran and Oman are nearing a
    deal to manage the Strait of Hormuz after the U.S. halted its recent strikes against
    the country. (Al Jazeera)
  - Gaza war
  - The Israel Defense Forces (IDF) confirms that they have killed three militants
    in separate strikes last week, including a Jaish al-Islam militant in Gaza City,
    a Hamas commander in the Jabalya Battalion, and a Palestinian Islamic Jihad militant.
    (The Jerusalem Post)
  - Hezbollah–Israel conflict
  - The IDF's 401st Brigade says that they have destroyed 1,200 Hezbollah tunnels
    and concluded their mission in southern Lebanon, ending their eight-month deployment.
    (Israel National News) (The Jerusalem Post)
  - Sudanese civil war
  - Darfur campaign, Darfur genocide
  - A drone strike hits a customary court in Kabkabiya District, North Darfur, Sudan,
    killing at least 37 people. (Al Jazeera)
  - Insurgency in Khyber Pakhtunkhwa
  - Police say a suspected suicide bombing outside a police station in Kabal, Khyber
    Pakhtunkhwa, Pakistan, killed at least 14 people, including five officers and
    the suspected bomber, and injured at least 18 others. (Reuters)
  - Mali War, Mali–Russia relations
  - The BBC reports that Russia has shipped military equipment on the sanctioned cargo
    vessel Mikhail Britnev last month to the Malian government. (BBC News) (RBC-Ukraine)
  - 2026 Greece wildfires
  - Two people are killed when two firefighting helicopters collided near Athens,
    Greece. (BBC News)
  - 2026 Morocco–Spain border incident
  - Spanish officials say at least 72 people died during a mass migrant crossing from
    Morocco into the autonomous city of Ceuta, while the Moroccan interior ministry
    reports 11 deaths. (Reuters)
  - Six people are killed and 27 more injured in a traffic collision between a bus,
    a camper and three cars in Colli sul Velino, Province of Rieti, Italy. (Xinhua)
  - A ferry catches fire off the coast of Madura, Indonesia, leaving at least five
    people dead and 41 others missing. (BBC News)
  - South Korea's weather agency records in Yangsan, South Gyeongsang, the country's
    highest temperature since observations began. (AFP via France 24)
  - Foreign relations of the Dominican Republic, Foreign relations of Venezuela
  - The Dominican Republic and Venezuela agree on a framework to gradually restore
    diplomatic relations, which deteriorated after the Dominican Republic questioned
    the results of the 2024 Venezuelan presidential election. (AFP via Jamaica Observer)
  - 2026 Brazilian general election
  - Incumbent Brazilian president Luiz Inácio Lula da Silva formally announces his
    candidacy for a fourth term as the Workers' Party's nominee in October’s presidential
    election. (AFP via France 24)
