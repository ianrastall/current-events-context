Date: '2026-08-21'
Source_URI: Portal:Current events/2026 August 21
Intelligence_Payload:
  Uncategorized:
  - Russo-Ukrainian war
  - Kryvyi Rih strikes, Russian attacks on civilians in the Russo-Ukrainian war
  - Russian drone strikes on a mall in Kryvyi Rih, Dnipropetrovsk Oblast, Ukraine,
    kill at least 16 people and injure more than 130 others, including 22 children.
    (Reuters)
  - Insurgency in Khyber Pakhtunkhwa
  - Pakistani forces raid multiple hideouts and kill 49 militants allegedly belonging
    to the Pakistani Taliban and the Balochistan Liberation Army in Khyber Pakhtunkhwa.
    (AP)
  - Myanmar civil war
  - Resistance fighters and a local activist say Myanmar's military deployed hundreds
    of troops around the proposed Dawei Special Economic Zone in the Tanintharyi Region,
    burning villages and pushing resistance groups back as the government seeks to
    revive the project. (Reuters)
  - Ethiopian civil conflict
  - The annual Ashenda festival in Mekelle, Tigray Region, Ethiopia, is cancelled
    over drone strike fears. (BBC News) (Binance)
  - The Odyssey reaches US$1.35 billion at the worldwide box office to become the
    highest-grossing R-rated film, surpassing Deadpool & Wolverine. (The Guardian)
  - The Panama Canal announces it will limit the number of ships allowed to cross
    the passage over the next month due to El Niño causing droughts in the region.
    (DW)
  - Three people are killed and six more wounded in an explosion at a house in the
    Ain al-Qasab village of Idlib, Syria. (AA) (Middle East Eye)
  - Project Elephant
  - India's Supreme Court orders states to protect elephant corridors, identify and
    remove obstructions, and prohibit groups from using fire to drive wild elephants
    away amid increasing habitat loss and human-elephant conflict. (AFP via France
    24)
  - 2026 Fagersta school stabbing
  - A person is killed and three other people are injured in a mass stabbing, carried
    out with a sword, at a high school in Fagersta, Sweden. The perpetrator is arrested
    at the scene. (Reuters)
  - Capital punishment in Japan
  - Japan executes a 58-year-old man for a 2009 arson attack that killed five people
    at a pachinko parlor in Osaka. It is the first execution under Sanae Takaichi's
    premiership. (AFP via The Star) (The Japan Times)
  - Lawsuits involving TikTok
  - TikTok agrees to pay $400 million to settle a United States justice department
    lawsuit alleging violations of federal children's privacy law through the collection
    of personal data from users under 13 without parental consent. (AFP via France
    24)
  - War crimes in the Gaza war, Humanitarian aid during the Gaza war, Gaza genocide
  - Turkish justice minister Akın Gürlek announces that Turkey has issued an Interpol
    arrest warrant for Israeli prime minister Benjamin Netanyahu for his role in attacks
    on activists seeking to deliver humanitarian aid to Gaza. (France 24) (Reuters)
  - The Hong Kong Court of First Instance convicts Lee Cheuk-yan and Chow Hang-tung
    of incitement to subversion over their leadership of a group that organized annual
    Tiananmen crackdown vigils. They face up to 10 years in prison. (AFP via RFI)
  - In Mexico, Sinaloan governor Rubén Rocha Moya resumes office after a four-month
    suspension while contesting U.S. drug-trafficking charges and an extradition request.
    Mexican prosecutors say they find insufficient evidence linking him to criminal
    conduct. (AFP via France 24)
  - 2026–27 Malaysia Super League
  - In association football, Johor Darul Ta'zim claims a world record for the longest
    unbeaten run in top-flight league play, reaching 109 matches after defeating Kuching
    City 3–0 in Malaysia's Super League. (AFP via RFI)
