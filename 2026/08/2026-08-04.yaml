Date: '2026-08-04'
Source_URI: Portal:Current events/2026 August 4
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - Gaza war
  - Casualties of the Gaza war
  - A mass funeral is held for 112 bodies that were recovered from a Israeli strike
    in the Sabra neighborhood of Gaza City during the early weeks of the war. (Haaretz)
  - Red Sea crisis
  - Yemen's internationally recognized government says a projectile attack sank the
    Indian-flagged cargo ship MSV Faize Noore Oliya in the Red Sea near the coast
    of Hodeidah, with all 14 crew members rescued. (AFP via Arab News)
  - Sudanese civil war
  - Darfur campaign
  - Rapid Support Forces senior commander and brigadier general Mahdi Adam Ismail,
    also known as Jebel Moon, is confirmed to be killed during clashes with the Sudanese
    Armed Forces and the Joint Forces in West Darfur, Sudan. His death is confirmed
    by Sudan Liberation Movement leader and Darfur governor Minni Arko Minnawi. (Sudan
    Tribune) (Sudan Nabaa)
  - 2026 European heatwaves
  - Austria records in Vienna, the highest temperature in the country's history, as
    a heat wave also brings wildfires and historically low Danube water levels. (Xinhua)
  - Brazil–United States relations
  - The United States revokes the visa of Brazilian ambassador Maria Luiza Ribeiro
    Viotti to reciprocate Brazil's denial of visas to two U.S. diplomats. The State
    Department says the action does not expel Viotti from the country. (AFP via New
    Straits Times)
  - Colombian conflict
  - Colombia's Special Jurisdiction for Peace charges 27 former FARC members, including
    ex-commander Timoleón Jiménez, with crimes against humanity and sexual violence
    committed during the conflict, including killings, disappearances, displacement,
    and rape. (AFP via The Manila Times)
  - Kyrgyz president Sadyr Japarov signs a law banning the use of cremation for deceased
    human bodies in Kyrgyzstan. (AKIPress) (Kabar)
  - South Sudan's police arrests 60 suspected gang members in a series of operations
    targeting criminal gangs, drug trafficking, and youth delinquency in Juba. (Sudans
    Post)
  - Four people are killed and four others are injured in a shooting spree by a rogue
    Russian soldier in Sevastopol, Russian-occupied Crimea. (CBS News)
  - In basketball, the Women's National Basketball Association (WNBA) announces that
    the expansion team in Cleveland, Ohio, U.S., will be called the Sirens. The organization
    will debut in 2028. (The Athletic via The New York Times)
