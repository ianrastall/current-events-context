wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - Iran and Oman reach an agreement understanding on geographic coordinates for
      shipping routes through the Strait of Hormuz. (Reuters) (Euronews)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Talks between Israel and Lebanon are on pause following alleged leaks and will
      resume tomorrow. (Al-Monitor)
    - Hezbollah–Israel conflict
    - The Israel Defense Forces (IDF) says they have launched strikes in southern
      Lebanon after alleged ceasefire violations by Hezbollah. (The Times of Israel)
    - Two Israeli soldiers are killed in action and four others are wounded in an
      improvised explosive device bombing in Majdal Zoun, South Governorate, Lebanon.
      (Anadolu Ajansı)
    - Gaza war
    - IDF chief Eyal Zamir visits the Gaza Strip to conduct an assessment in the enclave.
      He also states that the military will continue to operate proactively. (The
      Jerusalem Post)
    - Russo-Ukrainian war
    - Kyiv strikes
    - Russian forces launch dozens of ballistic missiles and drones at Kyiv, Ukraine,
      killing at least 17 people, including eight civilians at a railway station in
      Kyiv Oblast, and wounding dozens more. None of the missiles were intercepted
      by Ukrainian forces due to a shortage of Patriot missiles, according to president
      Volodymyr Zelenskyy. (The Guardian)
    - Five people are killed after two vehicles collided head-on and burst into flames
      on the Stuart Highway, Australia. (Xinhua)
    - The U.S. Food and Drug Administration approves Moderna's mRNA influenza vaccine
      for people aged 50 and older. (Time) (Reuters)
    - International sanctions against Iran
    - The United States Treasury Department lifts sanctions against Fly Baghdad, which
      were previously imposed in 2024 over its links to Iran's Islamic Revolutionary
      Guard Corps Quds Force. (Al-Monitor) (Reuters)
    - Pastoral trips made by Pope Leo XIV, Argentina–Holy See relations, Holy See–Peru
      relations, Holy See–Uruguay relations
    - The Holy See Press Office announces Pope Leo XIV will make an apostolic journey
      to Argentina, Uruguay, and his home country of Peru, in November, marking his
      first trip to Latin America in his papacy. (AP) (Holy See)
    - Crime in Karachi
    - Murder of Mir Raza Ali
    - Sindh Police detain 19 people for questioning as part of the investigation into
      the murder of Karachi entrepreneur and Wafflix founder Mir Raza Ali. (Daily
      Pakistan) (ARY News)
    - Far-right politics in Germany
    - The Hanseatic Higher Regional Court in Hamburg, Germany, convicts seven members
      and one supporter of a right-wing extremist group called Last Defense Wave and
      sentences them to prison for attempted murder, arson, aggravated assault, and
      being members of a terrorist organisation for planning and carrying out arson
      and bomb attacks on asylum seeker shelters. (AP)
    - War on drugs, Illegal drug trade in Latin America, Crime in Spain
    - The Spanish Civil Guard and the Ecuadorian National Police announce they have
      arrested 44 people and confiscated 21 tons of cocaine as part of a multiyear
      investigation on a drug trafficking ring financed by investors in Dubai, United
      Arab Emirates. (AP)
    - A drone loaded with explosives is found and defused at Leipzig/Halle Airport
      in Germany, while a cargo Boeing 757 had a collision with another supposed UAV
      at the same airport. (Reuters) (DW)
    - Aftermath of the July Uprising
    - Former Bangladesh prime minister Sheikh Hasina announces that she plans to return
      to the country from exile in New Delhi, India, despite facing a death sentence
      for her role during a violent crackdown on protesters that led to her resignation
      two years ago. (Sky News)
