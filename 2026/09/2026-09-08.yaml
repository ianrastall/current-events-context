Intelligence_Payload:
  Uncategorized:
  - Yemeni civil war
  - 2026 Yemen offensive, Houthi–Saudi Arabian conflict
  - September 2026 Houthi strikes on Saudi Arabia
  - Houthi forces launch ballistic missiles and drones at several locations in Saudi
    Arabia, injuring 73 people, including civilians, and causing fires that temporarily
    halt operations at some energy facilities. (Reuters)
  - The confirmed toll of the offensive in western Yemen increases to 500 people killed,
    including 278 Houthi fighters, 216 soldiers of the Yemeni Armed Forces and 29
    civilians. (AFP via LBC Group)
  - The toll from yesterday's Saudi airstrike against a prison in Al-Jawf Governorate
    increases to 17 people killed and seven more wounded. (Saba News Agency)
  - Russo-Ukrainian war
  - Kyiv strikes, Russian attacks on civilians in the Russo-Ukrainian war
  - Russia launches drones and missiles at Kyiv, Ukraine, following a weekend pause
    in strikes, killing five people and injuring at least 10. The attacks damage civilian
    infrastructure at at least 16 locations and cause fires in five districts. (The
    Pioneer) (Reuters)
  - Sudanese civil war
  - Kordofan campaign
  - Around 13 people are killed in a drone strike by the Rapid Support Forces on a
    courthouse in Umm Ruwaba, North Kordofan. (Sudan Horizon)
  - Peace talks are held by mediators from the African Union, the Intergovernmental
    Authority on Development, the Arab League, the European Union and the United Nations,
    in Khartoum, Sudan, in a effort to end the three-year long civil war, with UN
    envoy Pekka Haavisto attending the talks. (Arab News)
  - Canada–United States relations
  - 2025–2026 United States trade war with Canada and Mexico
  - Canada's retaliatory tariffs of 15% to 50% on CA$27.6 billion (US$19.9 billion)
    of U.S. goods, including steel, dairy products, appliances, agricultural equipment,
    paper products, and electronics, take effect in response to U.S. tariffs on Canadian
    imports. (AFP via France 24)
  - Israel–United Kingdom relations, Israeli occupation of the West Bank, Legality
    of Israeli settlements
  - The British government announces it will ban imports of all goods from Israeli
    settlements in the West Bank, as well as some services, including financing, construction,
    infrastructure, real estate, and advertising. (Telegraph India)
  - 2026 Nepal–Tibet floods
  - The National Disaster Risk Reduction and Management Authority reports that 13,583
    people have been rescued so far since flash floods ravaged Nepal. (The Rising
    Nepal)
  - A MBB Bo 105 helicopter operating for the Flying Doctors of Malaysia crashes near
    Long Lellang, Sarawak, Malaysia, killing all five onboard. (Reuters) (The Star)
  - Bosnia and Herzegovina–Serbia relations
  - Bosnia declares two Serbian embassy diplomats, military attaché Milan Dulanović
    and Security Intelligence Agency representative advisor at the embassy Darko Maksimović,
    as persona non grata after attending the funeral of convicted war criminal Ratko
    Mladić in Belgrade. (Reuters)
  - Israel–United Kingdom relations
  - In return to the sanctions by the UK government, the Israeli government announces
    it will close the UK consulate in East Jerusalem. Israel also forbids Britain
    from participating in the US-led mission for Gaza, and bans some British officials,
    including former Labour leader Jeremy Corbyn, from entering the country. (The
    North West Star)
  - Nicaragua v. Germany, German support for Israel in the Gaza war
  - Nicaragua accuses Germany of facilitating the commission of genocide in the Gaza
    Strip by providing military support to Israel. Germany responds that it is one
    of the largest donors to the Palestinian territories and that German exports to
    Israel are subject to licensing requirements. France 24
  - Famine in Sudan
  - A famine is reported across Sudan's Jebel Marra area in the Darfur region, with
    20 people dying from hunger and diseases. (Sudan Tribune)
  - 2026 North American heat wave
  - A third-year student in the marching band at the University of Iowa in Iowa City,
    Iowa, U.S., dies after collapsing during extreme heat at the Iowa Hawkeyes season
    opener. Temperatures reached 94F at the time of the game. (The Guardian) (The
    Athletic via The New York Times)
  - Indonesia's food agency suspends nearly 2,000 kitchens in its national free meals
    programme after they fail to register for mandatory sanitation inspections, as
    the agency strengthens food safety measures following widespread food poisoning
    cases. (Reuters)
  - 2026 Musée Renoir theft
  - Thieves steal and by Pierre-Auguste Renoir from the in Cagnes-sur-Mer, Alpes-Maritimes,
    France. The works have an estimated value of €9 million. (BBC News)
  - AI boom
  - OpenAI claims to have solved the Navier-Stokes Millennium Prize problem, with
    the announcement raising questions about plagiarism. (BBC News) (Scientific American)
  - 2026 NCAA Division I FBS football season
  - In American college football, Mid-American Conference commissioner Jon Steinbrecher
    says that the conference has filed a appeal to overturn the results of the Western
    Michigan Broncos–Michigan game, which ended in a game–winning Hail Mary pass for
    Michigan after officials during the game added 1 second on the clock. (The Hill)
