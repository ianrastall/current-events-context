Date: '2026-09-05'
Source_URI: Portal:Current events/2026 September 5
Intelligence_Payload:
  Uncategorized:
  - Russo-Ukrainian war
  - Peace negotiations in the Russo-Ukrainian war, United States and the Russo-Ukrainian
    war
  - Russia and Ukraine agree to halt strikes on Kyiv and Moscow, respectively, during
    United States-mediated peace talks, as U.S. envoys Jared Kushner and Steve Witkoff
    meet Russian president Vladimir Putin in Moscow before traveling to Kyiv. (AFP
    via Dawn)
  - Kyiv strikes
  - A Russian missile strike kills two people and damages multiple residential buildings
    in Bucha, Kyiv Oblast, Ukraine. (UA News)
  - Russian occupation of Dnipropetrovsk Oblast
  - A Russian airstrike on Kamianske, Dnipropetrovsk Oblast, Ukraine, kills four people
    and injures five others, including one critically, according to Dnipropetrovsk
    governor Oleksandr Hanza. (SANA)
  - 2026 Iran war
  - The United States Central Command says its forces have destroyed three Iranian
    oil tankers linked to the Islamic Revolutionary Guard Corps, including one in
    the Gulf of Oman, after alleged Iranian missile attacks on U.S. naval vessels.
    (AFP via France 24) (BBC News)
  - 2026 Pacific typhoon season
  - Typhoon Saudel
  - One person is killed and eleven others are reported missing after a mudslide buries
    a village and damages 12 homes in Suichuan County, Jiangxi, China. (AP)
  - A Greek F-4 Phantom jet crashes during an air show at Tanagra Air Base near Athens,
    Greece, killing both pilots. (Reuters)
  - Tens of thousands of people rally in Zagreb, Croatia, demanding the removal of
    about 37,000 tonnes of illegally dumped hazardous waste from Gospić and a ban
    on waste imports amid concerns over soil and groundwater contamination. (AP)
  - United Kingdom anti-immigration protests
  - Hundreds of masked protesters block the Port of Dover in Kent, England, and chant
    "stop the boats", causing massive disruption to traffic and train services. (BBC
    News)
  - Philippine vice president Sara Duterte posts ₱360,000 (US$5,740) bail on three
    counts of grave threats, prompting a regional trial court to lift her arrest warrant.
    The charges concern alleged threats against president Bongbong Marcos, first lady
    Liza Araneta Marcos, and former House speaker Martin Romualdez. (AP)
  - 2026 Italian Grand Prix
  - In Formula One, Aston Martin driver Lance Stroll becomes the first driver to be
    knocked out in Q1 100 times after doing so at the 2026 Italian Grand Prix. (Motorsport)
  - At the same Grand Prix, Alpine driver Pierre Gasly achieves his maiden pole position
    after qualifying first, the first French driver to do so since Jean Alesi in 1997.
    (F1)
