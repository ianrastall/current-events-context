    (Times of India)
  - The MV Tuğberk İmamoğlu cargo ship sinks in the Marmara Sea after a collision
    with an oil tanker, leaving ten people missing. (Euronews)
  - An explosion at the Augsburg train station in Swabia, Germany, injures two people.
    The cause is unknown. (Euronews)
  - A crew member is killed, six others are missing, and one is rescued when a tugboat
    capsizes and sinks off the coast of Busan, South Korea. (AP)
  - A study published in the New England Journal of Medicine reports that the RAS
    inhibitor drug daraxonrasib, which was approved by the U.S. Food and Drug Administration
    as a treatment for metastatic pancreatic cancer, also shows promise against lung
    cancer. (Nature) (NBC News)
  - 2026 Leipzig Airport drone incidents
