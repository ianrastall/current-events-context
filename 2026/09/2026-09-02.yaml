  - 2026 Estonian presidential election
  - Chancellor of Justice Ülle Madise, the only candidate, is elected by the Riigikogu
    as President of Estonia. She will be sworn into office on October 12, succeeding
    Alar Karis. (ERR) (Reuters)
  - In association football, Major League Soccer announces that all 27 teams from
    the United States will return to the U.S. Open Cup beginning in 2027, making it
    the first full participation in the tournament since 2023. (ESPN)
  - In basketball, the NBA announces the results of its investigation into the Los
    Angeles Clippers' signing of star player Kawhi Leonard in 2022. The league determines
    that the Clippers violated the league salary cap via a series of external dealings.
    Penalties include fines of $30 million for the Clippers and $700,000 for Leonard,
    the loss of the Clippers' first-round picks in each draft from 2029–2033, and
    a one-year suspension for Clippers owner Steve Ballmer. (ESPN)
