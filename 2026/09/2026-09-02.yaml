    "foreign-directed sabotage and left-wing extremism". (DW)'
  - Houben centre bomb threat
  - Darren James Service pleads guilty to two charges relating to a hoax bomb threat
    that targeted the Houben Centre in Belfast when then Irish Minister for Foreign
