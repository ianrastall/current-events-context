Date: '2026-09-04'
Source_URI: Portal:Current events/2026 September 4
Intelligence_Payload:
  Uncategorized:
  - Gaza war
  - Aftermath of the Battle of Sufa
  - The Israel Defense Forces says that Nukhba Force commander Mohammad Mahmoud Marshad
    al-Qadi, who led the invasion of the Sufa post during the October 7 attacks on
    Israel, was killed in a airstrike in Khan Yunis, Gaza Strip. (The Times of Israel)
  - Yemeni civil war
  - Over 120 people are confirmed to have been killed since yesterday during the clashes
    between Houthis and the Yemeni Armed Forces in western Yemen. (Yahoo Answer via
    AFP)
  - An Argentine judge orders the repatriation of Giacomo Ceruti's 18th-century painting
    Portrait of a Lady, looted by Nazi Germany from Dutch Jewish art dealer Jacques
    Goudstikker during World War II, to Goudstikker's daughter-in-law Marei von Saher.
    (AFP via France 24)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - The American Automobile Association reports that the average U.S. diesel price
    reached a record $5.85 per gallon, up from $3.71 a year earlier, amid disruptions
    to global energy markets caused by the Iran war. (AFP via France 24)
  - 2026 European drought, 2026 European heatwaves
  - France allocates more than €1 billion to support farms affected by drought and
    heatwaves, including compensation for crop losses, liquidity assistance, tax relief,
    and support for fertilizer and agricultural diesel costs. (The Peninsula)
  - The U.S. National Highway Traffic Safety Administration opens an investigation
    into whether Tesla's new Cybercab robotaxi models are properly certified and demonstrates
    compliance with motor vehicle safety standards. (Reuters)
  - 2026 Nepal floods
  - The Nepali Army rescues two people from a tunnel at the Upper Trishuli 3A Hydropower
    Station in Rasuwa District, a week after floods ravaged the country. (NBC News)
  - 2026 East Malaysia haze
  - Malaysia declares a state of emergency in Serian Division, Sarawak, after haze
    from wildfires in nearby Kalimantan, Indonesia, pushed air pollution above hazardous
    levels, closing 647 schools. (AFP via France 24)
  - New Zealand becomes the second country after Australia to authorize pharmaceutical-grade
    MDMA for severe post-traumatic stress disorder, with Medsafe allowing two psychiatrists
    to prescribe it alongside psychotherapy in controlled clinical settings. (AFP
    via France 24)
  - The United Nations General Assembly adopts a resolution supporting the Equal Earth
    map projection over the Mercator projection, with 164 countries voting in favor,
    one against (United States), and six abstaining. (The Guardian)
  - A Philippine regional trial court issues an arrest warrant for vice president
    Sara Duterte on three counts of grave threats against president Bongbong Marcos,
    first lady Liza Araneta Marcos, and former House speaker Martin Romualdez, setting
    bail at ₱120,000 (US$2,000) per count. (Reuters)
  - Police in Guangxi, China, arrest 52 Singaporeans over suspected involvement in
    illegal pyramid-scheme activities as part of a broader law-enforcement operation.
    Singapore's foreign ministry says it is providing consular assistance. (Reuters)
  - Meloni government
  - Prime Minister Giorgia Meloni's government becomes the longest serving in Italy
    during the postwar era. (DW)
  - The remains of former King Rukidi IV of the Tooro Kingdom return to Uganda for
    his burial. (BBC News) (Reuters)
