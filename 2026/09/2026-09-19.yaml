Date: '2026-09-19'
Source_URI: Portal:Current events/2026 September 19
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Iran war ceasefire
  - Supreme National Security Council Secretary Mohsen Rezaee says that Iran has set
    seven conditions for resuming ceasefire negotiations with the United States. (Iran
    International)
  - 2026 Strait of Hormuz crisis
  - United States Central Command commander Brad Cooper says that oil, cargo, and
    and liquefied natural gas shipments in the Strait of Hormuz have hit a six-month
    high. (Bloomberg) (Middle East Eye)
  - 2026 Atlantic hurricane season
  - Tropical Depression Six forms in the Atlantic Ocean near the Azores amidst a unusually
    quiet Atlantic hurricane season caused by El Niño. (WTSP) (Fox Weather)
  - 2026 Indonesia wildfires, Indonesia–Malaysia relations
  - Indonesia accepts Malaysian assistance to combat wildfires in Kalimantan, including
    a Bombardier CL-415MP aircraft, three helicopters, and 52 personnel, as the fires
    cause transboundary haze affecting Southeast Asia. (AFP via France 24)
  - Eritrea–United States relations
  - The U.S. treasury department lifts the sanctions against Eritrea's ruling party
    previously imposed by former U.S. president Joe Biden's administration. (AP)
  - 2026 Russian legislative election
  - Russian election commission chairperson Ella Pamfilova reports cyberattacks targeting
    Russia's online voting system during the second day of the parliamentary election
    and says they are repelled. The Minkomsvyaz separately reports thwarting a sabotage
    attempt on Far Eastern communication lines. (ABC News Australia)
  - 2026 South Ossetian presidential election
  - Marat Kambolov is declared the winner of the presidential elections in the partially
    recognized South Ossetia. (Reuters)
  - 2026 World Rugby Pacific Nations Cup
  - In rugby union, hosts Japan win their fourth Pacific Nations Cup title after defeating
    the defending champions Fiji 20–15 in the final at Chichibunomiya Stadium in Tokyo.
    (AFP via RFI)
