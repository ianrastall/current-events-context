  - 2026 Strait of Hormuz crisis
  - The IRNA reports that Iran's Islamic Revolutionary Guard Corps has hit the Togo-flagged
    oil tanker Trend as it attempted to pass the Strait of Hormuz. (AFP via FMT) (Al
