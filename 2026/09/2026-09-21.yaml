  - Saudi Arabia–United Kingdom relations
  - British prime minister Andy Burnham says that the United Kingdom will offer Saudi
    Arabia aerial refueling in its ongoing conflict with the Houthis. (The Hill)
  - 2026 Afghanistan–Pakistan war
  - Pakistan's military launches strikes over the Afghanistan–Pakistan border in retaliation
    for the 2026 Kohat attack. Afghanistan's government and the UNAMA report that
    a family of three was killed in the strikes, while Pakistan says the strikes killed
    28 Pakistani Taliban militants. (Reuters)
  - Houthi–Saudi Arabian conflict
  - The Red Sea International Film Festival in Saudi Arabia is postponed to 2027 due
    to the ongoing conflict with the Houthis. (Arab News) (Gulf News)
  - 2026 California wildfires
  - Two pilots are killed in a helicopter crash while fighting a wildfire in Yosemite
    National Park, California, United States. (Reuters)
  - Korean conflict
  - An explosion injures three South Korean military officers during an operation
    inside the Demilitarized Zone, south of the military demarcation line. The Joint
    Chiefs of Staff says the cause remains unknown. (AFP via The Peninsula)
  - New Zealand's critically endangered black robin wins Forest & Bird's Bird of the
    Year competition with more than 26,000 votes out of about 105,000 votes. (AFP)
  - Singapore's Land Transport Authority introduces fines of up to S$500 (US$390)
    for eating on public buses or placing feet on seats, while severe cleanliness
    or safety violations can incur penalties of up to S$5,000 (US$3,900). (AFP)
