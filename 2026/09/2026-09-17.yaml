Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - Gaza war
  - Israeli government response to the October 7 attacks
  - Lt. Col. “Aleph”, chief police officer in the Southern Command's Gaza Division,
    is dismissed following his role in the failures leading to the Hamas-led October
    7 attacks on Israel. (The Times of Israel)
  - The Israel Defense Forces confirm that they have killed a Al-Qassam Brigades Nukhba
    Forces commander who took part in the October 7 attacks in a airstrike and a Hamas
    navy officer in another airstrike in Gaza City. (Israel National News) (JFeed)
  - 2026 Iran war
  - US war crimes in Iran strikes
  - The UN Independent International Fact-Finding Mission finds that they have found
    "reasonable grounds" that the U.S. military may have committed war crimes with
    attacks on the Minab school and Lamerd sports hall. (Reuters)
  - Yemeni civil war
  - 2026 Yemen offensives
  - Al-Akhbar reports that Saudi Arabia has sent a proposal for Oman to mediate a
    two-week ceasefire with the Houthis. (AzerNews)
  - A Yemeni resident is reported to be killed by debris from a drone in Taif, Mecca
    Province. (Arab News)
  - Environmental policy of the second Trump administration
  - The United States Fish and Wildlife Service narrows its enforcement of the Endangered
    Species Act by excluding unintentional wildlife deaths from its definition of
    prohibited take, including foreseeable deaths linked to activities such as commercial
    fishing and logging. (AFP via France 24)
  - Biologists publish a study in the journal Current Biology describing a new species
    of wild cat belonging to the genus Leopardus, commonly called the "tilcayo", in
    the Yungas cloud forests of Bolivia. This discovery marks the first new cat species
    in over 100 years. (Cell) (Reuters)
  - Israel–Serbia relations
  - Serbian President Aleksandar Vučić inaugurates a factory for Israeli-made drones
    that will be produced in the country's Krušik company, with Vučić stating that
    it will employ 100 people and produce advanced equipment for the Serbian military.
    (AP)
  - 2026 Swedish general election
  - Ulf Kristersson announces his resignation as Prime Minister of Sweden after his
    right-wing bloc win 173 seats in the Riksdag, compared to 176 won by the opposition,
    led by Magdalena Andersson. (Al Jazeera) (BBC News)
  - Visa policy of Australia
  - Australia tightens visa rules for international students and working holidaymakers,
    restricts visa switching, and increases enforcement against overstayers as it
    seeks to reduce net overseas migration to 225,000 by 2027–28 and ease pressure
    on housing. (AFP via France 24)
