Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - Oman's navy says that they have rescued 16 crew members from a Saudi Arabia-flagged
    oil tanker SIDR that was attacked a week ago in the Strait of Hormuz. (MENA via
    The New Arab)
  - Hezbollah–Israeli conflict
  - 2026 Lebanon war, Israeli attacks on the Lebanese health sector during the Israel-Hezbollah
    conflict
  - Nine people, including two children, are killed, and five others are injured in
    an Israeli airstrike on a residential building in Kfar Reman, Lebanon. Separately,
    in the same city, two medics are killed in another airstrike on a vehicle. (Al
    Jazeera)
  - 2026 Yemen offensive
  - More than 300 people are killed amid the deadliest fighting in the Yemeni civil
    war since 2022. (AFP via Barron's).
  - Eleven climbers are killed and six others are injured after an avalanche struck
    a group of 33 on Mount Mizhirgi in Kabardino-Balkaria, Russia. Six other climbers
    are missing as rescuers continue search operations. (Firstpost)
  - Tourism in Tokyo
  - The government of Shinjuku, Tokyo, Japan, announces plans to prohibit more than
    half of its vacation rentals in residential areas and near schools after complaints
    increase over noise, smoking, trespassing and improper waste disposal. (AFP via
    France 24)
  - 2026 East Malaysia haze
  - Malaysia lifts the state of emergency in Serian Division, Sarawak, after air pollution
    fell below hazardous levels, although several areas remain "very unhealthy" because
    of smoke from wildfires in Indonesia. (AFP via France 24)
  - Greenland and the European Union
  - European Commission president Ursula von der Leyen announces that Greenland and
    the European Union have reached a €200 million (US$232.5 million) partnership
    deal. (Reuters)
  - North Korea–Russia relations
  - North Korea and Russia opens their first road bridge at its border, solidifying
    its relationship. (The Independent)
  - Flood control projects scandal in the Philippines
  - The Philippine Sandiganbayan appellate court issues an arrest warrant for Leyte's
    1st district representative and former House speaker Martin Romualdez after the
    Office of the Ombudsman filed charges of plunder against him for the alleged ₱7.44
    billion (US$118.62 million) worth of kickbacks he received from flood control,
    infrastructure, and other government projects. (Reuters)
  - A military funeral and burial is held for convicted war criminal Ratko Mladić
    in Belgrade, Serbia, despite objections from the European Union. (The Guardian)
    (Al Jazeera)
  - In Australian rules football, the Australian Football League introduces limits
    on contact training from the 2027 preseason to reduce concussion risk, capping
    weekly contact at 120 minutes initially and 160 minutes later while prohibiting
    high-intensity sessions on consecutive days. (AFP via France 24)
