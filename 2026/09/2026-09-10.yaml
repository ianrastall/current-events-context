  - Russo-Ukrainian war
  - Russia launches drone strikes at Ukraine, killing at least seven people. (Al Jazeera)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - Crude oil prices in the United States, including from Brent Crude and West Texas
    Intermediate, reach US$100, the highest since May, amidst renewed tensions between
    the U.S. and Iran. (CNBC)
  - The International Monetary Fund reports that the global growth of the global economy
    is on track to reach 3% in 2026 despite the war in Iran, but also cautioned that
    risks still remain high. (Reuters)
  - At least 20 people are killed and five others are reported missing after a fire
    breaks out on a cargo ship in Qingdao, Shandong, China. (CNN)
  - 2026 Bangladesh measles outbreak
  - Seven more children died from suspected measles in Bangladesh in the past 24 hours,
    bringing the total number of deaths in the country to 1,009. (The Business Standard)
  - Ministry of Health and Family Welfare Sardar Md. Sakhawat Husain announces that
    Bangladesh will resume nationwide vaccinations beginning on September 25 amidst
    the ongoing measles outbreak. (South Asian Herald)
  - Algeria–United Arab Emirates relations
  - Algeria cuts diplomatic relations with the United Arab Emirates, without specifying
    a reason. (Reuters)
  - Latin America–United States relations, War on drugs
  - Peruvian president Keiko Fujimori announces that the country will join the Shield
    of the Americas coalition against drug cartels following a visit from U.S. Secretary
    of State Marco Rubio. (Reuters)
  - Hutch Organised Crime Gang
  - Jason Hutch, a son of alleged crime boss Gerry Hutch, appears in court charged
    with facilitating a criminal organisation, the same day he was extradited from
    Spain. (RTÉ)
  - Sri Lanka's Supreme Court overturns a 2019 presidential pardon granted to Buddhist
    monk Galagoda Aththe Gnanasara and orders him to serve the remainder of his six-year
    prison sentence for criminally intimidating human rights activist Sandya Eknelygoda.
    (AFP via France 24)
  - Switzerland publishes a 200-page dossier on the Nazi war criminal Josef Mengele,
