Date: '2026-09-13'
Source_URI: Portal:Current events/2026 September 13
Intelligence_Payload:
  Uncategorized:
  - Hezbollah–Israel conflict
  - The Ghana Army says that Battalion 92 of the United Nations Interim Force in Lebanon
    will return to Ghana following a year of duty in southern Lebanon. (Ghana Web)
  - Russo-Ukrainian war
  - A Russian drone attacks a train bound for Warsaw, Poland, at Yahodyn station in
    western Ukraine. (BBC News)
  - Sinking of the Virgo Transport 8
  - Six people die, 97 are rescued and 140 remain missing after the sinking of the
    Virgo Transport 8 ferry in the Java Sea, Indonesia. (BBC News)
  - Sinking of the MV Matui
  - One person dies, 12 are rescued, and more than 30 remain missing after the sinking
    of the MV Matui ferry off Espiritu Santo, Vanuatu, during rough seas. (ABC News
    Australia) (The Guardian)
  - Myanmar's Union Government revokes Kyaw Moe Tun's status as the country's permanent
    representative to the United Nations, accusing him of illegal activities, as the
    UN Credentials Committee prepares to consider the country's disputed representation.
    (AFP via France 24)
  - Turkish police detain at least 47 people in raids targeting LGBTQ+ organizations
    and venues across several provinces. The justice ministry says investigations
    involve 162 suspects, nine associations and 13 businesses over alleged offences
    including prostitution and obscenity. (UPI)
  - 2026 Swedish general election
  - Swedes vote to elect all 349 seats of the Riksdag. Incumbent prime minister Ulf
    Kristersson, who seeks to lead the Moderates to a second consecutive government
    while including the right-wing populist Sweden Democrats in his cabinet, is being
    challenged by the former prime minister and SAP leader Magdalena Andersson. Preliminary
    results indicate that the Red-Greens and the Centre Party are projected to have
    a combined total of 175 seats, while the four Tidö parties are projected to have
    a total of 174 seats. (AP) (DW)
  - Kosovo political deadlock
  - The Assembly of Kosovo is declared constituted by acting president and speaker
    Albulena Haxhiu, but without the deputy speaker from the PDK. The Assembly then
    accepts the fourth cabinet of incumbent prime minister Albin Kurti. The PDK and
    the AAK both challenge the legitimacy of Kurti's government at the Constitutional
    Court. (AP) (Reuters)
  - 2026 Formula One World Championship
  - 2026 Spanish Grand Prix
  - In Formula One racing, Kimi Antonelli wins the inaugural Spanish Grand Prix at
    the Madring in Madrid, Spain. (ESPN)
  - 2026 FIBA Women's Basketball World Cup
  - In basketball, the United States women's team defeats France 97–79 in the final
    to win the FIBA Women's Basketball World Cup in Berlin, Germany, further extending
    their lead of 12 total wins. (USA Today)
  - American player Breanna Stewart is awarded MVP of the tournament, while Belgian
    player Emma Meesseman is the top scorer, averaging 21 points per game. (USA Today)
  - 2026 US Open
  - In tennis, Alexander Zverev wins the men's singles title of the 2026 US Open after
    defeating Ben Shelton in the final, 6–3, 7–6(7–2), 5–7, 6–2. It is his first US
    Open title and second major title overall. (AFP via France 24)
  - 2026 World Athletics Ultimate Championship
  - British middle-distance runner Josh Kerr wins the inaugural World Athletics Ultimate
    Championship in the 1500 metres event in Budapest, Hungary's National Athletics
    Centre. (The Independent)
  - Melissa Jefferson-Wooden and Kenny Bednarek win the inaugural women's and men's
    200 metres at the World Athletics Ultimate Championship. (The Athletic via The
    New York Times)
