    Houthis. (UA News)
  - 2026 Iran war
  - 2026 Iranian strikes on Jordan
  - Iran's Islamic Revolutionary Guard Corps launch missiles at the Muwaffaq Salti
    Air Base in Azraq, Jordan, reporting damage to maintenance facilities, deployment
    areas, and hangars. Jordan says its forces have intercepted 18 Iranian missiles,
    following United States strikes that destroyed five Iranian oil tankers. (AFP
