  - Death and state funeral of Harald V
  - The state funeral of King Harald V takes place at the Oslo Cathedral in Oslo,
    Norway. (CNN) (The New York Times)
  - 2026 Pacific hurricane season
  - Hurricane Lowell makes landfall across the south shore of Kauai, Hawaii, U.S.,
    including at a Sheraton resort, with the hotel's oceanfront restaurant reportedly
    destroyed. (NBC News)
  - Sokolniki Suche train collision
  - A train collides with a truck at a level crossing in Sokolniki Suche, Poland,
    killing one person and injuring 20 others. (TVP World)
  - Fourteen people are killed and eleven others are injured in an explosion at a
    weapons depot in Sarmada, Syria. (AP)
  - Five people are killed when a fire breaks out aboard a passenger ferry off Coron,
    Palawan, Philippines. The coast guard rescues 42 people from the vessel, which
    carried 117 passengers and 17 crew members. (AFP via The Straits Times)
  - Two people are killed and extensive damage is caused after an explosion at a hydroelectric
    power station in Piotta, Ticino, Switzerland. (Reuters)
  - 2026 European heatwaves
  - Peninsular Spain records its hottest summer since the State Meteorological Agency's
    measurements began in 1961, with an average temperature of and 61 heatwave days
    from June through August. (Arab News Pakistan)
  - Syria and weapons of mass destruction
  - The International Atomic Energy Agency ends its investigation into Syria's nuclear
    activities after the new government granted inspectors access to nuclear sites.
    Its board terminates a 2011 resolution that found Syria in non-compliance with
    its nuclear safeguards obligations. (AFP via France 24)
  - Reform UK financial allegations
  - The Metropolitan Police Service launch a criminal investigation into Reform UK
    over allegations that it broke foreign funding laws in the United Kingdom, following
    an investigation by Channel 4 News. (BBC)
  - 2026 Republican National Convention
  - The Republican National Convention is held in Dallas, Texas, U.S., ahead of the
    upcoming midterm elections. (NPR)
  - Apple Inc. unveils the iPhone 18 Pro, the first during John Ternus's tenure as
    CEO, and the iPhone Duo, the line's first foldable smartphone, thinnest and with
    the largest display. (NBC Bay Area) (Variety)
