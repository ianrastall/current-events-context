Date: '2026-09-01'
Source_URI: Portal:Current events/2026 September 1
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Iran war ceasefire
  - Iranian president Masoud Pezeshkian says that his country is ready to return to
    the Islamabad Memorandum signed in June if the United States does the same amidst
    renewed fighting between the two countries. (Fortune)
  - 2026 Strait of Hormuz crisis
  - The United States carries out additional airstrikes against Islamic Revolutionary
    Guards Corp targets in Iran, in response to recent attempted attacks on commercial
    shipping vessels in the Strait of Hormuz and on U.S. troops in the region, according
    to the U.S. Central Command. (BBC News) (CNN)
  - Gaza war
  - Palestinian health officials say that four people were killed in Israeli strikes
    during a ground operation in Gaza. Israeli prime minister Benjamin Netanyahu says
    that Israeli forces captured a senior Hamas internal security official in the
    operation. (AFP via France 24)
  - War against the Islamic State, Yemeni Civil War
  - Abu Hudhayfah al-Ansari, the spokesperson for the Islamic State, is killed during
    a security operation by the Yemeni Armed Forces. (Voice of Emirates)
  - Russo-Ukrainian war
  - Russian attacks on civilians in the Russo-Ukrainian war, Kyiv strikes
  - Ukrainian officials say that Russian missile and drone attacks on Kyiv and surrounding
    areas killed at least 12 people, including an Indian national, and injure dozens,
    while damaging residential buildings and other civilian infrastructure. (NDTV)
  - Senegal hidden debt scandal
  - The International Monetary Fund reaches a staff-level agreement with Senegal on
    a new US$2.2 billion, 36-month loan program supporting economic reforms after
    an earlier arrangement was suspended over previously unreported government debt.
    (AFP via France 24)
  - Ghana begins requiring artisanal doré bars purchased by privately financed gold
    buyers to undergo domestic refining before export, with GoldBod considering export
    applications only after processing at approved refineries. (Reuters)
  - Japan eases overtime enforcement by ending pressure on companies with special
    labor-management agreements to keep monthly overtime below 45 hours, as businesses
    face labor shortages. (AFP via France 24)
  - 2026 Nepal floods
  - Nepal–South Korea relations
  - South Korea's foreign ​ministry announces that the country will deploy a 44-member
    emergency relief team to Nepal to support search-and-rescue operations after flash
    floods hit the South Asian country. (The Korea Herald) (Reuters)
  - The Nepali Army reports that around 119 people have been rescued. (The Guardian)
  - 2026 Atlantic hurricane season
  - Tropical Storm Edouard makes landfall on the Gulf Coast of the United States.
    (CNN)
  - The New Zealand Conservation Department reports that the amount of endangered
    Kākāpō species have reached 325 in the country following the addition of 90 chicks,
    surpassing above 300 for the first time in 75 years. (The Guardian) (NBC News)
  - Germany–Russia relations, Violations of non-combatant airspace during the Russo-Ukrainian
    war
  - 2026 Leipzig Airport drone incidents
  - Germany raises its threat assessment to "high", orders the closure of Russia's
    consulate in Bonn, North Rhine-Westphalia, and the Russian House in Berlin, and
    tightens entry controls for Russian nationals after attributing the drone attacks
    at Leipzig/Halle Airport, Saxony, last month to Russia. (CNN)
  - A Honduran judge dismisses a corruption case against former president Juan Orlando
    Hernández, ruling that he neither authorized nor managed the public funds allegedly
    diverted to finance his 2013 presidential campaign. (AFP via France 24)
  - Death and state funeral of Harald V
  - Haakon VIII takes the oath as King of Norway before the Storting following the
    death of his father, Harald V. His daughter, Ingrid Alexandra, takes the oath
    as Crown Princess. (AP) (Reuters)
  - Former British prime minister Keir Starmer resigns as a member of the House of
    Commons for his appointment to the Chiltern Hundreds. (Al Jazeera) (BBC News)
  - Syria and weapons of mass destruction
  - The International Atomic Energy Agency reports that Syria's former government
    under Bashar al-Assad failed to declare nuclear material and facilities, confirming
    that infrastructure at Deir ez-Zor is consistent with an unfinished nuclear reactor
    and identifying about 73 tonnes of natural uranium. (AFP via France 24)
  - The Turkish foreign ministry reports that Turkey has joined the U.S.-led Artemis
    Accords, becoming the 71st country to do so. (AA) (Xinhua)
  - In baseball, the Los Angeles Angels of the MLB are sold to Stan Kroenke of Kroenke
    Sports & Entertainment for an unspecified price, ending 23 years of ownership
    by Arte Moreno. The deal faces pending regulatory review and is expected to be
    complete by 2027. (CNBC) (Reuters)
