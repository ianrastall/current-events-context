wikipedia:
  categories:
    Armed conflicts and attacks:
    - Iran's Islamic Revolutionary Guard Corps says that a supertanker carrying two
      million barrels of oil has sunk in the Strait of Hormuz after striking a mine.
    - Three Palestinians are killed and others are injured in shelling and shooting
      attacks by Israeli troops in various areas of the Gaza Strip, in a continuation
      of the violation of the ceasefire agreement signed in October 2025.
    - The Nigerian Defence Headquarters announces that the Nigerian Army killed eight
      terrorists, arrested 22 additional terrorists, logistical personnel and their
      families, and rescued 125 kidnapping victims in various raids in the states
      of Adamawa, Bauchi, Yobe, and Borno between November 6 and 12.
    - Three people are killed and several others are abducted in a cattle raid in
      Rabah, Sokoto State, Nigeria.
    Business and economy:
    - Amid minimum wage protests by garment workers, 13 garment factories in Gazipur
      are shut indefinitely under the Bangladesh Labour Act, 2006 and over 50 remain
      closed in Savar and Ashulia, while 48 platoons of the Border Guard, Ansar, and
      Special Response Battalion deploy across industrial zones in Dhaka, Gazipur,
      and Narayanganj.
    Disasters and accidents:
    - Twelve people are killed and 16 others are injured when a bus carrying gas refinery
      workers overturns in Ilam province, Iran.
    - Five people are injured, including three seriously, in a suspected gas explosion
      and fire at a Christmas market in Maredsous, Wallonia, Belgium.
    Health and environment:
    - Eight more children in Bangladesh are reported to have died from measles, bringing
      the death toll past 1,314.
    - Eight more people in Bangladesh are reported to have died from dengue fever,
      bringing this year's outbreak's death toll to 499.
    International relations:
    - Australia and the Philippines sign a defence cooperation agreement in Manila,
      simplifying procedures for joint military exercises and expanding maritime surveillance,
      information sharing, training, and disaster response.
    - Estonia announces the closure of its three border crossings with Russia starting
      December 1 after eight suspects were detained over an attempted arson attack
      on drone manufacturer Threod Systems, which Estonian intelligence attributes
      to Russia's GRU.
    Law and crime:
    - The Jordanian State Security Court sentences three men to death for an October
      23 shooting at a Greek Orthodox church in Karak Governorate that killed nine
      people and injured 25 others. Two accomplices receive six-year prison sentences.
    Politics and elections:
    - Cape Verdeans vote to elect a president, where the main two candidates are the
      incumbent PAICV candidate José Maria Neves and the MpD candidate Joana Rosa.
    - Neves wins re-election to a second five-year term with 63.8% of the vote, according
      to provisional results from the election commission. Rosa concedes defeat.
    - Gagauzians in Moldova vote to elect a governor and 35 members of the People's
      Assembly. MP Alexandr Stoianoglo and {{ill|Fiodor Gagauz|ru|Гагауз, Фёдор Никодимович}}
      advance to the second round after no candidate received a majority of the vote.
    Science and technology:
    - Non-profit fanfiction repository website Archive of Our Own is restored to limited
      functionality 17 days after being targeted in a cyberattack.
    Sports:
    - In tennis, Kateřina Siniaková and Taylor Townsend win their second and first
      WTA Finals doubles titles, respectively, after defeating Sara Errani and Jasmine
      Paolini in the final, 6–4, 6–3.
    - In tennis, Mirra Andreeva wins her first WTA Finals singles title after defeating
      Elina Svitolina in the final, 7–5, 6–3.
    - In golf, Rory McIlroy equals Colin Montgomerie's record for the most Harry Vardon
      Trophies after winning his eighth Race to Dubai title, which McIlroy claimed
      after finishing second at the DP World Tour Championship.
    - In women's rugby league, Australia wins its fourth consecutive World Cup title
      after defeating New Zealand 34–10 in the final in Brisbane.
    - In association football, England defeats Spain 3–2 in the group stage of UEFA
      Nations League A to end Spain's 43-match unbeaten streak, the longest by a national
      team.
    - In Canadian football, the Edmonton Elks win their 15th Canadian Football League
      title after beating the Montreal Alouettes 37–30 in the Grey Cup. They previously
      won in 2015.
