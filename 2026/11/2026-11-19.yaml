wikipedia:
  categories:
    Armed conflicts and attacks:
    - Iran's navy says that an oil tanker caught on fire after hitting a naval mine
      east of the Strait of Hormuz.
    - The Israeli Air Force strikes a Hezbollah underground facility in Lebanon's
      Bekaa valley.
    - Two Israeli drones explode in Nabatieh, Lebanon, without causing any injuries.
    - The Houthis fire missiles at King Abdullah Financial District in Riyadh, Saudi
      Arabia, which damage the Public Investment Fund Tower and other buildings but
      cause no injuries.
    - The Yemeni government's military says it has killed or injured 144 Houthi fighters
      during recent operations in the Taiz, Marib, and Al-Jawf governorates, and to
      have repelled an attack in the Tur Al Bahah area.
    - The Houthis say that Saudi-led coalition airstrikes have killed 10 people in
      Sanaa, Yemen, over the past two days.
    - Gaza's health ministry reports that two people have been killed by recent Israeli
      attacks and two others died from their wounds over the past day.
    - In Bangladesh, banned Awami League members loot and burn properties in Gopalganj
      District, including BNP MP Md. Selimuzzaman Mollah's ancestral home, a police
      station, and a Grameen Bank branch, and vandalise BNP and Jamaat-e-Islami properties.
      Separately, attackers burn the homes of former politicians Rahim Ullah in Feni
      District, Shahriar Alam in Rajshahi District and Mahmud Hasan Sumon in Mymensingh
      District.
    - Border Guard Bangladesh deploys 97 platoons across seven districts, with five
      more on standby, amid ongoing political violence and labour unrest.
    Business and economy:
    - The Joint Organisations Data Initiative reports that Saudi Arabia's oil exports
      rose in September to their highest level since the outbreak of the war in February,
      despite the Houthi attacks on Red Sea ports and infrastructure.
    - Across Bangladesh, 341 garment factories remain closed amid ongoing minimum
      wage protests, as police fire tear gas and stun grenades to disperse demonstrators
      in Ashulia and clear blockades on the Dhaka–Mymensingh Highway in Gazipur, while
      Bangladesh Nationalist Party members take up positions along highway areas in
      Sreepur and authorities tighten security at Kashimpur Central Jail.
    - Senegalese president Bassirou Diomaye Faye enacts the revised 2026 budget by
      decree after parliament rejected it, seeking to advance a proposed US$2.2 billion
      International Monetary Fund loan programme aimed at addressing the country's
      debt.
    International relations:
    - The Philippines and Chile sign a free trade agreement as part of the 33rd Asia-Pacific
      Economic Cooperation Economic Leaders' Meeting in Shenzhen, China, marking the
      former's first such agreement with a Latin American country.
    - Chinese leader Xi Jinping, Russian president Vladimir Putin, and United States
      president Donald Trump hold their first trilateral meeting in Shenzhen during
      the APEC summit and issue a joint declaration addressing nuclear war, petroleum
      production, and United Nations reform.
    - Pakistan and Qatar sign a memorandum of understanding on cooperation between
      their Federal Constabulary and Internal Security Force, respectively.
    - Somalia expels the ambassador of the United Arab Emirates, saying the country
      undermined Somalia's sovereignty.
    Law and crime:
    - An Israeli court extends the detention of Gaza's Kamal Edwan hospital director
      Hussam Abu Safiya by six months.
    - The International Court of Justice rules that Myanmar has committed genocide
      against the Rohingya people.
    Politics and elections:
    - Incumbent president of El Salvador Nayib Bukele presents his presidential candidacy
      to the Supreme Electoral Court seeking registration ahead of the 2027 elections.
      He is running for a third presidential term that will last six years.
    - The State Great Khural accepts the resignation of Mongolian president Ukhnaagiin
      Khürelsükh. The chamber's chairman, Sandagiin Byambatsogt, assumes the acting
      presidency until a new election is held within four months.
