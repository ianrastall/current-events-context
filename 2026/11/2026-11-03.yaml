date: '2026-11-03'
source_page:
  portal: Portal:Current events/2026 November 3
  language: en
  wikipedia_revision_id: 1383710822
wikipedia:
  categories:
    Armed conflicts and attacks:
    - A commercial vessel is hit by an unidentified object in the waters of Musandam
      Governorate, Oman, killing an Indian crew member, while 13 others are rescued.
    - Unidentified attackers ambush a police convoy near Gidan-Giye village in Zamfara
      State, Nigeria, killing at least five police officers and three members of the
      Zamfara Community Protection Guard, injuring two officers, and abducting an
      unspecified number of personnel.
    Art and culture:
    - Spanish author Cristina Fernández Cubas is awarded the Cervantes Prize.
    Business and economy:
    - The Reserve Bank of Australia raises its benchmark interest rate by 0.25 percentage
      points to 4.85%, its highest level since 2008, citing persistent inflation and
      rising energy costs associated with the Iran war.
    Disasters and accidents:
    - Two helicopters operated by Air Dynasty and Fishtail Air collide while landing
      in Solukhumbu District, Nepal, near Mount Everest, killing an Indian tourist
      and injuring a New Zealand national.
    Law and crime:
    - Three people are arrested for allegedly wiretapping Indonesian president Prabowo
      Subianto's phone.
    - Bomb hoaxes target seven flights from several European countries.
    - The Israeli cruise ship MS Crown Iris is targeted by a false bomb threat, and
      is searched on Syros, Greece.
    Politics and elections:
    - The United States holds midterm elections for 435 members and five non-voting
      delegates of the House of Representatives, 35 members of the Senate (including
      special elections in Florida and Ohio), 39 state and territorial governors,
      and numerous other state, territorial, tribal, and local officials.
    - U.S. news organizations project that the Democratic Party will control the House
      of Representatives and the Senate in the upcoming 120th Congress, ending the
      Republican Party's majority in both chambers.
    Sports:
    - In association football, CD Tenerife striker Jesús de Miguel dies following
      an in-game collision with FC Andorra goalkeeper Jesús Owono the previous day.
    - In thoroughbred racing, Point Of Law, trained by Ciaron Maher, wins the 2026
      Melbourne Cup at Flemington Racecourse in Victoria, Australia. Zahrann and Juja
      Kibo, also trained by Maher, finish second and third respectively.
    - In association football, the Asian Football Confederation postpones the 2027
      Asian Cup in Saudi Arabia from January 2027 to January 2028, citing security
      concerns and travel disruptions following Houthi attacks on the country.
