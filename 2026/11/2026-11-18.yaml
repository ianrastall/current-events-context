wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Crimean Bridge is struck by Ukrainian forces for the third time in four
      days, prompting Russian authorities to close the bridge to all traffic.
    - Salvadoran forces destroy a house belonging to Jeff Larose, the leader of the
      Taliban gang that operates in Canaan, Haiti. The Gang Suppression Force says
      it was not involved.
    - Two Bangladesh Nationalist Party members are killed when suspected members of
      the banned Awami League attack a motorcycle procession in Kalia, Narail District,
      Bangladesh.
    - In Bangladesh, a crowd allegedly led by Chatra Dal members storms and sets fire
      to the residence of former Awami League Member of Parliament Shamim Osman in
      Fatullah, Narayanganj District, while unidentified attackers in Nazirpur, Pirojpur
      District, loot and set fire to two houses belonging to former Minister of Fisheries
      and Livestock and Awami League leader SM Rezaul Karim, and a crowd in Sirajganj
      vandalises the local Awami League office and the residence of former MP Habibe
      Millat.
    - In Gopalganj District, Bangladesh, armed members of the banned Awami League,
      Chhatra League, and Jubo League detonate crude bombs and set fire to a private
      clinic owned by BNP Member of Parliament K M Babar of Gopalganj-2, forcing patients
      to evacuate. Attackers also burn at least five BNP offices across Muksudpur
      and Kashiani and target two Grameen Bank branches.
    - The Israeli army launches its first operation in central Gaza Strip amid the
      displacement of families from the area, for the first time since the ceasefire
      agreement signed in October 2025 came into effect.
    - A militant commander is killed by the Indian Armed Forces at a mosque in Kulgam
      district, Indian-administered Jammu and Kashmir, after escaping a shootout with
      troops two days earlier in a neighboring village, where his associate was killed.
    Arts and culture:
    - Vincent van Gogh's 1890 painting Blossoming Chestnut Trees sells for US$190.4
      million at Sotheby's in New York City, United States, setting a new auction
      record for Van Gogh and surpassing the $117.2 million paid for Orchard with
      Cypresses (1888) in 2022.
    Business and economy:
    - In Gazipur, Savar, and Ashulia, Bangladesh, thousands of garment workers demanding
      a monthly minimum wage increase from ৳12,500 (US$100) to ৳30,000 ($240) block
      the Dhaka–Mymensingh Highway and set fire to a police vehicle, causing police
      to fire tear gas and stun grenades in Gazipur and Ashulia as 55 factories close
      across the three areas, while police report around 300 arrests across 24 cases
      filed in Savar and Ashulia during the protests.
    - In Kafrul, Dhaka, police fire around ten stun grenades against demonstrating
      garment workers following clashes with Bangladesh Nationalist Party activists
      who allegedly harassed female factory employees, causing workers to stage demonstrations
      and halt production at several nearby garment factories.
    Law and crime:
    - Arsonists set fire to the ancestral home of former chief adviser Muhammad Yunus
      in Panchlaish, Chattogram, Bangladesh.
    Science and technology:
    - NASA's space probe Voyager 1 reaches the distance of one light-day from Earth,
      being the first man-made object to reach that distance, after it launched in
      1977.
    - PlayStation reports a major outage ahead of the release of Grand Theft Auto
      VI.
    Sports:
    - In Test cricket, Bangladeshi wicketkeeper Litton Das sets a world record for
      the most dismissals in a single Test innings, recording six catches and two
      stumpings against South Africa in Johannesburg.
