wikipedia:
  categories:
    Armed conflicts and attacks:
    - At least 20 people are injured, several with spear wounds, in an armed clash
      between the Bangladesh Nationalist Party and the Awami League over local dominance
      and control of brick kilns in Fatullah, Narayanganj District, Bangladesh, with
      police firing rubber bullets and tear gas to disperse them.
    - At least five people are injured in clashes between the Awami League and the
      Bangladesh Nationalist Party in Kalkini Upazila, Madaripur District, Bangladesh,
      during which more than 50 crude bombs are detonated.
    Business and economy:
    - Norwegian low-cost carrier Norse Atlantic Airways announces that its Norwegian
      operating subsidiary filed for bankruptcy after failing to secure short-term
      funding amid rising fuel costs, cancelling all flights and suspending ticket
      sales.
    - France’s economy is contracted for two consecutive quarters and enters into
      a recession.
    Disasters and accidents:
    - Indonesia's National Search and Rescue Agency terminates the search for 14 missing
      miners after flooding at an unauthorized gold mine in Bogor Regency, West Java,
      killed 13 people, citing risks of landslides and mine shaft collapses.
    International relations:
    - The Mexican government files a formal complaint with the United States regarding
      the anonymous tip lines set up by the Drug Enforcement Administration to receive
      information about members of organized crime and officials allegedly linked
      to them.
    Politics and elections:
    - The counting of special votes results in the National Party losing two electorate
      seats, including one overhang seat. The National–ACT–NZ First coalition government
      falls below a majority to 65 seats, placing the Opportunity Party into a kingmaker
      position.
    Sports:
    - In figure skating, Ilia Malinin of the United States sets a men's short programme
      world record with 114.81 points at the NHK Trophy in Tokyo, Japan, surpassing
      compatriot Nathan Chen's previous record of 113.97 points set at the 2022 Winter
      Olympics.
