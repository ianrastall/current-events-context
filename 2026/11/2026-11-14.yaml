wikipedia:
  categories:
    Armed conflicts and attacks:
    - Ahmed Abdallah Bishr, the general chief of staff for the Gathering of Sudan
      Liberation Forces (GSLF), is killed in a drone strike on his home in Nyala in
      Sudan's South Darfur state.
    Arts and culture:
    - The Philippines, with the song "Sobra-Sobra" by Carmelle, wins the inaugural
      Eurovision Song Contest Asia held in Bangkok, Thailand.
    Business and economy:
    - The Bangladesh Garment Manufacturers and Exporters Association threatens to
      indefinitely close unrest-affected factories without pay under the Bangladesh
      Labour Act 2006, after ongoing wage protests force the shutdown of 55 units
      and halt production at 147 others.
    - Canadian prime minister Mark Carney announces that negotiations for a free-trade
      agreement (FTA) with the Philippines have concluded, with signing expected in
      2027. The FTA would eliminate more than 90% of tariff lines.
    Disasters and accidents:
    - A bus overturns on the Garzón–Neiva highway in Colombia, killing six people
      and wounding eleven more.
    - The Slagdijkstermolen windmill in Friesland, Netherlands, burns down.
    Health and environment:
    - Eight more people in Bangladesh are reported to have died from dengue fever,
      bringing this year's outbreak's death toll to 491.
    Law and crime:
    - Border Guard Bangladesh seize 48 high-power explosive gel sticks, 100 detonators,
      and 11 fuses during an operation along the Bangladesh–India border in Kanaighat
      Upazila, Sylhet District, Bangladesh.
    - The Guatemalan Army begins deploying a battalion to the departments of Zacapa,
      Izabal, and Chiquimula following an attack in the Zacapa Department the previous
      day that killed five people.
    Politics and elections:
    - Student protesters, unions, and the yellow vests hold another nationwide protest
      in France, with over 100,000 participants.
    - The South Sudanese election commission postpones the country's first presidential
      and parliamentary elections since independence in 2011 from December 22, 2026,
      to February 11, 2027, amid political tensions and continuing violence.
    Science and technology:
    - The Italian Data Protection Authority fines American technology company Meta
      for €805 million (US$887 million) after it was found that the Facebook Android
      app had access to users' photos and videos without specific consent or disclosure.
