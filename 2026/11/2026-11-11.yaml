date: '2026-11-11'
source_page:
  portal: Portal:Current events/2026 November 11
  language: en
  wikipedia_revision_id: 1385198234
wikipedia:
  categories:
    Armed conflicts and attacks:
    - Israeli attacks kill at least nine Palestinians across Gaza, including five
      at the Nasser Medical Complex in Khan Younis.
    - At least 22 people are killed by Islamic State-affiliated Allied Democratic
      Forces rebels across eight locations in Mambasa Territory, Ituri Province, Democratic
      Republic of the Congo.
    - Three Central Reserve Police Force personnel are injured after militants open
      fire on a checkpoint near Mir Bazar in Kulgam district, Jammu and Kashmir, India.
      Security forces launch a search operation to locate the attackers.
    - Ten police personnel, including two senior officers, are killed in a clash after
      insurgents ambushed police vehicles in Kohat District, Khyber Pakhtunkhwa, Pakistan.
      The Pakistani Taliban claims responsibility for the attack.
    Business and economy:
    - The German cabinet approves draft legislation establishing a strategic natural
      gas reserve of 24 terawatt-hours, equivalent to approximately 10% of national
      storage capacity, to maintain gas supplies during emergencies.
    Disasters and accidents:
    - Portugal closes approximately 8,000 schools nationwide and suspends non-essential
      public services as Storm Charles approaches. The second day of the Web Summit
      in Lisbon is also cancelled.
    - Partial 3-story apartment building collapse in Brooklyn, New York City, United
      States, killing 2 people and injuring at least 10 others. Next ‌to a construction
      site.
    Health and environment:
    - The Kenyan health ministry reports that the country has discharged its last
      Ebola patient from a hospital in Nairobi after eleven contact cases were treated.
      Kenya will be declared Ebola-free on December 23 if no one else exhibits symptoms.
    - The number of confirmed Ebola cases in the Democratic Republic of the Congo
      surpasses 11,000, with at least 5,387 deaths, affecting 8 of the country's 26
      provinces.
    - The American ocean liner {{ship|SS|United States||6}} is sunk off the coast
      of Destin–Fort Walton Beach, Florida, United States, to become the world's largest
      artificial reef.
    International relations:
    - Iran designates the Argentinian naval and air forces as terrorist organizations,
      in response to Argentina designating the Islamic Revolutionary Guard Corps as
      such in March.
    - Germany announces that its military will discontinue using Chinese-made drones
      for military training and exercises, replacing them with German or other European
      models to address security concerns.
    - Russia bans two French lawmakers, Arthur Delaporte and Sacha Houlié, and two
      journalists, Ariane Chemin and Paul Gogo, from entering the country for allegedly
      harassing Xenia Fedorova, the head of RT France, from 2017 to 2023.
    - Kenyan president William Ruto signs a deal for Sudan to lift its 20-month ban
      on imports of tea from Kenya.
    Law and crime:
    - More than 6,000 schools across Italy are evacuated following bomb threats.
    - Two people are arrested in connection with an explosive attack on the headquarters
      of Colombian broadcaster RCN Televisión in Cali, Valle del Cauca.
    - Former Red Brigades member Leonardo Bertulazzi escapes house arrest in Buenos
      Aires, Argentina, while awaiting extradition to Italy to serve a 27-year prison
      sentence for kidnapping and membership in an armed group. Argentine security
      forces launch a manhunt for him.
    Politics and elections:
    - After a week of counting affidavit ballots, the Associated Press and CNN project
      the election to the U.S. Senate in Mississippi for Democratic candidate Scott
      Colom, defeating the incumbent Republican Cindy Hyde-Smith and becoming the
      first black senator from the state since Blanche Bruce in the 1874–75 elections.
    - The Brazilian Superior Electoral Court fines Meta Platforms R$7.5 million (US$1.34
      million) for failing to comply with judicial orders concerning the 2026 presidential
      election, while finding insufficient evidence of deliberate electoral interference.
    - Millions of workers across Spain launch a general strike to demand government
      intervention over the country's housing crisis, as an escalation of the ongoing
      protests.
    - Indonesian vice president Gibran Rakabuming Raka submits his resignation amid
      questions about his educational qualifications. Bloomberg News reports that
      President Prabowo Subianto accepts the resignation, although the government
      has not publicly confirmed its acceptance.
    - Polish president Karol Nawrocki and at least 500,000 people participate in the
      annual patriotic march celebrating the National Independence Day in Warsaw,
      Poland.
    Science and technology:
    - The Romanian Intelligence Service (SRI) reports that it stopped a December 2025
      cyberattack against an unidentified government institution, attributing it to
      the Russia-linked trojan package Turla. The SRI finds no evidence that sensitive
      information was stolen.
    - Cybersecurity firm CloudSek reports that the Kazakhstan-linked hacker group
      Silent Lynx used an autonomous agent to breach Tajikistan's government database
      and steal more than 2,000 national security-related documents.
    Sports:
    - The United States men's national under-17 soccer team withdraws from the upcoming
      FIFA U-17 World Cup in Qatar, citing safety concerns related to the Houthi–Saudi
      conflict.
