wikipedia:
  categories:
    Armed conflicts and attacks:
    - A police officer is killed and another injured in a stabbing attack outside
      the Sri Lankan embassy in Amman, Jordan. The suspect is arrested. The event
      is described as a terrorist attack.
    Disasters and accidents:
    - Eleven people are killed and 33 more injured after the collision of a passenger
      bus with a truck in Pakpattan District, Punjab, Pakistan.
    - Six people are killed and nine more injured after a fire at a two-story home
      in Brooklyn, New York City, United States.
    - Six more people are found dead under the debris of a building that collapsed
      two weeks ago in Nairobi, Kenya, bringing the death toll to eight. Sixteen others
      are still missing.
    Law and crime:
    - The Nepali supreme court directs the government to regulate cannabis cultivation
      for medicinal, scientific, agricultural, horticultural, and industrial purposes.
    - The Mexican government approves the Digital Economy Act for Digital and Electronic
      Payments, which allows it to designate sectors in which digital payments are
      the only accepted means of payment.
    - Six people are arrested in connection with a corruption investigation involving
      ruling PSOE officials and the transport ministry in Spain.
    - The Hong Kong High Court sentences pro-democracy activist Joshua Wong to an
      additional 10 years in prison under the national security law for conspiring
      with foreign entities to impose sanctions against China and Hong Kong.
    Politics and elections:
    - The syndicate of unions organizes a general strike across France, supported
      by the yellow vests movement, activists, and student protesters.
    - Grenadians vote to elect 15 members of the House of Representatives. Incumbent
      prime minister Dickon Mitchell wins a second consecutive NDC government, with
      opposition NNP leader Emmalin Pierre losing her seat in St. Andrew South East.
    - Paraguayan president Santiago Peña announces his resignation after the collapse
      of ueno bank, and the Chamber of Deputies unanimously votes to begin an impeachment
      trial against him.
    - The Federal High Court of Nigeria invalidates former vice president Atiku Abubakar's
      nomination as the African Democratic Congress candidate for the 2027 presidential
      election, ruling that the party's leadership was improperly constituted.
    - The Supreme Court of Somalia nullifies the amendments to the country's constitution,
      ruling that the term of president Hassan Sheikh Mohamud expired on 15 May 2026,
      while ordering new elections within 90 days.
    - Belarus sentences Roman Catholic Priest Anatoly Parakhnevich to three years
      in prison for opposing the war in Ukraine.
    Sports:
    - In golf, professional tour LIV Golf ceases operations after five seasons and
      liquidates its assets, following bankruptcy proceedings and the withdrawal of
      financial support from Saudi Arabia's Public Investment Fund and prospective
      investor BC Partners Credit.
