wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Islamic Revolutionary Guard Corps Navy and the United Kingdom Maritime Trade
      Operations report that an oil tanker has been damaged and caught fire off Khasab,
      Oman, while attempting to transit the Strait of Hormuz.
    - The Saudi-led coalition launches airstrikes on Hodeidah, Yemen, targeting weapons
      smuggling used by the Houthis, and on targets in the Sanaa, Saada, and Taiz
      governorates.
    - Yemeni government forces say they have conducted operations in the Al-Jawf,
      Marib, and Taiz governorates that have killed or injured 193 Houthi fighters.
    - A Russian Kh-101 cruise missile strikes a field near the village of Nowy Lipowiec
      in Lublin Voivodeship, Poland, around 60 miles from a Coalition of the Willing
      training excercise. Air raid alerts are issued in Lublin and Podkarpackie Voivodeship.
    - Three Salvadoran soldiers are killed and another is injured when explosives
      they are handling detonate.
    - The governments of Haiti and El Salvador agree to build three new prisons to
      incarcerate Haitian gang members.
    Disasters and accidents:
    - 30 people are killed and around 300 are missing after a ship carrying funeral
      goers capsizes in Bayelsa State, Nigeria.
    Politics and elections:
    - A general strike is held in Italy, with protests in multiple cities across the
      country.
    - Iraqi prime minister Ali al-Zaidi announces that an agreement has been reached
      with Kata'ib Hezbollah to establish a joint operations center and jointly station
      troops in Jurf al-Sakhar, south of Baghdad, after having threatened to send
      Iraqi security forces into the group's stronghold.
    Science and technology:
    - Anthropic employee and mathematician Levent Alpöge releases a claimed proof
      of the Riemann hypothesis. The proof was created with assistance from Claude.
