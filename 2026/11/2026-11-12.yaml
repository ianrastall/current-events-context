date: '2026-11-12'
source_page:
  portal: Portal:Current events/2026 November 12
  language: en
  wikipedia_revision_id: 1385446989
wikipedia:
  categories:
    Armed conflicts and attacks:
    - Haitian and Salvadoran soldiers take control of the Stade Sylvio Cator in Port-au-Prince
      after two years of gang control.
    - Ukrainian president Volodymyr Zelenskyy and United States special envoy Jared
      Kushner announce that European representatives will join future peace negotiations
      with Russia, which Russian president Vladimir Putin agrees to while maintaining
      his territorial demands and rejecting foreign peacekeeping troops in Ukraine.
    - At least 10 people, including five with gunshot wounds, are injured in Munshiganj
      Sadar, Bangladesh, during a clash involving gunfire and crude bomb explosions
      between two factions of the ruling Bangladesh Nationalist Party.
    Business and economy:
    - Jensen Huang resigns as chief executive officer (CEO) and president of Nvidia
      and leaves the company's board following reports of two extramarital affairs,
      including one involving a suspected Chinese intelligence agent. Chief financial
      officer Colette Kress becomes interim CEO.
    Disasters and accidents:
    - Fourteen people are killed and 30 more injured in a multiple-vehicle collision
      involving 18 cars and five trucks in the Emirate of Fujairah, United Arab Emirates.
    - A bus veers off a mountain road in Bhimphedi, Nepal, killing ten people and
      wounding five more.
    - A military helicopter crashes in Malatya, Turkey, killing four soldiers.
    Health and environment:
    - Four more children in Bangladesh are reported to have died from measles, bringing
      the death toll past 1,299.
    Law and crime:
    - A British court convicts two Iranian men of spying on journalists from London-based
      broadcaster Iran International. One of them is also convicted of preparing a
      violent attack, while a third defendant is acquitted.
    - One person is killed and four more are injured in a shooting spree in Logan
      Circle, Washington D.C., United States. The suspected gunman later kills himself
      after barricading himself from police inside a nearby apartment.
    - Europol announces that Operation TorNado, an international investigation into
      illegal dark web marketplaces, resulted in 354 arrests across 14 countries and
      the seizure of approximately 5.7 tonnes of drugs, 209 firearms, and €211 million
      (US$234 million) in assets.
    Science and technology:
    - A major outage impacts multiple Microsoft services, including Microsoft 365,
      Copilot and Teams, worldwide.
    Sports:
    - Finland announces visa restrictions preventing Russian athletes, including neutral
      competitors, from entering for sporting events beginning November 16. Norway
      also announces similar restrictions on Russian and Belarusian athletes and their
      support staff.
