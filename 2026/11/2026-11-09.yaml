wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Wall Street Journal reports that the United States has evacuated aircraft
      from the RAF Mildenhall base in the United Kingdom, citing threats from Iran.
    - The 24-year-old man responsible for the drive-by mass shooting at the Main Square
      in Kraków, Poland, two days ago, which killed six people and injured 16 others,
      dies at a hospital after being seriously wounded in a shootout with police.
    Arts and culture:
    - M. John Harrison wins the 2026 Booker Prize for his post-apocalyptic novel The
      End of Everything.
    - The Pitt Rivers Museum in Oxford, England, United Kingdom, returns the remains
      of 39 Naga people, collected during the British Raj, to a delegation from Nagaland,
      India, following six years of discussions over repatriation.
    Business and economy:
    - Paraguayan president Pedro Alliana appoints economist Jorge Schreiner to lead
      the central bank following Ueno Bank's collapse. The Senate approves Schreiner's
      appointment.
    - The Chinese commerce ministry extends the suspension of export restrictions
      on certain rare earths, industrial diamonds, and lithium battery technology
      to January 10, 2027, amid ongoing trade negotiations with the United States.
    - The South Korean Fair Trade Commission issues fines of ₩331.1 billion (US$247
      million) for Woowa Brothers and ₩300.8 billion ($222 million) for Coupang, finding
      that their food-delivery platforms restricted competition by requiring restaurants
      to match rival platforms' terms.
    Disasters and accidents:
    - Seventeen people are killed and twelve others are injured in an explosion at
      a factory in Aliağa, Turkey.
    International relations:
    - Cypriot president Nikos Christodoulides and Northern Cypriot president Tufan
      Erhürman agree to establish two additional crossings across the United Nations
      Buffer Zone in Cyprus and hold further peace negotiations.
    Law and crime:
    - English actor Russell Brand is sentenced to 10 years and 6 months imprisonment
      for one rape and three counts of sexual assault.
    Politics and elections:
    - Russian independent newspaper Novaya Gazeta ceases operations as it closes its
      offices in Moscow, citing pressure from Russian authorities and security services,
      including restrictions on its operations, loss of media registration, and blocked
      donations.
