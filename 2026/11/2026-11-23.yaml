date: '2026-11-23'
source_page:
  portal: Portal:Current events/2026 November 23
  language: en
  wikipedia_revision_id: 1387522609
wikipedia:
  categories:
    Armed conflicts and attacks:
    - At least 21 people are injured after a car bomb explodes next to the Meta Department
      Government building in downtown Villavicencio.
    - Three civilians are injured and 60 homes are damaged following a drone attack
      against a police station in Cúcuta. This is the first registered drone attack
      in an urban area in Colombia.
    - Ukraine launches a large-scale drone attack across western Russia, striking
      the Perm refinery in Perm Krai and Novoshakhtinsk refinery in Rostov Oblast.
    - Turkish intelligence reports that the Kurdistan Workers' Party withdraws from
      14 additional bases in northern Iraq as part of an ongoing disarmament process
      aimed at ending its conflict with Turkey.
    - At least 30 people are injured, eight seriously, and 12 shops are vandalised
      as rival factions of the banned Awami League clash in two separate incidents
      and detonate four crude bombs in Gopalganj District, Bangladesh.
    - At least 15 people are injured and 28 houses and shops are vandalised during
      clashes between rival Bangladesh Nationalist Party factions in Shailkupa Upazila,
      Jhenaidah District, Bangladesh.
    Business and economy:
    - Nvidia reinstates Jensen Huang as president and chief executive officer less
      than two weeks after he resigned following revelations of an affair with Alice
      Huang, who is suspected by U.S. intelligence of spying for China.
    Disasters and accidents:
    - Seven people are killed and two others are injured after a truck loaded with
      stones overturns onto a minitruck in Punjab, Pakistan.
    International relations:
    - A 58-year-old student dies at Sapienza University in Rome, Italy, while being
      on a hunger strike protesting the fact that he had not been assigned a place
      to stay.
    - British foreign secretary Ed Miliband announces sanctions against five military
      leaders of Myanmar, while also granting recognition of the Rohingya genocide.
    - Tajikistan formally begins the process of withdrawing from the International
      Criminal Court.
    Law and crime:
    - The Supreme Court of Spain grants amnesty to former Catalan president Carles
      Puigdemont, who is currently in self-imposed exile in Belgium, thereby bringing
      the legal proceedings against the leaders of the October 2017 declaration of
      independence to a definitive close.
    - Hundreds of schools across Denmark and Germany receive bomb threats via email,
      with police ordering the schools to continue operations as normal.
    - Iranian singer Parastoo Ahmadi receives 74 lashes for performing at a music
      concert without a hijab.
    - The Superior Court of Quebec suspends a 2022 law making allegiance to Canada's
      monarch optional for provincial legislators, requiring them to swear an oath
      to King Charles III before sitting in the National Assembly.
    Sports:
    - In association football, FIFA confirms Costa Rica, Jamaica, Mexico, and the
      United States as joint hosts of the 2031 Women's World Cup, while England, Northern
      Ireland, Scotland, and Wales will jointly host the 2035 tournament.
