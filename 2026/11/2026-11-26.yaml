wikipedia:
  categories:
    Armed conflicts and attacks:
    - Two Italian technicians working for Rheinmetall are killed and two other people
      are injured in a drone strike against a location in Kuwait. Iran has been blamed
      for the attack but denies responsibility.
    - Saudi Arabia says it has destroyed 50 Houthi military targets, including weapons
      depots, ballistic missile and drone launch sites, and command centres, in airstrikes
      on Sanaa, Al Hudaydah, and Saada Governorates in Yemen.
    - Thirteen members of the National Guard of Niger are killed and 20 more injured
      during an armed attack by unknown assailants against their compound in Sanam,
      Niger. Several gunmen are also killed in the ensuing shootout.
    - Thirty people are killed and homes are burned by gunmen in Niger State, Nigeria.
    - A clash between rival Bangladesh Nationalist Party factions in Munshiganj Sadar
      Upazila, Bangladesh, leaves one person dead and five injured by gunfire ahead
      of upcoming union parishad elections.
    Business and economy:
    - Around 400 garment factories remain closed across Savar and Gazipur, Bangladesh,
      as workers rejected a newly announced ৳ 17,000 monthly minimum wage as insufficient
      block the Dhaka–Mymensingh and Dhaka–Tangail highways and clash with police
      firing tear gas and stun grenades.
    - Spanish economist Pablo Hernández de Cos is elected as the new president of
      the European Central Bank, succeeding French lawyer Christine Lagarde after
      her resignation.
    - A business consortium led by U.S.-based asset management company Eldridge agrees
      to purchase international assets of Russian oil company Lukoil, including oil
      and gas fields, refineries, pipelines, and other infrastructure.
    Disasters and accidents:
    - One crew member is killed and 16 more are rescued after the sinking of a Malta-flagged
      tanker off the coast of Ibiza, Spain.
    - At least nine people are injured, including three critically, in an explosion
      and fire at an Bangchak Corporation oil facility in Bangkok, Thailand.
    Law and crime:
    - The Cambridge Crown Court in the United Kingdom finds 32-year-old Anthony Williams
      guilty of the attempted murders of 14 people in three separate incidents, including
      the stabbing of ten people on a LNER train in November 2025.
    - Egyptian prosecutors arrest a driver whose speeding car allegedly collided with
      a tank truck on Cairo's Ring Road yesterday, causing a fire that killed 31 people
      and injured 21 others.
    - A shootout between minibus drivers after a quarrel on a street in Beirut, Lebanon,
      kills two people and injures three more.
    Politics and elections:
    - The Serbian parliament sets the upcoming presidential election to December 27
      after former president Aleksandar Vučić resigned in September.
    - At least 18 golf courses across China announce closures, including ten in Beijing,
      with many citing government orders following earlier restrictions on golf associated
      with paramount leader Xi Jinping's anti-corruption campaign.
    - The Bissau-Guinean military government postpones presidential and legislative
      elections from December 2026 to November 2028, citing inadequate resources and
      logistical preparations, delaying its transition to civilian rule following
      the November 2025 coup.
    Science and technology:
    - The United States Federal Communications Commission authorizes SpaceX to deploy
      up to one million satellites for its Starmind space-based data center network,
      despite concerns about space debris and interference with astronomical objects.
