date: '2026-11-16'
source_page:
  portal: Portal:Current events/2026 November 16
  language: en
  wikipedia_revision_id: 1386227793
wikipedia:
  categories:
    Uncategorized:
    - Saudi Arabia's King Salman appoints Chairman of the General Staff Fayyadh Al
      Ruwaili as commander of the Saudi-led coalition in Yemen, following the retreat
      of Yemeni government forces from areas near the Bab al-Mandeb to Aden.
    - The Crimean Bridge is struck by a Ukrainian kamikaze drone, damaging the structure
      and prompting Russian authorities to close the bridge to vehicle traffic. The
      bridge is partially reopened later in the day.
    - Five gunmen are killed after a shootout between criminal organizations in Chignahuapan,
      Puebla, Mexico.
    - Two people are killed and three more injured in a mass shooting at a party in
      Mazatlán, Sinaloa, Mexico.
    Business and economy:
    - Police fire tear gas and sound grenades to disperse protesting garment workers
      blocking a road in Gazipur, after the Minimum Wage Board postpones its scheduled
      minimum wage meeting.
    - The European Commission (EC) and the United States Federal Reserve approve Italian
      bank UniCredit's proposed €45 billion (US$49 billion) acquisition of Germany's
      Commerzbank, following the European Central Bank's approval in October. The
      EC grants unconditional antitrust clearance.
    Disasters and accidents:
    - Eleven people are killed and 16 others are injured in a fire at a four-story
      building in Patong, Phuket province, Thailand.
    International relations:
    - The United States Department of State reverses its decision to withdraw funding
      from the United Nations Support Office for Somalia and supports extending its
      mandate and that of the African Union's military mission combating Al-Shabaab
      for another year.
    - Former Togolese prime minister Gilbert Houngbo is re-elected director-general
      of the International Labour Organization.
    Law and crime:
    - A Paraguayan judge orders impeached former president Santiago Peña transferred
      to the Viñas Cué military prison pending trial on charges of criminal association,
      breach of trust, and misuse of public office linked to Ueno Bank's collapse.
    - Nine people are killed in a mass shooting at a shack near Pretoria, South Africa.
    - Eight people are found shot and killed inside a vehicle in Msunduzi Local Municipality,
      KwaZulu-Natal, South Africa.
    - Bahrain sentences 64 Shia Muslims, mostly clerics, to life in prison for establishing
      a terrorist group linked to Iran's Islamic Revolutionary Guard Corps.
    Politics and elections:
    - The Gambian election commission approves President Adama Barrow's candidacy
      for a third term in the December 5 presidential election as the country's constitution
      does not limit presidential terms.
