wikipedia:
  categories:
    Armed conflicts and attacks:
    - Bahrain announces that two people were injured by Iranian strikes the previous
      day.
    - Several people are killed and at least 10 people are injured after the Russian
      corvette Merkury is struck by a Ukrainian naval drone attack while docked at
      the port of Benghazi, Libya. The Merkury reportedly capsizes and sinks.
    - A Maltese-flagged ship is also struck by naval drones off the coast of Benghazi.
    Arts and culture:
    - The 63rd Golden Horse Awards take place in Taipei, Taiwan, with the Hong Kong
      film We Are Born Good winning Best Narrative Feature.
    Business and economy:
    - Several garment factories in Gazipur, Bangladesh declare holidays amid ongoing
      minimum wage protests, as clashes erupt between workers and police along the
      Dhaka–Mymensingh Highway, with workers throwing bricks and police firing tear
      gas and stun grenades while Special Response Battalion, Ansar, BGB, and Industrial
      Police personnel deploy to the area.
    - Border Guard Bangladesh deploys 95 platoons across seven districts, including
      two battalions in Gopalganj, stepping up surveillance at key installations and
      industrial zones using drones and police body cameras.
    Disasters and accidents:
    - At least twelve people are killed and 23 others are injured in two separate
      road accidents in Rajasthan, India.
    - A severe thunderstorm kills five people and injures more than 250 others in
      Tupanciretã, Rio Grande do Sul, Brazil.
    - A fire at a confectionery factory in Serang Regency, Banten, Indonesia, kills
      at least three people, leaves 36 others missing, and injures four.
    - Three people are killed in a house fire in Trzcianka, Poland.
    Health and environment:
    - The 2026 United Nations Climate Change Conference (COP31) in Antalya, Turkey,
      concludes without a final agreement after countries failed to reach consensus
      on fossil fuel policies. It is the longest climate summit on record.
    Politics and elections:
    - South Korean education minister Choi Kyo-jin resigns following criticism of
      the government's response to artificial intelligence-assisted cheating concerns
      surrounding the College Scholastic Ability Test. President Lee Jae Myung accepts
      Choi's resignation.
    Sports:
    - In tennis, Carlos Alcaraz defeats Alexander Zverev in the final, 6–2, 7–6(9–7)
      to win his first singles title at the 2026 ATP Finals.
    - In motorcycle racing, Spanish rider Marc Márquez of Ducati Corse secures his
      eighth MotoGP World Championship after finishing eighth at the Portuguese Grand
      Prix, equalling Giacomo Agostini's record for the most premier-class motorcycle
      racing world titles.
