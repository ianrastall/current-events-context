date: '2026-11-25'
source_page:
  portal: Portal:Current events/2026 November 25
  language: en
  wikipedia_revision_id: 1388007401
wikipedia:
  categories:
    Armed conflicts and attacks:
    - The Ras Tanura oil refinery in Saudi Arabia's Eastern Province is damaged in
      an attack by the Houthis.
    - A Hamas security official, his wife, and two daughters, are killed in an Israeli
      airstrike on the Al-Shati refugee camp near Gaza City. Seven more Palestinians
      are also killed and several injured in more Israeli airstrikes.
    - An Islamic State suicide bomber blows himself up on a motorcycle at a checkpoint
      in Hasakah, Syria, killing two security forces and wounding five more.
    Business and economy:
    - Bangladesh's Minimum Wage Board raises the monthly minimum wage for garment
      workers from ৳12,500 to ৳17,000 following a 4–2 vote, a decision rejected by
      labour unions demanding at least ৳18,000 amid nearly a month of labour unrest
      and hundreds of factory closures.
    - At least 140 garment factories close across Gazipur, Savar, and Ashulia, after
      workers reject the newly announced minimum wage as insufficient, blocking the
      Dhaka–Mymensingh and Dhaka–Tangail highways and clashing with police firing
      tear gas and stun grenades.
    - Thousands of workers across Greece stage a strike demanding higher wages, restored
      public-sector bonuses, and increased funding for education and healthcare, disrupting
      ferry, metro, and air services. Police report approximately 15,000 demonstrators
      in Athens.
    - The European Union and United Kingdom impose fines totalling more than €570
      million (US$626 million) on fragrance manufacturers Firmenich, Givaudan, and
      International Flavors & Fragrances for exchanging commercially sensitive information
      and cartel behavior between 2019 and 2023.
    Disasters and accidents:
    - Thirty-one people are killed and 21 more injured after the overturn and explosion
      of a fuel tanker on Ring Road in Cairo, Egypt.
    - Six people die in the crash of a Cessna 210 Centurion carrying a family from
      a fishing trip near Horn Island, Mississippi, United States.
    Health and environment:
    - The United States Army detonates nearly 5 tons of degrading lead azide at the
      Iowa Army Ammunition Plant in Middletown, Iowa, citing spontaneous explosion
      risks.
    International relations:
    - Solomon Islands prime minister Matthew Wale signs a treaty with Australian prime
      minister Anthony Albanese to designate Australia as the "primary security partner"
      after ending the 2022 security pact with China.
    - The Cambodian and Chinese militaries begin their largest joint exercise, Golden
      Dragon 2026, involving nearly 3,000 personnel across three locations in Cambodia,
      focusing on counterterrorism, anti-piracy operations, and humanitarian assistance.
    Law and crime:
    - Border Guard Bangladesh deploys 108 platoons across Dhaka and seven other districts,
      including 56 in Gopalganj, under instructions from the Ministry of Home Affairs
      to step up surveillance at key installations and industrial zones.
    - Salvadoran national Kilmar Abrego Garcia arrives in Madrid, Spain, after voluntarily
      leaving the United States following a legal dispute over his wrongful deportation
      to El Salvador in March 2025.
    - A federal jury in Brooklyn, New York, United States, finds Huawei and three
      of its subsidiaries guilty on 10 of 12 counts, including bank fraud, wire fraud,
      money laundering, conspiracy to steal trade secrets, and violating the International
      Emergency Economic Powers Act by misleading banks about its business in Iran.
    - The Federal Supreme Court rules that the federal government of Iraq can deploy
      troops to the country's borders and can oversee and audit the oil industry in
      the Kurdistan Region, a day after Iraqi prime minister Ali al-Zaidi announced
      he is placing the region's oilfields and border crossings under federal control
      to combat oil smuggling.
    Science and technology:
    - Pakistani astronaut Muhammad Zeeshan Ali becomes the first Pakistani to reach
      orbit and the first foreign national to board China's Tiangong space station,
      arriving aboard the Shenzhou-24 spacecraft alongside two Chinese astronauts
      to conduct scientific experiments during a five-day mission.
