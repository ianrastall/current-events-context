date: '2026-11-10'
source_page:
  portal: Portal:Current events/2026 November 10
  language: en
  wikipedia_revision_id: 1384999985
wikipedia:
  categories:
    Armed conflicts and attacks:
    - A third round of United States-mediated talks between Ukrainian and Russian
      delegations begins in Abu Dhabi, United Arab Emirates, focusing on the humanitarian
      impact of the war, prisoners of war, and security guarantees. Earlier in the
      day, the American and Ukrainian teams held a separate meeting with representatives
      of France, Germany, Italy, the United Kingdom, the European Commission, and
      NATO.
    - The military court in Goma, North Kivu, Democratic Republic of the Congo, sentences
      66 soldiers to death on charges of cowardice, mutiny, and failure to obey orders,
      after they were arrested following clashes with Front for the Refoundation of
      the Nation rebels.
    - Eight people, including five workers and two police reservists, are killed by
      suspected al-Shabaab militants in Mandera County, Kenya, near the border with
      Somalia, during an ambush against a vehicle.
    Business and economy:
    - The Venezuelan National Assembly unanimously approves a reform of the electricity
      law which allows private companies and joint ventures to invest in the nationalised
      electricity sector, which the government has controlled since 2007.
    - The Monetary Authority of Singapore launches a gold reserve service for foreign
      central banks, international financial institutions, and sovereign entities,
      and announces expanded tax exemptions for wholesale gold services.
    Disasters and accidents:
    - Eleven people are killed and at least 51 others are seriously injured in a multiple-vehicle
      collision involving over 80 trucks and cars on the Trakia A1 motorway near Yambol,
      Bulgaria.
    - Five schoolgirls are killed and 21 others are injured when a school bus plunges
      into a pond in Kandal province, Cambodia.
    - Three people are killed and three others injured after a vehicle crashes into
      a crowd of pedestrians and food vendors on a sidewalk near the North Hollywood
      Metro station in Los Angeles, California, United States.
    Health and environment:
    - The Thai cabinet approves new environmental regulations for data centers, including
      limits on noise and temperature increases, requirements for cooling-water recycling
      and testing, and industrial zoning for facilities consuming more than 20 megawatts.
    - The United States Food and Drug Administration orders manufacturers of GLP-1
      medicines such as semaglutide and tirzepatide, originally intended for the treatment
      of type 2 diabetes but also commonly used for weight loss, to add warnings that
      use of such drugs may increase the risk of developing non-arteritic anterior
      ischemic optic neuropathy, an optic nerve disorder that can cause permanent
      blindness.
    International relations:
    - El Salvador announces a joint military operation with the Haitian police against
      the 400 Mawozo gang, in which 20 people are killed and a house linked to its
      leader, Wilson Joseph, is destroyed.
    Law and crime:
    - The British Judicial Committee of the Privy Council overturns provisions criminalizing
      consensual same-sex sexual activity between adults in Trinidad and Tobago, ruling
      them unconstitutional following a legal challenge by activist Jason Jones.
    - Police arrest an American soldier near Gloucester, England, on suspicions of
      espionage activity in connection with Russia.
    - An explosive device kills a police officer and his K9 dog and injures another
      while they were responding to a shooting in Oviedo, Asturias, Spain.
    - British news outlets The Guardian and ITV News identify comedian and author
      David Walliams as the subject of sexual misconduct allegations after the High
      Court of Justice rejects his attempt to prevent their publication. Walliams
      denies the allegations.
    Politics and elections:
    - Indonesian vice president Gibran Rakabuming Raka announces his intention to
      resign following controversies about the authenticity of his high-school diploma.
    Science and technology:
    - Australian prime minister Anthony Albanese announces plans to introduce mandatory
      safeguards for artificial intelligence companies, including security incident
      reporting and independent model evaluations, and establish a new regulatory
      body to oversee compliance.
