wikipedia:
  categories:
    Armed conflicts and attacks:
    - Iran says it has destroyed an early-warning radar in Bahrain as a retaliation
      for a United States strike on telecommunication infrastructure on Sirik.
    Disasters and accidents:
    - A tanker and the cruise ship American Heritage collide in the Mississippi River
      of the United States. The cruise ship, carrying 130 people, sinks. All aboard
      the American Heritage survive, with some taken to local hospitals for treatment
      of minor injuries.
    - The United States Federal Aviation Administration issues a nationwide ground
      stop for all flights due to "extraordinary circumstances involving communications
      failures". It is later lifted.
    - Twenty-four people are killed and eleven more injured in a bus–truck collision
      in Golaghat, India.
    - Six people are killed and five more injured after an under construction building
      partially collapses in Nairobi, Kenya.
    International relations:
    - The United States Department of State designates three Guatemalan criminal groups
      as foreign terrorist organizations for providing material support to Mexican
      cartels.
    Law and crime:
    - In the United Kingdom, Metropolitan Police announce a criminal investigation
      into actor David Walliams about "alleged serious sexual offences". The police
      say they are separate to those investigated by ITN and The Guardian.
    Sports:
    - In association football, the Royal Spanish Football Federation suspends FC Andorra
      goalkeeper Jesús Owono for 12 matches following a collision with CD Tenerife
      forward Jesús de Miguel during a November 2 match, which resulted in de Miguel's
      death.
