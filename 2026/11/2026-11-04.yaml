wikipedia:
  categories:
    Business and economy:
    - The Bangladeshi garment industry wage board agrees to increase minimum wages
      following five days of worker protests and clashes with police. Workers demand
      ৳30,000 (US$240) monthly, up from ৳12,500 (US$100), while the board has not
      specified the increase.
    Disasters and accidents:
    - A motorized cargo boat carrying a load of copra capsizes off Jomalig, Quezon,
      Philippines. A search and rescue operation is later launched for seven missing
      individuals aboard.
    Health and environment:
    - The Singaporean parliament amends the Transboundary Haze Pollution Act of 2014,
      introducing arrest powers, permitting trials without defendants present, and
      increasing maximum fines tenfold to S$20 million (US$15 million) following widespread
      air pollution from Indonesian wildfires.
    Law and crime:
    - Philippine authorities seize a {{convert|200|kg|lb|adj=on}} shipment of methamphetamine,
      whose origin is traced to Laos, at the Manila International Container Port.
      The shipment had arrived six days after local police in Laos found the similar
      contraband, supposed to be brought to the Philippines, on October 1.
    Politics and elections:
    - Hungary makes Communist-era secret police records publicly accessible through
      a database containing approximately 60,000 names linked to former state security
      services. Prime Minister Péter Magyar announces that additional documents will
      become available in February 2027.
    Science and technology:
    - The Neil Gehrels Swift Observatory, a space telescope for studying gamma-ray
      bursts, re-enters Earth's atmosphere over Sumatra, ending its mission of nearly
      22 years.
