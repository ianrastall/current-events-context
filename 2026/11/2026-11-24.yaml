wikipedia:
  categories:
    Armed conflicts and attacks:
    - A Russian airstrike hits a five-story apartment building in Zaporizhzhia, Ukraine,
      killing two people and wounding 44 others.
    - Israel kills Hamas security official Naeem Abu Nahel in an airstrike in the
      Gaza Strip.
    Business and economy:
    - Police fire tear gas and stun grenades to disperse protesting garment workers
      across Gazipur, Savar, and Ashulia, Bangladesh, as production halts at 481 factories
      amid minimum wage disputes.
    Disasters and accidents:
    - Thirteen people are killed and fourteen others are injured when a bus collides
      with a stationary truck in Ras Al Khaimah, United Arab Emirates.
    - Seven people are killed and nine others are injured in a cooking gas explosion
      at a hot pot restaurant in Hanoi, Vietnam.
    - A Turkish Air Force helicopter crashes during a training flight in Eskişehir,
      Turkey, killing five crew members.
    Health and environment:
    - The UK Health Security Agency says it recorded the highest number of heat-related
      deaths in the United Kingdom on record in 2026 at 5,258, surpassing the previous
      record in 2022.
    Law and crime:
    - Border Guard Bangladesh deploys 101 platoons across Dhaka and seven other districts,
      including two battalions in Gopalganj, following instructions from the home
      ministry to increase surveillance at key installations and industrial areas.
    - Armed men in Cartagena, Colombia take 25 people hostage in a supermarket after
      a failed armored-car robbery.
    Politics and elections:
    - Former Bangladesh Prime Minister Sheikh Hasina announces she plans to return
      to the country on December 16, coinciding with Victory Day.
    Sports:
    - In association football, the Court of Arbitration for Sport rules in favor of
      the Senegalese Football Federation and against the Confederation of African
      Football, and reverses the latter's controversial decision to overturn Senegal's
      1–0 victory against Morocco in the 2025 Africa Cup of Nations final, thereby
      restoring Senegal as the 2025 Africa Cup of Nations champions.
