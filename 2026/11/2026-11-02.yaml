wikipedia:
  categories:
    Armed conflicts and attacks:
    - Three people are killed and five more injured in two separated mass shootings
      at two drug rehabilitation centers in Mazatlán, Sinaloa, Mexico.
    - Israeli forces withdraw from areas around Hebron in the occupied West Bank after
      a multi-day operation following the killing of two Israeli soldiers at a checkpoint.
    - The United States military carries out airstrikes on Iranian targets across
      the Strait of Hormuz after Iranian surface-to-air missiles attack American aircraft
      in the Strait, as explosions are reportedly heard on Qeshm Island and the city
      of Bandar Lengeh.
    - At least 29 people are killed, 10 others are injured, and 48 are missing during
      Russian bombing on an aid distribution centre in Komyshuvakha, Zaporizhzhia
      Oblast. Ukraine.
    - Haitian, Salvadoran, and Gang Suppression Force soldiers launch an offensive
      in Plain of the Cul-de-Sac, killing at least a dozen gang members.
    - The Rapid Support Forces launches drone strikes against three distrubition stations
      in Sudan's Kassala and Northern states.
    - A truck bomb explodes near a military base in Planadas, Tolima Department, Colombia,
      killing four people, including a baby, and wounding several others.
    - An unidentified person throws an IED bomb at the home of Villa El Salvador mayor-elect
      Marcelino Huamán Cano in Lima, Peru, while he was with his family, causing property
      damage but no reported injuries.
    - Uganda begins withdrawing its troops from Somalia, planning to remove all personnel
      deployed under bilateral and African Union missions by the end of 2027, ending
      nearly two decades of operations.
    Health and environment:
    - The United States Food and Drug Administration approves the first generic version
      of lenacapavir, a twice-yearly HIV prevention injection expected to cost about
      US$40 annually in 120 low- and middle-income countries.
    Law and crime:
    - A second wave of cyberattacks target freezers and refrigerators in supermarkets
      in multiple European countries, causing them to overheat and spoil.
    Politics and elections:
    - The Spanish interior ministry reportedly deports 16 migrants, including those
      from Bangladesh, Cameroon, Nigeria, Senegal, and Yemen, from Ceuta to Morocco
      following the migrant crisis in July.
