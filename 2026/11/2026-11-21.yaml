wikipedia:
  categories:
    Armed conflicts and attacks:
    - Gaza's civil defence agency reports four people killed by Israeli fire, including
      three in a drone strike on a food-carrying vehicle in Gaza City and one by gunfire
      in Jabalia. Israel says it targeted operatives.
    - Saudi Arabia intercepts three missiles fired at Riyadh by the Houthis.
    - The Finnish defence ministry imposes temporary airspace and maritime restrictions
      after a drone struck a Russian cargo vessel in international waters of the Gulf
      of Finland, causing a fire.
    - Clashes between Bangladesh Nationalist Party supporters and banned Awami League
      activists in Bera Upazila, Pabna District, injure several people following an
      arson attack at the abandoned home of former Deputy Speaker Shamsul Hoque Tuku
      and retaliatory vandalism, with police firing rubber bullets and tear gas to
      disperse the crowd.
    Business and economy:
    - At least 80 garment factories in Savar and Ashulia, Bangladesh, declare general
      holidays after workers stage sit-ins and work stoppages over minimum wage demands,
      while police announce that 96 people, including five labour leaders, have been
      arrested in connection with the 4 November clashes on the Dhaka–Aricha Highway.
    - Laid-off garment workers in Rupganj, Narayanganj District, block roads by felling
      trees and burning tires over unpaid wages.
    - Border Guard Bangladesh deploys 90 platoons across seven districts, with four
      more on standby, amid ongoing political violence and strike action.
    - The Japanese trade ministry announces that Saudi Arabia agreed to triple the
      volume of crude oil stored in Japan to 24 million barrels, under Japan's joint
      stockpiling system with Saudi Arabia, Kuwait, and the United Arab Emirates.
    Disasters and accidents:
    - At least four people are killed and 35 others are injured in a fire at a power
      station in Basra, Iraq.
    - At least three people are killed, four others are injured and 36 are reported
      missing after a fire at a candy factory near Jakarta in Banten, Indonesia.
    International relations:
    - Indonesia and the European Union sign trade and investment agreements that will
      lift 98.5% of tariffs on EU goods.
    Science and technology:
    - The European Space Agency announces that the BepiColombo spacecraft inserted
      itself into orbit around Mercury.
