wikipedia:
  categories:
    Armed conflicts and attacks:
    - Five civil police officers are killed in an Israeli airstrike in al-Mawasi,
      Rafah, Gaza Strip. Separately, three more Palestinians, including a four-year-old
      child, are killed in an airstrike on a building in Gaza City.
    Disasters and accidents:
    - Bolivian president Rodrigo Paz declares a national state of emergency to mobilize
      resources before the super El Niño event peaks in November or December.
    - Nine people are killed after a Learjet 60 business jet bound for The Bahamas
      crashes in Greenacres, Florida, United States.
    - Four workers are killed after entering a food waste tank at a hotel in Ujjain,
      Madhya Pradesh, India.
    Health and environment:
    - The government of Delhi, India, introduces stricter pollution controls, including
      double parking fees, remote work arrangements, restrictions on high-emission
      vehicles, and bans on dust-producing construction, as PM levels reach 201 micrograms
      per cubic metre.
    Law and crime:
    - Portuguese riot police dismantle protest camps in Lisbon's Rossio Square and
      Porto, arresting 13 people for refusing orders to disperse. Thirteen officers
      are injured, while activists say more than 30 protesters are also injured.
    - The United States Federal Bureau of Investigation says North Korea orchestrated
      the hack and theft of over $6 billion of cryptocurrency from exchange Binance,
      facilitated through the Lazarus Group, which also hacked Dubai-based exchange
      Bybit last year.
    - Garment workers clash with police in Dhaka, Bangladesh, over low pay and the
      rising cost of living. In response, the government forms a wage board.
    Politics and elections:
    - Thousands of people protest in New Delhi, India, to call for chief election
      commissioner Gyanesh Kumar to resign due to changes to voter lists that allegedly
      disproportionately affect opposition parties.
    - Bulgarians vote in the second round of presidential elections between incumbent
      Iliana Iotova and former acting prime minister Andrey Gyurov. Gyurov concedes
      to Iotova after polls close.
    Sports:
    - In figure skating, Japan's Mao Shimada wins the women's singles title at Skate
      Canada in her senior Grand Prix debut, finishing ahead of South Korea's Kim
      Chae-yeon and Japan's Rion Sumiyoshi.
    - In open-wheel racing, Italian driver Kimi Antonelli, driving for Mercedes, wins
      the Formula One World Drivers' Championship after finishing third at the Mexico
      City Grand Prix, becoming the youngest Drivers' Champion at the age of 20 years,
      68 days.
    - In motorcycle racing, Yamaha withdraws from the Qatar Grand Prix next week,
      citing company-wide travel restrictions following its assessment of the Middle
      Eastern crisis.
