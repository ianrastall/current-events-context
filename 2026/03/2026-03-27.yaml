wikipedia:
  categories:
    Uncategorized:
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Saudi Arabia
    - An Iranian attack on Prince Sultan Air Base in Saudi Arabia with at least six
      ballistic missiles and 29 drones injures 15 American soldiers and heavily damages
      a Boeing E-3 Sentry (AWACS) aircraft. (Al Jazeera) (BBC)
    - Kuwait, Saudi Arabia, and the United Arab Emirates report that they have intercepted
      missile and drone attacks from Iran. (AA)
    - 2026 Strait of Hormuz crisis
    - Iran's representative in Geneva says that Iran will facilitate and expedite
      humanitarian aid to cross the Strait of Hormuz. (AP)
    - The foreign ministers of the G7 nations reach an agreement to protect passage
      through the Strait of Hormuz if the war ends. (Euronews)
    - 2026 Iranian strikes on Israel
    - One man is killed and several are injured by Iranian ballistic missile attacks
      on central and southern Israel. (The Jerusalem Post)
    - The Israeli Air Force strikes a uranium processing facility in Yazd, Iran. There
      were no casualties or radiation leaks, according to Iran's Atomic Energy Organization.
      (Al Jazeera)
    - Iran has begun recruiting children as young as 12 to man Tehran checkpoints.
      (The Times of Israel)
    - Sudanese civil war
    - The Sudan People's Liberation Movement–North reports that a Sudanese Army airstrike
      on a funeral gathering in the town of Al Sunut in South Kordofan has killed
      seven civilians and injured 39 others. (Sudan Tribune)
    - Economic impact of the 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - Brent crude oil surpasses US$110 per barrel after Iran's Islamic Revolutionary
      Guard Corps Navy turned away three container ships and declared the Strait of
      Hormuz closed. (AFP via South China Morning Post) (UPI)
    - Renationalization of YPF
    - A United States appeals court overturns a $16.1 billion judgment against Argentina
      related to the 2012 nationalization of oil company YPF, ruling that the shareholders'
      claims are not valid under Argentine law. The decision reverses a 2023 lower
      court ruling that had ordered compensation to minority investors. (AFP via France
      24)
    - Landslides triggered by heavy rain kill at least 20 people in Mbeya Region,
      Tanzania. (AP)
    - Seven people are killed and five others are injured in a landslide on the Zoji
      La in Ladakh, India. (NDTV)
    - Three people are killed in a helicopter crash at Kalalau Beach on Kauaʻi, Hawaii,
      United States. (AP)
    - Two children are killed and at least seven others are injured in a three-vehicle
      collision involving a dump truck, SUV and school bus on Tennessee State Route
      70 in Carroll County, Tennessee, United States. (AP)
    - Calama school stabbing
    - One person is killed and four others are injured in a mass stabbing at a school
      in Calama, Antofagasta Region, Chile. (ABC News)
    - 2026 Nepalese general election
    - Following his Rastriya Swatantra Party's landslide victory in the general election,
      Balendra Shah is sworn as Prime Minister of Nepal, succeeding interim prime
      minister Sushila Karki. (Reuters)
    - Opposition to Vladimir Putin in Russia
    - Russia designates filmmaker and teacher Pavel Talankin, the co-director and
      subject of the 2025 documentary film Mr Nobody Against Putin, as a foreign agent
      after authorities accuse him of spreading disinformation about the government
      and opposing the war in Ukraine. (AFP via RFI)
    - Protests against the 2026 Iran war
    - Lawmakers from the Jammu & Kashmir National Conference protest outside the legislative
      assembly of Jammu and Kashmir, India, in solidarity with Iran and against the
      assassination of former supreme leader Ali Khamenei amidst the Iran war. Additionally,
      a major confrontation breaks out between INC lawmaker Irfan Hafiz Lone and BJP
      lawmaker Yudhvir Sethi during the protest. (Kashmir Convener) (Times of India)
    - In Mongolia, the State Great Khural accepts the resignation of Prime Minister
      Gombojavyn Zandanshatar. (AP)
    - 2026 World Figure Skating Championships
    - In her last performance before retiring, Japan's Kaori Sakamoto wins the gold
      medal in the women's singles event of the 2026 Figure Skating Championships.
      (AFP via RFI)
