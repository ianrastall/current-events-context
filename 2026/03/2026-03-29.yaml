wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - Bahrain imposes a nighttime maritime curfew from 6:00pm to 4:00am to restrict
      sea traffic and strengthen coastal security following reported attacks attributed
      to Iran. (AFP via L'Orient Today)
    - 2026 Iranian strikes on Kuwait
    - Ten Kuwaiti soldiers are injured in a new wave of missile and drone attacks
      on Kuwait. (Saudi Gazette)
    - 2025–2026 Iran–United States negotiations
    - The foreign ministers of Egypt, Pakistan, Turkey and Saudi Arabia, meet in Islamabad
      to express their "full support" for potential Iran–United States talks hosted
      by Pakistan. (AFP via France 24)
    - United States president Donald Trump tells Financial Times that the U.S. could
      seize Kharg Island and "take the oil" in Iran, although "a deal could be made
      fairly quickly". (Financial Times) (Xinhua)
    - 2026 Iranian strikes on Israel
    - An Iranian missile hits the Makhteshim chemical plant in southern Israel. A
      warning for the leakage of hazardous materials is issued for the immediate vicinity
      of the site. (Reuters)
    - 2026 Lamerd sports hall attack
    - A visual evidence released by The New York Times shows that a sports hall in
      Lamerd in the Fars province of Iran was hit by a untested short-range Precision
      Strike Missile during the first day of the war on February 28, 2026. (The New
      York Times)
    - 2026 Lebanon war
    - An Indonesian peacekeeper of the UNIFIL mission is killed and a second one is
      critically injured when a projectile explodes at their position near Aadshit
      al-Qusayr, Nabatieh Governorate. (Times of Israel)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - A person is killed by a Ukrainian drone attack in Taganrog, Rostov Oblast, Russia.
      (Reuters)
    - Several unmanned aerial vehicles (UAVs) are detected across southeastern Finland.
      One of the UAVs is identified as Ukrainian after it crashes near Kouvola. (Yle)
    - Three people are killed and thirteen others are injured in a Russian glide bomb
      attack on Kramatorsk, Ukraine. (The Guardian)
    - Gaza war
    - Ten Palestinians are killed, including a 15-year-old boy, and 18 others are
      injured in artillery fire and airstrikes by the Israel Defense Forces in Gaza
      City, Palestine. (Haaretz)
    - Sudanese civil war
    - Kordofan campaign
    - At least 14 people are killed and 23 others are injured in a drone strike on
      Dilling, South Kordofan, Sudan. (Xinhua)
    - 2026 Afghanistan–Pakistan war
    - One person is killed and at least 15 others, including children, are injured
      in a Pakistani artillery strike in Asadabad, Kunar Province, Afghanistan. (The
      Afghan Times)
    - Communal conflicts in Nigeria
    - Twelve people are killed by unknown gunmen at a bar in Angwan Rukuba, Plateau
      State, Nigeria. A mob kills ten additional people in retaliation to the attack.
      (BBC News)
    - Haitian conflict
    - At least 16 people are killed and 10 others are injured by the Gran Grif gang
      in Petite-Rivière-de-l'Artibonite, Haiti, during a gun fight with a vigilante
      group. Human rights activists allege that more than 30 people were killed and
      dozens were missing. (AP) (ABC News)
    - South Sudanese vice president Riek Machar reports that at least 73 miners were
      killed and 25 others were seriously injured by unknown gunmen over the weekend
      after a mining dispute near Juba. (AFP via FMT)
    - For the first time ever, Israel Police block the Latin Patriarch of Jerusalem,
      Pierbattista Pizzaballa, from entering the Church of the Holy Sepulchre during
      Palm Sunday, citing heightened risk in the Old City during the Iran war. (Vatican
      News) (The Jerusalem Post)
    - At least 45 people are killed and 74 others are injured after five days of severe
      weather across parts of Afghanistan and Pakistan. (Reuters) (AP via CTV News)
    - Seven people are killed and two others are injured after a building partially
      collapses in Hailin, Heilongjiang, China. (Xinhua)
    - Three people are killed and 20 others are injured when a church collapses in
      Accra, Ghana. (BBC News)
    - A nightclub burns down in Kehl, Baden-Württemberg, Germany. All 750 people inside
      were evacuated, three of whom are treated for shock. (Tagesschau) (AP)
    - Iran–Lebanon relations
    - Iran's ambassador to Lebanon, Mojtaba Amani, remains in the country despite
      being declared persona non grata and ordered to leave. The expulsion order prompts
      opposition from outlawed Iran-armed group Hezbollah and a cabinet boycott by
      its ministers and allies. (AFP via LBCI)
    - 2026 Beijing ramming attack
    - An unknown number of casualties are reported when a loader is intentionally
      driven into a crowded market in Fangshan, Beijing, China. A man in his 50s is
      arrested. (FTV News)
    - 2026 New Democratic Party leadership election
    - Avi Lewis is elected leader of Canada's New Democratic Party. (BBC)
    - 2026 Formula One World Championship
    - In auto racing, Mercedes-Benz's Kimi Antonelli becomes the youngest driver to
      lead the World Championship at 19 years and 216 days old after winning the Japanese
      Grand Prix. (AFP via RFI)
