Date: '2026-03-31'
Source_URI: Portal:Current events/2026 March 31
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Iranian Foreign Minister Abbas Araghchi confirms that direct contacts, although
    "not negotiations", with U.S. special envoy Steve Witkoff are under way. (Al Jazeera)
  - U.S. Defense Secretary Pete Hegseth says that the talks between the United States
    and Iran “are very real” but also states that the U.S. will "negotiate with bombs"
    until a ceasefire is reached. (Time)
  - 2026 Strait of Hormuz crisis
  - The Kuwait Petroleum Corporation claims that oil tanker Al Salmi has been hit
    by an Iranian drone at a port in Dubai, causing a fire onboard and damage to the
    vessel. Dubai authorities say that the fire has been contained hours after the
    incident. (The Guardian)
  - France–Israel relations
  - The Israeli defense ministry halts sales of defense products to France following
    president Emmanuel Macron's decision not to allow U.S. aircraft to pass through
    French airspace en route to Israel. (The Jerusalem Post)
  - Italy–United States relations
  - Italy denies the United States Air Force the use of the Sigonella base in Sicily
    for operations related to the Iran war. (Reuters)
  - Poland–United States relations
  - Poland refuses a request by the United States to relocate its Patriot air defense
    systems to the Middle East for the Iran war. (Politico)
  - China and Pakistan releases a five-point peace plan for the Iran war following
    a meeting between the two countries' foreign ministers, Wang Yi and Ishaq Dar,
    respectively. The plan includes a ceasefire and reopening the Strait of Hormuz.
    (The Guardian) (Axios)
  - 2026 Lebanon war
  - Israeli defense minister Israel Katz announces that Israel will destroy "all houses"
    near the Israel–Lebanon border. (Reuters)
  - Four Israeli soldiers are killed in action while fighting Hezbollah in southern
    Lebanon. (The Jerusalem Post)
  - 2026 Crimea Antonov An-26 crash
  - 29 people are killed when a Russian Air Force Antonov An-26 crashes in Crimea.
    (Reuters)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - American Automobile Association reports that the United States national average
    gas price has reached $4.02 a gallon, the highest since 2022 following Russia's
    invasion of Ukraine. (AP)
  - The Dow Jones Industrial Average surges over 1,000 points and the Nasdaq increases
    to 3.4% after Iranian president Masoud Pezeshkian says that Iran has signaled
    it is willing to end the conflict if security guarantees and assurances are met.
    (Moneycheck) (XTB)
  - Stocks in the United States also rise following reports that president Donald
    Trump has told aides that he is willing to end the war without securing the Strait
    of Hormuz. (Quartz)
  - LGBTQ rights in the United States
  - Legality of conversion therapy
  - Chiles v. Salazar
  - The U.S. Supreme Court overturns Colorado's ban on conversion therapy in an 8–1
    decision, ruling that it infringed on the First Amendment, thereby invalidating
    similar bans in 22 other states. (AP) (Colorado Public Radio)
  - LGBTQ rights in Senegal
  - Senegalese president Bassirou Diomaye Faye approves a law increasing penalties
    for same-sex sexual acts to up to 10 years in prison and criminalizing the promotion
    or financing of such acts. The measure amends existing provisions in the penal
    code that already penalize these acts. (Reuters)
