wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - U.S. president Donald Trump says he is postponing his 48-hour ultimatum for
      five days before attacking the Iranian power plants as Iran and the U.S. have
      held "very good and productive conversations" on ending the war. Trump also
      claims that a "major points of agreement" focused on Iran's renunciation of
      the nuclear weapon are being talked. Iran denies any dialogue took place. (ABC
      News) (States Newsroom)
    - Iraq in the 2026 Iran war
    - Kata'ib Hezbollah says that it will extend its pause on strikes on the United
      States embassy in Baghdad, Iraq, for five more days. (AFP via Gulf News)
    - A person is killed and another is injured in a strike on a transmission site
      of the Persian Gulf Radio and Television Centre in southern Iran. (AFP via LBCI)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - At least one person is killed in an Israeli strike on Hazmieh, Greater Beirut,
      Lebanon. The Israeli military states that the attack targeted a member of Iran's
      Quds Force in the area. (AFP via Al Arabiya)
    - Sudanese civil war
    - Kordofan campaign
    - At least 15 people are killed and 23 others are injured in strikes on Lagawa
      District, West Kordofan, Sudan. The Rapid Support Forces attribute the attack
      to the Sudanese army. (AFP via Business Recorder)
    - A Sudanese rebel faction led by Yasir Arman calls for the United Nations Security
      Council to end the use of drones on Sudanese citizens. (Sudan Tribune)
    - Economic impact of the 2026 Iran war
    - Brent crude futures fall 11%, trading just below US$100 a barrel for the first
      time in days, following the announcement by U.S. president Donald Trump about
      talks with Iran to end the war. (Reuters)
    - Slovenia becomes first EU country to introduce fuel rationing to cope with extra
      demand by drivers from neighboring countries. (BBC News)
    - 2026 Colombian Air Force Lockheed C-130 crash
    - At least 66 people are killed when a military Lockheed C-130, carrying 125 people,
      crashes in Puerto Leguízamo, Colombia. (AFP via ABS-CBN News)
    - At least one person is killed and several others are injured in an explosion
      in Kwara State, Nigeria. (AP)
    - Climate crisis
    - In its annual State of the Global Climate report, the World Meteorological Organization
      states that Earth's energy imbalance and ocean heat content reached record levels
      in 2025, driven by rising greenhouse gas emissions. (AFP via CNA)
    - Bill Cosby sexual assault cases
    - A U.S. civic court finds entertainer Bill Cosby liable for drugging and sexually
      assaulting a woman in 1972. The woman is awarded $59.25 million. (AP) (BBC News)
    - Climate change in Germany, Phase-out of fossil fuel vehicles
    - The Federal Court of Justice of Germany dismisses a lawsuit by Environmental
      Action Germany to ban BMW and Mercedes Benz from selling new combustion engine
      vehicles after 2030. (DW)
    - Illegal drug trade in Puerto Rico
    - Puerto Rican police seize $12 million worth of cocaine found on a drug smuggling
      boat off the island's northern coast. Three suspects are arrested. (AP)
    - As a reaction to the 2026 Hatzola arson attack, Belgium deploys (ISTAR) Jagers
      te Paard Battalion, to guard Jewish "sites" and communities. (APT via YouTube)
    - 2026 Italian constitutional referendum
    - In Italy, the constitutional amendment that proposed to select members of the
      High Council of the Judiciary through sortition is rejected by a 46% to 54%
      vote. (Reuters)
    - Following the February 22 elections to the National Assembly of Laos, Thongloun
      Sisoulith is reelected as President of Laos and Sonexay Siphandone as Prime
      Minister. (Xinhua) (Xinhua)
    - In American football, the Seattle Seahawks signs a four-year deal worth $168
      million with wide receiver Jaxon Smith-Njigba, with at least $120 million guaranteed,
      making him the highest-paid wide receiver in NFL history. (KUOW)
