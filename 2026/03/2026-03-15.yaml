date: '2026-03-15'
source_page:
  portal: Portal:Current events/2026 March 15
  language: en
  wikipedia_revision_id: 1361624434
wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Israeli–Palestinian conflict
    - Gaza war
    - Eight police officers, including the police chief of the Deir al-Balah Governorate,
      are killed by an Israeli attack on a police vehicle in Az-Zawayda, Palestine.
      (AFP via Business Recorder)
    - Israeli incursions in the West Bank during the Gaza war
    - Four people are killed and two others are injured when Israel Defense Forces
      soldiers open fire on a civilian car in northern Israeli-occupied West Bank.
      (Hindustan Times)
    - 2026 Iran war
    - 2026 Iranian strikes on Kuwait
    - An Italian MQ-9 Reaper is destroyed in an Iranian drone strike on Ali Al Salem
      Air Base in Kuwait. (ANSA)
    - 2026 Afghanistan–Pakistan war
    - Afghan forces launch mortars into Pakistan, with one hitting a residential property
      in Bajaur District, Khyber Pakhtunkhwa, killing four members of the same family
      and wounding two others. (The Guardian)
    - Jonglei clashes
    - The South Sudan People's Defence Forces announces that they have deployed troops
      in Akobo, South Sudan to secure full control of the area for the first time
      since the outbreak of the civil war in the country after having previously recapturing
      the area from opposition forces. (Medafrica Times)
    - 98th Academy Awards
    - At the Academy Awards, One Battle After Another wins six Academy Awards, including
      Best Picture and the inaugural Achievement in Casting award. (AP) (Reuters)
    - Sinners wins four Academy Awards following a record 16 nominations, with Ryan
      Coogler for original screenplay, Michael B. Jordan for lead actor, Autumn Durald
      Arkapaw for cinematography, and Ludwig Göransson for score. (The Hollywood Reporter)
    - Economic impact of the 2026 Iran war
    - Japan announces it will start releasing 80 million barrels of oil from its reserves,
      the largest such release in the country's history, in response to disruptions
      in the oil supply caused by the conflict. (Reuters)
    - 2026 Kenya floods
    - The death toll from severe flooding in Kenya rises to 66, according to the Kenya
      Red Cross Society. (BBC News)
    - 2026 Kent meningitis outbreak
    - Two people are killed and eleven others are hospitalized in serious condition
      following a meningitis outbreak at the University of Kent in Canterbury, Kent,
      England. (BBC News)
    - 2026 French municipal elections
    - The first round of municipal elections takes place in France. (Reuters)
    - 2026 Kazakh constitutional referendum
    - Kazakhstanis vote in a referendum to approve a new constitution. (Reuters)
    - 2026 North Korean parliamentary election
    - North Koreans vote to elect the 687 members of the 15th Supreme People's Assembly.
      (The Diplomat)
    - 2026 Republic of the Congo presidential election
    - Congolese people vote to elect a president, with incumbent Denis Sassou Nguesso
      seeking a fifth consecutive term. (Reuters)
    - 2026 Vietnamese legislative election
    - Vietnamese citizens vote to elect the 500 members of the 16th National Assembly.
      The sole legal party contesting the election is the Communist Party. (Reuters)
    - 2026 Winter Paralympics
    - 2026 Winter Paralympics closing ceremony
    - The Winter Paralympics conclude in Cortina d'Ampezzo, Italy, with China as the
      highest-ranked team in the medal table. The Paralympic flag is handed over to
      the organizers of the 2030 Winter Paralympics to be held in the French Alps.
      (AFP via France 24)
    - In para ice hockey, the United States defeats Canada 6–2, completing the three-peat
      of hockey championships at the Winter Olympics and Paralympics in Italy. (AP)
    - 2026 Formula One World Championship
    - 2026 Chinese Grand Prix
    - In auto racing, Mercedes-Benz driver Kimi Antonelli wins his first Formula One
      Grand Prix after also setting his maiden pole position at the 2026 Chinese Grand
      Prix. He becomes the second-youngest Grand Prix winner at 19 years old. (AFP
      via France 24)
    - 2026 FIFA World Cup
    - Iran at the FIFA World Cup
    - Asian Football Confederation secretary general Windsor John says that the Iran
      national football team will still play at the upcoming FIFA World Cup despite
      remarks from U.S. President Donald Trump that their safety could be at risk.
      (The Independent)
    - 2026 FC Barcelona presidential election
    - In association football, Joan Laporta is re-elected president of FC Barcelona.
      (ESPN)
