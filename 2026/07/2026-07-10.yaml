wikipedia:
  categories:
    Uncategorized:
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - The Financial Times reports that a delegation from the United States Central
      Command has arrived in Lebanon to implement an agreement to end the conflict
      between Israel, Lebanon, and Hezbollah. (Middle East Eye)
    - The Israeli military says that it has killed an alleged Hezbollah militant emerging
      from a tunnel in Ali al-Taher. (Israel National News)
    - Oyo school kidnappings
    - Nigerian president Bola Tinubu says military, police, and intelligence personnel
      have rescued all 46 students and staff abducted in May from schools in Oyo State,
      arresting eight suspects and killing some abductors during the operation. (AFP
      via Le Monde)
    - 2024–2026 Cuba blackouts, 2026 Cuban crisis
    - Cuba suffers its second nationwide blackout in five days, with state utility
      UNE reporting a total grid collapse amid fuel shortages, aging power plants
      and continuing electricity rationing. (AFP via Jamaica Observer)
    - 2026 Pacific typhoon season
    - Two separate landslides caused by Typhoon Bavi and the enhanced monsoon occur
      in the Philippines. Ten people are killed in Malapatan, Sarangani, after their
      residence is buried. Seven others are killed and two are injured in Calanogas,
      Lanao del Sur, with search operations ongoing for four missing. (Al Jazeera)
      (Manila Bulletin) (ABS-CBN News )
    - Ten people are killed when a Flamingo Air Cessna 402 crashes shortly after takeoff
      from San Andros Airport in North Andros, The Bahamas. (BBC News)
    - Algeria–Mali relations
    - Algeria says its ambassador will return to Mali, while both countries reopen
      their respective airspaces to each other, easing a diplomatic dispute that began
      after Algeria shot down a Malian drone in April 2025. (AFP via Arab News Pakistan)
    - Diesel emissions scandal
    - The High Court in London, England, dismisses claims that automakers Ford, Mercedes,
      Nissan, Renault, and Stellantis use prohibited diesel emissions defeat devices,
      while allowing damages issues over some specific strategies to proceed to a
      second trial. (AFP via Gulf News)
    - A murder investigation is launched into the death of British politician Ann
      Widdecombe yesterday. Police say they have arrested a British man in connection
      with her death. (CNN) (The Daily Telegraph)
    - 2026 in spaceflight
    - China becomes the second country to achieve the controlled recovery of an orbital-class
      rocket booster, after successfully launching the Long March 10B. (South China
      Morning Post)
    - 2026 Diamond League
    - Kenyan middle-distance runner Emmanuel Wanyonyi breaks the men's 1,000 metres
      ​world record in two minutes ‌and 11.83 seconds at the Herculis in Monaco. (Reuters)
