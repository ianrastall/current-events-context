    yesterday. Police say they have arrested a British man in connection with her
    death. (CNN) (The Daily Telegraph)
  - 2026 in spaceflight
  - China becomes the second country in history to achieve the controlled recovery
    of an orbital-class rocket booster, after successfully launching the Long March
    10B. (South China Morning Post)
