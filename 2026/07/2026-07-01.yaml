Date: '2026-07-01'
Source_URI: Portal:Current events/2026 July 1
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Islamabad Memorandum
  - United States vice president JD Vance says that Iran and the U.S. have held technical
    talks based on the recent 14-point memorandum of understanding in Doha, Qatar,
    to discuss the Strait of Hormuz. He also states that the U.S. will not return
    to military action unless necessary. (Haaretz) (Reuters)
  - 2026 Strait of Hormuz crisis
  - South Korea's ocean ministry says that the Panama–flagged cargo vessel HMM Namu
    will leave the Strait of Hormuz in mid-July once major repair is complete on the
    vessel after it was attacked in a explosion on May 4 while it was stranded in
    the waterway. (Reuters)
  - Iranian state television reports that a container ship vessel has used a route
    in the Strait of Hormuz that Iran did not approve. (MS Now)
  - Religion in the United Arab Emirates
  - The Emirate of Dubai, UAE, reopens its Catholic churches, including St. Mary's
    and St. Francis of Assisi in Jebel Ali, after three months of closure amidst the
    Iran war. (Gulf News)
  - Sony says it will stop releasing new PlayStation games on physical optical discs
    from January 2028, citing consumer preference for digital media, and will offer
    new titles through the PlayStation Store and other digital retailers. (AFP via
    France 24)
  - Economic impact of the 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - The International Transport Workers' Federation and the Joint Negotiating Group
    of shipping owners announce they will continue to designate the Strait of Hormuz
    as a warzone, which doubles the pay of mariners there and gives them other benefits.
    (Al Jazeera)
  - 2026 Iran war fuel crisis
  - Saudi Aramco and Algerian oil company Sonatrach announce that they will cut prices
    for liquefied petroleum gas for July, with Saudi Aramco reducing it between 24%
    and 27% and Sonatrach reducing it between 2% and 10%. (Reuters)
  - Economic consequences of the Russo-Ukrainian war
  - Ukraine approves a mechanism for exporting domestically produced weapons and military
    technologies to raise funds for its defense effort against Russia and attract
    foreign investment, while requiring that the Ukrainian military's supply needs
    remain the priority. (AFP via The Straits Times)
  - The Philippines and the World Bank
  - The World Bank classifies the Philippines as an upper-middle-income economy, up
    from lower-middle-income status, after its per capita gross national income exceeds
    the fiscal year 2026 threshold of US$4,496 to $13,935. (Agenzia Nova)
  - 2026 Venezuela earthquakes
  - Venezuelan acting president Delcy Rodríguez declares seven days of national mourning
    for the victims of the earthquakes as the death toll rises to 2,295. (AFP via
    The Standard)
  - Five people are killed and a number of others injured in a fire at an apartment
    block in Antwerp, Belgium. (Reuters)
  - A United States Navy aviator is reportedly missing after a Sikorsky SH-60 Seahawk
    helicopter carrying four crew members assigned to the USS George H. W. Bush made
    an emergency landing in the Arabian Sea. The U.S. Naval Forces Central Command
    and U.S. Fifth Fleet rules out hostile activities in the accident. (Navy Times)
    (Reuters)
  - 2026 Bangladesh measles outbreak
  - The Directorate General of Health Services reports that one child has died from
    measles symptoms in the past 24 hours, bringing the death toll of the outbreak
    in Bangladesh to 719. (Dhaka Tribune)
  - 2026 Ebola epidemic
  - The United States announces a pandemic response team amidst the ongoing Ebola
    outbreak. (Bloomberg)
  - Sudanese cholera epidemic
  - The World Health Organization reports that 120 people have been killed in cholera
    outbreaks in Sudan since May in isolated war zones, alongside suspected 1,102
    cases of the disease. (MENA via The New Arab)
  - The African CDC confirms an isolated case of the Marburg virus in Uganda, amidst
    the ongoing Ebola outbreak in the country. (CNBC Africa)
  - In Canada, Ontario lowers the eligibility age for routine colorectal cancer screening
    from 50 to 45, joining Prince Edward Island as the second province to do so. (CBC
    News) (CP via Toronto Star)
  - 2026 FIFA World Cup
  - 2026 FIFA World Cup controversies
  - Four people are reportedly killed in the early morning hours of Wednesday during
    celebrations in Mexico City following Mexico's victory against Ecuador in the
    knockout round of the 2026 FIFA World Cup. (AP) (Reuters)
  - Google litigation
  - Sweden's Market Court orders Google to pay PriceRunner about 14.3 billion kr (US$1.5
    billion) in damages, Sweden's largest competition-related award, after ruling
    that Google unlawfully favored its own price comparison service over rivals in
    search results. (AFP via France 24) (Firstpost)
  - A firebombing on the homes of ruling New Democracy party members in Thessaloniki,
    Greece, kills one person and injures three others. (AP)
