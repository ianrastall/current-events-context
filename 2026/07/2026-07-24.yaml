wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - Bahrain's military says that they have intercepted a number of missiles and
      drones from Iran. (Arab News)
    - 2026 Iranian strikes on Jordan
    - Jordan's military says that they have intercepted seven missiles and six drones
      launched from Iran. No casualties or damage were reported. (Al-Monitor)
    - 2026 Iranian strikes on Kuwait
    - Kuwait's army says that its air defenses confronted several attacks from Iran.
      (Arab News)
    - Iran says it has attacked U.S. military bases in Bahrain, Jordan, and Kuwait,
      including the Isa Air Base, using Arash drones. (Euronews)
    - 2026 Strait of Hormuz crisis
    - 2026 United States naval blockade of Iran
    - The U.S. military says its forces fired into a tanker's engine room and disabled
      the vessel after its crew repeatedly attempted to breach the American blockade
      of Iranian ports and ignored warnings. (AFP via BSS)
    - The Indian embassy in Tehran reports that the Mozambique-flagged LPG tanker
      Disha with 28 Indian nationals on the vessel was attacked in the Strait of Hormuz.
      All 28 crew members were reported safe. (The Hindustan Times) (India Today)
    - July 2026 United States strikes against Iran
    - The United States strikes an Islamic Revolutionary Guard Corps Navy naval academy
      in Ziba Kenar, Gilan province, Iran. (Arab News) (Iran International)
    - 2026 Iranian strikes on the Kurdistan Region
    - Drones target Erbil in Iraq's Kurdistan Region, with six drones reported to
      be intercepted. (AP) (Kurdistan24)
    - The Wall Street Journal reports that Bahraini and Kuwaiti fighter jets attacked
      military targets inside Iran earlier in July, with air and intelligence support
      from the United Arab Emirates. (The Wall Street Journal) (The Jerusalem Post)
    - Israeli–Palestinian conflict
    - Gaza war
    - The Israeli military reports that the air force has struck Hamas weapon depots,
      weapon manufacturing sites and tunnels in the Gaza Strip, and accuses the militant
      group of violating the ceasefire signed in October 2025. (The Times of Israel)
    - July 2026 West Bank unrest
    - Clashes in Tell, Nablus, kill four Palestinians and two Israelis after a confrontation
      between settlers and locals in the town. Subsequent settler attacks in the West
      Bank injure at least 10 Palestinians. (Haaretz) (The New York Times)
    - Red Sea crisis, Saudi-led intervention in the Yemeni civil war
    - The Houthis deny reports that they have closed the Bab-el-Mandeb and state that
      they are not seeking to close it, reaffirming that they have only established
      a naval blockade against Saudi Arabia. (DW) (Middle East Eye)
    - Saudi Arabia strikes Houthi military sites in Hodeidah, Yemen, after a long
      hiatus in response to the movement's attacks on maritime shipping, while the
      militant group vows to retaliate. (Reuters)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Ukrainian strikes on Wildberries warehouses
    - A Wildberries logistic hub in Russia-occupied Crimea is hit by Ukrainian drones
      and catches fire. (RBC-Ukraine)
    - Ukrainian drones also hit Wildberries logistics hubs in Saint Petersburg and
      Tver, Russia. (Kyiv Independent)
    - Kyiv strikes
    - Ukrainian officials say a Russian ballistic missile strike on a private training
      ground hosting a defence-industry event in the Kyiv Oblast killed 10 people
      and injured nearly 100. Prosecutors investigate possible negligence in organizing
      the event. (Reuters)
    - Violations of non-combatant airspace during the Russo-Ukrainian war
    - A Romanian F-16 ​fighter jet shot down a Russian Geran-2 drone near Padina,
      Buzău County, that had entered its airspace for the first ‌time. (Euronews)
    - Sudanese civil war
    - Kordofan campaign
    - The North Kordofan government reports that 15 civilians in the Burbur area south
      of El-Obeid, Sudan have been killed by a Rapid Support Forces drone strike.
      (Sudan Tribune)
    - Insurgency in Khyber Pakhtunkhwa
    - At least 27 people are killed, including 12 militants, in an attack on a security
      check post in Tank District, Khyber Pakhtunkhwa, Pakistan. (Hindustan Times)
    - Tariffs in the second Trump administration
    - 2025–2026 United States trade war with Canada and Mexico
    - The Gordie Howe International Bridge, which connects between Detroit, Michigan,
      U.S., and Windsor, Ontario, Canada, ceremonially opens, with Canadian officials
      marking the opening ceremony of the bridge with the absence of American officials
      amidst ongoing trade tensions. (Detroit Free Press) (Reuters)
    - Proposed acquisition of Warner Bros. Discovery by Paramount Skydance
    - Paramount announces that they have agreed to delay its US$111 billion acquisition
      of Warner Bros. Discovery amidst lawsuits from twelve U.S. state attorneys general.
      (AFP via France 24) (The Hill)
    - Wildfires in 2026
    - 2026 France wildfires
    - French authorities evacuate more than 110,000 people from Cap Ferret, Gironde,
      by land and sea as an uncontrolled wildfire burns over 19,000 hectares, destroys
      80 homes, and threatens the peninsula’s only access road. (The Guardian)
    - 2026 Spain wildfires
    - Spanish interior minister Fernando Grande-Marlaska declares a national emergency
      over wildfires in the Community of Madrid and the Province of Ávila, placing
      the Military Emergencies Unit in command. Authorities evacuate more than 10,000
      people as three major fires remain uncontrolled. (AA)
    - The death toll from the sinking of passenger ferry MV Barima off the coast of
      Guyana two days ago rises to 72. (The Guardian)
    - Thirteen people are killed and two others are injured after a heavy boulder
      rolled down a hill and hit moving vehicles in Chamba District, India. (Xinhua)
    - Five people are killed and three others are injured when a soil collapse buries
      a house in Hongtong County, Shanxi, China. (Reuters)
    - 2026 Ebola epidemic
    - Oxford University reports the first volunteer that has been injected with the
      Ebola vaccine aimed at targeting the Bundibugyo ebolavirus strain of Ebola that
      is causing a outbreak in the Democratic Republic of the Congo. (AFP via GMA
      News Online)
    - 2026 United States cyclosporiasis outbreak
    - 'The U.S. Centers for Disease Control and Prevention (CDC) reports that the
      ongoing cyclosporiasis outbreak, which is caused by Cyclospora cayetanensis,
      has spread to an additional four states: Illinois, Kansas, Oklahoma, and Pennsylvania.
      (CNBC)'
    - The U.S. state of Michigan surpasses 8,100 cases of cyclosporiasis. (CBS News)
    - Dengue fever outbreaks
    - The Sudan Doctors Union reports a dengue fever outbreak in Sudan's Blue Nile
      state, killing 39 people and leaving 300 infected. (Sudan Tribune)
    - Measles resurgence in the United States
    - The U.S. CDC reports 2,318 confirmed measles cases in the country during the
      first seven months of 2026, marking the highest annual total since 1991. (AFP
      via Euractiv)
    - International sanctions against Iran
    - Iran–European Union relations
    - The European Union sanctions five Iranian judges over alleged human rights violations
      and Ashiyane cyber group founder Nima Salehi, whom it accuses of cooperating
      with Iranian authorities to suppress information. (Reuters)
    - United States sanctions against Iran
    - The U.S. treasury department announces sanctions against nine firms and four
      people associated with sanctioned Iranian financer Babak Zanjani after attempting
      to evade previous sanctions. (Reuters)
    - International Criminal Court investigation in Venezuela
    - Venezuelan foreign minister Félix Plasencia says the country will withdraw from
      the International Criminal Court (ICC), citing alleged geographic bias. The
      ICC says it has not received formal notice and that existing investigations
      and cooperation obligations remain unaffected. (AFP via RFI)
    - Mexico–United States relations, Mexican war on drugs
    - The U.S. state department, in coordination with the Mexican finance ministry,
      sanctions over 50 Mexican individuals and companies allegedly linked to the
      Jalisco New Generation Cartel. (Bloomberg) (El País)
    - 2020 Phala Phala robbery
    - A South African court temporarily halts the parliament's impeachment inquiry
      into president Cyril Ramaphosa over the theft of US$580,000 from his farm, pending
      his challenge to a report finding possible constitutional violations. (Reuters)
    - Karolkiewicz family murders
    - Eight people are killed, including six children, in an arson and shooting attack
      at a house in Grand Haven Charter Township, Michigan, United States. (ABC News)
      (The Indian Express)
    - Diplomatic sources say International Criminal Court member states voted to remove
      chief prosecutor Karim Ahmad Khan following sexual misconduct allegations. (Al
      Jazeera) (CNN)
    - Prosecutors say thieves stole a 2,500-year-old gold Celtic necklace from the
      Musée du Pays Châtillonnais in Châtillon-sur-Seine, Côte-d'Or, France, after
      breaking its display case during opening hours. The artifact belongs to the
      Vix treasure. (AFP via The Manila Times)
    - Protests against the dismissal of Mykhailo Fedorov
    - For the ninth consecutive day, thousands continue to protest in Kyiv, Ukraine,
      demanding Mykhailo Fedorov's reinstatement as Minister of Defence. (The Kyiv
      Independent)
    - Bangladeshi president Mohammed Shahabuddin resigns from office, citing health
      reasons. (Reuters)
    - Forty deputies of the Polish Sejm leave the Law and Justice party as part of
      a dispute between party leader Jarosław Kaczyński and member Mateusz Morawiecki.
      (AP) (Polsat )
    - The SpaceX Starship test flight 13, the first to successfully deploy operational
      Starlink satellites, successfully lands in the Indian Ocean intact. (CNN)
