wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - The Islamic Revolutionary Guard Corps says that they have launched strikes on
      Amazon's data center in Bahrain. (CNBC)
    - 2026 Iranian strikes on Jordan
    - The U.S. military confirms that a third service member, identified as 28-year-old
      Sgt. Angel S Rampersad of New York, was killed during a recent attack on the
      Muwaffaq Salti Air Base in Jordan, bringing the total American casualties to
      18. (Military Times)
    - 2026 Strait of Hormuz crisis
    - Malta's sustainable mobility ministry confirms that the Greek-owned Malta-flagged
      oil tanker M/T Kavomaleas was "subject to an attack" in the Strait of Hormuz
      as it was navigating the southern corridor of the waterway. Additionally, all
      23 crew members of the vessel are reported to be rescued. (Malta Today)
    - A tanker is attacked by Iran in the coast of Oman near the Strait of Hormuz
      in the wake of the U.S. military conducting strikes for a 10th consecutive night
      yesterday, forcing crew to abandon ship. The United Kingdom Maritime Trade Operations
      also confirms the attack. (Military.com)
    - July 2026 United States strikes against Iran
    - Israeli finance minister Bezalel Smotrich says that Israel will not join the
      United States in striking Iran. (Middle East Eye)
    - The United States Central Command confirms that they have launched an 11th round
      of strikes against Iran, against hangars and military targets such as military
      logistics infrastructure. (The Jerusalem Post) (Reuters)
    - Gaza war
    - The Israeli military and Shin Bet states that senior Hamas Gaza City Brigade
      commander Adham Ibrahim Shaaban Nasman, who was involved in directing the October
      7, 2023, attacks and taking hostages, has been killed in a Israeli airstrike
      in the city last weekend, despite the ongoing ceasefire. (The Sunday Guardian)
      (The Times of Israel)
    - Local medics report that 12 Palestinians, including four children, have been
      killed in airstrikes across Gaza City, in violation of the ongoing ceasefire.
      (BBC News)
    - Red Sea crisis
    - Two oil tankers departing Saudi Arabia, Xin Long Yang and Rodos, turn around
      in the Red Sea and head for the Suez Canal instead of the Strait of Bab-el-Mandeb,
      after a warning by Houthi-controlled Yemen. (Reuters)
    - Sudanese civil war
    - Darfur campaign
    - Around 21 people are reported to be killed in a drone strike by Rapid Support
      Forces in the Tina region of Sudan's North Darfur state near the border with
      Chad. (Sudan Tribune)
    - Communal conflicts in Nigeria
    - Nigerian bandit conflict
    - A survivor and local official say an armed gang abducted more than 40 people
      during raids on 11 villages in Maru, Zamfara State, Nigeria, over the weekend.
      The local government requests additional security forces. (AFP via NDTV)
    - Residents say motorcycle-riding gunmen killed at least 24 farmers and wounded
      several others in attacks on villages in Talata Mafara, Zamfara State, before
      stealing livestock and leaving the area. (Reuters)
    - Three women and a zonal commander are killed, while two youths are injured,
      as gunmen ambush a youth meeting in Omoku, Rivers State, Nigeria following a
      local community dispute. (PunchNG)
    - Tariffs in the second Trump administration
    - 2025–2026 United States trade war with Canada and Mexico
    - A spokesperson for Canadian infrastructure minister Gregor Robertson announces
      that Canada has cancelled a joint opening ceremony for the Gordie Howe International
      Bridge that will connect Detroit, Michigan, and Windsor, Ontario, after U.S.
      president Donald Trump announced 50% tariffs on Canadian goods. (AP) (CBC)
    - Trump announces that imported generic drugs will remain tariff-free until August
      2028, face a 100% tariff for one year, and a 200% tariff thereafter, citing
      efforts to move pharmaceutical production to the country. (AFP via NDTV)
    - Russia stops issuing bonds after recent auctions failed to find buyers. (Bloomberg)
    - In Vietnam, a fire on a bus travelling from Lâm Đồng province to Ho Chi Minh
      City kills seven passengers and injures five others. (Reuters)
    - The death toll from the sinking of passenger ferry MV Barima off the coast of
      Guyana two days ago rises to 53. Seventy-seven others were rescued, while over
      55 remain missing. (NEWS Source Guyana) (Demerara Waves) (Guyana Chronicle)
    - The Australian reports that Australian doctor Tareq Kamleh, who traveled to
      Syria to join the Islamic State, is found alive in a prison in Baghdad, Iraq.
      (ABC News Australia) (The West Australian)
    - 2026 United States cyclosporiasis outbreak
    - The U.S. state of Michigan reports 6,571 cases of cyclosporiasis, which is caused
      by Cyclospora cayetanensis. (Reuters)
    - Venezuela's health ministry reports that the hantavirus killed three people
      in Anzoátegui, says no evidence indicates human-to-human transmission, and rejects
      any connection to two unexplained deaths among medical workers in Barinas. (AFP
      via Jamaica Observer)
    - Lebanon–United States relations
    - U.S. president Donald Trump authorizes U.S. airlines to resume direct flights
      to Lebanon, ending a suspension imposed after the 1985 hijacking of TWA Flight
      847. (The Independent)
    - 2026 Delhi Jantar Mantar protests
    - Indian police detain Lok Sabha opposition leader Rahul Gandhi during education-reform
      protests in New Delhi after he called for prime minister Narendra Modi's resignation.
      Parliament adjourns as demonstrators demand accountability for examination scandals
      and education minister Dharmendra Pradhan's removal. (AFP via The New Zealand
      Herald) (The Hindu) (The Times of India)
    - Two American tourists are injured, including one seriously, in a stabbing attack
      near the Acropolis in Athens, Greece. A 60-year-old Greek man is taken into
      custody. (AP)
    - Dismissal of Mykhailo Fedorov
    - Ukrainian president Volodymyr Zelenskyy dismisses commander-in-chief Oleksandr
      Syrskyi amid protests over the removal of defence minister Mykhailo Fedorov
      and appoints Joint Forces commander Mykhailo Drapatyi as Syrskyi's replacement.
      (CNN)
    - Republican People's Party absolute nullity crisis
    - Özgür Özel, the leader of the Turkish opposition Republican People's Party,
      who was ousted in May by a judicial ruling, announces that he will establish
      a new political party. (AP) (Al Jazeera)
    - The French Parliament approves legislation allowing limited use of acetamiprid
      and flupyradifurone, pesticides banned nationally but permitted in the European
      Union. Environment minister Monique Barbut says she will resign over the measure.
      (AFP via News.com.au)
    - The wreckage of Pan Am Flight 526A, a Douglas DC-4 that crashed into the sea
      off Puerto Rico in 1952, killing 52 people, is located by a veteran aviation
      search team. (The Dallas Express via Yahoo News)
    - 2026–27 Premier League
    - In association football, Chelsea sign attacking midfielder Morgan Rogers from
      Aston Villa for a British record transfer fee of £117 million. (BBC Sport)
