Date: '2026-07-21'
Source_URI: Portal:Current events/2026 July 21
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - A tanker is attacked by Iran in the coast of Oman near the Strait of Hormuz in
    the wake of the U.S. military conducting strikes for a 10th consecutive night
    yesterday, forcing crew to abandon ship. The United Kingdom Maritime Trade Operations
    also confirms the attack. (Military.com)
  - July 2026 United States strikes against Iran
  - Israeli finance minister Bezalel Smotrich says that Israel will not join the United
    States in striking Iran. (Middle East Eye)
  - Analysis of the 2026 Iran war
  - U.S Defense Secretary Pete Hegseth says that the Iran war has cost the United
    States $37.5 billion. (The Wall Street Journal) (BBC News)
  - Gaza war
  - Israel Defense Forces and Shin Bet states that senior Hamas Gaza City Brigade
    commander Adham Ibrahim Shaaban Nasman, who was involved in directing the October
    7 attacks and taking hostages, has been killed in a Israeli airstrike in Gaza
    City last weekend, despite the ongoing ceasefire. (The Times of Israel)
  - Local medics report that 12 Palestinians, including four children, have been killed
    in airstrikes across the Gaza Strip in Gaza City, in violation of the ongoing
    ceasefire. (BBC News)
  - Red Sea crisis
  - Two oil tankers departing Saudi Arabia, Xin Long Yang and Rodos, turn around in
    the Red Sea and head for the Suez Canal instead of the Strait of Bab-el-Mandeb,
    after a warning by Houthi-controlled Yemen. (Reuters)
  - Sudanese civil war
  - Darfur campaign
  - Around 21 people are reported to be killed in a drone strike by Rapid Support
    Forces in the Tina region of Sudan's North Darfur state near the border with Chad.
    (Sudan Tribune)
  - A fire on a bus travelling from Lâm Đồng province to Ho Chi Minh City kills seven
    passengers and injures five others in southern Vietnam. (Reuters)
  - The death toll from the sinking of passenger ferry MV Barima off the coast of
    Guyana two days ago rises to 41. 77 others were rescued, while 61 remain missing.
    (Guyana Chronicle)
  - 2026 United States cyclosporiasis outbreak
  - The U.S. state of Michigan reports 6,571 cases of cyclosporiasis, which is caused
    by Cyclospora cayetanensis. (Reuters)
  - Protests against the 2026 Iran war
  - Anti-war protesters interrupt a hearing in the United States Senate by U.S Defense
    Secretary Pete Hegseth over the wars in Iran and Palestine, with the protesters
    removed by police. (Sky News) (NewsNation) (MilitaryNews)
  - Two American tourists are injured, including one seriously, in a stabbing attack
    near the Acropolis in Athens, Greece. A 60-year-old Greek man is taken into custody.
    (AP)
  - Republican People's Party absolute nullity crisis
  - Özgür Özel, the leader of the Turkish opposition Republican People's Party, who
    was ousted in May by a judicial ruling, announces that he will establish a new
    political party. (AP)
  - The wreckage of Pan Am Flight 526A, a Douglas DC-4 that crashed into the sea off
    Puerto Rico in 1952, killing 52 people, is located by a veteran aviation search
    team. (The Dallas Express via Yahoo News)
