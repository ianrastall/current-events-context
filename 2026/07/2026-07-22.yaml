wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Jordan
    - The Jordanian military reports that air defenses have intercepted 8 out of 10
      projectiles fired by Iran against the country in Aqaba near the Israeli border,
      with two missiles landing in remote areas. (ABC News) (CBC) (Ynetnews)
    - Kuwait in the 2026 Iran war
    - The General Staff of the Kuwait Army reports that Kuwait's military and air
      defenses have been actively intercepting "hostile drones" from Iran. (Arab Times
      Kuwait) (The Times Kuwait)
    - July 2026 United States strikes against Iran
    - The United States military launches Tomahawk missile strikes on Iran's Larak
      Island. (AFP via Al Arabiya)
    - The U.S. Central Command launches a new round of strikes against Iran, marking
      the 12th consecutive day of attacks. (AP) (Middle East Eye)
    - 2026 Strait of Hormuz crisis
    - Financial Times reports that the tanker Kavomalaes, belonging to Greek shipowner
      George Prokopiou, was "highly likely" to have been captured in the Strait of
      Hormuz by Iran two days earlier. (Forbes)
    - Gaza war
    - The Israel Defense Forces and Shin Bet announces that they have killed three
      Hamas militants in the northern Gaza Strip, including one in the Hamas military
      wing that took part in the October 7 attacks on Israel. (The Jerusalem Post)
      (Cleveland Jewish News)
    - Red Sea crisis
    - Seven oil tankers departing Saudi Arabia's port of Yanbu change course away
      from the Strait of Bab-el-Mandeb after the Houthis announced a blockade on Saudi
      Arabian ports. (The Washington Post) (Reuters)
    - Sudanese civil war
    - Kordofan campaign
    - UNICEF reports that six people, including two children, have been killed and
      30 people including children have been injured in a drone strike on a market
      in Al-Rahad, North Kordofan, Sudan. (AA)
    - A Chadian official reports that a drone attack from Sudanese territory has attacked
      positions in Chad, injuring civilians and destroying vehicles and several shops.
      The attack is the fifth in recent months, following an incursion by Rapid Support
      Forces last January. (Sudan Tribune)
    - Allied Democratic Forces insurgency
    - Sixteen civilians, most of whom gold miners, are killed during a village attack
      suspected to have been perpetrated by ADF forces in Mandeite locality, Mambasa,
      Ituri Province, Democratic Republic of the Congo. (AA)
    - Southern Thailand insurgency
    - Five soldiers are killed and six civilians are injured in a mass shooting by
      ten unknown gunmen at a security checkpoint in Narathiwat province, Thailand.
      (Al Jazeera)
    - Insurgency in Jammu and Kashmir
    - A 35-year-old head constable is shot and killed in a militant attack in Anantnag,
      Jammu and Kashmir, India. The Resistance Front claims responsibility. (NDTV)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - Oil prices, including Brent Crude and West Texas Intermediate, rise to over
      US$95 and $86 per barrel, respectively, and the United States average gasoline
      price rises to $4.06 per gallon, amidst the ongoing conflict. (CNBC) (NBC News)
    - Seven people are killed after a truck collides with a medical transport van
      in Pernambuco, Brazil. (Xinhua)
    - A Robinson R44 helicopter crashes in Sincan, Ankara, Turkey, killing the pilot
      and injuring the co-pilot. (Turkiye Today)
    - In the United States, West Virginia governor Patrick Morrisey declares a state
      of emergency and announces that 100 National Guard troops have been deployed
      after flash floods caused by torrential rains were reported across the state,
      including the northern part. (AP) (The Independent)
    - 2026 Bangladesh measles outbreak
    - The death toll from the ongoing measles outbreak in Bangladesh exceeds 800.
      (The Business Standard) (Dhaka Tribune)
    - 2026 Ebola epidemic
    - African CDC director Jean Kaseya reports that the death toll from the Ebola
      outbreak in the Democratic Republic of the Congo has reached past 1,000. (AP)
    - 2026 United States cyclosporiasis outbreak
    - The number of reported cyclosporiasis cases in the U.S. state of Michigan exceeds
      7,000. (Reuters) (WDIV)
    - The fire department of Tokyo, Japan, reports 453 heat-related hospitalizations,
      its highest daily total since records began in 2010, as a severe heat wave kills
      one person and leaves four critically ill. The country's Fire and Disaster Management
      Agency reports at least 14 heat-related deaths nationwide over the previous
      week. (AFP via Malay Mail)
    - Saudi Arabia–United States relations, Nuclear program of Saudi Arabia
    - Saudi Arabia and the United States sign a civil nuclear cooperation agreement
      allowing Saudi Arabia to use U.S. reactor technology, enrich uranium, and reprocess
      nuclear waste. The pact excludes the IAEA Additional Protocol and proceeds to
      U.S. congressional review. (AFP via France 24) (Reuters)
    - Stabbing of Salman Rushdie
    - The federal trial against Hadi Matar, the man who attempted to kill author Salman
      Rushdie in August 2022 in New York, United States, opens. If he is convicted,
      Matar faces a sentence of life in prison. He is already serving a 25-year state
      prison sentence in New York. (AP) (The Guardian)
    - Unknown gunmen open fire at a police station in Canindeyú Department, Paraguay,
      killing three officers and wounding another. (Abc.com)
    - 2026 Delhi Jantar Mantar protests
    - Indian opposition leader Rahul Gandhi is released after police detained him
      outside prime minister Narendra Modi's residence yesterday during protests demanding
      education minister Dharmendra Pradhan's resignation and changes to the examination
      system. (AFP via France 24)
    - Catholic Church in China
    - Pope Leo XIV consecrates Fr. Joseph Chang Yanfeng as the bishop of Chifeng in
      the Inner Mongolia Autonomous Region of China under the 2018 provisional framework,
      which cedes authority over its bishops to the Chinese government. (Holy See)
      (Vatican News)
    - Exomoon candidates
    - The European Southern Observatory's Very Large Telescope reports evidence of
      a possible exomoon-like object orbiting the brown dwarf CD-35 2722 B in the
      CD-35 2722 system, in a study published in the Nature journal. (Space.com) (Phys.org)
      (Nature)
