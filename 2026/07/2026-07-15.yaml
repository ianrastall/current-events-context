    in the Greater Tunb Island. (AFP via NDTV) (Politico)
  - Gaza war
  - Gaza peace plan
  - Morocco signs an agreement with the Board of Peace to join the International Stabilization
    Force for Gaza. (Reuters)
  - Nirim attack, Gaza war hostage crisis
  - Israel's military claims to have killed an alleged militant from the Hamas branch
    Al-Qassam Brigades who they state participated in the abduction of soldiers Col.
    Asaf Hamami, St.-Sgt. Tomer Yaakov Ahimas, and Sgt. Kiril Brodski during the October
    7 attacks on the Kibbutz Nirim. (The Jerusalem Post) (Haaretz)
  - Sudanese civil war
  - Darfur campaign
  - The Sudanese Armed Forces-allied Joint Forces announce that they have recaptured
    the Orshi Reservoir area in Sudan's North Darfur state, a month after the Rapid
    Support Forces seized the area. (AA)
  - 2026 Ebola epidemic
  - The total amount of cases of Ebola in the Democratic Republic of the Congo exceed
    2,000. (Medical Xpress)
  - United Kingdom–European Union relations
  - Effect of Brexit on Gibraltar
  - The United Kingdom and the European Union remove the land-border fence between
    Gibraltar and Spain under a post-Brexit treaty, allowing free movement while introducing
    joint British-Spanish checks at Gibraltar's airport and port. (AP)
  - Bhutanese refugees scam
  - A district court in Kathmandu, Nepal, sentences former deputy prime minister Top
    Bahadur Rayamajhi to four years in prison and former home minister Bal Krishna
    Khand to two years for roles in forging documents for a fraudulent Bhutanese refugee
    resettlement scheme. (Reuters)
  - Democratic Republic of the Congo–Rwanda conflict
  - The Democratic Republic of the Congo establishes a council composed of mostly
    international war crimes lawyers to advise state institutions seeking accountability
    and reparations for victims of violence in the country's east. (Reuters)
  - Detention of Craig and Lindsay Foreman
  - The family of British national Craig Foreman says an Iranian court has added two
    years to his 10-year espionage prison sentence for speaking to the media, as he
    and his wife Lindsay continue a hunger strike. (CBS News)
  - France's National Assembly gives final approval to a bill allowing eligible adults
    with incurable, life-threatening illnesses to obtain lethal medication under strict
    conditions. The measure awaits Constitutional Council review before taking effect.
    (AP)
