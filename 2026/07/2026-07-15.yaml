  - 2026 Iran war ceasefire
  - Iranian parliament speaker Mohammad Bagher Ghalibaf says that ceasefire negotiations
    aimed at ending the war have not closed despite renewed fighting between Iran
    and the United States. (The New York Times)
  - 2026 Strait of Hormuz crisis
  - 2026 Strait of Hormuz campaign
  - 2026 United States naval blockade of Iran
  - The United States Central Command (CENTCOM) says that American forces have redirected
    two commercial vessels since the blockade resumed. (AA)
  - Iran's Islamic Revolutionary Guard Corps says the Strait of Hormuz will remain
    closed "until the United States ends its acts of aggression". (Euractiv)
