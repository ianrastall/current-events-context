wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - Three commercial vessels are reported to be attacked near the Strait of Hormuz,
      including the Qatari LNG tanker Al Rekayyat, which is owned by Nakilat. (AP)
    - Al Rekayyat is reported to be at a risk of explosion following the attack. The
      attack marks the first time a vessel from Qatar was attacked since the war started
      on February 28. (Al-Monitor)
    - The United States revokes the temporary sanctions waiver against Iranian oil
      issued as part of the Islamabad Memorandum after the attacks on the three vessels.
      (AFP via CNA) (Axios)
    - U.S. forces strike Iranian air-defence, coastal surveillance, and missile sites
      after attacks hit three commercial vessels in the Strait of Hormuz, with explosions
      heard in Bandar Abbas, Bandar Sirik, and Qeshm Island. Iran accuses the U.S.
      of violating their memorandum of understanding and warns of retaliation. (AFP
      via CNA)
    - Gaza war
    - Israeli bombing of the Gaza Strip
    - Israeli airstrikes and gunfire kill at least seven people, including a child,
      in the Gaza Strip, while Israel says the airstrikes targeted Hamas militants.
      (Reuters)
    - The Israel Defense Forces and Shin Bet says that they have killed a Hamas Nukhba
      Force commander and another commander associated with the militant group's intelligence
      unit. (JNS)
    - Sudanese civil war
    - Kordofan campaign
    - Human rights groups say that 15 people have been killed in drone strikes in
      Sudan's North Kordofan state. (AFP via Al-Arabiya)
    - The Sudanese Army says that it has shot down a Chinese-made FH-95 drone in North
      Kordofan, the third model shot down by the army. (AA)
    - 2026 Damascus bombings
    - One person was killed and 36 others are injured in two explosions near Four
      Seasons Hotel Damascus, Syria, where French president Emmanuel Macron stayed
      during his state visit to the country. Macron was not at the hotel during the
      explosions. (AP)
    - K2 Airways Flight 1732
    - A K2 Airways Boeing 737-400 cargo aircraft goes missing off the coast of Pakistan
      with five people on board. (The Independent)
    - Fourteen people are killed and 28 others are injured after a bus collided head-on
      with a trailer on the Kampala–Gulu Highway, in Northern Uganda. (Xinhua)
    - Two people are killed and 14 others are injured after a bus veered off a road
      and struck pedestrians in Amadora, Portugal. (Xinhua)
    - Two people are killed and seven others are missing after a massive landslide
      triggered by heavy rains hit a bridge in Wayanad District, Kerala, India. (Xinhua)
    - Sudanese cholera epidemic
    - The Médecins Sans Frontières deploys to the Darfur region amidst ongoing cases
      of cholera in the Kordofan states of West and North Kordofan. (Sudan Tribune)
    - 2026 Ankara NATO summit
    - Greenland crisis
    - At the NATO summit in Ankara, Turkey, U.S. president Donald Trump renews his
      calls for the United States to control Greenland, and says that the U.S. could
      remove troops from Europe over the dispute. (CNBC)
    - Turkey–United States relations
    - Trump says that the U.S. will lift sanctions against Turkey that were imposed
      in 2020 over its purchase of Russian defense missiles. (Defense News)
    - Iraq in the 2026 Iran war
    - State funeral of Ali Khamenei
    - Iraqi state television says that former Iranian supreme leader Ali Khamenei's
      remains has arrived in Iraq's Shi'ite holy city of Najaf for viewing following
      funeral ceremonies in Tehran and Qom, Iran. (Reuters)
    - 2027 French presidential election
    - French deputy Marine Le Pen announces her candidacy for president in the next
      election as the far-right National Rally's nominee. It will be her fourth bid
      for the presidency. (CNN)
    - 2026 FIFA World Cup
    - Argentina at the FIFA World Cup
    - In association football, Argentine forward and captain Lionel Messi becomes
      the first player to score in nine consecutive World Cup matches (including the
      previous edition), after scoring in the team's 3–2 victory against Egypt in
      the round of 16. (ABC News)
    - Switzerland at the FIFA World Cup
    - Switzerland advances to the quarterfinals of the FIFA World Cup for the first
      time since 1954 after beating Colombia in a penalty shootout in the round of
      16. (CBS Sports)
    - 2028 Summer Olympics
    - Doping in Russia, Russia at the Summer Olympics, International sporting sanctions
      during the Russian invasion of Ukraine
    - The International Olympic Committee lifts its ban on Russian athletes, allowing
      them to take part in the upcoming Summer Olympics in Los Angeles, United States,
      after previously being banned from competing under its own flag for doping and
      the 2022 invasion of Ukraine. (The Guardian)
