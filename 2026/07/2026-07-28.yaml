wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Gaza peace plan
    - A Hamas delegation visits Cairo, Egypt, to resume negotiations on the implementation
      of the next phase of its ceasefire with Israel. (The Jerusalem Post)
    - 2026 Iran war
    - The United States Central Command says that Islamic Revolutionary Guard Corps
      forces have launched multiple ballistic missiles from Iran in a "surprise attack"
      against U.S. forces in the Middle East, and that all missiles were successfully
      intercepted. (Politico)
    - Mali War
    - 2026 Mali offensives
    - Malian Armed Forces launch strikes against two armed vehicles and Jama'at Nusrat
      al-Islam wal-Muslimin and Azawad Liberation Front militants in the Ségou Region
      near Dagabory as part of Operation Dougoukoloko. (APA)
    - Sudanese civil war
    - Kordofan campaign
    - Human rights group Emergency Lawyers reports that recent airstrikes have targeted
      multiple locations in North Kordofan, Sudan, including a water station and civilian
      vehicles, killing dozens of civilians. (Sudan Tribune)
    - Sudanese refugee crisis, Darfur campaign
    - The United Nations reports that over 20,000 people have been displaced in Sudan's
      Darfur region over insecurity and violence. (Middle East Monitor)
    - 2026 Booker Prize
    - The longlist for the 2026 Booker Prize is announced. (The Guardian)
    - 2026 Kumamoto earthquake
    - A earthquake strikes central Kumamoto Prefecture, Japan, causing a tsunami alert
      for the western Kyūshū coast. At least 13 people are killed. (CNN)
    - Three more people are rescued from the Vietnamese cargo ship that sank on Saturday.
      Fourteen others remain missing with a multinational search still underway. (AFP
      via The Canadian Press) (South China Morning Post)
    - International sanctions during the Russian invasion of Ukraine, United States
      and the Russo-Ukrainian war
    - The United States Senate votes 86–12 to advance legislation imposing sanctions
      on Russia's energy revenues, financial institutions, officials, and shadow fleet,
      while authorizing tariffs of up to 100% on major buyers of Russian oil and gas.
      (Politico) (Kyiv Post)
    - 2024 Apalachee High School shooting
    - The gunman convicted of carrying out a school shooting at Apalachee High School
      in Winder, Georgia, United States, in 2024, receives four sentences of life
      in prison without the possibility of parole. (AFP via Philippine Daily Inquirer)
    - Myanmar's military-backed parliament passes a law allowing the death penalty
      when coercion, unlawful detention, torture, or other abuse used to force victims
      into online scams results in death. The law also imposes severe penalties on
      scam-centre operators. (AFP via France 24)
    - Taiwanese prosecutors detain an Nvidia employee in an investigation into alleged
      smuggling of advanced artificial intelligence chips to China through falsified
      transport documents. Authorities hold seven people over shipments of about 50
      Supermicro servers that may violate U.S. export controls. (AFP via France 24)
    - 2026 Peruvian general election
    - Keiko Fujimori is sworn in as President of Peru after winning the general election
      in June. (AP) (Reuters)
    - 2026 Victorian Labor Party leadership election
    - In Australia, Victorian premier Jacinta Allan resigns, triggering a leadership
      spill. Ben Carroll is elected unanimously as the new Premier and Victorian Labor
      Party leader. (ABC News Australia) (Reuters)
    - Women in Algeria
    - Khalida Boufedeche is elected the first woman president of the People's National
      Assembly of Algeria. (France24)
