wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Attacks on refugee camps in the Gaza war, Killing of health workers in the Gaza
      war
    - A Israeli airstrike reportedly kills a Palestinian medic at the Nuseirat refugee
      camp in the central Gaza Strip. (Reuters via The Times of Israel)
    - An Israeli airstrike reportedly kills senior brigadier general Abdel-Nasser
      Al-Maqadma, the head of the Hamas police force in the North Gaza Governorate,
      Gaza. (Asharq Al-Awsat) (Reuters)
    - The Israeli military confirms that they have killed several Hamas militants
      over the past few weeks, including a Nukhba forces cell commander who took part
      in the Kissufim massacre during the October 7, 2023 attacks. (The Times of Israel)
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - The naval forces of the Islamic Revolutionary Guard Corps claims to have stopped
      four vessels from transiting the Strait of Hormuz. (Middle East Eye)
    - July 2026 United States strikes against Iran
    - Iranian health ministry spokesperson Hossein Kermanpour reports no U.S. military
      strikes against Iran, after 13 consecutive nights of strikes by the U.S. Central
      Command against the country. (NBC News)
    - The United States halts strikes against Iran after government officials reportedly
      saw a potential opening to resume diplomatic efforts and talks. (Al-Monitor)
      (AP)
    - Red Sea crisis, Saudi-led intervention in the Yemeni civil war
    - Two people are injured by Saudi-led coalition airstrikes on Hodeidah, Houthi-controlled
      Yemen. A Patriot battery operated by the Greek military intercepts two ballistic
      missiles fired by the Houthis at Aramco facilities in Yanbu and Jizan, Saudi
      Arabia. (CNBC) (NBC News) (Al Jazeera)
    - Russo-Ukrainian war
    - Russian attacks on civilians in the Russo-Ukrainian war
    - Ukrainian officials say a Russian drone strike on a postal facility in Sumy
      has killed two people. (AFP via BGNES)
    - Sudanese civil war
    - Kordofan campaign
    - Darfur Joint Protection Force spokesperson Mutawakkil Ali Wakil confirms that,
      in coordination with the Sudanese Armed Forces (SAF), that the joint force have
      retaken control of Umm Sayala, North Kordofan, Sudan, with 38 members of the
      Rapid Support Forces confirmed to have been killed. (Sudan Horizon)
    - The SAF and Darfur Joint Protection Force recapture Jebrat al Sheikh alongside
      the North Kordofan towns of Bara and Al-Baraka. Additionally, Darfur governor
      Minni Arko Minawi confirms the recaptures. (Sudan Tribune)
    - Snyder Fire
    - A fourth firefighter dies from injuries sustained in a wildfire at the Colorado–Utah
      border in the United States on June 27. (The Guardian) (KUSA)
    - 2026 Assam floods
    - The death toll from the flash floods in Assam, India, rises to 62, after fourteen
      more fatalities are confirmed. (NDTV)
    - At least 35 people are killed and 30 others are injured when two buses collide
      on the Deir ez-Zor–Damascus road in Syria. (Reuters)
    - Two people are killed when a Tecnam P2010 aircraft crashes into a home in Ganderkesee,
      Lower Saxony, Germany. (DPA via South China Morning Post)
    - One person is killed and at least 22 others are injured in a five-alarm fire
      in Flushing, New York City, United States. (WNBC)
    - Brazil–United States relations
    - Brazil denies visas to two U.S. state department officials seeking election-related
      meetings in Brasília, citing risks of "political exploitation". The U.S. state
      department says the visit concerns electoral integrity and freedom of expression.
      (AFP via Arab News)
    - 2026 Berlin Pride attack
    - Abdul Ballout, a 21-year-old Lebanese-German, drives into a crowd at the pride
      festival in Berlin, Germany, killing a person and injuring 29 others. A suspect
      is on the run. (CNN)
    - 2026 Brazilian general election
    - Brazil's Liberal Party formally nominates Rio de Janeiro senator Flávio Bolsonaro,
      former president Jair Bolsonaro's son, as its presidential candidate in the
      upcoming election. (AFP via Philippine Daily Inquirer) (Reuters)
    - 2026 Delhi Jantar Mantar protests
    - Indian education minister Dharmendra Pradhan resigns after protests over alleged
      entrance-examination leaks and broader education-system irregularities. His
      resignation marks the Modi government's first major concession to the demonstrations.
      (AFP via Le Monde)
    - The Bishop of Aberdeen in Scotland declares the sedevacantist Sons of the Most
      Holy Redeemer religious institute, an order associated with the Society of Saint
      Pius X, to be excommunicated, after they consecrated a bishop without Vatican
      approval. (The Herald) (The Catholic Herald)
