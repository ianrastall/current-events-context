wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Kuwait
    - Kuwait's defense ministry says that Iran has hit three land border posts and
      an offshore rig operated by the Kuwait Oil Company. (Arab Times Kuwait)
    - The Islamic Revolutionary Guard Corps (IRGC) says it has hit HIMARS launchers
      in Kuwait. (Yeni Şafak) (Türkiye Today)
    - 2026 Iranian strikes on Oman
    - The IRGC claims that it has hit logistics support facilities and refueling platforms
      used by American aircraft in Oman's Duqm port. (Iran International)
    - 2026 Iranian strikes on Qatar
    - The Qatari interior ministry reports that three people, including a child, have
      been injured by falling debris from an interception following Iranian attacks
      on the country. (AA)
    - 2026 Iranian strikes on the United Arab Emirates
    - The United Arab Emirates's defence ministry alerts residents at 6:37 AM that
      air defence systems were engaging with fresh missile and drone threats along
      with interception operations. (Khaleej Times)
    - 2026 Strait of Hormuz crisis
    - The IRGC Navy declares the Strait of Hormuz to be closed until further notice
      and says that they have fired a shot at two vessels that used an unauthorized
      route. (France 24) (Shafaq)
    - The United States launches new strikes against Iran in response. (Reuters)
    - The United States Central Command contradicts Iran's claim, stating that the
      strait is open. Additionally, the Joint Maritime Information Center states that
      the Iran route in the waterway is open despite Iran's claims. (Bloomberg) (NBC
      News)
    - Data from Kpler reports that six ships have passed the Strait of Hormuz amidst
      low traffic and resumed fighting. (Bloomberg)
    - Qeshm governor Hossein Amir Teymouri reports that 10 of 11 projectiles hit Bandar
      Abbas and the Abu Musa and Qeshm islands. (AA)
    - Gaza war
    - At least six people are killed, including a nine-year old girl, from Israeli
      attacks on the Gaza Strip. (Sky News)
    - Russo-Ukrainian war
    - Zaporizhzhia strikes
    - Rosatom head Alexey Likhachev says a Ukrainian drone attack on Enerhodar, the
      Russian-controlled town hosting the Zaporizhzhia Nuclear Power Plant, has killed
      four people and injures four others. (Reuters)
    - Sudanese civil war
    - Sudan's National Human Rights Commission reports 6,000 detention cases in prisons
      run by the Rapid Support Forces in El Fasher, North Darfur. (AA)
    - Allied Democratic Forces insurgency
    - Seven civilians and three state soldiers are killed in an ambush by suspected
      jihadists fighters in Beni, North Kivu, Democratic Republic of the Congo. (africanews)
    - 2026 United States wildfires
    - 2026 Colorado wildfires
    - The Gunnison County Sheriff’s Office reports that Nicholas Dale, a 56-year-old
      Canadian pilot from Sooke, British Columbia, was killed after his Kaman K-1200
      helicopter crashed into the Silver Jack Reservoir while fighting the Gold Mountain
      Fire in Colorado, U.S. (The Denver Post) (CBC)
    - Ten people are killed and several others are injured in a multiple-vehicle collision
      involving a pickup truck carrying 17 passengers and two other trucks in West
      Java, Indonesia. (Xinhua)
    - Nine people are killed and about ten others are injured, including two National
      Guard members and four Americans in serious condition, after a tractor-trailer
      causes a multi-vehicle crash on a highway in Jalisco, Mexico. (Reuters)
    - Six people are killed and seven others are injured when a driver loses control
      near a street festival in Viña del Mar, Valparaíso, Chile. The driver is detained
      and will undergo alcohol testing. (AFP via Asharq Al-Awsat)
    - South Korea issues its first extreme heat warning under a new system, covering
      the North Gyeongsang cities of Gyeongsan and Pohang after temperatures meet
      severe criteria. (AFP via Kuwait Times)
    - War crimes during the Sudanese civil war
    - A court in Port Sudan sentences Rapid Support Forces leader Mohamed Hamdan Dagalo
      and 15 other members to death in absentia for their roles in war crimes in the
      Darfur region during the ongoing civil war in the country including the assassination
      of former West Darfur governor Khamis Abbakar in 2023 during the Battle of Geneina.
      (Asharq Al-Awsat)
    - 2026 Israeli legislative election
    - Israel sets October 27 as the date for its legislative elections to elect the
      members of the Knesset. (Al Jazeera)
    - 2027 Salvadoran presidential election
    - Salvadoran president Nayib Bukele is nominated by his political party, Nuevas
      Ideas, to run for a third presidential term. The Legislative Assembly previously
      approved amendments to abolish presidential term limits in 2025. (Reuters)
    - Former emir of Qatar Hamad bin Khalifa Al Thani dies at the age of 74. (AFP
      via Arab News) (Asharq Al-Awsat)
    - Ukrainian prime minister Yulia Svyrydenko steps down as president Volodymyr
      Zelenskyy announces a cabinet reshuffle and changes to law enforcement leadership,
      citing the need to implement an updated political strategy during Russia's invasion.
      (The Hill)
    - 2026 Wimbledon Championships
    - In tennis, Jannik Sinner of Italy successfully defends his gentlemen's singles
      title at the Wimbledon Championships after defeating Alexander Zverev of Germany
      in the final, 6–7(7–9), 7–6(7–2), 6–3, 6–4. (CNN)
