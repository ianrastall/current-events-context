  - 2026 Strait of Hormuz crisis
  - The Islamic Revolutionary Guard Corps Navy declares the Strait of Hormuz to be
    closed until further notice and says that they have fired a shot at two vessels
    that used an unauthorized route. (France 24) (Shafaq)
