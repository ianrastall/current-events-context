    criteria. (AFP via Kuwait Times)
  - War crimes during the Sudanese civil war
  - A court in Port Sudan sentences Rapid Support Forces leader Mohamed Hamdan Dagalo
    and 15 other members to death in absentia for their roles in war crimes in the
    Darfur region during the ongoing civil war in the country including the assassination
    of former West Darfur governor Khamis Abbakar in 2023 during the Battle of Geneina.
    (Asharq Al-Awsat)
