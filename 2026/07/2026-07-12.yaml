  - 2026 Iranian strikes on Kuwait
  - Kuwait's defense ministry says that Iran has hit three land border posts and a
    offshore rig operated by the Kuwait Oil Company. (Arab Times Kuwait)
  - The Islamic Revolutionary Guard Corps claims to have hit US HIMARS missiles in
