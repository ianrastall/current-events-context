  - Gaza war
  - At least six people are killed, including a nine-year old girl, from Israeli attacks
    on the Gaza Strip. (Sky News)
  - Sudanese civil war
  - Sudan's National Human Rights Commission reports 6,000 detention cases in prisons
    run by the Rapid Support Forces in North Darfur's capital El Fasher. (AA) (USMuslims
    via AA)
  - Ten people are killed and several others are injured in a multiple-vehicle collision
    involving a pickup truck carrying 17 passengers and two other trucks in West Java,
    Indonesia. (Xinhua)
  - At least six people are killed and seven others are injured when a driver loses
    control near a street festival in Viña del Mar, Valparaíso, Chile. The driver
    is detained and will undergo alcohol testing. (AFP via Asharq Al-Awsat)
