  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on Bahrain
  - The Bahraini military intercepts projectiles from Iran. (Al Jazeera)
  - 2026 Iranian strikes on Kuwait
  - The Kuwaiti military intercepts two ballistic missiles and 13 drones from Iran.
    (Al Jazeera)
  - 2026 Strait of Hormuz crisis
  - International Maritime Organization head Arsenio Dominguez reports that 6,000
    seafarers are still stranded in the Strait of Hormuz and calls for a "maximum
    restraint and de-escalation" amidst renewed the crisis. (Middle East Eye) (Oman
    Observer)
  - Nakilat confirms that the Qatari LNG tanker Al Rekayyat was hit yesterday by projectiles
    near the Strait of Hormuz. No casualties are reported. Additionally, the tanker
    is reported to be stranded near the coast of Oman. (Gulf Times) (Khaleej Times)
    (The Peninsula Qatar)
  - Gaza war
  - The Israeli military states that Nukhba commander Mohammed Emad Alrahman Abu Taima
    of the Al-Qassam Brigades, who is alleged to have taken part in the infiltration
    of the kibbutz Nirim during the October 7, 2023 attacks by Hamas, has been killed
    in an airstrike in the southern Gaza Strip. (Cleveland Jewish News) (Israel National
    News)
  - Sudanese civil war
  - 2026 Blue Nile campaign
  - The Sudanese Army says that they have recaptured the Blue Nile town of Kurmuk.
    (Sudan Tribune)
  - Human rights groups report that drone strikes in Sudan on civilian vehicles heading
    to social gatherings have killed 20 people in recent days. (ABC News) (AP)
  - A drone strike by the Rapid Support Forces kills 10 people traveling to a wedding
    near Omdurman. (AA) (MENAFN)
  - 2026 Damascus bombings
  - The toll from yesterday's bombings in Damascus, Syria, increases to one person
    killed and 36 more injured. (Al Jazeera)
  - Insurgency in Balochistan
  - Pakistan's military says that three militant attacks in Balochistan since July
    6 have killed 42 army and police personnel, while security forces have killed
    54 militants in the incidents. (Reuters)
  - Economic impact of the 2026 Iran war
  - Brent Crude and West Texas Intermediate oil prices increase by at least 5% amidst
    the escalation in the Iran war, rising to US$78.01 and $73.86, respectively. (CNBC)
  - Stocks on the Pakistan Stock Exchange witness a sharp decline following renewed
    geopolitical tensions in the Middle East, with the KSE-100 Index falling to 4,626
    points. (Dunya News) (Arab News PK)
  - Seven children and a teacher are killed when heavy rain triggers a landslide during
    a class at Kutupalong refugee camp in Cox's Bazar, Bangladesh. (AFP via The Straits
    Times) (Reuters)
  - Two people are killed after an explosion in a fireworks factory in Borgorose,
    Rieti Province, Italy. (Xinhua)
  - A cyclosporiasis outbreak, caused by cyclospora cayetanensis, is reported across
    the United States in 18 U.S. states, with the Michigan Department of Health and
    Human Services reporting around 992 cases and Ohio Department of Health reporting
    177 in Ohio. (WJRT-TV) (WTTG) (The Columbus Dispatch)
  - Aftermath of the Syrian civil war
  - Syria–United States relations, US-designated state sponsors of terrorism
  - U.S. Secretary of State Marco Rubio notifies Congress that the U.S. will remove
    Syria as a "state sponsor of terrorism" after being listed as one since 1979 during
    the Assad regime. (Al-Monitor)
  - Protests against the 2026 Iran war
  - Pakistan–United States relations, 2026 attack on the United States consulate in
    Karachi, Pakistan in the 2026 Iran war
  - The United States announces that it will resume regular consular services at its
    consulates in Karachi and Lahore, after previously suspending operations over
    security concerns during violent protests in Pakistan including an attack on the
    U.S. consulate in Karachi. (Dawn)
  - Greenland crisis
  - The prime ministers of Greenland and Denmark, Jens-Frederik Nielsen and Mette
    Frederiksen, respectively, reaffirms that Greenland is not for sale amidst a renewed
    push by Trump at the NATO summit to control the territory. (RFI) (Reuters)
  - Ukraine–European Union relations, Polish Order of the White Eagle controversy
