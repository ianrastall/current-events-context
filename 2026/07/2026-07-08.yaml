Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - U.S. president Donald Trump says that the ceasefire between Iran and the United
    States is over, and that airstrikes will continue. However, he also states that
    negotiations can continue. Pakistan's foreign ministry reaffirms its call for
    all sides to honor the recently-signed memorandum of understanding following Trump's
    declaration. (AFP via The Times of Israel) (Asharq Al-Awsat) (Reuters)
