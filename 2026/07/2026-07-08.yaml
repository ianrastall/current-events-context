wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - U.S. president Donald Trump says that the ceasefire between Iran and the United
      States is over and that airstrikes will continue. However, he also states that
      negotiations can continue. Pakistan's foreign ministry reaffirms its call for
      all sides to honor the recently-signed memorandum of understanding following
      Trump's declaration. (AFP via The Times of Israel) (Asharq Al-Awsat) (Reuters)
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - The Bahraini military intercepts projectiles from Iran. (Al Jazeera)
    - 2026 Iranian strikes on Kuwait
    - The Kuwaiti military intercepts two ballistic missiles and 13 drones from Iran.
      (Al Jazeera)
    - 2026 Strait of Hormuz crisis
    - International Maritime Organization head Arsenio Dominguez reports that 6,000
      seafarers are still stranded in the Strait of Hormuz and calls for a "maximum
      restraint and de-escalation" amidst renewal of the crisis. (Middle East Eye)
      (Oman Observer)
    - Nakilat confirms that the Qatari LNG tanker Al Rekayyat was hit yesterday by
      projectiles near the Strait of Hormuz. No casualties are reported. Additionally,
      the tanker is reported to be stranded near the coast of Oman. (Gulf Times) (Khaleej
      Times) (The Peninsula Qatar)
    - July 2026 United States strikes against Iran
    - The U.S. military conducts new airstrikes against Iran, with at least 14 people
      killed in the last two days. (Reuters) (Al Jazeera)
    - Iranian state media, including the Fars News Agency, releases footage of former
      supreme leader Ali Khamenei's compound after it was hit in an airstrike by Israel
      and the U.S. during the first day of the war. (The Jerusalem Post) (Al Jazeera)
    - Gaza war
    - The Israeli military states that Nukhba commander Mohammed Emad Alrahman Abu
      Taima of the Al-Qassam Brigades, who is alleged to have taken part in the infiltration
      of the kibbutz Nirim during the October 7, 2023, attacks by Hamas, has been
      killed in an airstrike in the southern Gaza Strip. (Cleveland Jewish News) (Israel
      National News)
    - Sudanese civil war
    - 2026 Blue Nile campaign
    - The Sudanese Army says that they have recaptured the Blue Nile town of Kurmuk.
      (Sudan Tribune)
    - War crimes during the Sudanese civil war, Darfur genocide
    - A probe by the United Nations fact-finding mission of Sudan finds that the Rapid
      Support Forces have committed mass killings, abductions ‌of women and girls,
      mass gang rapes, and forced starvation in the North Darfur city of El Fasher.
      (Al Jazeera)
    - Human rights groups report that drone strikes in Sudan on civilian vehicles
      heading to social gatherings have killed 20 people in recent days. (ABC News)
      (AP)
    - A drone strike by the Rapid Support Forces kills 10 people traveling to a wedding
      near Omdurman. (AA) (MENAFN)
    - 2026 Damascus bombings
    - The toll from yesterday's bombings in Damascus, Syria, increases to one person
      killed and 36 people injured. (Al Jazeera)
    - Insurgency in Balochistan
    - Pakistan's military says that three militant attacks in Balochistan since July
      6 have killed 42 army and police personnel, while security forces have killed
      54 militants in the incidents. (Reuters)
    - Economic impact of the 2026 Iran war
    - Brent Crude and West Texas Intermediate oil prices increase by at least 5% amidst
      the escalation in the Iran war, rising to US$78.01 and $73.86, respectively.
      (CNBC)
    - Stocks on the Pakistan Stock Exchange witness a sharp decline following renewed
      geopolitical tensions in the Middle East, with the KSE-100 Index falling to
      4,626 points. (Dunya News) (Arab News PK)
    - Nine workers are killed and 14 others are rescued after heavy rain causes a
      garbage heap to collapse onto an administrative building at a waste-to-energy
      plant near Pune, Maharashtra, India, prompting a temporary suspension of operations.
      (AFP via Dawn)
    - Seven children and a teacher are killed when heavy rain triggers a landslide
      during a class at Kutupalong refugee camp in Cox's Bazar, Bangladesh. (AFP via
      The Straits Times) (Reuters)
    - Two people are killed after an explosion in a fireworks factory in Borgorose,
      Rieti Province, Italy. (Xinhua)
    - 2026 United States cyclosporiasis outbreak
    - A cyclosporiasis outbreak, caused by cyclospora cayetanensis, is reported across
      the United States in 18 states, with Michigan reporting around 992 cases and
      Ohio reporting 177. (BBC News) (The Columbus Dispatch)
    - Aftermath of the Syrian civil war
    - Syria–United States relations, US-designated state sponsors of terrorism
    - U.S. Secretary of State Marco Rubio notifies Congress that the U.S. will remove
      Syria as a "state sponsor of terrorism" after being listed as one since 1979
      during the Assad regime. (Al-Monitor)
    - Protests against the 2026 Iran war
    - Pakistan–United States relations, 2026 attack on the United States consulate
      in Karachi, Pakistan in the 2026 Iran war
    - The United States announces that it will resume regular consular services at
      its consulates in Karachi and Lahore after previously suspending operations
      over security concerns during violent protests in Pakistan, including an attack
      on the U.S. consulate in Karachi. (Dawn)
    - Greenland crisis
    - The prime ministers of Greenland and Denmark, Jens-Frederik Nielsen and Mette
      Frederiksen, respectively, reaffirm that Greenland is not for sale amidst a
      renewed push by Trump at the NATO summit to control the territory. (RFI) (Reuters)
    - Ukraine–European Union relations, Polish Order of the White Eagle controversy
    - The European Parliament passes a resolution expressing regret over the decision
      of Ukrainian president Volodymyr Zelenskyy to name a military unit after the
      Ukrainian Insurgent Army, citing their responsibility for the massacres of Poles
      in Volhynia and Eastern Galicia. (TVP World)
    - 2026 Sumatra blackout, Corruption in Indonesia
    - Indonesia police perform raids on 12 places linked to three different cases.
      They found 74 kg of golds, and cash in form of Indonesian rupiah, Singapore
      dollar, and United States dollar totaling over US$3.7 million. (Bloomberg) (Jakarta
      Globe) (Tempo)
    - Disappearance of ARA San Juan
    - A court in Río Gallegos, Santa Cruz, Argentina, convicts former Argentine Navy
      commander Claudio Villamide for his role in the 2017 implosion of the submarine
      ARA San Juan, which killed all 44 people on board. (Buenos Aires Times)
    - Norwegian police and international partners announce the arrest of 28 men across
      seven countries in an operation targeting suspected dark-web buyers of child
      sexual abuse material who allegedly used the cryptocurrency Monero, while Europol
      says three children are safeguarded. (AFP via South China Morning Post)
    - 7 people are killed and 5 others are injured in two separate shootings in Mitchells
      Plain and Philippi, both located on the Cape Flats in Cape Town. (SABC News)(Xinhua)
    - Iraq in the 2026 Iran war
    - State funeral of Ali Khamenei
    - State funerals for former Iranian supreme leader Ali Khamenei are held in Iraq's
      Shi'ite holy cities of Karbala and Najaf. (AP) (Middle East Eye)
    - 2026 United States elections
    - 2026 United States Senate elections
    - U.S. Senate Democratic nominee Graham Platner suspends his campaign in the upcoming
      U.S. Senate election in Maine, leaving the Maine Democratic Party to seek a
      replacement challenger to incumbent Republican Susan Collins. (Reuters)
    - Human rights in Thailand
    - Thailand's parliament passes an amnesty bill covering political activists convicted
      since 2005 while excluding corruption and royal insult offences. The measure
      awaits royal approval. (AFP via The Star)
    - 2026 FIFA World Cup controversies
    - 2026 Trump–FIFA red card controversy
    - Seventy-two lawmakers from the European Parliament call for an investigation
      into FIFA president Gianni Infantino after FIFA lifted the red-card suspension
      on American striker Folarin Balogun. (Politico Europe)
