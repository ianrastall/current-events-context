    Insurgent Army, citing their responsibility for the massacres of Poles in Volhynia
    and Eastern Galicia. (TVP World)
  - Iraq in the 2026 Iran war
  - State funeral of Ali Khamenei
  - State funerals for former Iranian supreme leader Ali Khamenei are held in Iraq's
    Shi'ite holy cities of Karbala and Najaf. (AP) (Middle East Eye)
  - Human rights in Thailand
  - Thailand's parliament passes an amnesty bill covering political activists convicted
    since 2005, while excluding corruption and royal insult offences. The measure
    awaits royal approval. (AFP via The Star)
  - 2026 FIFA World Cup controversies
  - 2026 Trump–FIFA red card controversy
  - Seventy-two lawmakers from the European Parliament call for an investigation into
    FIFA president Gianni Infantino after FIFA lifted the red-card suspension on American
    striker Folarin Balogun. (Politico Europe)
