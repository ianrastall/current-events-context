date: '2026-07-06'
source_page:
  portal: Portal:Current events/2026 July 6
  language: en
  wikipedia_revision_id: 1366339018
wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Gaza peace plan
    - Hamas announces that its government will step down to facilitate the transition
      of a technocratic administration in the Gaza Strip, as stipulated in the Gaza
      peace plan of October 2025. In response, the Board of Peace states that it will
      assess the implementation of these steps. (Al Jazeera) (The Jerusalem Post)
    - The Israeli military states that they have killed five Hamas militants who allegedly
      attempted to restore underground infrastructure in the northern Gaza Strip,
      west of the Yellow Line, including Hudhayfah Hussein Abdullah al-Hawajri, a
      Nukhba militant from the East Jabalia Battalion command, despite the ongoing
      ceasefire. (Israel National News)
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - According to shipping data from LSEG, around 10 Japan-linked ships, mostly managed
      by Mitsui O.S.K. Lines, are reported to have transited through the Strait of
      Hormuz using the route proposed by Iran. Data also show that a supertanker carrying
      Saudi crude oil headed for South Korea left over the weekend. (Gulf Today) (Japan
      Times)
    - Mali War
    - 2026 Mali offensives
    - The Al-Qaeda-linked Jama'at Nusrat al-Islam wal-Muslimin and Tuareg Azawad Liberation
      Front rebels seize the northern Mali town of Anéfis. (AllAfrica) (AFP via RFI)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Ukraine's General Staff reports that drones have struck Russia's Omsk refinery
      in Omsk, Omsk Oblast in the Siberia region. (Reuters)
    - Kyiv strikes
    - At least 22 people are killed and 56 others are injured in a Russian ballistic
      missile and drone attack on Kyiv Oblast, Ukraine. Search and rescue efforts
      are underway in Kyiv to free civilians trapped under rubble. (BBC News)
    - Sudanese civil war
    - Siege of El Obeid
    - The United Nations Human Rights Council orders an inquiry into alleged human
      rights violations around El-Obeid, North Kordofan, Sudan, warning that civilians
      face a risk of mass atrocities as the Rapid Support Forces encircles the city
      amid Sudan's civil war. (AFP via Macau Business)
    - UNICEF reports that over 330 children have been killed in Sudan's civil war
      in the first six months of 2026. (AP) (UCICEF)
    - 2022–2026 video game industry layoffs
    - Microsoft cuts roughly 4,800 jobs, primarily within its Xbox and commercial
      sales divisions, while divesting game studios Compulsion Games, Double Fine,
      Ninja Theory, and Undead Labs. (Reuters) (The Verge)
    - 2026 Cuban crisis, 2024–2026 Cuba blackouts
    - Cuba experiences its third nationwide power outage of the year, with state utility
      Unión Eléctrica de Cuba reporting a total grid disconnection as the country
      faces severe fuel shortages and chronic failures in its electricity system.
      (AFP via The Guardian)
    - 2026 Ezhou-Huanggang tornado
    - At least 12 people are killed, hundreds are injured, and extensive damage is
      reported when a large wedge tornado strikes Ezhou and Huanggang, Hubei, China.
      (Sohu in Chinese) (The Watchers)
    - Fifteen miners are killed and another is injured when part of a decommissioned
      gold mine collapses in Wadi Halfa, Northern State, Sudan, after miners entered
      the closed site. (AFP via Asharq Al-Awsat)
    - At least nine people are killed, including children, and several others are
      injured in landslides at Rohingya refugee camps in Cox's Bazar District, Bangladesh.
      (Demócrata) (TRT World)
    - Five people are killed and one injured after a fire at a residential building
      in Zhengzhou, Henan, China. (PTI via The Hindu) (Xinhua)
    - 2026 Ebola epidemic
    - The total number of deaths from the Ebola outbreak in the Democratic Republic
      of the Congo exceeds 500. (ModernGhana)
    - Australia–Fiji relations
    - Australia and Fiji sign a defence pact, making Fiji one of Australia's treaty-bound
      allies and committing both countries to consult on security threats and support
      mutual defence in the Pacific. (AFP via France 24)
    - Kyrgyzstan–Pakistan relations
    - Pakistani president Asif Ali Zardari begins a four-day visit to Kyrgyzstan after
      an invitation from Kyrgyz president Sadyr Japarov, making it the first official
      visit by a Pakistani president to the country in 21 years. (Pakistan Observer)
    - 2026 Monaco bombing
    - Anastasiia Berezovska, the suspect in a bombing targeting Ukrainian oligarch
      Vadym Iermolaiev and his family in Monaco on June 29, is found dead near Kyiv,
      Ukraine, with gunshot wounds to the head. (BBC News) (Pravda)
    - Riots between inmates from rival drug gangs at a prison in Negombo, Sri Lanka,
      kill 27 people, including four officers, and injure more than 100 others. (AFP
      via Daily Tribune)
    - Corruption in the Philippines
    - Philippine police ⁠separately arrest senator Rodante Marcoleta and three co-accused,
      including former party-list representative Mike Defensor, after an anti-graft
      court orders their arrest in relation to a plunder case filed by the Ombudsman.
      (AP) (Philippine Daily Inquirer)
    - Crime in Bangladesh
    - A crude bomb explodes during a post-march rally in Savar, Dhaka District, Bangladesh,
      while National Citizen Party convener Nabila Tasnid was giving a speech, injuring
      three. (The Business Standard)
    - Óbuda scandal
    - News outlet Telex.hu publishes the text of arrested Hungarian Socialist Party
      (MSZP) politician Gergő Czeglédy's 2024 testimony alleging the existence of
      a large corruption network involving members of the MSZP and Fidesz since 2006.
      (24.hu ) (HVG ) (Daily News Hungary)
    - Impact of the 2026 Iran war on Iran
    - State funeral of Ali Khamenei
    - Former Iranian president Mahmoud Ahmadinejad attends former supreme leader Ali
      Khamenei's funeral amidst questions surrounding his fate in the aftermath of
      an Israeli–U.S. airstrike on his home during the early stages of the war. (Iran
      International) (The Jerusalem Post) (RFE/RL)
    - Iranian state television reports that Khamenei's body arrives in Qom, where
      he studied, ahead of a planned procession. (AFP via Al-Ahram)
    - Second impeachment of Sara Duterte
    - The impeachment trial of Philippine vice president Sara Duterte begins in the
      Senate. (AP) (BBC News)
    - Samsung Electronics announces that Samsung Messages is being discontinued in
      the US on July 6 and directs users who have Android 12 or above to switch to
      Google Messages. (9to5Google)
    - 2026 FIFA World Cup
    - Spain at the FIFA World Cup
    - In association football, Spain records its sixth consecutive FIFA World Cup
      clean sheet in a 1–0 win over Portugal in the round of 16, setting a tournament
      record, while goalkeeper Unai Simón extends his scoreless streak to 609 minutes.
      (ANI)
    - 2026 Esports World Cup
    - The third edition of the Esports World Cup opens in Paris, France. (TNT Sports)
