Date: '2026-07-06'
Source_URI: Portal:Current events/2026 July 6
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - Gaza war
  - Gaza peace plan
  - Hamas announces that its government will step down to facilitate the transition
    of a technocratic administration in the Gaza Strip, as stipulated in the Gaza
    peace plan of October 2025. In response, the Board of Peace states that it will
    judge the implementation of these steps rather than mere statements. (Al Jazeera)
    (The Jerusalem Post)
  - The Israeli military states that they have killed five Hamas militants who allegedly
    attempted to restore underground infrastructure in the northern Gaza Strip, west
    of the Yellow Line, including Hudhayfah Hussein Abdullah al-Hawajri, a Nukhba
    militant from the East Jabalia Battalion command, despite the ongoing ceasefire.
    (Israel National News)
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - According to shipping data from LSEG, around 10 Japan-linked ships, mostly managed
    by Mitsui O.S.K. Lines, are reported to have transited through the Strait of Hormuz
    using the route proposed by Iran. Additionally, data also shows that a supertanker
    carrying Saudi crude oil headed for South Korea has left over the weekend. (Gulf
    Today) (Japan Times)
  - Russo-Ukrainian war
  - Kyiv strikes
  - At least 22 people are killed and 56 others are injured in a Russian ballistic
    missile and drone attack on Kyiv Oblast, Ukraine. Search and rescue efforts are
    underway in Kyiv to free civilians trapped under rubble. (BBC News)
  - Attacks in Russia during the Russo-Ukrainian war
  - Ukraine's General Staff reports that drones have struck Russia's Omsk refinery
    in Omsk, Omsk Oblast in the Siberia region. (Reuters)
  - Sudanese civil war
  - Siege of El Obeid
  - The United Nations Human Rights Council orders an inquiry into alleged human rights
    violations around El-Obeid, North Kordofan, Sudan, warning that civilians face
    a risk of mass atrocities as the Rapid Support Forces encircles the city amid
    Sudan's civil war. (AFP via Macau Business)
  - The UNICEF reports that over 330 children have been killed in Sudan's civil war
    over the past six months of 2026. (AP) (UCICEF)
  - Microsoft cuts roughly 4,800 jobs, primarily within its Xbox and commercial sales
    divisions, while divesting game studios Compulsion Games, Double Fine, Ninja Theory,
    and Undead Labs. (Reuters) (The Verge)
  - 2024–2026 Cuba blackouts
  - Cuba experiences its third nationwide power outage of the year, with state utility
    Unión Eléctrica de Cuba reporting a total grid disconnection as the country faces
    severe fuel shortages and chronic failures in its electricity system. (AFP via
    The Guardian)
  - Fifteen miners are killed and another is injured when part of a decommissioned
    gold mine collapses in Wadi Halfa, Northern State, Sudan, after miners entered
    the closed site. (AFP via Asharq Al-Awsat)
  - At least nine people are killed, including children, and several others are injured
    in landslides at Rohingya refugee camps in Cox's Bazar District, Bangladesh. (Demócrata)
    (TRT World)
  - Eight people are killed, another is reported missing and extensive damage is reported
    when a large wedge tornado strikes Ezhou, Hubei, China. (Sohu in Chinese) (The
    Watchers)
  - Five people are killed and one injured after a fire at a residential building
    in Zhengzhou, Henan, China. (PTI via The Hindu) (Xinhua)
  - Australia–Fiji relations
  - Australia and Fiji sign a defence pact, making Fiji one of Australia's treaty-bound
    allies and committing both countries to consult on security threats and support
    mutual defence in the Pacific. (AFP via France 24)
  - Kyrgyzstan–Pakistan relations
  - Pakistani president Asif Ali Zardari begins a four-day visit to Kyrgyzstan after
    an invitation from Kyrgyz president Sadyr Japarov, making it the first official
    visit by a Pakistani president to the country in 21 years. (Pakistan Observer)
  - 2026 Ebola epidemic
  - The total number of deaths from the Ebola outbreak in the Democratic Republic
    of the Congo exceeds 500. (ModernGhana)
  - Corruption in the Philippines
  - Philippine police ⁠separately arrests senator Rodante Marcoleta and three co-accused,
    including former representative Mike Defensor, after an anti-graft court orders
    their arrest in relation to a plunder case filed by the Ombudsman. (AP) (DZRH)
  - Crime in Sri Lanka
  - Riots between inmates from rival drug gangs at a prison in Negombo, Sri Lanka,
    kill 25 people, including four officers, and injure more than 100 others. (AFP
    via NDTV)
  - Crime in Bangladesh
  - A crude bomb explodes during a post-march rally in Savar, Dhaka District, Bangladesh,
    while National Citizen Party convener Nabila Tasnid was giving a speech, injuring
    three. (The Business Standard)
  - Óbuda scandal
  - News outlet Telex.hu publishes the text of arrested Hungarian Socialist Party
    politician Gergő Czeglédy's 2024 testimony alleging the existence of a large corruption
    network involving members of the MSZP and Fidesz since 2006. (24.hu ) (HVG ) (Daily
    News Hungary)
  - Prime Minister Péter Magyar condemns Fidesz and the MSZP for the involvement of
    members of their parties in the scandal, accusing them of forming a "grand coalition"
    to engage in corruption. (Telex.hu)
  - Impact of the 2026 Iran war on Iran
  - State funeral of Ali Khamenei
  - Former Iranian president Mahmoud Ahmadinejad attends former supreme leader Ali
    Khamenei's funeral amidst questions surrounding his fate in the aftermath of an
    Israeli–U.S. airstrike on his home during the early stages of the war. (Iran International)
    (The Jerusalem Post) (RFE/RL)
  - Iranian state television reports that Khamenei's body arrives in Qom, where he
    studied, ahead of a planned procession. (AFP via Al-Ahram)
  - Second impeachment of Sara Duterte
  - The impeachment trial of Philippine vice president Sara Duterte begins in the
    Senate. (AP) (BBC News)
  - 2026 Esports World Cup
  - The third edition of the Esports World Cup opens in Paris, France. (TNT Sports)
