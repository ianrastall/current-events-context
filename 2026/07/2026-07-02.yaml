Date: '2026-07-02'
Source_URI: Portal:Current events/2026 July 2
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - Gaza war
  - Tunnel warfare in the Gaza Strip
  - Israeli defense minister Israel Katz reports that the military has demolished
    83% of Hamas tunnels in the Gaza Strip. The assessment comes as the war enters
    its 1,000th day following the October 7, 2023 attacks on Israel. (The Times of
    Israel) (Ynetnews)
  - Seven Palestinians are injured in an Israeli strike on the Nuseirat refugee camp,
    located in the middle of the Gaza Strip. (Middle East Eye)
  - 2026 Lebanon war
  - Hezbollah–Israel conflict
  - The Israeli military says that the Egoz Unit commando group has killed a Hezbollah
    militant who emerged from a underground tunnel in Ali al-Taher in southern Lebanon.
    (The Times of Israel)
  - Syrian conflict
  - Nine people are killed and 22 others are injured in a bombing at a coffeehouse
    in Damascus, Syria. No group has claimed responsibility. (SANA)
  - Russo-Ukrainian war
  - Kyiv strikes
  - Russian forces launch a major ballistic missile and drone attack on Kyiv, Ukraine,
    killing at least 22 people and injuring 98 others, and forcing more than 50,000
    civilians to shelter underground. (AP) (Kyiv Independent)
  - Papua conflict
  - The West Papua National Liberation Army says it set fire to a plane that landed
    in Highland Papua, Indonesia, carrying eight people and killed its American pilot.
    (BBC News)
  - Western Iran clashes
  - The Islamic Revolutionary Guard Corps says that they have killed five members
    of the Democratic Party of Iranian Kurdistan near Piranshahr, West Azerbaijan,
    Iran. (Reuters)
  - 2026 Écône consecrations
  - The Holy See excommunicates the entire clergy of the Society of St. Pius X for
    consecrating bishops without the Pope's permission, barring the group from officiating
    marriages and hearing confessions. The Catholic laity are also warned that they
    will also be excommunicated if they attend SSPX masses. (AP) (Vatican News)
  - At least 16 people are killed and 20 others are injured when a passenger bus overturns
    in Eastern Cape, South Africa. (CTV News)
  - Eleven people are killed in a collision between a truck and two cars on the Dushanbe-Kulob-Khorog
    highway near Vahdat, Tajikistan. (Times of Central Asia) (Xinhua)
  - Nine monks are killed and 13 others are injured, including three critically, when
    an 11-year-old boy drives a pickup truck into a pilgrimage walk in Mukdahan province,
    Thailand. (AP)
  - 2026 Ebola epidemic
  - The Democratic Republic of the Congo begins treatment trials for Ebola. (BBC News)
  - Flamingo Revolution
  - Police clash with demonstrators in Albania during a protest against the government
    and the Sazan Island Resort project. (AP)
  - Corruption in Spain
  - Spain's National Court charges the Civil Guard's director-general Mercedes González
    Fernández and her deputy with the offences of abuse of office and obstruction
    of justice in connection with the ruling PSOE's alleged operation against judges
    and prosecutors investigating cases of corruption involving party members. (La
    Vanguardia)
  - 2026 Algerian parliamentary election
  - Algerians vote for 407 seats of the People's National Assembly amid a cost-of-living
    crisis and candidate bans upon the Hirak movement. (AP)
