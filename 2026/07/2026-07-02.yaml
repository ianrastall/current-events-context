wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Kurdish–Iranian crisis
    - Western Iran clashes
    - The Islamic Revolutionary Guard Corps says that they have killed five members
      of the Democratic Party of Iranian Kurdistan near Piranshahr, West Azerbaijan,
      Iran. (Reuters)
    - Gaza war
    - Tunnel warfare in the Gaza Strip
    - Israeli defense minister Israel Katz reports that the military has demolished
      83% of Hamas tunnels in the Gaza Strip. (The Times of Israel) (Ynetnews)
    - Seven Palestinians are injured in an Israeli strike on the Nuseirat refugee
      camp in the middle of the Gaza Strip. (Middle East Eye)
    - 2026 Lebanon war
    - Hezbollah–Israel conflict
    - The Israeli military says that the Egoz Unit commando group has killed a Hezbollah
      militant who emerged from a underground tunnel in Ali al-Taher in southern Lebanon.
      (The Times of Israel)
    - Syrian conflict
    - Nine people are killed and 22 others are injured in a bombing at a coffeehouse
      in Damascus, Syria. No group has claimed responsibility. (Al Jazeera)
    - Russo-Ukrainian war
    - Kyiv strikes
    - Russian forces launch a major ballistic missile and drone attack on Kyiv, Ukraine,
      killing at least 30 people and injuring 98 others, and forcing more than 50,000
      civilians to shelter underground. (AP) (Kyiv Independent)
    - Terrorism in Indonesia
    - Papua conflict
    - The West Papua National Liberation Army says it set fire to a plane that landed
      with eight people in Highland Papua, Indonesia, after shooting and killing its
      American pilot. The Indonesian military announces the recovery of his body and
      that the plane's seven Papuan passengers returned unharmed. (BBC News) (Reuters)
    - 2026 Écône consecrations
    - The Holy See excommunicates the entire clergy of the Society of Saint Pius X
      for consecrating four bishops yesterday without the Pope's permission, barring
      the group from officiating marriages and hearing confessions. The Catholic laity
      are also warned that they will also be excommunicated if they attend SSPX masses.
      (AP) (Vatican News)
    - Sixteen people are killed and 20 others are injured when a passenger bus overturns
      in Dutywa, Eastern Cape, South Africa. (CTV News)
    - Eleven people are killed in a collision between a truck and two cars on the
      Dushanbe-Kulob-Khorog highway near Vahdat, Tajikistan. (Times of Central Asia)
      (Xinhua)
    - Ten monks are killed and more than 10 others are injured, some critically, when
      an 11-year-old boy drives a pickup truck into a pilgrimage walk in Mukdahan
      province, Thailand. (AP)
    - 2026 Ebola epidemic
    - The Democratic Republic of the Congo begins treatment trials for Ebola. (BBC
      News)
    - The World Health Organization says that Uganda has confirmed a Marburg virus
      case in a toddler in the Kyegegwa District during Ebola surveillance, with authorities
      monitoring contacts and reporting no symptoms among them. (AFP via Jamaica Observer)
    - Canada–Philippines relations
    - Canadian prime minister Mark Carney and Philippine president Bongbong Marcos
      agree to upgrade bilateral relations to a strategic partnership during a meeting
      in Vancouver. (NHK)
    - Human rights in Burkina Faso
    - The United Nations announces that it will close its human rights office in Burkina
      Faso after the country's military junta indefinitely suspends its operations,
      preventing the office from carrying out its mandate. (Euronews) (Reuters)
    - AI boom, Artificial intelligence industry in China
    - Taiwanese prosecutors detain two Supermicro employees in an investigation into
      alleged document forgery and shipments of Nvidia artificial intelligence servers
      to China in violation of U.S. export controls. (AFP via The Manila Times)
    - Corruption in Spain
    - Spain's National Court charges the Civil Guard's director-general Mercedes González
      Fernández and her deputy with the offences of abuse of office and obstruction
      of justice in connection with the ruling PSOE's alleged operation against judges
      and prosecutors investigating cases of corruption involving party members. (Demócrata)
    - Flamingo Revolution
    - Police clash with demonstrators in Albania during a protest against the government
      and the Sazan Island Resort project. (AP)
    - 2026 Algerian parliamentary election
    - Algerians vote for 407 seats of the People's National Assembly amid a cost-of-living
      crisis and candidate bans upon the Hirak movement. (AP)
    - Protests and uprisings in Tibet since 1950
    - A man protesting against the annexation of Tibet by China lights himself on
      fire outside of the headquarters of the United Nations in New York City, United
      States. He is transported to Bellevue Hospital where he dies from his injuries.
      (AA) (CTV News)
    - 2026 Wimbledon Championships
    - In tennis, Alexandra Eala becomes the first Filipino woman to reach the third
      round of a Grand Slam tournament after defeating Australian player Maya Joint
      in the Wimbledon women's singles tournament. She will face reigning Wimbledon
      champion Iga Świątek next. (ABS-CBN) (WTA)
