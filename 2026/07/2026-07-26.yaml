wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war, Qatar as a mediator in conflict
    - Iran and the United States submit their responses to a proposal by Pakistan
      and Qatar to resume talks between the two countries. (The Jerusalem Post)
    - 2026 Strait of Hormuz crisis
    - Iran's Islamic Revolutionary Guard Corps Navy says it has prevented six ships
      from transiting the Strait of Hormuz. (CNBC)
    - Iranian media reports that an oil tanker exploded in the Strait of Hormuz after
      it has hit a naval mine. (Middle East Eye)
    - Gaza war
    - Humanitarian aid during the Gaza war
    - Five aid convoys from the United Arab Emirates carrying 938 tonnes of humanitarian
      aid arrive in Gaza as part of Operation Chivalrous Knight 3. (Gulf Today) (Sharjah24)
    - The Israeli military states that an Hamas unmanned aerial vehicle unit commander
      was killed in an airstrike yesterday in central Gaza, in violation of the ongoing
      ceasefire. (The Times of Israel)
    - Yemeni civil war
    - Red Sea crisis
    - Eleven vessels cross the Bab-el-Mandeb strait, according to shipping data from
      Kpler. (Reuters)
    - Saudi-led intervention in the Yemeni civil war
    - The Houthis shoot down a Saudi Arabian reconnaissance drone in northwest Yemen.
      (AFP via The Times of Israel)
    - Sudanese civil war
    - The Sudanese Armed Forces (SAF) announces that they have recaptured the North
      Kordofan areas of Umm Qarfa and Juraikh. The SAF also seize control of the National
      Export Highway which connects Sudan's capital Khartoum and North Kordofan. (Sudan
      Horizon) (Sudan Tribune)
    - At least 30 people are killed and others are injured in an attack on a community
      by unknown gunmen in Kaura, Kaduna State, Nigeria. (CTV News)
    - UNESCO designates the Alamut Castle in Qazvin province, Iran, a World Heritage
      Site. (Tehran Times)
    - Vietnamese cargo ship sinks in the South China Sea along the Vietnamese coast.
      Forty-five people are rescued while 17 more are still missing. (Reuters)
    - Argentina–Brazil relations
    - Brazil recalls its ambassador to Argentina and summons Argentina's ambassador
      after Argentine president Javier Milei made remarks deemed derogatory about
      Brazilian president Luiz Inácio Lula da Silva and Supreme Court justice Alexandre
      de Moraes at a political event in São Paulo. (AFP via France 24)
    - Iran–Ukraine relations, Ukraine in the 2026 Iran war
    - The Iranian foreign ministry summons the Ukrainian chargé d'affaires in Tehran
      over an attack by Ukraine on an Iranian ship in the Caspian Sea that killed
      an Iranian sailor, calling it a "hostile and criminal act". (CNBC)
    - 2026 Berlin Pride attack
    - A suspect in a recent vehicle-ramming and mass stabbing attack in Berlin, identified
      as a 21-year-old German citizen of Lebanese descent, is shot and killed by police
      after allegedly rushing toward officers with a weapon. (CNN)
    - 2026 Seattle Center shooting
    - Three people are killed and four others are injured in a shooting during the
      annual Bite of Seattle festival in Seattle, Washington, United States. (CNN)
    - 2027 Salvadoran presidential election
    - El Salvador's Nationalist Republican Alliance nominates former legislator Mayteé
      Iraheta for president, while the Farabundo Martí National Liberation Front nominates
      physician Rafael Aguirre. (Reuters)
    - International Space Station expeditions
    - Expedition 74, the joint NASA–Roscosmos–ESA expedition aboard the International
      Space Station, ends after the Soyuz MS-28 undocks and lands on Earth in Kazakhstan.
      (CNN)
    - 2026 Formula One World Championship
    - 2026 Bahrain Grand Prix
    - In auto racing, Formula One announces that Malaysia's Sepang International Circuit
      will host the rescheduled Bahrain Grand Prix in October, under an agreement
      signed between Bahrain and Malaysia. (Al Jazeera) (Reuters)
    - 2026 All-Ireland Senior Football Championship, Sports-related curses
    - In Gaelic football, the All-Ireland Senior Football Championship concludes with
      Mayo defeating Kerry in the final to end one of sport's longest-running droughts
      and a 75-year wait for the title. (ABC News Australia) (ESPN)
