wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - July 2026 United States strikes against Iran
    - The United States Central Command launches a new round of strikes against Iran
      in an effort to degrade capabilities used to attack commercial shipping in the
      Strait of Hormuz ahead of the naval blockade. (CNBC)
    - The United States military reimposes the naval blockade of Iran that ended on
      June 17 last month in response to ship attacks. (AP) (France 24)
    - Iran fires projectiles at two tankers in the Strait of Hormuz associated with
      the United Arab Emirates, killing two mariners and injuring 14 others. (Xinhua)
    - U.S. president Donald Trump cancels a proposal to implement a 20% fee on cargo
      ships transiting through the strait. (AP) (BBC News)
    - Kuwait in the 2026 Iran war
    - Kuwait's military says that Iran struck a navy vessel, injuring four personnel,
      while its air defences intercept one ballistic missile, five cruise missiles,
      and 33 drones aimed at civilian facilities. (AFP via Arab News Pakistan)
    - Explosions are reported in the Iranian cities of Ahvaz and Bandar Abbas, and
      the islands of Kish and Qeshm. (Middle East Eye)
    - 2026 Lebanon war
    - 2026 Israel–Lebanon peace talks
    - The first day of direct negotiations and the sixth round of peace talks between
      Israel and Lebanon begins at the U.S. embassy in Rome, Italy. (AA) (The Times
      of Israel)
    - Gaza war
    - The Israeli military strikes a police station in Gaza, killing eight people,
      according to Gaza's civil defence agency and Al-Shifa Hospital, violating the
      ongoing ceasefire. (AFP via CNA)
    - Iraqi conflict
    - Withdrawal of United States troops from Iraq
    - Iraqi prime minister Ali al-Zaidi and the U.S. defense department says that
      all remaining American troops will withdraw from Iraq by September 30, ending
      a 23-year presence in the country that started with the 2003 U.S. invasion.
      (AP) (DW)
    - Sudanese civil war
    - 2026 Blue Nile campaign
    - The Sudanese Armed Forces say that the 4th Infantry Division's 13th Brigade
      have taken control of the Blue Nile town of Fashfoun following days of clashes
      with the paramilitary Rapid Support Forces and the Sudan People's Liberation
      Movement–North. (TRT Afrika) (Yeni Şafak)
    - Colombian conflict
    - Colombia's military says it has rescued 39 civilians kidnapped by the National
      Liberation Army on a highway in Chocó Department, with two soldiers killed during
      the operation. (AFP via Vanguard)
    - A Tyrannosaurus rex skeleton nicknamed Gus sells for US$50.1 million at Sotheby’s
      in New York City, United States, setting an auction record for a dinosaur fossil.
      (AFP via CNA)
    - 2024–2026 Cuba blackouts, 2026 Cuban crisis
    - Cuba suffers its third nationwide blackout in less than 10 days and fifth of
      2026, as the state utility reports a complete grid failure amid fuel shortages
      caused by the ongoing U.S. imposed blockade, that complicate power restoration.
      (AFP via RFI)
    - Seven people are killed and three others are injured after two vehicles collided
      head-on just outside Ramadi, Iraq. (Xinhua)
    - Six people are killed after a gas-laden truck caught fire and exploded at a
      checkpoint along a federal highway in Kogi State, Nigeria. (The PunchNG)
    - Six workers are killed in a fire at a building under construction in Brussels,
      Belgium. (BBC News)
    - 2026 Bangladesh measles outbreak
    - The Directorate General of Health Services reports that seven more children
      have died from measles in Bangladesh in the past 24 hours, bringing the total
      death toll from the disease in the country to 766. (The Business Standard)
    - 2026 Ebola epidemic
    - The Democratic Republic of the Congo (DRC) announces that it will test the Gilead
      Sciences antiviral for the Bundibugyo strain of the Ebola virus. (CNBC Africa)
    - The World Health Organization reports that 80% of cases of Ebola in eastern
      DRC are from unknown chains of transmission. Additionally, the death toll from
      Ebola reaches 700. (AP)
    - 2026 United States cyclosporiasis outbreak
    - The U.S. CDC reports 7,000 cases nationwide of cyclosporiasis, which is caused
      by cyclospora cayetanensis. (NBC News)
    - The Michigan Department of Health and Human Services reports 3,300 cases in
      the state, up from 2,640 the previous day. (The Detroit News)
    - Shootings by U.S. immigration agents in the second Trump administration
    - The U.S. Immigration and Customs Enforcement suspends vehicle stops related
      to immigration enforcement following the recent fatal shootings of Lorenzo Salgado
      Araujo in Houston, Texas, and Joan Sebastian Guerrero in Biddeford, Maine. (Reuters)
    - International Criminal Court investigation in Darfur
    - A prosecutor at the International Criminal Court drop charges against former
      rebel leader Abdallah Banda over his role in a 2007 attack on African Union
      peacekeepers during Sudan's Darfur conflict. (AFP via Arab News)
    - AI boom
    - Japan approves election rules requiring AI-generated images and videos on social
      media to be labeled and prohibiting false or distorted information about candidates,
      with the measures taking effect in March. (AFP via The Straits Times)
