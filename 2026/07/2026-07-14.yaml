  - 2026 Strait of Hormuz crisis
  - 2026 Strait of Hormuz campaign
  - The United States military reimposes the naval blockade that ended on June 17
    last month in response to ship attacks. (AP) (France 24)
  - Iran fires projectiles at two tankers in the Strait of Hormuz associated with
    the United Arab Emirates, killing one mariner and injuring eight others. (AP)
    (BBC News)
  - U.S. president Donald Trump cancels a proposal to implement a 20% fee on cargo
    ships transiting through the strait. (AP) (BBC News)
  - Kuwait in the 2026 Iran war
  - Kuwait's military says that Iran struck a navy vessel, injuring four personnel,
    while its air defences intercept one ballistic missile, five cruise missiles,
    and 33 drones aimed at civilian facilities. (AFP via Arab News Pakistan)
  - 2026 Lebanon war
  - 2026 Israel–Lebanon peace talks
  - The first day of direct negotiations and the sixth round of peace talks between
    Israel and Lebanon begins at the U.S. embassy in Rome, Italy. (AA) (The Times
    of Israel)
  - Sudanese civil war
  - 2026 Blue Nile campaign
  - The Sudanese Armed Forces say that the 4th Infantry Division's 13th Brigade have
    taken control of the Blue Nile town of Fashfoun following days of clashes between
    the Rapid Support Forces and Sudan People's Liberation Movement–North. (TRT Afrika)
    (Yeni Şafak)
  - The Rapid Support Forces submit their response to peace proposals presented backed
    by U.S. Senior Advisor for Arab and African Affairs Massad Boulos. (Sudan Tribune)
  - Colombian conflict
  - Colombia's military says it has rescued 39 civilians kidnapped by the National
    Liberation Army on a highway in Chocó Department, with two soldiers killed during
    the operation. (AFP via Vanguard)
  - 2024–2026 Cuba blackouts, 2026 Cuban crisis
  - Cuba suffers its third nationwide blackout in less than 10 days and fifth of 2026,
    as the state utility reports a complete grid failure amid fuel shortages caused
    by the ongoing U.S. imposed blockade, that complicate power restoration. (AFP
    via RFI)
  - Seven people are killed and three others are injured after two vehicles collided
    head-on just outside Ramadi, Iraq. (Xinhua)
  - At least two people are killed and four remain missing after a fire broke out
    in a building in Brussels, Belgium. (Xinhua)
  - 2026 Ebola epidemic
  - Democratic Republic of the Congo will test the Gilead Sciences antiviral for the
    Bundibugyo strain of the Ebola virus. (CNBC Africa)
  - 2026 United States cyclosporiasis outbreak
  - The U.S. CDC reports 7,000 cases nationwide of cyclosporiasis, which is caused
    by cyclospora cayetanensis. (NBC News)
  - Shootings by U.S. immigration agents in the second Trump administration
  - The U.S. Immigration and Customs Enforcement suspends vehicle stops related to
    immigration enforcement following the recent fatal shootings of Lorenzo Salgado
    Araujo in Houston, Texas, and Joan Sebastian Guerrero in Biddeford, Maine, U.S.
    (Reuters)
  - AI boom
  - Japan approves election rules requiring AI-generated images and videos on social
    media to be labeled and prohibiting false or distorted information about candidates,
    with the measures taking effect in March. (AFP via The Straits Times)
  - 2026 FIFA World Cup
  - Spain at the FIFA World Cup
  - In association football, Spain advances to its second FIFA World Cup final (first
    since 2010) after defeating France 2–0 in its semifinal match at the 2026 World
    Cup. (The New York Times)
