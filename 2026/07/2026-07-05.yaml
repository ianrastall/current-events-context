date: '2026-07-05'
source_page:
  portal: Portal:Current events/2026 July 5
  language: en
  wikipedia_revision_id: 1366338902
wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Post-war plans for the Gaza Strip
    - Israeli prime minister Benjamin Netanyahu says that there will be no reconstruction
      in the Gaza Strip until Hamas is disarmed and the strip is demilitarized. (Ynetnews)
    - Medics say that two Palestinians have been killed in airstrikes at the Omar
      Al-Mokhtar street in Gaza City. (Reuters)
    - 2026 Lebanon war
    - Israeli occupation of Southern Lebanon
    - Netanyahu says some Christian-majority villages in southern Lebanon asked to
      be annexed by Israel for protection from Hezbollah, while villages in the Marjayoun
      District deny seeking annexation. (AFP via Arab News)
    - The Israeli military says that the Commando Brigade targeted Hezbollah operatives
      riding motorcycles near Nabatieh. (The Times of Israel)
    - Red Sea crisis
    - The United Kingdom Maritime Trade Operations and British military's Royal Navy
      reports that a cargo ship was attacked by "unknown armed assailants" off the
      coast of Yemen's port city Hodeidah at the Red Sea. (Euronews) (DW)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis, 2026 Strait of Hormuz crisis
    - Seven OPEC+ members agree to raise oil production quotas by 188,000 barrels
      per day in August, as oil exports through the Strait of Hormuz gradually resume
      after disruptions linked to the Iran war. (AFP via France 24)
    - Qatar resumes all maritime activities, reversing a June 29 advisory suspending
      sailing and fishing boats following the death of a Qatari national from shrapnel
      linked to regional military operations. (Reuters)
    - 2026 Venezuela earthquakes
    - The Venezuelan information ministry reports that the death toll from the earthquakes
      in Venezuela has risen to 3,342. (Reuters)
    - Ten people are killed and six others are injured after a truck and a bus collided
      in Ogun State, Nigeria. (Daily Review)
    - Six people are killed and one injured after a three-story residential building
      collapses due to heavy rains in Mumbai, India. (Xinhua)
    - 2026 Bangladesh measles outbreak
    - Seven more children are reported to have died from measles, bringing the death
      toll from the disease in Bangladesh to 738. (The Business Standard)
    - A complaint is filed in a Dhaka court against former interim Chief Adviser Muhammad
      Yunus, former health adviser Nur Jahan Begum, and two other health officials
      from the Yunus ministry over their roles in the measles epidemic in the country
      including child deaths. (Dhaka Tribune) (Daily Sun Bangladesh)
    - 2026 North American heat wave
    - Around 25 deaths are reported in heat waves in the United States, with 40 million
      people under heat alerts across the East Coast, Southeast, and Southwest regions
      of the country. (NBC News)
    - Sudanese cholera epidemic
    - The Dar Hamar Emergency Room reports 800 cases of cholera, including 30 deaths,
      in the West Kordofan communities of Wad Banda and Al-Nahud in western Sudan.
      (Middle East Monitor)
    - The Sudan Doctors Network reports 200,000 people in the North Kordofan town
      of Bara are facing a cholera outbreak alongside measles, including 100 cases
      of measles in children at health care facilities in Bara. (AA)
    - Somalia–Turkey relations
    - Turkish involvement in the Somali civil war, Constitutional crisis in Somalia
    - The Puntland government issues a statement claiming exclusive control over its
      marine resources, citing its constitution and Somalia's federal framework to
      block SOMTURK, a joint venture between Somalia's fisheries ministry and Turkey's
      OYAK fund, from operating without approval. SOMTURK holds a federal licence
      for fishing permits across Somalia's economic zone. (Garowe Online) (Horseed
      Media) (Hiiraan Online)
    - JAXA satellite Hayabusa2 conducts a flyby of the asteroid 98943 Torifune. (NHK)
    - 2026 FIFA World Cup
    - 2026 FIFA World Cup controversies
    - 2026 Trump–FIFA red card controversy
    - In association football, FIFA declares American forward Folarin Balogun eligible
      to face Belgium following an intervention by U.S. president Donald Trump. FIFA
      suspends his ban under Article 27 of the FIFA Disciplinary Code, placing it
      on a one-year probationary period while allowing the red card itself to stand.
      It became the first time since the introduction of FIFA's automatic suspension
      system that a World Cup red card suspension is overturned rather than served.
      (BBC News) (The New York Times)
    - Norway at the FIFA World Cup, Brazil at the FIFA World Cup
    - Norway advances to the quarterfinals of a FIFA World Cup for the first time
      after defeating Brazil 2–1 in the round of 16. Brazil's loss also marks the
      team's earliest elimination from the tournament since 1990. (AFP via RFI)
