Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - Gaza war
  - Post-war plans for the Gaza Strip
  - Israeli prime minister Benjamin Netanyahu says that there will be no reconstruction
    in the Gaza Strip until Hamas is disarmed and the strip is demilitarized. (Ynetnews)
  - Medics say that two Palestinians have been killed in airstrikes at the Omar Al-Mokhtar
