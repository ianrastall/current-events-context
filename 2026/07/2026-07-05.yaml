  - 2026 Lebanon war
  - Israeli occupation of Southern Lebanon
  - Netanyahu says some Christian-majority villages in southern Lebanon asked to be
    annexed by Israel for protection from Hezbollah, while villages in the Marjayoun
    District deny seeking annexation. (AFP via Arab News)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis, 2026 Strait of Hormuz crisis
  - Seven OPEC+ members agree to raise oil production quotas by 188,000 barrels per
    day in August, as oil exports through the Strait of Hormuz gradually resume after
    disruptions linked to the Iran war. (AFP via France 24)
  - Qatar resumes all maritime activities, reversing a June 29 advisory suspending
    sailing and fishing boats following the death of a Qatari national from shrapnel
    linked to regional military operations. (Reuters)
  - 2026 Bangladesh measles outbreak
  - Seven more children are reported to have died from measles, bringing the death
    toll from the disease in Bangladesh to 738. (The Business Standard)
  - A complaint is filed in a Dhaka court against former interim Chief Adviser Muhammad
    Yunus, former health adviser Nur Jahan Begum, and two other health officials from
    the Yunus ministry over their roles in the measles epidemic in the country including
    child deaths. (Dhaka Tribune) (Daily Sun Bangladesh)
  - Sudanese cholera epidemic
  - The Dar Hamar Emergency Room reports 800 cases of cholera, including 30 deaths,
    in the West Kordofan communities of Wad Banda and Al-Nahud in western Sudan. (Middle
    East Monitor)
  - The Sudan Doctors Network reports 200,000 people in the North Kordofan town of
    Bara are facing a cholera outbreak alongside measles, including 100 cases of measles
    in children at health care facilities in Bara. (AA)
  - Somalia–Turkey relations
  - Turkish involvement in the Somali civil war, Constitutional crisis in Somalia
  - Puntland government issued a statement saying exclusive control over its marine
    resources, citing its constitution and Somalia's federal framework to block SOMTURK.
    a joint venture between Somalia's fisheries ministry and Turkey's OYAK fund, from
    operating without approval. The firm holds a federal licence for fishing permits
    across Somalia's economic zone, signed in Ankara last December to regulate fishing
    and curb illegal activities, following as leverage in stalled political talks
    as rich tuna grounds remain underdeveloped. (Garowe Online) (Horseed Media) (Hiiraan
    Online)
  - The satellite Hayabusa2 conducts a flyby of the asteroid 98943 Torifune. (NHK)
  - 2026 FIFA World Cup
  - Norway at the FIFA World Cup, Brazil at the FIFA World Cup
  - In association football, Norway advances to the quarterfinals of a FIFA World
    Cup for the first time after defeating Brazil 2–1 in the round of 16. Brazil's
    loss also marks the team's earliest elimination from the tournament since 1990.
    (AFP via RFI)
