  - India–New Zealand relations
  - India and New Zealand announce the formation of a strategic partnership during
    Indian prime minister Narendra Modi's visit to Auckland, expanding cooperation
    on defense, security, trade, diplomacy, culture, sport, science, and maritime
    issues in the Indo-Pacific. (AFP via The Manila Times)
  - Day of Remembrance of the Victims of Genocide Committed by Ukrainian Nationalists
  - Polish prime minister Donald Tusk, marking the anniversary of Bloody Sunday, announces
    plans to build a Wall of Remembrance in Warsaw for identified victims of the Volhynia
    massacre and says Poland will continue efforts to exhume and properly bury victims.
    (AFP via The Straits Times) (Rzeczpospolita in Polish)
  - Gaza war protests
  - Protesters in Stockholm, Sweden, gather at the Odenplan plaza to protest against
