wikipedia:
  categories:
    Uncategorized:
    - Arab–Israeli conflict
    - Gaza war
    - Israeli bombing of the Gaza Strip
    - One Palestinian is killed and two others are injured in a Israeli drone strike
      in central Gaza. (Palestine Chronicle)
    - Hezbollah–Israel conflict
    - 2026 Israel–Lebanon peace talks
    - A Lebanese official says Lebanon will participate in planned talks with Israel
      in Rome, Italy, as a U.S. military delegation visits Beirut to discuss the implementation
      of a framework agreement between Lebanon and Israel. (AFP via Al Arabiya)
    - Sudanese civil war
    - Kordofan campaign, Siege of El Obeid
    - UNICEF warns that half a million civilians in El-Obeid, North Kordofan, are
      forcing children and families to be displaced and seek refuge. (AA)
    - The Khartoum State government says that they have transferred the remains of
      27 victims of the war in the country to official cemeteries ahead of the rainy
      season. (Sudan Tribune)
    - Housing in the United States
    - The 21st Century ROAD to Housing Act becomes law after U.S. president Donald
      Trump allows the bill to take effect without his signature. It was passed by
      the U.S. Congress to expand affordable housing and reduce housing costs. (CBS
      News)
    - At least 44 people are killed and more than one million are stranded as floods
      and landslides triggered by monsoon rains affect southeastern Bangladesh, disrupting
      power, roads, and communications across several districts. (Reuters)
    - Fifteen Indian tourists are killed and 21 others are rescued when a speedboat
      capsizes near Phú Quốc, Vietnam. (CNN-News18)
    - India–New Zealand relations
    - India and New Zealand announce the formation of a strategic partnership during
      Indian prime minister Narendra Modi's visit to Auckland, expanding cooperation
      on defense, security, trade, diplomacy, culture, sport, science, and maritime
      issues in the Indo-Pacific. (AFP via The Manila Times)
    - 2026 Salsa on St. Clair festival shooting
    - Two people are killed and four others are injured in a mass shooting at a festival
      in Toronto, Ontario, Canada. (CBC News) (Reuters)
    - Day of Remembrance of the Victims of Genocide Committed by Ukrainian Nationalists
    - Polish prime minister Donald Tusk, marking the anniversary of Bloody Sunday,
      announces plans to build a Wall of Remembrance in Warsaw for identified victims
      of the Volhynia massacre and says Poland will continue efforts to exhume and
      properly bury victims. (AFP via The Straits Times) (Rzeczpospolita in Polish)
    - Gaza war protests
    - Protesters in Stockholm, Sweden, gather at the Odenplan plaza to protest against
      Israel's attacks in Gaza, ceasefire violations, and restrictions on humanitarian
      aid entering Gaza. (AA)
    - Moldovan president Maia Sandu nominates Vasile Tofan as the new country's prime
      minister after the resignation of Alexandru Munteanu. (Reuters)
    - 2026 FIFA World Cup
    - Argentina at the FIFA World Cup
    - In association football, Argentine forward and captain Lionel Messi becomes
      the first player to reach 10 assists in FIFA World Cup matches since records
      began in 1966. (ABC News) (The Chosun Daily)
    - The quarterfinals end with the four highest-ranked teams in the FIFA Men's World
      Ranking (Argentina, Spain, France, and England) advancing to the semifinals,
      the first time this has happened since the rankings were introduced in 1992.
      (BBC Sport) (Fox Sports)
    - 2026 Wimbledon Championships
    - In tennis, Linda Nosková wins her first major title after defeating her compatriot
      Karolína Muchová in the final, 6–2, 5–7, 6–3 to win the ladies' singles title
      at the 2026 Wimbledon Championships. (CNN)
    - Doping in China
    - The China Anti-Doping Agency reports that Shanghai Sharks player Hassan Whiteside
      tested positive for prohibited substances oxandrolone and clomifene during the
      2026 Chinese Basketball Association playoffs, making him subject to a potential
      two-year ban. (South China Morning Post)
