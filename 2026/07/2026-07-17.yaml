Date: '2026-07-17'
Source_URI: Portal:Current events/2026 July 17
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Iranian strikes on the Kurdistan Region
  - Iranian drone strikes near Erbil, Kurdistan Region, Iraq, kill eight Kurdish rebels
    and injure several more. (AFP via The Times of Israel)
  - 2026 Iranian strikes on Bahrain
  - The Iranian army says that it has launched a drone strike at the Al-Sakhir Air
    Base in Bahrain, where United States military helicopters and P-8 reconnaissance
    aircraft are stored, as part of the 11th phase of its Saegheh operation. (AA)
  - Syria in the 2026 Iran war
  - Iranian state media reports that Iran's Islamic Revolutionary Guards Corps have
    targeted a United States Special Operations Command in Al-Tanf in response to
    the killing of Iranian soldiers in Iranshahr, Sistan and Baluchestan province.
    (Arab News)
  - Gaza war
  - Around eight Palestinians are reported to be killed in an airstrike on a funeral
    in central Gaza. (AA)
  - The Israeli military and Shin Bet confirm that they have killed Hamas commander
    Anas Mahmoud Ahmad Hamdan, who served as a "right-hand man" of former Al-Qassam
    Brigades commander Mohammed Deif, in a airstrike in Khan Yunis, Gaza Strip. (The
    Times of Israel)
  - 2026 Chiapas earthquake
  - A strong earthquake strikes near the coast of Chiapas, Mexico. Tsunami warnings
    were issued and damage is unknown. (BBC News) (The Weather Network)
  - Eight people are killed, ten others are rescued and 34 are reported missing when
    a landslide buries multiple houses and residential buildings in Pengshui, Chongqing,
    China. (ABC News) (India Today)
  - A large fire breaks out among terraced houses in Krokstadelva, Drammen, Norway,
    spreading rapidly between multiple housing blocks and prompting mass evacuations;
    the municipality declares a crisis and calls in fire crews from eight neighboring
    municipalities. (Reuters) (VG)
  - 2026 Bangladesh measles outbreak
  - The death tolls from the measles outbreak in Bangladesh reaches 780 after one
    child is reported to have died from the disease by the Directorate General of
    Health Services. (Dhaka Tribune)
  - 2026 United States cyclosporiasis outbreak
  - Taylor Farms recalls their iceburg lettuce, traced through a farm in Mexico, amidst
    the ongoing cyclosporiasis outbreak in the United States, which is caused by cyclospora
    cayetanensis. (Forbes)
  - Michigan, U.S., surpasses 5,000 cases of cyclosporiasis. (The Detroit News)
  - A civilian dies and a police officer and the suspected gunman are wounded in a
    shooting in Nørresundby, North Jutland, Denmark, after officers responding to
    a reported fire are met with gunfire. (AP) (TV2)
  - Japan enacts a law criminalizing public damage, removal or defacement of the national
    flag, punishable by up to two years in prison or a ¥200,000 (US$1,200) fine. (AFP
    via France 24)
  - 2026 Labour Party leadership election
  - Andy Burnham is elected as the new leader of the British Labour Party. He will
    formally succeed Keir Starmer as prime minister on Monday. (BBC News) (CNN) (The
    Guardian)
  - Japanese imperial succession debate
  - Japan's National Diet amends the Imperial Household Law to allow unmarried male
    descendants of former imperial branches to rejoin the family and permit royal
    women to retain status after marrying commoners, while preserving male-only succession.
    (AFP via ABS-CBN News)
