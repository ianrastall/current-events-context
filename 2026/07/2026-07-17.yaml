wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Bahrain
    - Iran says that it has launched ballistic missile and drone strikes at targets
      in Bahrain, including a drone vessel depot, an artificial intelligence center
      used for targeting, and the Al-Sakhir Air Base, as part of the 11th phase of
      its Saegheh operation. (AA) (Middle East Monitor)
    - 2026 Iranian strikes on Jordan
    - Jordan reports having intercepted projectiles fired from Iran. (AA)
    - 2026 Iranian strikes on Kuwait
    - Iranian strikes damage a desalination plant and a power plant in Kuwait, according
      to the Kuwaiti energy ministry. (AP) (CNBC)
    - 2026 Iranian strikes on Oman
    - The Islamic Revolutionary Guard Corps Navy launches attacks on radar facilities
      in Oman. (AA)
    - 2026 Iranian strikes on Syria
    - Iranian state media reports that Iran's Islamic Revolutionary Guards Corps have
      targeted a United States Special Operations Command in Al-Tanf in response to
      the killing of Iranian soldiers in Iranshahr, Sistan and Baluchestan province.
      (Arab News)
    - 2026 Iranian strikes on Qatar
    - The Islamic Revolutionary Guard Corps Aerospace Force launches an attack at
      Al Udeid Air Base in Qatar, and claims to have caused damage to equipment there,
      while Qatar's armed forces claim to have intercepted Iranian attacks. (AA)
    - 2026 Strait of Hormuz crisis
    - The U.S. military's Central Command (CENTCOM) confirms that they have destroyed
      the Chah Bahar Shahid Kalantari Port surveillance tower in Chabahar Port yesterday,
      which was allegedly used by the Islamic Revolutionary Guard Corps for tracking
      commercial vessels transiting the Strait of Hormuz. (The Times of Israel)
    - 2026 Iranian strikes on the Kurdistan Region
    - Iranian drone strikes near Erbil, Kurdistan Region, Iraq, kill eight Kurdish
      rebels and injure several more. (AFP via The Times of Israel)
    - The U.S. CENTCOM launches strikes against Iran for a seventh consecutive night.
      (The Guardian)
    - Gaza war
    - Around eight Palestinians are reported to be killed in an airstrike on a funeral
      in central Gaza. (AA)
    - The Israeli military and Shin Bet confirm that they have killed Hamas commander
      Anas Mahmoud Ahmad Hamdan, who served as a "right-hand man" of former Al-Qassam
      Brigades commander Mohammed Deif, in an airstrike in Khan Yunis, Gaza Strip.
      (The Times of Israel)
    - War in the Sahel
    - An attack on a military deployment in Téra, Tillabéri Region, Niger, kills 16
      soldiers and injures 23 others, while state media reports that security forces
      have killed 15 attackers. (AFP via The Economic Times)
    - Economic impact of the 2026 Iran war
    - 2026 Strait of Hormuz crisis, Iraq–Syria relations
    - Iraq and Syria sign a memorandum of understanding to rehabilitate the Kirkuk–Baniyas
      pipeline to bypass to the Strait of Hormuz. (Middle East Eye)
    - Iraq-United States relations
    - The United States Chamber of Commerce announces that Iraq has signed roughly
      $60 billion worth of agreements and partnerships to bypass the Strait of Hormuz
      and accelerate American investment in the Iraqi oil sector. (AP News)
    - Wildfires in 2026
    - 2026 United States wildfires
    - 2026 Minnesota wildfires
    - The United States Forest Service reports that wildfires in northern Minnesota
      has reached over 77,000 acres, prompting evacuations in the area. (KARE TV)
      (KAAL)
    - 2026 Canadian wildfires
    - Over 900 wildfires are reported across Canada, including 43 new active blazes,
      prompting evacuations across the country. (CTV News) (BNN Bloomberg)
    - The U.S. state of Connecticut's Department of Energy and Environmental Protection
      deploys firefighters to assist with wildfire efforts in Quebec, Canada. (CT.Gov)
      (WVIT)
    - 2026 Chiapas earthquake
    - A earthquake strikes near the coast of Chiapas, Mexico. Tsunami warnings are
      issued and at least two people are injured. (ABC7) (BBC News) (The Weather Network)
    - 2026 Venezuela earthquakes
    - The confirmed death toll from the doublet earthquakes that struck northern Venezuela
      in June rises to 5,069 people. (AP)
    - Krokstadelva fire
    - A large fire breaks out among terraced houses in Krokstadelva, Drammen, Norway,
      spreading rapidly between multiple housing blocks and prompting mass evacuations.
      The municipality declares a crisis and calls in fire crews from eight neighboring
      municipalities. (Reuters) (VG)
    - Eight people are killed, ten others are rescued and 34 are reported missing
      when a landslide buries multiple houses and residential buildings in Pengshui,
      Chongqing, China. (ABC News) (India Today)
    - Four people are killed and nine others are injured after a head-on collision
      between two overspeeding cars along the N-25 National Highway in Wadh, Balochistan,
      Pakistan. (Dawn)
    - A nine-vehicle pile-up in Deli Serdang, North Sumatra, Indonesia, kills at least
      four and injures eight others. (Xinhua)
    - A storm in Chile kills three people, injures seven others, damages more than
      800 homes, displaces hundreds, and leaves around 400,000 people without electricity
      across 10 regions. (Reuters) (Xinhua)
    - A nine-story building under construction near Conakry, Guinea, collapses due
      to heavy rainfall, killing three people and injuring several others. (Xinhua)
    - Two citizens are killed from weather-related incidents and 53,000 homes are
      reported to be without power during severe thunderstorms across several regions
      of France. (AA)
    - 2026 Bangladesh measles outbreak
    - The death tolls from the measles outbreak in Bangladesh reaches 780 after one
      child is reported to have died from the disease by the Directorate General of
      Health Services. (Dhaka Tribune)
    - 2026 United States cyclosporiasis outbreak
    - Taylor Farms recalls their iceburg lettuce, traced through a farm in Mexico,
      amidst the ongoing cyclosporiasis outbreak in the United States, which is caused
      by Cyclospora cayetanensis. (Forbes)
    - Michigan, U.S., surpasses 5,000 cases of cyclosporiasis. (The Detroit News)
    - Hong Kong–United States relations
    - The United States allows its national emergency over Hong Kong's national security
      law to expire while retaining the underlying executive order and most related
      sanctions. (AFP via New Straits Times)
    - A civilian dies while a police officer and the suspected gunman are wounded
      in a shooting in Nørresundby, North Jutland, Denmark, after officers responding
      to a reported fire are met with gunfire. (AP) (TV2)
    - The Ontario Court of Appeal finds Canadian far-right activist and Freedom Convoy
      organizer Pat King guilty of intimidation and orders a re-sentencing. (CBC)
      (Toronto Star)
    - Japan enacts a law criminalizing public damage, removal or defacement of the
      national flag, punishable by up to two years in prison or a ¥200,000 (US$1,200)
      fine. (AFP via France 24)
    - Turkish authorities detain 67 irregular migrants and five other suspected smugglers
      following a sailboat interception off the coast of Muğla, Turkey. (Xinhua)
    - 2026 Labour Party leadership election
    - Andy Burnham is elected as the new leader of the British Labour Party. He will
      formally succeed Keir Starmer as prime minister on Monday. (BBC News) (CNN)
      (The Guardian)
    - Dismissal of Mykhailo Fedorov
    - Protests continue for a second day in Kyiv, Ukraine, near the Presidential Office
      Building, demanding the return of Mykhailo Fedorov as Minister of Defence and
      the resignation of Oleksandr Syrskyi as the Commander-in-Chief of the Armed
      Forces of Ukraine. (Reuters)
    - Japanese imperial succession debate
    - Japan's National Diet amends the Imperial Household Law to allow unmarried male
      descendants of former imperial branches to rejoin the family and permit royal
      women to retain status after marrying commoners, while preserving male-only
      succession. (AFP via ABS-CBN News)
