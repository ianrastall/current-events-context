Date: '2026-07-16'
Source_URI: Portal:Current events/2026 July 16
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - White House Press Secretary Karoline Leavitt says that Iran is still interested
    in an agreement with the United States. However, she also accuses Iran of violating
    the Islamabad Memorandum by firing at commercial vessels in the Strait of Hormuz.
    (Reuters)
  - Kuwait in the 2026 Iran war
  - The Kuwaiti Ministry of Defense reports that the Kuwait Armed Forces intercepted
    and destroyed 32 drones entering the country's airspace. (Arab Times Kuwait)
  - The United States Central Command launches new strikes against Iran for an sixth
    consecutive night in an effort to degrade Iranian military capabilities. (Middle
    East Eye)
  - Explosions are reported in Qeshm Island, Bushehr, Ahvaz, and Bandar Abbas, including
    a bridge in Bandar Khamir. A truck on the bridge is reported to be targeted, killing
    the driver. (Turkiye Today)
  - Tasnim News Agency reports that American fighter jets attacked the Iranshahr Airport
    in the Sistan and Baluchestan province. (Ynetnews) (MTV)
  - Iranian Foreign Ministry spokesperson Esmail Baghaei accuses the U.S. of war crimes
    after a U.S. strike near a children's cancer hospital in Ahvaz forced the evacuation
    of 211 young patients undergoing cancer treatment, including chemotherapy. (Muslim
    Network TV) (Arab News)
  - Sudanese civil war
  - Sudanese refugee crisis
  - The U.S. Embassy in Cairo, Egypt, in a press release reports that US Chargé d’Affaires
    in Egypt Robert Silverman announced that $24 million will be provided to the World
    Food Programme to support Sudanese refugees in Egypt. (Al-Ahram) (DNE Africa)
  - Around 1,000 Sudanese returnees in Egypt are reported by a local committee to
    have returned to the country. (Middle East Monitor)
  - The Sudanese Armed Forces says that they have destroyed around 205 combat vehicles,
    military supply trucks, and four strategic drones belonging to the Rapid Support
    Forces in the past two weeks. (Sudan Tribune) (AA)
  - Russo-Ukrainian war (2022–present)
  - Dismissal of Mykhailo Fedorov
  - Protests take place in Kyiv and other cities across Ukraine against the decision
    by President Volodymyr Zelenskyy to replace Minister of Defense Mykhailo Fedorov
    with Major-General Yevhenii Khmara. (BBC) (Reuters)
  - Pavlo Yelizarov, the Deputy Commander of the Ukrainian Air Force, resigns from
    his position in protest of Fedorov's removal as Minister of Defense, calling the
    decision a "great evil for the country's defence capability". (BBC)
  - Eleven people are killed and 19 more injured in a fire at a care facility in Algiers,
    Algeria. (BBC News)
  - Six members of a family are killed after a fire engulfed their house in Khyber
    Pakhtunkhwa Province, Pakistan. (Xinhua)
  - 2026 Ebola epidemic
  - The Ugandan Health Ministry reports that Uganda has discharged its last patient
    diagnosed with Ebola, triggering a 42-day countdown clock on when it can be declared
    free of the virus. (Reuters)
  - 2026 United States cyclosporiasis outbreak
  - The The Washington Post links the Taylor Farms iceberg lettuce supplied to Taco
    Bell as a source of the current cyclosporiasis outbreak in the United States,
    which is caused by cyclospora cayetanensis. (The Washington Post) (Reuters)
  - The Michigan Department of Health and Human Services reports that the amount of
    hospitalizations in Michigan linked to the cyclosporiasis outbreak has surpassed
    more than 100 people. (ABC News)
  - Former Autostrade per l'Italia (ASPI) CEO Giovanni Castellucci is convicted and
    sentenced to 12 years in prison for his role in the 2018 collapse of the Ponte
    Morandi in Genoa, Liguria, Italy, which killed 43 people. (ANSA) (TrasportoEuropa)
