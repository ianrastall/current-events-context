Source_URI: Portal:Current events/2026 July 9
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on Bahrain
  - Bahrain's interior ministry announces on X that air raid sirens sound in the country.
    (AFP via Gulf News)
  - 2026 Iranian strikes on Jordan
  - The Islamic Revolutionary Guard Corps Aerospace Force fires 10 ballistic missiles
    at the Al-Azraq air base in Jordan. (AA)
  - 2026 Iranian strikes on Kuwait
  - The Kuwaiti General Staff of the Army reports that Kuwait air defenses has intercepted
    "hostile missile and drone attacks" on the country. (AFP via The Times of Israel)
  - 2026 Iranian strikes on Qatar
  - Qatar is attacked by projectiles from Iran. (Al Jazeera)
  - Israeli defence minister Israel Katz says that Israel is ready to launch further
    strikes against Iran if necessary. (Armen Press)
  - Gaza war
  - The Israel military says that Islamic Jihad commander 'Rashid al-Qadhi', who was
    allegedly in charge of the organization's weapon production division, was killed
    in a airstrike in the southern Gaza Strip. Additionally, Hamas sniper Abdullah
    Baha al-Din Razak al-Souti is said to have been killed in a separate strike in
    the northern part of Gaza, both despite the ongoing ceasefire. (The Times of Israel)
    (The Jerusalem Post)
  - Sudanese civil war
  - Kordofan campaign
  - Siege of El Obeid
  - The European Parliament votes 476-28 with 96 abstentions to adopt a resolution
    calling on the European Union to designate the Rapid Support Forces as a terrorist
    organization and impose sanctions on individuals responsible for attacks on civilians
    in El-Obeid, North Kordofan. (Sudan Tribune)
  - War crimes during the Sudanese civil war
  - Officials with the International Criminal Court says that a "breakthrough" has
    been made into investigations of war crimes in the Darfur region during the ongoing
    civil war in Sudan. (Middle East Eye)
  - Sudanese Prime Minister Kamil Idris and African Union (AU) envoy to Sudan Mohamed
    Belaiche hold talks in Khartoum to discuss efforts to achieve peace and stability
    in the country and coordinate initiatives for a ceasefire to end the civil war.
    (AA)
  - Mali War
  - 2026 Mali offensives
  - The Azawad Liberation Front attacks a convoy carrying Malian soldiers and Russian
    Africa Corps fighters near Anéfis, Kidal Region. Security sources say Niger provided
    air support during the attack. (Reuters)
  - Economic impact of the 2026 Iran war
  - QatarEnergy pauses efforts to restore liquefied natural gas (LNG) production at
    the Ras Laffan gas facility after an attack on an LNG carrier in the Strait of
    Hormuz, choosing to keep its operations at a minimum. (AA)
  - Huiteng Shoes Factory Fire
  - Twenty-eight people are killed after a fire at a shoe factory in Jinjiang, Fujian,
    China. (AFP via France 24) (Xinhua)
  - Five members of a family are killed in an apartment fire caused by a gas leak
    in Giza, Egypt. (Xinhua)
  - At least four people are killed in a building collapse in New Delhi, India, due
    to rains related to the monsoon season. (Reuters)
  - Gen Z protests
  - Tanzanian police arrest 130 people for allegedly encouraging criminal activity
    after home affairs minister Hamad Masauni banned political rallies and deployed
    security forces to prevent planned protests seeking democratic reforms and accountability
    for election-related deaths. (Reuters)
  - Terrorism in the United States
  - The U.S. Department of Justice announces that a federal grand jury has indicted
    eight men over an alleged plot to attack the UFC Freedom 250 event at the White
    House in Washington, D.C. last month. (Reuters)
  - Impact of the 2026 Iran war on Iran
  - State funeral of Ali Khamenei
  - The final stage of former Iranian supreme leader Ayatollah Ali Khamenei's state
    funeral begins in his hometown of Mashhad after previously being delayed by an
    hour in which Iran said U.S. forces struck a railway bridge northeast in the country
    en-route to the funeral. (The New York Times)
  - Khamenei's body arrives in the Imam Reza shrine for his burial. (Al-Monitor)
  - Thousands of people protest in Budapest, Hungary, against the attempt by prime
    minister Péter Magyar to oust president Tamás Sulyok, whom Magyar accuses of failing
    to "live up" to his role by not opposing what he calls antidemocratic measures
    by former prime minister Viktor Orbán. (AP)
  - Senegal's Constitutional Council strikes down a parliamentary bill that would
    expand the powers of the National Assembly and prime minister while limiting presidential
    authority, after president Bassirou Diomaye Faye challenges the measure. (AFP
    via Indo Premier)
