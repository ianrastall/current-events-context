  - Yemeni civil war
  - The Houthi-led government accuses Saudi Arabia of an airstrike on a runway at
    Sanaa International Airport in Houthi-controlled Yemen, which Yemen's internationally-recognized
    government says was to stop an Iranian Mahan Air flight that was returning the
    Houthi delegation from the funeral of Ali Khamenei. (AP via The Hill)
  - Yemen's internationally-recognized government orders all airports closed after
    striking Houthi-controlled Sanaa airport to prevent an Iranian plane from landing.
