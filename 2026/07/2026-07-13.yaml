wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Kuwait
    - Iran's Islamic Revolutionary Guard Corps (IRGC) says that they have hit Patriot
      air defense systems at the Ali Al Salem Air Base and the FPS radar system at
      Ahmad al-Jaber Air Base in Kuwait. (AA) (Al Jazeera)
    - 2026 Iranian strikes on Bahrain, 2026 Iranian strikes on Jordan
    - The IRGC says that they have hit the Sheikh Isa Air Base in Bahrain and the
      Prince Hassan Air Base in Jordan as part of a second wave of retaliatory strikes
      against the United States. (Middle East Eye)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - U.S. president Donald Trump announces that the naval blockade will resume beginning
      tomorrow and announces a 20% fee on ships transiting the Strait of Hormuz. (Khaleej
      Times) (CNN)
    - The U.S. military says that they have launched a new round of strikes after
      Trump said the U.S. Navy would reinstate the blockade. (The Hill)
    - The South Korean government reports that the Panama-flagged cargo vessel HMM
      Namu has completed repairs in Dubai after it was damaged in a missile attack
      in the Strait of Hormuz on May 4. However, the vessel is unlikely to resume
      commercial operations immediately amid renewed tensions in the region. (SBS)
      (Korea JoongAng Daily)
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war, Qatar as a mediator in conflict
    - Iranian foreign ministry spokesperson Esmaeil Baghaei says that Pakistan and
      Qatar will continue talks to prevent further escalation in the war. (Arab News
      PK)
    - Casualties of the 2026 Iran war
    - The United States Central Command reports that a navy pilot was killed during
      a helicopter crash on July 1 in the Arabian Sea, bringing the death toll of
      American soldiers killed in the Iran war to 14. Additionally, the total amount
      of wounded troops rise to above 400 including from traumatic brain injuries.
      (AP)
    - According to Mehr News Agency, Khuzestan deputy governor Valiollah Hayati says
      that a security guard was killed in a U.S. strike on a water pumping station
      in Bandar Mahshahr, Iran. (AA)
    - Trump reportedly notifies U.S. Congress that the war has resumed, giving his
      administration another 60-day clock without congressional approval. (Politico)
      (The Hill)
    - Yemeni civil war
    - The Houthi-led government accuses Saudi Arabia of an airstrike on a runway at
      Sanaa International Airport in Houthi-controlled Yemen, which Yemen's internationally
      recognized government says was to stop an Iranian Mahan Air flight that was
      returning the Houthi delegation from the funeral of Ali Khamenei. (AP via The
      Hill)
    - Yemen's internationally-recognized government orders all airports closed after
      striking Houthi-controlled Sanaa airport to prevent an Iranian plane from landing.
      The Houthis say the aircraft landed, while the Saudi-led coalition controls
      airspace clearances. (AFP via The Times of Israel)
    - Yemen's Houthis say they have targeted Abha International Airport in Asir, Saudi
      Arabia, with ballistic missiles and drones, calling the attack retaliation for
      strikes on Sanaa airport that they blame on Saudi Arabia, though Yemen's internationally-recognized
      government claims responsibility. (AFP via The Times of Israel)
    - Sudanese civil war
    - Kordofan campaign
    - The Sudanese Army says that it has downed another Chinese-made FH-95 drone near
      El-Obeid in North Kordofan, making it the fourth drone downed by the army. (AA)
    - Naxalite–Maoist insurgency
    - Ravindra Ganjhu, a CPI (Maoist) top wanted leader, is confirmed to have been
      arrested by Jharkhand police in Latehar, India during an anti-Maoist operation.
      (The New Indian Express)
    - Archaeology of ancient Egypt
    - A Ramesside period tomb that belonged to Theban mayor Paser is discovered in
      the Theban Necropolis in Egypt. (Tech Times)
    - Red Sea crisis
    - Danish shipping company Maersk announces that they will resume services through
      the Red Sea for its WAF6 service. (Reuters)
    - 2026 Bangkok pub fire
    - A fire breaks out at a pub in Chatuchak, Bangkok, Thailand, killing 27 people
      and wounding 63 more. (AP)
    - South Korea's navy recovers the body of a sailor who disappeared during a patrol
      near the Northern Limit Line, after South Korea requested North Korean assistance
      and launched a search involving ships and aircraft. (AFP via The Star)
    - 2026 Ebola epidemic
    - The University of Oxford begins the first human trial of its ChAdOx1 BDBV vaccine
      for the Bundibugyo strain of the ebolavirus. (Reuters)
    - The United States says that they will block citizens of the Democratic Republic
      of the Congo from traveling to the country on commercial flights amidst the
      ongoing Ebola outbreak in the country. (Reuters)
    - 2026 United States cyclosporiasis outbreak
    - A cyclosporiasis outbreak, caused by cyclospora cayetanensis, is reported in
      31 U.S. states by the Centers for Disease Control and Prevention, with the Michigan
      Department of Health and Human Services reporting 2,640 cases in the state.
      (NBC News)
    - Sudan's Khartoum State government reports a shortage in drinking water in neighborhoods
      in the state including southern Omdurman after a sharp drop is reported in the
      water levels on the Nile River. (Sudan Tribune)
    - Iran–United Kingdom relations
    - The United Kingdom announces that it will designate Iran's Islamic Revolutionary
      Guards Corps as a terrorist organization, and will ban support for the militia
      group. (The Guardian) (NBC News)
    - Sudan–European Union relations
    - The European Union imposes sanctions against Sudan's gold trade, accusing them
      of financing the civil war in the country. (Mining.com) (Reuters)
    - Protests against the Russo-Ukrainian war
    - Anti-war protests in Russia
    - Russian anti-war politician Boris Nadezhdin is detained over a video on his
      social media account featuring the late opposition leader Alexei Navalny, days
      after he was designated a "foreign agent". He is later released from a police
      station and will appear in court on July 17. (Kyiv Independent) (The Moscow
      Times) (Reuters)
    - Regime change efforts in the 2026 Iran war
    - The New York Times reports that former Iranian president Mahmoud Ahmadinejad
      is under house arrest after Iranian authorities reportedly uncovered a significant
      portion of his contacts with Israel. However, his office denies these reports,
      including reports that Israel recruited him for regime changing plans. (Iran
      International) (The Jerusalem Post)
    - 119th United States Congress
    - South Carolina governor Henry McMaster appoints Darline Graham Nordone to temporarily
      fill the U.S. Senate seat of her brother, Lindsey Graham, after his death last
      Saturday, with the term ending in 2027. (Axios) (BBC News)
    - Magyar Government
    - The Hungarian parliament moves to remove president Tamás Sulyok through a constitutional
      amendment backed by prime minister Péter Magyar's majority government. (AP)
      (Bloomberg via The Japan Times)
    - Venezuelan acting president Delcy Rodríguez appoints U.S. envoy Félix Plasencia
      to a foreign relations and overseas trade post, replacing foreign minister Yván
      Gil, who becomes science and technology minister. (Reuters)
    - Astronomers announce that an erythrulose molecule was detected inside a cloud
      of gas and dust near the center of the Milky Way. It is the first evidence of
      sugar in interstellar space. (Nature)
