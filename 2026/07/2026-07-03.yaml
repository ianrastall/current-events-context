wikipedia:
  categories:
    Uncategorized:
    - Russo-Ukrainian war
    - Russian attacks on civilians in the Russo-Ukrainian war
    - Kyiv strikes
    - Ukraine declares a day of mourning for the victims of the Russian bombardment
      of Kyiv on July 2 as the death toll rises to 30. (DW)
    - Russian missile and drone strikes kill at least five people and injure ten others
      across Ukraine, including three people in Sumy when a drone struck their apartment
      building. (Al Jazeera)
    - Crimea attacks
    - Ukrainian forces strike nine substations across Russian-occupied Crimea causing
      power outages. Saky air base and Gvardeyskoye air base are also targeted with
      seven jets destroyed or damaged. (The New Voice of Ukraine) (Reuters)
    - Eastern front of the Russo-Ukrainian war
    - Russia reports that its forces have captured the eastern Ukrainian city of Kostyantynivka,
      Donetsk Oblast. (AFP via NDTV)
    - Sudanese civil war
    - Kordofan campaign, Siege of El Obeid
    - United Nations human rights chief Volker Türk issues a "red alert" warning in
      El-Obeid, North Kordofan, Sudan, of a "catastrophe" and violence in the city.
      (ABC News) (ModernGhana)
    - Sudanese foreign minister Mohi El-Din Salem says that the Sudanese government
      is ready to engage in "sincere initiatives" aimed at ending the civil war that
      started in April 2023. He also says that initiatives submitted by Sovereign
      Council chairman and military head Abdel Fattah al-Burhan to the United Nations
      last year must be a part of this process. (AA)
    - Gaza war
    - The Israeli military and Shin Bet state that Hamas militant Muhammad Na'im Jandiya,
      who allegedly took part in taking hostages during the attack on the Nahal Oz
      kibbutz in the October 7 attacks on Israel, has been killed in an airstrike
      in the northern Gaza Strip, violating the ongoing ceasefire. (The Jerusalem
      Post) (Ynetnews)
    - Insurgency in Khyber Pakhtunkhwa
    - Two policemen, including an additional station house officer, are killed, while
      a driver is injured, as gunmen open fire on a mobile patrol vehicle in Mohmand
      District, Khyber Pakhtunkhwa, Pakistan. (Dawn)
    - In Pakistan, a bus en route from Quetta to Islamabad plunges into a deep roadside
      ditch in Sherani District, Balochistan, killing 40 people and injuring eight
      others. (Reuters)
    - Four people are killed, ten are missing and eight others are injured during
      the collision of a car with a bus, carrying Afghan refugees returning from Pakistan,
      on the Kabul–Nangarhar highway in Laghman Province, Afghanistan. (Caliber.az)
      (Pajhwok)
    - 2026 heat waves
    - 2026 European heatwaves
    - Health officials in Belgium report a 39% increase of deaths, compared to the
      week prior, from heat waves in the country during June, while France saw a 29.1%
      increase. (Euronews)
    - The French health agency reports that over 2,025 people in France have died
      in heat waves last month between June 22 and June 28. (Le Monde)
    - 2026 North American heat wave
    - Heat waves are reported across the eastern and central United States, with 23
      states placed under heat warnings by the National Weather Service. (Reuters)
      (The New York Times) (KGW)
    - Impact of the 2026 Iran war on Iran
    - State funeral of Ali Khamenei
    - The state funeral of former Iranian supreme leader Ali Khamenei, who was killed
      in an airstrike on his compound by Israel and the United States during the first
      day of the Iran war on February 28, begins as his body lies in state at Tehran's
      Grand Mosalla. The funeral is expected to draw millions of attendees, including
      foreign dignitaries. (AFP via France 24) (The Guardian) (The New York Times)
      (Reuters)
    - Armenia's parliament passes a law requiring citizens living abroad to meet stricter
      residency rules before voting, following reports of Russian efforts to influence
      the June election through Armenians living in Russia. (Reuters)
    - The Royal Palace of Cambodia confirms that King Norodom Sihamoni has returned
      to the country from Beijing, China, after undergoing treatment and surgery for
      prostate cancer. (AFP via The Straits Times)
    - Moldovan prime minister Alexandru Munteanu resigns. (Politico)
    - 2026 FIFA World Cup
    - Egypt at the FIFA World Cup
    - In association football, Egypt advances to the round of 16 of a FIFA World Cup
      for the first time after defeating Australia 4–2 on penalties, following a 1–1
      draw after extra time, in the round of 32. (RFI)
    - Argentina at the FIFA World Cup
    - Argentine forward and captain Lionel Messi becomes the first player to make
      30 FIFA World Cup appearances, score 20 World Cup goals, and score in eight
      consecutive World Cup matches (including the previous edition), after scoring
      in the team's 3–2 victory against Cape Verde in the round of 32. (AP) (ESPN)
