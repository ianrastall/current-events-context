Date: '2026-07-03'
Source_URI: Portal:Current events/2026 July 3
Intelligence_Payload:
  Uncategorized:
  - Russo-Ukrainian war
  - Russian attacks on civilians in the Russo-Ukrainian war
  - Kyiv strikes
  - Ukraine declares a day of mourning for the victims of the Russian bombardment
    of Kyiv on July 2 as the death toll rises to 30. (DW)
  - Russian missile and drone strikes kill at least five people and wound ten others
    across Ukraine, including three people in Sumy when a drone struck their apartment
    building. (Al Jazeera)
  - Crimea attacks
  - Ukrainian forces strike nine substations across Russian-occupied Crimea causing
    power outages as part of a campaign to make the peninsula "unusable" for the Russian
    military. Saky air base and Gvardeyskoye air base are also targeted with seven
    jets destroyed or damaged. (The New Voice of Ukraine) (Reuters)
  - Sudanese civil war
  - Kordofan campaign, Siege of El Obeid
  - United Nations human rights chief Volker Türk issues a "red alert" warning in
    El-Obeid, North Kordofan, Sudan, of an "catastrophe" and violence in the city.
    (ABC News) (ModernGhana)
  - Sudanese Foreign Minister Mohi El-Din Salem says that the Sudanese government
    is ready to engage in "sincere initiatives" aimed at ending the civil war that
    started in April 2023. He also says that initiatives set by Sovereign Council
    chairman and SAF head Abdel Fattah al-Burhan to the UN last year. (AA)
  - Gaza war
  - The Israeli military and Shin Bet state that Hamas militant Muhammad Na'im Jandiya,
    who allegedly took part in taking hostages during the attack on the Nahal Oz kibbutz
    in the October 7 attacks on Israel, has been killed in an airstrike in the northern
    Gaza Strip, violating the ongoing ceasefire. (The Jerusalem Post) (Ynetnews)
  - In Pakistan, a bus en route from Quetta to Islamabad plunges into a deep roadside
    ditch in Sherani District, Balochistan, killing 40 people and injuring eight others.
    (Reuters)
  - Four people are killed, ten are missing and eight more injured during the collision
    of a car with a bus, carrying Afghan refugees returning from Pakistan, on the
    Kabul–Nangarhar highway in Laghman Province, Afghanistan. (Caliber.az) (Pajhwok)
  - 2026 heat waves
