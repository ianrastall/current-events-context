  - 2026 European heatwaves
  - Health officials in Belgium report a 39% increase of deaths, compared to the week
    prior, from heat waves in the country during June, while France saw a 29.1% increase.
    (Euronews)
  - Impact of the 2026 Iran war on Iran
  - State funeral of Ali Khamenei
