wikipedia:
  categories:
    Uncategorized:
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - Oman reaches an agreement with France and the United Kingdom to ensure safe
      navigation through the country's waterways including the Gulf of Oman and Strait
      of Hormuz. (CNBC)
    - Mali War
    - 2026 Mali offensives
    - The Al-Qaeda-linked Jama'at Nusrat al-Islam wal-Muslimin and Tuareg Azawad Liberation
      Front separatists launch coordinated attacks on the Malian communes and towns
      of Aguelhok, Anéfis, Gao, and Sévaré. The Malian army says it has repelled the
      assaults, while local sources report continuing fighting. (AFP via France 24)
    - Russo-Ukrainian war
    - Battle of Kostiantynivka
    - Ukrainian president Volodymyr Zelenskyy and the General Staff of the Ukrainian
      Armed Forces deny Russia's claim that it captured Kostiantynivka, Donetsk Oblast,
      yesterday, saying Ukrainian forces still control the city and continue defensive
      operations there. (Reuters)
    - Yemeni civil war
    - Over 50 Houthi fighters and 16 soldiers are killed during clashes in Hodeidah,
      Yemen. Twenty-two more soldiers are also wounded. (Al Jazeera)
    - United States Semiquincentennial
    - The United States celebrates the 250th anniversary of the ratification of the
      U.S. Declaration of Independence in 1776. (BBC News)
    - Nine people are killed and eight others injured after a minibus collides with
      a truck between and Nechayane, Mykolaiv Oblast, Ukraine. (Xinhua)
    - China–United States relations
    - China releases pastor Jin Mingri, the founder of the Beijing Zion Church, after
      detaining him since October, with ChinaAid.org saying officials presented the
      release as a goodwill gesture following U.S. president Donald Trump's visit
      to China last May. (AFP via New Straits Times)
    - Moldova–Russia relations
    - A Russian cultural center in Chișinău, Moldova, closes after the government
      orders its shutdown, citing security concerns linked to Russian influence and
      drone incidents amid strained bilateral relations. (Reuters)
    - 2026 Slovak referendum
    - Slovaks vote in a referendum to decide whether to cancel life payments for prime
      ministers after their terms expire and whether to reopen the office of an anti-corruption
      agency. The referendum is invalidated due to low turnout. (AP)
    - 2026 Wimbledon Championships
    - In tennis, Alexandra Eala becomes the first Filipino singles player to reach
      the fourth round of a major tournament after defeating defending champion Iga
      Świątek in the third round of the Wimbledon Championships women's singles. (AP)
