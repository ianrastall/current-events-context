  - Morocco–Spain relations
  - 2026 Morocco–Spain border incident
  - Ceutan mayor-president Juan Jesús Vivas says that around 60,000 undocumented migrants
    have entered the Spanish exclave in North Africa in the last 24 hours, as the
    death toll rises to 57. (The Guardian) (BBC News)
  - Videos on social media appear to show the Spanish Army deploying military vehicles
