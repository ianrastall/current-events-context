wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - United States Secretary of State Marco Rubio says that diplomatic solutions
      are "still on the table" if Iran ceases attacks in the Strait of Hormuz. (The
      Jerusalem Post)
    - Iraq in the 2026 Iran war
    - 2026 Iranian strikes on the Kurdistan Region
    - The Kurdistan Freedom Party reports that eight Iranian Kurdish rebels have been
      wounded after a drone strike from Iran hit a camp near Erbil, Kurdistan Region,
      Iraq. (AFP via Arab News)
    - The United States Central Command (CENTCOM) announces that an American service
      member has been killed in northern Iraq during a "controlled" detonation of
      a downed Iranian drone, bringing the total amount of American casualties to
      17. (The Hill) (Reuters)
    - 2026 Iranian strikes on Jordan
    - The Israeli military uses the Iron Dome to shoot down fragments from an Iranian
      missile fired at Aqaba, Jordan, after the Aegis was reportedly used to shoot
      down the missile. (The Jerusalem Post) (The Times of Israel)
    - July 2026 United States strikes against Iran
    - The U.S. CENTCOM launches strikes against Iran for a ninth consecutive evening
      amidst a rise in American casualties. (CNBC) (The Kabul Tribune)
    - Aftermath of the Syrian civil war
    - SDF–Syrian transitional government clashes
    - The Syrian Observatory for Human Rights reports that 530 people, including 76
      civilians, have been killed in clashes between the post-Assad Syrian Army and
      the Syrian Democratic Forces over the past months. (Shafaq)
    - Mali War
    - 2026 Mali offensives
    - Around 50 Malian soldiers are reported to have been killed in Anéfis, Mali,
      by the Al-Qaeda-linked Jama'at Nusrat al-Islam wal-Muslimin and Tuareg Azawad
      Liberation Front rebels. (The Hindu) (The News Pakistan)
    - Russo-Ukrainian war
    - Odesa strikes
    - Ukrainian officials say Russian forces struck a Guinea-Bissau-flagged cargo
      ship carrying corn off Odesa, killing ten crew members from India and Syria.
      Eight others are rescued, while the vessel continues burning. (Al Jazeera)
    - 2026 Huancayo earthquake
    - At least six people are killed and 21 others are injured when a earthquake strikes
      the town of Pumpunya in Chongos Bajo District, Chupaca province, Department
      of Junín, Peru. (Reuters) (notiPerú) (El Comercio Perú)
    - Four people are killed, four others are unaccounted for, and several houses
      are swept away after a landslide triggered by heavy rainfall hits Mon District,
      Nagaland, India. (NDTV)
    - Sixty-seven people are rescued and 66 others are reported missing when passenger
      ferry MV Barima capsizes and sinks near the Pomeroon River in Guyana. (AP)
    - 2026 Ebola epidemic
    - Canada bars foreign nationals who have visited the Democratic Republic of the
      Congo within the previous 21 days, citing the Ebola epidemic. (Reuters)
    - 2026 Delhi Jantar Mantar protests
    - Students hold protests in several cities across India after activist Sonam Wangchuk
      is arrested and taken to a hospital during his hunger strike calling for education
      minister Dharmendra Pradhan's resignation over the 2026 NEET exam paper leak,
      with a march on Parliament planned for the following day. (Al Jazeera) (Financial
      Express)
    - 2026 São Toméan presidential election
    - Santomeans vote to elect the country's president. Incumbent president Carlos
      Vila Nova seeks a second term in office. (Reuters)
    - 2026 Esports World Cup
    - League of Legends in esports
    - In esports, Dplus KIA defeats Karmine Corp 3–0 to win the League of Legends
      title at the 2026 Esports World Cup, extending South Korea's winning streak
      to three years and securing its first international title since 2020. (DAZN)
    - 2026 FIFA World Cup
    - 2026 FIFA World Cup final
    - In association football, Spain win their second FIFA World Cup title after defeating
      the defending champions Argentina 1–0 after extra time in the final held at
      MetLife Stadium in East Rutherford, New Jersey, United States. Spain's captain
      Rodri is awarded the Golden Ball. (France 24) (Yahoo! Sports)
    - Spain at the FIFA World Cup
    - After winning the 2026 FIFA World Cup, Spain becomes the first country to hold
      both the men's and women's World Cups, having won the latter in 2023. The men's
      team extends their international football record of 38 consecutive unbeaten
      matches, surpassing Italy's record of 37. It also becomes the first team to
      field two teenagers, Lamine Yamal and Pau Cubarsí, both 19-year-olds, in a FIFA
      World Cup final. (NPR) (Reuters) (FOX Sports)
    - Spanish manager Luis de la Fuente also becomes the oldest manager to win a World
      Cup title at 65 years old. (Reuters)
    - AI boom
    - Mathematician and Anthropic employee Levent Alpöge presents an explicit counterexample
      to the Jacobian conjecture in three-dimensional space that disproves the -variable
      conjecture for using the large language model Fable 5. The Jacobian conjecture
      for remains true. (VNexpress) (NewScientist)
