wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Gaza war
    - Mass detentions in the Gaza war
    - Palestinian media reports that Israel has released 60 Gazan detainees back to
      the Gaza Strip. (The Times of Israel)
    - The Israel Defense Forces (IDF) and Shin Bet state that Hamas' internal security
      head Wael Musa Khaled Ladawi was killed in a airstrike in the Deir al-Balah
      area of the central Gaza Strip, in violation of the ongoing ceasefire. (The
      Jewish Chronicle)
    - The IDF claim that Palestinian Islamic Jihad Nukhba militant Amro Abu Alrish
      and Hamas commander Abd Al-Nasser Al-Aziz Maqadmeh were killed in separate strikes
      in Gaza, which violated the ongoing ceasefire. (The Jerusalem Post)
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - Iran and the United States pause strikes as the U.S. allows additional time
      for negotiations and Iran suspends retaliatory attacks against U.S. allies.
      (AFP via The Manila Times)
    - Saudi Arabia in the 2026 Iran war
    - Saudi Arabia's defense ministry reports intercepting drones fired by Iran-backed
      Iraqi militias from inside Iraq, which targeted oil facilities in eastern Saudi
      Arabia and the Riyadh area. (France 24)
    - Yemeni civil war
    - Houthi–Saudi Arabian conflict, Saudi-led intervention in the Yemeni civil war
    - The Houthis launch a drone attack that damages the Abqaiq oil field in eastern
      Saudi Arabia. (BBC Persian) (France 24)
    - Sudanese civil war
    - Kordofan campaign
    - Siege of El Obeid
    - Drone strikes are reported in El-Obeid, North Kordofan, Sudan, hours after the
      Sudanese Armed Forces (SAF) secured the National Export Highway, which connects
      Sudan's capital Khartoum and North Kordofan. (AFP via France 24) (The Defense
      Post)
    - The Sudanese Doctors Network reports that the main hospital in Jebrat al Sheikh
      District, North Kordofan, has been looted and turned into a military barracks.
      (Sudan Tribune)
    - SAF general and leader Abdel Fattah al-Burhan visits the newly captured areas
      in North Kordofan alongside Sudan Shield Forces leader Abu Aqla Kaikal and Darfur
      Governor Minni Arko Minnawi. (Sudan Tribune)
    - The Sudanese National Mine Action Center (NMAC) reports that 80% of war remnants
      have been removed from the Khartoum State and announces plans to expand survey
      and removal operations in Sudanese areas recently recaptured by the SAF. (Sudan
      Tribune in Arabic)
    - UNESCO designates the Amazon Theatre and Theatro da Paz, opera houses in the
      Amazonia region of Brazil, as World Heritage Sites. (AP)
    - Canada–United States relations
    - 2025–2026 United States trade war with Canada and Mexico
    - The Gordie Howe International Bridge, which connects between Detroit, Michigan,
      U.S., and Windsor, Ontario, Canada, officially opens to traffic after months
      of delay due to the countries' trade war and the U.S. imposition of tariffs
      on Canada. (Detroit Free Press) (Global News)
    - Economic impact of the 2026 Iran war
    - Singapore's monetary authority tightens its monetary policy for the second time
      in three months by increasing the Singapore dollar's appreciation rate against
      a trade-weighted currency basket, citing rising import costs and inflation risks
      caused by the Iran war. (AFP via South China Morning Post)
    - Wildfires in 2026
    - 2026 France wildfires
    - Wildfires continue in the Gironde region near Bordeaux, France, as president
      Emmanuel Macron describes it as "the worst fire-related crisis since World War
      II." (AP)
    - 2026 Pacific hurricane season
    - Hurricane Genevieve strengthens into a category 5 pacific hurricane, the first
      in the Pacific region since 2024. (The Independent)
    - The death toll from heavy rains and flooding in Pakistan since June increases
      to 107 people killed and at least 344 others injured. (Al Jazeera)
    - A landslide occurs at the Gold Ridge Mine in Guadalcanal, Solomon Islands. Local
      media reports ten bodies recovered, while the National Referral Hospital says
      it expects more fatalities. (AFP via BSS)
    - Sudanese cholera epidemic
    - The General Coordination for Refugees and Displaced Persons in Darfur, Sudan,
      reports seven cholera cases across the region in displacement camps between
      July 5 and July 25. (Sudan Tribune)
    - The U.S. Food and Drug Administration approves a new blood test for colorectal
      cancer screenings in older adults, including those above age 45. (Reuters) (MedPage
      Today)
    - Brazil–Lithuania relations
    - The Lithuanian government registers a resolution to open an embassy in Brasilia,
      Brazil, in October. The country currently has a consulate-general in São Paulo.
      (LRT)
    - Kuwait–Pakistan relations
    - Kuwait approves the Kuwait–Pakistan Defence Cooperation Agreement, a five-year
      framework for defence cooperation between the two countries covering military
      training, exchanges, defence technology, logistics, and cooperation between
      their armed forces. (Anadolu Ajansı) (Jordan News)
    - Romania–Russia relations, Violations of non-combatant airspace during the Russo-Ukrainian
      war
    - Romania recalls its ambassador to Russia, declares a Russian embassy employee
      persona non grata, and summons Russia's ambassador after three Russian drones
      violated Romanian airspace between July 24 and 26. (Xinhua)
    - Chad states its intention to withdraw from the International Criminal Court,
      citing limited effectiveness and disproportionate attention to African cases.
      (AFP via Courthouse News Service)
    - The Seoul Central District Court gives former South Korean president Yoon Suk
      Yeol an 18-month suspended sentence for false statements made during his 2022
      election campaign. If upheld, the ruling may void his victory and require Yoon's
      People Power Party to repay campaign funds. (AFP via The Japan Times)
    - Five people are killed and another is injured in a home invasion and shooting
      in Gugulethu, Cape Town, South Africa. (News24)
    - Three women are wounded in a mass stabbing near the Porte de Clichy station
      in Paris, France. The perpetrator is detained. (Reuters) (The Telegraph)
    - Politics of Nicaragua
    - Nicaraguan co-president Rosario Murillo announces that a legislative vote on
      a proposed constitutional reform that would exclude opposition parties from
      future elections has been postponed until September. (AFP via GMA News Online)
