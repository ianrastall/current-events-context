Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - Saudi Arabia in the 2026 Iran war
  - Saudi Arabia's defense ministry reports intercepting drones fired by Iraqi militias
    backed by Iran from inside Iraq, which targeted oil facilities in eastern Saudi
    Arabia and the Riyadh area. (France24)
  - Yemeni civil war
  - Houthi–Saudi Arabian conflict, Saudi-led intervention in the Yemeni civil war
  - The Houthis launch a drone attack that damages the Saudi Abqaiq oil field in the
    Eastern Province. (BBC Persian) (France24)
  - Sudanese civil war
  - Kordofan campaign
  - Siege of El Obeid
  - Drone strikes are reported in El-Obeid, North Kordofan, Sudan, hours after the
    Sudanese Armed Forces (SAF) secured the National Export Highway which connects
    Sudan's capital Khartoum and North Kordofan. (France24) (The Defense Post)
  - The Sudanese Doctors Network reports that the main hospital in the Jebrat al Sheikh
    District of North Kordofan has been looted and turned into a military barrack.
    (Sudan Tribune)
  - SAF general and leader Abdel Fattah al-Burhan visits the newly captured areas
    in North Kordofan alongside Sudan Shield Forces leader Abu Aqla Kaikal and Darfur
    Governor Minni Arko Minnawi. (Sudan Tribune)
  - Canada–United States relations
  - The Gordie Howe International Bridge, which connects between Detroit, Michigan,
    U.S., and Windsor, Ontario, Canada, officially opens to traffic after months of
    delay including the trade war and tariffs. (Detroit Free Press) (Global News)
  - The Windsor–Detroit Bridge Authority reports that the family of the late Detroit
    Red Wings hockey player Gordie Howe are the first to cross the bridge. (CTV News)
    (CBC)
  - Wildfires in 2026
  - 2026 France wildfires
  - Wildfires continue in the Gironde region near Bordeaux, France, as president Emmanuel
    Macron describes as "France's worst fire-related crisis since World War II." (AP)
  - The death toll from heavy rains and flooding in Pakistan since June increases
    to 107 people killed and at least 344 others injured. (Al Jazeera)
  - Brazil–Lithuania relations
  - The Lithuanian government registers a resolution to open an embassy in Brasilia,
    Brazil, in October. The country currently has a consulate-general in São Paulo.
    (LRT.lt)
  - Romania–Russia relations, Violations of non-combatant airspace during the Russo-Ukrainian
    war
  - Romania recalls its ambassador to Russia, declares a Russian embassy employee
    persona non grata, and summons Russia's ambassador after three Russian drones
    violated Romanian airspace between July 24 and 26. (Xinhua)
  - Chad states its intention to withdraw from the International Criminal Court, citing
    limited effectiveness and disproportionate attention to African cases. (AFP via
    Courthouse News Service)
  - Five people are killed and another is injured in a home invasion and shooting
    in Gugulethu, Cape Town, South Africa. (News24)
  - Three women are wounded in a mass stabbing near the Porte de Clichy station in
    Paris, France. The perpetrator is detained. (The Telegraph) (Reuters)
  - Ukraine–United Kingdom relations
  - Ukrainian President Volodymyr Zelenskyy becomes the first foreign leader to visit
    the United Kingdom since the new Prime Minister Andy Burnham took office. The
    two met aboard the HMS Queen Elizabeth, with Burnham reaffirming the UK's support
    for Ukraine in the ongoing Russo-Ukrainian war. (NBC News)
  - Protests against the dismissal of Mykhailo Fedorov
  - Protests continue for the twelfth day in Ukraine calling for the reinstatement
    of Ukrainian Minister of Defence Mykhailo Fedorov. (Kyiv Post)
