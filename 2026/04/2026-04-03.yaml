Date: '2026-04-03'
Source_URI: Portal:Current events/2026 April 3
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on the United Arab Emirates
  - The United Arab Emirates intercepts 18 ballistic missiles, four cruise missiles,
    and 47 drones from Iran. Falling debris from the interception kills one person
    and injures others at the Habshan oil facility in the Abu Dhabi emirate. (Al Jazeera)
    (AFP via Vanguard)
  - 2026 Strait of Hormuz crisis
  - Maltese-flagged CMA CGM Kribi, a container ship registered by French shipping
    company CMA CGM crosses the Strait of Hormuz after departing Dubai, making it
    the first ship from Western Europe to cross the strait since the war started.
    (AFP via France 24) (Euronews)
  - Japanese shipping company Mitsui O.S.K. Lines says that a liquefied natural gas
    (LNG) oil tanker registered in Japan crosses the Strait of Hormuz for the first
    since the outbreak of the Iran war. A third ship also crosses the strait. (Kyodo
    News) (The Guardian)
  - Aviation shootdowns and accidents during the 2026 Iran war
  - Iranian forces shoot down a U.S. F-15E fighter jet in Iranian airspace. U.S. officials
    say a search is underway for the two crew members, one of whom is rescued. Iran's
    state media says a reward will be given to any citizen who helps capture an American
    pilot. (CNN) (Reuters) (The Guardian
  - Two U.S. military helicopters are hit with small arms fire while conducting a
    search and rescue operation for the downed F-15E pilots. (Al Jazeera) (BBC News)
    (New York Post)
  - A U.S. A-10 Warthog crashes near the Strait of Hormuz after being hit by Iranian
    anti-aircraft fire. The pilot ejects and is rescued. (The Guardian) (AA)
  - At least three people are killed in a strike on a residential area in Tehran,
    Iran. (Al Jazeera)
  - The Kyrgyz Ministry of Emergency Situations says that Kyrgyzstan has dispatched
    over 100 tons of humanitarian aid to Iran. The shipment is ordered by Kyrgyz President
    Sadyr Japarov. (Xinhuanet)
  - 2026 Lebanon war
  - The U.S. Embassy in Beirut warns American citizens to leave Lebanon due to the
    situation in the country. (BBC)
  - 2026 Afghanistan–Pakistan conflict
  - Chinese Foreign Ministry spokesperson Mao Ning says that peace talks between the
    Taliban government of Afghanistan and Pakistan are advancing in a effort to end
    the war. (AP)
  - Russo-Ukrainian war
  - Six people are killed and five others, including a child, are injured in Russian
    drone and missile strikes across Ukraine. (DW)
  - Economic impact of the 2026 Iran war
  - Pakistan introduces free public transport in Islamabad and Punjab for one month
    and provides targeted subsidies in other regions to offset the impact of recent
    fuel price increases. (AFP via Philippine Daily Inquirer)
  - 2026 Jorm earthquake
  - A magnitude 5.8 earthquake hits parts of Afghanistan and Pakistan, killing 8 people
    in Afghanistan. (ABC News)
  - Four people are killed when a small plane crashes into a restaurant in Capão da
    Canoa, Rio Grande do Sul, Brazil. (G1 in Portuguese)
  - At least 35 people are injured after a passenger train derails in Ulyanovsk Oblast,
    Russia. (The Moscow Times)
  - Anti-corruption campaign under Xi Jinping
  - The Central Commission for Discipline Inspection of China announces that former
    Party Secretary of Xinjiang Ma Xingrui is under investigation over suspected "serious
    violation of law and discipline", becoming the third member of the Politburo of
    the Chinese Communist Party to be investigated by the commission. (Reuters)
  - 2026 Myanmar presidential election
  - Myanmar's military ruler, General Min Aung Hlaing, is elected president by the
    Electoral College. Min secures 429 votes, against 126 for Nyo Saw and 29 for Nan
    Ni Ni Aye, who become first and second vice presidents, respectively. (AP) (Xinhua)
  - Payment and Control Agency for Guidance and Guarantee Community Aid scandal
  - Greek prime minister Kyriakos Mitsotakis reshuffles his cabinet after several
    officials were implicated in a European Public Prosecutor's Office investigation
    into alleged irregularities in the allocation of European Union farm subsidies.
    (Xinhua)
