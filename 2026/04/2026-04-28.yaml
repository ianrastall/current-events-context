  - COVID-19 pandemic
  - Origin of SARS-CoV-2, COVID-19 lab leak theory
  - The US Department of Justice indicts David Morens, an ex-adviser to the former
    director of the National Institute of Allergy and Infectious Diseases Anthony
    Fauci, for allegedly concealing federal records during the COVID-19 pandemic related
    to the origin of COVID-19. (The Guardian)
  - 2026 Athens shooting
  - Four people are injured in a shooting spree between a social security office and
    a courthouse in Athens, Greece. The 89-year-old suspect fled the scene, but was
    arrested at a bus stop in Patras. (AP) (BBC)
  - Bahrain–Iran relations
  - A Bahraini high court sentences five people, including two Afghans, to life in
    prison for plotting "terrorist and hostile acts" with Iran, while another 25 people
    receive up to ten years for supporting "terrorist acts". (Firstpost)
  - Corruption in South Korea
  - The Seoul High Court sentences former South Korean first lady Kim Keon Hee to
    four years in prison after convicting her of stock price manipulation and bribery,
    overturning her earlier acquittal on market-related charges. (AFP via France 24)
  - Mexican drug war
  - Jalisco New Generation Cartel leader is arrested by the Mexican Army in the western
    state of Nayarit. (BBC) (Reuters)
  - The US Department of Justice indicts former FBI director James Comey on two counts
    for allegedly threatening president Donald Trump on social media. This is the
    second time Comey has been indicted by the DOJ after a previous indictment in
    2025. (NPR)
  - The Swiss Federal Criminal Court dismisses a corruption case against Gulnara Karimova,
    daughter of former Uzbekistan president Islam Karimov. (Financial Times)
  - 2026 Cuban crisis
  - The U.S. Senate blocks resolution by Democrats that would force a vote to limit
    U.S President Donald Trump's powers in launching military action in Cuba. (CBS
