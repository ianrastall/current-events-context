wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon peace talks
    - Three paramedics are killed in an Israeli airstrike in Majdal Zoun, Lebanon,
      while responding to the scene of a previous airstrike against a building, which
      killed two more people. (Al Jazeera)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - 2026 Tuapse oil terminal disaster
    - The Tuapse oil terminal fire in Tuapse, Russia, grows larger following the third
      Ukrainian drone strike on the facility in two weeks. (BBC News)
    - Ukraine reports intercepting more than 33,000 Russian drones in March, the highest
      monthly total since the start of the full-scale invasion. (AP)
    - Colombian conflict
    - 2026 Cauca bombing
    - Colombian police arrest José Vitonco, an alleged guerrilla leader linked to
      FARC dissident leader , in connection with a deadly highway bombing in Cauca
      Department. (AFP via RTHK)
    - Mali War
    - 2026 Mali offensives
    - Malian president and military leader Assimi Goïta meets with Russian ambassador
      to the nation, , marking the former's first public appearance since a rebel
      offensive began three days ago. (Al Jazeera)
    - Mexican drug war
    - A series of clashes between delinquent cells took place in various part of the
      municipality of Tecoanapa, Guerrero. The balance of the violence is unknown,
      but is reported the use of drone bombing and attack against civil infrastructure
      and the reinforcement of government forces in the area. (La Jornada)
    - Economic impact of the 2026 Iran war
    - The United Arab Emirates announces that it is leaving the oil exporter groups
      OPEC and OPEC+. (Reuters)
    - Air India, IndiGo, and SpiceJet inform the Indian government that the country's
      airline industry is on the verge of "stopping operations" because of cost increases
      related to the Strait of Hormuz closure and the Iran war. (Al Jazeera)
    - Seven people are killed and 13 others are injured in a fire at a private construction
      site in Aeroport District, Moscow, Russia. (Xinhua)
    - Three people are killed, one person surives and at least 31-36 others are reported
      missing when a canoe capsizes on a river in Kagadi, Western Region, Uganda.
      (Daily Monitor) (Reuters)
    - COVID-19 pandemic in the United States
    - Origin of SARS-CoV-2, COVID-19 lab leak theory
    - The U.S. justice department indicts David Morens, an ex-adviser to the former
      director of the National Institute of Allergy and Infectious Diseases Anthony
      Fauci, for allegedly concealing federal records during the COVID-19 pandemic
      related to the origin of COVID-19. (The Guardian)
    - Bahrain–Iran relations
    - A Bahraini high court sentences five people, including two Afghans, to life
      in prison for plotting "terrorist and hostile acts" with Iran, while another
      25 people receive up to ten years for supporting "terrorist acts". (Firstpost)
    - Corruption in South Korea
    - The Seoul High Court sentences former South Korean first lady Kim Keon Hee to
      four years in prison after convicting her of stock price manipulation and bribery,
      overturning her earlier acquittal on market-related charges. (AFP via France
      24)
    - Five people are injured in a shooting spree between a social security office
      and a courthouse in Athens, Greece. The 89-year-old suspect fled the scene,
      but was arrested at a bus stop in Patras. (AP) (BBC News)
    - The U.S. Department of Justice (DOJ) indicts former FBI director James Comey
      on two counts for allegedly threatening president Donald Trump on social media.
      This is the second time Comey has been indicted by the DOJ after a previous
      indictment in 2025. (AFP via Arab News) (NPR)
    - The Swiss Federal Criminal Court dismisses a corruption case against Gulnara
      Karimova, daughter of former Uzbek president Islam Karimov. (Financial Times)
    - 2026 Cuban crisis
    - The U.S. Senate blocks a resolution by Democrats that would force a vote to
      limit U.S president Donald Trump's powers in launching military action in Cuba.
      (CBS News) (Reuters)
    - 2026 Kosovan parliamentary election
    - The Kosovan legislature fails to elect a president by the constitutional deadline
      due to insufficient votes, raising the likelihood of early parliamentary elections.
      (AA)
    - 2026 CFL draft
    - In Canadian football, the 70th edition of the CFL draft is held, with the Ottawa
      Redblacks selecting former Purdue Boilermakers offensive lineman Giordano Vaccaro
      with the first overall pick. (Sportsnet)
