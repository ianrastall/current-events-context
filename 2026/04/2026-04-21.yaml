Date: '2026-04-21'
Source_URI: Portal:Current events/2026 April 21
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - United States president Donald Trump announces that the ceasefire will be extended
    so that Iran can make a "unified proposal", upon Pakistani prime minister Shehbaz
    Sharif and field marshal Asim Munir's request. However, Trump also says the blockade
    will remain. (AA) (CNBC) (The Hill)
  - Naval blockade of Iran
  - The U.S. Indo-Pacific Command announces that it stopped and boarded a stateless
    tanker, M/T Tifani, which it says is connected to Iran. (Stars and Stripes)
  - Iranian foreign minister Abbas Araghchi calls the blockade "an act of war" and
    a violation of the ceasefire. (Al Jazeera)
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - Hezbollah fires rockets at Israeli troops in southern Lebanon and launches a drone
    into northern Israel. (The Times of Israel)
  - Two Israeli soldiers are sentenced to 30 days in military prison for destroying
    a statue of Jesus with a sledgehammer in the Christian village of Debel, Lebanon.
    (The Guardian) (The Times of Israel)
  - 2026 Israel–Lebanon peace talks, France–Lebanon relations
  - French president Emmanuel Macron affirms France's support for the territorial
    integrity of Lebanon, saying that the withdrawal of Israeli troops from the country
    is a precondition for stability. (Al Jazeera)
  - Israeli–Palestinian conflict
  - Israeli settler violence
  - Two Palestinians are killed and three are injured in an attack towards a school
    by settlers and Israeli soldiers in Al-Mughayyir, West Bank. (Reuters)
  - Israeli invasion of Syria
  - Israeli troops raid the Quneitra Governorate in Syria, where they detain three
    people. (AA)
  - Sudanese civil war
  - Libya–Sudan relations
  - A United Nations investigation finds that the Libyan National Army (LNA) led by
    Khalifa Haftar facilitated the transfer of weapons, vehicles and Colombian mercenaries
    to Sudan to fight for the Rapid Support Forces against government forces. The
    operation was centred around Kufra, Libya, where LNA forces control Kufra Airport.
    (AP)
  - Transitional Sovereignty Council leader Abdel Fattah al-Burhan and Omani sultan
    Haitham bin Tariq hold official talks to focus on regional development and efforts
    to end the war in Sudan. (Muscat Daily)
  - Mali War
  - The Russian defence ministry says the Africa Corps freed a Russian and a Ukrainian
    citizen abducted in Niger in July 2024 by Jama'at Nusrat al-Islam wal-Muslimin
    during an operation conducted in Mali. (AP)
  - Economic impact of the 2026 Iran war
  - Nepal resumes issuing work permits for its nationals seeking employment in the
    Middle East after a temporary suspension linked to the Iran war, citing guidance
    from the foreign ministry and demand from workers. (Reuters)
  - Vitol CEO Russell Hardy says that at least one billion barrels of oil production
    will be lost because of the war even if it ends immediately, and that the current
    loss is in the range of 600 to 700 million barrels. (Financial Times)
  - Defense industry of Japan
  - Japan approves new rules easing long-standing restrictions on arms exports, allowing
    the overseas transfer of a broader range of defense equipment, including deadly
    weapons. (AFP via The Manila Times)
  - Thirteen people are killed and 23 injured after an explosion at a fireworks manufacturing
    unit in Thrissur, India. (The Indian Express) (India Today)
  - A shell explodes inside a Type 10 main battle tank from the 8th Division's Western
    Army Tank Battalion, during a live fire exercise at Hijudai Training Area in Kusu,
    Ōita Prefecture, Japan, which is under the AOR of 4th Division, killing three
    soldiers and injuring another. (AP) (Asahi Shimbun Company)
  - Cross-strait relations, Eswatini–Taiwan relations
  - Taiwanese president Lai Ching-te cancels his planned visit to Eswatini after the
    governments of Madagascar, Mauritius, and Seychelles denied overflight permissions
    for his aircraft, with Taiwan attributing the decision to pressure from China.
    (Reuters)
  - Ukraine–European Union relations
  - Ukraine completes repairs on the Druzhba pipeline damaged in a war-related strike
    and prepares to resume operations, while president Volodymyr Zelenskyy links the
    restoration to progress on a proposed €90 billion European Union support package.
    (AP)
  - Visit by Pope Leo XIV to Algeria, Cameroon, Angola, and Equatorial Guinea
  - Pope Leo XIV arrives in Malabo, the final leg of his papal visit to Africa, becoming
    the first pope to visit Equatorial Guinea since John Paul II in 1982. (AP)
  - 2025 Indonesian protests
  - A joint investigation by the Indonesian human rights commission, the ombudsman,
    and the child protection commission finds that police and other state security
    personnel violated human rights, including arbitrary arrests, torture, and alleged
    child sexual abuse, during anti-government protests in 2025 that left at least
    11 people dead and thousands detained. (Reuters)
  - At least five people are killed and 200 others are injured in a prison riot at
    the Yare Prison in Miranda State, Venezuela. (AFP via New Straits Times)
  - South Korean police seek an arrest warrant for Hybe founder and chairperson Bang
    Si-hyuk over alleged violations of capital market laws related to Hybe's initial
    public offering, accusing him of misleading early investors and receiving profits
    through a related private equity fund. (Reuters) (AP News)
  - The U.S. justice department indicts the Southern Poverty Law Center on fraud charges
    related to payments it made to infiltrate white supremacist hate groups, including
    the Ku Klux Klan, Aryan Nations and the American Nazi Party. (The Guardian) (New
    York Post)
  - Corruption in the United States
  - U.S. House of Representatives member Sheila Cherfilus-McCormick resigns from her
    position amid a probe by the House Ethics Committee, following her November 2025
    indictment by federal prosecutors for stealing $5 million of COVID-19 pandemic
    relief funds, some of which allegedly went towards funding her 2022 election campaign.
    (AFP via SCMP) (CNBC)
  - Smoking in the United Kingdom
  - The British parliament passes the Tobacco and Vapes Bill formally banning anyone
    in England born after December 31, 2008, from buying cigarettes and other tobacco
    products in an effort to create a "smoke-free generation". The age controls will
    enter force on January 1, 2027. (AP)
  - The Indonesian parliament passes the landmark Domestic Workers Protection Bill
    into law after 22 years of deliberation. (Bloomberg)
  - New Zealand prime minister Christopher Luxon secures the support of his caucus
    after initiating and winning a confidence vote on his leadership within the National
    Party. (Reuters)
  - Mars Exploration Program
  - NASA announces that the Curiosity rover has detected more than 20 organic molecules
    on Mars using a chemical analysis method involving tetramethylammonium hydroxide,
    conducted for the first time on another planet, indicating the long-term preservation
    of compounds associated with prebiotic chemistry. (AFP via The Manila Times)
