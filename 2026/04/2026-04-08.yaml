Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - Iranian foreign minister Abbas Araghchi confirms the two-week ceasefire between
    Iran and the United States, which includes reopening the Strait of Hormuz. The
    ceasefire is ratified by the Supreme National Security Council (SNSC). (Shafaq)
    (Khaleej Times)
  - The SNSC announces that negotiations between Iran and the U.S. will start on Friday
    in Islamabad, Pakistan, with the U.S. contingent to be led by vice president JD
    Vance alongside senior presidential adviser Jared Kushner and U.S. special envoy
    Steve Witkoff. (Axios) (Middle East Eye)
  - Israeli prime minister Benjamin Netanyahu and U.S. President Donald Trump both
    claim that the ceasefire does not include Lebanon, despite Iran and Pakistan proposing
    so part of the Islamabad Accord. (Al Jazeera) (BBC)
  - White House press secretary Karoline Leavitt states that U.S. president Donald
    Trump and Netanyahu will continue discussions on potentially including Lebanon
    in a ceasefire arrangement. (AFP via Aaj News)
  - After the announcement, an Israeli military spokesperson states that Israel is
    still launching attacks on Iran. (CNN)
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on Bahrain
  - The Bahraini military intercepts six missiles and 31 drones. (Yemen Online)
  - 2026 Iranian strikes on Kuwait
  - Kuwait's Interior Ministry reports fires at several oil facilities, power plants,
    and desalination plants after an Iranian drone attack. (Middle East Eye)
  - 2026 Iranian strikes on Qatar
  - The Qatari military intercepts seven ballistic missiles and multiple drones. (Yahoo!
    News)
  - 2026 Iranian strikes on Saudi Arabia
  - Saudi Arabia's East–West Crude Oil Pipeline is hit in an Iranian attack. (Reuters)
  - 2026 Iranian strikes on the United Arab Emirates
  - The Emirati military intercepts 17 ballistic missiles and 35 drones. (The National)
  - After the announcement of a ceasefire, Iran launches ballistic missiles at Bahrain,
    Israel, Kuwait, Qatar, and the United Arab Emirates. (CNBC News) (CNN)
  - Iranian agencies report explosions from the Lavan and Sirri islands of unknown
    origin. Iran accuses Kuwait and the UAE of the attacks and launches retaliatory
    attacks against those countries in response. (Ynet) (Wanaen)
  - Iranian president Masoud Pezeshkian says the ceasefire with Israel and the U.S.
    is broken as the Lavan and Siri islands were bombed by the United States and Lebanon
    was bombed by Israel. (G1) (Forbes)
  - 2026 Strait of Hormuz crisis
  - Thailand confirms the three crewmen on a vessel that was attacked in the Strait
    of Hormuz in March have died. (Al Jazeera)
  - MarineTraffic reports the first ships that have passed through the Strait of Hormuz
    since the ceasefire announcement, namely the Greek-owned bulk carrier NJ Earth
    and Liberia-flagged Daytona Beach. (CNBC) (Euronews)
  - Iran closes Strait of Hormuz maritime traffic to oil tankers over Israeli attacks
    in Lebanon, claiming that Lebanon is included in the ceasefire. (G1) (Forbes)
  - Bahrain, Iraq, and Syria reopen their airspace after weeks of closure. The Damascus
    International Airport and the Bahrain International Airport begin resuming flights.
    (Khaleej Times) (BNA) (AA)
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - 2026 Israeli Beirut strikes
  - At least 254 people are killed and 1,165 others are injured in a wave of Israeli
    strikes on Lebanon, including in southern Lebanon, Beirut, and the Bekaa Valley.
    (Al Jazeera) (Al Jazeera) (BBC News)
  - The Israeli military says that it has halted strikes against Iran, but state that
    they will continue fighting Hezbollah in Lebanon. (The Times of Israel)
  - The Lebanese army closes a bridge in the Tyre District after receiving a warning
    of a possible Israeli strike on the structure. The bridge is the last crossing
    linking areas north and south of the Litani River in the area, where many residents
    remain despite evacuation notices. (AFP via The Times of Israel)
  - Afghanistan–Pakistan border skirmishes
  - 2026 Afghanistan–Pakistan conflict
  - Chinese Foreign Ministry spokesperson Mao Ning says that Afghanistan and Pakistan
    has agreed on a comprehensive plan to end tensions after seven days of talks in
    Ürümqi, China. The two countries also agree to avoid any escalations in their
    current conflict. (Reuters) (The Strait Times)
  - Economic impact of the 2026 Iran war
  - Oil prices plunge below US$95 and the Dow Jones Industrial Average surges past
    1,000 after the ceasefire announcement. (AP)
  - Belarus–North Korea relations
  - Belarus plans to open an embassy in North Korea by August 1 after president Alexander
    Lukashenko visited the country in March following a deceee signed by Prime Minister
    Alexander Turchin. (Caliber.az)
  - 2026 attack on Israeli consulate in Istanbul
  - Turkish police arrest 198 suspects across 34 provinces in operations targeting
    the Islamic State following a fatal shootout outside the Israeli consulate in
    Istanbul on April 7. Several suspects are placed in pre-trial detention as part
    of the investigation. (AFP via Yahoo News)
  - Gilgo Beach serial killings
  - Rex Heuermann admits in court to killing eight women and discarding their bodies
    between 1993 and 2010 in New York, United States. Heuermann is expected to receive
    a sentence of life in prison without parole when he is sentenced on June 17. (NBC
    News)
  - Illegal drug trade in the United States
  - A United States court sentences Jasveen Sangha to 15 years in prison for distributing
    ketamine that resulted in the death of actor Matthew Perry in 2023, as part of
    a wider investigation into a network supplying controlled substances. Authorities
    also charge and sentence other individuals, including medical professionals, in
    connection with the distribution of the drug. (AFP via France 24)
