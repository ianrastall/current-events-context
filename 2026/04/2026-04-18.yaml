wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - Israel's military establishes a "yellow line" along southern Lebanon similar
      to the one in Gaza. Israel conducts strikes against individuals it says approach
      its forces in violation of ceasefire arrangements, including operations targeting
      positions and tunnels linked to Hezbollah. (AFP via The Korea Herald) (Al Jazeera)
    - A French soldier is killed and three are injured in a shooting against United
      Nations Interim Force in Lebanon peacekeepers in Deir Kifa, southern Lebanon.
      France has accused Hezbollah of being responsible, an allegation that the group
      has denied. (AP)
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - Iran says that a date for another round of talks with the United States has
      not been set, pending an agreement on a framework for negotiations. (NBC News)
    - Iranian parliament speaker Mohammad Bagher Ghalibaf says that ceasefire negotiations
      have progressed but also states that a deal is far from ready. (The Times of
      Israel)
    - Naval blockade of Iran
    - The U.S. Central Command reports that 21 ships have been turned back since the
      start of the blockade. (NBC News)
    - 2026 Strait of Hormuz crisis
    - The Islamic Revolutionary Guard Corps Navy announces that the Strait of Hormuz
      is closed again until the blockade ends. (NBC News)
    - A tanker is reportedly attacked by Iranian "gunboats" while in the strait. (NBC
      News)
    - Israel–Palestine conflict
    - Gaza war
    - The Gaza health ministry updates the total Palestinian casualties to 72,549
      killed and 172,274 injured, including at least 773 killed and 2,171 injured
      since the October 2025 ceasefire. (Al Jazeera)
    - Terrorism in Ukraine
    - 2026 Kyiv shooting
    - Six people are killed and 15 others are injured, including a child, in a mass
      shooting in Holosiivskyi District, Kyiv, Ukraine. The gunman barricaded himself
      inside a supermarket and took hostages before being killed by police. (Sky News)
    - Reactions to the 2026 Iran war, Coachella 2026
    - At the Coachella festival in Empire Polo Club, Indio, California, American rock
      band The Strokes shows videos accusing the Central Intelligence Agency of enforcing
      regime change through violence while performing "Oblivius" and also denounce
      the U.S.-Israel strikes against Iran. (The Independent)
    - Thirteen people are killed by lightning strikes across Bangladesh. (The Daily
      Star)
    - Australia–Japan relations, Australian general purpose frigate program
    - Australia and Japan sign an agreement for the delivery of the first stealth
      ships under a AU$10 billion (US$7.2 billion) program to supply the Australian
      navy with a new fleet of warships. (AFP via The Manila Times)
    - India–Iran relations
    - India's external affairs ministry summons the ambassador of Iran after an Indian-flagged
      tanker was attacked in the Strait of Hormuz. (Al Jazeera)
    - Headed by Spanish prime minister Pedro Sánchez, left-wing heads of government
      gather at the IV Meeting in Defense of Democracy and Progressive Global Mobilization
      in Barcelona. Participants include Brazil's Luiz Inácio Lula da Silva, Colombia's
      Gustavo Petro, Kosovo's Albin Kurti, Mexico's Claudia Sheinbaum, South Africa's
      Cyril Ramaphosa, and Uruguay's Yamandú Orsi. (El Constitucional)
    - Pakistan in the 2026 Iran war
    - Pakistan tightens major security in Islamabad ahead of potential second round
      of talks between Iran and the U.S. (Khyber News TV)
    - Rawalpindi shuts down cafés, restaurants, gyms, markets, and marriage halls
      in preparation of possible Iran–U.S. talks. (Daily Pakistan)
    - Two Indian citizens are killed in a shooting outside a Sikh temple in Covo,
      Province of Bergamo, Italy. (IANS)
    - Three people are killed in a stabbing attack during the filming of the TV series
      Sin senos sí hay paraíso in Laches, Bogotá, Colombia. (People en Español)
