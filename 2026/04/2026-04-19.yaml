wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - United States president Donald Trump says that negotiations with Iran will be
      held in Islamabad, Pakistan, on April 20, with a U.S. delegation led by vice
      president JD Vance and special envoys Steve Witkoff and Jared Kushner. (Al Jazeera)
      (CNBC)
    - Tasnim News Agency reports that Iran is undecided as to sending a negotiating
      delegation to Islamabad while a naval blockade remains in place. (Reuters)
    - Naval blockade of Iran
    - The United States Navy destroyer and the 31st Marine Expeditionary Unit stop
      and seize control of the Iranian-flagged container ship Touska, in the first
      direct action during the blockade. (Bloomberg) (Task and Purpose)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - The Israeli military publishes a map of the territory that it claims to control
      in Lebanon for the first time. (Reuters)
    - New People's Army rebellion
    - Toboso encounter
    - Nineteen alleged New People's Army militants are killed in a shootout with the
      army in Toboso, Negros Occidental, Philippines. (TRT World)
    - Operation Southern Spear, United States strikes on alleged drug traffickers
      during Operation Southern Spear
    - Three people are killed in an American airstrike against a boat in the Caribbean
      Sea. (The New York Times)
    - M23 campaign
    - The Democratic Republic of the Congo and the March 23 Movement agree to facilitate
      humanitarian aid delivery and release prisoners within 10 days following talks
      in Montreux, Switzerland, and sign a memorandum establishing mechanisms to monitor
      a ceasefire. (AFP via Al-Ahram)
    - Terrorism in the United Kingdom, Antisemitism in the United Kingdom
    - A synagogue in North London, England, is targeted in a firebombing attack, which
      is suspected to be an act of terrorism. (The Independent)
    - Mexican drug war
    - Two civilians killed and three wounded in a mass shooting at a bar in San Luis
      Potosí, San Luis Potosí. Authorities began to investigate the attack as part
      of a conflict between delictive cells. (El Universal in Spanish)
    - Five gunmen are killed in a shootout with security forces in the municipality
      of General Terán, Nuevo León. Authorities start a series surveillance operation
      in the area. (Milenio Noticias in Spanish)
    - Two Mexican officers and two Central Intelligence Agency agents are killed in
      a car crash in the northern Mexican state of Chihuahua. President Claudia Sheinbaum
      states her government is investigating "potential violations of national security",
      with their operation to reportedly destroy a clandestine drug lab not pre-approved
      by the federal government. (CBS News) (AP)
    - At least 25 people are killed and 13 others are injured in an explosion at a
      fireworks factory in Virudhunagar, Tamil Nadu, India. (BBC News)
    - Eight people are killed, including two children, and three others are injured
      in two separate drowning incidents in the Kaveri river in Mysore district, Karnataka,
      India. (Deccan Herald)
    - Seven people are killed, including six children, in a propane tank explosion
      and fire at a house in Lamar Township, Pennsylvania, United States. (WNEP-TV)
    - A spectator is killed and two others are injured when a car crashes into spectators
      at the Codasur South American Rally Championship in Córdoba, Argentina. (Infobae
      in Spanish)
    - A fire destroys about 1,000 homes in a stilt settlement in Sandakan, Sabah,
      Malaysia, displacing thousands of residents. (AFP via Gulf News)
    - Argentina–Israel relations
    - 2026 state visit by Javier Milei to Israel
    - Argentine president Javier Milei and Israeli prime minister Benjamin Netanyahu
      announce the launching of the Isaac Accords to foster cooperation between Israel
      and the Western Hemisphere. (The Times of Israel)
    - 2026 Iran war
    - 2026 Internet blackout in Iran, Cyberwarfare during the 2026 Iran war
    - Four people, including two foreign nationals, are arrested in Jolfa, East Azerbaijan
      province, Iran, on charges related to importing Starlink equipment and alleged
      intelligence activities involving networks linked to Israel and the U.S. (AFP
      via New Straits Times)
    - Reactions to the 2026 Iran war
    - King Hamad bin Isa Al Khalifa of Bahrain announces that Bahraini nationality
      law will be reassessed so that actions can be taken against anyone who provided
      assistance to Iran's Islamic Revolutionary Guard Corps, such as with espionage.
      (Arab News)
    - 2026 Shreveport shooting
    - Eight children are killed and two women are injured in a domestic violence mass
      shooting in Shreveport, Louisiana, United States. The perpetrator later carjacks
      a vehicle and flees across the Red River to the adjacent Bossier City, where
      he is fatally shot by police. (Reuters)
    - First U.S. attorney Bill Essayli announces that an Iranian woman has been arrested
      at the Los Angeles International Airport in California for allegedly helping
      Iran traffic weapons to Sudan. (The Guardian)
    - 2026 Bulgarian parliamentary election, Bulgarian political crisis
    - Bulgarians vote for 240 seats of the National Assembly in the nation's eighth
      election since April 2021. Former president Rumen Radev leads the soft eurosceptic
      Progressive Bulgaria coalition, the frontrunner of the election according to
      opinion polls. (AFP via RFI) (AP)
    - Pakistan in the 2026 Iran war
    - Several universities across Islamabad and Rawalpindi in Pakistan, including
      the International Islamic University and Pir Mehr Ali Shah Arid Agriculture
      University, will shift to online classes amidst a potential second round of
      talks between Iran and the U.S. (The Express Tribune)
    - Nus Kei, chairperson of the Golkar Party's Southeast Maluku Regency branch in
      Indonesia, is assassinated at Karel Sadsuitubun Airport. The two perpetrators
      are subsequently arrested. (CNN Indonesia in Indonesian) (Tempo in Indonesian)
    - AI boom
    - Artificial intelligence industry in China
    - A humanoid robot developed by Chinese company Honor completes a half marathon
      in Beijing involving both robots and human runners in 50 minutes and 26 seconds,
      faster than the standing human world record. (AFP via RTÉ) (Fox News)
    - New Space Race
    - American company Blue Origin successfully launches its New Glenn rocket using
      a reused booster, which it recovers after liftoff, but the communications satellite
      it carried for AST SpaceMobile is placed in an incorrect orbit. (AFP via France
      24)
