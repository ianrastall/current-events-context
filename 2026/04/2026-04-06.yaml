Date: '2026-04-06'
Source_URI: Portal:Current events/2026 April 6
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on the United Arab Emirates
  - Debris from a missile defense system falls on a Raneen Systems building in Mussafah,
    injuring a Ghanaian citizen. (The Times of Israel)
  - The United Arab Emirates is targeted by 12 ballistic missiles, two cruise missiles,
    and 19 drones from Iran. (Al Jazeera)
  - 2026 Iranian strikes on Kuwait
  - Iran claims to be targeting U.S. satellite equipment and ammunition on Bubiyan
    Island using drones. (Reuters)
  - The Kuwaiti military responds to 14 ballistic missiles, two cruise missiles, and
    46 drones from Iran in Kuwaiti airspace. (Al Jazeera)
  - 2025–2026 Iran–United States negotiations, Pakistan in the 2026 Iran war
  - Pakistan proposes a ceasefire plan received by the United States and Iran, reportedly
    dubbed the Islamabad Accord, which calls for an immediate halt to hostilities,
    the reopening of the Strait of Hormuz, and a 15–20 day period of negotiations
    between Iran and the U.S. This comes following reported talks between Pakistani
    army staff chief Asim Munir, U.S. vice president JD Vance, U.S. special envoy
    Steve Witkoff, and Iranian foreign minister Abbas Araghchi. The Pakistani foreign
    ministry says that talks between Iran and the U.S. are ongoing. (Arab News) (Reuters)
  - U.S. president Donald Trump says that Vance, Witkoff, and senior presidential
    adviser Jared Kushner are talking to intermediaries in Pakistan on ending the
    war. He also calls the Iran proposal a "significant step" ahead of his Tuesday
    deadline. (AA) (NBC News)
  - Iran delivers its response to the United States via Pakistan, rejecting a temporary
    ceasefire and listing its own 10-point demands, which include a solution to all
    regional conflicts, lifting of sanctions, reconstruction, and a protocol to re-open
    the Strait of Hormuz. (Al Jazeera) (Moneycontrol)
  - 2026 Iranian strikes on Israel
  - An Iranian missile strike hits 15 areas in Israel. A woman is seriously injured
    in Petah Tikva, while two other people are injured in Tel Aviv. In Haifa, four
    people are also slightly injured by a cluster bomb. (Ynet) (The Times of Israel)
  - Four bodies are found during a search and rescue operation in a house in Haifa
    that had been destroyed by an Iranian missile. (The Times of Israel)
  - 2026 Strait of Hormuz crisis
  - Fars News Agency reports that Iran has allowed 15 vessels to cross the Strait
    of Hormuz. (Kurdistan24)
  - Israeli attacks on Iranian scientific and academic centers
  - The mosque and filling station at the Sharif University of Technology in Tehran,
    Iran, are damaged in an airstrike, causing a gas outage in the neighbourhood.
    (Al Jazeera)
  - At least 13 people are killed in an airstrike on a residential building near Eslamshahr,
    Tehran Province, Iran. (WBAL-TV)
  - Explosions, likely from airstrikes, are reported in the South Pars gas field,
    in southern Iran. (Al Jazeera)
  - Four people are killed, seven are injured and others are reported missing in a
    Israeli–U.S. airstrike on a residential area in eastern Tehran, Iran. (Al Jazeera)
  - Israel claims to have killed Asghar Bakri, the commander of Unit 840 of the Quds
    Force. (Iran International)
  - Israeli defense minister Israel Katz states that the military is attacking Iran's
    most important petrochemical plant in Assaluyeh, causing severe damage. (Iran
    International)
  - Strikes hit a petrochemical complex in Marvdasht, Fars province, Iran, causing
    a fire. (AFP via Dawn)
  - Majid Khademi, head of the IRGC Intelligence Protection, is killed in an American–Israeli
    airstrike. (Iran International)
  - Nighttime attacks on Bandar Lengeh and Kong, Iran, kill six people and injured
    17 others. (AP)
  - Reports indicate that explosions and attacks occurred early this morning at a
    military compound in northern Iran and in Khorramshahr. (Iran International)
  - The Israeli military claims to have attacked Mehrabad International Airport as
    well as two smaller airfields, destroying dozens of Iranian aircraft and helicopters
    in the process. (The Times of Israel)
  - Red Sea crisis
  - 2026 Houthi strikes on Israel
  - The Houthis launch several long-range drones from Yemen at Eilat, Israel, in a
    coordinated attack with Hezbollah and Iran. (Al Jazeera)
  - 2026 Lebanon war
  - Christian anti-Hezbollah Lebanese Forces Party official Pierre Mouawad, his wife,
    and another woman are killed in an Israeli airstrike in Ain Saadeh, a predominantly
    Christian town east of Beirut, Lebanon. (The Guardian)(Al Jazeera)
  - Multiple people are killed by Israeli attacks in towns across southern Lebanon.
    (Al Jazeera)
  - The Israeli military orders the evacuation of the southern suburbs of Beirut because
    Israel will strike "Hezbollah infrastructure". (Al Jazeera)
  - The Lebanese government reports that there are 1.2 million displaced people in
    Lebanon due to the war. (Al Jazeera)
  - Russo-Ukrainian war
  - Russian attacks on civilians in the Russo-Ukrainian war, Odesa strikes
  - A Russian drone strike kills three civilians in Odesa Oblast, Ukraine, including
    a woman and her 2-year-old daughter. (Reuters)
  - 2026 Afghanistan–Pakistan conflict
  - Afghan forces says that they have captured a border post during clashes with Pakistani
    troops in Khost Province. (Khaama Press)
  - One child is killed and three others are injured after a piece of unexploded ordnance
    detonated in Khost Province, Afghanistan. (KabulNow)
  - The Afghani National Disaster Management Authority says that the total number
    of deaths from recent natural disasters in Afghanistan has risen to 110. (KabulNow)
  - Iran–Japan relations, Reactions to the 2026 Iran war
  - Japanese prime minister Sanae Takaichi says that her government is planning to
    hold summit talks with Iran amidst the Iran war. (Mainichi)
  - Corruption in Russia
  - A court in Kursk Oblast, Russia, sentences former governor Alexei Smirnov to 14
    years in prison for defrauding the government by embezzling public funds intended
    for building fortifications along the Russia–Ukraine border. (Bloomberg)
  - Artemis program
  - NASA's Artemis II spacecraft carrying four astronauts breaks the record for furthest
    distance humans have ever travelled from Earth surpassing the previous 248,655
    miles (400,171 kilometers) record set by Apollo 13 in April 1970. (AP)
