Date: '2026-04-27'
Source_URI: Portal:Current events/2026 April 27
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - The Associated Press and Axios report that Iran has offered to reopen the Strait
    of Hormuz if the United States lifts its blockade and if the war ends. (CNBC)
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - 2026 Israel–Lebanon peace talks
  - Hezbollah secretary-general Naim Qassem says that he "categorically rejects" negotiations
    between Israel and Lebanon, and that "the resistance" will continue. (MENA via
    The New Arab)
  - Mali War
  - 2026 Mali attacks
  - Islamist militant group Jama'at Nusrat al-Islam wal-Muslimin (JNIM) says the Malian
    military has begun to withdraw from Tessalit, Kidal Region, with the soldiers
    agreeing to hand over their weapons in exchange for a safe passage from the town.
    (Reuters)
  - Somali Civil War
  - Piracy off the coast of Somalia
  - Somali pirates storm and hijack a Saint Kitts and Nevis-flagged cargo ship off
    the coast of Puntland that was en route to Kenya. Puntland maritime police say
    nine gunmen boarded the vessel and are currently in control of the vessel and
    are heading towards Mogadishu. The status of the crew is not known. (AP)
  - Russo-Ukrainian war
  - Zaporizhzhia Nuclear Power Plant crisis
  - Russia-installed officials at the Zaporizhzhia Nuclear Power Plant say a worker
    has been killed in a Ukrainian attack. (Al Jazeera)
  - American fashion retailer Claire's closes all of its 154 stores in the United
    Kingdom and Ireland with the loss of 1,300 jobs after collapsing into administration
    for a second time in a year. (BBC News)
  - China's National Development and Reform Commission annouced the decision of blocking
    of American technology company Meta's planned acquisition of Chinese artificial
    intelligence startup Manus. (CNA)
  - 2026 Bekasi train crash
  - Four people are killed and dozens are injured after an Argo Bromo Anggrek train
    collides with a KRL Commuterline train near Bekasi Timur Station in West Java,
    Indonesia, prompting evacuations. (AFP via France 24)
  - A CityLink Cessna 208B Grand Caravan domestic flight crashes in Juba, South Sudan,
    killing all 14 people on board. (AP)
  - Bahrain–Iran relations
  - Reactions to the 2026 Iran war
  - Bahrain revokes the citizenship of 69 people for "expressing support" for Iran
    during the conflict. (Reuters)
  - A Taiwanese court sentences a former TSMC employee to 10 years in prison for stealing
    trade secrets to benefit Tokyo Electron, while also imposing prison terms on accomplices
    and financial penalties on Tokyo Electron Taiwan. (AFP via The Manila Times)
  - 2026 Maltese general election
  - Maltese president Myriam Spiteri Debono dissolves the Parliament of Malta on the
    advice of Prime Minister Robert Abela, after the latter calls for general elections
    on 30 May. (TVM+ 1) (TVM+ 2)
  - Iraqi president Nizar Amidi names Ali al-Zaidi as prime minister-designate from
    the Coordination Framework, after two other contenders, former prime minister
    Nouri al-Maliki and the incumbent Mohammed Shia' al-Sudani, withdrew their candidacies.
    (Al Jazeera)
