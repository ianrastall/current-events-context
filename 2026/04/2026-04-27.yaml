wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon peace talks
    - Hezbollah secretary-general Naim Qassem says that he "categorically rejects"
      negotiations between Israel and Lebanon, and that "the resistance" will continue.
      (MENA via The New Arab)
    - 2026 Iran war
    - 2026 Strait of Hormuz crisis
    - The Associated Press and Axios report that Iran has offered to reopen the Strait
      of Hormuz if the United States lifts its blockade and if the war ends. (AP)
      (CNBC) (Axios)
    - U.S. Secretary of State Marco Rubio states that Iran's position on access to
      the strait does not meet U.S. requirements, while U.S. president Donald Trump
      discusses a reported Iranian proposal on reopening the route with his national
      security advisers. (AFP via CNA)
    - Nuclear program of Iran
    - Iran and the U.S. dispute at a review conference of the Treaty on the Non-Proliferation
      of Nuclear Weapons at the United Nations, amid disagreement over Iran's election
      as a vice president of the meeting and its compliance with treaty obligations.
      (AP)
    - Mali War
    - 2026 Mali offensives
    - Islamist militant group Jama'at Nusrat al-Islam wal-Muslimin (JNIM) says the
      Malian military has begun to withdraw from Tessalit, Kidal Region, with the
      soldiers agreeing to hand over their weapons in exchange for a safe passage
      from the town. (Reuters)
    - Somali Civil War
    - Piracy off the coast of Somalia
    - Somali pirates storm and hijack a Saint Kitts and Nevis-flagged cargo ship off
      the coast of Puntland that was en route to Kenya. Puntland maritime police say
      nine gunmen boarded the vessel and are currently in control of the vessel and
      are heading towards Mogadishu. The status of the crew is not known. (AP)
    - Russo-Ukrainian war
    - Zaporizhzhia Nuclear Power Plant crisis
    - Russia-installed officials at the Zaporizhzhia Nuclear Power Plant say a worker
      has been killed in a Ukrainian attack. (Al Jazeera)
    - 2026 Afghanistan–Pakistan war
    - Afghanistan claims seven people are killed and 85 others are injured in Pakistani
      strikes on Afghanistan, including the Sayed Jamaluddin Afghani University. (The
      Economic Times)
    - Twenty-nine people are killed and several structures are destroyed by Islamic
      State gunmen during a mass shooting in Guyaku, Nigeria. (Al Jazeera)
    - American fashion retailer Claire's closes all of its 154 stores in Ireland and
      the United Kingdom with the loss of 1,300 jobs after collapsing into administration
      for a second time in a year. (BBC News)
    - China's National Development and Reform Commission announces the decision to
      block American technology company Meta's planned acquisition of Chinese artificial
      intelligence startup Manus. (AFP via CNA)
    - 2026 CityLink Aviation Cessna 208 crash
    - A CityLink Aviation Cessna 208B Grand Caravan crashes during a domestic flight
      south-west of Juba, South Sudan, killing all 15 people on board. (BBC News)
      (AP)
    - 2026 Bekasi train crash
    - Fourteen people are killed and 84 others are injured after an Argo Bromo Anggrek
      train collides with a KRL Commuterline train near Bekasi Timur Station in West
      Java, Indonesia, prompting evacuations. (AFP via CNA)
    - Four people are killed in a fire at an IDP camp in Golo, Central Darfur, Sudan.
      (Sudan Tribune)
    - Bahrain–Iran relations
    - Reactions to the 2026 Iran war
    - Bahrain revokes the citizenship of 69 people for "expressing support" for Iran
      during the conflict. (Reuters)
    - Mexican drug war
    - ', the leader of the Jalisco New Generation Cartel, is taken into custody during
      a raid in Nayarit, Mexico. (Reuters)'
    - A Taiwanese court sentences a former TSMC employee to 10 years in prison for
      stealing trade secrets to benefit Tokyo Electron, while also imposing prison
      terms on accomplices and financial penalties on Tokyo Electron Taiwan. (AFP
      via The Manila Times)
    - 2026 Maltese general election
    - Maltese president Myriam Spiteri Debono dissolves parliament on the advice of
      prime minister Robert Abela, after the latter calls for general elections on
      30 May. (TVM+ 1) (TVM+ 2)
    - Iraqi president Nizar Amidi names Ali al-Zaidi as prime minister-designate from
      the Coordination Framework, after two other contenders, former prime minister
      Nouri al-Maliki and the incumbent Mohammed Shia' al-Sudani, withdrew their candidacies.
      (Al Jazeera) (Reuters)
