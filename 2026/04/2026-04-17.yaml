  - 2026 Strait of Hormuz crisis
  - Naval blockade of Iran
  - United States president Donald Trump says that the U.S. naval blockade will remain
    in effect until a peace agreement is reached with Iran. (Al Jazeera)
  - Fars News Agency reports that the Iranian government considers the continuation
    of the blockade a violation of the ceasefire and would close the strait again
    if it is not lifted. (Iran International)
  - Iranian foreign minister Abbas Araghchi announces that the Strait of Hormuz will
    be open for commercial traffic via a "coordinated route" with Iranian authorities
    while the 10-day ceasefire in Lebanon is in effect. (CNBC)
  - An Iranian military official says that vessels must receive permission from the
    Islamic Revolutionary Guard Corps to pass. (Al Jazeera)
  - Maritime tracking data shows that only a few ships moved through the strait after
    the announcement. (BBC)
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - Israeli defense minister Israel Katz says that the military will hold all of its
    positions in southern Lebanon, and that disarming Hezbollah remains its main objective.
    (Al Jazeera)
  - The Israeli military issues a statement telling residents from southern Lebanon
    to remain north of the Litani River during the ceasefire. (Al Jazeera)
  - The Lebanese military says that there have been several Israeli attacks and artillery
    shelling incidents in violation of the ceasefire. (Al Jazeera)
  - Civil conflict in the Philippines
  - Moro conflict
  - Ten Maute Group militants, including a leader, are killed in a shootout with soldiers
    during a raid in Marantao, Lanao del Sur, Phillippines. (AFP via The Punch)
