Date: '2026-04-22'
Source_URI: Portal:Current events/2026 April 22
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - Iran's Islamic Revolutionary Guard Corps Navy seizes two vessels after attempting
    to cross the Strait of Hormuz. A third vessel is also reportedly "disabled off
    Iran's coast". (CNN)
  - 2026 Iranian strikes on the Kurdistan Region
  - Three members of the Kurdistan Freedom Party are injured in a drone attack in
    the Khabat District, Kurdistan Region, Iraq. The group attributes the attack to
    Iran. (Al Jazeera)
  - 2026 Lebanon war
  - April 2026 attack on French UNIFIL peacekeepers in Lebanon
  - A French UNIFIL peacekeeper dies from his wounds sustained from an ambush last
    week blamed on Hezbollah. (AFP via Al Arabiya)
  - Israeli airstrikes kill at least five people across Lebanon, including Al Akhbar
    journalist Amal Khalil. (Al Jazeera)
  - Boko Haram insurgency
  - Suspected Boko Haram insurgents on motorcycles kill at least 20 people in shootings
    in Borno State and Adamawa State, Nigeria. (Reuters)
  - Insurgency in Balochistan
  - Ten people are killed and eight others are injured in an attack on a copper and
    gold mine in Chagai District, Balochistan, Pakistan. A Turkish citizen is among
    the fatalities, while another is kidnapped. (AFP via Al Arabiya)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - German airline Lufthansa announces that it will cut 20,000 short-haul flights
    in Europe this summer, saying rising fuel prices have made many flights "unprofitable"
    for the company. (BBC News)
  - Stocks in the United States, including S&P 500 and Nasdaq, rise following yesterday’s
    announcement that the ceasefire would be extended indefinitely. (CNBC)
  - Germany–Russia relations, Russia in the European energy sector
  - Russia announces it will halt the transport of Kazakh oil to Germany via the Druzhba
    pipeline starting May 1, citing technical reasons, while the German economic ministry
    states that the interruption is not expected to significantly disrupt fuel supply.
    (AFP via France 24)
  - 2026 Institute, West Virginia chemical disaster
  - A leak results in a violent chemical reaction involving nitric acid and another
    substance at a facility in Kanawha County, West Virginia, United States, killing
    two people and injuring 19 others. (AP)
  - Eleven people are killed, including children, in a multiple-vehicle collision
    in Mirzapur, Uttar Pradesh, India. (PTI via Deccan Herald)
  - Nine people are killed and around 27 others are injured when a bus crashes into
    a tree on a highway near San Juan del Río and Amealco de Bonfil, Querétaro, Mexico.
    (Turquesa News in Spanish)
  - Two people are killed and 16 others are injured when a passenger bus carrying
    Ukrainian citizens strikes a group of people and crashes into a ditch in Burgas,
    Bulgaria. (Ukrainska Pravda)
  - 2026 Ōtsuchi wildfire
  - Two wildfires broke out in Ōtsuchi, Iwate, Japan. (NHK in Japanese)
  - Reactions to the 2026 Iran war
  - Pakistan in the 2026 Iran war
  - Islamabad, Pakistan, remains on lockdown ahead of a potential, unconfirmed second
    round of talks between Iran and the U.S. in the city. (Digital Journal)
  - France and the United Kingdom host a military conference involving over 30 countries
    in Northwood, London, to discuss the use of military forces for the reopening
    of the Strait of Hormuz once conditions allow. (AA)
  - Corruption in Moldova
  - Moldovan oligarch and former politician Vladimir Plahotniuc is sentenced to 19
    years in prison for embezzling about US$1 billion from the country's banks. (Reuters)
  - International Criminal Court investigation in the Philippines
  - International Criminal Court (ICC) judges dismiss former Philippine president
    Rodrigo Duterte's jurisdictional challenge regarding the ICC's authority over
    alleged crimes committed while the Philippines was still a member, allowing proceedings
    to continue against Duterte on charges of crimes against humanity linked to his
    anti-drug campaign. (Reuters)
  - Balen Shah cabinet
  - Nepali home minister Sudan Gurung resigns to allow an impartial investigation
    into his financial activities, becoming the second minister to leave prime minister
    Balen Shah's government following recent elections. (AFP via The Straits Times)
  - Payment and Control Agency for Guidance and Guarantee Community Aid scandal
  - The Greek parliament votes to lift the immunity of 13 legislators from the ruling
    New Democracy party to allow investigation into alleged fraud involving European
    Union agricultural subsidies. (Reuters)
  - Presidency of José María Balcázar
  - Peruvian defence minister Carlos Díaz Dañino and foreign minister Hugo de Zela
    resign following president José María Balcázar's decision to postpone the purchase
    of F-16 fighter jets from the United States. (Reuters)
