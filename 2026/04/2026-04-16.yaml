wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - United States defense secretary Pete Hegseth says that the U.S. is prepared
      to resume combat operations if Iran does not agree to a permanent deal. (Al
      Jazeera)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - U.S. president Donald Trump announces that Israel and Lebanon have agreed to
      a 10-day ceasefire, after his conversations with Israeli prime minister Benjamin
      Netanyahu and Lebanese president Joseph Aoun. (NBC News)
    - Russo-Ukrainian war
    - Russian attacks on civilians in the Russo-Ukrainian war
    - Russian missile and drone strikes across Ukraine, including on Kyiv and Odesa,
      kill at least 22 people and wound more than 131 others. (The Kyiv Independent)
    - The Russian defence ministry publishes a list of locations in Europe that are
      reportedly supporting drone production for Ukraine, including in Germany and
      Italy, saying the locations are "potential targets for the Russian Armed Forces”.
      (Euractiv)
    - Syrian civil war
    - United States intervention in Syria
    - U.S. troops complete their withdrawal from the Qasrak air base in Hasakah province,
      ending U.S. involvement in Syria after troops first arrived in 2015 to fight
      against the Islamic State. (Middle East Eye) (The New York Times)
    - Mexican drug war
    - Five gunmen are killed and a state trooper is wounded during a security operation
      in Los Herreras, Nuevo León, Mexico. Authorities implement coordinated surveillance
      in the area for more suspects. (Milenio in Spanish)
    - A previously unknown poem by Federico García Lorca is found handwritten on the
      back of a manuscript. It was discovered by Spanish singer and collector Miguel
      Poveda. (RTVE in Spanish)
    - A mystery location of Shakespeare's London house has been finally uncovered.
      (Euronews)
    - Economic impact of the 2026 Iran war
    - German airline Lufthansa announces the permanent withdrawal of 27 aircraft operated
      by its CityLine regional subsidiary and plans additional fleet reductions, citing
      increased fuel costs linked to the Iran war and labor disruptions. (Xinhua)
    - Approximately 18 people are killed when a minibus catches fire on a highway
      near Bulawayo, Zimbabwe. (AP)
    - A helicopter crashes in Sekadau Regency, West Kalimantan, Indonesia, killing
      all eight people on board. (Reuters)
    - A fire at the major Viva oil refinery near Melbourne, Victoria, Australia, halts
      its gasoline production. (Bloomberg)
    - Argentina–Israel relations, Status of Jerusalem
    - Argentine president Javier Milei announces a trip to Israel where he is expected
      to receive the Israeli Presidential Medal of Honor and meet Israeli prime minister
      Benjamin Netanyahu to expedite the transfer of the Argentine embassy from Tel
      Aviv to Jerusalem. (Infobae)
    - Nicaragua–United States relations
    - The Trump administration imposes sanctions against two sons of Nicaragua co-presidents
      Daniel Ortega and Rosario Murillo along with other officials tied to the gold
      industry in the country. (AP)
    - Venezuela and the International Monetary Fund
    - The International Monetary Fund and the World Bank restore official relations
      with Venezuela and recognize the administration of acting president Delcy Rodríguez,
      enabling engagement on economic policy and potential financial assistance. (AFP
      via France 24)
    - 2026 Onikişubat school shooting
    - The death toll in yesterday's school shooting in Onikişubat, Kahramanmaraş Province,
      Turkey, rises to 11, including the perpetrator, after a critically injured victim
      succumbs to his injuries. (AP)
    - Death of Celeste Rivas Hernandez
    - Police arrest singer d4vd in Los Angeles, California, U.S., on suspicion of
      killing a 14-year-old girl whose remains were previously found in a vehicle
      registered to him. (BBC News)
    - Flood control projects scandal in the Philippines
    - Philippine president Bongbong Marcos says that Czech authorities have arrested
      former legislator Zaldy Co in Prague after he entered the country without proper
      documentation, following his designation as a fugitive in connection with graft
      and malversation charges linked to a flood control project. (AP)
    - Trafficking of Chinese nationals to scam centers abroad
    - Sri Lankan customs officials arrest nine Chinese nationals at Bandaranaike International
      Airport in Colombo for attempting to smuggle communication equipment concealed
      on their bodies, which officials say is intended for use in internet fraud operations.
      (AFP via CNA)
    - United Kingdom anti-immigration protests
    - Surrey Police issue a disorder warning in Epsom, England, after protesters clash
      with riot police in the town. The protesters are demanding the description of
      men who gang raped a woman outside a Methodist Church the previous weekend.
      (BBC News)
    - In South Africa, Economic Freedom Fighters leader Julius Malema is sentenced
      to five years imprisonment for the unlawful discharge of a firearm at a 2018
      rally. (AFP via France 24)
    - In the United States, Fairfax County officials say that former Virginia lieutenant
      governor Justin Fairfax murdered his wife, then killed himself, after the police
      find them dead at their home. (Hindustan Times)
    - 2026 Hungarian parliamentary election
    - Hungarian prime minister-designate Péter Magyar says his election victory over
      Viktor Orbán will not lead to a policy shift on migration, saying his government
      will strengthen borders and "protect our country and Europe" from illegal immigration.
      (Newsweek)
    - Corruption in Nepal
    - The Balen Shah cabinet establishes a five-member commission, led by a former
      Supreme Court judge, to investigate the assets of current and former Nepali
      public officials. (AFP via The Manila Times)
    - Reactions to the 2026 Iran war
    - The U.S. House of Representatives rejects the War Powers Resolution to stop
      military operations by a 214–213 vote. (Politico)
    - Candidates Tournament 2026
    - In chess, Javokhir Sindarov wins the Candidates Tournament in Cyprus. The Women's
      Tournament is won by Vaishali Rameshbabu. (FIDE)
