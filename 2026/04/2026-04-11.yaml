wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - The delegations of the Iran and the United States arrive in Islamabad, Pakistan,
      for ceasefire talks, the highest-level engagement between the two countries
      since the Iranian Revolution in 1979, with the Iranian delegation led by parliament
      speaker Mohammad Bagher Ghalibaf and foreign minister Abbas Araghchi and the
      U.S. delegation led by vice president JD Vance. (Arab News PK)
    - The first round of talks end without a peace deal, but is expected to continue
      into Sunday night. (CNBC)
    - 2026 Strait of Hormuz crisis
    - Operation Urja Suraksha
    - India-flagged LPG gas tanker Jag Vikram crosses the Strait of Hormuz, becoming
      the first Indian vessel to cross the Strait of Hormuz since the ceasefire. It
      is expected to arrive in Mumbai on April 15. (Hindustan Times)
    - U.S. president Donald Trump says that the U.S. has begun "clearing out" naval
      mines in the Strait of Hormuz. (AA)
    - The U.S. Central Command confirms that the U.S. Navy s USS Frank Peterson and
      USS Michael Murphy have crossed the Strait of Hormuz to ensure the strait is
      clear of naval mines. (The Times of Israel) (Reuters) (CENTCOM)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - At least ten people, including three emergency workers, are killed by Israeli
      airstrikes across southern Lebanon. (Al Jazeera)
    - The Israeli army has reportedly encircled Bint Jbeil, a Hezbollah stronghold
      in southern Lebanon. (DPA via Yahoo News)
    - Israel rejects a ceasefire with Hezbollah. (Al Jazeera)
    - The Lebanese government reports that the death toll from the war has surpassed
      2,000 people. (Middle East Eye)
    - Boko Haram insurgency
    - 2026 Yobe State airstrike
    - At least 200 people are feared dead after a Nigerian Air Force airstrike accidentally
      hits a market instead of Boko Haram militants in Yobe State, Nigeria. (Reuters)
    - Sudanese civil war
    - Darfur campaign
    - It is reported that a prominent senior North Darfur commander in the Rapid Support
      Forces has defected to the Sudanese Army. (Sudan Tribune)
    - Operation Southern Spear, United States strikes on alleged drug traffickers
      during Operation Southern Spear
    - Five people are killed in two airstrikes carried out by the United States Navy
      against an alleged drug boat in the eastern Pacific. (The Guardian)
    - Russo-Ukrainian war
    - Russia and Ukraine announce a 32-hour ceasefire in observation of Orthodox Easter,
      alongside a prisoner exchange of 175 servicemen. (Reuters)
    - Yemeni civil war
    - The Yemeni Army and Houthis engage in intense fighting in the As-Silw district
      in Taiz Governorate, Yemen, killing two soldiers. Additionally, the Yemeni Army
      says that it repelled a Houthi attack. (Yemen Monitor)
    - Citadelle Laferrière crowd crush
    - At least 30 people are killed after a stampede at the Citadelle Laferrière in
      Nord, Haiti. (Sky News)
    - The Afghan disaster authority says that the death toll from recent floods in
      Afghanistan rises to 178 with 236 people injured, including 22 more deaths recorded
      in 24 hours. (Khaama Press)
    - At least 13 people are killed and 30 others are injured when a bus crashes into
      two trucks in Katihar district, Bihar, India. (Hindustan Times)
    - Two people are killed and at least three others are injured after a building
      collapsed in Germasogeia, Limassol, Cyprus. (Xinhua News)
    - A speeding truck crashes into at least 22 vehicles and a village gym in Davao
      City, Philippines, killing six people and injuring six others. (Brigada News)
    - Pakistan–Qatar relations, Pakistan–Saudi Arabia relations, Pakistan–United Arab
      Emirates relations
    - Pakistan announces that Qatar and Saudi Arabia will provide US$5 billion in
      financial assistance to support the country's foreign exchange reserves and
      enable it to repay $3.5 billion of debt to the United Arab Emirates by the end
      of April. (AA)
    - Protests against the 2026 Iran war
    - 2026 Iranian diaspora protests
    - Amidst the Islamabad ceasefire talks, Iranian diaspora protesters gather in
      Bangkok, Thailand to reaffirm their calls for regime change. (Thai Examiner)
    - Anti-war and anti-government protests against prime minister Benjamin Netanyahu
      occur across Israel, including 2,000 protesters at Habima Square in Tel Aviv
      that exceeded court-ordered limits. Protests also occur in Jerusalem and Haifa.
      (Times of Israel)
    - 2026 Djiboutian presidential election
    - Preliminary results released after yesterday's presidential election reveal
      that incumbent president Ismaïl Omar Guelleh has won a sixth term in office
      with 97.81% of the vote, beating CDU candidate Mohamed Farah Samatar, who took
      2.19% of the vote. (AP) (France 24)
    - 2026 Iraqi presidential election
    - The Council of Representatives elects PUK candidate Nizar Amidi as president
      of Iraq in the second round, defeating Muthana Amin of the Kurdistan Islamic
      Union in a 227–15 vote. (Kurdistan24) (AA)
    - 2026 Grand National
    - In horse racing, I Am Maximus, ridden by Irish jockey Paul Townend, wins this
      year's Grand National at Aintree Racecourse, England, becoming the second horse
      since Red Rum to win the Grand National twice. (BBC News)
    - 2026 Masters Tournament
    - In golf, Shane Lowry becomes the first player to accomplish multiple holes in
      one in the Masters Tournament. (AFP via The Manila Times)
