wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Iranian parliament speaker Mohammad Bagher Ghalibaf says that peace talks with
      the United States will not begin until there is a ceasefire in Lebanon and Iranian
      assets are unfrozen. (Al Jazeera)
    - 2026 Iranian strikes on Arab countries
    - 2026 Iranian strikes on Kuwait
    - The Kuwaiti military reports that several national guard personnel were injured
      by Iranian drones. (Al Jazeera)
    - 2026 Strait of Hormuz crisis
    - The Pakistani military evacuates the crew of a merchant vessel in the Arabian
      Sea following a distress call. (Al Jazeera)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - Israel launches attacks across southern Lebanon and the Bekaa Valley, killing
      at least 21 people, including 13 Lebanese State Security personnel in Nabatieh.
      (Al Jazeera) (AA) (Al Jazeera)
    - Hezbollah fires at least thirty rockets at Kiryat Shmona, Metula, Misgav Am,
      and Ashdod Naval Base in Israel, saying that it was a response to ceasefire
      violations. (Al Jazeera) (Al Jazeera)
    - Israeli chief of staff Eyal Zamir says that the military is in a "state of war"
      in Lebanon despite the ceasefire with Iran, while visiting Israeli troops deployed
      near Bint Jbeil. (AA)
    - Preliminary talks between Lebanese and Israeli officials are planned for next
      week in Washington, D.C., United States. (Al Jazeera)
    - Afghan conflict
    - At least 11 people are killed and several others are injured after gunmen open
      fire in Injil District, Herat Province, Afghanistan. (KabulNow) (BBC News)
    - Over 100,000 Muslims worship at the Al-Aqsa Mosque in Temple Mount, East Jerusalem,
      after it reopens for the first time after Israel closed the site at the start
      of the Gaza war. (Times of Israel)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - Protests over fuel prices are held in Ireland and Norway. (The Guardian)
    - The parliament of South Korea approves a supplementary budget worth ₩26.2 trillion
      (US$17.7 billion) to address the economic effects of the war, which includes
      cash assistance to 35 million South Koreans. (AA)
    - At least ten people are killed, 13 others are injured, and several are reported
      missing when a boat carrying a group of devotees capsizes in the Yamuna river
      in Mathura, Uttar Pradesh, India. (The Times of India)
    - Two people are killed in an explosion at a fireworks warehouse in Vladikavkaz,
      Russia. (The Moscow Times)
    - The remains of the two individuals in a Cessna 172 aircraft, which crashed into
      a mountain in Tubajon, Dinagat Islands, Philippines, while en route to Siargao
      Island in Surigao del Norte on April 8, are recovered by the authorities. (PNA
      via Manila Bulletin) (ABS-CBN News)
    - One person is killed and 27 others are injured after a tourist bus falls off
      a ravine in La Gomera, Canary Islands, Spain. (AP News)
    - An Air Services Limited Cessna 208 Caravan crashes during a national cargo flight
      in Guyana. (Demerara Waves)
    - Cross-strait relations
    - Paramount leader Xi Jinping tells Kuomintang chairwoman Cheng Li-wun that China
      will "absolutely not tolerate" independence for Taiwan, in his first meeting
      with a Taiwanese opposition leader in a decade. (Reuters) (CNBC)
    - International recognition of the Sahrawi Arab Democratic Republic
    - Mali withdraws its diplomatic recognition of the Sahrawi Arab Democratic Republic
      and endorses Morocco's autonomy proposal for Western Sahara. (Reuters)
    - A shooting at the campus bar of Lambton College's Sarnia campus in Sarnia, Ontario,
      Canada, kills one and injures two, with the Sarnia campus closing for the day
      and all activities being suspended. (CBC Windsor)
    - A 20-year old was arrested for throwing a Molotov cocktail at OpenAI CEO Sam
      Altman's home and starting a fire. Altman was uninjured. (The Guardian)
    - 2026 Djiboutian presidential election
    - Djiboutians vote to elect a president to serve for the next five years. Incumbent
      president Ismaïl Omar Guelleh is running for a sixth term. (Al Jazeera) (Reuters)
    - Artemis program
    - NASA's Artemis II spacecraft completes its mission and splashes down in the
      northern Pacific Ocean near San Diego, California, U.S. (The Guardian) (Space.com)
