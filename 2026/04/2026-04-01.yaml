Date: '2026-04-01'
Source_URI: Portal:Current events/2026 April 1
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Iranian President Masoud Pezeshkian releases a letter to the American people and
    suggests that diplomatic engagement is possible. (The New York Times)
  - 2026 Iranian strikes on Israel
  - Ten people are injured, including a girl from Bnei Brak, Israel, who is in critical
    condition, after a missile barrage from Iran. (The Times of Israel)
  - 2026 Iranian strikes on Kuwait
  - A fuel storage at Kuwait International Airport in Farwaniya Governorate, Kuwait,
    is hit by Iranian drones, causing a major fire. (Gulf News)
  - 2026 Iranian strikes on Qatar
  - Iran fires three missiles in Qatar, with two intercepted and a third one hitting
    a oil tanker registered by QatarEnergy. (Khaama Press)
  - 2026 Iranian strikes on the United Arab Emirates
  - A Bangladeshi national is killed by shrapnel during a drone interception in Fujairah,
    United Arab Emirates. (AFP via The Daily Star)
  - A U.S. strike on Tehran reportedly damages the former U.S. embassy, which was
    converted into a museum following its takeover during the Iranian Revolution.
    The St. Nicholas Orthodox Church is also damaged. (Iran International) (AFP via
    The Times of Israel)
  - As confirmed by the U.S. Department of Defense and international media, two more
    MQ-9 Reaper unmanned reconnaissance drones have been shot down over Iranian territory.
    (Iran International) (CBC News)
  - A military official with the Israel Defense Forces says that the Israeli Air Force
    has completed strikes against vital targets in Iran including military and nuclear
    targets. (Ynet)
  - 2026 Lebanon war
  - Israeli airstrikes kill seven people, including the Hezbollah commander for Iraq,
    and injure dozens more in Beirut and nearby Khalde, Lebanon. (AFP via Naharnet)
  - The Israeli military reports a missile launched by Houthi militias is intercepted.
    (The Times of Israel)
  - Russo-Ukrainian war
  - Eastern front of the Russo-Ukrainian war
  - The Russian Defence Ministry says its forces have taken full control of Luhansk
    Oblast in eastern Ukraine. The Ukrainian military denies this claim, saying its
    3rd Assault Brigade continues to hold a small number of positions near the front
    line. (AP)
  - A Russian drone strike kills four civilians in Zolotonosha, Cherkasy Oblast, Ukraine.
    (The New Voice of Ukraine)
  - 2026 Afghanistan–Pakistan conflict
  - It is reported that talks between Pakistan and Afghanistan are held in China in
    an effort to end the current conflict. (Reuters)
  - A boat carrying Afghan migrants capsizes off the coast of Bodrum, Turkey, leaving
    at least 19 people dead, according to the Turkish Coast Guard. Twenty other migrants
    are rescued. (AP)
  - Scam centers in Cambodia
  - Cambodia extradites the former chairperson of Huione Group to China, where law
    enforcement authorities accuse him of involvement in a large-scale online fraud
    and money laundering network linked to Huione. Investigators identify him as an
    associate of suspected crime leader Chen Zhi, who was previously extradited in
    connection with the case. (AFP via The Star)
  - Alice Mina and Vladimiro Selva are sworn in as the new Captains Regent of San
    Marino. (San Marino RTV)
  - Artemis program
  - NASA launches Artemis II from Kennedy Space Center in Florida, United States,
    carrying NASA astronauts Reid Wiseman, Victor Glover, and Christina Koch, along
    with Canadian Space Agency astronaut Jeremy Hansen, for a flyby of the Moon. (BBC
    News)
