Date: '2026-04-02'
Source_URI: Portal:Current events/2026 April 2
Intelligence_Payload:
  Uncategorized:
  - 2026 Iran war
  - 2026 Iranian strikes on Arab countries
  - 2026 Iranian strikes on Bahrain, 2026 Iranian strikes on the United Arab Emirates
  - Minor damage is reported near the Kizad area in Abu Dhabi after the United Arab
    Emirates air defenses successfully intercepts an Iranian missile. (Khaleej Times)
  - Iran conducts strikes on Amazon Web Services servers in Bahrain and on an Oracle
    data center in Dubai, United Arab Emirates. (The Caspian Post)
  - 2026 Strait of Hormuz crisis
  - Iranian Deputy Foreign Minster Kazem Gharibabadi says that Iran and Oman are drafting
    a protocol to oversee maritime transit through the Strait of Hormuz. (Anadolu
    Agency)
  - The United Kingdom hosts a summit with 40 countries to discuss reopening the Strait
    of Hormuz. (Reuters)
  - Austria–United States relations
  - Austria denies U.S. aircraft use of its ‌airspace for military operations against
    Iran. (Reuters)
  - The B1 highway bridge linking Tehran and Karaj, which was inaugurated earlier
    this year, is hit by U.S.–Israeli airstrikes. Eight people are killed and 95 others
    are injured. (Times of Israel) (Al Jazeera)
  - Russo-Ukrainian war
  - Foreign involvement in the Russo-Ukrainian war
  - Kenya reports at least 16 Kenyans are missing after being recruited to fight for
    the Russian military in Ukraine, while 38 others are currently in Russian hospitals
    in unknown conditions as they are under restricted access. Prime Cabinet Secretary
    Musalia Mudavadi says the men were offered a $2,700 monthly salary by Russian
    agents for joining the war. (BBC News)
  - An Antonov An-72 is destroyed in a Ukrainian strike on Kirovske Air Base in Kirovske
    Raion, Russian occupied Crimea. (The Kyiv Independent)
  - Sudanese civil war
  - Two Rapid Support Forces drones hit the Al-Jabalain hospital in White Nile State
    killing 10, including seven medical staff. (medecins sans frontieres)
  - Economic impact of the 2026 Iran war
  - Air China, China Southern Airlines, and its subsidiary XiamenAir increase fuel
    surcharges by ¥60–120 (US$8.70–17.50) on domestic flights in response to rising
    oil prices linked to the Iran war. (AFP via The Standard)
  - United States crude oil surges to over US$113 per barrel. (NBC News)
  - 2026 North Maluku earthquake
  - One person is killed and another is injured when a building in Manado, North Sulawesi,
    Indonesia, collapses following a 7.4-magnitude earthquake that struck eastern
    Indonesia. (AFP via France 24)
  - A cargo Beechcraft 18 crashed near the Barangay Decalacho airport, Philippines.
    Both occupants were killed. (Xinhua)
  - Moldova–Russia relations, Accession of Moldova to the European Union
  - Moldova's parliament approves the country's withdrawal from the Commonwealth of
    Independent States, as Moldova's government says CIS's core values and principles
    are no longer respected, particularly with regard to territorial integrity and
    the inviolability of borders and refer to the actions of the Russian Federation
    in the region, including the war against Ukraine and the illegal military presence
    on the territory of Moldova. (Moldova Press) (TASS)
  - Argentina–Iran relations
  - Argentina orders Iranian chargé d'affaires Mohsen Soltani Tehrani to leave the
    country within 48 hours after Iranian officials issued statements that Argentina
    described as false and offensive. The move follows Argentina's designation of
    the Islamic Revolutionary Guard Corps as a terrorist organization. (AFP via LBCI)
  - 2025 Drents Museum heist
  - Dutch authorities recover the Helmet of Coțofenești and other treasures from the
    Dacian royal collection, which were stolen from the Drents Museum in Assen, Drenthe,
    in 2025. (AFP via CTV News)
  - Kampala school stabbing
  - Four children are killed in a mass stabbing at a school in Kampala, Uganda. The
    perpetrator, an adult man, is arrested. (Al Jazeera)
  - Second cabinet of Donald Trump
  - U.S. president Donald Trump dismisses Pam Bondi as Attorney General, with Deputy
    Attorney General Todd Blanche replacing her on an acting basis. (CNN)
