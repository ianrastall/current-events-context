Date: '2026-04-30'
Source_URI: Portal:Current events/2026 April 30
Intelligence_Payload:
  Uncategorized:
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - 2026 Israel–Lebanon ceasefire
  - Israel carries out a series of airstrikes across multiple locations in Lebanon,
    killing at least 28 people. (Al Jazeera)
  - Mali War
  - 2026 Mali attacks, Mali–Russia relations
  - Russia says that it will continue its military presence in Mali to provide assistance
    to the Malian government. (Reuters)
  - World War II bomb disposal in Europe
  - More than 1,000 homes are evacuated in Plymouth, England, following the discovery
    of an unexploded World War II-era German SC250 bomb on a building site. (Sky News)
  - 61st Venice Biennale
  - The jury of the Venice Biennale in Italy resigns ahead of the exhibition's opening,
    amid disagreement involving the government over Russia's participation. (CP via
    Lethbridge Herald)
  - Reporters Without Borders reports that global press freedom has declined to its
    lowest level since the index began in 2002, with more than half of countries classified
    under severe conditions and the share of the world's population living in countries
    with strong press freedom falling to below one percent. (AFP via France 24)
  - 2026 Tuapse oil terminal disaster
  - Residents of Tuapse in Krasnodar Krai, Russia, upload videos to social media appearing
    to show oil raining from the sky as authorities say the fire at the Tuapse oil
    terminal has now been extinguished after days of burning. (CTV News)
  - Camp Mystic in Texas, U.S., withdraws an application to reopen during the summer
    in the wake of the floods last year. (NBC News)
  - United States–Venezuela relations, Aftermath of the 2026 United States intervention
    in Venezuela
  - The first direct commercial flight from the United States to Venezuela in seven
    years arrives at the Simón Bolívar International Airport in Caracas. (AP)
  - 2026 Foss High School stabbing
  - A mass stabbing occurs at Henry Foss High School in Tacoma, Washington. At least
    four students and a security guard are injured, four seriously. The suspect, also
    injured, has been taken into custody. The school remains in lockdown. (KTVZ News)
  - Kampala school stabbing,
  - 38-year-old Christopher Okello Onyum is sentenced to death by hanging for the
    murders of four children at a nursery school on April 2 in Kampala, Uganda. (BBC
    News)
  - China announces it will ban the sale or renting of commercial drones in Beijing,
    while existing drone owners will also be required to register their devices with
    the police, citing security concerns. (BBC News)
  - Myanmar's president Min Aung Hlaing orders the remaining prison sentence of deposed
    leader Aung San Suu Kyi to be served under house arrest and announces a one-sixth
    reduction of sentences for all prisoners, including Aung San Suu Kyi. (AFP via
    CNA) (AFP via Taipei Times)
  - 2026 Antiguan general election
  - Antiguans and Barbudans vote to elect 17 members of the House of Representatives.
    Incumbent prime minister and Labour leader Gaston Browne, who is running for a
    fourth term, is being challenged by United Progressive leader Jamale Pringle.
    (Reuters)
  - 2026 United States federal government shutdowns
  - The U.S. House of Representatives unanimously approves a bill passed by the Senate
    to fund the Department of Homeland Security, the Secret Service, the Coast Guard,
    FEMA, TSA, and the Cybersecurity and Infrastructure Security Agency in an effort
    to end the 76-day government shutdown. (AP) (Politico)
  - Censorship in Russia
  - Russia announces the creation of a censorship council. (The Moscow Times in Russian)
  - The Pakistan Navy commissions the first Hangor-class submarine, the PNS/M Hangor,
    at a ceremony in Sanya, China. (Daily Pakistan)
  - American company Cloudflare states that Russian messenger app Max is a spyware
    app. (Ukrainian News)
