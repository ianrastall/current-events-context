Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2026 Strait of Hormuz crisis
  - 2026 Strait of Hormuz campaign, Naval blockade of Iran
  - In a notice to seafarers, the U.S. Central Command announces that a blockade is
    now in effect, with all unauthorized vessels in the Gulf of Oman and the Arabian
    Sea east of the Strait of Hormuz subject to interdiction. (Al Jazeera)
  - Three ships successfully cross the Strait of Hormuz since the blockade was announced
    including Marshall Islands-flagged vessel New Future, Vietnam-flagged NV Sunshine,
    and Panama-flagged tanker Auroura, which was recently sanctioned by the United
    States for its links to Iranian oil trading. (Bloomberg) (Caspian Post)
  - 2026 Iran war ceasefire
  - Pakistani Prime Minister Shehbaz Sharif says that the ceasefire is still in force
    and efforts are still underway to end the war despite the recent talks ending
    without an agreement. (Arab News PK)
  - Hezbollah–Israel conflict
  - 2026 Lebanon war
  - Battle of Bint Jbeil (2026)
  - The Israeli army claims to have killed over 100 Hezbollah fighters during the
    battle in Bint Jbeil. (Al Jazeera)
  - At least six people are killed by Israeli airstrikes across southern Lebanon,
    including at an International Red Cross location in Tyre. (Al Jazeera)
  - Insurgency in Khyber Pakhtunkhwa
  - A policeman is killed and four others are injured during an attack in Hangu, Khyber
    Pakhtunkhwa, Pakistan. (Dunya News)
  - 2026 Cuban crisis
  - Spanish airline Iberia announces the suspension of flights to Cuba from June to
    late October due to fuel supply constraints and reduced passenger demand linked
    to the U.S.-imposed oil blockade of the country. The airline states that it plans
    to resume operations in November if conditions improve. (AFP via The Economic
    Times)
  - 2026 Philippine energy crisis
  - Philippine president Bongbong Marcos suspends excises on kerosene and liquefied
    petroleum gas to reduce household fuel costs amid rising global oil prices linked
    to the Iran war. (Reuters)
  - Chinese property sector crisis
  - A court in Beijing, China, orders the liquidation of Zhongzhi Enterprise Group
    and more than 300 affiliated companies through a consolidated bankruptcy process,
    with creditors instructed to submit claims by June 10. (Reuters)
  - Algeria–Holy See relations, Pastoral visits of Pope Leo XIV
  - Pope Leo XIV arrives in Algiers, marking the first papal visit to Algeria. He
    will visit Souk Ahras, the birthplace and home of St. Augustine of Hippo, namesake
    of the Augustinian Order, which Pope Leo is a part of. (AP)
  - Iran–Russia relations, Russia in the 2026 Iran war
  - Kremlin press secretary Dmitry Peskov states that Russia is prepared to receive
    Iran's enriched uranium as part of a potential agreement with the United States,
    following unsuccessful negotiations between Iran and the U.S. (AFP via Philippine
    Daily Inquirer)
  - Corruption in Spain
  - Begoña Gómez, wife of Spanish prime minister Pedro Sánchez, is charged with influence
    peddling and corruption in the private sector. (Bloomberg)
