wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Pakistan in the 2026 Iran war
    - A Pakistani delegation led by military chief Asim Munir arrives in Tehran, Iran,
      to facilitate the continuation of diplomacy between Iran and the United States.
      (Al Jazeera)
    - Pakistani prime minister Shehbaz Sharif arrives in Jeddah to begin a four-day
      diplomatic trip through Saudi Arabia, Qatar, and Turkey to push for a second
      round of Iran–U.S. peace talks. (Arab News PK)
    - The U.S. says that it has not formally agreed to extend the ceasefire, although
      there is ongoing engagement between Iran and the U.S. towards a peace deal.
      (Al Jazeera)
    - 2026 Strait of Hormuz crisis
    - 2026 Strait of Hormuz campaign
    - The U.S. Central Command reports that ten vessels have been turned around since
      the start of the naval blockade of Iran. (NBC News)
    - Iran's military headquarters threatens to close the Red Sea in addition to the
      strait if the U.S. naval blockade continues. (Al Jazeera)
    - A U.S. official says that over 10,000 additional U.S. military personnel, including
      sailors aboard and the 11th Marine Expeditionary Unit on the Boxer Amphibious
      Ready Group, will arrive in the region later this month. (AA)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - Israeli attacks on the Lebanese health sector during the Israel-Hezbollah conflict
    - At least three paramedics are killed, six others are injured, and one remains
      missing after Israeli strikes hit incident response teams in Mayfadoun, Nabatieh
      Governorate, Lebanon. (AFP via LBCI)
    - 2026 Israel–Lebanon peace talks
    - The Israeli security cabinet convenes and does not make a decision about a ceasefire
      in Lebanon, following the previous day's negotiations. (Times of Israel) (Axios)
    - At least 13 people are killed by Israeli attacks across Lebanon. (Al Jazeera)
    - Lebanon's health ministry updates the total casualties to 2,167 killed and 7,061
      injured. (Al Jazeera)
    - Israeli military chief of staff Eyal Zamir says that Israel has approved plans
      for the continuation of military action in both Iran and Lebanon. (Al Jazeera)
    - Sudanese civil war
    - Darfur campaign
    - A drone strike in West Darfur kills three people including Chadian nationals
      at a border crossing. (Sudan Tribune)
    - The civil war in Sudan between the Sudanese Armed Forces and Rapid Support Forces
      enters its fourth year. (AP)
    - War on drugs
    - Operation Southern Spear, United States strikes on alleged drug traffickers
      during Operation Southern Spear
    - Three people are killed in an airstrike carried out by the United States Navy
      against an alleged drug boat in the eastern Pacific. (Reuters)
    - 2026 Afghanistan–Pakistan War
    - Taliban authorities say that the Markazi High School in the Dangam district,
      Afghanistan, is damaged by rocket strikes from Pakistan. (KabulNow)
    - Russian sabotage operations in Europe
    - Swedish civil defence minister Carl-Oskar Bohlin reports that the Swedish Security
      Service had prevented a cyberattack on a thermal power station in West Sweden
      in mid-2025, identifying the perpetrators as a group linked to Russian intelligence,
      with no significant disruption to operations. (AFP via Macau Business)
    - Economic impact of the 2026 Iran war
    - 2026 Iran war fuel crisis
    - China–Russia relations, China in the 2026 Iran war, Russia in the 2026 Iran
      war
    - Russian foreign minister Sergey Lavrov states that Russia can supply energy
      to China and other countries affected by disruptions in shipments through the
      Strait of Hormuz amid the Iran war. (AFP via CNA)
    - Iraq–Syria relations, Iraq in the 2026 Iran war, Syria in the 2026 Iran war
    - Syria begins loading the first tanker carrying Iraqi oil at the Baniyas Refinery
      for export by sea under a bilateral arrangement to reroute shipments amid disruptions
      to maritime traffic through the Strait of Hormuz. (AFP via SpaceWar.com)
    - Norway records its highest-ever crude oil export value in March, reaching 57.4
      billion kroner (US$6.08 billion) for 56.6 million barrels, contributing to a
      trade surplus of 97.5 billion kroner ($10.3 billion) amid a global fuel crisis.
      (Bloomberg)
    - South Korea secures imports of 273 million barrels of crude oil (by the end
      of the year) and 2.1 million tons of naphtha through alternative routes that
      bypass the Strait of Hormuz, providing several months of supply amid disruptions
      linked to the Iran war. (AFP via SpaceWar.com)
    - The Iraqi transport ministry announces that Iraqi Airways will resume flights
      to Dubai, United Arab Emirates, beginning tomorrow and Istanbul, Turkey, on
      Saturday. (Iraqi News)
    - The BBC announces that it will cut between 1,800 and 2,000 jobs, around 1-in-10
      employees, citing the need to address "significant financial pressures". (Variety)
    - Shoe company Allbirds announces it will be pivoting to providing computing infrastructure
      for artificial intelligence, with plans to rename itself to "NewBird AI". The
      company's shares rose nearly 600% on the news. (CNBC)
    - Six people are killed in a collapse at a gold mine in Red Sea State, Sudan.
      (Sudan Tribune)
    - Five people are killed in a fire at an IDP camp in Central Darfur, Sudan. (Sudan
      Tribune)
    - Evacuations during the 2026 Iran war, Iran–Sri Lanka relations, Sinking of IRIS
      Dena
    - Sri Lanka repatriates 238 Iranian sailors from the IRIS Bushehr and the wrecked
      IRIS Dena, after providing temporary shelter on humanitarian grounds. (AFP via
      The Straits Times)
    - Humanitarian impact of the Sudanese civil war
    - Donors pledge €1.3 billion (US$1.5 billion) in foreign aid for Sudan at an international
      conference in Berlin, Germany, marking the fourth anniversary of the beginning
      of Sudan's civil war, as participants also discuss efforts to advance ceasefire
      negotiations. (Al Jazeera)
    - North Korea and weapons of mass destruction
    - International Atomic Energy Agency director general Rafael Grossi reports increased
      activity at multiple nuclear facilities in North Korea, including the Nyongbyon
      site, indicating expanded capacity to produce nuclear weapons. (AFP via ABS-CBN
      News)
    - Israel–Somaliland relations, International recognition of Somaliland
    - Israel appoints Michael Lotem as the first Israeli ambassador to Somaliland,
      months after Israel officially recognised the breakaway region in Somalia. Lotem
      previously served as the Israeli ambassador to Kenya. (Al Jazeera) (Garowe Online)
      (Horseed Media)
    - 2026 Onikişubat school shooting
    - Nine people are killed and 13 others are injured in a mass shooting at a school
      in Onikişubat, Kahramanmaraş Province, Turkey. The perpetrator dies by suicide.
      It is the deadliest school shooting in Turkish history. (Reuters)
    - Antisemitism in the United Kingdom
    - Two people are arrested in Watford on suspicion of arson in an attempted attack
      on Finchley Reform Synagogue in North Finchley, London, England. The Metropolitan
      Police are treating the attempted attack as a hate crime. (BBC) (Politico)
    - Chinese intelligence activity abroad
    - A Taiwanese court sentences six current and former military personnel to prison
      terms of four and a half to eight and a half years for espionage offenses, including
      organizing networks and transmitting classified information to individuals linked
      to China. (AFP via The Edge)
    - Corruption in Papua New Guinea
    - Papua New Guinea tightens security at military bases and imposes movement restrictions
      after a group of soldiers sets up roadblocks in Port Moresby to protest alleged
      irregularities in army recruitment linked to former defence minister Billy Joseph,
      who is under investigation. (AFP via SpaceWar.com)
    - Organised crime in Indonesia
    - Indonesian police announce the arrest of six suspects for trafficking endangered
      Komodo dragons sourced from East Nusa Tenggara and intended for export to Thailand,
      and detain two additional individuals for smuggling pangolin scales. (AFP via
      The Straits Times)
    - Gabonese intelligence agents arrest former prime minister and opposition figure
      Alain Claude Bilie By Nze at his residence over an alleged unpaid debt linked
      to a 2008 public event. (AP)
    - A court in Nairobi, Kenya, sentences a Chinese national to one year in prison
      and imposes a fine after he pleads guilty to attempting to smuggle more than
      2,200 ants out of Kenya without authorization. (AFP via CP24)
    - Two Filipino household workers are shot dead by their employer during a hostage
      incident at a residence in Beirut, Lebanon, and police arrest the suspect. (Gulf
      News)
    - Reactions to the 2026 Iran war
    - The U.S. Senate rejects the War Powers Resolution by a 52–47 vote in the fourth
      Democratic-led attempt to stop hostilities until they are authorized by the
      U.S. Congress. (Reuters)
    - Christine Fréchette is sworn in as Premier of Quebec, Canada, succeeding François
      Legault. (The Gazette)
