  - The first public trial of officials linked to former Syrian president Bashar al-Assad
    opens in Damascus with Atef Najib, former head of security in Daraa Governorate,
    the only one present to stand trial. Bashar and his brother Maher are to be tried
    in absentia. (AP)
  - 2026 Israeli legislative election
  - Former Israeli prime ministers Naftali Bennett of Bennett 2026 and Yair Lapid
    of Yesh Atid merge their parties into Together – Led by Bennett in an effort to
    oust Benjamin Netanyahu in the upcoming elections. The two also leave space open
    for Yashar chair Gadi Eisenkot. (Jerusalem Post) (Politico)
  - 2026 Central Tibetan Administration general election
  - Exiled Tibetans vote in a global election organized by the Central Tibetan Administration
    to choose representatives to its parliament, with polling held in multiple countries
    outside China. (AFP via France 24)
  - 2026 LPGA Tour
  - 2026 Chevron Championship
  - In golf, Nelly Korda wins the Chevron Championship at Memorial Park in Houston,
    Texas, United States, by five strokes to secure her third major title and regain
    the world number one ranking. (AFP via The Manila Times)
  - 2026 NASCAR Cup Series
  - 2026 Jack Link's 500
  - In stock car racing, a 26-car pileup occurs during the Jack Link's 500 at the
    Talladega Superspeedway in Alabama, U.S., after driver Bubba Wallace was pushed
    from outside. (Hindustan Times)
  - 2026 London Marathon
  - Sabastian Sawe and Yomif Kejelcha become the first people to run a marathon in
    under two hours, with Sawe setting a new world record of 1:59:30. Tigst Assefa
    also sets a new world record for a women-only marathon at 2:15:41. (AP)
