  - Russo-Ukrainian war
  - North Korean involvement in the Russo-Ukrainian war, North Korea–Russia relations
  - Russian defence minister Andrey Belousov and State Duma chairman Vyacheslav Volodin
    visit Pyongyang, North Korea, inaugurating a memorial to North Korean troops who
    died fighting against Ukraine and negotiating a new defense cooperation agreement
    set to run until 2031. (DW) (Reuters)
  - Human rights in Ba'athist Syria, War crimes in the Syrian civil war, National
