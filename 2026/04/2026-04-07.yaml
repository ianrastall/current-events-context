Date: '2026-04-07'
Source_URI: Portal:Current events/2026 April 7
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - Pakistan in the 2026 Iran war
  - Islamabad Accord (2026)
  - U. S. President Donald Trump announces on his Truth Social that, based on conversations
    with Prime Minister Shehbaz Sharif and Field Marshal Asim Munir of Pakistan, that
    he has agreed to "suspend the bombing and attacks on Iran for a period of two
    weeks", subject to Iran agreeing to the "complete, inmediate and safe opening"
    of the Strait of Hormuz, and to allow time for an agreement to be reached. (Axios)
  - Iranian ambassador to Pakistan Reza Amiri-Moghaddam says that the Pakistan-mediated
    framework aimed at a ceasefire to end the war has reached a "critical, sensitive
    stage". (WIOnews) (ARY News)
  - Pakistani Prime Minister Shehbaz Sharif calls on U.S. President Donald Trump to
    extend his deadline for Iran to reopen the Strait of Hormuz by two weeks. White
    House Press Secretary Karoline Leavitt says that Trump has been made aware of
    the plan. (The Jerusalem Post) (Axios)
  - Trump tells Fox News that the United States is in "heated negotiations" with Iran
    after being briefed about the proposal. (CBS News)
  - It is reported that U.S. Vice President JD Vance would serve as the U.S. interlocutor
    in ceasefire talks. (CBS News)
  - Trump warns that "a whole civilization will die tonight" and will "never be brought
    back" if Iran does not agree to a deal by noon (GMT). (AP) (Reuters)
  - Following Trump's threat that "a whole civilization will die tonight" if a deal
    isn't reached, Democrats in the U.S. House of Representatives and former Republican
    congresswoman Marjorie Taylor Greene call for the invocation of the 25th amendment
    of the United States Constitution. Additionally, Democrats also call for Trump
    to be impeached. (Axios)
  - The New York Times reports that Iran has ended direct contact with the United
    States in response to Trump's latest threat to "end its civilization". However,
    Iranian newspaper Tehran Times pushes back on the reports by stating on X that
    "diplomatic and indirect channels of talks with US are not closed". (AA) (Bloomberg)
    (Iran International)
  - U.S. Vice President JD Vance in Hungary says that the war in Iran will conclude
    "very shortly", claiming that the U.S. military has achieved all objectives. (Middle
    East Monitor)
  - 2026 Strait of Hormuz crisis
  - Russia and China veto a United Nations Security Council resolution calling on
    states to "coordinate efforts, defensive in nature" to ensure the safety of navigation
    in the Strait of Hormuz, saying that it was biased against Iran. The U.S. and
    France condemn the veto. (Reuters via Al Jazeera)
  - 2026 Iranian strikes on Arab countries
  - Iran threatens to launch massive retaliatory strikes against the energy infrastructure
    of Saudi Arabia and the UAE in the event of a U.S. attack on its power plants.
    (MarketScreener)
  - Saudi Arabia closes the King Fahd Causeway to Bahrain for several hours after
    the Iranian Fars News Agency has published a list of strategic bridges in the
    Gulf region as potential targets for retaliation. (Al Jazeera)
  - 2026 Iranian strikes on Saudi Arabia
  - Iranian drones strike a SABIC petrochemical complex in Jubail, Saudi Arabia, causing
    a fire. (AFP via The Times of Israel)
  - 2026 Iranian strikes on the United Arab Emirates
  - An Iranian ballistic missile strikes a Thuraya building in the Emirate of Sharjah,
    United Arab Emirates, injuring two Pakistani nationals. (Al Jazeera)
  - 2026 Iranian strikes on Qatar
  - Four people are injured by falling debris in Muraikh, Qatar, after the Qatari
    military intercepts Iranian missiles. (Al Jazeera)
  - Iraq in the 2026 Iran war, 2026 United States–Israeli conflict with pro-Iranian
    Iraqi militias
  - Kata'ib Hezbollah announces the release of Shelly Kittleson, an American journalist
    who was kidnapped by gunmen in Baghdad on March 31st. The group's condition for
    Kittleson's freedom is her departure from Iraq. (The Jerusalem Post)
  - 35 people are killed in attacks across Iran. (Al Jazeera)
  - Reports indicate nighttime attacks in the greater Tehran area, in Ahvaz, Chahbahar,
    Jask, Shiraz, and Yazd, as well as near Shahid Kalantari Port, Tis Port, and the
    Imam Ali base. (Iran International)
  - The semi-official Mehr News Agency reports that a suspected Israeli–U.S. missile
    struck a synagogue in central Tehran. (Dawn)
  - Israeli Prime Minister Benjamin Netanyahu says that Israel has struck bridges
    and railways in Iran allegedly used by the Islamic Revolutionary Guard Corps.
    (The Jerusalem Post)
  - U.S. and Israeli warplanes strike Iranian military targets on Kharg Island that
    results in several massive explosions. (Metro) (NBC News)
  - At least five people are killed after a rocket fired from Kuwait landed in Basra,
    southern Iraq. (Shafaq)
  - 2026 Lebanon war
  - Three people are killed and several are injured by an Israeli airstrike in Maarakah,
    Tyre District, Lebanon. (Daily Sabah)
  - One person is killed by an Israeli drone strike in Deir ez-Zahrani, Nabatieh District,
    Lebanon. (Daily Sabah)
  - One person is killed by an Israeli strike in Zebdin, Nabatieh District, Lebanon.
    (Daily Sabah)
  - The Israeli military says that 36 soldiers were injured over the past two days,
    bringing the total casualties to 411. (Al Jazeera)
  - Israel deploys the 98th Division to southern Lebanon, raising the force there
    to five divisions. (AA)
  - 2026 Afghanistan–Pakistan conflict
  - The Afghan Foreign Ministry says that talks between the Taliban–led government
    of Afghanistan and Pakistan in Ürümqi, China, to end the conflict have been "useful".
    (ABC News)
  - Terrorism in Turkey
  - 2026 attack on Israeli consulate in Turkey
  - One gunman is killed, while two other perpetrators and two policemen are injured
    in a shootout outside of the Israeli consulate in Istanbul, Turkey. The two injured
    perpetrators have been captured and detained by police. (Al Jazeera)
  - This year's Wireless Festival in London, England, is cancelled and all tickets
    are refunded after its headliner, American rapper Kanye West, is banned from entering
    the United Kingdom by the Home Office on the grounds that "his presence would
    not be conducive to the public good" amid controversy over his past antisemitic
    comments on Jews and Adolf Hitler, and his association with neo-Nazis. (BBC News)
    (CNN)
  - Mediterranean Sea migrant smuggling
  - The International Organization for Migration reports that at least 990 deaths
    have been recorded in 2026 across the Mediterranean Sea, making it one of the
    deadliest starts to a year since 2014, with over 180 people feared dead or missing
    in the latest shipwrecks since 28 March. (IOM)
  - A TGV train collides with a military lorry on a level crossing at Nœux-les-Mines,
    France. The train driver is killed and 27 people are wounded. (Liverpool Echo)
  - The death toll from natural disasters, including heavy rain, storms and floods,
    rises to 188 in Afghanistan and Pakistan. (Brecorder)
  - Iraq–Kuwait relations
  - Protestors storm the Kuwaiti consulate in Basra, Iraq, after a rocket attack launched
    from Kuwait killed three people in Basra. (Turkiye Today)
  - War crimes in Afghanistan
  - Australian Army veteran and Victoria Cross recipient Ben Roberts-Smith is arrested
    by police at Sydney Airport for alleged war crimes committed between 2009 and
    2012 during his deployment to Afghanistan. (Reuters)
  - Corruption in South Sudan
  - South Sudan President Salva Kiir Mayardit sacks National Legislative Assembly
    speaker Jemma Nunu Kumba and her deputy Parmena Awerial Aluong after his ruling
    party backed a no-confidence vote accusing them of corruption and mismanagement.
    (Pan African Visions)
  - Protests against the 2026 Iran war
  - Protests against the 2026 Iran war in the United States
  - Activists in San Francisco, California organize an emergency anti-war rally at
    the Federal Building to protest against Trump’s threats and rhetoric of military
    action against Iranian infrastructure and nuclear power plants. (National Today)
  - Iran calls on the population to form human chains around critical infrastructure
    such as power stations and bridges ahead of a U.S. deadline that threatens their
    destruction. (The Hill)
  - Human chain protests are held across bridge and power plant structures in Iran
    to protest against Trump's threats against civilian infrastructure. (The Telegraph
    UK)
  - Citizens in Ilam, Ilam province, Iran form a human chain protest against Trump's
    threats against key infrastructure in the country. (Away The Voice)
  - 2026 United States House of Representatives elections
  - Amidst the Iran war, a special election between Democrat Shawn Harris and Republican
    Clayton Fuller is held in Georgia's 14th congressional district to replace former
    U.S. Rep. Marjorie Taylor Greene. (ABC News)
  - The National Assembly of Vietnam re-elects General Secretary of the Communist
    Party of Vietnam Tô Lâm as president for the 2026–2031 tenure. (Xinhua)
