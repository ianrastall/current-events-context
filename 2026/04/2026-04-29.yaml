wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - 2026 Iran war
    - Antisemitism during the 2026 Iran war
    - 2026 London antisemitic attacks
    - 2026 Golders Green attack
    - Two Jewish men are injured in a stabbing attack in Golders Green, London, England,
      which police describe as a terrorist attack. A 45-year-old man is arrested,
      and a political motive is being investigated. (The Guardian)
    - The Islamist group Harakat Ashab al-Yamin al-Islamia takes responsibility for
      the attack. (i24NEWS TV)
    - 2025–2026 Iran–United States negotiations
    - 2026 Iran war ceasefire
    - Anadolu Agency reports that Pakistan is working silently to break the ongoing
      deadlock between the Iran and the United States in ceasefire talks, including
      finding a new "formula" for an agreement on the Strait of Hormuz and Tehran's
      nuclear program. (Pakistan Today)
    - United States president Donald Trump says that he rejected an Iranian offer
      to end the Strait of Hormuz closure in exchange for lifting the naval blockade
      of Iran, and that the blockade will continue until an agreement is reached on
      Iran's nuclear program. (Axios)
    - 2026 Strait of Hormuz crisis
    - Japanese prime minister Sanae Takaichi confirms that the Japan-flagged crude
      oil tanker Idemitsu Maru has successfully crossed the Strait of Hormuz, making
      it the first direct passage of a Japanese oil tanker to cross the waterway since
      the war began on February 28. (AFP via AA) (The Chosun Ilbo) (Newsweek)
    - 2026 United States military buildup in the Middle East
    - The Washington Post reports that the USS Gerald R. Ford will exit the Middle
      East and return to the U.S. state of Virginia in the coming days around mid-May
      after spending 10 months at sea. (The Washington Post) (The Times of Israel)
      (WTKR)
    - Hezbollah–Israel conflict
    - 2026 Lebanon war
    - 2026 Israel–Lebanon ceasefire
    - A Lebanese soldier and his brother are killed in an Israeli airstrike in Bint
      Jbeil. (Reuters)
    - Russo-Ukrainian war
    - Attacks in Russia during the Russo-Ukrainian war
    - Three people are killed and eight others are injured in a Ukrainian drone strike
      on a passenger bus in Voznesenovka, Belgorod Oblast, Russia. (AFP via Al-Arabiya)
    - A Ukrainian SBU drone strikes an oil refinery near Perm, Perm Krai, Russia,
      causing a large fire at the facility. (AP)
    - Peace negotiations in the Russo-Ukrainian war
    - During a phone call with U.S. president Donald Trump, Russian president Vladimir
      Putin offers a ceasefire for Victory Day on May 9. (The Moscow Times) (Kyiv
      Independent)
    - Insurgency in Sistan and Balochistan
    - Three police officers are killed and another is injured in a mass shooting when
      gunmen open fire on a police patrol in Zahedan, Sistan and Baluchestan province,
      Iran. (Al Jazeera)
    - American technology company Alphabet Inc. announces a $40 billion investment
      into artificial intelligence (AI) company Anthropic. (Reuters)
    - Finnish elevator manufacturer Kone announces the acquisition of its German competitor,
      TK Elevator, in a €29.4 billion (US$34.4 billion) deal, described by Bloomberg
      L.P. as one of Europe's largest private equity-related takeovers and the largest
      corporate acquisition in Finland. (AFP via Barron's) (Bloomberg)
    - At least 16 people, including 6 children and 7 women, are killed, and around
      25 others are injured after a pickup truck carrying 46 laborers overturns and
      collides with an SUV in Dhar, Madhya Pradesh, India. (Hindustan Times) (Awaz
      The Voice) (The Statesman)
    - Seven people are killed and four others are injured after a wall collapses at
      a hospital in Bengaluru, Karnataka, India. (Reuters)
    - Two people are killed and 11 others are injured when a Diamond DA42 Twin Star
      crashes into a hangar at Parafield Airport in South Australia. (BBC News)
    - A barge carrying Timmy, a humpback whale that has been stranded off Germany's
      coast in the Baltic Sea for several weeks, departs for the North Sea where Timmy
      is set to be freed. Mecklenburg-Vorpommern environment minister Till Backhaus
      says the whale is showing signs of good health. (AP)
    - Japan–New Zealand relations
    - A local board in the Auckland Region of New Zealand rejects a proposal to install
      a memorial statue for World War II-era comfort women in Takapuna following public
      consultation and diplomatic representations from Japan. (AFP via ABS-CBN News)
    - Gerrymandering in the United States
    - Louisiana v. Callais
    - The United States Supreme Court rules that Louisiana's new redistricting map
      from 2024 is an unconstitutional racial gerrymander under the Fifteenth Amendment
      to the Constitution. (AP) (Reuters)
    - 14th floor case
    - The Thai corrections department approves the early release of former prime minister
      Thaksin Shinawatra, who is serving a one-year prison sentence for corruption,
      citing his age and the limited time remaining on his sentence, with his release
      subject to probation conditions. (AFP via France 24)
    - Arrest of Yoon Suk Yeol
    - The Seoul High Court increases former South Korean president Yoon Suk Yeol's
      sentence to seven years in prison for obstruction of justice and abuse of power,
      citing his use of presidential security personnel to interfere with his arrest
      and other actions. (AFP via France 24)
    - Crime in the United Arab Emirates, China–United Arab Emirates relations, United
      Arab Emirates–United States relations
    - Police in Dubai, United Arab Emirates, arrest 276 individuals linked to a transnational
      fraud network in a joint operation with the U.S. Federal Bureau of Investigation
      and Chinese police, targeting multiple criminal groups and dismantling several
      scam centers involved in investment and cryptocurrency scams. (AFP via Arab
      News)
    - Mexican drug war
    - The United States charges Rubén Rocha Moya, the current governor of Sinaloa,
      Mexico, and nine other current and former politicians, with alleged drug and
      weapons trafficking charges and allegedly working with Mexican cartels, including
      Los Chapitos, a faction of the Sinaloa Cartel. (CNN)
    - A 21-year-old is detained in Rome, Italy, for shooting and wounding two people
      with a non-lethal airsoft gun during the celebrations for Liberation Day four
      days ago. The suspect claims to be affiliated with the Jewish Brigade, whose
      representatives deny his involvement with the group. (Il Messaggero in Italian)
    - Pentagon UFO videos
    - U.S. president Donald Trump says his administration will be soon releasing more
      classified files and videos related to UFOs and "related material", adding that
      he had spoken to air force pilots who had seen "things you wouldn't believe".
      (Reuters) (NDTV)
    - The Brazilian federal senate rejects attorney general Jorge Messias's nomination
      to the Supreme Federal Court in a 42–34 secret ballot, marking the first such
      rejection in more than a century. (AFP via Firstpost)
