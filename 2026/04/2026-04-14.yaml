Source_URI: Portal:Current events/2026 April 14
Intelligence_Payload:
  Uncategorized:
  - Middle Eastern crisis
  - 2026 Iran war
  - 2025–2026 Iran–United States negotiations
  - 2026 Iran war ceasefire
  - Iranian president Masoud Pezeshkian tells French president Emmanuel Macron that
    the Islamabad Talks did not lead to a deal because the United States took "maximalist
    positions" and had a "lack of goodwill". (Al Jazeera)
  - Pakistani prime minister Shehbaz Sharif says that he will visit fellow mediators
    in Riyadh, Saudi Arabia, and Ankara, Turkey, to push for a second round of talks
    between Iran and the U.S. (Al Jazeera)
  - U.S. president Donald Trump reportedly tells the New York Post that a second round
    of talks between Iran and the U.S. could occur within the next two days. (CNBC)
  - 2026 Strait of Hormuz crisis
  - At least three oil tankers pass through the strait, including the Panama-flagged
    Peace Gulf, which took the new route through Iranian waters as instructed by the
    Islamic Revolutionary Guard Corps. (Al Jazeera)
  - Saudi Arabia asks the U.S. to end its naval blockade of the strait. (AA)
  - 2026 Lebanon war
  - 2026 Israel–Lebanon peace talks
  - Israeli and Lebanese officials meet in Washington, D.C., U.S., for the first direct
    peace talks between the countries in decades, with Israel prioritizing Hezbollah's
    disarmament and Lebanon limiting its mandate to ceasefire discussions. (AFP via
    The Economic Times)
  - At the Washington meeting, Israeli and Lebanese officials agree to begin direct
    negotiations in the future. (AA)
  - Three people are killed by an Israeli raid in Adloun, Sidon District, Lebanon.
    (Al Jazeera)
  - Gaza war
  - Four people, including a three-year-old, are killed and nine others injured in
    an Israeli airstrike on a police vehicle in Gaza City. (Reuters)
  - Two people, including a 14-year-old, are killed by Israeli gunfire in North Gaza
    Governorate. (Reuters)
  - Sudanese civil war
  - Darfur campaign
  - Médecins Sans Frontières reports two deaths and 56 injuries following five drone
    strikes by the Sudanese military in West Darfur and Central Darfur, Sudan. (ReliefWeb)
  - United Nations Under-Secretary-General for Humanitarian Affairs and Emergency
    Relief Coordinator Tom Fletcher reports that around 700 people have been killed
    in drone strikes in Sudan since the year started as the conflict enters its fourth
    year. (Straits Times)
  - War on drugs
  - Operation Southern Spear, United States strikes on alleged drug traffickers during
    Operation Southern Spear
  - Two men are killed in an airstrike carried out by the United States Navy against
    an alleged drug boat in the eastern Pacific. (Reuters)
  - Anglophone Crisis, Pastoral visits of Pope Leo XIV
  - Ambazonian militant groups announce a temporary ceasefire in Cameroon after nearly
    a decade of conflict in anticipation of Pope Leo XIV's visit on April 15. (Vatican
    News)
  - Nigerian bandit conflict
  - Eleven kidnapping victims, including two NDLEA personnel, are rescued and several
    suspected bandits are arrested by the Nigerian Army in raids across Nigeria. (The
    Punch)
  - Russo-Ukrainian War
  - Four people are killed and at least 25 others are injured in a Russian drone attack
    in Dnipro, Ukraine. (RTÉ)
  - Somali Civil War
  - In a joint operation with international ​support, Somali military and Jubaland
    regional forces kill at least 27 al-Shabaab militants in the semi-autonomous Jubaland
    region. (Reuters)
  - Economic impact of the 2026 Iran war
  - 2026 Iran war fuel crisis
  - Oil prices decline, with West Texas Intermediate for May delivery falling 6.2%
    to US$92.94 per barrel and Brent Crude decreasing 3.77% to $95.61, amid expectations
    of reduced tensions in the Middle East. (AFP via NAMPA)
  - American stocks, including the S&P 500, Dow Jones Industrial Average, and Nasdaq
    Composite, rise amidst the possibility of renewed Iran–U.S. talks. (CNBC)
  - Stocks in the United Kingdom increase amidst hopes of new Iran–U.S. talks. (Reuters)
  - Nine people are killed and 15 others are injured in an explosion at a privately-owned
    power station in Chhattisgarh, India. (AP)
  - Three people are killed and two others are injured when a taxi and two motorcycles
    collide on the Jinja–Kamuli–Mbulamuti Road in Kamuli District, Uganda. The driver
    of the taxi is wanted by police for fleeing the scene. (Daily Express)
  - Reactions to the 2026 Iran war, Israel–Italy relations
  - Italian prime minister Giorgia Meloni announces that Italy is suspending the automatic
    renewal of an agreement with Israel on exchanging military equipment and technology
    "in view of the current situation." (Al Jazeera)
  - Norway–Ukraine relations
  - The Norwegian government announces that Ukraine will produce drones in the country
    as part of a bilateral defence cooperation agreement. Norway will support the
    production of Ukrainian drones, while Ukraine will share data, information and
    knowledge of the technology with Norway. (Reuters)
  - 2026 Siverek school shooting
  - An 18-year-old man opens fire at a school in Siverek, Şanlıurfa Province, Turkey,
    wounding 16 people, before killing himself. (CNN)
  - Constitutional crisis in Somalia, Controversies of Hassan Sheikh Mohamud
  - The Somali federal government fails to ensure the timely succession of the Federal
    Parliament, as its term expired on 14 April. The lapse creates significant uncertainty,
    with no clear plan for forthcoming elections following a series of constitutional
    crises. (Bloomberg) (Garowe Online) (Hiiraan Online)
  - Greenland's former prime minister Múte Bourup Egede is appointed as the new foreign
    minister. (Reuters)
