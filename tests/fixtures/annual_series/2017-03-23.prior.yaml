    raw: '*Cardinal [[William H. Keeler|William Henry Keeler]], who was [[Roman Catholic Archdiocese of Baltimore|Archbishop of Baltimore]] from 1989 to 2007, dies at the age of 86. At the [[United States Conference of Catholic Bishops]] (USCCB), he served as the moderator for [[Catholic Church and Judaism|Catholic-Jewish relations]] as well as the Chair for the Bishops’ Committee for [[Committee on Ecumenical and Interreligious Affairs|Ecumenical and Interreligious Affairs]] between 1984 and 1987. [https://www.catholicnewsagency.com/news/baltimore-mourns-cardinal-keeler-former-archbishop-81157 (Catholic News Agency)]'
