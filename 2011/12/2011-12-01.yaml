    Politics and elections:
    - The 2010–2011 Belgian government formation draws to a close as six parties come
      to an agreement which will see PS leader Elio Di Rupo become Prime Minister.
      The deal, however, still has to be approved by the parties' conventions, and
      the cabinet makeup is not yet defined. (EUobserver)
