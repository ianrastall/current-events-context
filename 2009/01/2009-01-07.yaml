  categories:
    Uncategorized:
    - The United States Congressional Budget Office estimates that the federal government
      will run a record $1.2 trillion budget deficit in fiscal year 2009, that the
      current recession will last well into this year, and that the enactment of an
      economic-stimulus plan would increase that deficit. (MarketWatch)
    - Satyam Computer Services chairman Ramalinga Raju admits to accounting fraud
      and resigns. (CNN-IBN)
    - Israel and Hamas resume hostilities after a three-hour respite to allow humanitarian
      aid to reach Gaza. (Sky News)
