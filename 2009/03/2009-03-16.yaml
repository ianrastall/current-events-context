  categories:
    Uncategorized:
    - Former Antananarivo Mayor Andry Rajoelina demands that Madagascar's military
      arrest President Marc Ravalomanana, as Army soldiers seize a presidential palace
      in the capital. (AP via Google News)
    - Josef Fritzl of Austria pleads guilty to charges of rape, incest, sequestration,
      and grievous bodily harm. (AP via The Melbourne Age)
    - Former Pakistani Prime Minister Nawaz Sharif cancels the Pakistan Muslim League's
      proposed demonstration, following the impending reinstatement of Iftikhar Muhammad
      Chaudhry as Chief Justice. (Sky News)
