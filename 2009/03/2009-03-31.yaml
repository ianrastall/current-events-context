wikipedia:
  categories:
    Uncategorized:
    - Likud Party Chairman Benjamin Netanyahu is inaugurated as Prime Minister of
      Israel. (Xinhua via Reuters)
    - Floods on New South Wales' Mid North Coast in Australia cause an emergency evacuation
      of Coffs Harbour. (AAP via News Limited)
    - The Taliban's Students' Movement claims responsibility for an attack on a police
      academy in Lahore, Pakistan. (Sky News)
    - Seven Somali pirates are captured after mistakenly attacking the German Navy's
      FGS Spessart in the Gulf of Aden. (Sky News)
