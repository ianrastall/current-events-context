wikipedia:
  categories:
    Uncategorized:
    - The Basque Nationalist Party wins a plurality of seats in Spain's Basque Country's
      parliamentary elections. (CNN)
    - Canada's Samuel Lunenfeld Research Institute discovers a new method to create
      embryonic-like stem cells that could cure spinal-cord injuries and Parkinson's
      disease. (CTV News)
    - The United States Coast Guard searches Florida's west coast for a fishing vessel
      carrying National Football League players Marquis Cooper and Corey Smith. (Fox
      News)
    - China's first lunar probe, Chang'e 1, impacts the Moon. (Xinhua News)
    - The United States, Israel, and Canada will boycott the Durban Review Conference.
      (Jewish News Weekly) (Haaretz) (Forbes)
    - ASEAN concludes its annual summit in Hua Hin, Thailand, and calls for coordinated
      action against the current recession. (Reuters)
