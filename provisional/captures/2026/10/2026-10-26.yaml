    raw: '**** Senior officials representing the members of the [[Mecca Defence Alliance]], including [[Pakistan|Pakistani]] [[Chief of Defence Forces (Pakistan)|military chief]] [[Asim Munir]], [[Saudi Arabia|Saudi]] [[Ministry of Defense (Saudi Arabia)|defense minister]] [[Khalid bin Salman Al Saud]], and [[Turkey|Turkish]] [[National Intelligence Organization|intelligence]] director [[İbrahim Kalın]], meet with [[Iran|Iranian]] leadership, including [[President of Iran|President]] [[Masoud Pezeshkian]], in [[Tehran]] to discuss efforts to de-escalate the [[2026 Iran war]] and the [[Yemeni civil war (2014–present)|Yemeni civil war]]. [https://www.aljazeera.com/news/2026/10/26/mecca-defence-alliance-members-in-tehran-to-defuse-iran-us-yemen-tensions (Al Jazeera)] [https://www.france24.com/en/middle-east/20261026-iran-talks-mecca-pact-nations-war (France 24)]'
