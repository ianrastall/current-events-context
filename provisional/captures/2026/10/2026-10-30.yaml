    raw: '****[[Poland|Polish]] [[Police of Poland|police]] enter the [[Constitutional Tribunal (Poland)|Constitutional Tribunal]] following the suspension of its president [[Bogdan Święczkowski]], announced by judge [[Anna Korwin-Piotrowska]]. The tribunal describes the suspension as a [[coup d''état]], while three protesters in support of [[Law and Justice|PiS]] are detained after breaching the tribunal''s fence. [https://www.euronews.com/2026/10/30/polish-president-turns-back-mid-flight-amid-coup-detat-allegations (Euronews)]'
