    raw: '**The [[Mexico|Mexican]] [[Government of Mexico|government]] launches an investigation into former attorney general of [[Chihuahua (state)|Chihuahua]] César Jáuregui Moreno for allowing U.S. [[Central Intelligence Agency]] agents to take part in an anti-[[Illegal drug trade|drug trafficking]] operation in Chihuahua earlier this year. Under [[Law of Mexico|Mexican law]], the federal government must approve the activities of foreign forces on Mexican soil. Authorities later arrest Jáuregui Robles and accuse him of [[treason]]. [https://www.aljazeera.com/news/2026/10/21/mexico-charges-prosecutor-with-treason-over-us-involvement-in-drug-raid (Al Jazeera)] [https://www.reuters.com/world/americas/ex-chihuahua-attorney-general-accused-treason-allowing-us-participation-drug-2026-10-18/ (Reuters)]'
