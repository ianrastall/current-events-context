    raw: '*Hundreds of flights are delayed at five [[List of airports in the United States#Primary airports|primary airports]] across [[northeastern United States]], namely [[Newark Liberty International Airport|Newark Liberty]], [[Teterboro Airport|Teterboro]], [[Philadelphia International Airport|Philadelphia]], [[LaGuardia Airport|LaGuardia]], and [[John F. Kennedy International Airport|JFK]], due to technological issues after a construction crew accidentally severed numerous cables, including [[Optical fiber|fiber-optic]] ones used for communication with [[air traffic control]]. [https://www.bbc.com/news/articles/ckvgyzzgvv4wo (BBC News)] [https://www.cnn.com/2026/09/21/us/northeast-airport-delays-equipment-failure (CNN)]'
