    raw: '**In [[Bangladesh]], a crowd allegedly led by [[Bangladesh Jatiotabadi Chatra Dal|Chatra Dal]] members storms and sets fire to the residence of former [[Awami League]] [[Jatiya Sangsad|Member of Parliament]] [[Shamim Osman]] in [[Fatullah]], [[Narayanganj District]], while unidentified attackers in [[Nazirpur Upazila|Nazirpur]], [[Pirojpur District]], loot and set fire to two houses belonging to former [[Ministry of Fisheries and Livestock (Bangladesh)|Minister of Fisheries and Livestock]] and Awami League leader [[SM Rezaul Karim]], and a crowd in [[Sirajganj]] [[vandalism|vandalises]] the local Awami League office and the residence of former MP [[Habibe Millat]]. [https://viewsbangladesh.com/shamim-osmans-house-set-on-fire-in-narayanganj/ (''''Views Bangladesh'''')] [https://www.thedailystar.net/news/crime-justice/news/two-houses-former-al-minister-rezaul-karim-set-fire-pirojpur-4327421 (''''The Daily Star'''')]'
