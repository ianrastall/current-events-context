    raw: '**In [[Gazipur]], [[Savar Upazila|Savar]], and [[Ashulia]], [[Bangladesh]], thousands of [[Textile industry in Bangladesh|garment workers]] demanding a monthly [[minimum wage]] increase from [[Bangladeshi taka|৳]]12,500 ([[US$]]100) to ৳30,000 ($240) block the [[N3 (Bangladesh)|Dhaka–Mymensingh Highway]] and set fire to a [[Bangladesh Police|police]] vehicle, causing police to fire [[tear gas]] and [[stun grenade]]s in Gazipur and Ashulia as 55 [[factory|factories]] close across the three areas, while police report around 300 [[arrest]]s across 24 cases filed in Savar and Ashulia during the protests. [https://www.thedailystar.net/news/news/police-vehicle-torched-garment-workers-block-dhaka-mymensingh-highway-4326951 (''''The Daily Star'''')]'
    text: In Gazipur, Savar, and Ashulia, Bangladesh, thousands of garment workers demanding a monthly minimum wage increase from ৳12,500 (US$100) to ৳30,000 ($240) block the Dhaka–Mymensingh Highway and set fire to a police vehicle, causing police to fire tear gas and stun grenades in Gazipur and Ashulia as 55 factories close across the three areas, while police report around 300 arrests across 24 cases filed in Savar and Ashulia during the protests.
    links:
    - surface: Gazipur
      target: Gazipur
