    raw: '**In [[Gopalganj District, Bangladesh|Gopalganj District]], [[Bangladesh]], armed members of the banned [[Awami League]], [[Bangladesh Chhatra League|Chhatra League]], and [[Jubo League]] detonate [[improvised explosive device|crude bombs]] and set fire to a private [[clinic]] owned by [[Bangladesh Nationalist Party|BNP]] [[Jatiya Sangsad|Member of Parliament]] [[K M Babar]] of [[Gopalganj-2]], forcing [[patient]]s to evacuate. Attackers also burn at least five BNP offices across [[Muksudpur Upazila|Muksudpur]] and [[Kashiani Upazila|Kashiani]] and target two [[Grameen Bank]] branches. [https://www.dhakatribune.com/bangladesh/nation/425065/another-gopalganj-mp%E2%80%99s-home-torched-patients-flee (''''Dhaka Tribune'''')]'
