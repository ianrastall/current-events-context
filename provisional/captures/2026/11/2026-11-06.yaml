    raw: '*[[Au Kam San]], a former [[Pro-democracy camp (Macau)|pro-democracy]] [[Legislative Assembly of Macau|legislator]] of [[Macau]], is convicted in a [[In camera|closed-door trial]] of "[[Inciting subversion of state power|subversion against the political power of the state]]" and sentenced to 12 years and 6 months<!-- MOS:NUM, all numbers here --> in prison. It is the first conviction under the [[Macau National Security Law]], which was revised by lawmakers in 2023 to broaden its scope and to allow for closed-door trials. [https://www.bbc.com/news/articles/cmdx33v9vvr2o (BBC News)]'
