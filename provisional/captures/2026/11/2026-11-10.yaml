    line: 6
    raw: '****A third round of [[United States]]-mediated talks between [[Ukraine|Ukrainian]] and [[Russia|Russian]] delegations begins in [[Abu Dhabi]], [[United Arab Emirates]], focusing on [[Humanitarian impact of the Russo-Ukrainian war (2022–present)|the humanitarian impact of the war]], [[Prisoners of war in the Russo-Ukrainian war (2022–present)|prisoners of war]], and security guarantees. Earlier in the day, the American and Ukrainian teams held a separate meeting with representatives of [[France]], [[Germany]], [[Italy]], the [[United Kingdom]], the [[European Commission]], and [[NATO]]. [https://apnews.com/article/russia-ukraine-war-putin-zelenskyy-uae-3d878a3e56d5df5bd198a6d20c824d18 (AP)] [https://www.dw.com/en/us-russia-and-ukraine-start-talks-in-abu-dhabi/live-79906232 (DW)] [https://www.theguardian.com/world/2026/nov/10/us-officials-russia-ukraine-war-abu-dhabi-talks (''''The Guardian'''')]'
    text: A third round of United States-mediated talks between Ukrainian and Russian delegations begins in Abu Dhabi, United Arab Emirates, focusing on the humanitarian impact of the war, prisoners of war, and security guarantees. Earlier in the day, the American and Ukrainian teams held a separate meeting with representatives of France, Germany, Italy, the United Kingdom, the European Commission, and NATO.
