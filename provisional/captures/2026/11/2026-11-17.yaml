    raw: '***Two weeks after [[Election Day (United States)|Election Day]], [[Democratic Party (United States)|Democratic]] candidate [[Mary Peltola]] defeats [[incumbent]] [[Republican Party (United States)|Republican]] senator [[Dan Sullivan (U.S. senator)|Dan Sullivan]] to become the new [[Senate|Senator]] of [[Alaska]], further extending the [[Wave elections in the United States|Democratic lead]] in the Senate. [https://apnews.com/article/alaska-senate-peltola-sullivan-congress-f1fd4d243bf764ec46ff94db4c792953 (AP)]'
