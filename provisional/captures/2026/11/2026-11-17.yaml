    raw: '**[[Mongolia]]n [[President of Mongolia|president]] [[Ukhnaagiin Khürelsükh]] announces his [[resignation]] from office, three days after former [[Ulaanbaatar]] [[Mayor of Ulaanbaatar|mayor]] [[Khishgeegiin Nyambaatar]] accused him of past [[embezzlement]] from a [[Ulaanbaatar Railway|railway]] project during his tenure as [[Prime Minister of Mongolia|prime minister]]. The [[State Great Khural]] must accept the resignation for it to become effective. [https://apnews.com/article/mongolia-president-corruption-allegations-9542b2bf7536db6ae65b371aac07bbf4 (AP)]'
    text: Mongolian president Ukhnaagiin Khürelsükh announces his resignation from office, three days after former Ulaanbaatar mayor Khishgeegiin Nyambaatar accused him of past embezzlement from a railway project during his tenure as prime minister. The State Great Khural must accept the resignation for it to become effective.
