    raw: '** [[Bangladesh]]i [[Bangladesh Police|police]] and 42 [[platoon]]s of the [[Border Guard Bangladesh]] deploy [[tear gas]], [[stun grenade]]s, [[baton (law enforcement)|baton]]s, and [[unmanned aerial vehicle|surveillance drones]] during clashes with thousands of [[Textile industry in Bangladesh|garment workers]] across [[Dhaka]], [[Savar Upazila|Savar]], [[Ashulia]], [[Gazipur District|Gazipur]], and [[Narayanganj District|Narayanganj]] demanding a monthly [[minimum wage]] increase from [[Bangladeshi taka|৳]]12,500 ([[US$]]100) to ৳30,000 ($240). Protesters block the [[N3 (Bangladesh)|N3]], [[N4 (Bangladesh)|N4]], and [[N5 (Bangladesh)|N5]] highways and force the closure of at least 37 [[factory|factories]] after a [[minimum wage|Minimum Wage Board]] meeting is postponed to November 23. [https://www.afp.com/en/bangladesh-garment-workers-police-clash-fresh-wage-protest (AFP)] [https://www.thehindu.com/news/international/fresh-unrest-in-bangladesh-as-garment-workers-protest-block-highways-for-higher-wages/article71711657.ece
      (''''The Hindu'''')]'
    text: Bangladeshi police and 42 platoons of the Border Guard Bangladesh deploy tear gas, stun grenades, batons, and surveillance drones during clashes with thousands of garment workers across Dhaka, Savar, Ashulia, Gazipur, and Narayanganj demanding a monthly minimum wage increase from ৳12,500 (US$100) to ৳30,000 ($240). Protesters block the N3, N4, and N5 highways and force the closure of at least 37 factories after a Minimum Wage Board meeting is postponed to November 23.
