    raw: '*Following the arrest of [[List of political parties in Bangladesh|party]] leaders, activists of the banned [[Awami League]] and [[Bangladesh Chhatra League|Chhatra League]] mobilize via [[mosque]] [[loudspeaker]]s and storm and set fire to a [[Bangladesh Police|police]] station in [[Tungipara Upazila|Tungipara]], [[Gopalganj District, Bangladesh|Gopalganj District]], [[Bangladesh]], freeing [[detainee]]s and [[looting]] [[firearm]]s as police fire [[tear gas]] and [[rubber bullet]]s, before the attackers also [[arson|burn]] the residence of [[Bangladesh Nationalist Party]] [[Jatiya Sangsad|Member of Parliament]] [[S M Jilani]] of [[Gopalganj-3]] and [[blockade]] local roads. [https://www.thedailystar.net/news/crime-justice/news/gopalganjs-tungipara-police-station-set-fire-following-arrests-awami-league-activists-4326406 (''''The Daily Star'''')] [https://www.tbsnews.net/bangladesh/bnp-mp-zilanys-house-set-fire-gopalganj-1605941 (''''The Business Standard'''')]'
