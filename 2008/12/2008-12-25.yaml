wikipedia:
  categories:
    Uncategorized:
    - A state of emergency is declared in the Marshall Islands, due to widespread
      flooding. (BBC)
    - Maruti Suzuki, India's largest automobile manufacturer, declares it has not
      achieved the growth planned for 2008 and may cut production amidst global crisis.
      (CNN-IBN)
    - A gas leak at a steel mill in Zunhua, China, causes 17 deaths. (CNN), (BBC)
    - An explosion at an apartment in Yevpatoria, Ukraine, kills at least 19. (Reuters)
    - Israel moves closer to an invasion of the Gaza Strip after a Palestinian militant
      attack. (Associated Press)
