wikipedia:
  categories:
    Uncategorized:
    - United Nations Secretary-General Ban Ki-moon meets with African leaders to discuss
      resolutions to the ongoing Kivu conflict in the Democratic Republic of the Congo.
      (CNN)
    - A coalition consisting of the National Party, ACT and United Future wins a majority
      of seats in the Parliament of New Zealand, ending nine years of Labour Party-led
      rule. (The New Zealand Herald)
    - Hurricane Paloma reaches Category 4 strength near the Cayman Islands, with winds
      up to 140 mph (225 kph). (NHC)
