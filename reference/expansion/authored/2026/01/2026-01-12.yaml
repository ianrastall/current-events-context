    importance: 5
    headline: "ISRO's PSLV-C62 fails, losing EOS-N1 and co-passenger satellites"
    summary: >
      The Indian Space Research Organisation's PSLV-C62, the 64th PSLV flight and
      ISRO's first launch of 2026, lifted off from Sriharikota but failed to reach
      its intended orbit after an anomaly in the third stage. The rocket carried the
      primary payload EOS-N1 ("Anvesha"), a DRDO-developed Earth observation
      satellite, along with about 14 to 15 co-passenger satellites, in a commercial
      mission run by NewSpace India Limited. It was the PSLV's second consecutive
      failure after PSLV-C61 in 2025.
    key_data:
      - label: "Flight number"
        value: "64th PSLV flight"
        citation_refs: [37]
      - label: "Co-passenger satellites lost"
        value: "14 (India TV) or 15 (All India Radio)"
        citation_refs: [36, 37]
    details:
