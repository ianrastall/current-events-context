    importance: 6
    headline: "Minnesota and Illinois sue to halt federal immigration-enforcement surges"
    summary: >
      Minnesota Attorney General Keith Ellison, with the cities of Minneapolis and
      Saint Paul, filed a federal lawsuit seeking to end "Operation Metro Surge" and
      requested a temporary restraining order, alleging violations of the First and
      Tenth Amendments, the equal sovereignty principle and the Administrative
      Procedure Act. Illinois and Chicago filed a separate suit against DHS, ICE and
      Border Patrol the same day. The suits followed the fatal shooting of Renée
      Good by an ICE officer in Minneapolis the previous week; federal officers
      separately used tear gas on bystanders at the scene of a car crash a few
      blocks from the shooting site.
