strategic_conclusion: >
  January 12 showed Iran and the Federal Reserve as the day's two gravitational
  centers. Iran's crackdown passed 500 confirmed deaths under HRANA's count, and
  Trump's abrupt 25% tariff on any country trading with Iran extended the crisis
  into trade policy with no stated legal basis. In Washington, the Powell
  investigation drew an unusually public rebuke from a Republican senator and a
  cross-partisan roster of former Fed chairs and Treasury secretaries, testing how
  far the administration is willing to press a confrontation with the central bank.

  Elsewhere, institutional processes advanced on several fronts: the ICJ's Rohingya
  hearings, Minnesota and Illinois's lawsuits against the immigration surge, and
  Tobago's one-party assembly. Somalia's rupture with the UAE and Sudan's continuing
  RSF drone strikes underlined how unresolved regional conflicts keep generating new
  flashpoints even away from the day's headline stories. A long tail of smaller but
  concrete developments — corruption convictions in Georgia and Poland, record drug
  seizures in Sweden and off the Canary Islands, a Corsican assassination, and
  regulatory action against Meta and X — filled out a day with unusually wide
  geographic spread.

