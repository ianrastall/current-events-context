  - id: "evt-2026-01-12-003"
    category: "Politics and elections"
    subcategory: "Central bank independence"
    topics:
      - "Jerome Powell"
      - "Federal Reserve"
      - "Thom Tillis"
    importance: 8
    headline: "Senators and former Fed chairs condemn DOJ probe of Powell as market reaction stays muted"
    summary: >
      Following Powell's disclosure the previous evening of grand-jury subpoenas
      threatening a criminal indictment, Republican Senator Lisa Murkowski, after
      speaking with Powell, called the investigation "nothing more than an attempt
      at coercion," backing Senator Thom Tillis's position. A joint "Statement on the
      Federal Reserve," signed by former Fed Chairs Alan Greenspan, Ben Bernanke and
      Janet Yellen, former Treasury Secretaries Geithner, Paulson, Rubin and Lew, and
      economists including Glenn Hubbard and Kenneth Rogoff, compared the probe to
      how monetary policy is made "in emerging markets with weak institutions."
      Markets fell only modestly, while spot gold hit a record intraday high.
    key_data:
      - label: "Spot gold record intraday high"
        value: "$4,629.94 an ounce"
        citation_refs: [12]
      - label: "S&P 500 futures move at pre-market open"
        value: "Down less than 1%"
        citation_refs: [12]
    details:
      what_happened:
        - "Senator Lisa Murkowski, after speaking with Powell on Monday, called the investigation an attempt at coercion."
        - "Former Fed Chairs Greenspan, Bernanke and Yellen, former Treasury Secretaries, and economists including Hubbard and Rogoff issued a joint statement comparing the probe to monetary policy 'in emerging markets with weak institutions.'"
        - "A spokesman for Attorney General Pam Bondi declined to comment on the probe."
        - "S&P 500 futures fell less than 1% at the pre-market open; spot gold hit a record intraday high of $4,629.94 an ounce."
      why_it_matters:
        - "A criminal investigation of a sitting Fed chair is without precedent and directly tests the central bank's independence ahead of Powell's term ending in May 2026."
        - "Opposition from Republican senators could complicate confirmation of Trump's eventual nominee to succeed Powell."
      uncertainty_notes: []
