  - id: "evt-2026-01-12-002"
    category: "Business and economy"
    subcategory: "Tariffs and sanctions"
    topics:
      - "Iran sanctions"
      - "International Emergency Economic Powers Act"
    importance: 8
    headline: "Trump announces 25% tariff on any country doing business with Iran"
    summary: >
      President Donald Trump posted that any country doing business with Iran would,
      effective immediately, pay a 25% tariff on all business with the United States,
      calling the order final and conclusive. The White House gave no further
      details and no executive action had been published as of the report. Iran
      exports most of its oil to China, with Turkey, Iraq, the UAE and India among
      its other top trading partners; China's foreign ministry said there are no
      winners in a tariff war.
    key_data:
      - label: "Tariff rate announced"
        value: "25%"
        citation_refs: [6]
      - label: "Iranian crude and condensate exports, January so far"
        value: "460,000 barrels per day, down from 1.4 million b/d in December"
        citation_refs: [9]
    details:
      what_happened:
        - "Trump posted that any country doing business with Iran would pay a 25% tariff, effective immediately."
        - "The White House declined to elaborate and did not define 'doing business'; no executive action had been published."
        - "S&P Global reported Iran's crude and condensate exports averaged 460,000 barrels per day so far in January, down from 1.4 million b/d in December."
        - "China's foreign ministry said it would resolutely safeguard its legitimate rights and interests."
      why_it_matters:
        - "If enforced, the measure could hit major U.S. trading partners, especially China, without a clear stated legal basis."
        - "It adds economic pressure on Tehran on top of the military threats already tied to the protest crackdown."
      uncertainty_notes:
        - "The announcement came ahead of a pending U.S. Supreme Court ruling on the legality of Trump's IEEPA-based tariffs, and it is unclear whether this measure rests on that authority."
