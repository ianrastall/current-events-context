        - "An anomaly in the third stage prevented the payloads from reaching orbit."
        - "The primary EOS-N1 satellite and co-passenger satellites were lost."
        - "The Space Review reported the first two stages performed nominally."
        - "The mission was run by NewSpace India Limited, ISRO's commercial arm."
      why_it_matters:
        - "Two consecutive failures damage the reputation of India's 'workhorse' rocket and its commercial launch business."
        - "The loss of a DRDO surveillance-capable satellite is a setback for Indian defence space capabilities."
      uncertainty_notes:
        - "Co-passenger satellite counts differ: India TV reported 14, All India Radio reported 15."
