        value: "5 killed, 13 injured"
        citation_refs: [34]
    details:
      what_happened:
        - "RSF drones struck an army base in Sinja; AFP reported 27 killed."
        - "The Sudan Doctors Network reported 10 civilians killed and 9 wounded in Sinja."
        - "An RSF drone attack in Kartala, South Kordofan, killed 5 and injured 13, per the Sudan Doctors Network."
        - "The strikes followed the government's announced return to Khartoum after nearly three years in Port Sudan."
      why_it_matters:
        - "Long-range RSF drones continue to reach deep into army-held territory, undercutting the government's claim to have restored stability."
      uncertainty_notes:
        - "Casualty accounts for Sinja conflict sharply: AFP's military/health sources reported 27 killed, while the Sudan Doctors Network reported 10 civilians killed and 9 wounded. Reported injury figures for Sinja range from 13 to more than 70, and it is unclear how many victims were military or civilian."
