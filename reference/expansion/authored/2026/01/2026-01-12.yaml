    importance: 6
    headline: "Somalia cancels all agreements with the UAE over alleged sovereignty violations"
    summary: >
      Somalia's Council of Ministers annulled all agreements with the United Arab
      Emirates, including security and defence cooperation and arrangements linked
      to the ports of Berbera, Bosaso and Kismayo, citing evidence of actions
      undermining Somali sovereignty. Defence Minister Ahmed Moallim Fiqi cited
      "reliable reports and evidence." Somali authorities had earlier investigated
      the alleged unauthorized use of Somali airspace to move STC leader Aidarous
      al-Zubaidi to Abu Dhabi; an analyst linked the decision to Israel's December
      recognition of Somaliland. Somaliland officials dismissed the decision.
    key_data:
      - label: "Ports covered by the cancellation"
        value: "Berbera, Bosaso, Kismayo"
        citation_refs: [30]
    details:
      what_happened:
        - "The cabinet meeting, chaired by Deputy Prime Minister Salah Ahmed Jama, terminated all UAE agreements."
        - "The cancellation covers the Berbera, Bosaso and Kismayo ports and bilateral security and defence pacts."
        - "Mogadishu cited the reported transit of STC leader Aidarous al-Zubaidi through Somaliland and Mogadishu to Abu Dhabi."
        - "Somaliland officials rejected the move, saying Berbera deals are with Somaliland authorities."
      why_it_matters:
        - "The move legally challenges UAE military and port access in the Horn of Africa, where DP World holds a 30-year Berbera concession."
        - "It deepens a regional rift involving Saudi Arabia, the UAE, Yemen's separatists and Israel's recognition of Somaliland."
