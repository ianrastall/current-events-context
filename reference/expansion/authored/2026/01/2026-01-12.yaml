    topics:
      - "Sudanese civil war"
      - "Rapid Support Forces"
    importance: 6
    headline: "RSF drone strikes hit Sinja, Sennar State and Kartala, South Kordofan, Sudan"
    summary: >
      Sudan's paramilitary Rapid Support Forces launched drones at Sinja, the
      capital of Sennar State, about 300 km southeast of Khartoum. Casualty accounts
      conflict: AFP, citing military and health sources, said drones targeted an
      army base and killed 27 people, while Anadolu, citing the Sudan Doctors
      Network, reported 10 civilians killed and 9 wounded. Reported injury figures
      ranged from 13 to more than 70. A separate RSF drone attack on Kartala, South
      Kordofan, killed five people and injured 13, per the Sudan Doctors Network.
      The strikes came a day after the army-aligned government announced its return
      to Khartoum.
    key_data:
