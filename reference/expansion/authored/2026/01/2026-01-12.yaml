  - id: "evt-2026-01-12-004"
    category: "Law and crime"
    subcategory: "International courts"
    topics:
      - "The Gambia v. Myanmar"
      - "Rohingya genocide"
      - "International Court of Justice"
    importance: 7
    headline: "ICJ opens merits hearings in The Gambia's genocide case against Myanmar over the Rohingya"
    summary: >
      The International Court of Justice opened three weeks of public hearings on
      the merits of The Gambia's 2019 case accusing Myanmar of breaching the Genocide
      Convention in its treatment of the Rohingya, centering on the military's 2017
      "clearance operations" that drove at least 730,000 Rohingya into Bangladesh.
      Gambian Justice Minister Dawda Jallow told judges the Rohingya had "been
      targeted for destruction." It is the first genocide case the ICJ has heard in
      full in more than a decade, and observers said the outcome will likely affect
      South Africa's case against Israel. Myanmar, represented by Union Minister Ko
      Ko Hlaing, denies genocide.
    key_data:
      - label: "Rohingya displaced in 2017 operations"
        value: "At least 730,000"
        citation_refs: [17]
      - label: "Hearing schedule"
        value: "The Gambia presents through January 15; Myanmar responds from January 16; hearings run to January 29"
        citation_refs: [19]
    details:
      what_happened:
        - "Hearings opened at the Peace Palace under ICJ President Iwasawa Yuji."
        - "Gambian Justice Minister Dawda Jallow told the court the case is 'about real people, real stories and a real group of human beings.'"
        - "Myanmar's Ko Ko Hlaing attended; Myanmar maintains its 2017 operations were counterterrorism."
        - "The court scheduled closed sessions to hear Rohingya witnesses directly, a first for an international court in this case."
      why_it_matters:
        - "The ruling will set precedent on how genocide is defined and proven, with implications for South Africa v. Israel."
        - "It is a rare accountability venue for crimes committed by Myanmar's military, which has ruled since the 2021 coup."
      uncertainty_notes: []
