  - id: "evt-2026-01-12-001"
    category: "Civil unrest and protests"
    subcategory: "Government crackdown"
    topics:
      - "2025–2026 Iranian protests"
      - "HRANA"
    importance: 9
    headline: "Iran protest crackdown death toll passes 500 as regime stages counter-rallies"
    summary: >
      Iran's nationwide anti-government protests entered their third week with a
      sharply rising death toll. HRANA reported that more than 500 protesters and 48
      security personnel had been killed and more than 10,000 people arrested; Just
      Security, summarizing HRANA, put the toll at least 544, while CNN reported at
      least 503 protesters killed. Communications remained heavily restricted amid an
      internet shutdown in place since January 8. Pro-regime rallies were held in at
      least 13 cities, with President Masoud Pezeshkian attending one in Tehran, and
      Iran's foreign ministry said its communication channel with U.S. envoy Steve
      Witkoff remained open. European Parliament President Roberta Metsola barred
      Iranian diplomats from all Parliament premises.
    key_data:
      - label: "HRANA cumulative toll"
        value: "More than 500 protesters and 48 security personnel; at least 544 per Just Security's summary"
        citation_refs: [1, 2]
      - label: "Cumulative arrests"
        value: "More than 10,000"
        citation_refs: [1]
      - label: "Pro-regime rallies"
        value: "At least 13 cities"
        citation_refs: [3]
    details:
      what_happened:
        - "HRANA reported over 500 protesters and 48 security personnel killed and more than 10,000 arrests, as tallied on January 12."
        - "Pro-regime rallies were held in at least 13 cities, per IRGC-affiliated media cited by the Critical Threats Project/ISW; President Pezeshkian joined one in Tehran."
        - "Iran's foreign ministry said the Araghchi-Witkoff channel was open but called U.S. messages contradictory."
        - "A Fox News correspondent reported a source in Esfahan confirming protests continued there despite the internet shutdown."
        - "European Parliament President Roberta Metsola announced a ban on Iranian diplomats and representatives from Parliament premises, effective immediately."
      why_it_matters:
        - "By HRANA's count this is the deadliest unrest in Iran in years, and the internet blackout means the true toll is likely higher; later reporting gave far larger figures, which fall outside this date."
        - "President Trump has repeatedly threatened military action if killings continue, raising the risk of a wider U.S.-Iran confrontation."
      uncertainty_notes:
        - "Death toll figures vary by source on the same day: Democracy Now! (via HRANA) gives 'over 500' plus 48; Just Security's summary of HRANA gives 'at least 544'; CNN gives 'at least 503' protesters killed. None could be independently verified given the internet blackout."
