        - "The Minnesota complaint cites Trump calling Minnesota officials 'crooked' on January 9 as evidence of retaliation."
        - "Federal officers used tear gas on a crowd of bystanders in Minneapolis on Monday."
      why_it_matters:
        - "The suits test the limits of federal immigration deployments in states that do not consent."
        - "They come amid nationwide protests over the killing of Renée Good."
