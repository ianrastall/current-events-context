  - id: "evt-2026-01-10-004"
    category: "Civil unrest and protests"
    subcategory: "Protests and state crackdowns"
    topics:
      - "2025–2026 Iranian protests"
      - "Islamic Revolutionary Guard Corps"
      - "Internet censorship in Iran"
    importance: 9
    headline: "Iran threatens protesters with 'enemy of God' death-penalty charge as internet blackout passes 60 hours"
    summary: >
      Iran's Attorney General Mohammad Movahedi Azad said anti-government protesters
      and anyone assisting them would be prosecuted as an "enemy of God" (Moharebeh),
      a charge carrying the death penalty. Iran's conventional military, the Artesh,
      issued an unusual public statement vowing to protect strategic infrastructure
      and public property, a role normally left to internal security forces. NetBlocks
      reported that the nationwide internet blackout had passed the 60-hour mark,
      severely limiting communication amid the two-week-old uprising.
    key_data:
      - label: "Charge threatened against protesters and helpers"
        value: "Moharebeh ('enemy of God'), a capital offense"
        citation_refs: [7]
      - label: "Duration of internet blackout reported"
        value: "Past 60 hours"
        citation_refs: [10]
    details:
      what_happened:
        - "Attorney General Mohammad Movahedi Azad said protesters and anyone assisting them would face Moharebeh charges, which carry the death penalty."
        - "The Artesh, Iran's conventional military, issued a statement vowing to protect national interests, strategic infrastructure and public property."
        - "NetBlocks reported the nationwide internet blackout had passed the 60-hour mark."
        - "The Institute for the Study of War assessed the Artesh statement as unusual for a force normally reserved for external defense."
      why_it_matters:
        - "Threatening capital charges for participation in or assistance to protests raises the legal stakes of the crackdown sharply."
        - "A public role for the conventional military, rather than the IRGC and Basij alone, may indicate strain on Iran's usual internal-security forces."
      uncertainty_notes:
        - "The deep-research report's own synthesis states a cumulative death toll of 'at least 530 (483 protesters, 47 security personnel)' attributed to unspecified 'cumulative NGO reports', but none of its four cited sources directly states this figure with a quotable line, so it is not recorded in casualty_report. HRANA-based tallies reported elsewhere in this archive range from about 500 (January 8) to 538 (January 11) to 544 (January 12); see evt-2026-01-08-006, evt-2026-01-09-002 and evt-2026-01-11 events."
        - "Arrest counts in the low thousands were also asserted without a directly quotable source and are omitted."
