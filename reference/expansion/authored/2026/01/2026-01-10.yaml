    importance: 8
    headline: "Trump signs order shielding Venezuelan oil revenue as ExxonMobil calls the country 'uninvestable'"
    summary: >
      President Donald Trump signed an executive order invoking the International
      Emergency Economic Powers Act and the National Emergencies Act to shield
      Venezuelan oil revenue held in U.S. Treasury accounts from seizure by private
      creditors, designating the funds as sovereign Venezuelan property held for
      governmental and diplomatic purposes. Trump also hosted energy-company
      executives at the White House to pitch a $100 billion investment to rebuild
      Venezuela's oil infrastructure. ExxonMobil CEO Darren Woods said the country
      remained "uninvestable" absent legal and commercial reforms, while Treasury
      Secretary Scott Bessent said targeted sanctions relief could come within a week.
    key_data:
      - label: "Investment pitched to energy executives"
        value: "$100 billion"
        citation_refs: [1]
      - label: "IMF Special Drawing Rights Bessent said could be unlocked"
        value: "$4.9 billion"
        citation_refs: [4]
    details:
      what_happened:
        - "Trump signed an executive order shielding Venezuelan oil revenue held in U.S. Treasury accounts from private judicial seizure."
        - "The order designates the funds as sovereign property of Venezuela held in U.S. custody for governmental and diplomatic purposes."
        - "Trump met energy executives, including from ExxonMobil, Chevron and ConocoPhillips, to seek up to $100 billion in investment to rebuild Venezuela's oil sector."
        - "ExxonMobil CEO Darren Woods said Venezuela's commercial and legal framework made it 'uninvestable' today."
        - "Treasury Secretary Scott Bessent said sanctions relief could come as soon as the following week."
      why_it_matters:
        - "The order subordinates creditors' claims to U.S. policy goals in Venezuela, an unusual use of emergency economic powers."
        - "Corporate reluctance to invest highlights a gap between Washington's timeline for restarting the oil sector and private-sector risk tolerance."
      uncertainty_notes: []
