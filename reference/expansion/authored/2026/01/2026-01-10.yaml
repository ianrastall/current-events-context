    headline: "Delcy Rodríguez marks a year since Maduro's inauguration, vows to secure his release"
    summary: >
      Speaking at the Petare Socialist Commune on the first anniversary of Nicolás
      Maduro's January 2025 inauguration, acting Venezuelan president Delcy Rodríguez
      pledged to secure the release of Maduro and First Lady Cilia Flores from U.S.
      custody, condemning their removal as an abduction. Rodríguez had been sworn in
      as acting president on January 5, days after the U.S. raid that captured Maduro.
    key_data:
      - label: "Anniversary marked"
        value: "One year since Maduro's January 2025 inauguration"
        citation_refs: [5]
    details:
      what_happened:
        - "Rodríguez addressed a rally at the Petare Socialist Commune on the anniversary of Maduro's 2025 inauguration."
        - "She pledged to secure the freedom and return of Maduro and Cilia Flores."
        - "She characterized the U.S. operation that removed Maduro as an abduction."
      why_it_matters:
        - "The speech signals the interim government's public posture toward Washington and its own political base as it seeks to project continuity."
      uncertainty_notes:
        - "Rodríguez's swearing-in as acting president took place on January 5 (see evt-2026-01-05-001); this event covers her January 10 remarks, not a repeat swearing-in."
