  - id: "evt-2026-01-10-005"
    category: "Armed conflicts and attacks"
    subcategory: "Drone strikes"
    topics:
      - "SDF–Syrian transitional government clashes"
      - "January 2026 Aleppo clashes"
    importance: 7
    headline: "Drone strikes Aleppo governorate building during ministerial conference, day after ceasefire"
    summary: >
      A drone struck the Aleppo governorate building in central Aleppo during a
      conference attended by Syria's information and social affairs ministers and the
      provincial governor, a day after the transitional government declared a
      ceasefire with the Kurdish-led Syrian Democratic Forces. The Syrian government
      blamed the SDF, which denied involvement. Despite the strike, a U.S.-brokered
      ceasefire held and the SDF began withdrawing fighters from the Ashrafieh and
      Sheikh Maqsoud neighborhoods.
    key_data:
      - label: "Target"
        value: "Aleppo governorate building, during a ministerial conference"
        citation_refs: [12]
    details:
      what_happened:
        - "A drone struck the Aleppo governorate building while ministers and the provincial governor were meeting inside."
        - "The Syrian government accused the SDF of launching the drone; the SDF denied involvement."
        - "Despite the strike, the SDF agreed, through international mediation, to withdraw its fighters from Ashrafieh and Sheikh Maqsoud."
        - "SDF commander Mazloum Abdi said the withdrawal reflected an understanding reached through international mediation."
      why_it_matters:
        - "The strike threatened the newly declared ceasefire but did not derail it, and the SDF's withdrawal shifted administrative control of Aleppo back to the transitional government."
      uncertainty_notes:
        - "Yemen Press Agency, a Houthi-aligned outlet, reported the drone as belonging to the SDF as an established fact; this report treats that as an accusation rather than a confirmed fact, consistent with Al Jazeera's more cautious framing that the SDF denied involvement."
        - "The deep-research report cited cumulative Aleppo casualty and displacement figures (24 killed, 104 injured, 155,000 displaced 'since Tuesday') attributed to the Aleppo health office, but none of the three cited sources directly quotes these figures, so they are not recorded in casualty_report. The withdrawal itself, completed on January 11, is recorded separately with its own sourced figures."
