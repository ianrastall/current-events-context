    importance: 9
    headline: "Iran's internet shutdown continues as security forces use lethal force against protesters"
    summary: >
      Cloudflare reported that internet traffic from Iran had effectively dropped to zero
      since January 8, signalling a complete shutdown, as nationwide protests triggered by
      economic hardship continued. Reports compiled on Wikipedia described security forces
      using live ammunition against protesters in Kerman and blocking fire trucks from
      responding to fires in Rasht. Exiled opposition figure Reza Pahlavi urged further
      mobilization, while the authorities vowed to punish demonstrators.
    key_data:
      - label: "Internet traffic from Iran"
        value: "Effectively zero since January 8"
        citation_refs: [4]
    details:
      what_happened:
        - "Internet traffic from Iran fell to effectively zero from January 8."
        - "Security forces were reported to have used live ammunition against protesters in Kerman."
        - "Security forces were reported to have blocked fire trucks from responding to a fire in Rasht."
        - "Reza Pahlavi called for protests to escalate."
      why_it_matters:
        - "A complete internet shutdown prevents independent verification of events and limits the ability of rights groups to document abuses."
        - "The scale of the unrest and the state response mark one of the most serious internal challenges to Iran's leadership in decades."
      uncertainty_notes:
        - "Death tolls are not recorded in casualty_report because the cited figures come from later sources: HRANA's count of at least 392 killed in Rasht is cited via a Wikipedia article, Iran International reported at least 12,000 killed nationwide on January 13, and The Guardian reported on concealment of deaths on January 27. These figures cover the crackdown period and are not specific to January 9."
        - "The Wikipedia article '2026 Iran massacres' was compiled after the events; its January 9 publication date in the deep-research report reflects the event date rather than the article's creation."
