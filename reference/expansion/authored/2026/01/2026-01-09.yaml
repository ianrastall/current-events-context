    importance: 7
    headline: "U.S. seizes fifth tanker in Venezuela blockade as Trump hosts oil executives"
    summary: >
      The U.S. military seized a Timor-Leste-flagged oil tanker in the Caribbean Sea, the
      fifth tanker seized as part of the blockade around Venezuela. President Donald
      Trump hosted leading U.S. oil executives at the White House and said the industry
      would invest $100 billion to rebuild Venezuela's oil sector, promising the
      companies "total safety". The day before, the Senate had voted 52 to 47 to advance
      a bipartisan war-powers resolution to restrict further U.S. military action in
      Venezuela.
