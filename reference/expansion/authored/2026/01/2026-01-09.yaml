    headline: "Details emerge of Israeli strikes on Gaza displacement tents and shelter schools"
    summary: >
      Anadolu Agency and the Palestinian news agency WAFA reported that Israeli strikes on
      January 8 killed nine Palestinians, including children, when they hit displacement
      tents and a shelter school, with the Al-Mawasi area of Khan Younis and the Jabalia
      refugee camp among the locations struck. The Times of Israel reported that Gaza's
      civil defense agency put the toll at 13 and that the IDF and Shin Bet confirmed
      strikes in response to a failed launch.
    key_data:
      - label: "Killed (Anadolu, WAFA)"
        value: "9, including children"
        citation_refs: [8, 9]
      - label: "Killed (Gaza civil defense via The Times of Israel)"
        value: "At least 13"
        citation_refs: [10]
    details:
      what_happened:
        - "A drone strike hit a displacement tent of the Al-Abadla family in Al-Mawasi, Khan Younis, killing at least four, including siblings Abdullah and Omar al-Abadlah."
        - "An 11-year-old girl was killed by Israeli gunfire in Jabalia refugee camp, and strikes hit the Abu Hussein School sheltering displaced families."
        - "A strike on a tent near Faisal Tower, north-west of Deir al-Balah, killed one person."
        - "The IDF and Shin Bet said the strikes responded to a failed launch."
      why_it_matters:
        - "Strikes on designated humanitarian areas and shelters further strain the ceasefire."
      uncertainty_notes:
        - "The strikes occurred on January 8 and are also recorded in evt-2026-01-08-008; this entry records additional detail reported on January 9."
        - "Death tolls range from 9 (Anadolu, WAFA) to 13 (Gaza civil defense). The casualty_report uses 13 for consistency with evt-2026-01-08-008."
