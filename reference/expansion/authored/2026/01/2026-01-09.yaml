    importance: 7
    headline: "Von der Leyen and Costa visit Damascus and announce about €620 million for Syria"
    summary: >
      European Commission President Ursula von der Leyen and European Council President
      António Costa visited Damascus, the first such visit by EU leaders, and met
      President Ahmed al-Sharaa and Foreign Minister Asaad al-Shaibani. The Commission
      announced a financial support package of around €620 million for 2026 and 2027,
      including humanitarian aid, early recovery support and bilateral support. AP noted
      that reconstruction aid had been blocked by sanctions under Assad, which have now
      been lifted.
    key_data:
      - label: "EU support package"
        value: "Around €620 million for 2026-2027"
        citation_refs: [11]
    details:
      what_happened:
        - "Von der Leyen and Costa visited Damascus for the first time as EU leaders."
        - "They met President Ahmed al-Sharaa and Foreign Minister Asaad al-Shaibani."
        - "The Commission announced about €620 million in support for 2026 and 2027."
        - "Talks covered a new political partnership, trade and an inclusive political transition."
      why_it_matters:
        - "The visit marks a major step in ending Syria's diplomatic isolation from Europe after the fall of Assad."
        - "The funding supports reconstruction that sanctions had previously blocked."
