strategic_conclusion: >
  January 9 showed escalation on two fronts. Russia's use of the Oreshnik missile
  against Lviv and deadly strikes on Kyiv marked a step up in the weapons used against
  Ukraine, and Iran's near-total internet shutdown obscured an increasingly violent
  crackdown on protesters whose full toll could only be estimated later. The United
  States continued to pair tanker seizures with courting oil investment in Venezuela,
  while at home five states went to court over a $10 billion freeze of family-support
  funding and protests continued over the killing of Renée Good.

  Diplomacy and trade offered counterweights. EU leaders' first visit to Damascus and a
  €620 million package signalled Europe's bet on Syria's transition even as Aleppo
  required a ceasefire, and 21 EU states approved the Mercosur agreement over French
  objections. Elsewhere, Yemen's STC faced a contested dissolution, the Central African
  Republic confirmed a third term for Touadéra, Honduras moved toward a recount amid
  violence at Congress, and Australia launched a Royal Commission into antisemitism.
  Storm Goretti and deadly crashes in India and Nigeria underscored the day's
  humanitarian costs.

