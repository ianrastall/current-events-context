      issued a joint statement expressing solidarity with Federal Reserve Chair Jerome
      Powell after the Trump administration threatened him with a criminal
      indictment. The statement, published by the European Central Bank and signed by
      ECB President Christine Lagarde and the heads of institutions including the
      Bank of England, Bank of Canada, Bank of Korea and the Bank for International
      Settlements, said central bank independence underpins price, financial and
      economic stability. It was a collective response to the earlier threat, not a
      new charge.
