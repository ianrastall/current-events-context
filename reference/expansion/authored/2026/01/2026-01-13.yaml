    topics:
      - "Russian invasion of Ukraine"
      - "Attacks on Ukrainian energy infrastructure"
    importance: 7
    headline: "Russian missile and drone barrage kills four at Kharkiv-region postal facility and cuts power"
    summary: >
      Russia struck Ukraine overnight into January 13 with what President Volodymyr
      Zelenskyy said were nearly 300 drones, 18 ballistic missiles and seven cruise
      missiles across eight regions. A strike on a postal facility in the Kharkiv
      region killed four people. Attacks on energy-generation facilities and
      substations led Ukraine's energy ministry to impose emergency power cuts in Kyiv
      and six other regions during severe winter cold, and energy company DTEK
      reported heavy damage to equipment at a thermal power plant.
    key_data:
      - label: "Weapons launched, per Zelenskyy"
        value: "Nearly 300 drones, 18 ballistic missiles, 7 cruise missiles"
        citation_refs: [4]
      - label: "Regions targeted"
        value: "8"
        citation_refs: [4]
      - label: "Killed at Kharkiv-region postal facility"
        value: "4"
        citation_refs: [4, 5]
    details:
      what_happened:
        - "Zelenskyy reported nearly 300 drones, 18 ballistic missiles and seven cruise missiles launched overnight."
        - "Four people were killed at a postal facility in the Kharkiv region."
        - "Ukraine's energy ministry introduced emergency power cuts in Kyiv and six named regions."
        - "DTEK reported heavy damage to equipment at a thermal power plant."
        - "ABC News Australia reported that hundreds of thousands of homes lost electricity."
      why_it_matters:
        - "Damage to power and heating infrastructure put civilians under additional strain during freezing weather."
        - "The strike continued a pattern of large Russian attacks on Ukraine's grid through early January."
      uncertainty_notes:
        - "The cited accounts report injuries but give no consistent nationwide count."
        - "The attack spanned the night of January 12-13; this strike was deliberately left out of evt-2026-01-12-011 and is recorded here."
