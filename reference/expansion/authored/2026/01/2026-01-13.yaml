        - "The army reported three soldiers killed and 10 wounded."
        - "MPRD leader Luc Beyam Bebha reported three of the group's fighters killed and two wounded."
        - "The army later confirmed the clash, describing its adversaries as groups of armed bandits."
      why_it_matters:
        - "The fighting marked a renewed armed confrontation in southern Chad near the border with the Central African Republic."
      uncertainty_notes:
        - "Each side's casualty figure comes from that side; neither was independently verified."
        - "The army's description of 'armed bandits' differs from news reporting and the MPRD's own identification as a rebel group."
