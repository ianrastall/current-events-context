  - id: "evt-2026-01-13-005"
    category: "International relations"
    subcategory: "Territorial sovereignty"
    topics:
      - "Greenland crisis"
      - "Denmark–United States relations"
    importance: 7
    headline: "Greenland's prime minister says the territory chooses Denmark over the United States"
    summary: >
      At a joint news conference in Copenhagen with Danish Prime Minister Mette
      Frederiksen, Greenlandic Prime Minister Jens-Frederik Nielsen said that if
      Greenland had to choose between Denmark and the United States, it would choose
      Denmark, and rejected U.S. ownership or government of the island. The statement
      came a day before Danish and Greenlandic foreign ministers were due to hold talks
      in Washington about President Donald Trump's push to acquire Greenland.
    key_data:
