analytical_overview: >
  January 13, 2026 was dominated by the scale of killing in Iran. An Iranian official
  told Reuters that about 2,000 people, including security personnel, had died in the
  nationwide protests, the U.S.-based rights group HRAI reported a toll of at least
  2,000, and activist sources cited on the Wikipedia portal put the figure far higher.
  The UN human rights chief condemned the "violent repression" as some international
  phone calls resumed while the internet stayed down. Overnight, Russia fired nearly
  300 drones and 25 missiles at Ukraine, killing four people at a postal facility in
  the Kharkiv region and forcing emergency power cuts in freezing weather. Uganda cut
  public internet access two days before its general election and ordered two rights
  groups to stop work.

  In Western capitals, Greenland's prime minister said the territory would choose
  Denmark over the United States on the eve of talks in Washington, and central bank
  governors from Europe, the Americas and Asia issued a joint statement of solidarity
  with Federal Reserve Chair Jerome Powell as U.S. data showed December consumer
  prices up 2.7% on the year. Diplomatic activity also included a Japan-South Korea
  summit in Nara, Indian and Pakistani military talks over alleged drone
  intrusions, Bangladesh's protest to Myanmar over cross-border gunfire, and two UAE
  trade pacts signed in Abu Dhabi, with the Philippines and Nigeria. Israel cut
  contact with three more international bodies as a UN warning over UNRWA became
  public. Other stories included Venezuela's disputed prisoner-release figures and the
  restoration of X there, a ferry sinking on the Niger River in Mali, a landslide in
  eastern Congo, clashes in southern Chad, Argentina's lowest year-end inflation since
  2017, and the cancellation of Adelaide Writers' Week.

