strategic_conclusion: >
  January 13 showed how far the Iranian crackdown had outrun earlier counts. Within a
  day, publicly cited tolls moved from the 500s recorded on January 11 and 12 to about
  2,000 from both an Iranian official and HRAI, with activist figures much higher and
  the UN citing hundreds; the communications blackout meant none could be checked.
  Uganda's pre-election internet shutdown and the order halting two rights groups
  showed a second government limiting scrutiny at a sensitive moment, and Russia's
  overnight barrage kept up the pressure on Ukraine's grid in midwinter.

  Among Western allies, Greenland's leader and a broad group of central bankers took
  public positions against U.S. pressure, over the territory's future and over the
  Federal Reserve's independence, while the December CPI showed inflation steady at
  2.7%. Across Asia and the Gulf, the Nara summit and the two UAE trade agreements
  with the Philippines and Nigeria pointed to active economic and security diplomacy.
  India's drone complaint to Pakistan and Bangladesh's protest to Myanmar showed
  neighbours' conflicts spilling across borders. Israel's further withdrawal from
  international bodies and the disclosure of Guterres's UNRWA warning deepened its
  dispute with the UN system. The day's disasters, the Mali ferry sinking and the
  Walikale landslide, killed at least 57 people between them.

