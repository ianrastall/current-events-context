    importance: 5
    headline: "Clash between Chadian army and MPRD rebels in Korbol kills six"
    summary: >
      Fighting broke out on the morning of January 13 in the Korbol area of
      Moyen-Chari in southern Chad between the army and fighters that news reporting
      identified as the Movement for Peace, Reconstruction and Development (MPRD).
      The army said three soldiers were killed and 10 wounded; MPRD leader Luc Beyam
      Bebha said three of the group's fighters were killed and two wounded. The two
      sides described the opposing force differently: the army referred to armed
      bandits, while the MPRD identified its own fighters and losses.
    key_data:
      - label: "Killed"
        value: "6 (3 soldiers, 3 MPRD fighters, per the respective sides)"
