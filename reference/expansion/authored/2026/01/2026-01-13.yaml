    topics:
      - "2025–2026 Iranian protests"
      - "2026 Iran massacres"
    importance: 9
    headline: "Iranian official puts protest death toll at about 2,000 as UN condemns crackdown"
    summary: >
      An Iranian official told Reuters that about 2,000 people, including security
      personnel, had been killed during the nationwide protests, blaming "terrorists"
      for the deaths and giving no breakdown between protesters and security forces.
      The U.S.-based rights group HRAI separately reported at least 2,000 deaths,
      while activist sources cited on the Wikipedia portal put the crackdown's toll at
      12,000 to 20,000. The UN human rights chief, Volker Türk, condemned the violence
      against protesters and urged an end to "violent repression", with his office
      citing its own reports of hundreds killed. Some Iranians were able to make
      international phone calls again for the first time in days, but internet access
      remained restricted.
    key_data:
      - label: "Toll given by an Iranian official"
        value: "About 2,000 dead, including security personnel"
        citation_refs: [1]
      - label: "HRAI reported toll"
        value: "At least 2,000 killed"
        citation_refs: [34]
      - label: "Activist-source estimate on the portal"
        value: "12,000 to 20,000 killed"
        citation_refs: [34]
      - label: "UN human rights office account"
        value: "Hundreds killed, based on its own sources"
        citation_refs: [2]
    details:
      what_happened:
        - "An Iranian official gave Reuters an approximate toll of 2,000 dead, without distinguishing protesters from security personnel, and blamed 'terrorists' for the deaths."
        - "HRAI reported that at least 2,000 people had been killed during the nationwide protests, per the Wikipedia portal citing CBS News and AP."
        - "UN High Commissioner for Human Rights Volker Türk condemned mounting violence against peaceful demonstrators and called for accountability."
        - "Some mobile calls abroad resumed after days of communications restrictions; internet access stayed restricted."
      why_it_matters:
        - "The acknowledgment by an Iranian official sharply raised the publicly stated toll compared with the roughly 500 to 544 deaths recorded by HRANA-based counts on January 11 and 12."
        - "The communications blackout continued to prevent independent verification of any figure."
      uncertainty_notes:
        - "The figures are differently sourced and not reconciled: about 2,000 from an Iranian official (Reuters); at least 2,000 from HRAI (portal, citing CBS News and AP); hundreds from the UN human rights office; 12,000 to 20,000 from activist sources (portal). AP's January 13 headline reported activists saying the toll surpassed 2,500."
        - "casualty_report records 2,000 because an Iranian official and HRAI independently gave that figure; it is not a verified final toll."
        - "The Reuters account gives no breakdown between protesters and security personnel."
