        citation_refs: [11]
    details:
      what_happened:
        - "Nielsen said Greenland would choose Denmark if required to choose between it and the United States."
        - "He rejected U.S. ownership and governance of Greenland."
        - "The statement preceded planned talks involving the Danish and Greenlandic foreign ministers and senior U.S. officials."
      why_it_matters:
        - "The direct statement from Greenland's head of government set out the territory's position ahead of talks affecting relations within NATO."
