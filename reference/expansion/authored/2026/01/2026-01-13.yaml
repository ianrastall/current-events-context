  - id: "evt-2026-01-13-003"
    category: "Politics and elections"
    subcategory: "Communications shutdown"
    topics:
      - "2026 Ugandan general election"
      - "Human rights in Uganda"
    importance: 7
    headline: "Uganda shuts down public internet two days before general election"
    summary: >
      The Uganda Communications Commission directed providers to suspend public
      internet access and selected mobile services from 6 p.m. on January 13, two days
      before presidential and parliamentary elections, citing misinformation,
      electoral fraud and incitement. A Reuters witness saw access go out at the
      stated time. The directive also halted new SIM-card sales and registration and
      outbound data roaming. Authorities separately ordered two local rights
      organizations to stop work, adding to concern about scrutiny of an election in
      which President Yoweri Museveni is seeking another term.
    key_data:
      - label: "Shutdown start"
        value: "6 p.m. local time, January 13"
        citation_refs: [6, 7]
      - label: "Days before polling"
        value: "2"
        citation_refs: [6]
      - label: "Rights groups ordered to halt work"
        value: "2"
        citation_refs: [6]
    details:
      what_happened:
        - "The Uganda Communications Commission ordered providers to suspend public internet access from 6 p.m. local time."
        - "The directive also covered new SIM-card sales and registration and outbound data roaming."
        - "A Reuters witness confirmed internet access went out at 6 p.m."
        - "Authorities ordered two local rights groups to cease operations."
      why_it_matters:
        - "The restrictions limited public communication and independent monitoring immediately before voting."
        - "The measure followed an earlier ban on live broadcasts of protests ahead of the vote."
      uncertainty_notes:
