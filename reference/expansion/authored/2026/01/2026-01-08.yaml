        value: "52-47"
        citation_refs: [11]
      - label: "Deaths reported by Venezuela's interior minister"
        value: "100"
        citation_refs: [12, 53]
      - label: "Venezuelan military dead listed"
        value: "23"
        citation_refs: [12, 53]
      - label: "Cuban personnel killed"
        value: "32"
        citation_refs: [12, 53]
    details:
      what_happened:
        - "The Senate voted 52-47 to advance a war-powers resolution restricting further U.S. military action in Venezuela without congressional authorization."
        - "Five Republicans joined Democrats in the procedural vote."
        - "Interior Minister Diosdado Cabello said 100 people died in the U.S. attack."
        - "Cabello said Cilia Flores suffered a head injury and Maduro a leg injury during the raid."
        - "Reuters reported the measure still faced House passage and a likely veto."
      why_it_matters:
        - "The vote is a rare congressional rebuke of the president over the Venezuela operation and raises the question of who controls further escalation."
        - "The higher death toll, including Cuban personnel, increases the diplomatic stakes of the raid."
      uncertainty_notes:
        - "The death toll has risen across reports: 80 on January 4 and 6 and 100 on January 8. The casualty_report uses the latest figure of 100."
