    importance: 8
    headline: "U.S. Senate advances Venezuela war-powers curb as Caracas puts raid death toll at 100"
    summary: >
      The U.S. Senate voted 52 to 47 to advance a war-powers resolution that would bar
      further U.S. military action against Venezuela without congressional
      authorization, with five Republicans joining Democrats. Venezuela's interior
      minister, Diosdado Cabello, said 100 people died in the U.S. attack that removed
      Nicolás Maduro, and said Cilia Flores suffered a head injury and Maduro a leg
      injury. Reuters reported that Venezuela's army listed 23 of its dead and that Cuba
      said 32 of its military and intelligence personnel were killed.
    key_data:
