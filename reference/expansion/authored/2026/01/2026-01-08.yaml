    importance: 7
    headline: "Russian strikes black out south-eastern Ukraine and hit apartment blocks in Kryvyi Rih"
    summary: >
      Russian drone attacks plunged two south-eastern Ukrainian regions into near-total
      blackout during a cold snap, and a missile attack on Kryvyi Rih struck apartment
      buildings, killing one person and injuring 24, including six children. Reuters
      reported that 29 apartment buildings were damaged in Kryvyi Rih, that more than
      70,000 people there remained without power, and that President Volodymyr
      Zelenskiy and the U.S. Embassy in Kyiv warned of a possible further large-scale
      air attack.
