analytical_overview: >
  January 8, 2026 brought the first institutional pushback in Washington against the
  Venezuela operation: the U.S. Senate advanced a war-powers resolution by 52 to 47
  as Venezuela's interior minister put the death toll from the raid that seized
  Nicolás Maduro at 100. The House passed an extension of Affordable Care Act
  subsidies over its leadership's objections, European officials reacted to the U.S.
  exit from the UN climate treaty and discussed a response to U.S. talk of acquiring
  Greenland, and a reported Chinese hack of House committee staff emails drew a denial
  from Beijing. China also said its dual-use export ban on Japan would affect only
  military users, while Japan formally protested.

  Conflict and unrest intensified in several places. Fighting in Aleppo between Syrian
  government forces and the SDF displaced more than 140,000 people before the
  government declared a ceasefire and captured the Ashrafieh neighbourhood; Iran
  experienced a nationwide internet blackout as protests continued; Israeli strikes in
  Gaza killed at least 11 to 13 people after a failed rocket launch; and Russian
  strikes caused major blackouts in south-eastern Ukraine. In Yemen, government forces
  took Aden airport as STC forces collapsed. Disasters included catastrophic bushfire
  warnings in Victoria, Patagonian wildfires, a landfill collapse in Cebu, and a
  revised toll of 39 dead from the New Year's Eve migrant boat capsizing off Gambia.

