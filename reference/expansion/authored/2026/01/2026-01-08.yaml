        - "A discharge petition forced the vote over the objections of Speaker Mike Johnson."
        - "The bill moved to the Senate, where negotiators were considering shorter or narrower extensions."
      why_it_matters:
        - "The vote shows internal Republican division over health-care costs and leadership control of the floor."
