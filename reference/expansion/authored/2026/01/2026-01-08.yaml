    headline: "U.S. House passes ACA subsidy extension 230-196 after discharge petition"
    summary: >
      The U.S. House of Representatives voted 230 to 196 to extend expired Affordable
      Care Act health insurance subsidies, with 17 Republicans joining Democrats. The
      vote was forced by a discharge petition that bypassed objections from Speaker
      Mike Johnson. Reuters reported the bill faced uncertain prospects in the Senate,
      which had previously rejected similar legislation and was weighing narrower
      options.
