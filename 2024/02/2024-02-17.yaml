wikipedia:
  categories:
    Uncategorized:
    - Russian invasion of Ukraine
    - Battle of Avdiivka
    - Commander-in-Chief Oleksandr Syrskyi announces the full withdrawal of Ukrainian
      forces from Avdiivka, following months of heavy fighting and Russian attempts
      to capture the city. (The Kyiv Independent)
    - Red Sea crisis
    - The United States military destroys a Houthi unmanned underwater vehicle and
      a Houthi unmanned surface vehicle while also conducting three strikes against
      Houthi anti-ship cruise missiles. (CNN)
    - 2024 Virudhunagar explosions
    - Ten people are killed and seven are injured after an explosion at a fire cracker
      factory in Tamil Nadu, India. (Deccan Herald)
    - Twelve people are killed when a man opens fire on his relatives during a family
      dispute at a village in Faryab County, Kerman province, Iran. (AP)
    - Four people are killed in a shooting at a car wash in Birmingham, Alabama, United
      States. (CBS News)
