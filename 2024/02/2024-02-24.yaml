wikipedia:
  categories:
    Uncategorized:
    - 2024 Iran–Israel conflict, Israel–Hezbollah clashes
    - Hezbollah launches rockets on Arab el Aramsha, Hanita, Shebaa Farms and Kiryat
      Shmona in northern Israel and the Golan Heights. (Jerusalem Post)
    - IDF launches strikes on Hezbollah outposts in Rab El Thalathine, Ayta ash Shab,
      Blida and on Redwans outposts in Baraachit, Jabal Blat and Rachaya Al Foukhar.(Jerusalem
      Post)
    - Three Mobondo militiamen are arrested in the village of Kulungu, near Kwilu,
      Democratic Republic of the Congo. (Actualite)
    - Environmental impact of the Red Sea crisis
    - A large oil slick from the Houthi missile-damaged cargo ship forms in the Gulf
      of Aden, threatening to become an environmental disaster. (Times of India)
    - In Tanzania, 25 people are killed and 21 more injured on a road linking Arusha
      to Namanga, after a truck driver lost control of his vehicle causing a collision
      with three other vehicles. (Barron's)
    - Twenty-three people are killed and nine are injured after a tractor carrying
      a wagon loaded with Hindu pilgrims, overturned and fell into a pond in Kasganj
      District, Uttar Pradesh, India. (AP News)
    - 2024 Republican Party presidential primaries
    - 2024 South Carolina Republican presidential primary
    - Donald Trump wins the 2024 South Carolina Republican presidential primary. (Fox
      News) (CNN)
    - Nigerien crisis
    - At a summit in Abuja, Nigeria, ECOWAS lifts sanctions on Niger, but continues
      to demand the release of deposed president Mohamed Bazoum and his family. (Al
      Jazeera)
