wikipedia:
  categories:
    Uncategorized:
    - Middle Eastern crisis
    - Israeli–Palestinian conflict
    - Israel–Hamas war
    - At least 40 people are killed and more than 100 others are injured in Israeli
      airstrikes against residential buildings in Deir al-Balah in the central Gaza
      Strip. (Al Jazeera)
    - One Israeli is killed and 11 others are injured in an automatic weapons shooting
      attack by three Palestinians from Bethlehem near the az-Za'ayyem checkpoint
      on Route 1, close to the Israeli settlement of Ma'ale Adumim in the occupied
      West Bank. Security forces and armed civilians kill two gunmen at the scene,
      while the third is captured after being neutralized following a chase. (The
      National News) (Times of Israel)
    - Israel–Hezbollah conflict
    - An anti-tank missile launched from Lebanon strikes a home in Yuval in northern
      Israel, causing a fire but no injuries. (Times of Israel)
    - Two Hezbollah militants are killed and three others are injured in an Israeli
      drone strike targeting an apartment building in Kfar Remen, southern Lebanon.
      (Times of Israel)
    - Red Sea crisis
    - A Palau-flagged cargo ship, the MV Islander, is set on fire in the Gulf of Aden
      after being hit by two anti-ship missiles fired by Yemen's Houthi movement.
      One sailor is wounded, but the vessel continues on its course. (AP)
    - Sudanese civil war
    - Famine in Sudan
    - The World Food Programme releases a report stating that more than 95% of Sudan's
      population cannot afford a meal a day. (Barron's)
    - 2024 Guangzhou bridge collapse
    - Five people are killed when a barge collides with the in Guangzhou, China. (Reuters)
      (The New York Times)
    - 2024 València residential complex fire
    - Nine people are killed, 15 others are injured and one is missing during a fire
      at a 14-storey residential building in Valencia, Spain. (AP)
    - At least eight people are killed during floods and landslides in the Brazilian
      state of Rio de Janeiro. (AP)
    - Murder of Kathleen Jo Henry
    - An Alaskan jury finds Brian Smith guilty of the murder of Kathleen Jo Henry
      and Veronica Abouchuk. (ABC News)
    - A court in Panama orders the arrest of former president Ricardo Martinelli,
      who is under protection of the Nicaraguan embassy in Panama City. (ABC News)
    - A majority of citizens of Westlock voted to ban public display of pride flags.
    - 2024 AT&T outage
    - More than 71,000 customers of US mobile carrier AT&T experience network outages.
      Some Verizon and T-Mobile users also report outages. (CNN) (NBC News)
    - Intuitive Machines Nova-C lunar lander Odysseus successfully touches down on
      the Moon, near the lunar south pole, making it the first private company to
      successfully land a spacecraft on the surface of the Moon. (BBC News)
