wikipedia:
  categories:
    Uncategorized:
    - 2024 missile strikes in Yemen
    - The U.S. Navy conducts additional strikes targeting Houthi-held territory in
      Yemen. (Reuters)
    - Kurdish–Turkish conflict
    - Turkey launches airstrikes against Kurdish militants in Iraq and Syria, a day
      after nine Turkish soldiers were killed in a shooting in Iraq. (AP)
    - 2024 El Carmen de Atrato landslide
    - A landslide in El Carmen de Atrato, Chocó, Colombia, kills 37 people and injures
      at least 35 others. (AP)
    - At least 21 miners are killed and several others are trapped following a collapse
      at a gold mine in Simiyu Region, Tanzania. (Xinhua)
    - 2024 Taiwanese general election
    - 2024 Taiwanese legislative election
    - The opposition Nationalist Party of China wins the most seats in the Legislative
      Yuan but no party receives an absolute majority. (Taiwan News)
    - 2024 Taiwanese presidential election
    - Vice President Lai Ching-te of the ruling Democratic Progressive Party is elected
      president of Taiwan. (The Guardian)
    - Gaza war protests
    - Gaza war protests in the United States
    - A protest is held in Washington, DC in response to the Gaza war. Protesters
      call for a permanent ceasefire in Gaza and for an end to US aid to Israel. (The
      Washington Post)
