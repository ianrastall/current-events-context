wikipedia:
  categories:
    Uncategorized:
    - Congolese Civil War
    - Ituri Conflict
    - CODECO militiamen attack Zaire militia-controlled Pluto, Democratic Republic
      of the Congo, displacing the population. After four hours of fighting, the Armed
      Forces of the Democratic Republic of the Congo (FARDC) intervene. Thirteen Zaire,
      seven CODECO, and six FARDC soldiers are killed. (Radio Okapi)
    - Western DR Congo clashes
    - The FARDC repel an attack by Mobondo militiamen on the village of Kinsele, Kwamouth,
      Democratic Republic of the Congo. 42 Mobondo militiamen, 9 FARDC soldiers, and
      a civilian are killed. (Radio Okapi) (Radio Okapi)
    - Gaza war
    - 13 July 2024 al-Mawasi attack
    - At least ninety people are killed and over three hundred others are wounded
      in a strike on the al-Mawasi humanitarian zone, in what the IDF states was a
      targeted strike against Al-Qassam Brigades leader Mohammed Deif and high-commander
      Rafa’a Salameh. (AP) (Al Jazeera) (The Times of Israel)
    - July 2024 al-Shati refugee camp attack
    - At least twenty people are killed by Israeli military shelling on a prayer hall
      in the al-Shati refugee camp during Zuhr prayer. (Al Jazeera)
    - Russo-Ukrainian war
    - Kharkiv strikes
    - Two people are killed and twenty-five people, including two children, are injured
      in a Russian double tap strike on the village of Budy, Kharkiv Oblast, Ukraine.
      (Reuters)
    - Sudanese civil war
    - Kordofan campaign
    - Around 23 civilians are killed during a Rapid Support Forces attack on a convoy
      traveling from Fanquqa to Um Sumaima in Sudan's North Kordofan state. (Sudan
      Tribune)
    - Attempted assassination of Donald Trump
    - Former U.S. President and current presidential candidate Donald Trump is injured
      in an assassination attempt at a campaign rally in Butler County, Pennsylvania,
      United States, with his condition later reported as "fine" by a spokesperson.
      The suspect was shot dead after two audience members were critically injured
      and one killed in the shooting.(AP) (The Guardian)
    - Somali Civil War
    - At least eight people are killed and 21 others are injured in a shootout between
      security forces and inmates at a prison in Mogadishu, Somalia, in an attempted
      prison break. The prisoners who attempted escape are allegedly al-Shabaab members.
      (Al Jazeera)
    - Australia–Russia relations
    - Russia accuses Australia of inciting "anti-Russian paranoia" after Australia
      charges a Russian-born Australian couple with espionage. (Reuters)
    - Four people are killed and nine injured after a mass shooting at a nightclub
      in Birmingham, Alabama, United States. (CNN)
    - Three people are killed and four injured after a mass shooting at a birthday
      party in Espinasse-Vozelle, Auvergne-Rhône-Alpes, France. The perpetrator kills
      himself. (France 3 Régions)
    - The Guardia di Finanza frees 33 Indian farm workers from exploitative conditions
      in Verona, Veneto, Italy, and seizes nearly €500,000 (US$545,000) from two Indian
      individuals accused of charging workers €17,000 ($18,500) each for permits.
      (AP)
    - 2024 Wimbledon Championships
    - In tennis, Barbora Krejčíková defeats Jasmine Paolini 6–2, 2–6, 6–4, in the
      Women's singles final to win her first Wimbledon title and her second overall
      Grand Slam title. (Reuters) (Eurosport)
