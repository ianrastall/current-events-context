wikipedia:
  categories:
    Uncategorized:
    - Russo-Ukrainian War
    - Russia–Ukraine peace negotiations, China and the Russo-Ukrainian War
    - China unveils a 12-point position paper on ending the war in Ukraine, ahead
      of an expected speech by President Xi Jinping on the conflict. Ukraine says
      that it hopes China can urge Russia to withdraw its troops in response to the
      paper. (The Guardian)
    - Military aid to Ukraine during the Russo-Ukrainian war
    - Poland delivers the first Leopard 2 main battle tanks to Ukraine. (DW)
    - Mali War
    - Twelve people are killed in a mass shooting by insurgents in a village in Bankass
      Cercle, Mopti Region, Mali. (Reuters)
    - 2023 Turkey–Syria earthquake
    - The death toll of the earthquake in Turkey and Syria surpasses 50,000. (Reuters)
    - Global spread of H5N1
    - Cambodia's Ministry of Health reports 12 more suspected cases of H5N1 influenza
      in Prey Veng province following the death of a 12-year-old girl, the first confirmed
      death from the virus since 2014. (Khmer Times)
    - Protests against the Russo-Ukrainian war
    - Anti-war protests in Russia
    - Anti-war activists in Russia are detained as protesters mark the first anniversary
      of the Russian invasion of Ukraine. (The Moscow Times)
    - Protests occur in countries around the world to mark the anniversary of the
      invasion of Ukraine. Major world landmarks are also lit up to mark the anniversary.
      (Moneycontrol) (Greek City Times) (Barron's) (People.com)
    - 2023 Djiboutian parliamentary election
    - The ruling Union for the Presidential Majority party wins the election to the
      National Assembly. (Barron's)
    - Gambian president Adama Barrow appoints Muhammad B.S. Jallow as the country's
      new vice-president after the previous vice-president Badara Joof died last month
      in India. (Reuters)
