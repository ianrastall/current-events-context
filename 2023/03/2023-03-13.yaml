    Uncategorized:
    - 2022–23 South-West Indian Ocean cyclone season
    - Cyclone Freddy
    - Cyclone Freddy kills at least 99 people in Malawi, including 85 people in Blantyre.
      It is the longest-lived tropical cyclone on record, according to the WMO, having
      formed on February 4. (The Guardian)
    - Thirty-four people are killed after a boat carrying migrants from Madagascar
      to the island of Mayotte sinks. (Arab News)
    - One person is killed and three others are injured by an apparent gas explosion
      in Swansea, Wales, United Kingdom. (BBC News)
    - 2023 Amqui truck attack
    - Two people are killed and nine others are injured when a truck strikes a group
      of pedestrians in Amqui, Quebec, Canada. (CBS News)
    - 2023 Tokelauan general election
    - Kerisiano Kalolo becomes the new Head of Government of Tokelau. (RNZ)
